name: Complex Workflow Test
description: Test workflow with mixed parallel and dependent jobs

jobs:
  init:
    name: Initialize System
    steps:
      - name: Setup
        run: echo "Initializing"

  prepare_a:
    name: Prepare Component A
    needs: init
    steps:
      - name: Prepare A
        run: echo "Preparing A"

  prepare_b:
    name: Prepare Component B
    needs: init
    steps:
      - name: Prepare B
        run: echo "Preparing B"

  build_a:
    name: Build Component A
    needs: prepare_a
    steps:
      - name: Build A
        run: echo "Building A"

  build_b:
    name: Build Component B
    needs: prepare_b
    steps:
      - name: Build B
        run: echo "Building B"

  test_a:
    name: Test Component A
    needs: build_a
    steps:
      - name: Test A
        run: echo "Testing A"

  test_b:
    name: Test Component B
    needs: build_b
    steps:
      - name: Test B
        run: echo "Testing B"

  integrate:
    name: Integration Test
    needs: [test_a, test_b]
    steps:
      - name: Integrate
        run: echo "Running integration tests"

  deploy:
    name: Deploy System
    needs: integrate
    steps:
      - name: Deploy
        run: echo "Deploying system"
