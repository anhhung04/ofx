name: ToolConfig Examples
description: Comprehensive examples of ToolConfig usage with check, install, and post_install

defaults:
  run:
    shell: /bin/bash

tools:
  # Example 1: Full ToolConfig with all fields
  example_full:
    install: "printf '#!/bin/bash\\necho full example' > ${{ tools_bin_dir }}/example_full && chmod +x ${{ tools_bin_dir }}/example_full"
    check: "test -x ${{ tools_bin_dir }}/example_full"
    post_install: "echo 'Full example tool installed and configured'"

  # Example 2: ToolConfig with only install and check
  example_minimal:
    install: "printf '#!/bin/bash\\necho minimal example' > ${{ tools_bin_dir }}/example_minimal && chmod +x ${{ tools_bin_dir }}/example_minimal"
    check: "which example_minimal"

  # Example 3: Using template functions in ToolConfig
  go_tool:
    install: ${{ go_install('github.com/projectdiscovery/subfinder/v2/cmd/subfinder') }}
    check: "which subfinder"
    post_install: "subfinder -version || true"

  # Example 4: Python tool with uv_install
  python_tool:
    install: ${{ uv_install('httpie') }}
    check: "which http"
    post_install: "http --version"

  # Example 5: Tool with custom check command (checking version)
  custom_check:
    install: "printf '#!/bin/bash\\necho \"v1.0.0\"' > ${{ tools_bin_dir }}/custom_check && chmod +x ${{ tools_bin_dir }}/custom_check"
    check: "${{ tools_bin_dir }}/custom_check | grep -q 'v1.0.0'"
    post_install: "echo 'Tool version validated'"

  # Example 6: Tool with complex post_install (config file creation)
  with_config:
    install: "printf '#!/bin/bash\\necho configured tool' > ${{ tools_bin_dir }}/with_config && chmod +x ${{ tools_bin_dir }}/with_config"
    check: "test -x ${{ tools_bin_dir }}/with_config && test -f ${{ tools_dir }}/config.json"
    post_install: 'echo ''{"enabled": true}'' > ${{ tools_dir }}/config.json && echo ''Config created'''

  # Example 7: Backward compatible - simple string (no check, no post_install)
  simple_tool: "printf '#!/bin/bash\\necho simple' > ${{ tools_bin_dir }}/simple_tool && chmod +x ${{ tools_bin_dir }}/simple_tool"

  # Example 8: Tool that downloads from URL
  download_tool:
    install: "curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 -o /tmp/get-helm.sh && chmod +x /tmp/get-helm.sh"
    check: "test -x /tmp/get-helm.sh"
    post_install: "echo 'Helm installer ready at /tmp/get-helm.sh'"

jobs:
  test:
    name: Test All Tool Configurations
    steps:
      - name: Show tool locations
        run: |
          echo "TOOLS_DIR: ${{ tools_dir }}"
          echo "TOOLS_BIN_DIR: ${{ tools_bin_dir }}"
          ls -lh ${{ tools_bin_dir }} || echo "Tools directory empty"

      - name: Test installed tools
        run: |
          echo "Testing example_full..."
          ${{ tools_bin_dir }}/example_full

          echo "Testing example_minimal..."
          ${{ tools_bin_dir }}/example_minimal

          echo "Testing simple_tool..."
          ${{ tools_bin_dir }}/simple_tool

          echo "Testing custom_check..."
          ${{ tools_bin_dir }}/custom_check

          echo "Testing with_config..."
          ${{ tools_bin_dir }}/with_config
          cat ${{ tools_dir }}/config.json

      - name: Verify checks work on re-run
        run: |
          echo "All tools should be detected on next run!"
          echo "Run this workflow again to see tools skipped (already installed)"
