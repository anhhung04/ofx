# yaml-language-server: $schema=workflow.schema.json
name: Durable Test

defaults:
  durable:
    enabled: true
    resume: true
    backend: file

jobs:
  durable_job:
    steps:
      - name: Write durable marker
        module: shell
        with:
          cmd: printf "run\n" >> {{ ctx.output_path }}/durable.txt
