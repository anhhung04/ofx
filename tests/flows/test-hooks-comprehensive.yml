name: Comprehensive Hooks Test
description: Demonstrates all hook types and auto-resolved arguments

hooks:
  pre_run: |
    def hook(model):
        print(f"[WORKFLOW PRE_RUN] Starting: {model.name}")

  on_success: |
    def hook(model):
        print(f"[WORKFLOW ON_SUCCESS] Completed successfully: {model.name}")

jobs:
  test-command-hooks:
    name: Test Command Hooks
    hooks:
      pre_run: |
        def hook(inputs):
            print(f"[JOB PRE_RUN] Command job starting with inputs: {inputs}")
            inputs['job_data'] = 'from_command_job'
            return inputs

    steps:
      - name: Command Step
        hooks:
          before_step: |
            def hook(command, run, inputs):
                print(f"[BEFORE_STEP] Command type")
                print(f"  - command arg: {command}")
                print(f"  - run arg: {run}")
                print(f"  - inputs: {inputs}")

          after_step: |
            def hook(output, command):
                print(f"[AFTER_STEP] Command executed: {command}")
                print(f"  - stdout: {output.get('stdout', '')}")

        run: echo "This is a command"
        log_stdout: true

  test-script-hooks:
    name: Test Script Hooks

    steps:
      - name: Script Step
        hooks:
          before_step: |
            def hook(run, inputs):
                print(f"[BEFORE_STEP] Run/Command type")
                print(f"  - run arg: {run[:30]}...")

          after_step: |
            def hook(output):
                print(f"[AFTER_STEP] Command completed")
                print(f"  - stdout: {output.get('stdout', '')}")

        run: |
          echo "This is a multi-line command"
          echo "Second line"
        log_stdout: true

  test-iter-hook:
    name: Test Iteration Hook
    hooks:
      on_iter_step: |
        def hook(step_index, model):
            print(f"[ON_ITER_STEP] Processing step {step_index} in job '{model.name}'")

    steps:
      - name: Step 1
        run: echo "First step"

      - name: Step 2
        run: echo "Second step"

      - name: Step 3
        run: echo "Third step"
