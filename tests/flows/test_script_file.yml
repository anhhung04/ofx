# yaml-language-server: $schema=workflow.schema.json
name: Script File Example
description: Demonstrates using script_file and run_file features

defaults:
  run:
    shell: /bin/bash
    working_directory: .

jobs:
  test-script-file:
    name: Test Script File Feature
    steps:
      - name: Run Python script from default scripts directory
        script_file: example_script.py
        log_stdout: true

      - name: Run inline Python script
        script: |
          from ofx.settings import settings
          print(f"Inline script in {settings.app_branding}")
        log_stdout: true

      - name: Create temporary script
        run: |
          cat > /tmp/test_script.py << 'EOF'
          #!/usr/bin/env python3
          import sys
          from ofx.api.strings import generate_random_string
          print(f"Random string: {generate_random_string(16)}")
          EOF

      - name: Run script from absolute path
        script_file: /tmp/test_script.py
        log_stdout: true

      - name: Create bash script
        run: |
          cat > /tmp/test_bash.sh << 'EOF'
          #!/bin/bash
          echo "Hello from bash script"
          echo "Current directory: $(pwd)"
          echo "User: $(whoami)"
          EOF

      - name: Run bash script with shebang
        run_file: /tmp/test_bash.sh
        log_stdout: true

      - name: Cleanup
        run: rm -f /tmp/test_script.py /tmp/test_bash.sh
