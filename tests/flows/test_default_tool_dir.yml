name: Test Default Tool Directory
description: Test that tools are installed to TOOLS_BIN_DIR by default

defaults:
  run:
    shell: /bin/bash

tools:
  # Tool installed to TOOLS_BIN_DIR with check and post_install
  default_tool:
    install: "printf '#!/bin/bash\\necho default tool works' > ${{ tools_bin_dir }}/default_tool && chmod +x ${{ tools_bin_dir }}/default_tool"
    check: "test -x ${{ tools_bin_dir }}/default_tool"
    post_install: "echo 'Default tool installed to ${{ tools_bin_dir }}'"

  # Tool installed to custom location
  custom_tool:
    install: "mkdir -p /tmp/custom_tools && printf '#!/bin/bash\\necho custom tool works' > /tmp/custom_tools/custom_tool && chmod +x /tmp/custom_tools/custom_tool"
    check: "test -x /tmp/custom_tools/custom_tool"
    post_install: "echo 'Custom tool ready at /tmp/custom_tools/custom_tool'"

jobs:
  test:
    name: Test Tools
    steps:
      - name: Verify TOOLS_BIN_DIR
        run: |
          echo "TOOLS_BIN_DIR: ${{ tools_bin_dir }}"
          echo "TOOLS_DIR: ${{ tools_dir }}"
          ls -la ${{ tools_bin_dir }}/

      - name: Test Default Tool
        run: |
          which default_tool || echo "default_tool not in PATH yet"
          ${{ tools_bin_dir }}/default_tool

      - name: Test Custom Tool
        run: |
          /tmp/custom_tools/custom_tool
