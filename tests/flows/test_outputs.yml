name: Test OFX_OUTPUTS Feature
description: Demonstrates capturing custom outputs from commands

jobs:
  set_outputs:
    name: Set Custom Outputs
    outputs:
      build_number: "{{ steps.0.outputs.build_number }}"
      commit_sha: "{{ steps.0.outputs.commit_sha }}"
      status: "{{ steps.0.outputs.status }}"
    steps:
      - name: Capture basic outputs
        run: |
          echo "build_number=12345" >> $OFX_OUTPUTS
          echo "commit_sha=abc123def456" >> $OFX_OUTPUTS
          echo "status=success" >> $OFX_OUTPUTS

  use_outputs:
    name: Use Outputs from Previous Job
    needs: [set_outputs]
    steps:
      - name: Display captured outputs
        run: |
          echo "Build: {{ jobs.set_outputs.outputs.build_number }}"
          echo "Commit: {{ jobs.set_outputs.outputs.commit_sha }}"
          echo "Status: {{ jobs.set_outputs.outputs.status }}"

  generate_metadata:
    name: Generate Build Metadata
    outputs:
      timestamp: "{{ steps.0.outputs.timestamp }}"
      hostname: "{{ steps.0.outputs.hostname }}"
      user: "{{ steps.0.outputs.user }}"
      pwd: "{{ steps.0.outputs.pwd }}"
      json_data: "{{ steps.1.outputs.json_data }}"
    steps:
      - name: Create metadata
        run: |
          echo "timestamp=$(date +%Y%m%d_%H%M%S)" >> $OFX_OUTPUTS
          echo "hostname=$(hostname)" >> $OFX_OUTPUTS
          echo "user=$(whoami)" >> $OFX_OUTPUTS
          echo "pwd=$(pwd)" >> $OFX_OUTPUTS

      - name: Create JSON metadata
        run: |
          cat << 'EOF' >> $OFX_OUTPUTS
          json_data={"build": "success", "version": "1.0.0"}
          EOF

  validate_outputs:
    name: Validate Output Handling
    needs: [generate_metadata]
    steps:
      - name: Check metadata exists
        run: |
          echo "Timestamp: {{ jobs.generate_metadata.outputs.timestamp }}"
          echo "Host: {{ jobs.generate_metadata.outputs.hostname }}"
          echo "User: {{ jobs.generate_metadata.outputs.user }}"
          echo "Directory: {{ jobs.generate_metadata.outputs.pwd }}"

  python_outputs:
    name: Python Script Outputs
    outputs:
      target: "{{ steps['add-outputs-test'].outputs.target }}"
      count: "{{ steps['add-outputs-test'].outputs.count }}"
      hosts: "{{ steps['add-outputs-test'].outputs.hosts }}"
    steps:
      - name: add-outputs-test
        script: |
          add_outputs(target="10.0.0.1", count=3)
          add_outputs(hosts=["10.0.0.1", "10.0.0.2", "10.0.0.3"])
          print("Outputs written via add_outputs()")

  verify_python:
    name: Verify Python Outputs
    needs: [python_outputs]
    steps:
      - name: check-python-outputs
        run: |
          echo "Target: {{ jobs.python_outputs.outputs.target }}"
          echo "Count: {{ jobs.python_outputs.outputs.count }}"
          echo "Hosts: {{ jobs.python_outputs.outputs.hosts }}"
