name: Tool Installation Examples
description: Comprehensive examples of tool installation using template functions

defaults:
  run:
    shell: /bin/bash

tools:
  # Python tools using uv_install with ToolConfig
  ruff:
    install: { { uv_install('ruff') } }
    check: "test -x {{ tools_bin_dir }}/ruff"
    post_install: "ruff --version"

  black:
    install: { { uv_install('black') } }
    check: "test -x {{ tools_bin_dir }}/black"

  # Go tools using go_install
  golangci-lint:
    install:
      { { go_install('github.com/golangci/golangci-lint/cmd/golangci-lint') } }
    check: "test -x {{ tools_bin_dir }}/golangci-lint"

  # Rust tools using cargo_install (commented out - requires cargo)
  # ripgrep:
  #   install: {{ cargo_install('ripgrep') }}
  #   check: "test -x {{ tools_bin_dir }}/rg"

  # Node.js tools using npm_install (requires npm)
  # prettier:
  #   install: {{ npm_install('prettier') }}
  #   check: "test -x {{ tools_bin_dir }}/prettier"

  # Static binary download using static_install
  # hadolint:
  #   install: {{ static_install('https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64', 'hadolint') }}
  #   check: "which hadolint"

  # Custom installation with check and post_install
  custom_tool:
    install: "printf '#!/bin/bash\\necho Custom tool in {{ tools_bin_dir }}' > {{ tools_bin_dir }}/custom_tool && chmod +x {{ tools_bin_dir }}/custom_tool"
    check: "test -x {{ tools_bin_dir }}/custom_tool"
    post_install: "echo 'Custom tool is ready!'"

jobs:
  test-tools:
    name: Test Installed Tools
    steps:
      - name: Show tool locations
        run: |
          echo "TOOLS_DIR: {{ tools_dir }}"
          echo "TOOLS_BIN_DIR: {{ tools_bin_dir }}"
          echo "PATH: $PATH"
          echo ""
          echo "Tools directory contents:"
          ls -lh {{ tools_bin_dir }} || echo "Directory not found"

      - name: Test Python tools
        run: |
          echo "Testing ruff..."
          ruff --version || echo "ruff not available"

          echo "Testing black..."
          black --version || echo "black not available"

      - name: Test Go tools
        run: |
          echo "Testing golangci-lint..."
          golangci-lint --version || echo "golangci-lint not available"

      # - name: Test Rust tools
      #   run: |
      #     echo "Testing ripgrep..."
      #     rg --version || echo "ripgrep not available"

      # - name: Test Node tools
      #   run: |
      #     echo "Testing prettier..."
      #     prettier --version || echo "prettier not available"

      - name: Test custom tool
        run: |
          echo "Testing custom tool..."
          {{ tools_bin_dir }}/custom_tool

      - name: Use environment variable helper
        run: |
          echo "HOME from env helper: {{ env('HOME') }}"
          echo "USER from env helper: {{ env('USER', 'default-user') }}"
          echo "NONEXISTENT with default: {{ env('NONEXISTENT', 'default-value') }}"

      - name: Use file helpers
        run: |
          echo "test content" > /tmp/test_file.txt
          echo "File exists: {{ file_exists('/tmp/test_file.txt') }}"
          echo "File content: {{ file_read('/tmp/test_file.txt') }}"
