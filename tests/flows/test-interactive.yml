name: Interactive Step Demo
description: Demonstrates interactive mode in single-job stages

jobs:
  # This job is alone in its stage - interactive mode works!
  interactive_shell:
    steps:
      - name: Interactive Command
        run: |
          echo "Starting interactive test..."
          read -p "Enter your name: " name
          echo "Hello, $name!"
          echo "Interactive command completed"
        interactive: true
        timeout: 5
      
      - name: Normal Command
        run: echo "Back to normal execution"
  
  # This job depends on the first - also alone in its stage
  interactive_python:
    needs: interactive_shell
    steps:
      - name: Interactive Python Script
        run: |
          name = input("What's your favorite color? ")
          print(f"Nice! {name} is a great color!")
        language: python
        interactive: true
        timeout: 5
      
      - name: Show Result
        run: echo "Interactive session completed"

# Note: If you have multiple jobs in the same stage, 
# interactive mode will be automatically disabled to avoid conflicts
