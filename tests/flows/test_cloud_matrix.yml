name: Cloud Matrix/Fleet Test (schema only)
# This workflow validates YAML schema parsing for cloud+matrix and cloud+fleet.
# It cannot be executed without real cloud credentials, but validates model loading.

jobs:
  cloud-matrix:
    cloud:
      provider: static
      host: 127.0.0.1
    strategy:
      matrix:
        tool: [nmap, masscan]
        target: [10.0.0.0/24, 192.168.1.0/24]
      max-parallel: 2
    steps:
      - run: echo "Running {{ matrix.tool }} on {{ matrix.target }}"

  cloud-fleet:
    cloud:
      provider: static
      host: 127.0.0.1
    strategy:
      fleet:
        count: 3
        input: "10.0.0.1,10.0.0.2,10.0.0.3,10.0.0.4,10.0.0.5,10.0.0.6"
        distribution: chunk
    steps:
      - run: echo "Fleet index $REMOTE_FLEET_INDEX scanning from $REMOTE_FLEET_INPUT_FILE"

  cloud-matrix-fleet:
    cloud:
      provider: static
      host: 127.0.0.1
    strategy:
      matrix:
        tool: [nmap, nuclei]
      fleet:
        count: 2
        input: "10.0.0.1,10.0.0.2,10.0.0.3,10.0.0.4"
        distribution: round-robin
    steps:
      - run: echo "tool={{ matrix.tool }} fleet=$FLEET_INDEX"
