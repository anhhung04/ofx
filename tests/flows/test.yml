# yaml-language-server: $schema=workflow.schema.json
name: Test Flows

description: Flow tests for OFX CLI

jobs:
  test:
    name: Run Flow Tests
    steps:
      - name: Test Templates
        run: echo "${{ file_read('/etc/passwd')}}"

      - name: Test Command
        log_stdout: true
        run: |
          sleep 10
          echo "This is command test output"
  test2:
    name: Run Flow Tests in Subworkflow
    steps:
      - name: Run Flow Tests in Docker
        uses: subworkflow
