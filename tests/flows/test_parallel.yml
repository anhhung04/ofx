name: Parallel Execution Test
description: Test that jobs run in parallel

jobs:
  job1:
    name: Job 1 - 3 seconds
    steps:
      - name: Sleep 3 seconds
        log_stdout: true
        run: |
          echo "Job 1 starting at $(date +%T)"
          sleep 3
          echo "Job 1 finished at $(date +%T)"

  job2:
    name: Job 2 - 3 seconds
    steps:
      - name: Sleep 3 seconds
        log_stdout: true
        run: |
          echo "Job 2 starting at $(date +%T)"
          sleep 3
          echo "Job 2 finished at $(date +%T)"

  job3:
    name: Job 3 - 3 seconds
    steps:
      - name: Sleep 3 seconds
        log_stdout: true
        run: |
          echo "Job 3 starting at $(date +%T)"
          sleep 3
          echo "Job 3 finished at $(date +%T)"
