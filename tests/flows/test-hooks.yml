name: Test Hooks Workflow
description: Test workflow with hooks implementation

hooks:
  pre_run: |
    def hook(inputs, model):
        print(f"[PRE_RUN HOOK] Workflow: {model.name}, Inputs: {inputs}")
        # Modify inputs
        inputs['hook_modified'] = True
        return inputs

  post_run: |
    def hook(outputs, model):
        print(f"[POST_RUN HOOK] Workflow completed: {model.name}")
        outputs['workflow_hook_executed'] = True
        return outputs

jobs:
  test-hooks:
    name: Test Hooks Job
    hooks:
      pre_run: |
        def hook(inputs):
            print(f"[JOB PRE_RUN HOOK] Inputs: {inputs}")
            inputs['job_hook'] = 'executed'
            return inputs

      on_iter_step: |
        def hook(step_index, model):
            print(f"[ON_ITER_STEP HOOK] Processing step index: {step_index}")

      post_run: |
        def hook(outputs):
            print(f"[JOB POST_RUN HOOK] Job completed")
            outputs['job_completed'] = True
            return outputs

    steps:
      - name: Test Step with Hooks
        hooks:
          before_step: |
            def hook(command, run, inputs):
                print(f"[BEFORE_STEP HOOK] About to execute command: {command}")
                print(f"[BEFORE_STEP HOOK] Run field: {run}")
                print(f"[BEFORE_STEP HOOK] With inputs: {inputs}")

          after_step: |
            def hook(output, command):
                print(f"[AFTER_STEP HOOK] Command executed: {command}")
                print(f"[AFTER_STEP HOOK] Output: {output.get('stdout', '')[:50]}")
                output['hook_processed'] = True
                return output

        run: echo "Testing hooks system"
        log_stdout: true
