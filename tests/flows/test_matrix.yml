name: Test Matrix Strategy
description: Test workflow demonstrating matrix strategy features

jobs:
  # Basic matrix test
  basic_matrix:
    name: "Test {{ matrix.os }} - v{{ matrix.version }}"
    strategy:
      matrix:
        os: [linux, windows, macos]
        version: [1, 2, 3]
    steps:
      - name: Display matrix values
        run: |
          echo "Operating System: {{ matrix.os }}"
          echo "Version: {{ matrix.version }}"
          echo "Job completed successfully"

  # Matrix with max_parallel
  parallel_limited:
    name: "Limited Parallel {{ matrix.id }}"
    needs: basic_matrix
    strategy:
      max_parallel: 2
      matrix:
        id: [1, 2, 3, 4, 5]
    steps:
      - name: Simulate work
        run: |
          echo "Starting job {{ matrix.id }}"
          sleep 1
          echo "Finished job {{ matrix.id }}"

  # Matrix with exclude
  excluded_combinations:
    name: "Test {{ matrix.browser }} on {{ matrix.os }}"
    needs: parallel_limited
    strategy:
      matrix:
        browser: [chrome, firefox, safari]
        os: [ubuntu, macos, windows]
      exclude:
        - browser: safari
          os: ubuntu
        - browser: safari
          os: windows
    steps:
      - name: Run browser test
        run: echo "Testing {{ matrix.browser }} on {{ matrix.os }}"

  # Matrix with include
  included_combinations:
    name: "Build {{ matrix.platform }}"
    needs: excluded_combinations
    strategy:
      matrix:
        platform: [x64, arm64]
        include:
          - platform: riscv
            experimental: true
          - platform: powerpc
            experimental: true
    steps:
      - name: Build for platform
        run: |
          echo "Building for {{ matrix.platform }}"
          if [ "{{ matrix.experimental }}" = "true" ]; then
            echo "This is an experimental build"
          fi

  # Final summary job
  summary:
    name: Matrix Tests Summary
    needs:
      [
        basic_matrix,
        parallel_limited,
        excluded_combinations,
        included_combinations,
      ]
    steps:
      - name: Summary
        run: echo "All matrix strategy tests completed successfully!"
