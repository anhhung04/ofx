name: Test Tool Installation
description: Test flexible tool configuration

tools:
  # Simple string format (backward compatible)
  jq:
    install: "echo 'Installing jq (simulated)' && echo 'jq installed'"
    check: "echo 'jq 1.6'"
  
  # Tool with custom install directory
  custom_tool:
    install: "mkdir -p $INSTALL_DIR && echo 'tool installed' > $INSTALL_DIR/custom_tool && chmod +x $INSTALL_DIR/custom_tool"
    install_dir: "/tmp/custom_tools"
    check: "ls /tmp/custom_tools/custom_tool"
    post_install: "echo 'Post-install: Setting up configuration'"

jobs:
  test:
    name: Test Tools
    steps:
      - name: Verify Installation
        run: |
          echo "Tools are ready!"
          echo "PATH: $PATH"
