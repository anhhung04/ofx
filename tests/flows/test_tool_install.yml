name: Test Tool Installation
description: Test tool installation using template functions

defaults:
  run:
    shell: /bin/bash

tools:
  # Tool with full ToolConfig
  test_tool:
    install: "printf '#!/bin/bash\\necho test tool works' > ${{ tools_bin_dir }}/test_tool && chmod +x ${{ tools_bin_dir }}/test_tool"
    check: "test -x ${{ tools_bin_dir }}/test_tool"
    post_install: "echo 'test_tool installed successfully to ${{ tools_bin_dir }}'"

  # Tool with custom check and post-install
  custom_tool:
    install: "mkdir -p /tmp/custom_tools && printf '#!/bin/bash\\necho custom tool works' > /tmp/custom_tools/custom_tool && chmod +x /tmp/custom_tools/custom_tool"
    check: "test -x /tmp/custom_tools/custom_tool"
    post_install: "echo 'Custom tool setup complete'"

jobs:
  test:
    name: Test Tools
    steps:
      - name: Verify Installation
        run: |
          echo "Tools are ready!"
          echo "PATH: $PATH"
          echo "TOOLS_DIR: ${{ tools_dir }}"
          echo "TOOLS_BIN_DIR: ${{ tools_bin_dir }}"

      - name: Test test_tool
        run: |
          test_tool || echo "test_tool executed"

      - name: Test custom tool
        run: |
          /tmp/custom_tools/custom_tool
