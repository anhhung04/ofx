name: Task Integration Test
description: Tests all 10 task wrappers and data chaining between steps

jobs:
  port-scan:
    steps:
      - task: nmap
        name: nmap-scan
        with:
          target: "192.168.1.1"
          ports: "22,80,443"
          version_detection: true

      - task: naabu
        name: fast-port-scan
        with:
          target: "192.168.1.1"
          ports: "80,443,8080"
          rate: 1000

  web-recon:
    needs: [port-scan]
    steps:
      - task: httpx
        name: http-probe
        with:
          target: "192.168.1.1"
          tech_detect: true
          status_code: true

      - task: katana
        name: crawl
        with:
          target: "https://192.168.1.1"
          depth: 2

      - task: ffuf
        name: fuzz-dirs
        with:
          target: "https://192.168.1.1/FUZZ"
          wordlist: "/usr/share/wordlists/common.txt"
          threads: 50

      - task: feroxbuster
        name: content-discovery
        with:
          target: "https://192.168.1.1"
          wordlist: "/usr/share/wordlists/common.txt"
          depth: 2

  dns-recon:
    steps:
      - task: subfinder
        name: subdomain-enum
        with:
          target: "example.com"
          all: true

      - task: dnsx
        name: dns-resolve
        with:
          target: "example.com"
          a: true
          cname: true
          mx: true

  vuln-scan:
    needs: [web-recon]
    steps:
      - task: nuclei
        name: vuln-check
        with:
          target: "https://192.168.1.1"
          severity: "critical,high"

      - task: wafw00f
        name: waf-detect
        with:
          target: "https://192.168.1.1"

      # Data chaining: summarize results from previous steps
      - name: summary
        run: |
          echo "Vulnerabilities found: {{ vulns(steps[0].outputs.typed_outputs) | length }}"
          echo "WAFs detected: {{ tags(steps[1].outputs.typed_outputs) | length }}"
