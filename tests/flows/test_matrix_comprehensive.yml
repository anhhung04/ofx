name: Matrix Comprehensive Test
description: Comprehensive test covering all matrix strategy features

jobs:
  basic_matrix:
    name: Basic Matrix - {{ matrix.version }}
    strategy:
      matrix:
        version: [1, 2, 3]
    steps:
      - name: Test basic matrix
        run: echo "Testing version {{ matrix.version }}"

  multi_dimensional:
    name: Multi-dimensional - {{ matrix.os }}-{{ matrix.arch }}
    needs: basic_matrix
    strategy:
      matrix:
        os: [linux, macos, windows]
        arch: [amd64, arm64]
    steps:
      - name: Test multi-dimensional
        run: echo "Building for {{ matrix.os }} on {{ matrix.arch }}"

  with_exclude:
    name: With Exclude - {{ matrix.os }}-{{ matrix.browser }}
    needs: multi_dimensional
    strategy:
      matrix:
        os: [ubuntu, macos, windows]
        browser: [chrome, firefox, safari]
        exclude:
          - os: ubuntu
            browser: safari
          - os: windows
            browser: safari
    steps:
      - name: Test with exclude
        run: echo "Testing {{ matrix.browser }} on {{ matrix.os }}"

  with_include:
    name: With Include - {{ matrix.platform }}
    needs: with_exclude
    strategy:
      matrix:
        platform: [x86, x64]
        include:
          - platform: arm64
            experimental: true
          - platform: riscv
            experimental: true
    steps:
      - name: Test with include
        run: |
          echo "Platform: {{ matrix.platform }}"
          if [ "{{ matrix.experimental }}" = "true" ]; then
            echo "Experimental platform"
          fi

  max_parallel_limit:
    name: Max Parallel - {{ matrix.id }}
    needs: with_include
    strategy:
      max_parallel: 2
      matrix:
        id: [1, 2, 3, 4, 5]
    steps:
      - name: Test max parallel
        run: |
          echo "Running job {{ matrix.id }}"
          sleep 1

  complex_exclude_include:
    name: Complex Filter - {{ matrix.env }}-{{ matrix.version }}
    needs: max_parallel_limit
    strategy:
      matrix:
        env: [dev, staging, prod]
        version: ["1.0", "2.0", "3.0"]
        exclude:
          - env: prod
            version: "1.0"
          - env: prod
            version: "2.0"
        include:
          - env: canary
            version: "3.0"
            experimental: true
    steps:
      - name: Test complex filtering
        run: |
          echo "Environment: {{ matrix.env }}"
          echo "Version: {{ matrix.version }}"
          if [ ! -z "{{ matrix.experimental }}" ]; then
            echo "Experimental: {{ matrix.experimental }}"
          fi

  matrix_with_types:
    name: Matrix Types - {{ matrix.config }}
    needs: complex_exclude_include
    strategy:
      matrix:
        config: ['{"name": "dev", "port": 3000}', '{"name": "prod", "port": 8080}']
        debug: ["true", "false"]
        workers: [1, 2, 4]
    steps:
      - name: Test matrix types
        run: |
          echo "Config name: {{ matrix.config.name }}"
          echo "Config port: {{ matrix.config.port }}"
          echo "Debug enabled: {{ matrix.debug }}"
          echo "Workers: {{ matrix.workers }}"
          echo "Debug is boolean: $(python3 -c 'print(type({{ matrix.debug }}).__name__)')"

  matrix_in_env:
    name: Matrix in Env - {{ matrix.stage }}
    needs: matrix_with_types
    strategy:
      matrix:
        stage: [dev, qa, prod]
    env:
      STAGE: {{ matrix.stage }}
      API_URL: https://api.{{ matrix.stage }}.example.com
    steps:
      - name: Test matrix in env
        run: |
          echo "Stage from env: $STAGE"
          echo "API URL: $API_URL"
          [ "$STAGE" = "{{ matrix.stage }}" ] && echo "Environment variable matches matrix value"

  single_value_matrix:
    name: Single Value - {{ matrix.only }}
    needs: matrix_in_env
    strategy:
      matrix:
        only: [single]
    steps:
      - name: Test single value
        run: echo "Single matrix value: {{ matrix.only }}"

  three_dimensional:
    name: 3D Matrix - {{ matrix.cloud }}-{{ matrix.region }}-{{ matrix.tier }}
    needs: single_value_matrix
    strategy:
      max_parallel: 3
      matrix:
        cloud: [aws, gcp]
        region: [us-east, eu-west]
        tier: [free, pro]
        exclude:
          - cloud: gcp
            region: us-east
            tier: free
    steps:
      - name: Test 3D matrix
        run: echo "Deploying to {{ matrix.cloud }} {{ matrix.region }} ({{ matrix.tier }} tier)"

  matrix_fail_fast:
    name: Fail Fast - {{ matrix.task }}
    needs: three_dimensional
    strategy:
      fail_fast: true
      matrix:
        task: [task1, task2, task3]
    steps:
      - name: Test fail fast
        run: echo "Executing {{ matrix.task }}"

  verify_all_completed:
    name: Verify All Matrix Jobs
    needs: [basic_matrix, multi_dimensional, with_exclude, with_include, max_parallel_limit, complex_exclude_include, matrix_with_types, matrix_in_env, single_value_matrix, three_dimensional, matrix_fail_fast]
    steps:
      - name: Verify completion
        run: |
          echo "All matrix jobs completed successfully"
          echo "Jobs tested:"
          echo "  - Basic matrix (3 instances)"
          echo "  - Multi-dimensional (6 instances)"
          echo "  - With exclude (7 instances)"
          echo "  - With include (4 instances)"
          echo "  - Max parallel (5 instances with limit 2)"
          echo "  - Complex exclude/include (7 instances)"
          echo "  - Matrix with types (12 instances)"
          echo "  - Matrix in env (3 instances)"
          echo "  - Single value (1 instance)"
          echo "  - 3D matrix (7 instances)"
          echo "  - Fail fast (3 instances)"
          echo "Total: 58 matrix job instances + 1 verification = 59 jobs"
