site_name: OFX - Offensive Flow Executor
site_description: A powerful workflow execution framework optimized for red teaming operations
site_author: anhhung04
site_url: https://anhhung04.github.io/ofx/

repo_name: ofx
repo_url: https://github.com/anhhung04/ofx
edit_uri: edit/main/docs/

theme:
        name: material
        palette:
                # Light mode
                - media: "(prefers-color-scheme: light)"
                  scheme: default
                  primary: red
                  accent: red
                  toggle:
                          icon: material/weather-sunny
                          name: Switch to dark mode
                # Dark mode
                - media: "(prefers-color-scheme: dark)"
                  scheme: slate
                  primary: red
                  accent: red
                  toggle:
                          icon: material/weather-night
                          name: Switch to light mode
        features:
                - navigation.instant
                - navigation.tracking
                - navigation.tabs
                - navigation.tabs.sticky
                - navigation.sections
                - navigation.expand
                - navigation.top
                - search.suggest
                - search.highlight
                - toc.integrate
                - content.code.copy
                - content.code.annotate
        icon:
                repo: fontawesome/brands/github

extra_css:
        - stylesheets/extra.css

extra:
        social:
                - icon: fontawesome/brands/github
                  link: https://github.com/anhhung04/ofx
                - icon: fontawesome/brands/python
                  link: https://pypi.org/project/ofx/

markdown_extensions:
        - admonition
        - pymdownx.details
        - pymdownx.superfences:
                  custom_fences:
                          - name: mermaid
                            class: mermaid
                            format: !!python/name:pymdownx.superfences.fence_code_format
        - pymdownx.highlight:
                  anchor_linenums: true
                  line_spans: __span
                  pygments_lang_class: true
        - pymdownx.inlinehilite
        - pymdownx.snippets
        - pymdownx.tabbed:
                  alternate_style: true
        - pymdownx.tasklist:
                  custom_checkbox: true
        - pymdownx.emoji:
                  emoji_index: !!python/name:material.extensions.emoji.twemoji
                  emoji_generator: !!python/name:material.extensions.emoji.to_svg
        - tables
        - toc:
                  permalink: true
        - attr_list
        - md_in_html
        - pymdownx.arithmatex:
                  generic: true

plugins:
        - search
        - tags
        - git-revision-date-localized:
                  enable_creation_date: true
                  type: timeago
        - minify:
                  minify_html: true
nav:
        - Home: index.md
        - Getting Started:
                  - Installation: getting-started/installation.md
                  - Quick Start: getting-started/quickstart.md
                  - Quickstart Examples: getting-started/quickstart/examples.md
                  - Concepts: getting-started/concepts.md
                  - Architecture: getting-started/concepts/architecture.md
        - User Guide:
            - Workflows:
                  - Overview: guide/workflows.md
                  - Structure: guide/workflows/structure.md
                  - Reusable Workflows: guide/workflows/reusable.md
                  - Dependencies: guide/workflows/dependencies.md
                  - Stages: guide/workflows/stages.md
                  - Examples: guide/workflows/examples.md
            - Jobs & Steps:
                  - Overview: guide/jobs-steps.md
                  - Jobs: guide/jobs-steps/jobs.md
                  - Steps: guide/jobs-steps/steps.md
                  - Matrix Strategy: guide/jobs-steps/matrix-strategy.md
                  - Outputs: guide/jobs-steps/outputs.md
                  - Script files: guide/jobs-steps/script-file.md
            - Built-in Workflows:
                  - Recon: guide/builtin-workflows/recon.md
                  - Scan: guide/builtin-workflows/scan.md
                  - Vuln: guide/builtin-workflows/vuln.md
                  - Exploit: guide/builtin-workflows/exploit.md
                  - Post: guide/builtin-workflows/post.md
                  - Utility: guide/builtin-workflows/utility.md
                  - Setup: guide/builtin-workflows/setup.md
            - Profiles:
                  - Overview: guide/profiles.md
            - Templates:
                  - Overview: guide/templates.md
                  - Jinja Templates: guide/templates/jinja.md
                  - Examples: guide/templates/examples.md
            - Secrets & Inputs:
                  - Overview: guide/secrets-inputs.md
                  - Secrets: guide/secrets-inputs/secrets.md
                  - Inputs: guide/secrets-inputs/inputs.md
            - Execution Context:
                  - Precedence: guide/context-precedence.md
                  - Built-in Variables & Functions: guide/context-variables-functions.md
            - Interactive Mode:
                  - Overview: guide/interactive-mode.md
