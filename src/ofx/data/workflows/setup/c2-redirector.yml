name: c2-redirector
description: |
  Set up HTTPS redirector infrastructure for C2 traffic — configures
  Nginx reverse proxy with SSL certificates, domain fronting support,
  and malleable profile forwarding rules.
tags: [setup, c2, opsec, infrastructure]

dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    c2_host:
      required: true
      type: string
      description: Backend C2 server IP/hostname
      alias: c
    c2_port:
      type: number
      default: 443
      description: Backend C2 port
    domain:
      required: true
      type: string
      description: Redirector domain name for SSL cert
      alias: d
    user_agent_filter:
      type: string
      default: ""
      description: Only forward requests matching this User-Agent substring

jobs:
  install:
    name: Install Nginx & Certbot
    steps:
      - name: Install packages
        log-command: "{{ inputs.log_command | default(true) }}"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx certbot python3-certbot-nginx

  ssl:
    name: SSL Certificate
    needs: [install]
    outputs:
      cert_path: "/etc/letsencrypt/live/{{ inputs.domain }}/fullchain.pem"
      key_path: "/etc/letsencrypt/live/{{ inputs.domain }}/privkey.pem"
    steps:
      - name: Obtain certificate
        log-command: "{{ inputs.log_command | default(true) }}"
        run: |
          sudo certbot certonly --nginx -d {{ inputs.domain }} \
            --non-interactive --agree-tos --register-unsafely-without-email \
            || echo "WARN: certbot failed — using self-signed"
          if [ ! -f "/etc/letsencrypt/live/{{ inputs.domain }}/fullchain.pem" ]; then
            sudo mkdir -p /etc/letsencrypt/live/{{ inputs.domain }}
            sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
              -keyout /etc/letsencrypt/live/{{ inputs.domain }}/privkey.pem \
              -out /etc/letsencrypt/live/{{ inputs.domain }}/fullchain.pem \
              -subj "/CN={{ inputs.domain }}"
          fi

  configure:
    name: Configure Redirector
    needs: [ssl]
    steps:
      - name: Write Nginx config
        script: |
          ua_filter = "{{ inputs.user_agent_filter }}"
          c2_host = "{{ inputs.c2_host }}"
          c2_port = {{ inputs.c2_port }}
          domain = "{{ inputs.domain }}"

          ua_block = ""
          if ua_filter:
              ua_block = f"""
              if ($http_user_agent !~* "{ua_filter}") {{
                  return 404;
              }}"""

          config = f"""server {{
              listen 443 ssl;
              server_name {domain};

              ssl_certificate /etc/letsencrypt/live/{domain}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/{domain}/privkey.pem;
              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_prefer_server_ciphers on;
              {ua_block}

              location / {{
                  proxy_pass https://{c2_host}:{c2_port};
                  proxy_ssl_verify off;
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Real-IP $remote_addr;
              }}
          }}

          server {{
              listen 80;
              server_name {domain};
              return 301 https://$server_name$request_uri;
          }}"""

          with open("/tmp/c2-redirector.conf", "w") as f:
              f.write(config)
          print(f"Config written for {domain} -> {c2_host}:{c2_port}")

      - name: Deploy config
        run: |
          sudo cp /tmp/c2-redirector.conf /etc/nginx/sites-available/c2-redirector
          sudo ln -sf /etc/nginx/sites-available/c2-redirector /etc/nginx/sites-enabled/
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t && sudo systemctl restart nginx
          echo "Redirector active: https://{{ inputs.domain }} → {{ inputs.c2_host }}:{{ inputs.c2_port }}"
        log-stdout: "{{ inputs.log_output | default(true) }}"
        log-command: "{{ inputs.log_command | default(true) }}"
