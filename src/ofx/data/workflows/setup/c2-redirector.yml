name: c2-redirector
description: |
  Set up an authorized C2 redirector with Nginx reverse proxying,
  SSL termination, optional CORS headers, request filtering, and
  operator-facing deployment notes. Intended for approved red team labs
  and sanctioned security testing only.
tags:
  - setup
  - c2
  - redirector
  - infrastructure
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Redirector public domain name
      alias: t
    c2_host:
      required: true
      type: string
      description: Backend C2 server IP address or hostname
      alias: c
    c2_port:
      type: number
      default: 443
      description: Backend C2 listener port
    backend_scheme:
      type: string
      default: https
      description: Backend scheme, usually http or https
    email:
      type: string
      default: ""
      description: Email address for Let's Encrypt certificate registration
    enable_cors:
      type: boolean
      default: false
      description: Add permissive CORS response headers to proxied responses
    user_agent_filter:
      type: string
      default: ""
      description: Only forward requests whose User-Agent contains this value
    allowed_path_prefix:
      type: string
      default: "/"
      description: Only proxy paths under this prefix
defaults:
    store-creds: true

jobs:
  prepare:
    name: Prepare Redirector Host
    outputs:
      domain: "{{ inputs.target }}"
      nginx_site: "/etc/nginx/sites-available/ofx-c2-redirector"
    steps:
      - name: install packages
        log-command: "{{ inputs.log_command | default(true) }}"
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx certbot python3-certbot-nginx openssl ufw
          sudo systemctl enable nginx
        retry: 2
        retry-delay: 10
        continue-on-error: true

      - name: firewall hints
        log-command: "{{ inputs.log_command | default(true) }}"
        run: |
          set -euo pipefail
          if command -v ufw >/dev/null 2>&1; then
            sudo ufw allow 80/tcp || true
            sudo ufw allow 443/tcp || true
          fi
          echo "Prepared redirector host for {{ inputs.target }}"
        retry: 1
        retry-delay: 5
        continue-on-error: true

  ssl:
    name: SSL Termination
    needs: [prepare]
    outputs:
      cert_path: "/etc/letsencrypt/live/{{ inputs.target }}/fullchain.pem"
      key_path: "/etc/letsencrypt/live/{{ inputs.target }}/privkey.pem"
      ssl_mode: "{{ steps.ssl-mode.outputs.ssl_mode | default('unknown', true) }}"
    steps:
      - name: obtain certificate
        log-command: "{{ inputs.log_command | default(true) }}"
        run: |
          set -euo pipefail
          DOMAIN="{{ inputs.target }}"
          EMAIL="{{ inputs.email }}"

          if [ -n "$EMAIL" ]; then
            CERTBOT_EMAIL_ARGS="--email $EMAIL"
          else
            CERTBOT_EMAIL_ARGS="--register-unsafely-without-email"
          fi

          sudo certbot certonly --nginx -d "$DOMAIN" \
            --non-interactive --agree-tos $CERTBOT_EMAIL_ARGS || true

          if [ ! -f "/etc/letsencrypt/live/$DOMAIN/fullchain.pem" ]; then
            echo "Let's Encrypt failed or DNS not ready; generating self-signed fallback"
            sudo mkdir -p "/etc/letsencrypt/live/$DOMAIN"
            sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
              -keyout "/etc/letsencrypt/live/$DOMAIN/privkey.pem" \
              -out "/etc/letsencrypt/live/$DOMAIN/fullchain.pem" \
              -subj "/CN=$DOMAIN"
          fi
        retry: 2
        retry-delay: 15
        continue-on-error: true

      - name: ssl-mode
        script: |
          from pathlib import Path

          domain = "{{ inputs.target }}"
          cert = Path(f"/etc/letsencrypt/live/{domain}/fullchain.pem")
          mode = "configured" if cert.exists() else "missing"
          add_outputs(ssl_mode=mode)
          print(f"SSL mode: {mode}")
        retry: 1
        retry-delay: 5
        continue-on-error: true

  configure:
    name: Configure Nginx Redirector
    needs: [ssl]
    outputs:
      config_path: "/tmp/ofx-c2-redirector.conf"
      upstream: "{{ inputs.backend_scheme }}://{{ inputs.c2_host }}:{{ inputs.c2_port }}"
    steps:
      - name: write nginx config
        script: |
          from pathlib import Path

          domain = "{{ inputs.target }}"
          c2_host = "{{ inputs.c2_host }}"
          c2_port = "{{ inputs.c2_port }}"
          backend_scheme = "{{ inputs.backend_scheme }}"
          enable_cors = "{{ inputs.enable_cors }}" == "true"
          ua_filter = "{{ inputs.user_agent_filter }}".strip()
          path_prefix = "{{ inputs.allowed_path_prefix }}".strip() or "/"

          cors_headers = ""
          if enable_cors:
              cors_headers = """
              add_header Access-Control-Allow-Origin * always;
              add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
              add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Requested-With' always;
              if ($request_method = OPTIONS) { return 204; }
              """

          ua_block = ""
          if ua_filter:
              ua_block = f"""
              if ($http_user_agent !~* "{ua_filter}") {{
                  return 404;
              }}
              """

          config = f"""server {{
              listen 80;
              server_name {domain};
              return 301 https://$host$request_uri;
          }}

          server {{
              listen 443 ssl http2;
              server_name {domain};

              ssl_certificate /etc/letsencrypt/live/{domain}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/{domain}/privkey.pem;
              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_prefer_server_ciphers on;
              server_tokens off;

              {ua_block}
              {cors_headers}

              location {path_prefix} {{
                  proxy_pass {backend_scheme}://{c2_host}:{c2_port};
                  proxy_http_version 1.1;
                  proxy_ssl_verify off;
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
              }}

              location / {{
                  return 404;
              }}
          }}
          """

          path = Path("/tmp/ofx-c2-redirector.conf")
          path.write_text(config)
          add_outputs(config_path=str(path), upstream=f"{backend_scheme}://{c2_host}:{c2_port}")
          print(f"Wrote {path}")
        retry: 1
        retry-delay: 5
        continue-on-error: true

      - name: deploy nginx config
        log-command: "{{ inputs.log_command | default(true) }}"
        run: |
          set -euo pipefail
          sudo cp /tmp/ofx-c2-redirector.conf /etc/nginx/sites-available/ofx-c2-redirector
          sudo ln -sf /etc/nginx/sites-available/ofx-c2-redirector /etc/nginx/sites-enabled/ofx-c2-redirector
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo systemctl restart nginx
          echo "Redirector active: https://{{ inputs.target }} -> {{ inputs.backend_scheme }}://{{ inputs.c2_host }}:{{ inputs.c2_port }}"
        log-stdout: "{{ inputs.log_output | default(true) }}"
        retry: 2
        retry-delay: 10
        continue-on-error: true

  summary:
    name: Redirector Summary
    needs: [prepare, ssl, configure]
    steps:
      - name: report
        run: |
          echo "=== C2 REDIRECTOR SETUP REPORT ==="
          echo "Domain: {{ inputs.target }}"
          echo "Backend: {{ jobs['configure'].outputs.upstream }}"
          echo "SSL: {{ jobs['ssl'].outputs.ssl_mode }}"
          echo "Nginx site: {{ jobs['prepare'].outputs.nginx_site }}"
          echo "Config: {{ jobs['configure'].outputs.config_path }}"
          echo "CORS enabled: {{ inputs.enable_cors }}"
          echo "Allowed path prefix: {{ inputs.allowed_path_prefix }}"
          echo "User-Agent filter: {{ inputs.user_agent_filter | default('none', true) }}"
        log-stdout: "{{ inputs.log_output | default(true) }}"

outputs:
  domain: "{{ jobs['prepare'].outputs.domain }}"
  upstream: "{{ jobs['configure'].outputs.upstream }}"
  ssl_mode: "{{ jobs['ssl'].outputs.ssl_mode }}"
  config_path: "{{ jobs['configure'].outputs.config_path }}"
