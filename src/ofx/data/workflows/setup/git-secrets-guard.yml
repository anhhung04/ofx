name: git-secrets-guard
description: 'Set up pre-commit hooks for secret scanning and security checks

  in Git repositories. Installs gitleaks, trufflehog, and detect-secrets

  as pre-commit hooks, with optional CI pipeline integration via

  GitHub Actions or GitLab CI templates.

  '
tags:
- setup
- git
- secret
- devsecops
- pre-commit
dispatch:
  inputs:
    log_command:
      type: string
      default: 'true'
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: 'true'
      description: Enable stdout output log files for steps when set to true/false.
    repo_path:
      type: string
      default: .
      description: Path to Git repository
      alias: r
    scan_mode:
      type: string
      default: pre-commit
      description: 'Hook mode: pre-commit, pre-push, ci, or all'
    gitleaks_config:
      type: string
      default: ''
      description: Path to custom gitleaks.toml config
    allow_list:
      type: string
      default: ''
      description: Path to .gitleaksignore or allow-list file
    generate_ci:
      type: boolean
      default: false
      description: Generate GitHub Actions or GitLab CI workflow file
    ci_platform:
      type: string
      default: github
      description: 'CI platform: github or gitlab'
jobs:
  detect-repo:
    name: Detect Repository State
    outputs:
      is_git_repo: '{{ steps["check-git"].outputs.is_git_repo | default("false", true)
        }}'
      default_branch: '{{ steps["check-git"].outputs.default_branch | default("main",
        true) }}'
      repo_root: '{{ steps["check-git"].outputs.repo_root | default("", true) }}'
      has_precommit_config: '{{ steps["check-git"].outputs.has_precommit_config |
        default("false", true) }}'
    steps:
    - name: check-git
      module: modules/check_git.py::run
  install-hooks:
    name: Install Pre-Commit Hooks
    needs:
    - detect-repo
    run_if: '{{ jobs[''detect-repo''].outputs.is_git_repo == ''true'' }}'
    outputs:
      hooks_installed: '{{ steps["setup-hooks"].outputs.hooks_installed | default("0",
        true) }}'
      config_path: '{{ steps["setup-hooks"].outputs.config_path | default("", true)
        }}'
    steps:
    - name: setup-hooks
      module: modules/setup_hooks.py::run
      with:
        repo_root: "{{ jobs['detect-repo'].outputs.repo_root }}"
  baseline-scan:
    name: Run Baseline Secret Scan
    needs:
    - detect-repo
    run_if: '{{ jobs[''detect-repo''].outputs.is_git_repo == ''true'' }}'
    outputs:
      findings_count: '{{ steps["baseline"].outputs.findings_count | default("0",
        true) }}'
      baseline_file: '{{ steps["baseline"].outputs.baseline_file | default("", true)
        }}'
    steps:
    - name: baseline
      continue-on-error: true
      module: modules/baseline.py::run
      with:
        repo_root: "{{ jobs['detect-repo'].outputs.repo_root }}"
  ci-template:
    name: Generate CI Pipeline Integration
    needs:
    - detect-repo
    run_if: '{{ inputs.generate_ci }}'
    outputs:
      ci_file: '{{ steps["generate-ci"].outputs.ci_file | default("", true) }}'
      ci_platform: '{{ steps["generate-ci"].outputs.ci_platform | default("", true)
        }}'
    steps:
    - name: generate-ci
      module: modules/generate_ci.py::run
      with:
        repo_root: "{{ jobs['detect-repo'].outputs.repo_root }}"
        default_branch: "{{ jobs['detect-repo'].outputs.default_branch }}"
  summary:
    name: Git Secrets Guard Summary
    needs:
    - install-hooks
    - baseline-scan
    - ci-template
    steps:
    - name: report
      module: shell
      with:
        cmd: "echo \"============================================\"\necho \" GIT SECRETS\
          \ GUARD\"\necho \"============================================\"\necho \"\"\
          \necho \"Repository: {{ jobs['detect-repo'].outputs.repo_root }}\"\necho \"\
          Branch: {{ jobs['detect-repo'].outputs.default_branch }}\"\necho \"\"\n\n\
          if \"{{ jobs['install-hooks'].outputs.hooks_installed }}\" != \"0\":\n  echo\
          \ \"--- Pre-commit Hooks ---\"\n  echo \"Config: {{ jobs['install-hooks'].outputs.config_path\
          \ }}\"\n  echo \"Hooks: {{ jobs['install-hooks'].outputs.hooks_installed }}\
          \ scanner(s)\"\n  echo \"Mode: {{ inputs.scan_mode }}\"\n  echo \"\"\n\nif\
          \ \"{{ jobs['baseline-scan'].outputs.findings_count }}\" != \"0\":\n  echo\
          \ \"--- Baseline Scan ---\"\n  echo \"Findings: {{ jobs['baseline-scan'].outputs.findings_count\
          \ }}\"\n  echo \"Report: {{ jobs['baseline-scan'].outputs.baseline_file }}\"\
          \n  echo \"\"\n\nif \"{{ inputs.generate_ci }}\" == \"true\":\n  echo \"---\
          \ CI Integration ---\"\n  echo \"Platform: {{ jobs['ci-template'].outputs.ci_platform\
          \ }}\"\n  echo \"Pipeline: {{ jobs['ci-template'].outputs.ci_file }}\"\n \
          \ echo \"\"\n\necho \"Next steps:\"\necho \"  1. Review findings in baseline\
          \ report\"\necho \"  2. Add false positives to .gitleaksignore\"\necho \"\
          \  3. Run: pre-commit install --hook-type {{ inputs.scan_mode }}\"\necho \"\
          \  4. Commit the .pre-commit-config.yaml to the repo\"\necho \"============================================\"\
          \n"
      log-stdout: '{{ inputs.log_output | default(true) }}'
