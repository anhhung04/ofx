name: git-secrets-guard
description: 'Set up pre-commit hooks for secret scanning and security checks

  in Git repositories. Installs gitleaks, trufflehog, and detect-secrets

  as pre-commit hooks, with optional CI pipeline integration via

  GitHub Actions or GitLab CI templates.

  '
tags:
- setup
- git
- secret
- devsecops
- pre-commit
dispatch:
  inputs:
    log_command:
      type: string
      default: 'true'
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: 'true'
      description: Enable stdout output log files for steps when set to true/false.
    repo_path:
      type: string
      default: .
      description: Path to Git repository
      alias: r
    scan_mode:
      type: string
      default: pre-commit
      description: 'Hook mode: pre-commit, pre-push, ci, or all'
    gitleaks_config:
      type: string
      default: ''
      description: Path to custom gitleaks.toml config
    allow_list:
      type: string
      default: ''
      description: Path to .gitleaksignore or allow-list file
    generate_ci:
      type: boolean
      default: false
      description: Generate GitHub Actions or GitLab CI workflow file
    ci_platform:
      type: string
      default: github
      description: 'CI platform: github or gitlab'
jobs:
  detect-repo:
    name: Detect Repository State
    outputs:
      is_git_repo: '{{ steps["check-git"].outputs.is_git_repo | default("false", true)
        }}'
      default_branch: '{{ steps["check-git"].outputs.default_branch | default("main",
        true) }}'
      repo_root: '{{ steps["check-git"].outputs.repo_root | default("", true) }}'
      has_precommit_config: '{{ steps["check-git"].outputs.has_precommit_config |
        default("false", true) }}'
    steps:
    - name: check-git
      script: "import subprocess, pathlib\n\nrepo_path = pathlib.Path(\"{{ inputs.repo_path\
        \ }}\").resolve()\nis_git = False\ndefault_branch = \"main\"\nhas_precommit\
        \ = False\n\ntry:\n    result = subprocess.run(\n        [\"git\", \"-C\"\
        , str(repo_path), \"rev-parse\", \"--git-dir\"],\n        capture_output=True,\
        \ text=True\n    )\n    is_git = result.returncode == 0\n\n    if is_git:\n\
        \        branch_result = subprocess.run(\n            [\"git\", \"-C\", str(repo_path),\
        \ \"rev-parse\", \"--abbrev-ref\", \"HEAD\"],\n            capture_output=True,\
        \ text=True\n        )\n        default_branch = branch_result.stdout.strip()\
        \ or \"main\"\n\n        has_precommit = (repo_path / \".pre-commit-config.yaml\"\
        ).exists()\nexcept Exception:\n    pass\n\nadd_outputs(\n    is_git_repo=str(is_git).lower(),\n\
        \    default_branch=default_branch,\n    repo_root=str(repo_path),\n    has_precommit_config=str(has_precommit).lower(),\n\
        )\nprint(f\"Git repo: {is_git}\")\nprint(f\"Branch: {default_branch}\")\n\
        print(f\"Pre-commit config exists: {has_precommit}\")\n"
  install-hooks:
    name: Install Pre-Commit Hooks
    needs:
    - detect-repo
    run_if: '{{ jobs[''detect-repo''].outputs.is_git_repo == ''true'' }}'
    outputs:
      hooks_installed: '{{ steps["setup-hooks"].outputs.hooks_installed | default("0",
        true) }}'
      config_path: '{{ steps["setup-hooks"].outputs.config_path | default("", true)
        }}'
    steps:
    - name: setup-hooks
      script: "import subprocess, pathlib, os\n\nrepo_root = pathlib.Path(\"{{ jobs['detect-repo'].outputs.repo_root\
        \ }}\")\nprecommit_config = repo_root / \".pre-commit-config.yaml\"\ngitleaks_config\
        \ = \"{{ inputs.gitleaks_config }}\"\nscan_mode = \"{{ inputs.scan_mode }}\"\
        \n\n# Detect if pre-commit is available\nprecommit_cmd = None\nfor cmd in\
        \ [\"pre-commit\"]:\n    try:\n        subprocess.run([cmd, \"--version\"\
        ], capture_output=True)\n        precommit_cmd = cmd\n        break\n    except\
        \ FileNotFoundError:\n        pass\n\n# Build .pre-commit-config.yaml\nhooks_config\
        \ = {\n    \"repos\": [\n        {\n            \"repo\": \"https://github.com/gitleaks/gitleaks\"\
        ,\n            \"rev\": \"v8.18.0\",\n            \"hooks\": [\n         \
        \       {\n                    \"id\": \"gitleaks\",\n                   \
        \ \"args\": [\"--verbose\"] + (\n                        [\"--config\", gitleaks_config]\
        \ if gitleaks_config else []\n                    ),\n                }\n\
        \            ],\n        },\n        {\n            \"repo\": \"https://github.com/trufflesecurity/trufflehog\"\
        ,\n            \"rev\": \"v3.67.0\",\n            \"hooks\": [\n         \
        \       {\n                    \"id\": \"trufflehog\",\n                 \
        \   \"args\": [\"git\", \"file://.\", \"--since-commit\", \"HEAD\", \"--fail\"\
        , \"--no-update\"],\n                }\n            ],\n        },\n    ]\n\
        }\n\nimport yaml\nprecommit_config.write_text(yaml.dump(hooks_config, default_flow_style=False,\
        \ sort_keys=False))\n\nhooks_count = len(hooks_config[\"repos\"])\nadd_outputs(hooks_installed=hooks_count,\
        \ config_path=str(precommit_config))\nprint(f\"Pre-commit hooks installed:\
        \ {hooks_count}\")\n\n# Install hooks if pre-commit is available\nif precommit_cmd:\n\
        \    try:\n        subprocess.run(\n            [precommit_cmd, \"install\"\
        , \"--hook-type\", scan_mode],\n            cwd=str(repo_root), capture_output=True,\
        \ text=True\n        )\n        print(f\"pre-commit hooks installed for: {scan_mode}\"\
        )\n    except Exception as e:\n        print(f\"Note: pre-commit tool not\
        \ available ({e})\")\n        print(f\"Hooks config written but not auto-installed\"\
        )\n        print(f\"Run manually: pip install pre-commit && pre-commit install\"\
        )\nelse:\n    print(\"Install pre-commit manually: pip install pre-commit\"\
        )\n"
  baseline-scan:
    name: Run Baseline Secret Scan
    needs:
    - detect-repo
    run_if: '{{ jobs[''detect-repo''].outputs.is_git_repo == ''true'' }}'
    outputs:
      findings_count: '{{ steps["baseline"].outputs.findings_count | default("0",
        true) }}'
      baseline_file: '{{ steps["baseline"].outputs.baseline_file | default("", true)
        }}'
    steps:
    - name: baseline
      continue-on-error: true
      script: "import subprocess, tempfile, os\nresult = subprocess.run('REPO=\"{{\
        \ jobs[\\'detect-repo\\'].outputs.repo_root }}\" BASELINE=\"$REPO/.gitleaks-baseline.json\"\
        \ BASELINE_CSV=\"$REPO/.gitleaks-baseline.csv\" echo \"[*] Running baseline\
        \ gitleaks scan...\" gitleaks detect \\\\ --source=\"$REPO\" \\\\ --verbose\
        \ \\\\ --report-format=json \\\\ --report-path=\"$BASELINE\" || true FINDINGS=$(python3\
        \ -c \"import json; d=json.load(open(\\'$BASELINE\\')); print(len(d))\"',\
        \ shell=True, capture_output=True, text=True)\nprint(result.stdout)\nif result.stderr:\n\
        \    print(result.stderr, file=__import__(\"sys\").stderr)"
  ci-template:
    name: Generate CI Pipeline Integration
    needs:
    - detect-repo
    run_if: '{{ inputs.generate_ci }}'
    outputs:
      ci_file: '{{ steps["generate-ci"].outputs.ci_file | default("", true) }}'
      ci_platform: '{{ steps["generate-ci"].outputs.ci_platform | default("", true)
        }}'
    steps:
    - name: generate-ci
      script: "import pathlib\n\nrepo_root = pathlib.Path(\"{{ jobs['detect-repo'].outputs.repo_root\
        \ }}\")\nplatform = \"{{ inputs.ci_platform }}\"\nbranch = \"{{ jobs['detect-repo'].outputs.default_branch\
        \ }}\"\n\nif platform == \"github\":\n    ci_dir = repo_root / \".github\"\
        \ / \"workflows\"\n    ci_dir.mkdir(parents=True, exist_ok=True)\n    ci_path\
        \ = ci_dir / \"secret-scan.yml\"\n\n    ci_content = f\"\"\"name: Secret Scan\n\
        on:\n  push:\n    branches: [{branch}]\n  pull_request:\n    branches: [{branch}]\n\
        \  schedule:\n    - cron: '0 6 * * 1'  # Weekly Monday 6am\n\njobs:\n  secret-scan:\n\
        \    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\
        \        with:\n          fetch-depth: 0\n\n      - name: Gitleaks Scan\n\
        \        uses: gitleaks/gitleaks-action@v2\n        env:\n          GITHUB_TOKEN:\
        \ ${{ '{{ secrets.GITHUB_TOKEN }}' }}\n\n      - name: TruffleHog Scan\n \
        \       uses: trufflesecurity/trufflehog-action@v1\n        with:\n      \
        \    path: ./\n          base: ${{ '{{ github.event.before }}' }}\n      \
        \    head: ${{ '{{ github.sha }}' }}\n\"\"\"\nelse:\n    ci_path = repo_root\
        \ / \".gitlab-ci.yml\"\n    ci_content = f\"\"\"stages:\n  - security-scan\n\
        \nsecret-scan:\n  stage: security-scan\n  image: \n    name: zricethezav/gitleaks:latest\n\
        \    entrypoint: [\"\"]\n  script:\n    - gitleaks detect --source=. --verbose\n\
        \  rules:\n    - if: $CI_PIPELINE_SOURCE == \"push\"\n    - if: $CI_PIPELINE_SOURCE\
        \ == \"merge_request_event\"\n  allow_failure: true\n\ntrufflehog-scan:\n\
        \  stage: security-scan\n  image:\n    name: trufflesecurity/trufflehog:latest\n\
        \    entrypoint: [\"\"]\n  script:\n    - trufflehog git file://. --since-commit\
        \ HEAD --fail --no-update\n  rules:\n    - if: $CI_PIPELINE_SOURCE == \"push\"\
        \n    - if: $CI_PIPELINE_SOURCE == \"merge_request_event\"\n  allow_failure:\
        \ true\n\"\"\"\n\nci_path.write_text(ci_content)\nadd_outputs(ci_file=str(ci_path),\
        \ ci_platform=platform)\nprint(f\"CI pipeline generated: {ci_path}\")\nprint(f\"\
        Platform: {platform}\")\n"
  summary:
    name: Git Secrets Guard Summary
    needs:
    - install-hooks
    - baseline-scan
    - ci-template
    steps:
    - name: report
      run: "echo \"============================================\"\necho \" GIT SECRETS\
        \ GUARD\"\necho \"============================================\"\necho \"\"\
        \necho \"Repository: {{ jobs['detect-repo'].outputs.repo_root }}\"\necho \"\
        Branch: {{ jobs['detect-repo'].outputs.default_branch }}\"\necho \"\"\n\n\
        if \"{{ jobs['install-hooks'].outputs.hooks_installed }}\" != \"0\":\n  echo\
        \ \"--- Pre-commit Hooks ---\"\n  echo \"Config: {{ jobs['install-hooks'].outputs.config_path\
        \ }}\"\n  echo \"Hooks: {{ jobs['install-hooks'].outputs.hooks_installed }}\
        \ scanner(s)\"\n  echo \"Mode: {{ inputs.scan_mode }}\"\n  echo \"\"\n\nif\
        \ \"{{ jobs['baseline-scan'].outputs.findings_count }}\" != \"0\":\n  echo\
        \ \"--- Baseline Scan ---\"\n  echo \"Findings: {{ jobs['baseline-scan'].outputs.findings_count\
        \ }}\"\n  echo \"Report: {{ jobs['baseline-scan'].outputs.baseline_file }}\"\
        \n  echo \"\"\n\nif \"{{ inputs.generate_ci }}\" == \"true\":\n  echo \"---\
        \ CI Integration ---\"\n  echo \"Platform: {{ jobs['ci-template'].outputs.ci_platform\
        \ }}\"\n  echo \"Pipeline: {{ jobs['ci-template'].outputs.ci_file }}\"\n \
        \ echo \"\"\n\necho \"Next steps:\"\necho \"  1. Review findings in baseline\
        \ report\"\necho \"  2. Add false positives to .gitleaksignore\"\necho \"\
        \  3. Run: pre-commit install --hook-type {{ inputs.scan_mode }}\"\necho \"\
        \  4. Commit the .pre-commit-config.yaml to the repo\"\necho \"============================================\"\
        \n"
      log-stdout: '{{ inputs.log_output | default(true) }}'
