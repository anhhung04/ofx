name: git-secrets-guard
description: |
  Set up pre-commit hooks for secret scanning and security checks
  in Git repositories. Installs gitleaks, trufflehog, and detect-secrets
  as pre-commit hooks, with optional CI pipeline integration via
  GitHub Actions or GitLab CI templates.
tags:
  - setup
  - git
  - secret
  - devsecops
  - pre-commit
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    repo_path:
      type: string
      default: "."
      description: Path to Git repository
      alias: r
    scan_mode:
      type: string
      default: "pre-commit"
      description: "Hook mode: pre-commit, pre-push, ci, or all"
    gitleaks_config:
      type: string
      default: ""
      description: Path to custom gitleaks.toml config
    allow_list:
      type: string
      default: ""
      description: Path to .gitleaksignore or allow-list file
    generate_ci:
      type: boolean
      default: false
      description: Generate GitHub Actions or GitLab CI workflow file
    ci_platform:
      type: string
      default: "github"
      description: "CI platform: github or gitlab"

jobs:
  detect-repo:
    name: Detect Repository State
    outputs:
      is_git_repo: '{{ steps["check-git"].outputs.is_git_repo | default("false", true) }}'
      default_branch: '{{ steps["check-git"].outputs.default_branch | default("main", true) }}'
      repo_root: '{{ steps["check-git"].outputs.repo_root | default("", true) }}'
      has_precommit_config: '{{ steps["check-git"].outputs.has_precommit_config | default("false", true) }}'
    steps:
      - name: check-git
        script: |
          import subprocess, pathlib

          repo_path = pathlib.Path("{{ inputs.repo_path }}").resolve()
          is_git = False
          default_branch = "main"
          has_precommit = False

          try:
              result = subprocess.run(
                  ["git", "-C", str(repo_path), "rev-parse", "--git-dir"],
                  capture_output=True, text=True
              )
              is_git = result.returncode == 0

              if is_git:
                  branch_result = subprocess.run(
                      ["git", "-C", str(repo_path), "rev-parse", "--abbrev-ref", "HEAD"],
                      capture_output=True, text=True
                  )
                  default_branch = branch_result.stdout.strip() or "main"

                  has_precommit = (repo_path / ".pre-commit-config.yaml").exists()
          except Exception:
              pass

          add_outputs(
              is_git_repo=str(is_git).lower(),
              default_branch=default_branch,
              repo_root=str(repo_path),
              has_precommit_config=str(has_precommit).lower(),
          )
          print(f"Git repo: {is_git}")
          print(f"Branch: {default_branch}")
          print(f"Pre-commit config exists: {has_precommit}")

  install-hooks:
    name: Install Pre-Commit Hooks
    needs:
      - detect-repo
    run_if: "{{ jobs['detect-repo'].outputs.is_git_repo == 'true' }}"
    outputs:
      hooks_installed: '{{ steps["setup-hooks"].outputs.hooks_installed | default("0", true) }}'
      config_path: '{{ steps["setup-hooks"].outputs.config_path | default("", true) }}'
    steps:
      - name: setup-hooks
        script: |
          import subprocess, pathlib, os

          repo_root = pathlib.Path("{{ jobs['detect-repo'].outputs.repo_root }}")
          precommit_config = repo_root / ".pre-commit-config.yaml"
          gitleaks_config = "{{ inputs.gitleaks_config }}"
          scan_mode = "{{ inputs.scan_mode }}"

          # Detect if pre-commit is available
          precommit_cmd = None
          for cmd in ["pre-commit"]:
              try:
                  subprocess.run([cmd, "--version"], capture_output=True)
                  precommit_cmd = cmd
                  break
              except FileNotFoundError:
                  pass

          # Build .pre-commit-config.yaml
          hooks_config = {
              "repos": [
                  {
                      "repo": "https://github.com/gitleaks/gitleaks",
                      "rev": "v8.18.0",
                      "hooks": [
                          {
                              "id": "gitleaks",
                              "args": ["--verbose"] + (
                                  ["--config", gitleaks_config] if gitleaks_config else []
                              ),
                          }
                      ],
                  },
                  {
                      "repo": "https://github.com/trufflesecurity/trufflehog",
                      "rev": "v3.67.0",
                      "hooks": [
                          {
                              "id": "trufflehog",
                              "args": ["git", "file://.", "--since-commit", "HEAD", "--fail", "--no-update"],
                          }
                      ],
                  },
              ]
          }

          import yaml
          precommit_config.write_text(yaml.dump(hooks_config, default_flow_style=False, sort_keys=False))

          hooks_count = len(hooks_config["repos"])
          add_outputs(hooks_installed=hooks_count, config_path=str(precommit_config))
          print(f"Pre-commit hooks installed: {hooks_count}")

          # Install hooks if pre-commit is available
          if precommit_cmd:
              try:
                  subprocess.run(
                      [precommit_cmd, "install", "--hook-type", scan_mode],
                      cwd=str(repo_root), capture_output=True, text=True
                  )
                  print(f"pre-commit hooks installed for: {scan_mode}")
              except Exception as e:
                  print(f"Note: pre-commit tool not available ({e})")
                  print(f"Hooks config written but not auto-installed")
                  print(f"Run manually: pip install pre-commit && pre-commit install")
          else:
              print("Install pre-commit manually: pip install pre-commit")

  baseline-scan:
    name: Run Baseline Secret Scan
    needs:
      - detect-repo
    run_if: "{{ jobs['detect-repo'].outputs.is_git_repo == 'true' }}"
    outputs:
      findings_count: '{{ steps["baseline"].outputs.findings_count | default("0", true) }}'
      baseline_file: '{{ steps["baseline"].outputs.baseline_file | default("", true) }}'
    steps:
      - name: baseline
        run: |
          REPO="{{ jobs['detect-repo'].outputs.repo_root }}"
          BASELINE="$REPO/.gitleaks-baseline.json"
          BASELINE_CSV="$REPO/.gitleaks-baseline.csv"

          echo "[*] Running baseline gitleaks scan..."
          gitleaks detect \
            --source="$REPO" \
            --verbose \
            --report-format=json \
            --report-path="$BASELINE" 2>/dev/null || true

          FINDINGS=$(python3 -c "import json; d=json.load(open('$BASELINE')); print(len(d))" 2>/dev/null || echo 0)
          echo "findings_count=$FINDINGS" >> "$OFX_OUTPUTS"
          echo "baseline_file=$BASELINE" >> "$OFX_OUTPUTS"
          echo "Baseline findings: $FINDINGS"
        continue-on-error: true

  ci-template:
    name: Generate CI Pipeline Integration
    needs:
      - detect-repo
    run_if: "{{ inputs.generate_ci }}"
    outputs:
      ci_file: '{{ steps["generate-ci"].outputs.ci_file | default("", true) }}'
      ci_platform: '{{ steps["generate-ci"].outputs.ci_platform | default("", true) }}'
    steps:
      - name: generate-ci
        script: |
          import pathlib

          repo_root = pathlib.Path("{{ jobs['detect-repo'].outputs.repo_root }}")
          platform = "{{ inputs.ci_platform }}"
          branch = "{{ jobs['detect-repo'].outputs.default_branch }}"

          if platform == "github":
              ci_dir = repo_root / ".github" / "workflows"
              ci_dir.mkdir(parents=True, exist_ok=True)
              ci_path = ci_dir / "secret-scan.yml"

              ci_content = f"""name: Secret Scan
          on:
            push:
              branches: [{branch}]
            pull_request:
              branches: [{branch}]
            schedule:
              - cron: '0 6 * * 1'  # Weekly Monday 6am

          jobs:
            secret-scan:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0

                - name: Gitleaks Scan
                  uses: gitleaks/gitleaks-action@v2
                  env:
                    GITHUB_TOKEN: ${{ '{{ secrets.GITHUB_TOKEN }}' }}

                - name: TruffleHog Scan
                  uses: trufflesecurity/trufflehog-action@v1
                  with:
                    path: ./
                    base: ${{ '{{ github.event.before }}' }}
                    head: ${{ '{{ github.sha }}' }}
          """
          else:
              ci_path = repo_root / ".gitlab-ci.yml"
              ci_content = f"""stages:
            - security-scan

          secret-scan:
            stage: security-scan
            image: 
              name: zricethezav/gitleaks:latest
              entrypoint: [""]
            script:
              - gitleaks detect --source=. --verbose
            rules:
              - if: $CI_PIPELINE_SOURCE == "push"
              - if: $CI_PIPELINE_SOURCE == "merge_request_event"
            allow_failure: true

          trufflehog-scan:
            stage: security-scan
            image:
              name: trufflesecurity/trufflehog:latest
              entrypoint: [""]
            script:
              - trufflehog git file://. --since-commit HEAD --fail --no-update
            rules:
              - if: $CI_PIPELINE_SOURCE == "push"
              - if: $CI_PIPELINE_SOURCE == "merge_request_event"
            allow_failure: true
          """

          ci_path.write_text(ci_content)
          add_outputs(ci_file=str(ci_path), ci_platform=platform)
          print(f"CI pipeline generated: {ci_path}")
          print(f"Platform: {platform}")

  summary:
    name: Git Secrets Guard Summary
    needs:
      - install-hooks
      - baseline-scan
      - ci-template
    steps:
      - name: report
        run: |
          echo "============================================"
          echo " GIT SECRETS GUARD"
          echo "============================================"
          echo ""
          echo "Repository: {{ jobs['detect-repo'].outputs.repo_root }}"
          echo "Branch: {{ jobs['detect-repo'].outputs.default_branch }}"
          echo ""

          if "{{ jobs['install-hooks'].outputs.hooks_installed }}" != "0":
            echo "--- Pre-commit Hooks ---"
            echo "Config: {{ jobs['install-hooks'].outputs.config_path }}"
            echo "Hooks: {{ jobs['install-hooks'].outputs.hooks_installed }} scanner(s)"
            echo "Mode: {{ inputs.scan_mode }}"
            echo ""

          if "{{ jobs['baseline-scan'].outputs.findings_count }}" != "0":
            echo "--- Baseline Scan ---"
            echo "Findings: {{ jobs['baseline-scan'].outputs.findings_count }}"
            echo "Report: {{ jobs['baseline-scan'].outputs.baseline_file }}"
            echo ""

          if "{{ inputs.generate_ci }}" == "true":
            echo "--- CI Integration ---"
            echo "Platform: {{ jobs['ci-template'].outputs.ci_platform }}"
            echo "Pipeline: {{ jobs['ci-template'].outputs.ci_file }}"
            echo ""

          echo "Next steps:"
          echo "  1. Review findings in baseline report"
          echo "  2. Add false positives to .gitleaksignore"
          echo "  3. Run: pre-commit install --hook-type {{ inputs.scan_mode }}"
          echo "  4. Commit the .pre-commit-config.yaml to the repo"
          echo "============================================"
        log-stdout: "{{ inputs.log_output | default(true) }}"
