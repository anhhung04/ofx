name: docker-lab
description: 'Spin up a disposable Docker Compose security lab environment with

  common vulnerable targets (DVWA, Juice Shop, Metasploitable, etc.)

  for authorized penetration testing practice. Supports custom

  compose files and automatic teardown.

  '
tags:
- setup
- docker
- lab
- training
- environment
dispatch:
  inputs:
    log_command:
      type: string
      default: 'true'
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: 'true'
      description: Enable stdout output log files for steps when set to true/false.
    lab_name:
      type: string
      default: ofx-lab
      description: Project name for the Docker Compose lab
      alias: n
    compose_file:
      type: string
      default: ''
      description: Path to custom docker-compose.yml (generates default lab if empty)
    targets:
      type: string
      default: juice-shop,dvwa
      description: Comma-separated list of pre-configured targets to include
    network:
      type: string
      default: 172.20.0.0/24
      description: Subnet for the lab network
    expose_ports:
      type: boolean
      default: true
      description: Expose container ports on host interfaces
    auto_teardown:
      type: boolean
      default: false
      description: Automatically destroy lab after workflow completes
    teardown_delay:
      type: number
      default: 3600
      description: Seconds to wait before teardown (only if auto_teardown is true)
jobs:
  validate:
    name: Validate Prerequisites
    outputs:
      docker_version: '{{ steps["check-docker"].outputs.docker_version | default("unknown",
        true) }}'
      compose_version: '{{ steps["check-compose"].outputs.compose_version | default("unknown",
        true) }}'
      lab_dir: '{{ steps["prepare-dir"].outputs.lab_dir | default("", true) }}'
    steps:
    - name: check-docker
      continue-on-error: true
      module: modules/check_docker.py::run
    - name: check-compose
      module: modules/check_compose.py::run
    - name: prepare-dir
      module: modules/prepare_dir.py::run
  generate-compose:
    name: Generate Docker Compose Configuration
    needs:
    - validate
    outputs:
      compose_path: '{{ steps["write-compose"].outputs.compose_path | default("",
        true) }}'
      target_list: '{{ steps["write-compose"].outputs.target_list | default("", true)
        }}'
    steps:
    - name: write-compose
      module: modules/write_compose.py::run
      with:
        lab_dir: "{{ jobs.validate.outputs.lab_dir }}"
  launch-lab:
    name: Launch Lab Environment
    needs:
    - generate-compose
    outputs:
      containers: '{{ steps["launch"].outputs.containers | default("0", true) }}'
      endpoints: '{{ steps["collect-endpoints"].outputs.endpoints | default("", true)
        }}'
    steps:
    - name: launch
      retry: 2
      retry-delay: 10
      module: modules/launch.py::run
      with:
        compose_path: "{{ jobs.generate-compose.outputs.compose_path }}"
    - name: collect-endpoints
      module: modules/collect_endpoints.py::run
  verify:
    name: Verify Lab Health
    needs:
    - launch-lab
    outputs:
      healthy: '{{ steps["health-check"].outputs.healthy | default("0", true) }}'
      failed: '{{ steps["health-check"].outputs.failed | default("0", true) }}'
    steps:
    - name: health-check
      continue-on-error: true
      module: modules/health_check.py::run
  summary:
    name: Lab Summary
    needs:
    - verify
    steps:
    - name: print-info
      module: shell
      with:
        cmd: 'echo "============================================"

          echo " DOCKER LAB: {{ inputs.lab_name }}"

          echo "============================================"

          echo ""

          echo "Targets: {{ jobs[''generate-compose''].outputs.target_list }}"

          echo "Containers: {{ jobs[''launch-lab''].outputs.containers }}"

          echo "Healthy: {{ jobs[''verify''].outputs.healthy }}"

          echo ""

          echo "Endpoints:"

          echo "{{ jobs[''launch-lab''].outputs.endpoints }}"

          echo ""

          echo "Management:"

          echo "  docker compose -p {{ inputs.lab_name }} ps"

          echo "  docker compose -p {{ inputs.lab_name }} logs -f"

          echo "  docker compose -p {{ inputs.lab_name }} down"

          echo ""

          echo "Compose file: {{ jobs[''generate-compose''].outputs.compose_path }}"

          echo "============================================"

          '
      log-stdout: '{{ inputs.log_output | default(true) }}'
  teardown:
    name: Teardown Lab
    needs:
    - verify
    run_if: '{{ inputs.auto_teardown }}'
    steps:
    - name: wait-and-destroy
      log-stdout: '{{ inputs.log_output | default(true) }}'
      module: modules/wait_and_destroy.py::run
      with:
        compose_path: "{{ jobs['generate-compose'].outputs.compose_path }}"
