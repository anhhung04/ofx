name: proxy-config
description: 'Configure proxy chains, VPN routing, and SSH tunneling for

  authorized red team operations. Sets up proxychains, torsocks,

  SSH dynamic forwarding, and network namespace isolation.

  '
tags:
- setup
- proxy
- tunnel
- opsec
- network
dispatch:
  inputs:
    log_command:
      type: string
      default: 'true'
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: 'true'
      description: Enable stdout output log files for steps when set to true/false.
    mode:
      type: string
      default: proxychains
      description: 'Proxy mode: proxychains, tor, ssh-tunnel, vpn, or all'
    proxy_host:
      type: string
      default: 127.0.0.1
      description: Proxy server hostname/IP
    proxy_port:
      type: string
      default: '9050'
      description: Proxy server port
    proxy_type:
      type: string
      default: socks5
      description: 'Proxy type: socks4, socks5, http, https'
    ssh_host:
      type: string
      default: ''
      description: SSH jump host for tunnel mode (requires key-based auth)
    ssh_port:
      type: string
      default: '22'
      description: SSH port for tunnel mode
    ssh_user:
      type: string
      default: root
      description: SSH username for tunnel mode
    chain_type:
      type: string
      default: strict_chain
      description: 'Proxychains mode: strict_chain, dynamic_chain, random_chain'
    chain_len:
      type: number
      default: 1
      description: Number of proxy hops for dynamic/random chain
    quiet_mode:
      type: boolean
      default: false
      description: Suppress proxychains noise (quiet_mode)
jobs:
  proxychains:
    name: Configure Proxychains
    run_if: '{{ inputs.mode == ''proxychains'' or inputs.mode == ''all'' }}'
    outputs:
      config_path: '{{ steps["write-config"].outputs.config_path | default("", true)
        }}'
      proxy_list: '{{ steps["write-config"].outputs.proxy_list | default("", true)
        }}'
    steps:
    - name: write-config
      module: modules/write_config.py::run
  tor-setup:
    name: Configure TOR Routing
    run_if: '{{ inputs.mode == ''tor'' or inputs.mode == ''all'' }}'
    outputs:
      tor_status: '{{ steps["check-tor"].outputs.tor_status | default("not-running",
        true) }}'
      tor_socks: '{{ steps["check-tor"].outputs.tor_socks | default("", true) }}'
    steps:
    - name: test-tor
      module: modules/test_tor.py::run
      with:
        tor_socks: "{{ steps['check-tor'].outputs.tor_socks }}"
  ssh-tunnel:
    name: Configure SSH Tunnel
    run_if: '{{ inputs.ssh_host }}'
    outputs:
      tunnel_pid: '{{ steps["start-tunnel"].outputs.tunnel_pid | default("", true)
        }}'
      local_port: '{{ steps["start-tunnel"].outputs.local_port | default("", true)
        }}'
    steps:
    - name: start-tunnel
      continue-on-error: true
      module: modules/start_tunnel.py::run
  vpn-check:
    name: Verify VPN Connectivity
    run_if: '{{ inputs.mode == ''vpn'' or inputs.mode == ''all'' }}'
    outputs:
      vpn_active: '{{ steps["check-vpn"].outputs.vpn_active | default("false", true)
        }}'
      external_ip: '{{ steps["check-vpn"].outputs.external_ip | default("", true)
        }}'
    steps:
    - name: check-vpn
      continue-on-error: true
      module: modules/check_vpn.py::run
  summary:
    name: Proxy Configuration Summary
    needs:
    - proxychains
    - tor-setup
    - ssh-tunnel
    - vpn-check
    steps:
    - name: report
      module: shell
      with:
        cmd: 'echo "============================================"

          echo " PROXY/TUNNEL CONFIGURATION"

          echo "============================================"

          echo ""

          echo "Mode: {{ inputs.mode }}"


          {% if inputs.mode in [''proxychains'', ''all''] %}

          echo ""

          echo "--- Proxychains ---"

          echo "Config: {{ jobs[''proxychains''].outputs.config_path | default(''N/A'',
          true) }}"

          echo "Proxy:  {{ jobs[''proxychains''].outputs.proxy_list | default(''N/A'',
          true) }}"

          echo "Usage:  proxychains4 -f {{ jobs[''proxychains''].outputs.config_path
          }} <command>"

          {% endif %}


          {% if inputs.mode in [''tor'', ''all''] %}

          echo ""

          echo "--- TOR ---"

          echo "Status: {{ jobs[''tor-setup''].outputs.tor_status | default(''N/A'',
          true) }}"

          echo "SOCKS:  {{ jobs[''tor-setup''].outputs.tor_socks | default(''N/A'',
          true) }}"

          echo "Usage:  torsocks <command>"

          {% endif %}


          {% if inputs.mode in [''ssh-tunnel'', ''all''] and inputs.ssh_host %}

          echo ""

          echo "--- SSH Tunnel ---"

          echo "Local:  localhost:{{ jobs[''ssh-tunnel''].outputs.local_port | default(''N/A'',
          true) }} (PID: {{ jobs[''ssh-tunnel''].outputs.tunnel_pid | default(''N/A'',
          true) }})"

          echo "Usage:  proxychains4 -s localhost:{{ jobs[''ssh-tunnel''].outputs.local_port
          }} <command>"

          {% endif %}


          {% if inputs.mode in [''vpn'', ''all''] %}

          echo ""

          echo "--- VPN ---"

          echo "Active: {{ jobs[''vpn-check''].outputs.vpn_active | default(''N/A'',
          true) }}"

          echo "IP:     {{ jobs[''vpn-check''].outputs.external_ip | default(''N/A'',
          true) }}"

          {% endif %}

          echo ""

          echo "============================================"

          '
      log-stdout: '{{ inputs.log_output | default(true) }}'
