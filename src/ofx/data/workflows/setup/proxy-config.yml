name: proxy-config
description: 'Configure proxy chains, VPN routing, and SSH tunneling for

  authorized red team operations. Sets up proxychains, torsocks,

  SSH dynamic forwarding, and network namespace isolation.

  '
tags:
- setup
- proxy
- tunnel
- opsec
- network
dispatch:
  inputs:
    log_command:
      type: string
      default: 'true'
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: 'true'
      description: Enable stdout output log files for steps when set to true/false.
    mode:
      type: string
      default: proxychains
      description: 'Proxy mode: proxychains, tor, ssh-tunnel, vpn, or all'
    proxy_host:
      type: string
      default: 127.0.0.1
      description: Proxy server hostname/IP
    proxy_port:
      type: string
      default: '9050'
      description: Proxy server port
    proxy_type:
      type: string
      default: socks5
      description: 'Proxy type: socks4, socks5, http, https'
    ssh_host:
      type: string
      default: ''
      description: SSH jump host for tunnel mode (requires key-based auth)
    ssh_port:
      type: string
      default: '22'
      description: SSH port for tunnel mode
    ssh_user:
      type: string
      default: root
      description: SSH username for tunnel mode
    chain_type:
      type: string
      default: strict_chain
      description: 'Proxychains mode: strict_chain, dynamic_chain, random_chain'
    chain_len:
      type: number
      default: 1
      description: Number of proxy hops for dynamic/random chain
    quiet_mode:
      type: boolean
      default: false
      description: Suppress proxychains noise (quiet_mode)
jobs:
  proxychains:
    name: Configure Proxychains
    run_if: '{{ inputs.mode == ''proxychains'' or inputs.mode == ''all'' }}'
    outputs:
      config_path: '{{ steps["write-config"].outputs.config_path | default("", true)
        }}'
      proxy_list: '{{ steps["write-config"].outputs.proxy_list | default("", true)
        }}'
    steps:
    - name: write-config
      script: 'import os, pathlib


        home = pathlib.Path(os.path.expanduser("~"))

        config_dir = home / ".ofx" / "proxy"

        config_dir.mkdir(parents=True, exist_ok=True)

        config_path = config_dir / "proxychains.conf"


        proxy_host = "{{ inputs.proxy_host }}"

        proxy_port = "{{ inputs.proxy_port }}"

        proxy_type = "{{ inputs.proxy_type }}"

        chain_type = "{{ inputs.chain_type }}"

        chain_len = {{ inputs.chain_len }}

        quiet = {{ inputs.quiet_mode | lower }}


        config = f"""# OFX Proxychains Configuration

        # Generated by ofx flow run proxy-config

        # Mode: {chain_type}


        {"quiet_mode" if quiet else "#quiet_mode"}


        # Chain type

        {chain_type}


        # Proxy DNS requests - no leak for DNS data

        proxy_dns


        # Dynamic chain length

        chain_len = {chain_len}


        # Remote DNS subnet

        remote_dns_subnet 224


        # Timeout (ms)

        tcp_read_time_out 15000

        tcp_connect_time_out 8000


        [ProxyList]

        {proxy_type} {proxy_host} {proxy_port}

        """


        config_path.write_text(config)

        config_path.chmod(0o600)

        add_outputs(config_path=str(config_path), proxy_list=f"{proxy_type}://{proxy_host}:{proxy_port}")

        print(f"Proxychains config: {config_path}")

        print(f"Proxy: {proxy_type}://{proxy_host}:{proxy_port}")

        print(f"Chain: {chain_type} (length={chain_len})")

        '
  tor-setup:
    name: Configure TOR Routing
    run_if: '{{ inputs.mode == ''tor'' or inputs.mode == ''all'' }}'
    outputs:
      tor_status: '{{ steps["check-tor"].outputs.tor_status | default("not-running",
        true) }}'
      tor_socks: '{{ steps["check-tor"].outputs.tor_socks | default("", true) }}'
    steps:
    - name: test-tor
      script: "import urllib.request, socket, json\n\nsocks_addr = \"{{ steps['check-tor'].outputs.tor_socks\
        \ }}\"\nif not socks_addr:\n    print(\"TOR SOCKS address not available\"\
        )\nelse:\n    host, port = socks_addr.split(\":\")\n    print(f\"TOR endpoint:\
        \ {host}:{port}\")\n    print(\"Test with: curl --socks5-hostname {host}:{port}\
        \ https://check.torproject.org/api/ip\")\n"
  ssh-tunnel:
    name: Configure SSH Tunnel
    run_if: '{{ inputs.ssh_host }}'
    outputs:
      tunnel_pid: '{{ steps["start-tunnel"].outputs.tunnel_pid | default("", true)
        }}'
      local_port: '{{ steps["start-tunnel"].outputs.local_port | default("", true)
        }}'
    steps:
    - name: start-tunnel
      continue-on-error: true
      script: "import subprocess, tempfile, os\nresult = subprocess.run('SSH_HOST=\"\
        {{ inputs.ssh_host }}\" SSH_PORT=\"{{ inputs.ssh_port }}\" SSH_USER=\"{{ inputs.ssh_user\
        \ }}\" LOCAL_PORT=1080 echo \"[*] Establishing SSH dynamic tunnel to $SSH_USER@$SSH_HOST:$SSH_PORT\"\
        \ ssh -f -N -D $LOCAL_PORT \\\\ -p \"$SSH_PORT\" \\\\ -o StrictHostKeyChecking=accept-new\
        \ \\\\ -o ServerAliveInterval=60 \\\\ \"$SSH_USER@$SSH_HOST\" TUNNEL_PID=$(pgrep\
        \ -f \"ssh.*-D $LOCAL_PORT\" | head -1) if [ -n \"$TUNNEL_PID\" ]; then echo\
        \ \"tunnel_pid=$TUNNEL_PID\" echo \"local_port=$LOCAL_PORT\" echo \"[+] SSH\
        \ tunnel active: SOCKS5 on localhost:$LOCAL_PORT (PID: $TUNNEL_PID)\" else\
        \ echo \"[!] Failed to establish SSH tunnel\" fi', shell=True, capture_output=True,\
        \ text=True)\nprint(result.stdout)\nif result.stderr:\n    print(result.stderr,\
        \ file=__import__(\"sys\").stderr)"
  vpn-check:
    name: Verify VPN Connectivity
    run_if: '{{ inputs.mode == ''vpn'' or inputs.mode == ''all'' }}'
    outputs:
      vpn_active: '{{ steps["check-vpn"].outputs.vpn_active | default("false", true)
        }}'
      external_ip: '{{ steps["check-vpn"].outputs.external_ip | default("", true)
        }}'
    steps:
    - name: check-vpn
      continue-on-error: true
      script: "import subprocess, tempfile, os\nresult = subprocess.run('VPN_ACTIVE=\"\
        false\" EXTERNAL_IP=\"\" # Check common VPN interfaces for iface in tun0 utun0\
        \ ppp0 wg0; do if ip link show \"$iface\" 2 then VPN_ACTIVE=\"true\" EXTERNAL_IP=$(ip\
        \ -4 addr show \"$iface\" | grep -oP \\'(?<=inet\\\\s)\\\\d+(\\\\.\\\\d+){3}\\\
        ' | head -1) break fi done # Fallback: check via external service if [ \"\
        $VPN_ACTIVE\" != \"true\" ]; then EXTERNAL_IP=$(curl -s --max-time 5 https://ifconfig.me',\
        \ shell=True, capture_output=True, text=True)\nprint(result.stdout)\nif result.stderr:\n\
        \    print(result.stderr, file=__import__(\"sys\").stderr)"
  summary:
    name: Proxy Configuration Summary
    needs:
    - proxychains
    - tor-setup
    - ssh-tunnel
    - vpn-check
    steps:
    - name: report
      run: 'echo "============================================"

        echo " PROXY/TUNNEL CONFIGURATION"

        echo "============================================"

        echo ""

        echo "Mode: {{ inputs.mode }}"


        {% if inputs.mode in [''proxychains'', ''all''] %}

        echo ""

        echo "--- Proxychains ---"

        echo "Config: {{ jobs[''proxychains''].outputs.config_path | default(''N/A'',
        true) }}"

        echo "Proxy:  {{ jobs[''proxychains''].outputs.proxy_list | default(''N/A'',
        true) }}"

        echo "Usage:  proxychains4 -f {{ jobs[''proxychains''].outputs.config_path
        }} <command>"

        {% endif %}


        {% if inputs.mode in [''tor'', ''all''] %}

        echo ""

        echo "--- TOR ---"

        echo "Status: {{ jobs[''tor-setup''].outputs.tor_status | default(''N/A'',
        true) }}"

        echo "SOCKS:  {{ jobs[''tor-setup''].outputs.tor_socks | default(''N/A'',
        true) }}"

        echo "Usage:  torsocks <command>"

        {% endif %}


        {% if inputs.mode in [''ssh-tunnel'', ''all''] and inputs.ssh_host %}

        echo ""

        echo "--- SSH Tunnel ---"

        echo "Local:  localhost:{{ jobs[''ssh-tunnel''].outputs.local_port | default(''N/A'',
        true) }} (PID: {{ jobs[''ssh-tunnel''].outputs.tunnel_pid | default(''N/A'',
        true) }})"

        echo "Usage:  proxychains4 -s localhost:{{ jobs[''ssh-tunnel''].outputs.local_port
        }} <command>"

        {% endif %}


        {% if inputs.mode in [''vpn'', ''all''] %}

        echo ""

        echo "--- VPN ---"

        echo "Active: {{ jobs[''vpn-check''].outputs.vpn_active | default(''N/A'',
        true) }}"

        echo "IP:     {{ jobs[''vpn-check''].outputs.external_ip | default(''N/A'',
        true) }}"

        {% endif %}

        echo ""

        echo "============================================"

        '
      log-stdout: '{{ inputs.log_output | default(true) }}'
