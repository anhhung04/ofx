# yaml-language-server: $schema=~/.ofx/workflow_schema.json
name: email-osint
description: 'Email OSINT — discovers email addresses, checks for breached credentials, and identifies accounts across platforms.

  '
tags:
- osint
- email
- credentials
- breach
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target domain or email address
      alias: t
jobs:
  email-harvest:
    name: Email Harvesting
    steps:
    - name: theharvester-search
      run: |
        theHarvester -d {{ inputs.target }} -b all -l 500 2>/dev/null | tee /tmp/harvester-output.txt
      continue-on-error: true
    - name: collect-emails
      script: |
        import re

        emails = set()
        target = '{{ inputs.target }}'

        # If input is an email address, add it directly
        if '@' in target:
            emails.add(target)

        # Parse theHarvester output
        try:
            with open('/tmp/harvester-output.txt') as f:
                content = f.read()
            found = re.findall(r'[\w.+-]+@[\w-]+\.[\w.-]+', content)
            emails.update(found)
        except FileNotFoundError:
            pass

        with open('/tmp/ofx_emailosint_emails.txt', 'w') as tf:
            tf.write('\n'.join(sorted(emails)))

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"email_file=/tmp/ofx_emailosint_emails.txt\n")
            f.write(f"email_count={len(emails)}\n")

        print(f"Harvested {len(emails)} email addresses")
  breach-search:
    name: Breach Search
    needs:
    - email-harvest
    steps:
    - task: h8mail
      name: h8mail-search
      with:
        target: '{{ jobs[''email-harvest''].outputs.email_file | default(inputs.target, true) }}'
      continue-on-error: true
      log-stdout: true
    - name: export-breaches
      script: |
        import json

        users_found = {{ users(steps[0].outputs.typed_outputs) | tojson }}

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"breach_count={len(users_found)}\n")

        print(f"Found {len(users_found)} breach results")
      log-stdout: true
  account-check:
    name: Account Discovery
    needs:
    - email-harvest
    steps:
    - name: holehe-check
      run: |
        holehe {{ jobs['email-harvest'].outputs.email_file | default(inputs.target, true) }} --no-color 2>/dev/null | tee /tmp/holehe-output.txt
      continue-on-error: true
    - name: collect-accounts
      script: |
        accounts = []
        try:
            with open('/tmp/holehe-output.txt') as f:
                for line in f:
                    line = line.strip()
                    if '[+]' in line:
                        accounts.append(line)
        except FileNotFoundError:
            pass

        with open('/tmp/ofx_emailosint_accounts.txt', 'w') as tf:
            tf.write('\n'.join(accounts))

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"account_count={len(accounts)}\n")
            f.write(f"account_file=/tmp/ofx_emailosint_accounts.txt\n")

        print(f"Found {len(accounts)} registered accounts")
  summary:
    name: Email OSINT Summary
    needs:
    - breach-search
    - account-check
    steps:
    - name: report
      run: |
        echo "================================="
        echo " Email OSINT: {{ inputs.target }}"
        echo "================================="
        echo "Emails harvested: {{ jobs['email-harvest'].outputs.email_count }}"
        echo "Breach results: {{ jobs['breach-search'].outputs.breach_count }}"
        echo "Accounts found: {{ jobs['account-check'].outputs.account_count }}"
      log-stdout: true
