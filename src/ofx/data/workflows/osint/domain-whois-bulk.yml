name: domain-whois-bulk
description: |
  Bulk domain WHOIS intelligence — lookup registrar, creation date,
  expiry, nameservers, and registrant info for multiple domains.
tags: [osint, whois, domain, bulk]
dispatch:
  inputs:
    targets:
      required: true
      type: string
      description: Domains (comma-separated or @file)

jobs:
  whois:
    name: Bulk WHOIS Lookup
    outputs:
      results_file: '{{ steps["bulk-whois"].outputs.results_file | default("", true) }}'
      domain_count: '{{ steps["bulk-whois"].outputs.domain_count | default("", true) }}'
    steps:
    - name: bulk-whois
      script: |
        import subprocess
        import re
        import json
        from pathlib import Path

        raw = '''{{ inputs.targets }}'''
        if Path(raw).is_file():
            domains = [d.strip() for d in Path(raw).read_text().splitlines() if d.strip()]
        else:
            domains = [d.strip() for d in raw.replace(',', '\n').splitlines() if d.strip()]

        print(f"=== BULK WHOIS: {len(domains)} domains ===\n")

        results = []
        for domain in domains[:50]:
            info = {'domain': domain}
            try:
                proc = subprocess.run(['whois', domain], capture_output=True, text=True, timeout=15)
                data = proc.stdout

                fields = {
                    'registrar': r'(?:Registrar|registrar):\s*(.+)',
                    'created': r'(?:Creat|Registration Date|creat).*?:\s*(.+)',
                    'expires': r'(?:Expir|Registry Expiry|expir).*?:\s*(.+)',
                    'updated': r'(?:Updated|Last Modified|updat).*?:\s*(.+)',
                    'nameservers': r'(?:Name Server|nserver|nameserver):\s*(.+)',
                    'org': r'(?:Registrant Organization|org-name|OrgName):\s*(.+)',
                    'country': r'(?:Registrant Country|country|Country):\s*(.+)',
                }
                for key, pattern in fields.items():
                    match = re.search(pattern, data, re.IGNORECASE)
                    if match:
                        info[key] = match.group(1).strip()

                print(f"  {domain}")
                print(f"    Registrar: {info.get('registrar', '?')}")
                print(f"    Created: {info.get('created', '?')}")
                print(f"    Expires: {info.get('expires', '?')}")
                print(f"    Org: {info.get('org', '?')}")
                print()
            except Exception as e:
                info['error'] = str(e)
                print(f"  {domain}: Error - {e}\n")

            results.append(info)

        out_file = '/tmp/ofx_whois_bulk.json'
        Path(out_file).write_text(json.dumps(results, indent=2))

        add_outputs(results_file=out_file, domain_count=len(results))
      log-stdout: true
