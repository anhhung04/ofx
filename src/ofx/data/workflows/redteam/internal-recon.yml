name: internal-recon
description: 'Internal network reconnaissance — host discovery, port scanning, service fingerprinting, and initial enumeration for internal pentests.

  '
tags:
- redteam
- internal
- recon
- network
- ad
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target CIDR or IP range
      alias: t
    domain:
      type: string
      default: ''
      description: AD domain if known
jobs:
  host-discovery:
    name: Host Discovery
    outputs:
      alive_file: '{{ steps["collect-alive"].outputs.alive_file }}'
      alive_count: '{{ steps["collect-alive"].outputs.alive_count }}'
    steps:
    - name: fping-sweep
      run: |
        fping -a -g {{ inputs.target }} 2>/dev/null | tee /tmp/alive-hosts.txt
      continue-on-error: true
    - name: collect-alive
      script: |
        hosts = set()
        try:
            with open('/tmp/alive-hosts.txt') as f:
                for line in f:
                    ip = line.strip()
                    if ip:
                        hosts.add(ip)
        except FileNotFoundError:
            pass

        with open('/tmp/ofx_alive_hosts.txt', 'w') as f:
            f.write('\n'.join(sorted(hosts)))

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"alive_file=/tmp/ofx_alive_hosts.txt\n")
            f.write(f"alive_count={len(hosts)}\n")

        print(f"Discovered {len(hosts)} alive hosts")
  port-scan:
    name: Port Scanning
    outputs:
      ports_file: '{{ steps["collect-ports"].outputs.ports_file }}'
      port_count: '{{ steps["collect-ports"].outputs.port_count }}'
      scan_targets_file: '{{ steps["collect-ports"].outputs.scan_targets_file }}'
    needs:
    - host-discovery
    steps:
    - name: rustscan-fast
      run: |
        cat {{ jobs['host-discovery'].outputs.alive_file }} > /tmp/scan-targets.txt
        rustscan -a /tmp/scan-targets.txt --ulimit 5000 -b 1000 2>/dev/null | tee /tmp/rustscan-output.txt
      continue-on-error: true
    - task: naabu
      timeout: 10
      name: naabu-precision
      with:
        target: '{{ jobs[''host-discovery''].outputs.alive_file }}'
        top_ports: '1000'
        rate: 1000
      continue-on-error: true
    - name: collect-ports
      script: |
        import re

        ports = set()
        hosts_with_ports = {}

        # Parse naabu results
        naabu_out = {{ steps["naabu-precision"].outputs.typed_outputs | tojson }}
        for item in naabu_out:
            if item.get('_type') == 'port':
                host = item.get('host') or item.get('ip', '')
                port = item.get('port', '')
                if host and port:
                    ports.add(f"{host}:{port}")
                    hosts_with_ports.setdefault(host, set()).add(str(port))

        # Parse rustscan fallback
        try:
            with open('/tmp/rustscan-output.txt') as f:
                for line in f:
                    match = re.search(r'(\d+\.\d+\.\d+\.\d+):(\d+)', line)
                    if match:
                        host, port = match.group(1), match.group(2)
                        ports.add(f"{host}:{port}")
                        hosts_with_ports.setdefault(host, set()).add(port)
        except FileNotFoundError:
            pass

        # Build nmap-compatible target list
        nmap_targets = []
        for host, host_ports in hosts_with_ports.items():
            port_str = ','.join(sorted(host_ports, key=int))
            nmap_targets.append(f"{host}:{port_str}")

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            open('/tmp/ofx_intrecon_ports.txt', 'w').write('\n'.join(sorted(ports)))
            f.write(f"ports_file=/tmp/ofx_intrecon_ports.txt\n")
            f.write(f"port_count={len(ports)}\n")
            open('/tmp/ofx_intrecon_targets.txt', 'w').write('\n'.join(nmap_targets))
            f.write(f"scan_targets_file=/tmp/ofx_intrecon_targets.txt\n")

        print(f"Found {len(ports)} open ports across {len(hosts_with_ports)} hosts")
  service-detect:
    name: Service Detection
    outputs:
      service_count: '{{ steps["collect-services"].outputs.service_count }}'
      http_urls_file: '{{ steps["collect-services"].outputs.http_urls_file }}'
      http_count: '{{ steps["collect-services"].outputs.http_count }}'
    needs:
    - port-scan
    steps:
    - name: nmap-service
      run: |
        cat {{ jobs['host-discovery'].outputs.alive_file }} > /tmp/nmap-hosts.txt
        nmap -sV -iL /tmp/nmap-hosts.txt -oN /tmp/nmap-services.txt 2>/dev/null | tee /tmp/nmap-output.txt
      continue-on-error: true
    - task: httpx
      timeout: 10
      name: http-probe
      with:
        target: '{{ jobs[''host-discovery''].outputs.alive_file }}'
        tech_detect: true
        status_code: true
        title: true
      continue-on-error: true
    - name: collect-services
      script: |
        import re

        services = []
        http_targets = set()

        # Parse nmap services
        try:
            with open('/tmp/nmap-services.txt') as f:
                for line in f:
                    match = re.search(r'(\d+)/tcp\s+open\s+(\S+)\s*(.*)', line)
                    if match:
                        port, svc, version = match.groups()
                        services.append(f"{port}/tcp {svc} {version.strip()}")
        except FileNotFoundError:
            pass

        # Collect HTTP targets from httpx
        httpx_out = {{ steps["http-probe"].outputs.typed_outputs | tojson }}
        for item in httpx_out:
            url = item.get('url', '')
            if url:
                http_targets.add(url)

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"service_count={len(services)}\n")
            open('/tmp/ofx_intrecon_httpurls.txt', 'w').write('\n'.join(sorted(http_targets)))
            f.write(f"http_urls_file=/tmp/ofx_intrecon_httpurls.txt\n")
            f.write(f"http_count={len(http_targets)}\n")

        print(f"Services detected: {len(services)}, HTTP targets: {len(http_targets)}")
  web-enum:
    name: Web Enumeration
    outputs:
      web_tech_count: '{{ steps["collect-web"].outputs.web_tech_count }}'
    needs:
    - service-detect
    steps:
    - name: whatweb-scan
      run: |
        cat {{ jobs['service-detect'].outputs.http_urls_file | default('', true) }} 2>/dev/null | head -50 | while read url; do
          whatweb -a 3 "$url" --color=never 2>/dev/null
        done | tee /tmp/whatweb-output.txt
      continue-on-error: true
    - name: gowitness-screenshots
      run: |
        cat {{ jobs['service-detect'].outputs.http_urls_file | default(', true) }} > /tmp/gowitness-targets.txt 2>/dev/null
        gowitness scan file -f /tmp/gowitness-targets.txt --screenshot-path /tmp/gowitness-shots 2>/dev/null || true
      continue-on-error: true
    - name: collect-web
      script: |
        import re

        techs = set()
        try:
            with open('/tmp/whatweb-output.txt') as f:
                content = f.read()
            matches = re.findall(r'\[([^\]]+)\]', content)
            for m in matches:
                m = m.strip()
                if m and not m.startswith('http'):
                    techs.add(m)
        except FileNotFoundError:
            pass

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"web_tech_count={len(techs)}\n")

        print(f"Web technologies detected: {len(techs)}")
  ad-detect:
    name: AD Detection
    outputs:
      ad_domains_file: '{{ steps["collect-ad-info"].outputs.ad_domains_file }}'
      dcs_file: '{{ steps["collect-ad-info"].outputs.dcs_file }}'
      dc_count: '{{ steps["collect-ad-info"].outputs.dc_count }}'
    needs:
    - host-discovery
    steps:
    - name: nxc-smb-scan
      run: |
        cat {{ jobs['host-discovery'].outputs.alive_file }} > /tmp/smb-targets.txt
        netexec smb /tmp/smb-targets.txt 2>/dev/null | tee /tmp/nxc-smb-scan.txt
      continue-on-error: true
    - name: collect-ad-info
      script: |
        import re

        domains = set()
        dcs = set()

        try:
            with open('/tmp/nxc-smb-scan.txt') as f:
                for line in f:
                    # Detect domain from SMB output
                    match = re.search(r'SMB\s+(\S+)\s+445\s+\S+\s+.*?domain:(\S+)', line, re.IGNORECASE)
                    if match:
                        ip = match.group(1)
                        domain = match.group(2).rstrip(')')
                        domains.add(domain)
                        if 'DC' in line.upper() or 'PDC' in line.upper():
                            dcs.add(ip)
        except FileNotFoundError:
            pass

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            open('/tmp/ofx_intrecon_domains.txt', 'w').write('\n'.join(sorted(domains)))
            f.write(f"ad_domains_file=/tmp/ofx_intrecon_domains.txt\n")
            open('/tmp/ofx_intrecon_dcs.txt', 'w').write('\n'.join(sorted(dcs)))
            f.write(f"dcs_file=/tmp/ofx_intrecon_dcs.txt\n")
            f.write(f"dc_count={len(dcs)}\n")

        print(f"AD domains: {', '.join(domains) if domains else 'none detected'}")
        print(f"Domain controllers: {len(dcs)}")
  summary:
    name: Internal Recon Summary
    needs:
    - service-detect
    - web-enum
    - ad-detect
    steps:
    - name: report
      run: |
        echo "======================================================"
        echo " INTERNAL RECON COMPLETE: {{ inputs.target }}"
        echo "======================================================"
        echo ""
        echo "--- Host Discovery ---"
        echo "Alive hosts: {{ jobs['host-discovery'].outputs.alive_count }}"
        echo ""
        echo "--- Port Scanning ---"
        echo "Open ports: {{ jobs['port-scan'].outputs.port_count }}"
        echo ""
        echo "--- Services ---"
        echo "Services detected: {{ jobs['service-detect'].outputs.service_count }}"
        echo "HTTP targets: {{ jobs['service-detect'].outputs.http_count }}"
        echo ""
        echo "--- Web ---"
        echo "Technologies detected: {{ jobs['web-enum'].outputs.web_tech_count }}"
        echo ""
        echo "--- Active Directory ---"
        echo "Domains found: $(cat {{ jobs['ad-detect'].outputs.ad_domains_file }} 2>/dev/null || echo 'none')"
        echo "Domain controllers: {{ jobs['ad-detect'].outputs.dc_count }}"
      log-stdout: true
    - name: export-to-project
      script: |
        import shutil
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:

            # alive hosts
            d = '{{ vars.project_hosts }}'
            Path(d).mkdir(parents=True, exist_ok=True)
            src = '''{{ jobs['host-discovery'].outputs.alive_file | default('', true) }}'''
            if src and Path(src).is_file():
                shutil.copy2(src, Path(d) / 'alive-hosts.txt')
                print('  [+] hosts/alive-hosts.txt')

            # open ports
            d = '{{ vars.project_hosts }}'
            Path(d).mkdir(parents=True, exist_ok=True)
            src = '''{{ jobs['port-scan'].outputs.ports_file | default('', true) }}'''
            if src and Path(src).is_file():
                shutil.copy2(src, Path(d) / 'open-ports.txt')
                print('  [+] hosts/open-ports.txt')

            # HTTP URLs
            d = '{{ vars.project_web }}'
            Path(d).mkdir(parents=True, exist_ok=True)
            src = '''{{ jobs['service-detect'].outputs.http_urls_file | default('', true) }}'''
            if src and Path(src).is_file():
                shutil.copy2(src, Path(d) / 'http-urls.txt')
                print('  [+] web/http-urls.txt')

            # AD domains
            d = '{{ vars.project_hosts }}'
            Path(d).mkdir(parents=True, exist_ok=True)
            src = '''{{ jobs['ad-detect'].outputs.ad_domains_file | default('', true) }}'''
            if src and Path(src).is_file():
                shutil.copy2(src, Path(d) / 'ad-domains.txt')
                print('  [+] hosts/ad-domains.txt')

            # domain controllers
            d = '{{ vars.project_hosts }}'
            Path(d).mkdir(parents=True, exist_ok=True)
            src = '''{{ jobs['ad-detect'].outputs.dcs_file | default('', true) }}'''
            if src and Path(src).is_file():
                shutil.copy2(src, Path(d) / 'domain-controllers.txt')
                print('  [+] hosts/domain-controllers.txt')

            # Auto-export typed outputs
            all_typed = []
            for typed in [
                {{ jobs['host-discovery'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['port-scan'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['service-detect'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['web-enum'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['ad-detect'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true
