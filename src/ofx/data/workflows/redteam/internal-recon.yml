name: internal-recon
description: 'Internal network reconnaissance — host discovery, port scanning, service fingerprinting, and initial enumeration for internal pentests.

  '
tags:
- redteam
- internal
- recon
- network
- ad
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target CIDR or IP range
      alias: t
    domain:
      type: string
      default: ''
      description: AD domain if known
jobs:
  host-discovery:
    name: Host Discovery
    outputs:
      alive_file: '{{ steps["collect-alive"].outputs.alive_file | default("", true) }}'
      alive_count: '{{ steps["collect-alive"].outputs.alive_count | default("", true) }}'
    steps:
    - task: fping
      log-command: true
      name: fping-sweep
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: collect-alive
      script: |
        hosts = set()
        for item in {{ ips(steps["fping-sweep"].outputs.typed_outputs) | default([], true) | tojson }}:
            ip = item.get('ip', item.get('host', ''))
            if ip:
                hosts.add(ip)

        with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_alive_hosts.txt', 'w') as f:
            f.write('\n'.join(sorted(hosts)))

        add_outputs(alive_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_alive_hosts.txt", alive_count=len(hosts))
        print(f"Discovered {len(hosts)} alive hosts")
  port-scan:
    name: Port Scanning
    outputs:
      ports_file: '{{ steps["collect-ports"].outputs.ports_file | default("", true) }}'
      port_count: '{{ steps["collect-ports"].outputs.port_count | default("", true) }}'
      scan_targets_file: '{{ steps["collect-ports"].outputs.scan_targets_file | default("", true) }}'
      gogo_file: '{{ steps["gogo-scan"].outputs.output_file | default("", true) }}'
    needs:
    - host-discovery
    steps:
    - task: rustscan
      log-command: true
      name: rustscan-fast
      with:
        target: "{{ jobs['host-discovery'].outputs.alive_file }}"
        batch_size: 1000
        ulimit: 5000
      continue-on-error: true
    - task: naabu
      log-command: true
      name: naabu-precision
      with:
        target: "{{ jobs['host-discovery'].outputs.alive_file }}"
        top_ports: '1000'
        rate: 1000
      continue-on-error: true
    - task: gogo
      log-command: true
      name: gogo-scan
      with:
        target: "{{ jobs['host-discovery'].outputs.alive_file }}"
        ports: 'top2,win,db'
      continue-on-error: true
    - name: collect-ports
      script: |
        import re

        ports = set()
        hosts_with_ports = {}

        # Parse naabu results
        naabu_out = {{ steps["naabu-precision"].outputs.typed_outputs | tojson }}
        for item in naabu_out:
            if item.get('_type') == 'port':
                host = item.get('host') or item.get('ip', '')
                port = item.get('port', '')
                if host and port:
                    ports.add(f"{host}:{port}")
                    hosts_with_ports.setdefault(host, set()).add(str(port))

        # Parse rustscan results
        for item in {{ ports(steps["rustscan-fast"].outputs.typed_outputs) | default([], true) | tojson }}:
            host = item.get('host') or item.get('ip', '')
            port = item.get('port', '')
            if host and port:
                ports.add(f"{host}:{port}")
                hosts_with_ports.setdefault(host, set()).add(str(port))

        # Parse gogo results (ports + fingerprinted services)
        for item in {{ ports(steps["gogo-scan"].outputs.typed_outputs) | default([], true) | tojson }}:
            host = item.get('host') or item.get('ip', '')
            port = item.get('port', '')
            if host and port:
                ports.add(f"{host}:{port}")
                hosts_with_ports.setdefault(host, set()).add(str(port))

        # Build nmap-compatible target list
        nmap_targets = []
        for host, host_ports in hosts_with_ports.items():
            port_str = ','.join(sorted(host_ports, key=int))
            nmap_targets.append(f"{host}:{port_str}")

        open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_intrecon_ports.txt', 'w').write('\n'.join(sorted(ports)))
        open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_intrecon_targets.txt', 'w').write('\n'.join(nmap_targets))
        add_outputs(ports_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_intrecon_ports.txt", port_count=len(ports), scan_targets_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_intrecon_targets.txt")
        print(f"Found {len(ports)} open ports across {len(hosts_with_ports)} hosts")
  service-detect:
    name: Service Detection
    outputs:
      service_count: '{{ steps["collect-services"].outputs.service_count | default("", true) }}'
      http_urls_file: '{{ steps["collect-services"].outputs.http_urls_file | default("", true) }}'
      http_count: '{{ steps["collect-services"].outputs.http_count | default("", true) }}'
    needs:
    - port-scan
    steps:
    - task: nmap
      log-command: true
      name: nmap-service
      with:
        target: "{{ jobs['host-discovery'].outputs.alive_file }}"
        version_detection: true
      continue-on-error: true
    - task: nerva
      log-command: true
      name: nerva-fingerprint
      with:
        target: "{{ jobs['host-discovery'].outputs.alive_file }}"
      continue-on-error: true
    - task: httpx
      log-command: true
      name: http-probe
      with:
        target: "{{ jobs['host-discovery'].outputs.alive_file }}"
        tech_detect: true
        status_code: true
        title: true
      continue-on-error: true
    - name: collect-services
      script: |
        services = []
        http_targets = set()

        # Parse nmap typed outputs (Port items with service info)
        nmap_out = {{ ports(steps["nmap-service"].outputs.typed_outputs) | default([], true) | tojson }}
        for item in nmap_out:
            port = item.get('port', '')
            svc = item.get('service', item.get('protocol', ''))
            version = item.get('version', '')
            if port:
                services.append(f"{port}/tcp {svc} {version}".strip())

        # Collect HTTP targets from httpx
        httpx_out = {{ steps["http-probe"].outputs.typed_outputs | tojson }}
        for item in httpx_out:
            url = item.get('url', '')
            if url:
                http_targets.add(url)

        open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_intrecon_httpurls.txt', 'w').write('\n'.join(sorted(http_targets)))
        add_outputs(service_count=len(services), http_urls_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_intrecon_httpurls.txt", http_count=len(http_targets))
        print(f"Services detected: {len(services)}, HTTP targets: {len(http_targets)}")
  web-enum:
    name: Web Enumeration
    outputs:
      web_tech_count: '{{ steps["collect-web"].outputs.web_tech_count | default("", true) }}'
    needs:
    - service-detect
    steps:
    - name: whatweb-scan
      log-command: true
      run: |
        cat {{ jobs['service-detect'].outputs.http_urls_file | default('', true) }} 2>/dev/null | head -50 | while read url; do
          whatweb -a 3 "$url" --color=never 2>/dev/null
        done | tee ${OFX_RUN_DIR:-/tmp}/ofx_whatweb_output.txt
      continue-on-error: true
    - task: gowitness
      log-command: true
      name: gowitness-screenshots
      with:
        target: "{{ jobs['service-detect'].outputs.http_urls_file | default('', true) }}"
        screenshot_path: ${OFX_RUN_DIR:-/tmp}/ofx_gowitness_shots
      continue-on-error: true
    - name: collect-web
      script: |
        import re

        techs = set()
        try:
            with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_whatweb_output.txt') as f:
                content = f.read()
            matches = re.findall(r'\[([^\]]+)\]', content)
            for m in matches:
                m = m.strip()
                if m and not m.startswith('http'):
                    techs.add(m)
        except FileNotFoundError:
            pass

        add_outputs(web_tech_count=len(techs))
        print(f"Web technologies detected: {len(techs)}")
  ad-detect:
    name: AD Detection
    outputs:
      ad_domains_file: '{{ steps["collect-ad-info"].outputs.ad_domains_file | default("", true) }}'
      dcs_file: '{{ steps["collect-ad-info"].outputs.dcs_file | default("", true) }}'
      dc_count: '{{ steps["collect-ad-info"].outputs.dc_count | default("", true) }}'
    needs:
    - host-discovery
    steps:
    - task: netexec
      log-command: true
      name: nxc-smb-scan
      with:
        target: "{{ jobs['host-discovery'].outputs.alive_file }}"
        protocol: smb
      continue-on-error: true
    - name: collect-ad-info
      script: |
        domains = set()
        dcs = set()

        nxc_out = {{ steps["nxc-smb-scan"].outputs.typed_outputs | default([], true) | tojson }}
        for item in nxc_out:
            t = item.get('_type', '')
            if t == 'tag':
                name = item.get('name', '')
                extra = item.get('extra', {}) if isinstance(item.get('extra'), dict) else {}
                domain = extra.get('domain', '')
                host = item.get('host', '')
                if domain:
                    domains.add(domain)
                if 'DC' in name.upper() or 'PDC' in name.upper():
                    if host:
                        dcs.add(host)
            elif t == 'user_account':
                domain = item.get('domain', '')
                if domain:
                    domains.add(domain)

        # Fallback: parse stdout for domain info
        stdout = steps["nxc-smb-scan"].outputs.stdout if hasattr(steps["nxc-smb-scan"].outputs, 'stdout') else ''

        open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_intrecon_domains.txt', 'w').write('\n'.join(sorted(domains)))
        open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_intrecon_dcs.txt', 'w').write('\n'.join(sorted(dcs)))
        add_outputs(ad_domains_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_intrecon_domains.txt", dcs_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_intrecon_dcs.txt", dc_count=len(dcs))
        print(f"AD domains: {', '.join(domains) if domains else 'none detected'}")
        print(f"Domain controllers: {len(dcs)}")
  default-cred-check:
    name: Default Credential Check
    outputs:
      cred_count: '{{ steps["cred-summary"].outputs.cred_count | default("0", true) }}'
    needs:
    - port-scan
    steps:
    - task: zombie
      log-command: true
      name: zombie-brute
      with:
        gogo: '{{ jobs["port-scan"].outputs.gogo_file }}'
        target: '{{ inputs.target }}'
        threads: 50
      store-creds: true
      continue-on-error: true
    - name: cred-summary
      script: |
        accounts = {{ users(steps["zombie-brute"].outputs.typed_outputs) | default([], true) | tojson }}
        add_outputs(cred_count=len(accounts))
        if accounts:
            print(f"Found {len(accounts)} valid credential(s):")
            for a in accounts:
                print(f"  {a.get('username','')}@{a.get('host','')} ({a.get('comment','')})")
        else:
            print("No default credentials found")
  summary:
    name: Internal Recon Summary
    needs:
    - service-detect
    - web-enum
    - ad-detect
    - default-cred-check
    steps:
    - name: report
      run: |
        echo "======================================================"
        echo " INTERNAL RECON COMPLETE: {{ inputs.target }}"
        echo "======================================================"
        echo ""
        echo "--- Host Discovery ---"
        echo "Alive hosts: {{ jobs['host-discovery'].outputs.alive_count }}"
        echo ""
        echo "--- Port Scanning ---"
        echo "Open ports: {{ jobs['port-scan'].outputs.port_count }}"
        echo ""
        echo "--- Services ---"
        echo "Services detected: {{ jobs['service-detect'].outputs.service_count }}"
        echo "HTTP targets: {{ jobs['service-detect'].outputs.http_count }}"
        echo ""
        echo "--- Web ---"
        echo "Technologies detected: {{ jobs['web-enum'].outputs.web_tech_count }}"
        echo ""
        echo "--- Active Directory ---"
        echo "Domains found: $(cat {{ jobs['ad-detect'].outputs.ad_domains_file }} 2>/dev/null || echo 'none')"
        echo "Domain controllers: {{ jobs['ad-detect'].outputs.dc_count }}"
        echo ""
        echo "--- Default Credentials ---"
        echo "Credentials found: {{ jobs['default-cred-check'].outputs.cred_count | default('0', true) }}"
      log-stdout: true
    - name: export-to-project
      script: |
        import shutil
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:

            # alive hosts
            d = '{{ vars.project_hosts }}'
            Path(d).mkdir(parents=True, exist_ok=True)
            src = '''{{ jobs['host-discovery'].outputs.alive_file | default('', true) }}'''
            if src and Path(src).is_file():
                shutil.copy2(src, Path(d) / 'alive-hosts.txt')
                print('  [+] hosts/alive-hosts.txt')

            # open ports
            d = '{{ vars.project_hosts }}'
            Path(d).mkdir(parents=True, exist_ok=True)
            src = '''{{ jobs['port-scan'].outputs.ports_file | default('', true) }}'''
            if src and Path(src).is_file():
                shutil.copy2(src, Path(d) / 'open-ports.txt')
                print('  [+] hosts/open-ports.txt')

            # HTTP URLs
            d = '{{ vars.project_web }}'
            Path(d).mkdir(parents=True, exist_ok=True)
            src = '''{{ jobs['service-detect'].outputs.http_urls_file | default('', true) }}'''
            if src and Path(src).is_file():
                shutil.copy2(src, Path(d) / 'http-urls.txt')
                print('  [+] web/http-urls.txt')

            # AD domains
            d = '{{ vars.project_hosts }}'
            Path(d).mkdir(parents=True, exist_ok=True)
            src = '''{{ jobs['ad-detect'].outputs.ad_domains_file | default('', true) }}'''
            if src and Path(src).is_file():
                shutil.copy2(src, Path(d) / 'ad-domains.txt')
                print('  [+] hosts/ad-domains.txt')

            # domain controllers
            d = '{{ vars.project_hosts }}'
            Path(d).mkdir(parents=True, exist_ok=True)
            src = '''{{ jobs['ad-detect'].outputs.dcs_file | default('', true) }}'''
            if src and Path(src).is_file():
                shutil.copy2(src, Path(d) / 'domain-controllers.txt')
                print('  [+] hosts/domain-controllers.txt')

            # Auto-export typed outputs
            all_typed = []
            for typed in [
                {{ jobs['host-discovery'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['port-scan'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['service-detect'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['web-enum'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['ad-detect'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true
