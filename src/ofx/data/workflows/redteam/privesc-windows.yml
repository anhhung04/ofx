name: privesc-windows
description: |
  Windows privilege escalation enumeration — unquoted service paths,
  weak permissions, AlwaysInstallElevated, stored credentials,
  scheduled tasks, and token impersonation checks via WinRM.
tags: [redteam, privesc, windows, post-exploitation]
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target host IP
      alias: t
    user:
      required: true
      type: string
      description: WinRM username
    password:
      required: true
      type: string
      description: WinRM password

jobs:
  enum:
    name: Windows PrivEsc Enumeration
    outputs:
      enum_file: '{{ steps["privesc-checks"].outputs.enum_file | default("", true) }}'
      finding_count: '{{ steps["privesc-checks"].outputs.finding_count | default("", true) }}'
    steps:
    - name: privesc-checks
      script: |
        from ofx.api.post import RunnerRegistry
        from pathlib import Path

        runner = RunnerRegistry.create('winrm', host='{{ inputs.target }}', user='{{ inputs.user }}', password='{{ inputs.password }}')

        checks = {}
        checks['whoami'] = runner.run('whoami /all').strip()
        checks['systeminfo'] = runner.run('systeminfo').strip()
        checks['hotfixes'] = runner.run('wmic qfe list brief').strip()

        # Unquoted service paths
        checks['unquoted_svc'] = runner.run(
            'wmic service get name,displayname,pathname,startmode 2>nul | findstr /i "auto" | findstr /i /v "c:\\windows\\\\" | findstr /i /v "\\"'
        ).strip()

        # AlwaysInstallElevated
        checks['aie_hklm'] = runner.run('reg query HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer /v AlwaysInstallElevated 2>nul').strip()
        checks['aie_hkcu'] = runner.run('reg query HKCU\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer /v AlwaysInstallElevated 2>nul').strip()

        # Stored creds
        checks['stored_creds'] = runner.run('cmdkey /list').strip()
        checks['vault'] = runner.run('vaultcmd /list').strip()

        # Scheduled tasks
        checks['schtasks'] = runner.run('schtasks /query /fo csv /v 2>nul | findstr /i /v "microsoft" | head -30').strip()

        # Weak service permissions
        checks['services'] = runner.run('sc query state=all 2>nul | findstr SERVICE_NAME | head -30').strip()

        # Network
        checks['connections'] = runner.run('netstat -anob 2>nul | head -40').strip()
        checks['shares'] = runner.run('net share').strip()
        checks['arp'] = runner.run('arp -a').strip()

        # Autologon
        checks['autologon'] = runner.run('reg query "HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon" 2>nul | findstr -i "password username"').strip()

        # SeImpersonate
        checks['privileges'] = runner.run('whoami /priv').strip()

        # Antivirus
        checks['av'] = runner.run('wmic /namespace:\\\\root\\securitycenter2 path antivirusproduct get displayname 2>nul').strip()

        # Findings
        findings = []
        if checks.get('unquoted_svc'):
            findings.append('[HIGH] Unquoted service paths found')
        if '0x1' in checks.get('aie_hklm', '') or '0x1' in checks.get('aie_hkcu', ''):
            findings.append('[CRITICAL] AlwaysInstallElevated is enabled')
        if 'SeImpersonatePrivilege' in checks.get('privileges', '') and 'Enabled' in checks.get('privileges', ''):
            findings.append('[CRITICAL] SeImpersonatePrivilege enabled (potato attack)')
        if 'SeAssignPrimaryTokenPrivilege' in checks.get('privileges', '') and 'Enabled' in checks.get('privileges', ''):
            findings.append('[CRITICAL] SeAssignPrimaryTokenPrivilege enabled')
        if checks.get('stored_creds') and 'Target:' in checks.get('stored_creds', ''):
            findings.append('[HIGH] Stored credentials found')
        if checks.get('autologon'):
            findings.append('[HIGH] Autologon credentials in registry')

        out_file = f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_privesc_windows.txt'
        with open(out_file, 'w') as f:
            for name, output in checks.items():
                f.write(f"=== {name.upper()} ===\n{output}\n\n")

        add_outputs(enum_file=out_file, finding_count=len(findings))
        print("=" * 50)
        print(f" WINDOWS PRIVESC: {{ inputs.target }}")
        print("=" * 50)
        if findings:
            print("\n--- FINDINGS ---")
            for finding in findings:
                print(f"  {finding}")
        else:
            print("\nNo obvious privesc vectors found")
        print(f"\nFull report: {out_file}")
      log-stdout: true
      log-command: true
