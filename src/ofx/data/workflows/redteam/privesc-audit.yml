name: privesc-audit
description: |
  Privilege escalation audit — runs linPEAS (Linux) or winPEAS (Windows)
  based on the target OS to identify local escalation vectors, misconfigs,
  and sensitive information on the target system.
tags: [redteam, privesc, linpeas, winpeas, audit, task]
dispatch:
  inputs:
    os:
      type: string
      default: linux
      description: "Target OS: linux or windows"
    target:
      type: string
      default: localhost
      description: Target host (optional — for remote execution via cloud runner)

jobs:
  audit:
    name: Privilege Escalation Audit
    outputs:
      vuln_count: '{{ steps["audit-summary"].outputs.vuln_count | default("", true) }}'
      finding_count: '{{ steps["audit-summary"].outputs.finding_count | default("", true) }}'
    steps:
      - task: linpeas
        name: linpeas-scan
        if: "{{ inputs.os == 'linux' }}"
        with:
          target: "{{ inputs.target }}"
          thorough: true
        continue-on-error: true
        log-stdout: true
        log-command: true
      - task: winpeas
        name: winpeas-scan
        if: "{{ inputs.os == 'windows' }}"
        with:
          target: "{{ inputs.target }}"
          quiet: true
          log: true
        continue-on-error: true
        log-stdout: true
        log-command: true
      - name: audit-summary
        script: |
          target_os = "{{ inputs.os }}"

          if target_os == "linux":
              results = {{ vulns(steps["linpeas-scan"].outputs.typed_outputs) | tojson }}
              tag_results = {{ tags(steps["linpeas-scan"].outputs.typed_outputs) | tojson }}
          else:
              results = {{ vulns(steps["winpeas-scan"].outputs.typed_outputs) | tojson }}
              tag_results = {{ tags(steps["winpeas-scan"].outputs.typed_outputs) | tojson }}

          critical = [v for v in results if v.get('severity') in ('critical', 'high')]
          medium = [v for v in results if v.get('severity') == 'medium']
          low = [v for v in results if v.get('severity') in ('low', 'info', '')]

          add_outputs(vuln_count=len(results), finding_count=len(critical))

          print("=" * 55)
          print(f" PRIVILEGE ESCALATION AUDIT ({target_os.upper()})")
          print("=" * 55)
          print(f"  Total findings:  {len(results)}")
          print(f"  Critical/High:   {len(critical)}")
          print(f"  Medium:          {len(medium)}")
          print(f"  Low/Info:        {len(low)}")
          print(f"  Tags detected:   {len(tag_results)}")
          print("-" * 55)

          if critical:
              print("\n  [!!] Critical/High Findings:")
              for v in critical[:15]:
                  print(f"    - {v.get('name', 'unknown')} ({v.get('severity', '')})")

          if tag_results:
              print(f"\n  [*] Notable tags:")
              for t in tag_results[:10]:
                  print(f"    - {t.get('name', '')}: {t.get('value', '')}")
        log-stdout: true
