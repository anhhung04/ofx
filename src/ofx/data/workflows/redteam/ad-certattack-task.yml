name: ad-certattack-task
description: |
  Task-based ADCS (Active Directory Certificate Services) attack —
  enumerates certificate templates and authorities using certipy to
  find vulnerable ESC1-ESC8 misconfigurations for privilege escalation.
tags: [redteam, ad, adcs, certificate, certipy, task]
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Domain controller IP or hostname
      alias: t
    domain:
      required: true
      type: string
      description: Domain name (e.g. corp.local)
    username:
      required: true
      type: string
      description: Domain username
    password:
      type: string
      default: ''
      description: Password (provide password or hash)
    hash:
      type: string
      default: ''
      description: NTLM hash for pass-the-hash

jobs:
  enumerate:
    name: ADCS Vulnerability Scan
    outputs:
      vuln_count: '{{ steps["analyze-certs"].outputs.vuln_count | default("", true) }}'
      template_count: '{{ steps["analyze-certs"].outputs.template_count | default("", true) }}'
    steps:
      - task: certipy
        name: certipy-find
        with:
          target: "{{ inputs.target }}"
          mode: find
          username: "{{ inputs.username }}"
          password: "{{ inputs.password }}"
          hash: "{{ inputs.hash }}"
          dc_ip: "{{ inputs.target }}"
          vulnerable: true
          enabled: true
          json: true
        continue-on-error: true
        log-stdout: "{{ inputs.log_output | default(true) }}"
        log-command: "{{ inputs.log_command | default(true) }}"
      - name: analyze-certs
        script: |
          vulns = {{ vulns(steps["certipy-find"].outputs.typed_outputs) | tojson }}
          tags = {{ tags(steps["certipy-find"].outputs.typed_outputs) | tojson }}

          esc_vulns = []
          templates_seen = set()

          for v in vulns:
              name = v.get('name', '')
              sev = v.get('severity', 'unknown')
              esc_vulns.append({'name': name, 'severity': sev, 'tags': v.get('tags', [])})

          for t in tags:
              tname = t.get('name', '')
              if tname:
                  templates_seen.add(tname)

          add_outputs(vuln_count=len(esc_vulns), template_count=len(templates_seen))
          print(f"[+] Certipy found {len(esc_vulns)} vulnerabilities across {len(templates_seen)} templates")

          for v in esc_vulns:
              sev_icon = "[!!]" if v['severity'] in ('critical', 'high') else "[!]"
              print(f"  {sev_icon} {v['name']} (severity: {v['severity']})")

  report:
    name: ADCS Attack Report
    needs: [enumerate]
    steps:
      - name: esc-report
        script: |
          vuln_count = '{{ jobs.enumerate.outputs.vuln_count }}'
          template_count = '{{ jobs.enumerate.outputs.template_count }}'

          esc_attacks = {
              'ESC1': 'Enrollee supplies subject — request cert with arbitrary SAN',
              'ESC2': 'Any purpose EKU — use for client authentication',
              'ESC3': 'Certificate request agent — enroll on behalf of other users',
              'ESC4': 'Vulnerable template ACL — modify to create ESC1 condition',
              'ESC6': 'EDITF_ATTRIBUTESUBJECTALTNAME2 on CA — SAN in any cert request',
              'ESC7': 'Manage CA / Manage Certificates — approve pending requests',
              'ESC8': 'HTTP enrollment endpoint — relay NTLM to get certificate',
              'ESC9': 'No security extension — CT_FLAG_NO_SECURITY_EXTENSION in template',
              'ESC10': 'Weak certificate mapping — subject name used for auth mapping',
              'ESC11': 'IF_ENFORCEENCRYPTICERTREQUEST — RPC cert enrollment relay',
          }

          print("=" * 60)
          print(" ADCS VULNERABILITY REPORT")
          print("=" * 60)
          print(f"  Target DC:         {{ inputs.target }}")
          print(f"  Domain:            {{ inputs.domain }}")
          print(f"  Vulnerabilities:   {vuln_count}")
          print(f"  Templates scanned: {template_count}")
          print("-" * 60)
          print("\n  --- ESC Attack Reference ---")
          for esc, desc in esc_attacks.items():
              print(f"  {esc}: {desc}")

          if int(vuln_count or 0) > 0:
              print("\n  [!] Next steps:")
              print("      - Review certipy output for exploitable templates")
              print("      - certipy req -u USER -p PASS -ca CA -template TEMPLATE")
              print("      - certipy auth -pfx cert.pfx -dc-ip DC_IP")
          else:
              print("\n  [*] No vulnerable ADCS templates found")
        log-stdout: "{{ inputs.log_output | default(true) }}"
