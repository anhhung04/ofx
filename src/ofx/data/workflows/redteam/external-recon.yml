# yaml-language-server: $schema=~/.ofx/workflow_schema.json
name: external-recon
description: 'External red team reconnaissance — performs comprehensive passive and
  active reconnaissance against a target organization. Includes OSINT, subdomain enumeration,
  port scanning, service fingerprinting, vulnerability identification, and credential
  hunting.

  '
tags:
- redteam
- recon
- external
- osint
- vuln
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target domain (e.g. target-corp.com)
    email_domain:
      type: string
      default: ''
      description: Email domain if different from target
jobs:
  domain-intel:
    name: Domain Intelligence
    steps:
    - task: whois
      name: whois-lookup
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
      log-stdout: true
    - name: dnsrecon-enum
      run: 'dnsrecon -d {{ inputs.target }} --no_color 2>/dev/null | tee /tmp/dnsrecon-output.txt

        '
      continue-on-error: true
    - task: testssl
      name: tls-check
      with:
        target: '{{ inputs.target }}'
        server_defaults: true
      continue-on-error: true
      log-stdout: true
    - name: export-intel
      script: "import json\n\nwhois_data = {{ steps[0].outputs.typed_outputs | tojson\
        \ }}\n\nwith open('{{ env.OFX_OUTPUTS }}', 'a') as f:\n    f.write(f\"domain_intel=complete\\\
        n\")\n\nprint(\"Domain intelligence gathering complete\")\n"
      log-stdout: true
  subdomain-enum:
    name: Subdomain Enumeration
    steps:
    - task: subfinder
      name: subfinder-enum
      with:
        target: '{{ inputs.target }}'
        all: true
      log-stdout: true
      continue-on-error: true
    - name: amass-passive
      run: 'amass enum -passive -d {{ inputs.target }} 2>/dev/null | tee /tmp/amass-subs.txt

        '
      continue-on-error: true
    - name: assetfinder-enum
      run: 'assetfinder --subs-only {{ inputs.target }} 2>/dev/null | tee /tmp/assetfinder-subs.txt

        '
      continue-on-error: true
    - name: findomain-enum
      run: 'findomain -t {{ inputs.target }} -q 2>/dev/null | tee /tmp/findomain-subs.txt

        '
      continue-on-error: true
    - name: collect-subdomains
      script: "import json\n\nsubs = set()\nsubs.add('{{ inputs.target }}')\n\n# From\
        \ subfinder\nsf_outputs = {{ steps[0].outputs.typed_outputs | tojson }}\n\
        for item in sf_outputs:\n    if item.get('_type') == 'subdomain':\n      \
        \  subs.add(item['host'])\n\n# From amass, assetfinder, findomain\nfor path\
        \ in ['/tmp/amass-subs.txt', '/tmp/assetfinder-subs.txt', '/tmp/findomain-subs.txt']:\n\
        \    try:\n        with open(path) as f:\n            for line in f:\n   \
        \             sub = line.strip()\n                if sub and '{{ inputs.target\
        \ }}' in sub:\n                    subs.add(sub)\n    except FileNotFoundError:\n\
        \        pass\n\nsub_list = '\\n'.join(sorted(subs))\nwith open('{{ env.OFX_OUTPUTS\
        \ }}', 'a') as f:\n    f.write(f\"all_subs={sub_list}\\n\")\n    f.write(f\"\
        sub_count={len(subs)}\\n\")\n\nprint(f\"Collected {len(subs)} unique subdomains\"\
        )\n"
  dns-verify:
    name: DNS Verification
    needs:
    - subdomain-enum
    steps:
    - task: dnsx
      name: verify-dns
      with:
        target: '{{ jobs[''subdomain-enum''].outputs.all_subs }}'
        a: true
        cname: true
        resp: true
      log-stdout: true
      continue-on-error: true
    - name: filter-alive
      script: "import json\n\nalive = set()\ndnsx_out = {{ steps[0].outputs.typed_outputs\
        \ | tojson }}\nfor item in dnsx_out:\n    host = item.get('host', '')\n  \
        \  if host:\n        alive.add(host)\n\nwith open('{{ env.OFX_OUTPUTS }}',\
        \ 'a') as f:\n    f.write(f\"alive_subs={chr(10).join(sorted(alive))}\\n\"\
        )\n    f.write(f\"alive_count={len(alive)}\\n\")\n\nprint(f\"Verified {len(alive)}\
        \ alive subdomains\")\n"
  port-scan:
    name: Port Scanning
    needs:
    - dns-verify
    steps:
    - task: naabu
      name: naabu-scan
      with:
        target: '{{ jobs[''dns-verify''].outputs.alive_subs }}'
        top_ports: '1000'
        rate: 1000
      log-stdout: true
      continue-on-error: true
    - name: masscan-sweep
      run: 'masscan {{ jobs[''dns-verify''].outputs.alive_subs | default(inputs.target,
        true) }} --top-ports 100 --rate 1000 -oL /tmp/masscan-results.txt 2>/dev/null
        || true

        '
      continue-on-error: true
    - name: collect-ports
      script: "import json\n\nports = set()\nhosts = set()\nnaabu_out = {{ steps[0].outputs.typed_outputs\
        \ | tojson }}\nfor item in naabu_out:\n    if item.get('_type') == 'port':\n\
        \        host = item.get('host') or item.get('ip', '')\n        port = item.get('port',\
        \ '')\n        if host and port:\n            ports.add(f\"{host}:{port}\"\
        )\n            hosts.add(host)\n\nwith open('{{ env.OFX_OUTPUTS }}', 'a')\
        \ as f:\n    f.write(f\"open_ports={chr(10).join(sorted(ports))}\\n\")\n \
        \   f.write(f\"port_count={len(ports)}\\n\")\n    f.write(f\"port_hosts={chr(10).join(sorted(hosts))}\\\
        n\")\n\nprint(f\"Found {len(ports)} open ports across {len(hosts)} hosts\"\
        )\n"
  http-probe:
    name: HTTP Probing
    needs:
    - dns-verify
    steps:
    - task: httpx
      name: probe-subs
      with:
        target: '{{ jobs[''dns-verify''].outputs.alive_subs }}'
        tech_detect: true
        status_code: true
        title: true
        follow_redirects: true
      log-stdout: true
      continue-on-error: true
    - name: export-live
      run: 'echo "live_urls={{ urls(steps[0].outputs.typed_outputs) | selectattr(''status_code'',
        ''gt'', 0) | map(attribute=''url'') | unique | join(''\n'') }}" >> $OFX_OUTPUTS

        echo "live_count={{ urls(steps[0].outputs.typed_outputs) | selectattr(''status_code'',
        ''gt'', 0) | list | length }}" >> $OFX_OUTPUTS

        '
      log-stdout: true
  web-fingerprint:
    name: Web Fingerprinting
    needs:
    - http-probe
    steps:
    - name: whatweb-scan
      run: "echo \"{{ jobs['http-probe'].outputs.live_urls | default(inputs.target,\
        \ true) }}\" | head -50 | while read url; do\n  whatweb -a 3 \"$url\" --color=never\
        \ 2>/dev/null\ndone | tee /tmp/whatweb-output.txt\n"
      continue-on-error: true
    - task: wafw00f
      name: waf-detect
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
      log-stdout: true
    - name: export-fingerprint
      script: "import re\n\ntechs = set()\ntry:\n    with open('/tmp/whatweb-output.txt')\
        \ as f:\n        content = f.read()\n    matches = re.findall(r'\\[([^\\]]+)\\\
        ]', content)\n    for m in matches:\n        m = m.strip()\n        if m and\
        \ not m.startswith('http'):\n            techs.add(m)\nexcept FileNotFoundError:\n\
        \    pass\n\nwaf_data = {{ steps[1].outputs.typed_outputs | tojson }}\nwaf_names\
        \ = []\nfor item in waf_data:\n    if item.get('waf') or item.get('name'):\n\
        \        waf_names.append(item.get('waf') or item.get('name', 'unknown'))\n\
        \nwith open('{{ env.OFX_OUTPUTS }}', 'a') as f:\n    f.write(f\"tech_count={len(techs)}\\\
        n\")\n    f.write(f\"waf_detected={chr(10).join(waf_names) if waf_names else\
        \ 'none'}\\n\")\n\nprint(f\"Technologies: {len(techs)}, WAFs: {len(waf_names)}\"\
        )\n"
      log-stdout: true
  web-crawl:
    name: Web Crawling
    needs:
    - http-probe
    steps:
    - task: katana
      name: katana-crawl
      with:
        target: '{{ jobs[''http-probe''].outputs.live_urls | default(inputs.target,
          true) }}'
        depth: 3
      log-stdout: true
      continue-on-error: true
    - task: gospider
      name: gospider-crawl
      with:
        target: '{{ jobs[''http-probe''].outputs.live_urls | default(inputs.target,
          true) }}'
        depth: 2
      log-stdout: true
      continue-on-error: true
    - task: gau
      name: gau-archive
      with:
        target: '{{ inputs.target }}'
        subs: true
      continue-on-error: true
    - name: hakrawler-crawl
      run: 'echo "{{ jobs[''http-probe''].outputs.live_urls | default(inputs.target,
        true) }}" | hakrawler -d 2 -subs 2>/dev/null | tee /tmp/hakrawler-urls.txt

        '
      continue-on-error: true
    - name: paramspider-discover
      run: 'paramspider -d {{ inputs.target }} --exclude woff,css,js,png,svg,jpg --output
        /tmp/paramspider-urls.txt 2>/dev/null || true

        '
      continue-on-error: true
    - name: collect-crawled
      script: "import json\n\nurls = set()\nfor idx in [0, 1, 2]:\n    step_data =\
        \ {{ steps | tojson }}\n    typed = step_data[idx].get('outputs', {}).get('typed_outputs',\
        \ [])\n    for item in typed:\n        if item.get('_type') == 'url':\n  \
        \          urls.add(item['url'])\n\n# From hakrawler\ntry:\n    with open('/tmp/hakrawler-urls.txt')\
        \ as f:\n        for line in f:\n            u = line.strip()\n          \
        \  if u and u.startswith('http'):\n                urls.add(u)\nexcept FileNotFoundError:\n\
        \    pass\n\n# From paramspider\ntry:\n    with open('/tmp/paramspider-urls.txt')\
        \ as f:\n        for line in f:\n            u = line.strip()\n          \
        \  if u and u.startswith('http'):\n                urls.add(u)\nexcept FileNotFoundError:\n\
        \    pass\n\nwith open('{{ env.OFX_OUTPUTS }}', 'a') as f:\n    f.write(f\"\
        crawled_urls={chr(10).join(sorted(urls))}\\n\")\n    f.write(f\"crawl_count={len(urls)}\\\
        n\")\n\nprint(f\"Crawled {len(urls)} unique URLs\")\n"
  takeover-check:
    name: Subdomain Takeover Check
    needs:
    - dns-verify
    steps:
    - name: subzy-check
      run: 'echo "{{ jobs[''dns-verify''].outputs.alive_subs }}" > /tmp/alive-subs.txt

        subzy run --targets /tmp/alive-subs.txt --hide_fails 2>/dev/null | tee /tmp/subzy-output.txt

        '
      continue-on-error: true
    - name: export-takeovers
      script: "takeovers = []\ntry:\n    with open('/tmp/subzy-output.txt') as f:\n\
        \        for line in f:\n            line = line.strip()\n            if line\
        \ and 'VULNERABLE' in line.upper():\n                takeovers.append(line)\n\
        except FileNotFoundError:\n    pass\n\nwith open('{{ env.OFX_OUTPUTS }}',\
        \ 'a') as f:\n    f.write(f\"takeover_count={len(takeovers)}\\n\")\n\nprint(f\"\
        Potential takeovers: {len(takeovers)}\")\n"
      log-stdout: true
  secret-hunt:
    name: Secret Hunting
    needs:
    - web-crawl
    steps:
    - task: trufflehog
      name: trufflehog-scan
      with:
        target: '{{ inputs.target }}'
        mode: filesystem
      log-stdout: true
      continue-on-error: true
    - task: gitleaks
      name: gitleaks-scan
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
      log-stdout: true
    - name: export-secrets
      script: "import json\n\nth_vulns = {{ vulns(steps[0].outputs.typed_outputs)\
        \ | tojson }}\ngl_vulns = {{ vulns(steps[1].outputs.typed_outputs) | tojson\
        \ }}\ntotal = len(th_vulns) + len(gl_vulns)\n\nwith open('{{ env.OFX_OUTPUTS\
        \ }}', 'a') as f:\n    f.write(f\"secrets_count={total}\\n\")\n\nprint(f\"\
        Found {total} secrets/leaks\")\n"
      log-stdout: true
  vuln-scan:
    name: Vulnerability Scanning
    needs:
    - web-crawl
    - web-fingerprint
    - port-scan
    steps:
    - task: nuclei
      name: nuclei-scan
      with:
        target: '{{ jobs[''http-probe''].outputs.live_urls | default(inputs.target,
          true) }}'
        severity: critical,high,medium
      log-stdout: true
      continue-on-error: true
    - name: nikto-scan
      run: 'nikto -h {{ inputs.target }} -nointeractive -no404 2>/dev/null | tee /tmp/nikto-output.txt

        '
      continue-on-error: true
    - name: crlfuzz-scan
      run: 'echo "{{ jobs[''http-probe''].outputs.live_urls | default(inputs.target,
        true) }}" | crlfuzz -s 2>/dev/null | tee /tmp/crlfuzz-output.txt

        '
      continue-on-error: true
    - name: commix-scan
      run: "echo \"{{ jobs['web-crawl'].outputs.crawled_urls | default('') }}\" |\
        \ head -20 | while read url; do\n  [ -n \"$url\" ] && commix --url \"$url\"\
        \ --batch --output-dir /tmp/commix-results 2>/dev/null || true\ndone | tee\
        \ /tmp/commix-output.txt\n"
      continue-on-error: true
    - name: export-vulns
      script: "import json\n\nnuclei_vulns = {{ vulns(steps[0].outputs.typed_outputs)\
        \ | tojson }}\ncritical = [v for v in nuclei_vulns if v.get('severity') ==\
        \ 'critical']\nhigh = [v for v in nuclei_vulns if v.get('severity') == 'high']\n\
        medium = [v for v in nuclei_vulns if v.get('severity') == 'medium']\n\n# Count\
        \ nikto findings\nnikto_count = 0\ntry:\n    with open('/tmp/nikto-output.txt')\
        \ as f:\n        for line in f:\n            if line.strip().startswith('+')\
        \ and 'OSVDB' in line:\n                nikto_count += 1\nexcept FileNotFoundError:\n\
        \    pass\n\n# Count CRLF injection findings\ncrlf_count = 0\ntry:\n    with\
        \ open('/tmp/crlfuzz-output.txt') as f:\n        for line in f:\n        \
        \    if line.strip():\n                crlf_count += 1\nexcept FileNotFoundError:\n\
        \    pass\n\nwith open('{{ env.OFX_OUTPUTS }}', 'a') as f:\n    f.write(f\"\
        vuln_count={len(nuclei_vulns)}\\n\")\n    f.write(f\"critical_count={len(critical)}\\\
        n\")\n    f.write(f\"high_count={len(high)}\\n\")\n    f.write(f\"medium_count={len(medium)}\\\
        n\")\n    f.write(f\"nikto_count={nikto_count}\\n\")\n    f.write(f\"crlf_count={crlf_count}\\\
        n\")\n\nprint(f\"Nuclei: {len(nuclei_vulns)} (C:{len(critical)} H:{len(high)}\
        \ M:{len(medium)})\")\nprint(f\"Nikto: {nikto_count}\")\nprint(f\"CRLF injections:\
        \ {crlf_count}\")\n"
      log-stdout: true
  osint:
    name: OSINT & Credential Hunting
    needs:
    - domain-intel
    steps:
    - name: theharvester-search
      run: 'theHarvester -d {{ inputs.email_domain if inputs.email_domain else inputs.target
        }} -b all -l 500 2>/dev/null | tee /tmp/harvester-output.txt

        '
      continue-on-error: true
    - name: collect-emails
      script: "import re\n\nemails = set()\ntry:\n    with open('/tmp/harvester-output.txt')\
        \ as f:\n        content = f.read()\n    found = re.findall(r'[\\w.+-]+@[\\\
        w-]+\\.[\\w.-]+', content)\n    emails.update(found)\nexcept FileNotFoundError:\n\
        \    pass\n\nemail_list = '\\n'.join(sorted(emails))\nwith open('{{ env.OFX_OUTPUTS\
        \ }}', 'a') as f:\n    f.write(f\"email_list={email_list}\\n\")\n    f.write(f\"\
        email_count={len(emails)}\\n\")\n\nprint(f\"Harvested {len(emails)} email\
        \ addresses\")\n"
    - task: h8mail
      name: breach-search
      with:
        target: '{{ steps[1].outputs.email_list if steps[1].outputs is defined else
          inputs.target }}'
      continue-on-error: true
      log-stdout: true
    - name: export-osint
      script: "import json\n\nbreach_results = {{ users(steps[2].outputs.typed_outputs)\
        \ | tojson }}\n\nwith open('{{ env.OFX_OUTPUTS }}', 'a') as f:\n    f.write(f\"\
        breach_count={len(breach_results)}\\n\")\n\nprint(f\"Breach results: {len(breach_results)}\"\
        )\n"
      log-stdout: true
  summary:
    name: External Recon Summary
    needs:
    - vuln-scan
    - secret-hunt
    - osint
    - takeover-check
    steps:
    - name: report
      run: 'echo "======================================================"

        echo " EXTERNAL RECON COMPLETE: {{ inputs.target }}"

        echo "======================================================"

        echo ""

        echo "--- Enumeration ---"

        echo "Subdomains discovered: {{ jobs[''subdomain-enum''].outputs.sub_count
        }}"

        echo "DNS verified (alive): {{ jobs[''dns-verify''].outputs.alive_count }}"

        echo "Open ports: {{ jobs[''port-scan''].outputs.port_count }}"

        echo "Live HTTP services: {{ jobs[''http-probe''].outputs.live_count }}"

        echo ""

        echo "--- Fingerprinting ---"

        echo "Technologies detected: {{ jobs[''web-fingerprint''].outputs.tech_count
        }}"

        echo "WAF: {{ jobs[''web-fingerprint''].outputs.waf_detected }}"

        echo "URLs crawled: {{ jobs[''web-crawl''].outputs.crawl_count }}"

        echo ""

        echo "--- Vulnerabilities ---"

        echo "Nuclei findings: {{ jobs[''vuln-scan''].outputs.vuln_count }}"

        echo "  Critical: {{ jobs[''vuln-scan''].outputs.critical_count }}"

        echo "  High: {{ jobs[''vuln-scan''].outputs.high_count }}"

        echo "  Medium: {{ jobs[''vuln-scan''].outputs.medium_count }}"

        echo "Nikto findings: {{ jobs[''vuln-scan''].outputs.nikto_count }}"

        echo "CRLF injections: {{ jobs[''vuln-scan''].outputs.crlf_count }}"

        echo "Secrets/Leaks: {{ jobs[''secret-hunt''].outputs.secrets_count }}"

        echo "Subdomain takeovers: {{ jobs[''takeover-check''].outputs.takeover_count
        }}"

        echo ""

        echo "--- OSINT ---"

        echo "Emails harvested: {{ jobs.osint.outputs.email_count }}"

        echo "Breach results: {{ jobs.osint.outputs.breach_count }}"

        '
      log-stdout: true
