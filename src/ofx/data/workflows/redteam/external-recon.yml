name: external-recon
description:
  "External red team reconnaissance — performs comprehensive passive and active reconnaissance against a target organization. Includes OSINT, subdomain enumeration, port scanning, service fingerprinting, vulnerability identification, and credential hunting.

  "
tags:
  - redteam
  - recon
  - external
  - osint
  - vuln
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target domain (e.g. target-corp.com)
      alias: t
    email_domain:
      type: string
      default: ""
      description: Email domain if different from target

defaults:
  store-creds: true
jobs:
  domain-intel:
    name: Domain Intelligence
    outputs:
      domain_intel: '{{ steps["export-intel"].outputs.domain_intel | default("", true) }}'
    steps:
      - task: whois
        timeout: 5
        name: whois-lookup
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      - task: dnsrecon
        timeout: 10
        name: dnsrecon-enum
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      - task: testssl
        timeout: 10
        name: tls-check
        with:
          target: "{{ inputs.target }}:443"
        continue-on-error: true
      - name: export-intel
        script: |
          import json

          whois_data = {{ steps["whois-lookup"].outputs.typed_outputs | tojson }}

          add_outputs(domain_intel="complete")
          print("Domain intelligence gathering complete")
  subdomain-enum:
    name: Subdomain Enumeration
    outputs:
      subs_file: '{{ steps["collect-subdomains"].outputs.subs_file | default("", true) }}'
      sub_count: '{{ steps["collect-subdomains"].outputs.sub_count | default("", true) }}'
    steps:
      - task: subfinder
        timeout: 10
        name: subfinder-enum
        with:
          target: "{{ inputs.target }}"
          all: true
        continue-on-error: true
      - task: amass
        timeout: 10
        name: amass-passive
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      - task: assetfinder
        timeout: 10
        name: assetfinder-enum
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      - task: findomain
        timeout: 10
        name: findomain-enum
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      - name: collect-subdomains
        script: |
          import json

          subs = set()
          subs.add('{{ inputs.target }}')

          # From subfinder
          sf_outputs = {{ steps["subfinder-enum"].outputs.typed_outputs | tojson }}
          for item in sf_outputs:
              if item.get('_type') == 'subdomain':
                  subs.add(item['host'])

          # From amass, assetfinder, findomain
          for step_name in ["amass-passive", "assetfinder-enum", "findomain-enum"]:
              for item in {{ subdomains(steps[step_name].outputs.typed_outputs) | default([], true) | tojson }}:
                  subs.add(item['host'])

          sub_list = '\n'.join(sorted(subs))
          with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_ext_subs.txt', 'w') as f:
              f.write(sub_list)

          add_outputs(subs_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_ext_subs.txt", sub_count=len(subs))
          print(f"Collected {len(subs)} unique subdomains")
  dns-verify:
    name: DNS Verification
    outputs:
      alive_file: '{{ steps["filter-alive"].outputs.alive_file | default("", true) }}'
      alive_count: '{{ steps["filter-alive"].outputs.alive_count | default("", true) }}'
    needs:
      - subdomain-enum
    steps:
      - task: dnsx
        timeout: 10
        name: verify-dns
        with:
          target: "{{ jobs['subdomain-enum'].outputs.subs_file }}"
          a: true
          cname: true
          resp: true
        continue-on-error: true
      - name: filter-alive
        script: |
          import json

          alive = set()
          dnsx_out = {{ steps["verify-dns"].outputs.typed_outputs | tojson }}
          for item in dnsx_out:
              host = item.get('host', '')
              if host:
                  alive.add(host)

          with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_ext_alive.txt', 'w') as f:
              f.write('\n'.join(sorted(alive)))

          add_outputs(alive_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_ext_alive.txt", alive_count=len(alive))
          print(f"Verified {len(alive)} alive subdomains")
  port-scan:
    name: Port Scanning
    outputs:
      ports_file: '{{ steps["collect-ports"].outputs.ports_file | default("", true) }}'
      port_count: '{{ steps["collect-ports"].outputs.port_count | default("", true) }}'
      port_hosts_file: '{{ steps["collect-ports"].outputs.port_hosts_file | default("", true) }}'
    needs:
      - dns-verify
    steps:
      - task: naabu
        timeout: 10
        name: naabu-scan
        with:
          target: "{{ jobs['dns-verify'].outputs.alive_file }}"
          top_ports: "1000"
          rate: 1000
        continue-on-error: true
      - task: masscan
        timeout: 10
        name: masscan-sweep
        with:
          target: "{{ jobs['dns-verify'].outputs.alive_file | default(inputs.target, true) }}"
          top_ports: "100"
          rate: 1000
        continue-on-error: true
      - name: collect-ports
        script: |
          import json

          ports = set()
          hosts = set()
          for step_name in ["naabu-scan", "masscan-sweep"]:
              for item in {{ ports(steps[step_name].outputs.typed_outputs) | default([], true) | tojson }}:
                  host = item.get('host') or item.get('ip', '')
                  port = item.get('port', '')
                  if host and port:
                      ports.add(f"{host}:{port}")
                      hosts.add(host)

          open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_extrecon_ports.txt', 'w').write('\n'.join(sorted(ports)))
          open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_extrecon_porthosts.txt', 'w').write('\n'.join(sorted(hosts)))
          add_outputs(ports_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_extrecon_ports.txt", port_count=len(ports), port_hosts_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_extrecon_porthosts.txt")
          print(f"Found {len(ports)} open ports across {len(hosts)} hosts")
  http-probe:
    name: HTTP Probing
    outputs:
      live_urls: '{{ steps["export-live"].outputs.live_urls | default("", true) }}'
      live_count: '{{ steps["export-live"].outputs.live_count | default("", true) }}'
    needs:
      - dns-verify
    steps:
      - task: httpx
        timeout: 10
        name: probe-subs
        with:
          target: "{{ jobs['dns-verify'].outputs.alive_file }}"
          tech_detect: true
          status_code: true
          title: true
          follow_redirects: true
        continue-on-error: true
      - name: export-live
        script: |
          typed = {{ steps["probe-subs"].outputs.typed_outputs | default([], true) | tojson }}
          live = []
          for item in typed:
              if item.get("_type") == "url" and item.get("status_code", 0) > 0:
                  live.append(item["url"])
          add_outputs(live_urls='\n'.join(sorted(set(live))))
          count = sum(1 for item in typed if item.get("_type") == "url" and item.get("status_code", 0) > 0)
          add_outputs(live_count=count)
  web-fingerprint:
    name: Web Fingerprinting
    outputs:
      tech_count: '{{ steps["export-fingerprint"].outputs.tech_count | default("", true) }}'
      waf_detected_file: '{{ steps["export-fingerprint"].outputs.waf_detected_file | default("", true) }}'
    needs:
      - http-probe
    steps:
      - name: whatweb-scan
        run: |
          echo "{{ jobs['http-probe'].outputs.live_urls | default(inputs.target, true) }}" | head -50 | while read url; do
            whatweb -a 3 "$url" --color=never 2>/dev/null
          done | tee /tmp/whatweb-output.txt
        continue-on-error: true
      - task: wafw00f
        timeout: 10
        name: waf-detect
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      - name: export-fingerprint
        script: |
          import re

          techs = set()
          try:
              with open('/tmp/whatweb-output.txt') as f:
                  content = f.read()
              matches = re.findall(r'\[([^\]]+)\]', content)
              for m in matches:
                  m = m.strip()
                  if m and not m.startswith('http'):
                      techs.add(m)
          except FileNotFoundError:
              pass

          waf_data = {{ steps["waf-detect"].outputs.typed_outputs | tojson }}
          waf_names = []
          for item in waf_data:
              if item.get('waf') or item.get('name'):
                  waf_names.append(item.get('waf') or item.get('name', 'unknown'))

          open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_extrecon_waf.txt', 'w').write('\n'.join(waf_names) if waf_names else 'none')
          add_outputs(tech_count=len(techs), waf_detected_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_extrecon_waf.txt")
          print(f"Technologies: {len(techs)}, WAFs: {len(waf_names)}")
  web-crawl:
    name: Web Crawling
    outputs:
      crawled_file: '{{ steps["collect-crawled"].outputs.crawled_file | default("", true) }}'
      crawl_count: '{{ steps["collect-crawled"].outputs.crawl_count | default("", true) }}'
    needs:
      - http-probe
    steps:
      - task: katana
        timeout: 15
        name: katana-crawl
        with:
          target: "{{ jobs['http-probe'].outputs.live_urls | default(inputs.target, true) }}"
          depth: 3
        continue-on-error: true
      - task: gospider
        timeout: 15
        name: gospider-crawl
        with:
          target: "{{ jobs['http-probe'].outputs.live_urls | default(inputs.target, true) }}"
          depth: 2
        continue-on-error: true
      - task: gau
        timeout: 10
        name: gau-archive
        with:
          target: "{{ inputs.target }}"
          subs: true
        continue-on-error: true
      - name: hakrawler-crawl
        run: |
          echo "{{ jobs['http-probe'].outputs.live_urls | default(inputs.target, true) }}" | hakrawler -d 2 -subs 2>/dev/null | tee /tmp/hakrawler-urls.txt
        continue-on-error: true
      - task: paramspider
        timeout: 10
        name: paramspider-discover
        with:
          target: "{{ inputs.target }}"
          exclude: "woff,css,js,png,svg,jpg"
        continue-on-error: true
      - name: collect-crawled
        script: |
          import json

          urls = set()
          for idx in ["0", "1", "2"]:
              step_data = {{ steps | tojson }}
              typed = step_data.get(idx, {}).get('outputs', {}).get('typed_outputs', [])
              for item in typed:
                  if item.get('_type') == 'url':
                      urls.add(item['url'])

          # From hakrawler
          try:
              with open('/tmp/hakrawler-urls.txt') as f:
                  for line in f:
                      u = line.strip()
                      if u and u.startswith('http'):
                          urls.add(u)
          except FileNotFoundError:
              pass

          # From paramspider
          for item in {{ urls(steps["paramspider-discover"].outputs.typed_outputs) | default([], true) | tojson }}:
              u = item.get('url', '')
              if u and u.startswith('http'):
                  urls.add(u)

          open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_extrecon_crawled.txt', 'w').write('\n'.join(sorted(urls)))
          add_outputs(crawled_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_extrecon_crawled.txt", crawl_count=len(urls))
          print(f"Crawled {len(urls)} unique URLs")
  takeover-check:
    name: Subdomain Takeover Check
    outputs:
      takeover_count: '{{ steps["export-takeovers"].outputs.takeover_count | default("", true) }}'
    needs:
      - dns-verify
    steps:
      - task: subzy
        timeout: 10
        name: subzy-check
        with:
          target: "{{ jobs['dns-verify'].outputs.alive_file }}"
        continue-on-error: true
      - name: export-takeovers
        script: |
          takeovers = []

          # From subzy typed outputs
          subzy_out = {{ steps["subzy-check"].outputs.typed_outputs | default([], true) | tojson }}
          for item in subzy_out:
              host = item.get('host', item.get('subdomain', ''))
              if host:
                  takeovers.append(f"[subzy] VULNERABLE: {host}")

          add_outputs(takeover_count=len(takeovers))
          print(f"Potential takeovers: {len(takeovers)}")
          for t in takeovers:
              print(f"  [!] {t}")
  secret-hunt:
    name: Secret Hunting
    outputs:
      secrets_count: '{{ steps["export-secrets"].outputs.secrets_count | default("", true) }}'
    needs:
      - web-crawl
    steps:
      - task: nuclei
        timeout: 15
        name: nuclei-secrets
        with:
          target: "{{ jobs['web-crawl'].outputs.crawled_file | default(inputs.target, true) }}"
          tags: exposure,token,secret
        continue-on-error: true
      - name: export-secrets
        script: |
          import json

          vulns = {{ vulns(steps["nuclei-secrets"].outputs.typed_outputs) | tojson }}
          tags = {{ tags(steps["nuclei-secrets"].outputs.typed_outputs) | tojson }}
          total = len(vulns) + len(tags)

          add_outputs(secrets_count=total)
          print(f"Found {total} secrets/leaks")
  vuln-scan:
    name: Vulnerability Scanning
    outputs:
      vuln_count: '{{ steps["export-vulns"].outputs.vuln_count | default("", true) }}'
      critical_count: '{{ steps["export-vulns"].outputs.critical_count | default("", true) }}'
      high_count: '{{ steps["export-vulns"].outputs.high_count | default("", true) }}'
      medium_count: '{{ steps["export-vulns"].outputs.medium_count | default("", true) }}'
      nikto_count: '{{ steps["export-vulns"].outputs.nikto_count | default("", true) }}'
      crlf_count: '{{ steps["export-vulns"].outputs.crlf_count | default("", true) }}'
    needs:
      - web-crawl
      - web-fingerprint
      - port-scan
    steps:
      - task: nuclei
        timeout: 20
        name: nuclei-scan
        with:
          target: "{{ jobs['http-probe'].outputs.live_urls | default(inputs.target, true) }}"
          severity: critical,high,medium
        continue-on-error: true
      - task: nikto
        name: nikto-scan
        timeout: 15
        with:
          target: "{{ inputs.target }}"
          maxtime: 900
        continue-on-error: true
      - name: crlfuzz-scan
        run: |
          echo "{{ jobs['http-probe'].outputs.live_urls | default(inputs.target, true) }}" | crlfuzz -s 2>/dev/null | tee /tmp/crlfuzz-output.txt
        continue-on-error: true
      - name: commix-scan
        run: |
          cat {{ jobs['web-crawl'].outputs.crawled_file | default('', true) }} 2>/dev/null | head -20 | while read url; do
            [ -n "$url" ] && commix --url "$url" --batch --output-dir /tmp/commix-results 2>/dev/null || true
          done | tee /tmp/commix-output.txt
        continue-on-error: true
      - name: export-vulns
        script: |
          import json

          nuclei_vulns = {{ vulns(steps["nuclei-scan"].outputs.typed_outputs) | tojson }}
          nikto_vulns = {{ vulns(steps["nikto-scan"].outputs.typed_outputs) | tojson }}
          critical = [v for v in nuclei_vulns if v.get('severity') == 'critical']
          high = [v for v in nuclei_vulns if v.get('severity') == 'high']
          medium = [v for v in nuclei_vulns if v.get('severity') == 'medium']

          # Count CRLF injection findings
          crlf_count = 0
          try:
              with open('/tmp/crlfuzz-output.txt') as f:
                  for line in f:
                      if line.strip():
                          crlf_count += 1
          except FileNotFoundError:
              pass

          add_outputs(vuln_count=len(nuclei_vulns), critical_count=len(critical), high_count=len(high), medium_count=len(medium), nikto_count=len(nikto_vulns), crlf_count=crlf_count)
          print(f"Nuclei: {len(nuclei_vulns)} (C:{len(critical)} H:{len(high)} M:{len(medium)})")
          print(f"Nikto: {len(nikto_vulns)}")
          print(f"CRLF injections: {crlf_count}")
  osint:
    name: OSINT & Credential Hunting
    outputs:
      email_file: '{{ steps["collect-emails"].outputs.email_file | default("", true) }}'
      email_count: '{{ steps["collect-emails"].outputs.email_count | default("", true) }}'
      breach_count: '{{ steps["export-osint"].outputs.breach_count | default("", true) }}'
    needs:
      - domain-intel
    steps:
      - name: theharvester-search
        run: |
          theHarvester -d {{ inputs.email_domain if inputs.email_domain else inputs.target }} -b all -l 500 2>/dev/null | tee /tmp/harvester-output.txt
        continue-on-error: true
      - name: collect-emails
        script: |
          import re

          emails = set()
          try:
              with open('/tmp/harvester-output.txt') as f:
                  content = f.read()
              found = re.findall(r'[\w.+-]+@[\w-]+\.[\w.-]+', content)
              emails.update(found)
          except FileNotFoundError:
              pass

          email_list = '\n'.join(sorted(emails))
          open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_extrecon_emails.txt', 'w').write(email_list)

          add_outputs(email_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_extrecon_emails.txt", email_count=len(emails))
          print(f"Harvested {len(emails)} email addresses")
      - task: h8mail
        timeout: 15
        name: breach-search
        with:
          target: '{{ steps["collect-emails"].outputs.email_file if steps["collect-emails"].outputs is defined else inputs.target }}'
        continue-on-error: true
      - name: export-osint
        script: |
          import json

          breach_results = {{ users(steps["breach-search"].outputs.typed_outputs) | tojson }}

          add_outputs(breach_count=len(breach_results))
          print(f"Breach results: {len(breach_results)}")
  summary:
    name: External Recon Summary
    needs:
      - vuln-scan
      - secret-hunt
      - osint
      - takeover-check
    steps:
      - name: report
        run: |
          echo "======================================================"
          echo " EXTERNAL RECON COMPLETE: {{ inputs.target }}"
          echo "======================================================"
          echo ""
          echo "--- Enumeration ---"
          echo "Subdomains discovered: {{ jobs['subdomain-enum'].outputs.sub_count }}"
          echo "DNS verified (alive): {{ jobs['dns-verify'].outputs.alive_count }}"
          echo "Open ports: {{ jobs['port-scan'].outputs.port_count }}"
          echo "Live HTTP services: {{ jobs['http-probe'].outputs.live_count }}"
          echo ""
          echo "--- Fingerprinting ---"
          echo "Technologies detected: {{ jobs['web-fingerprint'].outputs.tech_count }}"
          echo "WAF: $(cat {{ jobs['web-fingerprint'].outputs.waf_detected_file }} 2>/dev/null || echo 'none')"
          echo "URLs crawled: {{ jobs['web-crawl'].outputs.crawl_count }}"
          echo ""
          echo "--- Vulnerabilities ---"
          echo "Nuclei findings: {{ jobs['vuln-scan'].outputs.vuln_count }}"
          echo "  Critical: {{ jobs['vuln-scan'].outputs.critical_count }}"
          echo "  High: {{ jobs['vuln-scan'].outputs.high_count }}"
          echo "  Medium: {{ jobs['vuln-scan'].outputs.medium_count }}"
          echo "Nikto findings: {{ jobs['vuln-scan'].outputs.nikto_count }}"
          echo "CRLF injections: {{ jobs['vuln-scan'].outputs.crlf_count }}"
          echo "Secrets/Leaks: {{ jobs['secret-hunt'].outputs.secrets_count }}"
          echo "Subdomain takeovers: {{ jobs['takeover-check'].outputs.takeover_count }}"
          echo ""
          echo "--- OSINT ---"
          echo "Emails harvested: {{ jobs.osint.outputs.email_count }}"
          echo "Breach results: {{ jobs.osint.outputs.breach_count }}"
        log-stdout: true
      - name: export-to-project
        script: |
          import shutil
          from pathlib import Path

          project = '{{ vars.project_path | default("", true) }}'
          if not project:
              print('No --project set, skipping file export')
          else:

              # subdomains
              d = '{{ vars.project_subdomains }}'
              Path(d).mkdir(parents=True, exist_ok=True)
              src = '''{{ jobs['subdomain-enum'].outputs.subs_file | default('', true) }}'''
              if src and Path(src).is_file():
                  shutil.copy2(src, Path(d) / 'subdomains.txt')
                  print('  [+] subdomains/subdomains.txt')

              # alive subs
              d = '{{ vars.project_subdomains }}'
              Path(d).mkdir(parents=True, exist_ok=True)
              src = '''{{ jobs['dns-verify'].outputs.alive_file | default('', true) }}'''
              if src and Path(src).is_file():
                  shutil.copy2(src, Path(d) / 'alive-subs.txt')
                  print('  [+] subdomains/alive-subs.txt')

              # open ports
              d = '{{ vars.project_hosts }}'
              Path(d).mkdir(parents=True, exist_ok=True)
              src = '''{{ jobs['port-scan'].outputs.ports_file | default('', true) }}'''
              if src and Path(src).is_file():
                  shutil.copy2(src, Path(d) / 'open-ports.txt')
                  print('  [+] hosts/open-ports.txt')

              # HTTP URLs
              d = '{{ vars.project_web }}'
              Path(d).mkdir(parents=True, exist_ok=True)
              data = '''{{ jobs['http-probe'].outputs.live_urls | default('', true) }}'''.strip()
              if data:
                  (Path(d) / 'http-urls.txt').write_text(data)
                  print(f'  [+] web/http-urls.txt ({len(data.splitlines())} lines)')

              # crawled URLs
              d = '{{ vars.project_web }}'
              Path(d).mkdir(parents=True, exist_ok=True)
              src = '''{{ jobs['web-crawl'].outputs.crawled_file | default('', true) }}'''
              if src and Path(src).is_file():
                  shutil.copy2(src, Path(d) / 'crawled-urls.txt')
                  print('  [+] web/crawled-urls.txt')

              # emails
              d = '{{ vars.project_osint }}'
              Path(d).mkdir(parents=True, exist_ok=True)
              src = '''{{ jobs['osint'].outputs.email_file | default('', true) }}'''
              if src and Path(src).is_file():
                  shutil.copy2(src, Path(d) / 'emails.txt')
                  print('  [+] osint/emails.txt')

              # Auto-export typed outputs
              all_typed = []
              for typed in [
                  {{ jobs['domain-intel'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['subdomain-enum'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['dns-verify'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['port-scan'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['http-probe'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['web-fingerprint'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['web-crawl'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['takeover-check'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['secret-hunt'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['vuln-scan'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['osint'].outputs.typed_outputs | default([], true) | tojson }},
              ]:
                  all_typed.extend(typed)
              summaries = export_typed_outputs(project, all_typed)
              for s in summaries:
                  print(s)

              print(f'Project export complete: {project}')
        continue-on-error: true
