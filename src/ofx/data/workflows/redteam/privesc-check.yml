name: privesc-check
description: |
  Privilege escalation check command generator — produces enumeration
  commands for Linux or Windows using ofx.api.privesc.  Outputs a
  ready-to-run shell script with all relevant checks.
tags: [redteam, privesc, linux, windows, enumeration]
dispatch:
  inputs:
    target_os:
      required: true
      type: string
      description: "Target OS: linux, windows, or auto (generates both)"
      default: auto

jobs:
  enumerate:
    name: Generate Privesc Commands
    outputs:
      commands_file: '{{ steps["gen-commands"].outputs.commands_file | default("", true) }}'
      check_count: '{{ steps["gen-commands"].outputs.check_count | default("", true) }}'
      target_os: '{{ steps["gen-commands"].outputs.target_os | default("", true) }}'
    steps:
    - name: gen-commands
      timeout: 3
      continue-on-error: true
      script: |
        from ofx.api.privesc.linux import (
            suid_commands,
            capabilities_command,
            sudo_check_command,
            writable_systemd_command,
            docker_escape_commands,
            lxd_escape_commands,
            nfs_check_commands,
            path_hijack_check_commands,
            writable_passwd_command,
            kernel_exploit_check_command,
        )
        from ofx.api.privesc.windows import (
            uac_bypass_commands,
            token_privileges_commands,
            unquoted_service_path_command,
            alwaysinstallelevated_commands,
            weak_service_permissions_command,
            credential_files_commands,
            printspoofer_command,
            registry_autorun_commands,
        )

        target_os = "{{ inputs.target_os }}".lower()
        lines = []
        check_count = 0

        if target_os in ("linux", "auto"):
            lines.append("#!/bin/bash")
            lines.append("# === Linux Privilege Escalation Checks ===\n")

            lines.append("# SUID/SGID binaries")
            for cmd in suid_commands():
                lines.append(cmd)
                check_count += 1

            lines.append("\n# Capabilities")
            lines.append(capabilities_command())
            check_count += 1

            lines.append("\n# Sudo privileges")
            lines.append(sudo_check_command())
            check_count += 1

            lines.append("\n# Writable systemd units")
            for cmd in writable_systemd_command():
                lines.append(cmd)
                check_count += 1

            lines.append("\n# Docker escape vectors")
            for cmd in docker_escape_commands():
                lines.append(cmd)
                check_count += 1

            lines.append("\n# LXD escape")
            for cmd in lxd_escape_commands():
                lines.append(cmd)
                check_count += 1

            lines.append("\n# NFS no_root_squash")
            for cmd in nfs_check_commands():
                lines.append(cmd)
                check_count += 1

            lines.append("\n# PATH hijacking")
            for cmd in path_hijack_check_commands():
                lines.append(cmd)
                check_count += 1

            lines.append("\n# Writable passwd/shadow")
            lines.append(writable_passwd_command())
            check_count += 1

            lines.append("\n# Kernel version (for exploit matching)")
            lines.append(kernel_exploit_check_command())
            check_count += 1

        if target_os in ("windows", "auto"):
            if target_os == "auto":
                lines.append("\n\n")
            lines.append("REM === Windows Privilege Escalation Checks ===\n")

            lines.append("REM Token privileges")
            for cmd in token_privileges_commands():
                lines.append(cmd)
                check_count += 1

            lines.append("\nREM Unquoted service paths")
            lines.append(unquoted_service_path_command())
            check_count += 1

            lines.append("\nREM AlwaysInstallElevated")
            for cmd in alwaysinstallelevated_commands():
                lines.append(cmd)
                check_count += 1

            lines.append("\nREM Weak service permissions")
            lines.append(weak_service_permissions_command())
            check_count += 1

            lines.append("\nREM Credential files")
            for cmd in credential_files_commands():
                lines.append(cmd)
                check_count += 1

            lines.append("\nREM UAC bypass (fodhelper)")
            for cmd in uac_bypass_commands("fodhelper", payload="cmd.exe"):
                lines.append(cmd)
                check_count += 1

            lines.append("\nREM PrintSpoofer (SeImpersonate)")
            lines.append(printspoofer_command())
            check_count += 1

            lines.append("\nREM Registry autoruns")
            for cmd in registry_autorun_commands():
                lines.append(cmd)
                check_count += 1

        out_file = "/tmp/ofx_privesc_commands.sh"
        with open(out_file, "w") as f:
            for line in lines:
                f.write(f"{line}\n")

        print(f"[+] Generated {check_count} privesc check commands for: {target_os}")
        print(f"    Output: {out_file}")

        with open("{{ env.OFX_OUTPUTS }}", "a") as f:
            f.write(f"commands_file={out_file}\n")
            f.write(f"check_count={check_count}\n")
            f.write(f"target_os={target_os}\n")

  report:
    name: Privesc Checklist Report
    needs: [enumerate]
    steps:
    - name: format-report
      timeout: 2
      continue-on-error: true
      script: |
        from ofx.api.privesc.linux import (
            suid_commands, capabilities_command, sudo_check_command,
            docker_escape_commands, nfs_check_commands,
            kernel_exploit_check_command,
        )
        from ofx.api.privesc.windows import (
            token_privileges_commands, unquoted_service_path_command,
            alwaysinstallelevated_commands, credential_files_commands,
            printspoofer_command, registry_autorun_commands,
        )

        target_os = "{{ jobs.enumerate.outputs.target_os }}"

        print("=" * 60)
        print(" PRIVILEGE ESCALATION CHECKLIST")
        print(f" Target OS: {target_os}")
        print("=" * 60)

        if target_os in ("linux", "auto"):
            checklist = [
                ("SUID/SGID Binaries", "Look for GTFOBins entries", len(suid_commands())),
                ("Capabilities", "Check cap_setuid, cap_dac_override", 1),
                ("Sudo Misconfig", "NOPASSWD, env_keep, LD_PRELOAD", 1),
                ("Docker Group", "Mount host FS via docker socket", len(docker_escape_commands())),
                ("NFS no_root_squash", "Create SUID binary on NFS share", len(nfs_check_commands())),
                ("Kernel Exploits", "Match uname -r against known CVEs", 1),
            ]
            print("\n--- Linux Checks ---")
            for name, desc, cmds in checklist:
                print(f"  [ ] {name:<25} ({cmds} cmds) — {desc}")

        if target_os in ("windows", "auto"):
            checklist = [
                ("Token Privileges", "SeImpersonate, SeDebug, SeTakeOwnership", len(token_privileges_commands())),
                ("Unquoted Service Paths", "Hijack service binary lookup", 1),
                ("AlwaysInstallElevated", "MSI-based privilege escalation", len(alwaysinstallelevated_commands())),
                ("Credential Files", "Cached creds, DPAPI, config files", len(credential_files_commands())),
                ("PrintSpoofer", "Abuse SeImpersonatePrivilege", 1),
                ("Registry Autoruns", "Writable autorun entries", len(registry_autorun_commands())),
            ]
            print("\n--- Windows Checks ---")
            for name, desc, cmds in checklist:
                print(f"  [ ] {name:<25} ({cmds} cmds) — {desc}")

        print(f"\n[*] Full script: {{ jobs.enumerate.outputs.commands_file }}")
        print(f"[*] Total checks: {{ jobs.enumerate.outputs.check_count }}")
      log-stdout: true
