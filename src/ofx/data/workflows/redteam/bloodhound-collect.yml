name: bloodhound-collect
description: |
  BloodHound data collection — run SharpHound or bloodhound-python to
  collect Active Directory relationship data for attack path analysis.
tags: [redteam, ad, bloodhound, enumeration]
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Domain controller IP
      alias: t
    domain:
      required: true
      type: string
      description: Domain name (e.g. corp.local)
    user:
      required: true
      type: string
      description: Domain username
    password:
      type: string
      default: ''
      description: Password
    hash:
      type: string
      default: ''
      description: NTLM hash
    method:
      type: string
      default: all
      description: Collection method (all, default, sessions, trusts, acl, objectprops)

jobs:
  collect:
    name: BloodHound Collection
    outputs:
      output_file: '{{ steps["bh-collect"].outputs.output_file }}'
      output_dir: '{{ steps["bh-collect"].outputs.output_dir }}'
    steps:
    - name: bh-collect
      run: |
        echo "[+] BloodHound collection: {{ inputs.domain }}"
        echo "    DC: {{ inputs.target }}"
        echo "    Method: {{ inputs.method }}"
        echo ""

        OUT_DIR="/tmp/ofx_bloodhound_$(date +%s)"
        mkdir -p "$OUT_DIR"

        if command -v bloodhound-python &>/dev/null; then
          echo "[+] Using bloodhound-python..."

          AUTH_ARGS="-u '{{ inputs.user }}' -d '{{ inputs.domain }}' -dc {{ inputs.target }} -ns {{ inputs.target }}"
          {% if inputs.password %}
          AUTH_ARGS="$AUTH_ARGS -p '{{ inputs.password }}'"
          {% endif %}
          {% if inputs.hash %}
          AUTH_ARGS="$AUTH_ARGS --hashes :{{ inputs.hash }}"
          {% endif %}

          eval bloodhound-python $AUTH_ARGS -c {{ inputs.method }} --zip -o "$OUT_DIR" 2>&1

        elif command -v rusthound &>/dev/null; then
          echo "[+] Using RustHound..."
          AUTH_ARGS="-u '{{ inputs.user }}' -d '{{ inputs.domain }}' -i {{ inputs.target }}"
          {% if inputs.password %}
          AUTH_ARGS="$AUTH_ARGS -p '{{ inputs.password }}'"
          {% endif %}
          eval rusthound $AUTH_ARGS -o "$OUT_DIR" --zip 2>&1
        else
          echo "[-] No BloodHound collector found"
          echo "    Install: pip install bloodhound  OR  cargo install rusthound"
          exit 1
        fi

        # Find output
        ZIP=$(find "$OUT_DIR" -name "*.zip" -o -name "*.json" | head -1)
        if [ -n "$ZIP" ]; then
          echo ""
          echo "[+] Output: $ZIP"
          echo "output_file=$ZIP" >> {{ env.OFX_OUTPUTS }}
          echo "output_dir=$OUT_DIR" >> {{ env.OFX_OUTPUTS }}

          # Count objects
          if command -v unzip &>/dev/null && echo "$ZIP" | grep -q ".zip"; then
            unzip -l "$ZIP" 2>/dev/null | grep -E "\.json$" | while read line; do
              echo "  $line"
            done
          fi
        else
          echo "[-] No output generated"
        fi
      continue-on-error: true

  analyze:
    name: Quick Analysis
    outputs:
      object_count: '{{ steps["analyze-data"].outputs.object_count }}'
    needs: [collect]
    steps:
    - name: analyze-data
      script: |
        import json
        import zipfile
        from pathlib import Path

        out_dir = '{{ jobs["collect"].outputs.output_dir }}'
        if not out_dir or out_dir == '':
            print("[-] No BloodHound data to analyze")
        else:
            out_path = Path(out_dir)
            stats = {}

            # Try to parse JSON files
            json_files = list(out_path.glob('*.json')) + list(out_path.glob('**/*.json'))

            # Also check zip files
            for zf in out_path.glob('*.zip'):
                try:
                    with zipfile.ZipFile(zf) as z:
                        for name in z.namelist():
                            if name.endswith('.json'):
                                data = json.loads(z.read(name))
                                obj_type = name.split('_')[0] if '_' in name else name.replace('.json', '')
                                count = len(data.get('data', data.get('computers', data.get('users', []))))
                                stats[obj_type] = count
                except Exception:
                    pass

            for jf in json_files:
                try:
                    data = json.loads(jf.read_text())
                    obj_type = jf.stem.split('_')[0]
                    count = len(data.get('data', data.get('computers', data.get('users', []))))
                    stats[obj_type] = count
                except Exception:
                    pass

            print("=== BLOODHOUND DATA SUMMARY ===\n")
            total = 0
            for obj_type, count in sorted(stats.items()):
                print(f"  {obj_type}: {count}")
                total += count
            print(f"\n  Total objects: {total}")

            with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
                f.write(f"object_count={total}\n")

            print(f"\n[+] Import into BloodHound CE:")
            print(f"    Upload ZIP from: {out_dir}")
      log-stdout: true
