name: container-scan
description: |
  Comprehensive container image security analysis — scans for OS and
  library vulnerabilities, embedded secrets, and Dockerfile best-practice
  violations using multiple engines. Provides deduplicated results.
tags:
  - vuln
  - secret
  - container
  - docker
  - compliance
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    image:
      required: true
      type: string
      description: Container image to scan (e.g. nginx:latest, myapp:v1.0)
      alias: i
    dockerfile:
      type: string
      default: ""
      description: Path to Dockerfile for best-practice checks
    severity:
      type: string
      default: "CRITICAL,HIGH,MEDIUM"
      description: Severity filter for vulnerability results
    scan_dockerfile:
      type: boolean
      default: true
      description: Run Dockerfile linting (hadolint)
    check_secrets:
      type: boolean
      default: true
      description: Scan for embedded secrets in image layers
defaults:
    store-creds: true

jobs:
  image-vulns:
    name: Image Vulnerability Scan
    outputs:
      vuln_count: "{{ steps.export-vulns.outputs.vuln_count | default(\"0\", true) }}"
      critical_count: "{{ steps.export-vulns.outputs.critical_count | default(\"0\", true) }}"
    steps:
      - task: trivy
        log-command: "{{ inputs.log_command | default(true) }}"
        name: trivy-image
        with:
          target: "{{ inputs.image }}"
          severity: "{{ inputs.severity }}"
        continue-on-error: true

      - task: grype
        log-command: "{{ inputs.log_command | default(true) }}"
        name: grype-image
        with:
          target: "{{ inputs.image }}"
        continue-on-error: true

      - name: dockle-scan
        run: |
          dockle --output json "{{ inputs.image }}" > /tmp/ofx_dockle.json 2>/dev/null || echo '[]' > /tmp/ofx_dockle.json
          echo "dockle_file=/tmp/ofx_dockle.json" >> "$OFX_OUTPUTS"
        continue-on-error: true

      - name: export-vulns
        script: |
          import json, os

          trivy_vulns = {{ vulns(steps["trivy-image"].outputs.typed_outputs) | tojson }}
          grype_vulns = {{ vulns(steps["grype-image"].outputs.typed_outputs) | tojson }}

          dockle_issues = []
          dockle_file = os.environ.get("OFX_RUN_DIR", "/tmp") + "/ofx_dockle.json"
          try:
              with open(dockle_file) as f:
                  dockle_data = json.load(f)
                  if isinstance(dockle_data, dict):
                      dockle_issues = dockle_data.get("details", [])
                  elif isinstance(dockle_data, list):
                      dockle_issues = dockle_data
          except Exception:
              pass

          seen = set()
          unique = []
          for v in trivy_vulns + grype_vulns:
              vid = v.get("id", v.get("name", ""))
              if vid and vid not in seen:
                  seen.add(vid)
                  unique.append(v)

          for issue in dockle_issues:
              if isinstance(issue, dict):
                  issue["_type"] = "vulnerability"
              unique.append(issue)

          critical = len([v for v in unique if str(v.get("severity", "")).lower() == "critical"])

          add_outputs(vuln_count=len(unique), critical_count=critical)
          print(f"Container vulnerabilities: {len(unique)} total ({critical} critical)")

  dockerfile-check:
    name: Dockerfile Best Practices
    needs: [image-vulns]
    run_if: "{{ inputs.dockerfile and inputs.scan_dockerfile }}"
    outputs:
      dockerfile_issues: "{{ steps.export-df.outputs.issue_count | default(\"0\", true) }}"
    steps:
      - name: hadolint-scan
        run: |
          hadolint --format json "{{ inputs.dockerfile }}" > /tmp/ofx_hadolint.json 2>/dev/null || echo '[]' > /tmp/ofx_hadolint.json
        continue-on-error: true

      - name: export-df
        script: |
          import json, os
          hadolint_file = os.environ.get("OFX_RUN_DIR", "/tmp") + "/ofx_hadolint.json"
          issues = []
          try:
              with open(hadolint_file) as f:
                  issues = json.load(f)
          except Exception:
              pass
          add_outputs(issue_count=len(issues))
          print(f"Dockerfile issues: {len(issues)}")

  secrets-scan:
    name: Embedded Secrets Check
    needs: [image-vulns]
    run_if: "{{ inputs.check_secrets }}"
    outputs:
      secrets_count: "{{ steps.export-secrets.outputs.secrets_count | default(\"0\", true) }}"
    steps:
      - task: trufflehog
        log-command: "{{ inputs.log_command | default(true) }}"
        name: image-secrets
        with:
          target: "docker://{{ inputs.image }}"
          mode: filesystem
        continue-on-error: true

      - name: export-secrets
        script: |
          results = {{ steps["image-secrets"].outputs.typed_outputs | default([], true) | tojson }}
          add_outputs(secrets_count=len(results))
          print(f"Embedded secrets: {len(results)}")

  summary:
    name: Container Security Report
    needs:
      - image-vulns
      - dockerfile-check
      - secrets-scan
    steps:
      - name: Report
        run: |
          echo "=== CONTAINER SECURITY REPORT ==="
          echo "Image: {{ inputs.image }}"
          echo ""
          echo "Vulnerabilities:"
          echo "  Total: {{ jobs['image-vulns'].outputs.vuln_count }}"
          echo "  Critical: {{ jobs['image-vulns'].outputs.critical_count }}"
          echo ""
          echo "Dockerfile Issues:"
          echo "  Total: {{ jobs['dockerfile-check'].outputs.dockerfile_issues | default('N/A') }}"
          echo ""
          echo "Embedded Secrets:"
          echo "  Total: {{ jobs['secrets-scan'].outputs.secrets_count | default('N/A') }}"
        log-stdout: "{{ inputs.log_output | default(true) }}"

outputs:
  vuln_count: "{{ jobs['image-vulns'].outputs.vuln_count }}"
  critical_count: "{{ jobs['image-vulns'].outputs.critical_count }}"
  dockerfile_issues: "{{ jobs['dockerfile-check'].outputs.dockerfile_issues | default('0', true) }}"
  secrets_count: "{{ jobs['secrets-scan'].outputs.secrets_count | default('0', true) }}"
