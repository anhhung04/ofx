# yaml-language-server: $schema=~/.ofx/workflow_schema.json
name: code-scan
description: 'Code vulnerability scan and secret hunt — analyzes source code for security vulnerabilities in dependencies (grype, trivy) and hardcoded secrets (gitleaks, trufflehog).

  '
tags:
- vuln
- secret
- code
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Path to codebase, Git repo URL, or container image
      alias: t
jobs:
  vuln-scan:
    name: Vulnerability Scanning
    outputs:
      vuln_count: '{{ steps.export-vulns.outputs.vuln_count }}'
      critical_count: '{{ steps.export-vulns.outputs.critical_count }}'
    steps:
    - task: grype
      name: dependency-vulns
      with:
        target: '{{ inputs.target }}'
      log-stdout: true
      continue-on-error: true
    - task: trivy
      name: code-vulns
      with:
        target: '{{ inputs.target }}'
        severity: CRITICAL,HIGH,MEDIUM
      log-stdout: true
      continue-on-error: true
    - name: export-vulns
      script: |
        import json

        grype_vulns = {{ vulns(steps[0].outputs.typed_outputs) | tojson }}
        trivy_vulns = {{ vulns(steps[1].outputs.typed_outputs) | tojson }}

        seen = set()
        unique = []
        for v in grype_vulns + trivy_vulns:
            vid = v.get('id', v.get('name', ''))
            if vid not in seen:
                seen.add(vid)
                unique.append(v)

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"vuln_count={len(unique)}\n")
            f.write(f"critical_count={len([v for v in unique if v.get('severity') == 'critical'])}\n")

        print(f"Found {len(unique)} unique vulnerabilities")
      log-stdout: true
  secrets-scan:
    name: Secret & Leak Scanning
    outputs:
      secrets_count: '{{ steps.export-secrets.outputs.secrets_count }}'
    steps:
    - task: gitleaks
      name: gitleaks-scan
      with:
        target: '{{ inputs.target }}'
      log-stdout: true
      continue-on-error: true
    - task: trufflehog
      name: trufflehog-scan
      with:
        target: '{{ inputs.target }}'
        mode: filesystem
      log-stdout: true
      continue-on-error: true
    - name: export-secrets
      script: |
        import json

        gl_vulns = {{ vulns(steps[0].outputs.typed_outputs) | tojson }}
        th_vulns = {{ vulns(steps[1].outputs.typed_outputs) | tojson }}
        total = len(gl_vulns) + len(th_vulns)

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"secrets_count={total}\n")

        print(f"Found {total} secrets/leaks")
      log-stdout: true
  summary:
    name: Code Scan Summary
    needs:
    - vuln-scan
    - secrets-scan
    steps:
    - name: report
      run: |
        echo "================================="
        echo " Code Scan: {{ inputs.target }}"
        echo "================================="
        echo "Vulnerabilities: {{ jobs['vuln-scan'].outputs.vuln_count }}"
        echo "  Critical: {{ jobs['vuln-scan'].outputs.critical_count }}"
        echo "Secrets/Leaks: {{ jobs['secrets-scan'].outputs.secrets_count }}"
      log-stdout: true
