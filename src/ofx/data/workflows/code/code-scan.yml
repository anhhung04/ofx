# yaml-language-server: $schema=~/.ofx/workflow_schema.json
name: code-scan
description: 'Code vulnerability scan and secret hunt — analyzes source code for security
  vulnerabilities in dependencies (grype, trivy) and hardcoded secrets (gitleaks,
  trufflehog).

  '
tags:
- vuln
- secret
- code
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Path to codebase, Git repo URL, or container image
jobs:
  vuln-scan:
    name: Vulnerability Scanning
    steps:
    - task: grype
      name: dependency-vulns
      with:
        target: '{{ inputs.target }}'
      log-stdout: true
    - task: trivy
      name: code-vulns
      with:
        target: '{{ inputs.target }}'
        severity: CRITICAL,HIGH,MEDIUM
      log-stdout: true
    - name: export-vulns
      script: "import json\n\ngrype_vulns = {{ vulns(steps[0].outputs.typed_outputs)\
        \ | tojson }}\ntrivy_vulns = {{ vulns(steps[1].outputs.typed_outputs) | tojson\
        \ }}\n\nseen = set()\nunique = []\nfor v in grype_vulns + trivy_vulns:\n \
        \   vid = v.get('id', v.get('name', ''))\n    if vid not in seen:\n      \
        \  seen.add(vid)\n        unique.append(v)\n\nwith open('{{ env.OFX_OUTPUTS\
        \ }}', 'a') as f:\n    f.write(f\"vuln_count={len(unique)}\\n\")\n    f.write(f\"\
        critical_count={len([v for v in unique if v.get('severity') == 'critical'])}\\\
        n\")\n\nprint(f\"Found {len(unique)} unique vulnerabilities\")\n"
      log-stdout: true
  secrets-scan:
    name: Secret & Leak Scanning
    steps:
    - task: gitleaks
      name: gitleaks-scan
      with:
        target: '{{ inputs.target }}'
      log-stdout: true
    - task: trufflehog
      name: trufflehog-scan
      with:
        target: '{{ inputs.target }}'
        mode: filesystem
      log-stdout: true
    - name: export-secrets
      script: "import json\n\ngl_vulns = {{ vulns(steps[0].outputs.typed_outputs)\
        \ | tojson }}\nth_vulns = {{ vulns(steps[1].outputs.typed_outputs) | tojson\
        \ }}\ntotal = len(gl_vulns) + len(th_vulns)\n\nwith open('{{ env.OFX_OUTPUTS\
        \ }}', 'a') as f:\n    f.write(f\"secrets_count={total}\\n\")\n\nprint(f\"\
        Found {total} secrets/leaks\")\n"
      log-stdout: true
  summary:
    name: Code Scan Summary
    needs:
    - vuln-scan
    - secrets-scan
    steps:
    - name: report
      run: 'echo "================================="

        echo " Code Scan: {{ inputs.target }}"

        echo "================================="

        echo "Vulnerabilities: {{ jobs[''vuln-scan''].outputs.vuln_count }}"

        echo "  Critical: {{ jobs[''vuln-scan''].outputs.critical_count }}"

        echo "Secrets/Leaks: {{ jobs[''secrets-scan''].outputs.secrets_count }}"

        '
      log-stdout: true
