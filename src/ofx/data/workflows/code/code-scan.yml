name: code-scan
description: 'Code vulnerability scan and secret hunt — analyzes source code for security vulnerabilities in dependencies (grype, trivy) and hardcoded secrets (gitleaks, trufflehog).

  '
tags:
- vuln
- secret
- code
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Path to codebase, Git repo URL, or container image
      alias: t
jobs:
  vuln-scan:
    name: Vulnerability Scanning
    outputs:
      vuln_count: '{{ steps["export-vulns"].outputs.vuln_count | default("", true) }}'
      critical_count: '{{ steps["export-vulns"].outputs.critical_count | default("", true) }}'
    steps:
    - task: grype
      log-command: "{{ inputs.log_command | default(true) }}"
      name: dependency-vulns
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - task: trivy
      log-command: "{{ inputs.log_command | default(true) }}"
      name: code-vulns
      with:
        target: '{{ inputs.target }}'
        severity: CRITICAL,HIGH,MEDIUM
      continue-on-error: true
    - name: export-vulns
      script: |
        import json

        grype_vulns = {{ vulns(steps["dependency-vulns"].outputs.typed_outputs) | tojson }}
        trivy_vulns = {{ vulns(steps["code-vulns"].outputs.typed_outputs) | tojson }}

        seen = set()
        unique = []
        for v in grype_vulns + trivy_vulns:
            vid = v.get('id', v.get('name', ''))
            if vid not in seen:
                seen.add(vid)
                unique.append(v)

        add_outputs(vuln_count=len(unique), critical_count=len([v for v in unique if v.get('severity') == 'critical']))
        print(f"Found {len(unique)} unique vulnerabilities")
  secrets-scan:
    name: Secret & Leak Scanning
    outputs:
      secrets_count: '{{ steps["export-secrets"].outputs.secrets_count | default("", true) }}'
    steps:
    - task: gitleaks
      log-command: "{{ inputs.log_command | default(true) }}"
      name: gitleaks-scan
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - task: trufflehog
      log-command: "{{ inputs.log_command | default(true) }}"
      name: trufflehog-scan
      with:
        target: '{{ inputs.target }}'
        mode: filesystem
      continue-on-error: true
    - name: export-secrets
      script: |
        import json

        gl_vulns = {{ vulns(steps["gitleaks-scan"].outputs.typed_outputs) | tojson }}
        th_vulns = {{ vulns(steps["trufflehog-scan"].outputs.typed_outputs) | tojson }}
        total = len(gl_vulns) + len(th_vulns)

        add_outputs(secrets_count=total)
        print(f"Found {total} secrets/leaks")
  summary:
    name: Code Scan Summary
    needs:
    - vuln-scan
    - secrets-scan
    steps:
    - name: report
      run: |
        echo "================================="
        echo " Code Scan: {{ inputs.target }}"
        echo "================================="
        echo "Vulnerabilities: {{ jobs['vuln-scan'].outputs.vuln_count }}"
        echo "  Critical: {{ jobs['vuln-scan'].outputs.critical_count }}"
        echo "Secrets/Leaks: {{ jobs['secrets-scan'].outputs.secrets_count }}"
      log-stdout: "{{ inputs.log_output | default(true) }}"

    - name: export-to-project
      script: |
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:
            all_typed = []
            for typed in [
            {{ jobs['vuln-scan'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['secrets-scan'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true