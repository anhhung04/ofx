name: code-scan
description: >
  Comprehensive source code security analysis — scans for
  vulnerabilities (SAST, dependency scanning) and hardcoded
  secrets in code repositories and directories.
tags:
  - vuln
  - secret
  - sast
  - code
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Path to codebase or Git repository URL
      alias: t
    scan_python:
      type: boolean
      default: true
      description: Run Python-specific security analysis (bandit)
    run_semgrep:
      type: boolean
      default: true
      description: Run Semgrep SAST analysis
defaults:
    store-creds: true

jobs:
  sast-scan:
    name: Static Application Security Testing
    outputs:
      sast_count: "{{ steps.export-sast.outputs.sast_count | default(\"0\", true) }}"
    steps:
      - name: semgrep-scan
        run: |
          semgrep --config auto --json "{{ inputs.target }}" > /tmp/ofx_semgrep.json 2>/dev/null || echo '{"results":[]}' > /tmp/ofx_semgrep.json
        run_if: "{{ inputs.run_semgrep }}"
        continue-on-error: true

      - name: bandit-scan
        run: |
          bandit -r -f json "{{ inputs.target }}" > /tmp/ofx_bandit.json 2>/dev/null || echo '{"results":[]}' > /tmp/ofx_bandit.json
        run_if: "{{ inputs.scan_python }}"
        continue-on-error: true

      - name: export-sast
        script: |
          import json, os

          semgrep_findings = []
          bandit_findings = []
          try:
              with open("/tmp/ofx_semgrep.json") as f:
                  data = json.load(f)
                  semgrep_findings = data.get("results", [])
          except: pass
          try:
              with open("/tmp/ofx_bandit.json") as f:
                  data = json.load(f)
                  bandit_findings = data.get("results", [])
          except: pass

          seen = set()
          unique = []
          for f in semgrep_findings + bandit_findings:
              fid = f.get('check_id', f.get('test_id', ''))
              if fid and fid not in seen:
                  seen.add(fid)
                  unique.append(f)

          add_outputs(sast_count=len(unique))
          print(f"SAST findings: {len(unique)} unique issues")

  dependency-vulns:
    name: Dependency Vulnerability Scan
    outputs:
      dep_vuln_count: "{{ steps.export-deps.outputs.vuln_count | default(\"0\", true) }}"
      dep_critical_count: "{{ steps.export-deps.outputs.critical_count | default(\"0\", true) }}"
    steps:
      - task: grype
        log-command: "{{ inputs.log_command | default(true) }}"
        name: grype-deps
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true

      - task: trivy
        log-command: "{{ inputs.log_command | default(true) }}"
        name: trivy-deps
        with:
          target: "{{ inputs.target }}"
          severity: CRITICAL,HIGH,MEDIUM
        continue-on-error: true

      - name: npm-audit-scan
        run: |
          cd "{{ inputs.target }}" 2>/dev/null && npm audit --json > /tmp/ofx_npm_audit.json 2>/dev/null || echo '{}' > /tmp/ofx_npm_audit.json
          cd "$OLDPWD" 2>/dev/null || true
        run_if: "{{ inputs.target | endswith('package.json') or inputs.target | contains('node_modules') }}"
        continue-on-error: true

      - name: pip-audit-scan
        run: |
          pip-audit -r "{{ inputs.target }}" --format json > /tmp/ofx_pip_audit.json 2>/dev/null || echo '[]' > /tmp/ofx_pip_audit.json
        run_if: "{{ inputs.target | endswith('requirements.txt') or inputs.target | endswith('pyproject.toml') or inputs.target | contains('site-packages') }}"
        continue-on-error: true

      - name: export-deps
        script: |
          import json, os

          grype_vulns = {{ vulns(steps["grype-deps"].outputs.typed_outputs) | tojson }}
          trivy_vulns = {{ vulns(steps["trivy-deps"].outputs.typed_outputs) | tojson }}

          npm_vulns = []
          pip_vulns = []
          try:
              with open("/tmp/ofx_npm_audit.json") as f:
                  data = json.load(f)
                  advisories = data.get("advisories", {})
                  npm_vulns = list(advisories.values())
          except: pass
          try:
              with open("/tmp/ofx_pip_audit.json") as f:
                  data = json.load(f)
                  if isinstance(data, list):
                      pip_vulns = data
          except: pass

          seen = set()
          unique = []
          for v in grype_vulns + trivy_vulns + npm_vulns + pip_vulns:
              vid = v.get('id', v.get('name', ''))
              if vid and vid not in seen:
                  seen.add(vid)
                  unique.append(v)

          critical = len([v for v in unique if v.get('severity', '').lower() == 'critical'])

          add_outputs(vuln_count=len(unique), critical_count=critical)
          print(f"Dependency vulnerabilities: {len(unique)} unique ({critical} critical)")

  secrets-scan:
    name: Secret & Leak Scanning
    outputs:
      secrets_count: "{{ steps.export-secrets.outputs.secrets_count | default(\"0\", true) }}"
    steps:
      - task: gitleaks
        log-command: "{{ inputs.log_command | default(true) }}"
        name: gitleaks-scan
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true

      - task: trufflehog
        log-command: "{{ inputs.log_command | default(true) }}"
        name: trufflehog-scan
        with:
          target: "{{ inputs.target }}"
          mode: filesystem
        continue-on-error: true

      - name: export-secrets
        script: |
          import json

          gl_secrets = {{ steps["gitleaks-scan"].outputs.typed_outputs | default([], true) | tojson }}
          th_secrets = {{ steps["trufflehog-scan"].outputs.typed_outputs | default([], true) | tojson }}

          seen = set()
          unique = []
          for s in gl_secrets + th_secrets:
              key = s.get('_uuid', s.get('value', str(s)))
              if key not in seen:
                  seen.add(key)
                  unique.append(s)

          add_outputs(secrets_count=len(unique))
          print(f"Secrets/leaks found: {len(unique)} unique")

  summary:
    name: Code Scan Summary
    needs:
      - sast-scan
      - dependency-vulns
      - secrets-scan
    steps:
      - name: report
        run: |
          echo "========================================"
          echo " CODE SCAN SUMMARY"
          echo "========================================"
          echo "Target: {{ inputs.target }}"
          echo ""
          echo "SAST Issues:"
          echo "  Total: {{ jobs['sast-scan'].outputs.sast_count }}"
          echo ""
          echo "Dependency Vulnerabilities:"
          echo "  Total: {{ jobs['dependency-vulns'].outputs.dep_vuln_count }}"
          echo "  Critical: {{ jobs['dependency-vulns'].outputs.dep_critical_count }}"
          echo ""
          echo "Secrets/Leaks:"
          echo "  Total: {{ jobs['secrets-scan'].outputs.secrets_count }}"
          echo ""
          echo "========================================"
        log-stdout: "{{ inputs.log_output | default(true) }}"

      - name: export-to-project
        script: |
          from pathlib import Path

          project = '{{ vars.project_path | default("", true) }}'
          if not project:
              print('No --project set, skipping file export')
          else:
              all_typed = []
              for typed in [
              {{ jobs['sast-scan'].outputs.typed_outputs | default([], true) | tojson }},
              {{ jobs['dependency-vulns'].outputs.typed_outputs | default([], true) | tojson }},
              {{ jobs['secrets-scan'].outputs.typed_outputs | default([], true) | tojson }},
              ]:
                  all_typed.extend(typed)
              summaries = export_typed_outputs(project, all_typed)
              for s in summaries:
                  print(s)

              print(f'Project export complete: {project}')
        continue-on-error: true

outputs:
  total_sast: "{{ jobs['sast-scan'].outputs.sast_count }}"
  total_dep_vulns: "{{ jobs['dependency-vulns'].outputs.dep_vuln_count }}"
  critical_dep_vulns: "{{ jobs['dependency-vulns'].outputs.dep_critical_count }}"
  total_secrets: "{{ jobs['secrets-scan'].outputs.secrets_count }}"
