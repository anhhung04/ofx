name: dependency-audit
description: |
  Comprehensive dependency vulnerability audit — scans project
  dependencies across multiple ecosystems (npm, pip, Go, Ruby, etc.)
  using grype and trivy. Deduplicates findings and reports by severity.
tags:
  - vuln
  - supply-chain
  - audit
  - dependencies
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Path to source code, container image, or SBOM file
      alias: t
    severity:
      type: string
      default: "CRITICAL,HIGH"
      description: Minimum severity filter (CRITICAL, HIGH, MEDIUM, LOW)
    fail_on_critical:
      type: boolean
      default: false
      description: Exit with error if critical vulnerabilities found
    scan_npm:
      type: boolean
      default: true
      description: Run npm audit for JavaScript projects
    scan_pip:
      type: boolean
      default: true
      description: Run pip-audit for Python projects
    scan_go:
      type: boolean
      default: true
      description: Scan Go modules (via grype/trivy)
    scan_ruby:
      type: boolean
      default: true
      description: Scan Ruby gems (via grype/trivy)
defaults:
    store-creds: true

jobs:
  ecosystem-scans:
    name: Ecosystem-Specific Scans
    outputs:
      npm_count: "{{ steps.export-ecosystem.outputs.npm_count | default(\"0\", true) }}"
      pip_count: "{{ steps.export-ecosystem.outputs.pip_count | default(\"0\", true) }}"
      go_count: "{{ steps.export-ecosystem.outputs.go_count | default(\"0\", true) }}"
      ruby_count: "{{ steps.export-ecosystem.outputs.ruby_count | default(\"0\", true) }}"
    steps:
      - name: npm-audit-scan
        run: |
          cd "{{ inputs.target }}" 2>/dev/null && npm audit --json > /tmp/ofx_depaudit_npm.json 2>/dev/null || echo '{}' > /tmp/ofx_depaudit_npm.json
          cd "$OLDPWD" 2>/dev/null || true
        run_if: "{{ inputs.scan_npm }}"
        continue-on-error: true

      - name: pip-audit-scan
        run: |
          pip-audit -r "{{ inputs.target }}" --format json > /tmp/ofx_depaudit_pip.json 2>/dev/null || echo '[]' > /tmp/ofx_depaudit_pip.json
        run_if: "{{ inputs.scan_pip }}"
        continue-on-error: true

      - name: export-ecosystem
        script: |
          import json, os

          npm_vulns = []
          pip_vulns = []
          try:
              with open("/tmp/ofx_depaudit_npm.json") as f:
                  data = json.load(f)
                  npm_vulns = list(data.get("advisories", {}).values())
          except: pass
          try:
              with open("/tmp/ofx_depaudit_pip.json") as f:
                  data = json.load(f)
                  if isinstance(data, list):
                      pip_vulns = data
          except: pass

          add_outputs(
              npm_count=len(npm_vulns),
              pip_count=len(pip_vulns),
              go_count=0,
              ruby_count=0
          )
          print(f"Ecosystem vulns: npm={len(npm_vulns)}, pip={len(pip_vulns)}")

  main-scan:
    name: Universal Dependency Scan
    needs: [ecosystem-scans]
    outputs:
      vuln_count: "{{ steps.aggregate.outputs.vuln_count | default(\"0\", true) }}"
      critical_count: "{{ steps.aggregate.outputs.critical_count | default(\"0\", true) }}"
      high_count: "{{ steps.aggregate.outputs.high_count | default(\"0\", true) }}"
      medium_count: "{{ steps.aggregate.outputs.medium_count | default(\"0\", true) }}"
      low_count: "{{ steps.aggregate.outputs.low_count | default(\"0\", true) }}"
    steps:
      - task: grype
        log-command: "{{ inputs.log_command | default(true) }}"
        name: grype-scan
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true

      - task: trivy
        log-command: "{{ inputs.log_command | default(true) }}"
        name: trivy-scan
        with:
          target: "{{ inputs.target }}"
          severity: "{{ inputs.severity }}"
        continue-on-error: true

      - name: aggregate
        script: |
          import json

          grype_vulns = {{ vulns(steps["grype-scan"].outputs.typed_outputs) | tojson }}
          trivy_vulns = {{ vulns(steps["trivy-scan"].outputs.typed_outputs) | tojson }}

          seen = set()
          unique = []
          for v in grype_vulns + trivy_vulns:
              vid = v.get("id", v.get("name", ""))
              if vid and vid not in seen:
                  seen.add(vid)
                  unique.append(v)

          severity_map = {"critical": 0, "high": 0, "medium": 0, "low": 0, "info": 0}
          for v in unique:
              sev = v.get("severity", "unknown").lower()
              if sev in severity_map:
                  severity_map[sev] += 1
              else:
                  severity_map["info"] += 1

          add_outputs(
              vuln_count=len(unique),
              critical_count=severity_map["critical"],
              high_count=severity_map["high"],
              medium_count=severity_map["medium"],
              low_count=severity_map["low"]
          )
          print(f"Dependency vulnerabilities: {len(unique)} unique")
          print(f"  Critical: {severity_map['critical']}")
          print(f"  High: {severity_map['high']}")
          print(f"  Medium: {severity_map['medium']}")
          print(f"  Low: {severity_map['low']}")

  report:
    name: Audit Report
    needs:
      - ecosystem-scans
      - main-scan
    steps:
      - name: Summary
        run: |
          echo "=== DEPENDENCY AUDIT REPORT ==="
          echo "Target: {{ inputs.target }}"
          echo ""
          echo "Universal Scanner Results:"
          echo "  Total: {{ jobs['main-scan'].outputs.vuln_count }}"
          echo "  Critical: {{ jobs['main-scan'].outputs.critical_count }}"
          echo "  High: {{ jobs['main-scan'].outputs.high_count }}"
          echo "  Medium: {{ jobs['main-scan'].outputs.medium_count }}"
          echo "  Low: {{ jobs['main-scan'].outputs.low_count }}"
          echo ""
          echo "Ecosystem-Specific:"
          echo "  npm audit: {{ jobs['ecosystem-scans'].outputs.npm_count }}"
          echo "  pip-audit: {{ jobs['ecosystem-scans'].outputs.pip_count }}"
        log-stdout: "{{ inputs.log_output | default(true) }}"

      - name: Check threshold
        log-command: "{{ inputs.log_command | default(true) }}"
        run: |
          critical="{{ jobs['main-scan'].outputs.critical_count | default('0', true) }}"
          if [ "{{ inputs.fail_on_critical }}" = "true" ] && [ "$critical" -gt 0 ]; then
            echo "FAIL: $critical critical vulnerabilities found"
            exit 1
          fi

outputs:
  vuln_count: "{{ jobs['main-scan'].outputs.vuln_count }}"
  critical_count: "{{ jobs['main-scan'].outputs.critical_count }}"
  high_count: "{{ jobs['main-scan'].outputs.high_count }}"
  medium_count: "{{ jobs['main-scan'].outputs.medium_count }}"
  low_count: "{{ jobs['main-scan'].outputs.low_count }}"
