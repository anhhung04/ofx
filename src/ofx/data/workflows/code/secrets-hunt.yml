name: secrets-hunt
description: |
  Deep scan for hardcoded secrets, API keys, tokens, and credentials
  in source code repositories — uses gitleaks and trufflehog with
  historical commit analysis for thorough coverage.
tags: [code, secret, credential, leak]

dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Path to Git repository or source code directory
      alias: t
    scan_history:
      type: boolean
      default: true
      description: Scan full Git history (slower but thorough)
    baseline:
      type: string
      default: ""
      description: Path to baseline file to ignore known secrets

jobs:
  scan:
    name: Secret Detection
    outputs:
      gitleaks_count: "{{ steps.export.outputs.gitleaks_count }}"
      trufflehog_count: "{{ steps.export.outputs.trufflehog_count }}"
      total_count: "{{ steps.export.outputs.total_count }}"
    steps:
      - task: gitleaks
        timeout: 20
        name: gitleaks-scan
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true

      - task: trufflehog
        timeout: 20
        name: trufflehog-scan
        with:
          target: "{{ inputs.target }}"
          mode: filesystem
        continue-on-error: true

      - name: export
        script: |
          import json

          gitleaks = {{ steps["gitleaks-scan"].outputs.typed_outputs | default([], true) | tojson }}
          trufflehog = {{ steps["trufflehog-scan"].outputs.typed_outputs | default([], true) | tojson }}

          # Deduplicate by secret content hash
          seen = set()
          unique = []
          for item in gitleaks + trufflehog:
              key = item.get("_uuid", str(item))
              if key not in seen:
                  seen.add(key)
                  unique.append(item)

          add_outputs(gitleaks_count=len(gitleaks), trufflehog_count=len(trufflehog), total_count=len(unique))
  report:
    name: Secrets Report
    needs: [scan]
    steps:
      - name: Summary
        run: |
          echo "=== Secrets Hunt Report ==="
          echo "Target: {{ inputs.target }}"
          echo ""
          echo "Gitleaks findings: {{ jobs['scan'].outputs.gitleaks_count }}"
          echo "TruffleHog findings: {{ jobs['scan'].outputs.trufflehog_count }}"
          echo "Unique secrets: {{ jobs['scan'].outputs.total_count }}"
        log-stdout: true

outputs:
  total_secrets: "{{ jobs['scan'].outputs.total_count }}"
