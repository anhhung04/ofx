name: secrets-hunt
description: |
  Deep scan for hardcoded secrets, API keys, tokens, and credentials
  in source code repositories — uses gitleaks and trufflehog with
  historical Git commit analysis. Includes git-dumper for extracting
  secrets from bare repositories or lost+found directories.
tags:
  - secret
  - credential
  - leak
  - git
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Path to Git repository or source code directory
      alias: t
    scan_history:
      type: boolean
      default: true
      description: Scan full Git history (slower but thorough)
    baseline:
      type: string
      default: ""
      description: Path to baseline file of known false positives to exclude
    extract_lost:
      type: boolean
      default: false
      description: Attempt git-dumper extraction from lost+found (bare repos)
defaults:
    store-creds: true

jobs:
  git-extract:
    name: Git Repository Extraction
    run_if: "{{ inputs.extract_lost }}"
    steps:
      - name: git-dumper extraction
        log-command: "{{ inputs.log_command | default(true) }}"
        run: |
          set -euo pipefail
          TARGET="{{ inputs.target }}"
          EXTRACT_DIR="/tmp/git-dumper-$(date +%s)"

          echo "[*] Checking for bare repository or lost+found..."
          if [ -d "$TARGET/objects" ] && [ -f "$TARGET/HEAD" ]; then
            echo "[+] Detected Git repository at $TARGET"
            mkdir -p "$EXTRACT_DIR"

            if [ -d "$TARGET/lost+found" ]; then
              echo "[*] Extracting from lost+found..."
              find "$TARGET/lost+found" -type f -name "*.git" 2>/dev/null | while read -r obj; do
                echo "  Found object: $obj"
              done
            fi

            if [ -d "$TARGET/objects/pack" ]; then
              echo "[*] Extracting pack files..."
              for pack in "$TARGET/objects/pack/"*.pack; do
                [ -e "$pack" ] || continue
                echo "  Processing: $pack"
              done
            fi

            echo "[+] Extraction complete: $EXTRACT_DIR"
          else
            echo "[-] Not a Git repository or lost+found not found"
          fi
        log-stdout: "{{ inputs.log_output | default(true) }}"

  secrets-scan:
    name: Secret Detection
    outputs:
      gitleaks_count: "{{ steps.export-secrets.outputs.gitleaks_count | default(\"0\", true) }}"
      trufflehog_count: "{{ steps.export-secrets.outputs.trufflehog_count | default(\"0\", true) }}"
      total_count: "{{ steps.export-secrets.outputs.total_count | default(\"0\", true) }}"
    steps:
      - task: gitleaks
        log-command: "{{ inputs.log_command | default(true) }}"
        name: gitleaks-scan
        with:
          target: "{{ inputs.target }}"
          redact: "{{ inputs.baseline }}"
        continue-on-error: true

      - task: trufflehog
        log-command: "{{ inputs.log_command | default(true) }}"
        name: trufflehog-scan
        with:
          target: "{{ inputs.target }}"
          mode: "{{ 'git' if inputs.scan_history else 'filesystem' }}"
        continue-on-error: true

      - name: export-secrets
        script: |
          import json

          gitleaks = {{ steps["gitleaks-scan"].outputs.typed_outputs | default([], true) | tojson }}
          trufflehog = {{ steps["trufflehog-scan"].outputs.typed_outputs | default([], true) | tojson }}

          seen = set()
          unique_gitleaks = []
          for item in gitleaks:
              key = (item.get("match", ""), item.get("value", "")[:50])
              if key not in seen:
                  seen.add(key)
                  unique_gitleaks.append(item)

          seen_th = set()
          unique_th = []
          for item in trufflehog:
              detector = item.get("name", "")
              file_loc = item.get("match", "")
              key = (detector, file_loc)
              if key not in seen_th:
                  seen_th.add(key)
                  unique_th.append(item)

          final_seen = set()
          final = []
          for item in unique_gitleaks + unique_th:
              file = item.get("match", "")
              val = item.get("value", str(item))[:100]
              key = (file, val)
              if key not in final_seen:
                  final_seen.add(key)
                  final.append(item)

          add_outputs(
              gitleaks_count=len(unique_gitleaks),
              trufflehog_count=len(unique_th),
              total_count=len(final)
          )
          print(f"Secret findings:")
          print(f"  Gitleaks: {len(unique_gitleaks)}")
          print(f"  TruffleHog: {len(unique_th)}")
          print(f"  Unique total: {len(final)}")

  baseline-filter:
    name: Apply Baseline Filter
    needs: [secrets-scan]
    run_if: "{{ inputs.baseline }}"
    steps:
      - name: Filter known false positives
        script: |
          import json
          from pathlib import Path

          baseline_path = "{{ inputs.baseline }}"
          all_findings = {{ steps["secrets-scan"].outputs.typed_outputs | default([], true) | tojson }}

          if not Path(baseline_path).exists():
              print(f"Baseline file not found: {baseline_path}")
              filtered = all_findings
          else:
              baseline = json.loads(Path(baseline_path).read_text())
              baseline_set = set()
              for item in baseline:
                  key = (item.get("match", ""), item.get("value", "")[:50])
                  baseline_set.add(key)

              filtered = []
              for item in all_findings:
                  key = (item.get("match", ""), item.get("value", "")[:50])
                  if key not in baseline_set:
                      filtered.append(item)

              print(f"Filtered {len(all_findings) - len(filtered)} baseline matches")

          add_outputs(filtered_count=len(filtered))
          print(f"Post-filter findings: {len(filtered)}")

  report:
    name: Secrets Hunt Report
    needs:
      - secrets-scan
      - baseline-filter
    steps:
      - name: Summary
        run: |
          echo "=== SECRETS HUNT REPORT ==="
          echo "Target: {{ inputs.target }}"
          echo ""
          echo "Raw Findings:"
          echo "  Gitleaks: {{ jobs['secrets-scan'].outputs.gitleaks_count }}"
          echo "  TruffleHog: {{ jobs['secrets-scan'].outputs.trufflehog_count }}"
          echo ""
          echo "Unique Secrets: {{ jobs['secrets-scan'].outputs.total_count }}"
          if "{{ inputs.baseline }}":
            echo "After baseline filter: {{ jobs['baseline-filter'].outputs.filtered_count | default('N/A') }}"
          echo ""
          echo "Next Steps:"
          echo "  1. Review all findings for false positives"
          echo "  2. Rotate any exposed credentials immediately"
          echo "  3. Check Git history for credential removal"
          echo "  4. Implement pre-commit secret scanning"
        log-stdout: "{{ inputs.log_output | default(true) }}"

outputs:
  total_secrets: "{{ jobs['secrets-scan'].outputs.total_count }}"
  filtered_secrets: "{{ jobs['baseline-filter'].outputs.filtered_count | default(jobs['secrets-scan'].outputs.total_count) }}"
