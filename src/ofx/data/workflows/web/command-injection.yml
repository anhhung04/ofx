# yaml-language-server: $schema=~/.ofx/workflow_schema.json
name: command-injection
description: 'Command injection testing — scans target URLs for OS command injection vulnerabilities using multiple techniques.

  '
tags:
- web
- vuln
- injection
- rce
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target URL with parameter (e.g. https://example.com/ping?ip=127.0.0.1)
      alias: t
    level:
      type: string
      default: '2'
      description: Injection test level (1-3)
jobs:
  cmdi-scan:
    name: Command Injection Scan (commix)
    outputs:
      commix_vuln_count: '${{ steps.collect-commix.outputs.commix_vuln_count }}'
      commix_vuln_param: '${{ steps.collect-commix.outputs.commix_vuln_param }}'
    steps:
    - name: commix-scan
      run: |
        commix --url='{{ inputs.target }}' --batch --level={{ inputs.level }} --output-dir=/tmp/commix-results 2>/dev/null | tee /tmp/commix-output.txt
      continue-on-error: true
    - name: collect-commix
      script: |
        import re

        vulns = []
        try:
            with open('/tmp/commix-output.txt') as f:
                content = f.read()
            # Detect vulnerable parameters
            params = re.findall(r'The (?:GET|POST) parameter \'(\S+)\' (?:appears to be|is) injectable', content)
            techniques = re.findall(r'via (\S+) technique', content)
            for param in params:
                vulns.append({
                    'parameter': param,
                    'techniques': techniques,
                })
        except FileNotFoundError:
            pass

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"commix_vuln_count={len(vulns)}\n")
            for v in vulns:
                f.write(f"commix_vuln_param={v['parameter']}\n")

        print(f"Commix: {len(vulns)} injectable parameters found")
        for v in vulns:
            print(f"  [!] Parameter: {v['parameter']}")
  nuclei-rce:
    name: Nuclei RCE/Injection Scan
    outputs:
      nuclei_vuln_count: '${{ steps.collect-nuclei.outputs.nuclei_vuln_count }}'
    steps:
    - task: nuclei
      timeout: 20
      name: nuclei-cmdi
      with:
        target: '{{ inputs.target }}'
        tags: rce,command-injection,cmdi,os-command-injection
      continue-on-error: true
    - name: collect-nuclei
      script: |
        import json

        nuclei_vulns = {{ vulns(steps["nuclei-cmdi"].outputs.typed_outputs) | tojson }}

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"nuclei_vuln_count={len(nuclei_vulns)}\n")

        print(f"Nuclei RCE findings: {len(nuclei_vulns)}")
        for v in nuclei_vulns:
            name = v.get('name', v.get('template_id', 'unknown'))
            severity = v.get('severity', 'unknown')
            print(f"  [{severity.upper()}] {name}")
  summary:
    name: Command Injection Summary
    needs:
    - cmdi-scan
    - nuclei-rce
    steps:
    - name: report
      run: |
        echo "======================================================"
        echo " COMMAND INJECTION TEST COMPLETE"
        echo " Target: {{ inputs.target }}"
        echo " Level: {{ inputs.level }}"
        echo "======================================================"
        echo ""
        echo "--- Commix Results ---"
        echo "Injectable parameters: {{ jobs['cmdi-scan'].outputs.commix_vuln_count }}"
        echo ""
        echo "--- Nuclei RCE Results ---"
        echo "Findings: {{ jobs['nuclei-rce'].outputs.nuclei_vuln_count }}"
      log-stdout: true

    - name: export-to-project
      script: |
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:
            all_typed = []
            for typed in [
            {{ jobs['nuclei-rce'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true