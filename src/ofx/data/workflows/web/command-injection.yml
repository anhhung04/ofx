name: command-injection
description: 'Command injection testing — scans target URLs for OS command injection vulnerabilities using multiple techniques.

  '
tags:
- web
- vuln
- injection
- rce
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target URL with parameter (e.g. https://example.com/ping?ip=127.0.0.1)
      alias: t
    level:
      type: string
      default: '2'
      description: Injection test level (1-3)
jobs:
  cmdi-scan:
    name: Command Injection Scan (commix)
    outputs:
      commix_vuln_count: '{{ steps["collect-commix"].outputs.commix_vuln_count | default("", true) }}'
      commix_vuln_param: '{{ steps["collect-commix"].outputs.commix_vuln_param | default("", true) }}'
    steps:
    - task: commix
      log-command: true
      timeout: 15
      name: commix-scan
      with:
        target: '{{ inputs.target }}'
        level: '{{ inputs.level }}'
      continue-on-error: true
    - name: collect-commix
      script: |
        commix_vulns = {{ vulns(steps["commix-scan"].outputs.typed_outputs) | default([], true) | tojson }}

        vuln_param = ''
        for v in commix_vulns:
            p = v.get('parameter', v.get('name', ''))
            if p and not vuln_param:
                vuln_param = p

        add_outputs(commix_vuln_count=len(commix_vulns), commix_vuln_param=vuln_param)
        print(f"Commix: {len(commix_vulns)} injectable parameters found")
        for v in commix_vulns:
            print(f"  [!] {v.get('name', v.get('parameter', 'unknown'))}")
  nuclei-rce:
    name: Nuclei RCE/Injection Scan
    outputs:
      nuclei_vuln_count: '{{ steps["collect-nuclei"].outputs.nuclei_vuln_count | default("", true) }}'
    steps:
    - task: nuclei
      log-command: true
      timeout: 20
      name: nuclei-cmdi
      with:
        target: '{{ inputs.target }}'
        tags: rce,command-injection,cmdi,os-command-injection
      continue-on-error: true
    - name: collect-nuclei
      script: |
        import json

        nuclei_vulns = {{ vulns(steps["nuclei-cmdi"].outputs.typed_outputs) | tojson }}

        add_outputs(nuclei_vuln_count=len(nuclei_vulns))
        print(f"Nuclei RCE findings: {len(nuclei_vulns)}")
        for v in nuclei_vulns:
            name = v.get('name', v.get('template_id', 'unknown'))
            severity = v.get('severity', 'unknown')
            print(f"  [{severity.upper()}] {name}")
  summary:
    name: Command Injection Summary
    needs:
    - cmdi-scan
    - nuclei-rce
    steps:
    - name: report
      run: |
        echo "======================================================"
        echo " COMMAND INJECTION TEST COMPLETE"
        echo " Target: {{ inputs.target }}"
        echo " Level: {{ inputs.level }}"
        echo "======================================================"
        echo ""
        echo "--- Commix Results ---"
        echo "Injectable parameters: {{ jobs['cmdi-scan'].outputs.commix_vuln_count }}"
        echo ""
        echo "--- Nuclei RCE Results ---"
        echo "Findings: {{ jobs['nuclei-rce'].outputs.nuclei_vuln_count }}"
      log-stdout: true

    - name: export-to-project
      script: |
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:
            all_typed = []
            for typed in [
            {{ jobs['nuclei-rce'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true