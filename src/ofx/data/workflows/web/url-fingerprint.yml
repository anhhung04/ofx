name: url-fingerprint
description: 'Web technology fingerprinting — identifies web technologies, frameworks, WAF, and server configurations.

  '
tags:
- web
- fingerprint
- tech
- waf
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target URL (e.g. https://example.com)
      alias: t
jobs:
  probe:
    name: HTTP Probe
    outputs:
      status: '{{ steps["export-probe"].outputs.status | default("", true) }}'
      title: '{{ steps["export-probe"].outputs.title | default("", true) }}'
      webserver: '{{ steps["export-probe"].outputs.webserver | default("", true) }}'
    steps:
    - task: httpx
      timeout: 10
      name: http-probe
      with:
        target: '{{ inputs.target }}'
        tech_detect: true
        status_code: true
        title: true
        follow_redirects: true
      continue-on-error: true
    - name: export-probe
      run: |
        echo 'status={{ urls(steps["http-probe"].outputs.typed_outputs) | map(attribute='status_code') | first | default('unknown', true) }}' >> $OFX_OUTPUTS
        echo 'title={{ urls(steps["http-probe"].outputs.typed_outputs) | map(attribute='title') | first | default('unknown', true) }}' >> $OFX_OUTPUTS
        echo 'webserver={{ urls(steps["http-probe"].outputs.typed_outputs) | map(attribute='webserver') | first | default('unknown', true) }}' >> $OFX_OUTPUTS
  fingerprint:
    name: Technology Fingerprinting
    outputs:
      tech_list_file: '{{ steps["collect-tech"].outputs.tech_list_file | default("", true) }}'
      tech_count: '{{ steps["collect-tech"].outputs.tech_count | default("", true) }}'
    steps:
    - task: whatweb
      timeout: 10
      name: whatweb-scan
      with:
        target: '{{ inputs.target }}'
        aggression: 3
      continue-on-error: true
    - name: collect-tech
      script: |
        whatweb_out = {{ tags(steps["whatweb-scan"].outputs.typed_outputs) | default([], true) | tojson }}

        techs = set()
        for item in whatweb_out:
            name = item.get('name', '')
            if name:
                techs.add(name)

        with open('/tmp/ofx_urlfingerprint_techs.txt', 'w') as tf:
            tf.write('\n'.join(sorted(techs)))

        add_outputs(tech_list_file="/tmp/ofx_urlfingerprint_techs.txt", tech_count=len(techs))
        print(f"Detected {len(techs)} technologies")
  waf-detect:
    name: WAF Detection
    outputs:
      waf_detected_file: '{{ steps["export-waf"].outputs.waf_detected_file | default("", true) }}'
      waf_count: '{{ steps["export-waf"].outputs.waf_count | default("", true) }}'
    steps:
    - task: wafw00f
      timeout: 10
      name: wafw00f-scan
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: export-waf
      script: |
        import json

        waf_results = {{ steps["wafw00f-scan"].outputs.typed_outputs | tojson }}
        waf_names = []
        for item in waf_results:
            if item.get('waf') or item.get('name'):
                waf_names.append(item.get('waf') or item.get('name', 'unknown'))

        with open('/tmp/ofx_urlfingerprint_waf.txt', 'w') as tf:
            tf.write('\n'.join(waf_names) if waf_names else 'none')

        add_outputs(waf_detected_file="/tmp/ofx_urlfingerprint_waf.txt", waf_count=len(waf_names))
        print(f"WAF detected: {', '.join(waf_names) if waf_names else 'None'}")
  summary:
    name: Fingerprint Summary
    needs:
    - probe
    - fingerprint
    - waf-detect
    steps:
    - name: report
      run: |
        echo "======================================="
        echo " Fingerprint: {{ inputs.target }}"
        echo "======================================="
        echo "HTTP Status: {{ jobs.probe.outputs.status }}"
        echo "Page Title: {{ jobs.probe.outputs.title }}"
        echo "Web Server: {{ jobs.probe.outputs.webserver }}"
        echo "Technologies: {{ jobs.fingerprint.outputs.tech_count }}"
        echo "WAF: {{ jobs['waf-detect'].outputs.waf_detected_file }}"
      log-stdout: true

    - name: export-to-project
      script: |
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:
            all_typed = []
            for typed in [
            {{ jobs['probe'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['waf-detect'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true