name: subdomain-takeover
description: |
  Subdomain takeover detection — identify dangling DNS records pointing
  to unclaimed cloud services (S3, Azure, Heroku, GitHub Pages, etc.)
  that can be taken over by an attacker.
tags: [web, subdomain, takeover, dns, security]
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Domain to check or @file with subdomains
      alias: t

jobs:
  enumerate:
    name: Subdomain Discovery
    steps:
    - task: subfinder
      log-command: "{{ inputs.log_command | default(true) }}"
      name: subdomain-find
      with:
        target: '{{ inputs.target }}'
        all: true
      continue-on-error: true

  check-takeover:
    name: Takeover Detection
    needs: [enumerate]
    outputs:
      finding_count: '{{ steps["detect-takeover"].outputs.finding_count | default("", true) }}'
      subdomains_checked: '{{ steps["detect-takeover"].outputs.subdomains_checked | default("", true) }}'
    steps:
    - name: detect-takeover
      script: |
        import subprocess
        import re
        from pathlib import Path

        raw = '''{{ inputs.target }}'''
        subdomains = set()

        # From input
        if Path(raw).is_file():
            subdomains.update(s.strip() for s in Path(raw).read_text().splitlines() if s.strip())
        elif '.' in raw and '/' not in raw:
            subdomains.add(raw)

        # From subfinder results
        typed = {{ subdomains(jobs['enumerate'].outputs.typed_outputs) | tojson }}
        for item in typed:
            host = item.get('host', item.get('subdomain', ''))
            if host:
                subdomains.add(host)

        print(f"=== SUBDOMAIN TAKEOVER: {len(subdomains)} targets ===\n")

        # Known fingerprints
        fingerprints = {
            'github': {
                'cname': ['github.io'],
                'body': ["There isn't a GitHub Pages site here"],
            },
            'heroku': {
                'cname': ['herokuapp.com', 'herokussl.com'],
                'body': ['No such app', 'no-such-app'],
            },
            's3': {
                'cname': ['s3.amazonaws.com', 's3-website'],
                'body': ['NoSuchBucket', 'The specified bucket does not exist'],
            },
            'azure': {
                'cname': ['azurewebsites.net', 'cloudapp.azure.com', 'blob.core.windows.net'],
                'body': ['404 Web Site not found'],
            },
            'shopify': {
                'cname': ['myshopify.com'],
                'body': ['Sorry, this shop is currently unavailable'],
            },
            'fastly': {
                'cname': ['fastly.net'],
                'body': ['Fastly error: unknown domain'],
            },
            'pantheon': {
                'cname': ['pantheonsite.io'],
                'body': ['404 error unknown site'],
            },
            'surge': {
                'cname': ['surge.sh'],
                'body': ['project not found'],
            },
        }

        findings = []
        for sub in sorted(subdomains):
            # Get CNAME
            try:
                proc = subprocess.run(['dig', '+short', 'CNAME', sub], capture_output=True, text=True, timeout=5)
                cname = proc.stdout.strip().rstrip('.')
            except Exception:
                cname = ''

            if not cname:
                continue

            # Check against fingerprints
            for service, fp in fingerprints.items():
                if any(c in cname.lower() for c in fp['cname']):
                    # Verify with HTTP
                    vulnerable = False
                    try:
                        import urllib.request
                        req = urllib.request.Request(f'http://{sub}', method='GET')
                        resp = urllib.request.urlopen(req, timeout=5)
                        body = resp.read().decode('utf-8', errors='replace')
                        for pattern in fp['body']:
                            if pattern.lower() in body.lower():
                                vulnerable = True
                                break
                    except Exception as e:
                        err_str = str(e)
                        for pattern in fp['body']:
                            if pattern.lower() in err_str.lower():
                                vulnerable = True
                                break

                    if vulnerable:
                        finding = f'[CRITICAL] {sub} → {cname} ({service}) — TAKEOVER POSSIBLE'
                        findings.append(finding)
                        print(f"  {finding}")
                    else:
                        print(f"  [INFO] {sub} → {cname} ({service}) — active")

        add_outputs(finding_count=len(findings), subdomains_checked=len(subdomains))
        print(f"\n=== RESULTS: {len(findings)} vulnerable subdomains ===")
        if not findings:
            print("  No takeover opportunities found")
      log-stdout: "{{ inputs.log_output | default(true) }}"
      log-command: "{{ inputs.log_command | default(true) }}"

    - name: export-to-project
      script: |
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:
            all_typed = []
            for typed in [
            {{ jobs['enumerate'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true