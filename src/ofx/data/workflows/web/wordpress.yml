name: wordpress
description:
  "WordPress vulnerability scan — identifies WordPress version, plugins, themes, known vulnerabilities, and misconfigurations using wpscan and nuclei.

  "
tags:
  - http
  - wordpress
  - vuln
outputs:
  probe_typed_outputs: '{{ jobs["probe"].outputs.typed_outputs }}'
  scan_typed_outputs: '{{ jobs["wordpress-scan"].outputs.typed_outputs }}'
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target WordPress URL (e.g. https://example.com)
      alias: t
    api_token:
      type: string
      default: ""
      description: WPScan API token for vulnerability database (optional)
jobs:
  probe:
    name: URL Probe
    outputs:
      typed_outputs: '{{ steps["http-probe"].outputs.typed_outputs }}'
    steps:
      - task: httpx
        timeout: 10
        name: http-probe
        with:
          target: "{{ inputs.target }}"
          tech_detect: true
          status_code: true
          follow_redirects: true
        continue-on-error: true
  wordpress-scan:
    name: WordPress Security Scan
    needs:
      - probe
    outputs:
      typed_outputs: '{{ steps["wpscan-full"].outputs.typed_outputs + steps["nuclei-wordpress"].outputs.typed_outputs }}'
    steps:
      - task: wpscan
        timeout: 15
        name: wpscan-full
        with:
          target: "{{ inputs.target }}"
          enumerate: vp,vt,u1-20
          api_token: "{{ inputs.api_token }}"
        continue-on-error: true
      - task: nuclei
        timeout: 20
        name: nuclei-wordpress
        with:
          target: "{{ inputs.target }}"
          tags: wordpress
        continue-on-error: true
      - name: summary
        script: |
          import json

          wpscan_vulns = {{ vulns(steps["wpscan-full"].outputs.typed_outputs) | tojson }}
          nuclei_vulns = {{ vulns(steps["nuclei-wordpress"].outputs.typed_outputs) | tojson }}

          all_vulns = wpscan_vulns + nuclei_vulns
          critical = [v for v in all_vulns if v.get('severity') == 'critical']
          high = [v for v in all_vulns if v.get('severity') == 'high']

          print("=" * 45)
          print(f" WordPress Scan: {{ inputs.target }}")
          print("=" * 45)
          print(f"Total vulnerabilities: {len(all_vulns)}")
          print(f"  Critical: {len(critical)}")
          print(f"  High: {len(high)}")
          for v in critical + high:
              print(f"  - [{v.get('severity', 'unknown').upper()}] {v.get('name', 'Unknown')}")
        log-stdout: true

      - name: export-to-project
        script: |
          from pathlib import Path

          project = '{{ vars.project_path | default("", true) }}'
          if not project:
              print('No --project set, skipping file export')
          else:
              all_typed = []
              for typed in [
              {{ jobs['probe'].outputs.typed_outputs | default([], true) | tojson }},
              {{ jobs['wordpress-scan'].outputs.typed_outputs | default([], true) | tojson }},
              ]:
                  all_typed.extend(typed)
              summaries = export_typed_outputs(project, all_typed)
              for s in summaries:
                  print(s)

              print(f'Project export complete: {project}')
        continue-on-error: true
