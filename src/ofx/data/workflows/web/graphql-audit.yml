name: graphql-audit
description: |
  GraphQL API security audit — introspection query, schema extraction,
  field enumeration, and common vulnerability checks (IDOR, injection,
  DoS via nested queries).
tags: [web, graphql, api, security]
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: GraphQL endpoint URL (e.g. https://api.target.com/graphql)
      alias: t

jobs:
  introspection:
    name: Introspection & Schema Analysis
    outputs:
      introspection: '{{ steps["introspection-query"].outputs.introspection | default("", true) }}'
      type_count: '{{ steps["introspection-query"].outputs.type_count | default("", true) }}'
      schema_file: '{{ steps["introspection-query"].outputs.schema_file | default("", true) }}'
      finding_count: '{{ steps["introspection-query"].outputs.finding_count | default("", true) }}'
    steps:
    - name: introspection-query
      script: |
        import json
        import urllib.request
        import urllib.error
        from pathlib import Path

        url = '{{ inputs.target }}'
        print(f"[+] Testing introspection on {url}\n")

        query = '{"query":"{ __schema { queryType { name } mutationType { name } types { name kind fields { name type { name kind ofType { name } } } } } }"}'

        findings = []
        try:
            req = urllib.request.Request(
                url,
                data=query.encode(),
                headers={'Content-Type': 'application/json'},
            )
            resp = urllib.request.urlopen(req, timeout=15)
            data = json.loads(resp.read())

            if 'data' in data and data['data'].get('__schema'):
                findings.append('[CRITICAL] Introspection is ENABLED')
                schema = data['data']['__schema']
                types = schema.get('types', [])
                user_types = [t for t in types if not t['name'].startswith('__')]

                print(f"  [!] Introspection enabled — full schema exposed")
                print(f"  Types: {len(user_types)}")
                print(f"  Query type: {schema.get('queryType', {}).get('name')}")
                print(f"  Mutation type: {schema.get('mutationType', {}).get('name')}")

                print(f"\n--- Types ---")
                for t in user_types[:30]:
                    fields = t.get('fields') or []
                    field_names = [f['name'] for f in fields[:5]]
                    print(f"  {t['name']} ({t['kind']}): {', '.join(field_names)}")

                # Check for sensitive types
                sensitive_keywords = ['user', 'admin', 'auth', 'token', 'password', 'secret', 'key', 'credential']
                sensitive = [t for t in user_types if any(kw in t['name'].lower() for kw in sensitive_keywords)]
                if sensitive:
                    findings.append(f'[HIGH] Sensitive types exposed: {", ".join(t["name"] for t in sensitive)}')
                    print(f"\n  [!] Sensitive types: {', '.join(t['name'] for t in sensitive)}")

                # Check mutations
                mutations = [t for t in types if t['name'] == schema.get('mutationType', {}).get('name')]
                if mutations and mutations[0].get('fields'):
                    mut_names = [f['name'] for f in mutations[0]['fields']]
                    findings.append(f'[MEDIUM] {len(mut_names)} mutations available')
                    print(f"\n--- Mutations ({len(mut_names)}) ---")
                    for m in mut_names[:20]:
                        print(f"  {m}")

                schema_file = f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_graphql_schema.json'
                Path(schema_file).write_text(json.dumps(data, indent=2))

                add_outputs(introspection="enabled", type_count=len(user_types), schema_file=schema_file)
            else:
                print("  [✓] Introspection is disabled")
                add_outputs(introspection="disabled")
        except urllib.error.HTTPError as e:
            if e.code == 400:
                findings.append('[INFO] Introspection blocked (400)')
            print(f"  HTTP {e.code}: {e.reason}")
        except Exception as e:
            print(f"  Error: {e}")

        # Test common bypasses
        print(f"\n--- Bypass Attempts ---")
        bypass_queries = [
            ('GET param', f'{url}?query={{__schema{{types{{name}}}}}}'),
            ('Alias', '{"query":"{ a: __typename }"}'),
        ]
        for name, q in bypass_queries:
            try:
                if q.startswith('http'):
                    req = urllib.request.Request(q)
                else:
                    req = urllib.request.Request(url, data=q.encode(), headers={'Content-Type': 'application/json'})
                resp = urllib.request.urlopen(req, timeout=10)
                data = json.loads(resp.read())
                if 'data' in data:
                    print(f"  [{name}] Responded with data")
                else:
                    print(f"  [{name}] Blocked")
            except Exception:
                print(f"  [{name}] Blocked/Error")

        add_outputs(finding_count=len(findings))
        print(f"\n--- Findings ({len(findings)}) ---")
        for finding in findings:
            print(f"  {finding}")
      log-stdout: "{{ inputs.log_output | default(true) }}"
      log-command: "{{ inputs.log_command | default(true) }}"
