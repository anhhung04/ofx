name: nosql-injection
description: >
  NoSQL injection testing — scans for NoSQL injection vulnerabilities in MongoDB,
  CouchDB, Redis, and other NoSQL databases behind web applications. Uses nuclei
  nosql injection templates and specialized testing to detect authentication
  bypass and data extraction vectors.
tags:
  - web
  - nosql
  - injection
  - mongodb
  - couchdb
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target URL or file with URLs
      alias: t
    log_command:
      type: string
      default: "true"
      description: Enable command logging
    log_output:
      type: string
      default: "true"
      description: Enable output logging
defaults:
  store-creds: false
outputs:
  findings_file: '{{ jobs["collect"].outputs.findings_file | default("", true) }}'
  finding_count: '{{ jobs["collect"].outputs.finding_count | default("0", true) }}'
  typed_outputs: '{{ jobs["collect"].outputs.typed_outputs | default([], true) }}'
jobs:
  discover:
    name: NoSQL Injection Testing
    steps:
      - task: nuclei
        log-command: "{{ inputs.log_command | default(true) }}"
        name: nuclei-nosql
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
          tags: "nosql,nosqli,mongodb-injection,couchdb-injection"
          severity: "critical,high,medium"
          rate_limit: 50
          json: true
          silent: true
        continue-on-error: true
      - task: nuclei
        log-command: "{{ inputs.log_command | default(true) }}"
        name: nuclei-auth-bypass
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
          tags: "auth-bypass,nosql-auth,injection-bypass"
          severity: "critical,high,medium"
          rate_limit: 50
          json: true
          silent: true
        continue-on-error: true
      - task: nuclei
        log-command: "{{ inputs.log_command | default(true) }}"
        name: nuclei-operator-injection
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
          tags: "operator-injection,regex-injection,$where"
          severity: "critical,high,medium"
          rate_limit: 50
          json: true
          silent: true
        continue-on-error: true
  collect:
    name: Collect Findings
    needs:
      - discover
    outputs:
      findings_file: '{{ steps["merge"].outputs.findings_file | default("", true) }}'
      finding_count: '{{ steps["merge"].outputs.finding_count | default("0", true) }}'
      typed_outputs: '{{ steps["merge"].outputs.typed_outputs | default([], true) }}'
    steps:
      - name: merge
        script: |
          import json
          from pathlib import Path

          all_findings = (
            {{ vulns(steps["nuclei-nosql"].outputs.typed_outputs) | default([], true) | tojson }} +
            {{ vulns(steps["nuclei-auth-bypass"].outputs.typed_outputs) | default([], true) | tojson }} +
            {{ vulns(steps["nuclei-operator-injection"].outputs.typed_outputs) | default([], true) | tojson }}
          )

           add_outputs(
             findings_json=json.dumps(all_findings, indent=2, default=str),
             finding_count=len(all_findings),
             typed_outputs=all_findings
           )
          print(f'NoSQL injection: {len(all_findings)} findings')
  summary:
    name: Summary
    needs:
      - collect
    steps:
      - name: report
        run: |
          echo "=========================================="
          echo " NOSQL INJECTION TESTING RESULTS"
          echo "=========================================="
          echo ""
          echo "Target: {{ inputs.target }}"
          echo "Findings: {{ jobs.collect.outputs.finding_count | default('0', true) }}"
          echo ""
          {% set findings = jobs.collect.outputs.typed_outputs | default([], true) %}
          {% for f in findings[:15] %}
          echo "  [{{ f.severity | default('info') }}] {{ f.name | default('') }}"
          echo "    {{ f.host | default('') }}"
          {% endfor %}
          echo "=========================================="
        log-stdout: "{{ inputs.log_output | default(true) }}"
