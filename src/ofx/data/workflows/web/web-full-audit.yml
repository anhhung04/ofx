name: web-full-audit
description: >
  Comprehensive web application audit — port discovery, fingerprinting, directory brute-forcing,
  parameter fuzzing, vulnerability scanning (XSS, SQLi, SSTI, SSRF, CRLF, command injection),
  SSL/TLS analysis, JS secret extraction, and secret hunting.
tags:
  - web
  - audit
  - vuln
  - fuzz
  - xss
  - sqli
  - ssrf
  - ssti
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target URL or hostname (e.g. https://target.com)
      alias: t
    wordlist:
      type: string
      default: /usr/share/wordlists/seclists/Discovery/Web-Content/raft-medium-directories.txt
      description: Wordlist for directory brute-forcing
jobs:
  fingerprint:
    name: Fingerprinting
    outputs:
      live_urls: '{{ steps["export-info"].outputs.live_urls | default("", true) }}'
      waf_status: '{{ steps["export-info"].outputs.waf_status | default("unknown", true) }}'
      baseline_404_size: '{{ steps["baseline-404"].outputs.baseline_404_size | default("", true) }}'
      baseline_404_status: '{{ steps["baseline-404"].outputs.baseline_404_status | default("", true) }}'
      baseline_404_title: '{{ steps["baseline-404"].outputs.baseline_404_title | default("", true) }}'
      allowed_methods: '{{ steps["http-methods"].outputs.allowed_methods | default("", true) }}'
    steps:
      - task: rustscan
        log-command: true
        name: port-discovery
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
          range: 1-10000
          batch_size: 4500
        continue-on-error: true
      - task: httpx
        log-command: true
        name: http-probe
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
          tech_detect: true
          status_code: true
          title: true
          follow_redirects: true
        continue-on-error: true
      - task: wafw00f
        log-command: true
        name: waf-detect
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      - task: whatweb
        log-command: true
        name: whatweb-scan
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
          aggression: 3
        continue-on-error: true
      - name: baseline-404
        script: |
          import urllib.request, urllib.error, ssl, re
          target = '{{ inputs.target }}'.rstrip('/')
          probe = target + '/ofx_nonexistent_8f3k2x1z.html'
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          try:
              req = urllib.request.Request(probe, headers={'User-Agent': 'Mozilla/5.0'})
              resp = urllib.request.urlopen(req, timeout=10, context=ctx)
              body = resp.read().decode('utf-8', errors='ignore')
              status = resp.getcode()
          except urllib.error.HTTPError as e:
              body = e.read().decode('utf-8', errors='ignore')
              status = e.code
          except Exception:
              body, status = '', 0
          size = len(body)
          title_m = re.search(r'<title[^>]*>(.*?)</title>', body, re.I | re.S)
          title = title_m.group(1).strip()[:80] if title_m else ''
          add_outputs(baseline_404_size=size, baseline_404_status=status, baseline_404_title=title)
          print(f"404 baseline: status={status} size={size} title='{title}'")
        continue-on-error: true
      - name: http-methods
        run: |
          TARGET="{{ inputs.target }}"
          ALLOWED=""
          for METHOD in PUT DELETE PATCH OPTIONS TRACE; do
            CODE=$(curl -sk -o /dev/null -w '%{http_code}' -X "$METHOD" "$TARGET" 2>/dev/null)
            if [ "$CODE" != "405" ] && [ "$CODE" != "501" ] && [ "$CODE" != "000" ]; then
              ALLOWED="${ALLOWED}${METHOD}(${CODE}) "
            fi
          done
          echo "allowed_methods=${ALLOWED:-none}" >> "$OFX_OUTPUTS"
          echo "Allowed methods: ${ALLOWED:-none}"
        continue-on-error: true
      - name: export-info
        script: |
          typed = {{ steps["http-probe"].outputs.typed_outputs | default([], true) | tojson }}
          live = []
          for item in typed:
              if item.get("_type") == "url" and item.get("status_code", 0) > 0:
                  live.append(item["url"])

          waf_typed = {{ steps["waf-detect"].outputs.typed_outputs | default([], true) | tojson }}
          waf_names = [t.get('name', '') for t in waf_typed if t.get('_type') == 'tag' and t.get('name')]
          waf_status = ', '.join(waf_names) if waf_names else 'None detected'

          add_outputs(live_urls='\n'.join(sorted(set(live))), waf_status=waf_status)

  ssl-audit:
    name: SSL/TLS Audit
    needs:
      - fingerprint
    outputs:
      ssl_vulns: '{{ steps["collect-ssl"].outputs.ssl_vulns | default("0", true) }}'
      ssl_certs: '{{ steps["collect-ssl"].outputs.ssl_certs | default("0", true) }}'
    steps:
      - task: testssl
        name: testssl-scan
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
          vulnerabilities: true
          protocols: true
        continue-on-error: true
      - name: collect-ssl
        script: |
          all_items = {{ steps["testssl-scan"].outputs.typed_outputs | default([], true) | tojson }}
          vulns = [i for i in all_items if i.get('_type') == 'vulnerability']
          certs = [i for i in all_items if i.get('_type') == 'certificate']
          add_outputs(ssl_vulns=len(vulns), ssl_certs=len(certs))
          print(f"SSL: {len(vulns)} vulnerabilities, {len(certs)} certificate findings")

  dir-brute:
    name: Directory Brute-Force
    needs:
      - fingerprint
    outputs:
      dir_urls_file: '{{ steps["collect-dirs"].outputs.dir_urls_file | default("", true) }}'
      dir_count: '{{ steps["collect-dirs"].outputs.dir_count | default("", true) }}'
    steps:
      - task: feroxbuster
        log-command: true
        name: feroxbuster-deep
        retry: 2
        retry-delay: 5
        with:
          target: "{{ jobs.fingerprint.outputs.live_urls | default(inputs.target, true) }}"
          wordlist: "{{ inputs.wordlist }}"
          threads: 50
          depth: 3
          smart: true
          extract_links: true
          insecure: true
          auto_tune: true
          status_codes: 200,201,204,301,302,307,308,401,403,405,500
        continue-on-error: true
      - name: collect-dirs
        script: |
          urls = set()
          for item in {{ urls(steps["feroxbuster-deep"].outputs.typed_outputs) | default([], true) | tojson }}:
              url = item.get('url', '')
              if url:
                  urls.add(url)

          with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_webaudit_dirs.txt', 'w') as tf:
              tf.write('\n'.join(sorted(urls)))

          add_outputs(dir_urls_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_webaudit_dirs.txt", dir_count=len(urls))
          print(f"Discovered {len(urls)} unique URLs/directories")

  crawl:
    name: Content Discovery
    needs:
      - fingerprint
    outputs:
      crawled_file: '{{ steps["collect-crawled"].outputs.crawled_file | default("", true) }}'
      crawl_count: '{{ steps["collect-crawled"].outputs.crawl_count | default("", true) }}'
      js_findings: '{{ steps["collect-crawled"].outputs.js_findings | default("0", true) }}'
    steps:
      - task: katana
        log-command: true
        name: katana-crawl
        retry: 2
        retry-delay: 5
        with:
          target: "{{ jobs.fingerprint.outputs.live_urls | default(inputs.target, true) }}"
          depth: 3
          js_crawl: true
          known_files: all
        continue-on-error: true
      - task: gau
        log-command: true
        name: gau-archive
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
          subs: true
        continue-on-error: true
      - task: waymore
        name: waymore-archive
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      - task: jsluice
        name: jsluice-analysis
        retry: 2
        retry-delay: 5
        with:
          target: "{{ jobs.fingerprint.outputs.live_urls | default(inputs.target, true) }}"
        continue-on-error: true
      - name: collect-crawled
        script: |
          urls = set()
          for source in [
              {{ urls(steps["katana-crawl"].outputs.typed_outputs) | default([], true) | tojson }},
              {{ urls(steps["gau-archive"].outputs.typed_outputs) | default([], true) | tojson }},
              {{ urls(steps["waymore-archive"].outputs.typed_outputs) | default([], true) | tojson }},
          ]:
              for item in source:
                  url = item.get('url', '')
                  if url:
                      urls.add(url)

          js_typed = {{ steps["jsluice-analysis"].outputs.typed_outputs | default([], true) | tojson }}
          js_count = len(js_typed)
          for item in js_typed:
              url = item.get('url', '')
              if url:
                  urls.add(url)

          with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_webaudit_crawled.txt', 'w') as tf:
              tf.write('\n'.join(sorted(urls)))

          add_outputs(
              crawled_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_webaudit_crawled.txt",
              crawl_count=len(urls),
              js_findings=js_count,
          )
          print(f"Crawled {len(urls)} unique URLs, {js_count} JS findings")

  param-fuzz:
    name: Parameter Discovery & Fuzzing
    needs:
      - crawl
      - dir-brute
    outputs:
      param_file: '{{ steps["collect-params"].outputs.param_file | default("", true) }}'
      param_count: '{{ steps["collect-params"].outputs.param_count | default("", true) }}'
    steps:
      - task: arjun
        log-command: true
        name: arjun-params
        retry: 2
        retry-delay: 5
        with:
          target: "{{ jobs.fingerprint.outputs.live_urls | default(inputs.target, true) }}"
          threads: 20
        continue-on-error: true
      - task: paramspider
        log-command: true
        name: paramspider-discover
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      - name: collect-params
        script: |
          param_urls = set()
          for step_name in ["arjun-params", "paramspider-discover"]:
              step_data = {{ steps | tojson }}
              typed = step_data.get(step_name, {}).get('outputs', {}).get('typed_outputs', [])
              for item in typed:
                  url = item.get('url', '')
                  if url and ('=' in url or '?' in url):
                      param_urls.add(url)

          with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_param_urls.txt', 'w') as f:
              f.write('\n'.join(sorted(param_urls)))

          add_outputs(param_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_param_urls.txt", param_count=len(param_urls))
          print(f"Discovered {len(param_urls)} parameterized URLs")

  vuln-scan:
    name: Vulnerability Scanning
    needs:
      - param-fuzz
    outputs:
      total_vulns: '{{ steps["collect-vulns"].outputs.total_vulns | default("0", true) }}'
      critical_count: '{{ steps["collect-vulns"].outputs.critical_count | default("0", true) }}'
      high_count: '{{ steps["collect-vulns"].outputs.high_count | default("0", true) }}'
      xss_count: '{{ steps["collect-vulns"].outputs.xss_count | default("0", true) }}'
      sqli_count: '{{ steps["collect-vulns"].outputs.sqli_count | default("0", true) }}'
      cmdi_count: '{{ steps["collect-vulns"].outputs.cmdi_count | default("0", true) }}'
      crlf_count: '{{ steps["collect-vulns"].outputs.crlf_count | default("0", true) }}'
      ssrf_count: '{{ steps["collect-vulns"].outputs.ssrf_count | default("0", true) }}'
      ssti_count: '{{ steps["collect-vulns"].outputs.ssti_count | default("0", true) }}'
    steps:
      - task: nuclei
        log-command: true
        name: nuclei-scan
        retry: 2
        retry-delay: 5
        with:
          target: "{{ jobs.fingerprint.outputs.live_urls | default(inputs.target, true) }}"
          severity: critical,high,medium
        continue-on-error: true
      - task: dalfox
        log-command: true
        name: xss-scan
        retry: 2
        retry-delay: 5
        run_if: "{{ jobs['param-fuzz'].outputs.param_count | default(0, true) | int > 0 }}"
        with:
          target: "{{ jobs['param-fuzz'].outputs.param_file }}"
        continue-on-error: true
      - task: sqlmap
        log-command: true
        name: sqli-scan
        retry: 2
        retry-delay: 5
        run_if: "{{ jobs['param-fuzz'].outputs.param_count | default(0, true) | int > 0 }}"
        with:
          target: "{{ jobs['param-fuzz'].outputs.param_file }}"
          batch: true
          level: 3
          risk: 2
          threads: 5
        continue-on-error: true
      - task: commix
        log-command: true
        name: cmdi-scan
        retry: 2
        retry-delay: 5
        run_if: "{{ jobs['param-fuzz'].outputs.param_count | default(0, true) | int > 0 }}"
        with:
          target: "{{ jobs['param-fuzz'].outputs.param_file }}"
          batch: true
          level: 2
        continue-on-error: true
      - task: crlfuzz
        name: crlf-scan
        retry: 2
        retry-delay: 5
        with:
          target: "{{ jobs.fingerprint.outputs.live_urls | default(inputs.target, true) }}"
        continue-on-error: true
      - task: ssrfmap
        name: ssrf-scan
        retry: 2
        retry-delay: 5
        run_if: "{{ jobs['param-fuzz'].outputs.param_count | default(0, true) | int > 0 }}"
        with:
          target: "{{ jobs['param-fuzz'].outputs.param_file }}"
        continue-on-error: true
      - task: tinja
        name: ssti-scan
        retry: 2
        retry-delay: 5
        run_if: "{{ jobs['param-fuzz'].outputs.param_count | default(0, true) | int > 0 }}"
        with:
          target: "{{ jobs['param-fuzz'].outputs.param_file }}"
        continue-on-error: true
      - name: collect-vulns
        script: |
          nuclei_v = {{ vulns(steps["nuclei-scan"].outputs.typed_outputs) | tojson }}
          xss_v = {{ vulns(steps["xss-scan"].outputs.typed_outputs) | tojson }}
          sqli_v = {{ vulns(steps["sqli-scan"].outputs.typed_outputs) | tojson }}
          cmdi_v = {{ vulns(steps["cmdi-scan"].outputs.typed_outputs) | tojson }}
          crlf_v = {{ vulns(steps["crlf-scan"].outputs.typed_outputs) | tojson }}
          ssrf_v = {{ vulns(steps["ssrf-scan"].outputs.typed_outputs) | tojson }}
          ssti_v = {{ vulns(steps["ssti-scan"].outputs.typed_outputs) | tojson }}

          all_v = nuclei_v + xss_v + sqli_v + cmdi_v + crlf_v + ssrf_v + ssti_v
          total = len(all_v)
          critical = sum(1 for v in all_v if v.get('severity') == 'critical')
          high = sum(1 for v in all_v if v.get('severity') == 'high')

          add_outputs(
              total_vulns=total, critical_count=critical, high_count=high,
              xss_count=len(xss_v), sqli_count=len(sqli_v), cmdi_count=len(cmdi_v),
              crlf_count=len(crlf_v), ssrf_count=len(ssrf_v), ssti_count=len(ssti_v),
          )
          print(f"Total: {total} vulns (C:{critical} H:{high})")
          print(f"  XSS:{len(xss_v)} SQLi:{len(sqli_v)} CMDi:{len(cmdi_v)} CRLF:{len(crlf_v)} SSRF:{len(ssrf_v)} SSTI:{len(ssti_v)}")

  secrets:
    name: Secret Hunting
    needs:
      - crawl
    outputs:
      typed_outputs: '{{ steps["collect-secrets"].outputs.typed_outputs | default([], true) }}'
      secret_count: '{{ steps["collect-secrets"].outputs.secret_count | default("0", true) }}'
    steps:
      - task: nuclei
        log-command: true
        name: nuclei-secrets
        retry: 2
        retry-delay: 5
        with:
          target: "{{ jobs['crawl'].outputs.crawled_file | default(inputs.target, true) }}"
          tags: exposure,token,secret
        continue-on-error: true
      - task: trufflehog
        name: trufflehog-scan
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      - task: gitleaks
        name: gitleaks-scan
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      - name: collect-secrets
        script: |
          nuclei_s = {{ steps["nuclei-secrets"].outputs.typed_outputs | default([], true) | tojson }}
          trufflehog_s = {{ steps["trufflehog-scan"].outputs.typed_outputs | default([], true) | tojson }}
          gitleaks_s = {{ steps["gitleaks-scan"].outputs.typed_outputs | default([], true) | tojson }}
          all_secrets = nuclei_s + trufflehog_s + gitleaks_s
          add_outputs(typed_outputs=all_secrets, secret_count=len(all_secrets))
          print(f"Secrets: {len(nuclei_s)} nuclei, {len(trufflehog_s)} trufflehog, {len(gitleaks_s)} gitleaks = {len(all_secrets)} total")

  summary:
    name: Web Audit Summary
    needs:
      - vuln-scan
      - secrets
      - ssl-audit
    steps:
      - name: report
        run: |
          echo "======================================================"
          echo " WEB FULL AUDIT COMPLETE: {{ inputs.target }}"
          echo "======================================================"
          echo ""
          echo "--- Fingerprint ---"
          echo "WAF: {{ jobs.fingerprint.outputs.waf_status | default('unknown', true) }}"
          echo "404 Baseline: size={{ jobs.fingerprint.outputs.baseline_404_size | default('N/A', true) }} status={{ jobs.fingerprint.outputs.baseline_404_status | default('N/A', true) }} title='{{ jobs.fingerprint.outputs.baseline_404_title | default('', true) }}'"
          echo "HTTP Methods: {{ jobs.fingerprint.outputs.allowed_methods | default('N/A', true) }}"
          echo ""
          echo "--- Discovery ---"
          echo "Directories found: {{ jobs['dir-brute'].outputs.dir_count | default('0', true) }}"
          echo "URLs crawled: {{ jobs.crawl.outputs.crawl_count | default('0', true) }}"
          echo "JS findings: {{ jobs.crawl.outputs.js_findings | default('0', true) }}"
          echo "Parameterized URLs: {{ jobs['param-fuzz'].outputs.param_count | default('0', true) }}"
          echo ""
          echo "--- SSL/TLS ---"
          echo "SSL vulnerabilities: {{ jobs['ssl-audit'].outputs.ssl_vulns | default('0', true) }}"
          echo "Certificate issues: {{ jobs['ssl-audit'].outputs.ssl_certs | default('0', true) }}"
          echo ""
          echo "--- Vulnerabilities ---"
          echo "Total findings: {{ jobs['vuln-scan'].outputs.total_vulns | default('0', true) }}"
          echo "  Critical: {{ jobs['vuln-scan'].outputs.critical_count | default('0', true) }}"
          echo "  High: {{ jobs['vuln-scan'].outputs.high_count | default('0', true) }}"
          echo "  XSS: {{ jobs['vuln-scan'].outputs.xss_count | default('0', true) }}"
          echo "  SQLi: {{ jobs['vuln-scan'].outputs.sqli_count | default('0', true) }}"
          echo "  Command Injection: {{ jobs['vuln-scan'].outputs.cmdi_count | default('0', true) }}"
          echo "  CRLF Injection: {{ jobs['vuln-scan'].outputs.crlf_count | default('0', true) }}"
          echo "  SSRF: {{ jobs['vuln-scan'].outputs.ssrf_count | default('0', true) }}"
          echo "  SSTI: {{ jobs['vuln-scan'].outputs.ssti_count | default('0', true) }}"
          echo ""
          echo "--- Secrets ---"
          echo "Secret findings: {{ jobs.secrets.outputs.secret_count | default('0', true) }}"
          echo "======================================================"
        log-stdout: true
      - name: export-to-project
        script: |
          import shutil
          from pathlib import Path

          project = '{{ vars.project_path | default("", true) }}'
          if not project:
              print('No --project set, skipping file export')
          else:

              # directories
              d = '{{ vars.project_web }}'
              Path(d).mkdir(parents=True, exist_ok=True)
              src = '''{{ jobs['dir-brute'].outputs.dir_urls_file | default('', true) }}'''
              if src and Path(src).is_file():
                  shutil.copy2(src, Path(d) / 'directories.txt')
                  print('  [+] web/directories.txt')

              # crawled URLs
              src = '''{{ jobs['crawl'].outputs.crawled_file | default('', true) }}'''
              if src and Path(src).is_file():
                  shutil.copy2(src, Path(d) / 'crawled-urls.txt')
                  print('  [+] web/crawled-urls.txt')

              # param URLs
              src = '''{{ jobs['param-fuzz'].outputs.param_file | default('', true) }}'''
              if src and Path(src).is_file():
                  shutil.copy2(src, Path(d) / 'param-urls.txt')
                  print('  [+] web/param-urls.txt')

              # Auto-export typed outputs
              all_typed = []
              for typed in [
                  {{ jobs['fingerprint'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['dir-brute'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['crawl'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['param-fuzz'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['vuln-scan'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['secrets'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['ssl-audit'].outputs.typed_outputs | default([], true) | tojson }},
              ]:
                  all_typed.extend(typed)
              summaries = export_typed_outputs(project, all_typed)
              for s in summaries:
                  print(s)

              print(f'Project export complete: {project}')
        continue-on-error: true
