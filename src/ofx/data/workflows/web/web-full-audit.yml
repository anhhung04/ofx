name: web-full-audit
description: 'Comprehensive web application audit — port discovery, fingerprinting, directory brute-forcing, parameter fuzzing,
  vulnerability scanning (XSS, SQLi, CRLF, command injection), and secret hunting.

  '
tags:
- web
- audit
- vuln
- fuzz
- xss
- sqli
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target URL or hostname (e.g. https://target.com)
    wordlist:
      type: string
      default: /usr/share/wordlists/seclists/Discovery/Web-Content/raft-medium-directories.txt
      description: Wordlist for directory brute-forcing
jobs:
  fingerprint:
    name: Fingerprinting
    steps:
    - task: rustscan
      name: port-discovery
      with:
        target: '{{ inputs.target }}'
        range: 1-10000
        batch_size: 4500
      continue-on-error: true
    - task: httpx
      name: http-probe
      with:
        target: '{{ inputs.target }}'
        tech_detect: true
        status_code: true
        title: true
        follow_redirects: true
      log-stdout: true
      continue-on-error: true
    - task: wafw00f
      name: waf-detect
      with:
        target: '{{ inputs.target }}'
      log-stdout: true
      continue-on-error: true
    - task: whatweb
      name: whatweb-scan
      with:
        target: '{{ inputs.target }}'
        aggression: 3
      log-stdout: true
      continue-on-error: true
    - name: export-info
      run: 'echo "live_urls={{ urls(steps[1].outputs.typed_outputs) | selectattr(''status_code'', ''gt'', 0) | map(attribute=''url'')
        | unique | join(''\n'') }}" >> $OFX_OUTPUTS

        '
      log-stdout: true
  dir-brute:
    name: Directory Brute-Force
    needs:
    - fingerprint
    steps:
    - task: feroxbuster
      name: feroxbuster-deep
      with:
        target: '{{ jobs.fingerprint.outputs.live_urls | default(inputs.target, true) }}'
        wordlist: '{{ inputs.wordlist }}'
        threads: 50
        depth: 3
        status_codes: 200,201,204,301,302,307,401,403,405,500
      log-stdout: true
      continue-on-error: true
    - task: gobuster
      name: gobuster-scan
      with:
        target: '{{ jobs.fingerprint.outputs.live_urls | default(inputs.target, true) }}'
        mode: dir
        wordlist: '{{ inputs.wordlist }}'
        threads: 50
        status_codes: 200,201,204,301,302,307,401,403
      log-stdout: true
      continue-on-error: true
    - task: dirsearch
      name: dirsearch-scan
      with:
        target: '{{ jobs.fingerprint.outputs.live_urls | default(inputs.target, true) }}'
        threads: 30
        extensions: php,asp,aspx,jsp,html,js,json,xml,txt,bak,sql,conf
      log-stdout: true
      continue-on-error: true
    - name: collect-dirs
      script: "urls = set()\nfor idx in [0, 1, 2]:\n    step_data = {{ steps | tojson }}\n    typed = step_data[idx].get('outputs',\
        \ {}).get('typed_outputs', [])\n    for item in typed:\n        if item.get('_type') == 'url' and item.get('url'):\n\
        \            urls.add(item['url'])\n\nwith open('{{ env.OFX_OUTPUTS }}', 'a') as f:\n    f.write(f\"dir_urls={chr(10).join(sorted(urls))}\\\
        n\")\n    f.write(f\"dir_count={len(urls)}\\n\")\n\nprint(f\"Discovered {len(urls)} unique URLs/directories\")\n"
      log-stdout: true
  crawl:
    name: Content Discovery
    needs:
    - fingerprint
    steps:
    - task: katana
      name: katana-crawl
      with:
        target: '{{ jobs.fingerprint.outputs.live_urls | default(inputs.target, true) }}'
        depth: 3
      log-stdout: true
      continue-on-error: true
    - task: hakrawler
      name: hakrawler-crawl
      with:
        target: '{{ jobs.fingerprint.outputs.live_urls | default(inputs.target, true) }}'
        depth: 3
        scope: subs
      log-stdout: true
      continue-on-error: true
    - task: gospider
      name: gospider-crawl
      with:
        target: '{{ jobs.fingerprint.outputs.live_urls | default(inputs.target, true) }}'
        depth: 2
      continue-on-error: true
    - task: gau
      name: gau-archive
      with:
        target: '{{ inputs.target }}'
        subs: true
      continue-on-error: true
    - name: collect-crawled
      script: "urls = set()\nfor idx in range(4):\n    step_data = {{ steps | tojson }}\n    typed = step_data[idx].get('outputs',\
        \ {}).get('typed_outputs', [])\n    for item in typed:\n        url = item.get('url', '')\n        if url:\n     \
        \       urls.add(url)\n\nwith open('{{ env.OFX_OUTPUTS }}', 'a') as f:\n    f.write(f\"crawled_urls={chr(10).join(sorted(urls))}\\\
        n\")\n    f.write(f\"crawl_count={len(urls)}\\n\")\n\nprint(f\"Crawled {len(urls)} unique URLs\")\n"
      log-stdout: true
  param-fuzz:
    name: Parameter Discovery & Fuzzing
    needs:
    - crawl
    - dir-brute
    steps:
    - task: arjun
      name: arjun-params
      with:
        target: '{{ jobs.fingerprint.outputs.live_urls | default(inputs.target, true) }}'
        threads: 20
      log-stdout: true
      continue-on-error: true
    - task: x8
      name: x8-params
      with:
        target: '{{ jobs.fingerprint.outputs.live_urls | default(inputs.target, true) }}'
        method: GET
      log-stdout: true
      continue-on-error: true
    - task: paramspider
      name: paramspider-discover
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: collect-params
      script: "param_urls = set()\nfor idx in range(3):\n    step_data = {{ steps | tojson }}\n    typed = step_data[idx].get('outputs',\
        \ {}).get('typed_outputs', [])\n    for item in typed:\n        url = item.get('url', '')\n        if url and ('='\
        \ in url or '?' in url):\n            param_urls.add(url)\n\nwith open('{{ env.OFX_OUTPUTS }}', 'a') as f:\n    f.write(f\"\
        param_urls={chr(10).join(sorted(param_urls))}\\n\")\n    f.write(f\"param_count={len(param_urls)}\\n\")\n\nprint(f\"\
        Discovered {len(param_urls)} parameterized URLs\")\n"
      log-stdout: true
  vuln-scan:
    name: Vulnerability Scanning
    needs:
    - param-fuzz
    steps:
    - task: nuclei
      name: nuclei-scan
      with:
        target: '{{ jobs.fingerprint.outputs.live_urls | default(inputs.target, true) }}'
        severity: critical,high,medium
      log-stdout: true
      continue-on-error: true
    - task: dalfox
      name: xss-scan
      with:
        target: '{{ jobs[''param-fuzz''].outputs.param_urls | default(inputs.target, true) }}'
      log-stdout: true
      continue-on-error: true
    - task: sqlmap
      name: sqli-scan
      with:
        target: '{{ jobs[''param-fuzz''].outputs.param_urls | default(inputs.target, true) }}'
        batch: true
        level: 3
        risk: 2
        threads: 5
      log-stdout: true
      continue-on-error: true
    - task: commix
      name: cmdi-scan
      with:
        target: '{{ jobs[''param-fuzz''].outputs.param_urls | default(inputs.target, true) }}'
        batch: true
        level: 2
      log-stdout: true
      continue-on-error: true
    - task: crlfuzz
      name: crlf-scan
      with:
        target: '{{ jobs.fingerprint.outputs.live_urls | default(inputs.target, true) }}'
      log-stdout: true
      continue-on-error: true
    - task: nikto
      name: nikto-scan
      with:
        target: '{{ inputs.target }}'
      log-stdout: true
      continue-on-error: true
    - name: collect-vulns
      script: "nuclei_v = {{ vulns(steps[0].outputs.typed_outputs) | tojson }}\nxss_v = {{ vulns(steps[1].outputs.typed_outputs)\
        \ | tojson }}\nsqli_v = {{ vulns(steps[2].outputs.typed_outputs) | tojson }}\ncmdi_v = {{ vulns(steps[3].outputs.typed_outputs)\
        \ | tojson }}\ncrlf_v = {{ vulns(steps[4].outputs.typed_outputs) | tojson }}\nnikto_v = {{ vulns(steps[5].outputs.typed_outputs)\
        \ | tojson }}\n\ntotal = len(nuclei_v) + len(xss_v) + len(sqli_v) + len(cmdi_v) + len(crlf_v) + len(nikto_v)\ncritical\
        \ = sum(1 for v in nuclei_v + xss_v + sqli_v + cmdi_v if v.get('severity') == 'critical')\nhigh = sum(1 for v in nuclei_v\
        \ + xss_v + sqli_v + cmdi_v if v.get('severity') == 'high')\n\nwith open('{{ env.OFX_OUTPUTS }}', 'a') as f:\n   \
        \ f.write(f\"total_vulns={total}\\n\")\n    f.write(f\"critical_count={critical}\\n\")\n    f.write(f\"high_count={high}\\\
        n\")\n    f.write(f\"xss_count={len(xss_v)}\\n\")\n    f.write(f\"sqli_count={len(sqli_v)}\\n\")\n    f.write(f\"\
        cmdi_count={len(cmdi_v)}\\n\")\n    f.write(f\"crlf_count={len(crlf_v)}\\n\")\n\nprint(f\"Total: {total} vulns (C:{critical}\
        \ H:{high})\")\nprint(f\"  XSS: {len(xss_v)}, SQLi: {len(sqli_v)}, CMDi: {len(cmdi_v)}, CRLF: {len(crlf_v)}\")\n"
      log-stdout: true
  secrets:
    name: Secret Hunting
    needs:
    - crawl
    steps:
    - task: trufflehog
      name: trufflehog-scan
      with:
        target: '{{ inputs.target }}'
        mode: filesystem
      log-stdout: true
      continue-on-error: true
    - task: gitleaks
      name: gitleaks-scan
      with:
        target: '{{ inputs.target }}'
      log-stdout: true
      continue-on-error: true
  summary:
    name: Web Audit Summary
    needs:
    - vuln-scan
    - secrets
    steps:
    - name: report
      run: 'echo "======================================================"

        echo " WEB FULL AUDIT COMPLETE: {{ inputs.target }}"

        echo "======================================================"

        echo ""

        echo "--- Discovery ---"

        echo "Directories found: {{ jobs[''dir-brute''].outputs.dir_count }}"

        echo "URLs crawled: {{ jobs.crawl.outputs.crawl_count }}"

        echo "Parameterized URLs: {{ jobs[''param-fuzz''].outputs.param_count }}"

        echo ""

        echo "--- Vulnerabilities ---"

        echo "Total findings: {{ jobs[''vuln-scan''].outputs.total_vulns }}"

        echo "  Critical: {{ jobs[''vuln-scan''].outputs.critical_count }}"

        echo "  High: {{ jobs[''vuln-scan''].outputs.high_count }}"

        echo "  XSS: {{ jobs[''vuln-scan''].outputs.xss_count }}"

        echo "  SQLi: {{ jobs[''vuln-scan''].outputs.sqli_count }}"

        echo "  Command Injection: {{ jobs[''vuln-scan''].outputs.cmdi_count }}"

        echo "  CRLF Injection: {{ jobs[''vuln-scan''].outputs.crlf_count }}"

        '
      log-stdout: true
    - name: export-to-project
      script: "import json, os\nfrom pathlib import Path\n\nproject = '{{ vars.project_path | default(\"\", true) }}'\nif\
        \ not project:\n    print('No --project set, skipping file export')\nelse:\n    p = Path(project)\n\n    # directories\n\
        \    d = p / 'scans'\n    d.mkdir(parents=True, exist_ok=True)\n    data = '''{{ jobs['dir-brute'].outputs.dir_urls\
        \ | default('', true) }}'''.strip()\n    if data:\n        (d / 'directories.txt').write_text(data)\n        print(f'\
        \  [+] scans/directories.txt ({len(data.splitlines())} lines)')\n\n    # crawled URLs\n    d = p / 'scans'\n    d.mkdir(parents=True,\
        \ exist_ok=True)\n    data = '''{{ jobs.crawl.outputs.crawled_urls | default('', true) }}'''.strip()\n    if data:\n\
        \        (d / 'crawled-urls.txt').write_text(data)\n        print(f'  [+] scans/crawled-urls.txt ({len(data.splitlines())}\
        \ lines)')\n\n    # param URLs\n    d = p / 'scans'\n    d.mkdir(parents=True, exist_ok=True)\n    data = '''{{ jobs['param-fuzz'].outputs.param_urls\
        \ | default('', true) }}'''.strip()\n    if data:\n        (d / 'param-urls.txt').write_text(data)\n        print(f'\
        \  [+] scans/param-urls.txt ({len(data.splitlines())} lines)')\n\n    print(f'Project export complete: {project}')"
      continue-on-error: true
