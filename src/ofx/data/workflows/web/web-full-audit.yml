name: web-full-audit
description:
  "Comprehensive web application audit — port discovery, fingerprinting, directory brute-forcing, parameter fuzzing, vulnerability scanning (XSS, SQLi, CRLF, command injection), and secret hunting.

  "
tags:
  - web
  - audit
  - vuln
  - fuzz
  - xss
  - sqli
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target URL or hostname (e.g. https://target.com)
      alias: t
    wordlist:
      type: string
      default: /usr/share/wordlists/seclists/Discovery/Web-Content/raft-medium-directories.txt
      description: Wordlist for directory brute-forcing
jobs:
  fingerprint:
    name: Fingerprinting
    outputs:
      live_urls: '{{ steps["export-info"].outputs.live_urls | default("", true) }}'
    steps:
      - task: rustscan
        timeout: 10
        name: port-discovery
        with:
          target: "{{ inputs.target }}"
          range: 1-10000
          batch_size: 4500
        continue-on-error: true
      - task: httpx
        timeout: 10
        name: http-probe
        with:
          target: "{{ inputs.target }}"
          tech_detect: true
          status_code: true
          title: true
          follow_redirects: true
        continue-on-error: true
      - task: wafw00f
        timeout: 10
        name: waf-detect
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      - task: whatweb
        timeout: 10
        name: whatweb-scan
        with:
          target: "{{ inputs.target }}"
          aggression: 3
        continue-on-error: true
      - name: export-info
        script: |
          typed = {{ steps["http-probe"].outputs.typed_outputs | default([], true) | tojson }}
          live = []
          for item in typed:
              if item.get("_type") == "url" and item.get("status_code", 0) > 0:
                  live.append(item["url"])
          add_outputs(live_urls='\n'.join(sorted(set(live))))
  dir-brute:
    name: Directory Brute-Force
    needs:
      - fingerprint
    outputs:
      dir_urls_file: '{{ steps["collect-dirs"].outputs.dir_urls_file | default("", true) }}'
      dir_count: '{{ steps["collect-dirs"].outputs.dir_count | default("", true) }}'
    steps:
      - task: feroxbuster
        timeout: 20
        name: feroxbuster-deep
        with:
          target: "{{ jobs.fingerprint.outputs.live_urls | default(inputs.target, true) }}"
          wordlist: "{{ inputs.wordlist }}"
          threads: 50
          depth: 3
          smart: true
          extract_links: true
          insecure: true
          auto_tune: true
          status_codes: 200,201,204,301,302,307,308,401,403,405,500
        continue-on-error: true
      - task: gobuster
        timeout: 10
        name: gobuster-scan
        with:
          target: "{{ jobs.fingerprint.outputs.live_urls | default(inputs.target, true) }}"
          mode: dir
          wordlist: "{{ inputs.wordlist }}"
          threads: 50
          status_codes: 200,201,204,301,302,307,401,403
        continue-on-error: true
      - task: dirsearch
        timeout: 15
        name: dirsearch-scan
        with:
          target: "{{ jobs.fingerprint.outputs.live_urls | default(inputs.target, true) }}"
          threads: 30
          extensions: php,asp,aspx,jsp,html,js,json,xml,txt,bak,sql,conf
        continue-on-error: true
      - name: collect-dirs
        script: |
          urls = set()
          for idx in ["0", "1", "2"]:
              step_data = {{ steps | tojson }}
              typed = step_data.get(idx, {}).get('outputs', {}).get('typed_outputs', [])
              for item in typed:
                  if item.get('_type') == 'url' and item.get('url'):
                      urls.add(item['url'])

          with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_webaudit_dirs.txt', 'w') as tf:
              tf.write('\n'.join(sorted(urls)))

          add_outputs(dir_urls_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_webaudit_dirs.txt", dir_count=len(urls))
          print(f"Discovered {len(urls)} unique URLs/directories")
  crawl:
    name: Content Discovery
    needs:
      - fingerprint
    outputs:
      crawled_file: '{{ steps["collect-crawled"].outputs.crawled_file | default("", true) }}'
      crawl_count: '{{ steps["collect-crawled"].outputs.crawl_count | default("", true) }}'
    steps:
      - task: katana
        timeout: 15
        name: katana-crawl
        with:
          target: "{{ jobs.fingerprint.outputs.live_urls | default(inputs.target, true) }}"
          depth: 3
          js_crawl: true
          known_files: all
        continue-on-error: true
      - task: hakrawler
        timeout: 10
        name: hakrawler-crawl
        with:
          target: "{{ jobs.fingerprint.outputs.live_urls | default(inputs.target, true) }}"
          depth: 3
          scope: subs
        continue-on-error: true
      - task: gospider
        timeout: 15
        name: gospider-crawl
        with:
          target: "{{ jobs.fingerprint.outputs.live_urls | default(inputs.target, true) }}"
          depth: 2
        continue-on-error: true
      - task: gau
        timeout: 10
        name: gau-archive
        with:
          target: "{{ inputs.target }}"
          subs: true
        continue-on-error: true
      - name: collect-crawled
        script: |
          urls = set()
          for idx in range(4):
              step_data = {{ steps | tojson }}
              typed = step_data.get(idx, {}).get('outputs', {}).get('typed_outputs', [])
              for item in typed:
                  url = item.get('url', '')
                  if url:
                      urls.add(url)

          with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_webaudit_crawled.txt', 'w') as tf:
              tf.write('\n'.join(sorted(urls)))

          add_outputs(crawled_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_webaudit_crawled.txt", crawl_count=len(urls))
          print(f"Crawled {len(urls)} unique URLs")
  param-fuzz:
    name: Parameter Discovery & Fuzzing
    needs:
      - crawl
      - dir-brute
    outputs:
      param_file: '{{ steps["collect-params"].outputs.param_file | default("", true) }}'
      param_count: '{{ steps["collect-params"].outputs.param_count | default("", true) }}'
    steps:
      - task: arjun
        timeout: 10
        name: arjun-params
        with:
          target: "{{ jobs.fingerprint.outputs.live_urls | default(inputs.target, true) }}"
          threads: 20
        continue-on-error: true
      - task: x8
        timeout: 10
        name: x8-params
        with:
          target: "{{ jobs.fingerprint.outputs.live_urls | default(inputs.target, true) }}"
          method: GET
        continue-on-error: true
      - task: paramspider
        timeout: 10
        name: paramspider-discover
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      - name: collect-params
        script: |
          param_urls = set()
          for idx in range(3):
              step_data = {{ steps | tojson }}
              typed = step_data.get(idx, {}).get('outputs', {}).get('typed_outputs', [])
              for item in typed:
                  url = item.get('url', '')
                  if url and ('=' in url or '?' in url):
                      param_urls.add(url)

          with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_param_urls.txt', 'w') as f:
              f.write('\n'.join(sorted(param_urls)))

          add_outputs(param_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_param_urls.txt", param_count=len(param_urls))
          print(f"Discovered {len(param_urls)} parameterized URLs")
  vuln-scan:
    name: Vulnerability Scanning
    needs:
      - param-fuzz
    outputs:
      total_vulns: '{{ steps["collect-vulns"].outputs.total_vulns | default("", true) }}'
      critical_count: '{{ steps["collect-vulns"].outputs.critical_count | default("", true) }}'
      high_count: '{{ steps["collect-vulns"].outputs.high_count | default("", true) }}'
      xss_count: '{{ steps["collect-vulns"].outputs.xss_count | default("", true) }}'
      sqli_count: '{{ steps["collect-vulns"].outputs.sqli_count | default("", true) }}'
      cmdi_count: '{{ steps["collect-vulns"].outputs.cmdi_count | default("", true) }}'
      crlf_count: '{{ steps["collect-vulns"].outputs.crlf_count | default("", true) }}'
    steps:
      - task: nuclei
        timeout: 20
        name: nuclei-scan
        with:
          target: "{{ jobs.fingerprint.outputs.live_urls | default(inputs.target, true) }}"
          severity: critical,high,medium
        continue-on-error: true
      - task: dalfox
        timeout: 15
        name: xss-scan
        with:
          target: "{{ jobs['param-fuzz'].outputs.param_file | default(inputs.target, true) }}"
        continue-on-error: true
      - task: sqlmap
        timeout: 30
        name: sqli-scan
        with:
          target: "{{ jobs['param-fuzz'].outputs.param_file | default(inputs.target, true) }}"
          batch: true
          level: 3
          risk: 2
          threads: 5
        continue-on-error: true
      - task: commix
        timeout: 20
        name: cmdi-scan
        with:
          target: "{{ jobs['param-fuzz'].outputs.param_file | default(inputs.target, true) }}"
          batch: true
          level: 2
        continue-on-error: true
      - task: crlfuzz
        name: crlf-scan
        timeout: 10
        with:
          target: "{{ jobs.fingerprint.outputs.live_urls | default(inputs.target, true) }}"
        continue-on-error: true
      - task: nikto
        timeout: 15
        name: nikto-scan
        with:
          target: "{{ inputs.target }}"
          maxtime: 900
        continue-on-error: true
      - name: collect-vulns
        script: |
          nuclei_v = {{ vulns(steps["nuclei-scan"].outputs.typed_outputs) | tojson }}
          xss_v = {{ vulns(steps["xss-scan"].outputs.typed_outputs) | tojson }}
          sqli_v = {{ vulns(steps["sqli-scan"].outputs.typed_outputs) | tojson }}
          cmdi_v = {{ vulns(steps["cmdi-scan"].outputs.typed_outputs) | tojson }}
          crlf_v = {{ vulns(steps["crlf-scan"].outputs.typed_outputs) | tojson }}
          nikto_v = {{ vulns(steps["nikto-scan"].outputs.typed_outputs) | tojson }}

          total = len(nuclei_v) + len(xss_v) + len(sqli_v) + len(cmdi_v) + len(crlf_v) + len(nikto_v)
          critical = sum(1 for v in nuclei_v + xss_v + sqli_v + cmdi_v if v.get('severity') == 'critical')
          high = sum(1 for v in nuclei_v + xss_v + sqli_v + cmdi_v if v.get('severity') == 'high')

          add_outputs(total_vulns=total, critical_count=critical, high_count=high, xss_count=len(xss_v), sqli_count=len(sqli_v), cmdi_count=len(cmdi_v), crlf_count=len(crlf_v))
          print(f"Total: {total} vulns (C:{critical} H:{high})")
          print(f"  XSS: {len(xss_v)}, SQLi: {len(sqli_v)}, CMDi: {len(cmdi_v)}, CRLF: {len(crlf_v)}")
  secrets:
    name: Secret Hunting
    outputs:
      typed_outputs: '{{ steps["nuclei-secrets"].outputs.typed_outputs | default([], true) }}'
    needs:
      - crawl
    steps:
      - task: nuclei
        timeout: 15
        name: nuclei-secrets
        with:
          target: "{{ jobs['crawl'].outputs.crawled_file | default(inputs.target, true) }}"
          tags: exposure,token,secret
        continue-on-error: true
  summary:
    name: Web Audit Summary
    needs:
      - vuln-scan
      - secrets
    steps:
      - name: report
        run: |
          echo "======================================================"
          echo " WEB FULL AUDIT COMPLETE: {{ inputs.target }}"
          echo "======================================================"
          echo ""
          echo "--- Discovery ---"
          echo "Directories found: {{ jobs['dir-brute'].outputs.dir_count }}"
          echo "URLs crawled: {{ jobs.crawl.outputs.crawl_count }}"
          echo "Parameterized URLs: {{ jobs['param-fuzz'].outputs.param_count }}"
          echo ""
          echo "--- Vulnerabilities ---"
          echo "Total findings: {{ jobs['vuln-scan'].outputs.total_vulns }}"
          echo "  Critical: {{ jobs['vuln-scan'].outputs.critical_count }}"
          echo "  High: {{ jobs['vuln-scan'].outputs.high_count }}"
          echo "  XSS: {{ jobs['vuln-scan'].outputs.xss_count }}"
          echo "  SQLi: {{ jobs['vuln-scan'].outputs.sqli_count }}"
          echo "  Command Injection: {{ jobs['vuln-scan'].outputs.cmdi_count }}"
          echo "  CRLF Injection: {{ jobs['vuln-scan'].outputs.crlf_count }}"
        log-stdout: true
      - name: export-to-project
        script: |
          import shutil
          from pathlib import Path

          project = '{{ vars.project_path | default("", true) }}'
          if not project:
              print('No --project set, skipping file export')
          else:

              # directories
              d = '{{ vars.project_web }}'
              Path(d).mkdir(parents=True, exist_ok=True)
              src = '''{{ jobs['dir-brute'].outputs.dir_urls_file | default('', true) }}'''
              if src and Path(src).is_file():
                  shutil.copy2(src, Path(d) / 'directories.txt')
                  print('  [+] web/directories.txt')

              # crawled URLs
              d = '{{ vars.project_web }}'
              Path(d).mkdir(parents=True, exist_ok=True)
              src = '''{{ jobs['crawl'].outputs.crawled_file | default('', true) }}'''
              if src and Path(src).is_file():
                  shutil.copy2(src, Path(d) / 'crawled-urls.txt')
                  print('  [+] web/crawled-urls.txt')

              # param URLs
              d = '{{ vars.project_web }}'
              Path(d).mkdir(parents=True, exist_ok=True)
              src = '''{{ jobs['param-fuzz'].outputs.param_file | default('', true) }}'''
              if src and Path(src).is_file():
                  shutil.copy2(src, Path(d) / 'param-urls.txt')
                  print('  [+] web/param-urls.txt')

              # Auto-export typed outputs
              all_typed = []
              for typed in [
                  {{ jobs['fingerprint'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['dir-brute'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['crawl'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['param-fuzz'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['vuln-scan'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['secrets'].outputs.typed_outputs | default([], true) | tojson }},
              ]:
                  all_typed.extend(typed)
              summaries = export_typed_outputs(project, all_typed)
              for s in summaries:
                  print(s)

              print(f'Project export complete: {project}')
        continue-on-error: true
