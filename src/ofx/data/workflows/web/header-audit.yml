name: header-audit
description: |
  HTTP security header audit — comprehensive check of security headers,
  cookie flags, HSTS, CSP, permissions policy, and information leakage
  for a given URL or list of URLs.
tags: [web, security, headers, audit]
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: URL or @file with URLs to audit
      alias: t

jobs:
  audit:
    name: Security Header Audit
    outputs:
      urls_tested: '{{ steps["check-headers"].outputs.urls_tested | default("", true) }}'
      finding_count: '{{ steps["check-headers"].outputs.finding_count | default("", true) }}'
      grades: '{{ steps["check-headers"].outputs.grades | default("", true) }}'
    steps:
    - name: check-headers
      script: |
        import urllib.request
        import urllib.error
        import re
        import json
        from pathlib import Path

        raw = '''{{ inputs.target }}'''
        if Path(raw).is_file():
            urls = [u.strip() for u in Path(raw).read_text().splitlines() if u.strip()]
        else:
            urls = [raw]

        print(f"=== HTTP SECURITY HEADER AUDIT ===\n")

        all_findings = []
        grades = {}

        for url in urls[:30]:
            print(f"--- {url} ---")
            findings = []
            score = 100

            try:
                req = urllib.request.Request(url, method='GET')
                req.add_header('User-Agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36')
                resp = urllib.request.urlopen(req, timeout=10)
                headers = dict(resp.headers)
                status = resp.status
            except urllib.error.HTTPError as e:
                headers = dict(e.headers)
                status = e.code
            except Exception as e:
                print(f"  Error: {e}\n")
                continue

            # Security headers check
            security_headers = {
                'Strict-Transport-Security': {'severity': 'HIGH', 'deduct': 15},
                'Content-Security-Policy': {'severity': 'HIGH', 'deduct': 15},
                'X-Content-Type-Options': {'severity': 'MEDIUM', 'deduct': 10},
                'X-Frame-Options': {'severity': 'MEDIUM', 'deduct': 10},
                'Referrer-Policy': {'severity': 'LOW', 'deduct': 5},
                'Permissions-Policy': {'severity': 'LOW', 'deduct': 5},
                'X-XSS-Protection': {'severity': 'LOW', 'deduct': 5},
                'Cross-Origin-Embedder-Policy': {'severity': 'LOW', 'deduct': 3},
                'Cross-Origin-Opener-Policy': {'severity': 'LOW', 'deduct': 3},
                'Cross-Origin-Resource-Policy': {'severity': 'LOW', 'deduct': 3},
            }

            header_lower = {k.lower(): v for k, v in headers.items()}

            present = []
            missing = []
            for header, info in security_headers.items():
                if header.lower() in header_lower:
                    present.append(header)
                else:
                    missing.append(header)
                    score -= info['deduct']
                    findings.append(f"[{info['severity']}] Missing: {header}")

            # Info leak headers
            info_headers = ['Server', 'X-Powered-By', 'X-AspNet-Version', 'X-AspNetMvc-Version', 'X-Generator']
            for h in info_headers:
                if h.lower() in header_lower:
                    findings.append(f"[LOW] Info leak: {h}: {header_lower[h.lower()]}")
                    score -= 2

            # Cookie analysis
            cookies = headers.get('Set-Cookie', '')
            if cookies:
                if 'Secure' not in cookies:
                    findings.append('[MEDIUM] Cookie missing Secure flag')
                    score -= 5
                if 'HttpOnly' not in cookies:
                    findings.append('[MEDIUM] Cookie missing HttpOnly flag')
                    score -= 5
                if 'SameSite' not in cookies:
                    findings.append('[LOW] Cookie missing SameSite flag')
                    score -= 3

            # HSTS specifics
            hsts = header_lower.get('strict-transport-security', '')
            if hsts:
                if 'includeSubDomains' not in hsts:
                    findings.append('[LOW] HSTS missing includeSubDomains')
                if 'preload' not in hsts:
                    findings.append('[INFO] HSTS missing preload')
                max_age_match = re.search(r'max-age=(\d+)', hsts)
                if max_age_match:
                    max_age = int(max_age_match.group(1))
                    if max_age < 31536000:
                        findings.append(f'[LOW] HSTS max-age too short: {max_age}s (recommended: 31536000)')

            # Grade
            score = max(0, score)
            if score >= 90: grade = 'A'
            elif score >= 75: grade = 'B'
            elif score >= 60: grade = 'C'
            elif score >= 40: grade = 'D'
            else: grade = 'F'

            grades[url] = grade
            print(f"  Grade: {grade} ({score}/100)")
            print(f"  Present: {len(present)}/{len(security_headers)}")
            for finding in findings:
                print(f"  {finding}")
            print()
            all_findings.extend(findings)

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"urls_tested={len(urls)}\n")
            f.write(f"finding_count={len(all_findings)}\n")
            f.write(f"grades={json.dumps(grades)}\n")
      log-stdout: true
