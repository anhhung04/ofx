name: url-vuln
description: 'URL vulnerability scan — scans URLs for XSS, injection, and other web vulnerabilities using dalfox and nuclei.

  '
tags:
- http
- vuln
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Target URL(s), newline-separated for multiple
      alias: t
jobs:
  xss-scan:
    name: XSS Vulnerability Scan
    outputs:
      xss_count: '{{ steps["export-xss"].outputs.xss_count | default("", true) }}'
    steps:
    - task: dalfox
      log-command: "{{ inputs.log_command | default(true) }}"
      name: dalfox-xss
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: export-xss
      run: |
        echo 'xss_count={{ vulns(steps["dalfox-xss"].outputs.typed_outputs) | length }}' >> $OFX_OUTPUTS
  nuclei-scan:
    name: Nuclei Vulnerability Scan
    outputs:
      nuclei_count: '{{ steps["export-vulns"].outputs.nuclei_count | default("", true) }}'
    steps:
    - task: nuclei
      log-command: "{{ inputs.log_command | default(true) }}"
      name: nuclei-http
      with:
        target: '{{ inputs.target }}'
        severity: critical,high,medium
        exclude_tags: network,ssl,file,dns,osint,token-spray,headers
      continue-on-error: true
    - name: export-vulns
      run: |
        echo 'nuclei_count={{ vulns(steps["nuclei-http"].outputs.typed_outputs) | length }}' >> $OFX_OUTPUTS
  summary:
    name: Vulnerability Summary
    needs:
    - xss-scan
    - nuclei-scan
    steps:
    - name: report
      run: |
        echo "================================="
        echo " URL Vuln Scan: {{ inputs.target }}"
        echo "================================="
        echo "XSS findings: {{ jobs['xss-scan'].outputs.xss_count }}"
        echo "Nuclei findings: {{ jobs['nuclei-scan'].outputs.nuclei_count }}"
      log-stdout: "{{ inputs.log_output | default(true) }}"

    - name: export-to-project
      script: |
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:
            all_typed = []
            for typed in [
            {{ jobs['xss-scan'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['nuclei-scan'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true