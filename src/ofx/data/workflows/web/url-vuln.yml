# yaml-language-server: $schema=~/.ofx/workflow_schema.json
name: url-vuln
description: 'URL vulnerability scan — scans URLs for XSS, injection, and other web vulnerabilities using dalfox and nuclei.

  '
tags:
- http
- vuln
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target URL(s), newline-separated for multiple
      alias: t
jobs:
  xss-scan:
    name: XSS Vulnerability Scan
    outputs:
      xss_count: '${{ steps.export-xss.outputs.xss_count }}'
    steps:
    - task: dalfox
      name: dalfox-xss
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: export-xss
      run: |
        echo "xss_count={{ vulns(steps["dalfox-xss"].outputs.typed_outputs) | length }}" >> $OFX_OUTPUTS
  nuclei-scan:
    name: Nuclei Vulnerability Scan
    outputs:
      nuclei_count: '${{ steps.export-vulns.outputs.nuclei_count }}'
    steps:
    - task: nuclei
      name: nuclei-http
      with:
        target: '{{ inputs.target }}'
        severity: critical,high,medium
        exclude_tags: network,ssl,file,dns,osint,token-spray,headers
      continue-on-error: true
    - name: export-vulns
      run: |
        echo "nuclei_count={{ vulns(steps["nuclei-http"].outputs.typed_outputs) | length }}" >> $OFX_OUTPUTS
  summary:
    name: Vulnerability Summary
    needs:
    - xss-scan
    - nuclei-scan
    steps:
    - name: report
      run: |
        echo "================================="
        echo " URL Vuln Scan: {{ inputs.target }}"
        echo "================================="
        echo "XSS findings: {{ jobs['xss-scan'].outputs.xss_count }}"
        echo "Nuclei findings: {{ jobs['nuclei-scan'].outputs.nuclei_count }}"
      log-stdout: true
