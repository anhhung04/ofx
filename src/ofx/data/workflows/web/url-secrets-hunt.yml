# yaml-language-server: $schema=~/.ofx/workflow_schema.json
name: url-secrets-hunt
description: 'URL secrets hunt — probes URLs and scans HTTP responses for exposed secrets, credentials, API keys, tokens, and sensitive data using trufflehog.

  '
tags:
- http
- secrets
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target URL(s), newline-separated for multiple
      alias: t
jobs:
  probe:
    name: HTTP Probe
    steps:
    - task: httpx
      name: probe-urls
      with:
        target: '{{ inputs.target }}'
        tech_detect: true
        status_code: true
        title: true
      continue-on-error: true
  secrets-scan:
    name: Secret Scanning
    needs:
    - probe
    steps:
    - task: trufflehog
      name: scan-secrets
      with:
        target: '{{ inputs.target }}'
        mode: filesystem
      continue-on-error: true
    - name: summary
      run: |
        echo "================================="
        echo " Secrets Hunt: {{ inputs.target }}"
        echo "================================="
        echo "Secrets found: {{ vulns(steps["scan-secrets"].outputs.typed_outputs) | length }}"
      log-stdout: true

    - name: export-to-project
      script: |
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:
            all_typed = []
            for typed in [
            {{ jobs['probe'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['secrets-scan'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true