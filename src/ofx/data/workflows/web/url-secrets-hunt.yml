name: url-secrets-hunt
description:
  "URL secrets hunt — probes URLs and scans HTTP responses for exposed secrets, credentials, API keys, tokens, and sensitive data using trufflehog.

  "
tags:
  - http
  - secrets
outputs:
  probe_typed_outputs: '{{ jobs["probe"].outputs.typed_outputs }}'
  secrets_typed_outputs: '{{ jobs["secrets-scan"].outputs.typed_outputs }}'
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Target URL(s), newline-separated for multiple
      alias: t
jobs:
  probe:
    name: HTTP Probe
    outputs:
      typed_outputs: '{{ steps["probe-urls"].outputs.typed_outputs | default([], true) }}'
    steps:
      - task: httpx
        log-command: "{{ inputs.log_command | default(true) }}"
        name: probe-urls
        with:
          target: "{{ inputs.target }}"
          tech_detect: true
          status_code: true
          title: true
        continue-on-error: true
  secrets-scan:
    name: Secret Scanning
    needs:
      - probe
    outputs:
      typed_outputs: '{{ steps["scan-secrets"].outputs.typed_outputs | default([], true) }}'
    steps:
      - task: nuclei
        log-command: "{{ inputs.log_command | default(true) }}"
        name: scan-secrets
        with:
          target: "{{ inputs.target }}"
          tags: exposure,token,secret
        continue-on-error: true
      - name: summary
        run: |
          echo "================================="
          echo " Secrets Hunt: {{ inputs.target }}"
          echo "================================="
          echo 'Secrets found: {{ vulns(steps["scan-secrets"].outputs.typed_outputs) | length }}'
        log-stdout: "{{ inputs.log_output | default(true) }}"

      - name: export-to-project
        script: |
          from pathlib import Path

          project = '{{ vars.project_path | default("", true) }}'
          if not project:
              print('No --project set, skipping file export')
          else:
              all_typed = []
              for typed in [
              {{ jobs['probe'].outputs.typed_outputs | default([], true) | tojson }},
              {{ jobs['secrets-scan'].outputs.typed_outputs | default([], true) | tojson }},
              ]:
                  all_typed.extend(typed)
              summaries = export_typed_outputs(project, all_typed)
              for s in summaries:
                  print(s)

              print(f'Project export complete: {project}')
        continue-on-error: true
