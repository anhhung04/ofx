name: request-smuggling
description: >
  HTTP request smuggling detection — tests for HTTP request smuggling vulnerabilities
  caused by discrepancies in how frontend and backend servers parse HTTP requests.
  Covers CL.TE, TE.CL, and TE.TE smuggling variants. Uses nuclei smuggling templates
  with multiple attack vectors.
tags:
  - web
  - smuggling
  - http
  - request-smuggling
  - cl-te
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target URL or file with URLs
      alias: t
    log_command:
      type: string
      default: "true"
      description: Enable command logging
    log_output:
      type: string
      default: "true"
      description: Enable output logging
defaults:
  store-creds: false
outputs:
  findings_file: '{{ jobs["collect"].outputs.findings_file | default("", true) }}'
  finding_count: '{{ jobs["collect"].outputs.finding_count | default("0", true) }}'
  typed_outputs: '{{ jobs["collect"].outputs.typed_outputs | default([], true) }}'
jobs:
  discover:
    name: Smuggling Detection
    steps:
      - task: nuclei
        log-command: "{{ inputs.log_command | default(true) }}"
        name: nuclei-smuggling
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
          tags: "http-smuggling,smuggling,request-smuggling"
          severity: "critical,high,medium"
          rate_limit: 30
          json: true
          silent: true
        continue-on-error: true
      - task: nuclei
        log-command: "{{ inputs.log_command | default(true) }}"
        name: nuclei-cl-te
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
          tags: "cl-te,clte,content-length"
          severity: "critical,high,medium"
          rate_limit: 30
          json: true
          silent: true
        continue-on-error: true
      - task: nuclei
        log-command: "{{ inputs.log_command | default(true) }}"
        name: nuclei-te-cl
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
          tags: "te-cl,tecl,transfer-encoding"
          severity: "critical,high,medium"
          rate_limit: 30
          json: true
          silent: true
        continue-on-error: true
      - task: nuclei
        log-command: "{{ inputs.log_command | default(true) }}"
        name: nuclei-te-te
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
          tags: "te-te,tete,transfer-encoding-obfuscation"
          severity: "critical,high,medium"
          rate_limit: 30
          json: true
          silent: true
        continue-on-error: true
  collect:
    name: Collect Findings
    needs:
      - discover
    outputs:
      findings_file: '{{ steps["merge"].outputs.findings_file | default("", true) }}'
      finding_count: '{{ steps["merge"].outputs.finding_count | default("0", true) }}'
      typed_outputs: '{{ steps["merge"].outputs.typed_outputs | default([], true) }}'
    steps:
      - name: merge
        script: |
          import json
          from pathlib import Path

          all_findings = (
            {{ vulns(steps["nuclei-smuggling"].outputs.typed_outputs) | default([], true) | tojson }} +
            {{ vulns(steps["nuclei-cl-te"].outputs.typed_outputs) | default([], true) | tojson }} +
            {{ vulns(steps["nuclei-te-cl"].outputs.typed_outputs) | default([], true) | tojson }} +
            {{ vulns(steps["nuclei-te-te"].outputs.typed_outputs) | default([], true) | tojson }}
          )

           add_outputs(
             findings_json=json.dumps(all_findings, indent=2, default=str),
             finding_count=len(all_findings),
             typed_outputs=all_findings
           )
          print(f'Request smuggling: {len(all_findings)} findings')
  summary:
    name: Summary
    needs:
      - collect
    steps:
      - name: report
        run: |
          echo "=========================================="
          echo " REQUEST SMUGGLING DETECTION RESULTS"
          echo "=========================================="
          echo ""
          echo "Target: {{ inputs.target }}"
          echo "Findings: {{ jobs.collect.outputs.finding_count | default('0', true) }}"
          echo ""
          {% set findings = jobs.collect.outputs.typed_outputs | default([], true) %}
          {% for f in findings[:15] %}
          echo "  [{{ f.severity | default('info') }}] {{ f.name | default('') }}"
          echo "    {{ f.host | default('') }}"
          {% endfor %}
          echo "=========================================="
        log-stdout: "{{ inputs.log_output | default(true) }}"
