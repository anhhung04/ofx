name: cache-poison
description: |
  Web cache poisoning detection via header injection and unkeyed
  parameter discovery against target URLs.
tags:
  - web
  - cache
  - vuln

dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target URL or file of URLs
      alias: t

jobs:
  discover:
    name: Discovery & Probing
    outputs:
      live_file: '{{ steps["collect-cache-urls"].outputs.live_file | default("", true) }}'
      live_count: '{{ steps["collect-cache-urls"].outputs.live_count | default("", true) }}'
    steps:
      - task: httpx
        timeout: 10
        name: probe-targets
        with:
          target: '{{ inputs.target }}'
          tech_detect: true
          status_code: true
          follow_redirects: true
        continue-on-error: true

      - name: collect-cache-urls
        script: |
          import json

          live_urls = set()
          httpx_out = {{ steps["probe-targets"].outputs.typed_outputs | tojson }}
          for item in httpx_out:
              if item.get('_type') == 'url' and item.get('status_code', 0) > 0:
                  live_urls.add(item['url'])

          with open('/tmp/ofx_cachepoison_live.txt', 'w') as f:
              f.write('\n'.join(sorted(live_urls)))

          with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
              f.write(f"live_file=/tmp/ofx_cachepoison_live.txt\n")
              f.write(f"live_count={len(live_urls)}\n")

          print(f"Discovered {len(live_urls)} live URLs for cache poison testing")

  header-fuzz:
    name: Header Injection Testing
    needs:
      - discover
    outputs:
      findings_file: '{{ steps["collect-results"].outputs.findings_file | default("", true) }}'
      nuclei_count: '{{ steps["collect-results"].outputs.nuclei_count | default("", true) }}'
      ffuf_count: '{{ steps["collect-results"].outputs.ffuf_count | default("", true) }}'
      total_count: '{{ steps["collect-results"].outputs.total_count | default("", true) }}'
    steps:
      - task: nuclei
        timeout: 20
        name: nuclei-cache-poison
        with:
          target: '{{ jobs.discover.outputs.live_file | default(inputs.target, true) }}'
          tags: cache-poisoning,web-cache
        continue-on-error: true

      - name: ffuf-unkeyed-headers
        run: |
          TARGETS="{{ jobs.discover.outputs.live_file | default(inputs.target, true) }}"
          HEADERS="X-Forwarded-Host X-Original-URL X-Rewrite-URL X-Forwarded-Scheme X-Forwarded-Proto X-Host X-Forwarded-Server X-HTTP-Method-Override X-Amz-Website-Redirect-Location"
          OUTFILE="/tmp/ofx_cachepoison_ffuf.txt"
          > "$OUTFILE"
          if [ -f "$TARGETS" ]; then
            while IFS= read -r url; do
              [ -z "$url" ] && continue
              for hdr in $HEADERS; do
                result=$(ffuf -u "$url" -H "$hdr: evil.com" -mc 200,301,302 -s 2>/dev/null || true)
                if [ -n "$result" ]; then
                  echo "$url | $hdr" >> "$OUTFILE"
                fi
              done
            done < "$TARGETS"
          else
            for hdr in $HEADERS; do
              result=$(ffuf -u "$TARGETS" -H "$hdr: evil.com" -mc 200,301,302 -s 2>/dev/null || true)
              if [ -n "$result" ]; then
                echo "$TARGETS | $hdr" >> "$OUTFILE"
              fi
            done
          fi
          echo "Unkeyed header results:"
          cat "$OUTFILE" 2>/dev/null || echo "(none)"
        continue-on-error: true

      - name: collect-results
        script: |
          import json

          nuclei_vulns = {{ vulns(steps["nuclei-cache-poison"].outputs.typed_outputs) | tojson }}

          ffuf_findings = []
          try:
              with open('/tmp/ofx_cachepoison_ffuf.txt') as f:
                  for line in f:
                      line = line.strip()
                      if line:
                          ffuf_findings.append(line)
          except FileNotFoundError:
              pass

          with open('/tmp/ofx_cachepoison_findings.txt', 'w') as f:
              for v in nuclei_vulns:
                  name = v.get('name', 'unknown')
                  url = v.get('url', v.get('host', ''))
                  sev = v.get('severity', 'info')
                  f.write(f"[nuclei] [{sev}] {name} - {url}\n")
              for finding in ffuf_findings:
                  f.write(f"[ffuf] Unkeyed header: {finding}\n")

          total = len(nuclei_vulns) + len(ffuf_findings)

          with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
              f.write(f"findings_file=/tmp/ofx_cachepoison_findings.txt\n")
              f.write(f"nuclei_count={len(nuclei_vulns)}\n")
              f.write(f"ffuf_count={len(ffuf_findings)}\n")
              f.write(f"total_count={total}\n")

          print(f"Cache poison findings: {total} (nuclei: {len(nuclei_vulns)}, unkeyed headers: {len(ffuf_findings)})")

  summary:
    name: Summary
    needs:
      - header-fuzz
    steps:
      - name: report
        run: |
          echo "======================================================"
          echo " CACHE POISONING SCAN: {{ inputs.target }}"
          echo "======================================================"
          echo ""
          echo "Live targets: {{ jobs.discover.outputs.live_count }}"
          echo "Nuclei findings: {{ jobs['header-fuzz'].outputs.nuclei_count }}"
          echo "Unkeyed headers: {{ jobs['header-fuzz'].outputs.ffuf_count }}"
          echo "Total findings: {{ jobs['header-fuzz'].outputs.total_count }}"
          echo ""
          echo "Findings file: {{ jobs['header-fuzz'].outputs.findings_file }}"
        log-stdout: true

      - name: export-to-project
        script: |
          import shutil
          from pathlib import Path

          project = '{{ vars.project_path | default("", true) }}'
          if not project:
              print('No --project set, skipping file export')
          else:
              d = Path(project) / 'vulns'
              d.mkdir(parents=True, exist_ok=True)
              src = '''{{ jobs['header-fuzz'].outputs.findings_file | default('', true) }}'''
              if src and Path(src).is_file():
                  shutil.copy2(src, d / 'cache-poison-findings.txt')
                  print('  [+] vulns/cache-poison-findings.txt')

              all_typed = []
              for typed in [
                  {{ jobs.discover.outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['header-fuzz'].outputs.typed_outputs | default([], true) | tojson }},
              ]:
                  all_typed.extend(typed)
              summaries = export_typed_outputs(project, all_typed)
              for s in summaries:
                  print(s)

              print(f'Project export complete: {project}')
        continue-on-error: true
