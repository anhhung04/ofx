# yaml-language-server: $schema=~/.ofx/workflow_schema.json
name: url-params-fuzz
description: 'URL parameter fuzzing — discovers hidden URL parameters using arjun,
  then fuzzes parameter values with ffuf.

  '
tags:
- http
- fuzz
- params
- secrets
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target URL (e.g. https://example.com/page)
    wordlist:
      type: string
      default: ''
      description: Custom parameter wordlist (optional)
jobs:
  probe:
    name: Initial Probe
    steps:
    - task: httpx
      name: probe-url
      with:
        target: '{{ inputs.target }}'
        tech_detect: true
        status_code: true
      log-stdout: true
  param-discovery:
    name: Parameter Discovery
    needs:
    - probe
    steps:
    - task: arjun
      name: find-params
      with:
        target: '{{ inputs.target }}'
      log-stdout: true
    - name: export-params
      script: "import json\n\nparams = set()\nstep_data = {{ steps | tojson }}\ntyped\
        \ = step_data[0].get('outputs', {}).get('typed_outputs', [])\nfor item in\
        \ typed:\n    if item.get('_type') == 'tag':\n        params.add(item.get('value',\
        \ ''))\n\nwith open('{{ env.OFX_OUTPUTS }}', 'a') as f:\n    f.write(f\"found_params={','.join(sorted(params))}\\\
        n\")\n    f.write(f\"param_count={len(params)}\\n\")\n\nprint(f\"Discovered\
        \ {len(params)} parameters\")\n"
      log-stdout: true
  param-fuzz:
    name: Parameter Value Fuzzing
    needs:
    - param-discovery
    steps:
    - task: ffuf
      name: fuzz-params
      with:
        target: '{{ inputs.target }}?FUZZ=test'
        wordlist: /usr/share/wordlists/dirb/common.txt
        auto_calibration: true
        follow_redirect: true
      log-stdout: true
    - name: summary
      run: 'echo "======================================="

        echo " Param Fuzz: {{ inputs.target }}"

        echo "======================================="

        echo "Parameters found: {{ jobs[''param-discovery''].outputs.param_count }}"

        echo "Fuzz results: {{ urls(steps[0].outputs.typed_outputs) | length }}"

        '
      log-stdout: true
