name: url-params-fuzz
description: >
  URL parameter fuzzing — discovers hidden URL parameters using arjun, then fuzzes parameter values with ffuf.
tags:
- http
- fuzz
- params
- secrets
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Target URL (e.g. https://example.com/page)
      alias: t
    wordlist:
      type: string
      default: ''
      description: Custom parameter wordlist (optional)
jobs:
  probe:
    name: Initial Probe
    outputs:
      typed_outputs: '{{ steps["probe-url"].outputs.typed_outputs | default([], true) }}'
      live_url: '{{ steps["export-url"].outputs.live_url | default("", true) }}'
    steps:
    - task: httpx
      log-command: "{{ inputs.log_command | default(true) }}"
      name: probe-url
      with:
        target: '{{ inputs.target }}'
        tech_detect: true
        status_code: true
      continue-on-error: true
    - name: export-url
      script: |
        typed = {{ steps["probe-url"].outputs.typed_outputs | default([], true) | tojson }}
        live = [item["url"] for item in typed if item.get("_type") == "url" and item.get("status_code", 0) > 0]
        result = live[0] if live else '{{ inputs.target }}'
        add_outputs(live_url=result)
  param-discovery:
    name: Parameter Discovery
    needs:
    - probe
    outputs:
      found_params: '{{ steps["export-params"].outputs.found_params | default("", true) }}'
      param_count: '{{ steps["export-params"].outputs.param_count | default("", true) }}'
    steps:
    - task: arjun
      log-command: "{{ inputs.log_command | default(true) }}"
      name: find-params
      with:
        target: "{{ jobs.probe.outputs.live_url | default(inputs.target, true) }}"
      continue-on-error: true
    - name: export-params
      script: |
        import json

        params = set()
        typed = {{ steps["find-params"].outputs.typed_outputs | default([], true) | tojson }}
        for item in typed:
            if item.get('_type') == 'tag':
                params.add(item.get('value', ''))

        add_outputs(found_params=','.join(sorted(params)), param_count=len(params))
        print(f"Discovered {len(params)} parameters")
  param-fuzz:
    name: Parameter Value Fuzzing
    needs:
    - param-discovery
    steps:
    - task: ffuf
      log-command: "{{ inputs.log_command | default(true) }}"
      name: fuzz-params
      with:
        target: "{{ jobs.probe.outputs.live_url | default(inputs.target, true) }}?FUZZ=test"
        wordlist: "{{ inputs.wordlist or '/usr/share/wordlists/dirb/common.txt' }}"
        auto_calibration: true
        follow_redirect: true
      continue-on-error: true
    - name: summary
      run: |
        echo "======================================="
        echo " Param Fuzz: {{ inputs.target }}"
        echo "======================================="
        echo "Parameters found: {{ jobs['param-discovery'].outputs.param_count }}"
        echo 'Fuzz results: {{ urls(steps["fuzz-params"].outputs.typed_outputs) | length }}'
      log-stdout: "{{ inputs.log_output | default(true) }}"

    - name: export-to-project
      script: |
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:
            all_typed = []
            for typed in [
            {{ jobs['probe'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['param-discovery'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['param-fuzz'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true