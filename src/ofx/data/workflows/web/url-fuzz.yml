name: url-fuzz
description:
  "URL fuzzing — discovers hidden content and directories using feroxbuster and ffuf with intelligent calibration. Probes and optionally hunts for secrets.

  "
tags:
  - http
  - fuzz
  - secrets
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Target URL (e.g. https://example.com)
      alias: t
    wordlist:
      type: string
      default: /usr/share/wordlists/dirb/common.txt
      description: Wordlist for directory fuzzing
jobs:
  fuzz:
    name: Directory Fuzzing
    outputs:
      fuzzed_file: '{{ steps["collect-urls"].outputs.fuzzed_file | default("", true) }}'
      fuzz_count: '{{ steps["collect-urls"].outputs.fuzz_count | default("", true) }}'
    steps:
      - task: feroxbuster
        log-command: "{{ inputs.log_command | default(true) }}"
        name: feroxbuster-fuzz
        with:
          target: "{{ inputs.target }}"
          wordlist: "{{ inputs.wordlist }}"
          depth: 2
          threads: 50
          smart: true
          extract_links: true
          insecure: true
          status_codes: "200,201,204,301,302,307,308,401,403,405,500"
        continue-on-error: true
      - name: collect-urls
        script: |
          urls = set()
          for item in {{ urls(steps["feroxbuster-fuzz"].outputs.typed_outputs) | default([], true) | tojson }}:
              url = item.get('url', '')
              if url:
                  urls.add(url)

          with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_urlfuzz_urls.txt', 'w') as tf:
              tf.write('\n'.join(sorted(urls)))

          add_outputs(fuzzed_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_urlfuzz_urls.txt", fuzz_count=len(urls))
          print(f"Found {len(urls)} unique URLs via fuzzing")
  probe:
    name: Probe Fuzzed URLs
    needs:
      - fuzz
    steps:
      - task: httpx
        log-command: "{{ inputs.log_command | default(true) }}"
        name: probe-fuzzed
        with:
          target: "{{ jobs.fuzz.outputs.fuzzed_file }}"
          tech_detect: true
          status_code: true
          title: true
        continue-on-error: true
  secrets:
    name: Secret Hunting
    needs:
      - probe
    steps:
      - task: nuclei
        log-command: "{{ inputs.log_command | default(true) }}"
        name: hunt-secrets
        with:
          target: "{{ inputs.target }}"
          tags: exposure,token,secret
        continue-on-error: true
      - name: summary
        run: |
          echo "================================="
          echo " URL Fuzz: {{ inputs.target }}"
          echo "================================="
          echo "Fuzzed URLs: {{ jobs.fuzz.outputs.fuzz_count }}"
        log-stdout: "{{ inputs.log_output | default(true) }}"

      - name: export-to-project
        script: |
          from pathlib import Path

          project = '{{ vars.project_path | default("", true) }}'
          if not project:
              print('No --project set, skipping file export')
          else:
              all_typed = []
              for typed in [
              {{ jobs['fuzz'].outputs.typed_outputs | default([], true) | tojson }},
              {{ jobs['probe'].outputs.typed_outputs | default([], true) | tojson }},
              {{ jobs['secrets'].outputs.typed_outputs | default([], true) | tojson }},
              ]:
                  all_typed.extend(typed)
              summaries = export_typed_outputs(project, all_typed)
              for s in summaries:
                  print(s)

              print(f'Project export complete: {project}')
        continue-on-error: true
