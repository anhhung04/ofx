# yaml-language-server: $schema=~/.ofx/workflow_schema.json
name: url-fuzz
description: 'URL fuzzing — discovers hidden content and directories using feroxbuster and ffuf with intelligent calibration. Probes and optionally hunts for secrets.

  '
tags:
- http
- fuzz
- secrets
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target URL (e.g. https://example.com)
      alias: t
    wordlist:
      type: string
      default: /usr/share/wordlists/dirb/common.txt
      description: Wordlist for directory fuzzing
jobs:
  fuzz:
    name: Directory Fuzzing
    outputs:
      fuzzed_file: '{{ steps["collect-urls"].outputs.fuzzed_file }}'
      fuzz_count: '{{ steps["collect-urls"].outputs.fuzz_count }}'
    steps:
    - task: ffuf
      timeout: 15
      name: ffuf-fuzz
      with:
        target: '{{ inputs.target }}/FUZZ'
        wordlist: '{{ inputs.wordlist }}'
        threads: 50
        follow_redirect: true
        auto_calibration: true
      continue-on-error: true
    - task: feroxbuster
      timeout: 20
      name: feroxbuster-fuzz
      with:
        target: '{{ inputs.target }}'
        wordlist: '{{ inputs.wordlist }}'
        depth: 2
        threads: 50
      continue-on-error: true
    - name: collect-urls
      script: |
        import json

        urls = set()
        for step_idx in [0, 1]:
            step_data = {{ steps | tojson }}
            typed = step_data[step_idx].get('outputs', {}).get('typed_outputs', [])
            for item in typed:
                if item.get('_type') == 'url':
                    urls.add(item['url'])

        with open('/tmp/ofx_urlfuzz_urls.txt', 'w') as tf:
            tf.write('\n'.join(sorted(urls)))

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"fuzzed_file=/tmp/ofx_urlfuzz_urls.txt\n")
            f.write(f"fuzz_count={len(urls)}\n")

        print(f"Found {len(urls)} unique URLs via fuzzing")
  probe:
    name: Probe Fuzzed URLs
    needs:
    - fuzz
    steps:
    - task: httpx
      timeout: 10
      name: probe-fuzzed
      with:
        target: '{{ jobs.fuzz.outputs.fuzzed_file }}'
        tech_detect: true
        status_code: true
        title: true
      continue-on-error: true
  secrets:
    name: Secret Hunting
    needs:
    - probe
    steps:
    - task: trufflehog
      timeout: 15
      name: hunt-secrets
      with:
        target: '{{ inputs.target }}'
        mode: filesystem
      continue-on-error: true
    - name: summary
      run: |
        echo "================================="
        echo " URL Fuzz: {{ inputs.target }}"
        echo "================================="
        echo "Fuzzed URLs: {{ jobs.fuzz.outputs.fuzz_count }}"
      log-stdout: true

    - name: export-to-project
      script: |
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:
            all_typed = []
            for typed in [
            {{ jobs['fuzz'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['probe'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['secrets'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true