# yaml-language-server: $schema=~/.ofx/workflow_schema.json
name: url-fuzz
description: 'URL fuzzing — discovers hidden content and directories using feroxbuster
  and ffuf with intelligent calibration. Probes and optionally hunts for secrets.

  '
tags:
- http
- fuzz
- secrets
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target URL (e.g. https://example.com)
    wordlist:
      type: string
      default: /usr/share/wordlists/dirb/common.txt
      description: Wordlist for directory fuzzing
jobs:
  fuzz:
    name: Directory Fuzzing
    steps:
    - task: ffuf
      name: ffuf-fuzz
      with:
        target: '{{ inputs.target }}/FUZZ'
        wordlist: '{{ inputs.wordlist }}'
        threads: 50
        follow_redirect: true
        auto_calibration: true
      log-stdout: true
      continue-on-error: true
    - task: feroxbuster
      name: feroxbuster-fuzz
      with:
        target: '{{ inputs.target }}'
        wordlist: '{{ inputs.wordlist }}'
        depth: 2
        threads: 50
      log-stdout: true
      continue-on-error: true
    - name: collect-urls
      script: "import json\n\nurls = set()\nfor step_idx in [0, 1]:\n    step_data\
        \ = {{ steps | tojson }}\n    typed = step_data[step_idx].get('outputs', {}).get('typed_outputs',\
        \ [])\n    for item in typed:\n        if item.get('_type') == 'url':\n  \
        \          urls.add(item['url'])\n\nwith open('{{ env.OFX_OUTPUTS }}', 'a')\
        \ as f:\n    f.write(f\"fuzzed_urls={chr(10).join(sorted(urls))}\\n\")\n \
        \   f.write(f\"fuzz_count={len(urls)}\\n\")\n\nprint(f\"Found {len(urls)}\
        \ unique URLs via fuzzing\")\n"
  probe:
    name: Probe Fuzzed URLs
    needs:
    - fuzz
    steps:
    - task: httpx
      name: probe-fuzzed
      with:
        target: '{{ jobs.fuzz.outputs.fuzzed_urls }}'
        tech_detect: true
        status_code: true
        title: true
      log-stdout: true
      continue-on-error: true
  secrets:
    name: Secret Hunting
    needs:
    - probe
    steps:
    - task: trufflehog
      name: hunt-secrets
      with:
        target: '{{ inputs.target }}'
        mode: filesystem
      log-stdout: true
      continue-on-error: true
    - name: summary
      run: 'echo "================================="

        echo " URL Fuzz: {{ inputs.target }}"

        echo "================================="

        echo "Fuzzed URLs: {{ jobs.fuzz.outputs.fuzz_count }}"

        '
      log-stdout: true
