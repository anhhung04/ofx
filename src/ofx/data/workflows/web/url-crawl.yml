name: url-crawl
description: 'URL crawl — discovers URLs from a target using active crawlers (katana, gospider) and passive sources (gau). Probes discovered URLs and optionally hunts for secrets.

  '
tags:
- http
- crawl
- secrets
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target URL (e.g. https://example.com)
      alias: t
jobs:
  crawl:
    name: URL Crawling
    outputs:
      crawled_file: '{{ steps["collect-urls"].outputs.crawled_file | default("", true) }}'
      url_count: '{{ steps["collect-urls"].outputs.url_count | default("", true) }}'
    steps:
    - task: katana
      timeout: 15
      name: katana-crawl
      with:
        target: '{{ inputs.target }}'
        depth: 3
      continue-on-error: true
    - task: gospider
      timeout: 15
      name: gospider-crawl
      with:
        target: '{{ inputs.target }}'
        depth: 2
      continue-on-error: true
    - task: gau
      timeout: 10
      name: gau-passive
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: collect-urls
      script: |
        import json
        from urllib.parse import urlparse

        urls = set()
        for step_idx in [0, 1, 2]:
            step_data = {{ steps | tojson }}
            typed = step_data.get(str(step_idx), {}).get('outputs', {}).get('typed_outputs', [])
            for item in typed:
                if item.get('_type') == 'url':
                    urls.add(item['url'])

        with open('/tmp/ofx_urlcrawl_urls.txt', 'w') as tf:
            tf.write('\n'.join(sorted(urls)))

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"crawled_file=/tmp/ofx_urlcrawl_urls.txt\n")
            f.write(f"url_count={len(urls)}\n")

        print(f"Crawled {len(urls)} unique URLs")
  probe:
    name: HTTP Probe
    needs:
    - crawl
    outputs:
      live_urls: '{{ steps["export-live"].outputs.live_urls | default("", true) }}'
      live_count: '{{ steps["export-live"].outputs.live_count | default("", true) }}'
    steps:
    - task: httpx
      timeout: 10
      name: probe-urls
      with:
        target: '{{ jobs.crawl.outputs.crawled_file }}'
        tech_detect: true
        status_code: true
        title: true
      continue-on-error: true
    - name: export-live
      script: |
        typed = {{ steps["probe-urls"].outputs.typed_outputs | default([], true) | tojson }}
        live = []
        for item in typed:
            if item.get("_type") == "url" and item.get("status_code", 0) > 0:
                live.append(item["url"])
        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write('live_urls=' + '\n'.join(sorted(set(live))) + '\n')
        count = sum(1 for item in typed if item.get("_type") == "url" and item.get("status_code", 0) > 0)
        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write('live_count=' + str(count) + '\n')
  secrets:
    name: Secret Hunting
    needs:
    - probe
    steps:
    - task: trufflehog
      timeout: 15
      name: hunt-secrets
      with:
        target: '{{ inputs.target }}'
        mode: filesystem
      continue-on-error: true
    - task: cariddi
      timeout: 10
      name: cariddi-crawl
      with:
        target: '{{ inputs.target }}'
        secrets: true
        errors: true
        info: true
        depth: 2
      continue-on-error: true
    - name: summary
      run: |
        echo "================================="
        echo " URL Crawl: {{ inputs.target }}"
        echo "================================="
        echo "URLs crawled: {{ jobs.crawl.outputs.url_count }}"
        echo "Live URLs: {{ jobs.probe.outputs.live_count }}"
      log-stdout: true

    - name: export-to-project
      script: |
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:
            all_typed = []
            for typed in [
            {{ jobs['crawl'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['probe'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['secrets'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true