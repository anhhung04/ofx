name: url-crawl
description:
  "URL crawl — discovers URLs from a target using active crawlers (katana, gospider) and passive sources (gau). Probes discovered URLs and optionally hunts for secrets.

  "
tags:
  - http
  - crawl
  - secrets
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Target URL (e.g. https://example.com)
      alias: t
jobs:
  crawl:
    name: URL Crawling
    outputs:
      crawled_file: '{{ steps["collect-urls"].outputs.crawled_file | default("", true) }}'
      url_count: '{{ steps["collect-urls"].outputs.url_count | default("", true) }}'
    steps:
      - task: katana
        log-command: "{{ inputs.log_command | default(true) }}"
        name: katana-crawl
        with:
          target: "{{ inputs.target }}"
          depth: 3
          js_crawl: true
          known_files: all
        continue-on-error: true
      - task: gau
        log-command: "{{ inputs.log_command | default(true) }}"
        name: gau-passive
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      - name: collect-urls
        script: |
          from urllib.parse import urlparse

          urls = set()
          for step_name in ["katana-crawl", "gau-passive"]:
              step_data = {{ steps | tojson }}
              typed = step_data.get(step_name, {}).get('outputs', {}).get('typed_outputs', [])
              for item in typed:
                  if item.get('_type') == 'url':
                      urls.add(item['url'])

          add_outputs(crawled_urls='\n'.join(sorted(urls)), url_count=len(urls))
          print(f"Crawled {len(urls)} unique URLs")
  probe:
    name: HTTP Probe
    needs:
      - crawl
    outputs:
      live_urls: '{{ steps["export-live"].outputs.live_urls | default("", true) }}'
      live_count: '{{ steps["export-live"].outputs.live_count | default("", true) }}'
    steps:
      - task: httpx
        log-command: "{{ inputs.log_command | default(true) }}"
        name: probe-urls
        with:
          target: "{{ jobs.crawl.outputs.crawled_file }}"
          tech_detect: true
          status_code: true
          title: true
        continue-on-error: true
      - name: export-live
        script: |
          typed = {{ steps["probe-urls"].outputs.typed_outputs | default([], true) | tojson }}
          live = []
          for item in typed:
              if item.get("_type") == "url" and item.get("status_code", 0) > 0:
                  live.append(item["url"])
          add_outputs(live_urls='\n'.join(sorted(set(live))))
          count = sum(1 for item in typed if item.get("_type") == "url" and item.get("status_code", 0) > 0)
          add_outputs(live_count=count)
  secrets:
    name: Secret Hunting
    needs:
      - probe
    steps:
      - task: nuclei
        log-command: "{{ inputs.log_command | default(true) }}"
        name: hunt-secrets
        with:
          target: "{{ inputs.target }}"
          tags: exposure,token,secret
        continue-on-error: true
      - task: cariddi
        log-command: "{{ inputs.log_command | default(true) }}"
        name: cariddi-crawl
        with:
          target: "{{ inputs.target }}"
          secrets: true
          errors: true
          info: true
          depth: 2
        continue-on-error: true
      - name: summary
        run: |
          echo "================================="
          echo " URL Crawl: {{ inputs.target }}"
          echo "================================="
          echo "URLs crawled: {{ jobs.crawl.outputs.url_count }}"
          echo "Live URLs: {{ jobs.probe.outputs.live_count }}"
        log-stdout: "{{ inputs.log_output | default(true) }}"

      - name: export-to-project
        script: |
          from pathlib import Path

          project = '{{ vars.project_path | default("", true) }}'
          if not project:
              print('No --project set, skipping file export')
          else:
              all_typed = []
              for typed in [
              {{ jobs['crawl'].outputs.typed_outputs | default([], true) | tojson }},
              {{ jobs['probe'].outputs.typed_outputs | default([], true) | tojson }},
              {{ jobs['secrets'].outputs.typed_outputs | default([], true) | tojson }},
              ]:
                  all_typed.extend(typed)
              summaries = export_typed_outputs(project, all_typed)
              for s in summaries:
                  print(s)

              print(f'Project export complete: {project}')
        continue-on-error: true
