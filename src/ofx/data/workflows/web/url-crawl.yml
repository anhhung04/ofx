# yaml-language-server: $schema=~/.ofx/workflow_schema.json
name: url-crawl
description: 'URL crawl — discovers URLs from a target using active crawlers (katana,
  gospider) and passive sources (gau). Probes discovered URLs and optionally hunts
  for secrets.

  '
tags:
- http
- crawl
- secrets
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target URL (e.g. https://example.com)
jobs:
  crawl:
    name: URL Crawling
    steps:
    - task: katana
      name: katana-crawl
      with:
        target: '{{ inputs.target }}'
        depth: 3
      log-stdout: true
    - task: gospider
      name: gospider-crawl
      with:
        target: '{{ inputs.target }}'
        depth: 2
      log-stdout: true
    - task: gau
      name: gau-passive
      with:
        target: '{{ inputs.target }}'
    - name: collect-urls
      script: "import json\nfrom urllib.parse import urlparse\n\nurls = set()\nfor\
        \ step_idx in [0, 1, 2]:\n    step_data = {{ steps | tojson }}\n    typed\
        \ = step_data[step_idx].get('outputs', {}).get('typed_outputs', [])\n    for\
        \ item in typed:\n        if item.get('_type') == 'url':\n            urls.add(item['url'])\n\
        \nwith open('{{ env.OFX_OUTPUTS }}', 'a') as f:\n    f.write(f\"crawled_urls={chr(10).join(sorted(urls))}\\\
        n\")\n    f.write(f\"url_count={len(urls)}\\n\")\n\nprint(f\"Crawled {len(urls)}\
        \ unique URLs\")\n"
  probe:
    name: HTTP Probe
    needs:
    - crawl
    steps:
    - task: httpx
      name: probe-urls
      with:
        target: '{{ jobs.crawl.outputs.crawled_urls }}'
        tech_detect: true
        status_code: true
        title: true
      log-stdout: true
    - name: export-live
      run: 'echo "live_urls={{ urls(steps[0].outputs.typed_outputs) | selectattr(''status_code'',
        ''gt'', 0) | map(attribute=''url'') | unique | join(''\n'') }}" >> $OFX_OUTPUTS

        echo "live_count={{ urls(steps[0].outputs.typed_outputs) | selectattr(''status_code'',
        ''gt'', 0) | list | length }}" >> $OFX_OUTPUTS

        '
      log-stdout: true
  secrets:
    name: Secret Hunting
    needs:
    - probe
    steps:
    - task: trufflehog
      name: hunt-secrets
      with:
        target: '{{ inputs.target }}'
        mode: filesystem
      log-stdout: true
    - task: cariddi
      name: cariddi-crawl
      with:
        target: '{{ inputs.target }}'
        secrets: true
        errors: true
        info: true
        depth: 2
      continue-on-error: true
    - name: summary
      run: 'echo "================================="

        echo " URL Crawl: {{ inputs.target }}"

        echo "================================="

        echo "URLs crawled: {{ jobs.crawl.outputs.url_count }}"

        echo "Live URLs: {{ jobs.probe.outputs.live_count }}"

        '
      log-stdout: true
