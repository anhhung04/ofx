name: sqli-scan
description: >
  SQL injection scanning — tests target URL for SQL injection vulnerabilities with multiple techniques.
tags:
- web
- vuln
- sqli
- injection
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Target URL with parameter (e.g. https://example.com/page?id=1)
      alias: t
    level:
      type: string
      default: '3'
      description: Injection test level (1-5)
    risk:
      type: string
      default: '2'
      description: Risk level (1-3)
jobs:
  sqli-scan:
    name: SQL Injection Scan
    outputs:
      vulnerable: '{{ steps["collect-findings"].outputs.vulnerable | default("", true) }}'
      injection_types_file: '{{ steps["collect-findings"].outputs.injection_types_file | default("", true) }}'
      finding_count: '{{ steps["collect-findings"].outputs.finding_count | default("", true) }}'
      db_count: '{{ steps["collect-findings"].outputs.db_count | default("", true) }}'
    steps:
    - task: sqlmap
      log-command: "{{ inputs.log_command | default(true) }}"
      name: sqlmap-scan
      with:
        target: '{{ inputs.target }}'
        level: '{{ inputs.level }}'
        risk: '{{ inputs.risk }}'
        threads: 5
      continue-on-error: true
    - name: collect-findings
      script: |
        sqlmap_vulns = {{ vulns(steps["sqlmap-scan"].outputs.typed_outputs) | default([], true) | tojson }}

        vulnerable = len(sqlmap_vulns) > 0
        findings = []
        for v in sqlmap_vulns:
            name = v.get('name', v.get('matched_at', 'unknown'))
            findings.append(name)

        add_outputs(vulnerable='true' if vulnerable else 'false', injection_types='\n'.join(findings), finding_count=len(findings), db_count=len(sqlmap_vulns))
        status = "VULNERABLE" if vulnerable else "Not vulnerable"
        print(f"Target is: {status}")
        print(f"Injection types found: {len(findings)}")
  summary:
    name: SQLi Summary
    needs:
    - sqli-scan
    steps:
    - name: report
      run: |
        echo "======================================="
        echo " SQLi Scan: {{ inputs.target }}"
        echo "======================================="
        echo "Level: {{ inputs.level }} | Risk: {{ inputs.risk }}"
        echo "Vulnerable: {{ jobs['sqli-scan'].outputs.vulnerable }}"
        echo "Injection types: {{ jobs['sqli-scan'].outputs.finding_count }}"
        echo "Databases found: {{ jobs['sqli-scan'].outputs.db_count }}"
      log-stdout: "{{ inputs.log_output | default(true) }}"
