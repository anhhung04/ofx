name: api-security-audit
description: |
  Comprehensive API security audit — GraphQL fingerprinting, endpoint
  brute-force discovery, OpenAPI schema testing, and API security checks.
  Chains kiterunner, graphw00f, schemathesis, and cherrybomb.
tags: [web, api, security, audit]
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: API base URL (e.g. https://api.target.com)
      alias: t
    schema:
      type: string
      default: ""
      description: OpenAPI/Swagger spec URL or file path
    wordlist:
      type: string
      default: ""
      description: Custom API endpoint wordlist for kiterunner

jobs:
  graphql-fingerprint:
    name: GraphQL Fingerprint
    outputs:
      finding_count: '{{ steps["graphql-detect"].outputs.finding_count | default("", true) }}'
      typed_outputs: '{{ steps["graphql-detect"].outputs.typed_outputs | default([], true) }}'
    steps:
      - task: graphw00f
        log-command: true
        timeout: 5
        name: graphql-detect
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true

  endpoint-discovery:
    name: API Endpoint Discovery
    run_if: "{{ inputs.wordlist }}"
    outputs:
      finding_count: '{{ steps["brute-endpoints"].outputs.finding_count | default("", true) }}'
      typed_outputs: '{{ steps["brute-endpoints"].outputs.typed_outputs | default([], true) }}'
    steps:
      - task: kiterunner
        log-command: true
        timeout: 20
        name: brute-endpoints
        with:
          target: "{{ inputs.target }}"
          wordlist: "{{ inputs.wordlist }}"
        continue-on-error: true

  schema-test:
    name: OpenAPI Schema Testing
    needs: [graphql-fingerprint]
    run_if: "{{ inputs.schema }}"
    outputs:
      finding_count: '{{ steps["schema-fuzz"].outputs.finding_count | default("", true) }}'
      typed_outputs: '{{ steps["schema-fuzz"].outputs.typed_outputs | default([], true) }}'
    steps:
      - task: schemathesis
        log-command: true
        timeout: 30
        name: schema-fuzz
        with:
          target: "{{ inputs.schema }}"
          base_url: "{{ inputs.target }}"
          checks: all
          validate_schema: true
        continue-on-error: true

  api-check:
    name: API Security Check
    needs: [schema-test]
    run_if: "{{ inputs.schema }}"
    outputs:
      finding_count: '{{ steps["cherrybomb-scan"].outputs.finding_count | default("", true) }}'
      typed_outputs: '{{ steps["cherrybomb-scan"].outputs.typed_outputs | default([], true) }}'
    steps:
      - task: cherrybomb
        log-command: true
        timeout: 15
        name: cherrybomb-scan
        with:
          target: "{{ inputs.schema }}"
        continue-on-error: true

  summary:
    name: API Security Audit Summary
    needs: [graphql-fingerprint, endpoint-discovery, schema-test, api-check]
    steps:
      - name: report
        script: |
          gql_count = '{{ jobs["graphql-fingerprint"].outputs.finding_count | default("0", true) }}'
          ep_count = '{{ jobs["endpoint-discovery"].outputs.finding_count | default("0", true) }}'
          schema_count = '{{ jobs["schema-test"].outputs.finding_count | default("0", true) }}'
          api_count = '{{ jobs["api-check"].outputs.finding_count | default("0", true) }}'

          print("=" * 56)
          print(" API SECURITY AUDIT COMPLETE: {{ inputs.target }}")
          print("=" * 56)
          print()
          print("--- GraphQL Fingerprint ---")
          print(f"  Findings: {gql_count}")
          print()
          print("--- Endpoint Discovery (kiterunner) ---")
          if '{{ inputs.wordlist }}':
              print(f"  Endpoints found: {ep_count}")
          else:
              print("  Skipped (no wordlist provided)")
          print()
          print("--- Schema Testing (schemathesis) ---")
          if '{{ inputs.schema }}':
              print(f"  Issues found: {schema_count}")
          else:
              print("  Skipped (no schema provided)")
          print()
          print("--- API Security Check (cherrybomb) ---")
          if '{{ inputs.schema }}':
              print(f"  Vulnerabilities: {api_count}")
          else:
              print("  Skipped (no schema provided)")
        log-stdout: true
