name: jwt-audit
description: 'JWT security audit — analyzes JWT tokens for vulnerabilities including algorithm confusion, weak secrets, signature bypass, and claim manipulation.

  '
tags:
- web
- vuln
- jwt
- auth
- token
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    token:
      required: true
      type: string
      description: JWT token to analyze
    target_url:
      type: string
      default: ''
      description: URL to test forged tokens against
jobs:
  token-analysis:
    name: JWT Token Analysis
    outputs:
      jwt_algorithm: '{{ steps["collect-token-info"].outputs.jwt_algorithm | default("", true) }}'
      jwt_claims: '{{ steps["collect-token-info"].outputs.jwt_claims | default("", true) }}'
      jwt_claim_count: '{{ steps["collect-token-info"].outputs.jwt_claim_count | default("", true) }}'
      jwt_subject: '{{ steps["collect-token-info"].outputs.jwt_subject | default("", true) }}'
      jwt_issuer: '{{ steps["collect-token-info"].outputs.jwt_issuer | default("", true) }}'
      jwt_expiry: '{{ steps["collect-token-info"].outputs.jwt_expiry | default("", true) }}'
    steps:
    - task: jwt_tool
      log-command: "{{ inputs.log_command | default(true) }}"
      name: jwt-decode
      with:
        target: '{{ inputs.token }}'
      continue-on-error: true
    - name: collect-token-info
      script: |
        import re
        import json
        import base64

        token = '{{ inputs.token }}'
        parts = token.split('.')

        header = {}
        payload = {}

        try:
            # Decode header
            header_b64 = parts[0] + '=' * (4 - len(parts[0]) % 4)
            header = json.loads(base64.urlsafe_b64decode(header_b64))
        except Exception:
            pass

        try:
            # Decode payload
            payload_b64 = parts[1] + '=' * (4 - len(parts[1]) % 4)
            payload = json.loads(base64.urlsafe_b64decode(payload_b64))
        except Exception:
            pass

        alg = header.get('alg', 'unknown')
        claims = list(payload.keys())

        if payload.get('sub'):
        if payload.get('iss'):
        if payload.get('exp'):
        add_outputs(jwt_algorithm=alg, jwt_claims=','.join(claims), jwt_claim_count=len(claims), jwt_subject=payload['sub'], jwt_issuer=payload['iss'], jwt_expiry=payload['exp'])
        print(f"Algorithm: {alg}")
        print(f"Claims: {', '.join(claims)}")
        print(f"Header: {json.dumps(header, indent=2)}")
  vuln-scan:
    name: JWT Vulnerability Scan
    outputs:
      jwt_vuln_count: '{{ steps["collect-vulns"].outputs.jwt_vuln_count | default("", true) }}'
      jwt_vulns_file: '{{ steps["collect-vulns"].outputs.jwt_vulns_file | default("", true) }}'
    steps:
    - task: jwt_tool
      log-command: "{{ inputs.log_command | default(true) }}"
      name: jwt-all-tests
      with:
        target: '{{ inputs.token }}'
        mode: at
        target_url: '{{ inputs.target_url }}'
      continue-on-error: true
    - name: collect-vulns
      script: |
        jwt_vulns = {{ vulns(steps["jwt-all-tests"].outputs.typed_outputs) | default([], true) | tojson }}

        with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_jwtaudit_vulns.txt', 'w') as tf:
            findings = []
            for v in jwt_vulns:
                findings.append(v.get('name', 'unknown'))
            tf.write('\n'.join(findings))

        add_outputs(jwt_vuln_count=len(jwt_vulns), jwt_vulns_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_jwtaudit_vulns.txt")
        print(f"JWT vulnerabilities found: {len(jwt_vulns)}")
        for v in jwt_vulns:
            print(f"  [!] {v.get('name', 'unknown')}")
  summary:
    name: JWT Audit Summary
    needs:
    - token-analysis
    - vuln-scan
    steps:
    - name: report
      run: |
        echo "======================================================"
        echo " JWT SECURITY AUDIT COMPLETE"
        echo "======================================================"
        echo ""
        echo "--- Token Info ---"
        echo "Algorithm: {{ jobs['token-analysis'].outputs.jwt_algorithm }}"
        echo "Claims: {{ jobs['token-analysis'].outputs.jwt_claims }}"
        echo "Claim count: {{ jobs['token-analysis'].outputs.jwt_claim_count }}"
        echo ""
        echo "--- Vulnerabilities ---"
        echo "Findings: {{ jobs['vuln-scan'].outputs.jwt_vuln_count }}"
      log-stdout: "{{ inputs.log_output | default(true) }}"
