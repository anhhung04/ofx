# yaml-language-server: $schema=~/.ofx/workflow_schema.json
name: jwt-audit
description: 'JWT security audit — analyzes JWT tokens for vulnerabilities including algorithm confusion, weak secrets, signature bypass, and claim manipulation.

  '
tags:
- web
- vuln
- jwt
- auth
- token
dispatch:
  inputs:
    token:
      required: true
      type: string
      description: JWT token to analyze
    target_url:
      type: string
      default: ''
      description: URL to test forged tokens against
jobs:
  token-analysis:
    name: JWT Token Analysis
    outputs:
      jwt_algorithm: '${{ steps.collect-token-info.outputs.jwt_algorithm }}'
      jwt_claims: '${{ steps.collect-token-info.outputs.jwt_claims }}'
      jwt_claim_count: '${{ steps.collect-token-info.outputs.jwt_claim_count }}'
      jwt_subject: '${{ steps.collect-token-info.outputs.jwt_subject }}'
      jwt_issuer: '${{ steps.collect-token-info.outputs.jwt_issuer }}'
      jwt_expiry: '${{ steps.collect-token-info.outputs.jwt_expiry }}'
    steps:
    - name: jwt-decode
      run: |
        jwt_tool '{{ inputs.token }}' 2>/dev/null | tee /tmp/jwt-decode.txt
      continue-on-error: true
    - name: collect-token-info
      script: |
        import re
        import json
        import base64

        token = '{{ inputs.token }}'
        parts = token.split('.')

        header = {}
        payload = {}

        try:
            # Decode header
            header_b64 = parts[0] + '=' * (4 - len(parts[0]) % 4)
            header = json.loads(base64.urlsafe_b64decode(header_b64))
        except Exception:
            pass

        try:
            # Decode payload
            payload_b64 = parts[1] + '=' * (4 - len(parts[1]) % 4)
            payload = json.loads(base64.urlsafe_b64decode(payload_b64))
        except Exception:
            pass

        alg = header.get('alg', 'unknown')
        claims = list(payload.keys())

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"jwt_algorithm={alg}\n")
            f.write(f"jwt_claims={','.join(claims)}\n")
            f.write(f"jwt_claim_count={len(claims)}\n")
            if payload.get('sub'):
                f.write(f"jwt_subject={payload['sub']}\n")
            if payload.get('iss'):
                f.write(f"jwt_issuer={payload['iss']}\n")
            if payload.get('exp'):
                f.write(f"jwt_expiry={payload['exp']}\n")

        print(f"Algorithm: {alg}")
        print(f"Claims: {', '.join(claims)}")
        print(f"Header: {json.dumps(header, indent=2)}")
  vuln-scan:
    name: JWT Vulnerability Scan
    outputs:
      jwt_vuln_count: '${{ steps.collect-vulns.outputs.jwt_vuln_count }}'
      jwt_vulns_file: '${{ steps.collect-vulns.outputs.jwt_vulns_file }}'
    steps:
    - name: jwt-all-tests
      run: |
        jwt_tool '{{ inputs.token }}' -M at {{ '-t ' + inputs.target_url if inputs.target_url else '' }} 2>/dev/null | tee /tmp/jwt-vulns.txt
      continue-on-error: true
    - name: collect-vulns
      script: |
        import re

        vulns = []
        try:
            with open('/tmp/jwt-vulns.txt') as f:
                for line in f:
                    if '[+]' in line or 'VULNERABLE' in line.upper():
                        vulns.append(line.strip())
        except FileNotFoundError:
            pass

        with open('/tmp/ofx_jwtaudit_vulns.txt', 'w') as tf:
            tf.write('\n'.join(vulns))

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"jwt_vuln_count={len(vulns)}\n")
            f.write(f"jwt_vulns_file=/tmp/ofx_jwtaudit_vulns.txt\n")

        print(f"JWT vulnerabilities found: {len(vulns)}")
        for v in vulns:
            print(f"  [!] {v}")
  summary:
    name: JWT Audit Summary
    needs:
    - token-analysis
    - vuln-scan
    steps:
    - name: report
      run: |
        echo "======================================================"
        echo " JWT SECURITY AUDIT COMPLETE"
        echo "======================================================"
        echo ""
        echo "--- Token Info ---"
        echo "Algorithm: {{ jobs['token-analysis'].outputs.jwt_algorithm }}"
        echo "Claims: {{ jobs['token-analysis'].outputs.jwt_claims }}"
        echo "Claim count: {{ jobs['token-analysis'].outputs.jwt_claim_count }}"
        echo ""
        echo "--- Vulnerabilities ---"
        echo "Findings: {{ jobs['vuln-scan'].outputs.jwt_vuln_count }}"
      log-stdout: true
