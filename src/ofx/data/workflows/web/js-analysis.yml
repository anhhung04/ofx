name: js-analysis
description: |
  JavaScript endpoint and secret extraction — crawls target for JS files,
  analyzes them for exposed secrets, tokens, API keys, and sensitive endpoints.
tags:
  - web
  - js
  - secrets
  - recon

dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target URL or domain (e.g. https://example.com)
      alias: t

jobs:
  discover-js:
    name: JS File Discovery
    outputs:
      js_file: '{{ steps["extract-js-urls"].outputs.js_file | default("", true) }}'
      all_urls_file: '{{ steps["extract-js-urls"].outputs.all_urls_file | default("", true) }}'
      js_count: '{{ steps["extract-js-urls"].outputs.js_count | default("", true) }}'
      url_count: '{{ steps["extract-js-urls"].outputs.url_count | default("", true) }}'
    steps:
      - task: katana
        log-command: true
        name: katana-js-crawl
        with:
          target: '{{ inputs.target }}'
          depth: 3
          js_crawl: true
        continue-on-error: true

      - task: httpx
        log-command: true
        name: httpx-probe
        with:
          target: '{{ inputs.target }}'
          tech_detect: true
          status_code: true
        continue-on-error: true

      - task: gau
        log-command: true
        name: gau-archive
        with:
          target: '{{ inputs.target }}'
        continue-on-error: true

      - name: extract-js-urls
        script: |
          import json

          js_urls = set()
          all_urls = set()

          # From katana
          katana_out = {{ steps["katana-js-crawl"].outputs.typed_outputs | tojson }}
          for item in katana_out:
              if item.get('_type') == 'url':
                  url = item.get('url', '')
                  if url:
                      all_urls.add(url)
                      if url.endswith('.js') or '.js?' in url or '/js/' in url:
                          js_urls.add(url)

          # From gau
          gau_out = {{ steps["gau-archive"].outputs.typed_outputs | tojson }}
          for item in gau_out:
              if item.get('_type') == 'url':
                  url = item.get('url', '')
                  if url:
                      all_urls.add(url)
                      if url.endswith('.js') or '.js?' in url or '/js/' in url:
                          js_urls.add(url)

          with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_jsanalysis_jsurls.txt', 'w') as f:
              f.write('\n'.join(sorted(js_urls)))
          with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_jsanalysis_allurls.txt', 'w') as f:
              f.write('\n'.join(sorted(all_urls)))

          add_outputs(js_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_jsanalysis_jsurls.txt", all_urls_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_jsanalysis_allurls.txt", js_count=len(js_urls), url_count=len(all_urls))
          print(f"Found {len(js_urls)} JS files from {len(all_urls)} total URLs")

  analyze-js:
    name: JS Security Analysis
    needs:
      - discover-js
    outputs:
      secret_count: '{{ steps["js-summary"].outputs.secret_count | default("", true) }}'
      vuln_count: '{{ steps["js-summary"].outputs.vuln_count | default("", true) }}'
      critical_count: '{{ steps["js-summary"].outputs.critical_count | default("", true) }}'
      high_count: '{{ steps["js-summary"].outputs.high_count | default("", true) }}'
    steps:
      - task: nuclei
        log-command: true
        name: nuclei-exposure
        with:
          target: "{{ jobs['discover-js'].outputs.js_file | default(inputs.target, true) }}"
          tags: exposure,token,secret
        continue-on-error: true

      - name: js-summary
        script: |
          import json

          nuclei_vulns = {{ vulns(steps["nuclei-exposure"].outputs.typed_outputs) | tojson }}
          nuclei_tags = {{ tags(steps["nuclei-exposure"].outputs.typed_outputs) | tojson }}

          total_secrets = len(nuclei_tags)
          total_vulns = len(nuclei_vulns)

          critical = [v for v in nuclei_vulns if v.get('severity') == 'critical']
          high = [v for v in nuclei_vulns if v.get('severity') == 'high']

          add_outputs(secret_count=total_secrets, vuln_count=total_vulns, critical_count=len(critical), high_count=len(high))
          print("=" * 50)
          print(f" JS ANALYSIS COMPLETE: {{ inputs.target }}")
          print("=" * 50)
          print(f"JS files analyzed: {{ jobs['discover-js'].outputs.js_count }}")
          print(f"Secrets/exposures found: {total_secrets}")
          print(f"Vulnerabilities: {total_vulns}")
          print(f"  Critical: {len(critical)}")
          print(f"  High: {len(high)}")
        log-stdout: true

      - name: export-to-project
        script: |
          from pathlib import Path

          project = '{{ vars.project_path | default("", true) }}'
          if not project:
              print('No --project set, skipping file export')
          else:
              all_typed = []
              for typed in [
                  {{ jobs['discover-js'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['analyze-js'].outputs.typed_outputs | default([], true) | tojson }},
              ]:
                  all_typed.extend(typed)
              summaries = export_typed_outputs(project, all_typed)
              for s in summaries:
                  print(s)

              print(f'Project export complete: {project}')
        continue-on-error: true
