name: export-results
description: Export scan findings to JSON, CSV, or Markdown reports for documentation.
tags:
- utility
- export
- report
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Directory containing scan output files
      alias: t
    format:
      type: string
      default: markdown
      description: 'Export format: markdown, json, csv'
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  export:
    name: Export Results
    outputs:
      report_path: '{{ steps[''generate-report''].outputs.report_path }}'
      file_count: '{{ steps[''generate-report''].outputs.file_count }}'
    steps:
    - name: generate-report
      module: local.export_results
