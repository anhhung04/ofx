name: extract-iocs
description: Extract IOCs from scan results — IPs, domains, URLs, hashes, and email
  addresses.
tags:
- utility
- ioc
- extract
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: File or directory of scan results
      alias: t
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  extract:
    name: Extract IOCs
    outputs:
      files: '{{ steps[''extract-iocs''].outputs.files }}'
      counts: '{{ steps[''extract-iocs''].outputs.counts }}'
      total: '{{ steps[''extract-iocs''].outputs.total }}'
    steps:
    - name: extract-iocs
      module: local.extract_iocs
