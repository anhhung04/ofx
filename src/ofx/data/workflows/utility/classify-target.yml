name: classify-target
description: Target classification — detect whether targets are domains, subdomains,
  CIDR ranges, IPs, or URLs and split them into typed lists for downstream workflows.
tags:
- utility
- target
- classify
- scope
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Single target or path to a file with mixed targets
      alias: t
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  classify:
    name: Classify Targets
    outputs:
      target_type: '{{ steps.classify.outputs.target_type }}'
      counts: '{{ steps.classify.outputs.counts }}'
    steps:
    - name: classify
      module: modules/classify.py::run
