name: parse-targets
description: Parse and aggregate targets — normalize IPs, CIDRs, domains, and URLs
  from input sources into clean target lists.
tags:
- utility
- parse
- target
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Input file with mixed targets
      alias: t
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  parse:
    name: Parse Targets
    outputs:
      target_files: '{{ steps.parse.outputs.target_files }}'
      counts: '{{ steps.parse.outputs.counts }}'
    steps:
    - name: parse
      module: local.parse_targets
