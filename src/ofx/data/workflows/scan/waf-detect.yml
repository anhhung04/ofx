name: waf-detect
description: WAF/CDN detection — fingerprint WAF and CDN providers in front of targets
  and produce a filtered target list so protected hosts are skipped by aggressive
  scans. Reports detection_available=false (and an empty clean list) when a
  detector produced no results instead of treating targets as clean.
tags:
- scan
- waf
- cdn
- detect
- opsec
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Host/URL or file of targets to check
      alias: t
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
call:
  inputs:
    target:
      required: true
      type: string
      description: Host/URL or file of targets to check
      alias: t
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
    output_dir:
      type: string
      default: '{{ env.OFX_RUN_DIR }}'
      description: Directory for generated artifacts
  outputs:
    clean_targets: "{{ jobs.detect.outputs.clean_targets }}"
    clean_count: "{{ jobs.detect.outputs.clean_count }}"
    waf_count: "{{ jobs.detect.outputs.waf_count }}"
    cdn_count: "{{ jobs.detect.outputs.cdn_count }}"
    detection_available: "{{ jobs.detect.outputs.detection_available }}"
    detector_errors: "{{ jobs.detect.outputs.detector_errors }}"
jobs:
  detect:
    name: WAF/CDN Detection
    outputs:
      clean_targets: '{{ steps.split.outputs.clean_targets }}'
      clean_count: '{{ steps.split.outputs.clean_count }}'
      waf_count: '{{ steps.split.outputs.waf_count }}'
      cdn_count: '{{ steps.split.outputs.cdn_count }}'
      detection_available: '{{ steps.split.outputs.detection_available }}'
      detector_errors: '{{ steps.split.outputs.detector_errors }}'
    steps:
    - name: normalize
      module: local.normalize
      with:
        target: '{{ inputs.target }}'
        output_dir: '{{ inputs.output_dir or env.OFX_RUN_DIR }}'
    - name: cdncheck
      module: local.builtin.shell
      with:
        cmd: cdncheck -i {{ inputs.output_dir or env.OFX_RUN_DIR }}/waf_input.txt -cdn
          -waf -silent -resp -o {{ inputs.output_dir or env.OFX_RUN_DIR }}/cdncheck_results.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 60
    - name: wafw00f
      module: local.builtin.shell
      with:
        cmd: wafw00f -i {{ inputs.output_dir or env.OFX_RUN_DIR }}/waf_input.txt -f
          json -o {{ inputs.output_dir or env.OFX_RUN_DIR }}/wafw00f_results.json
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 60
    - name: split
      module: local.split
      with:
        output_dir: '{{ inputs.output_dir or env.OFX_RUN_DIR }}'
