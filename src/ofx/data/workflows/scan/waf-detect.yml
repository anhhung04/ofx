name: waf-detect
description: WAF/CDN detection — fingerprint WAF and CDN providers in front of targets
  and produce a filtered target list so protected hosts are skipped by aggressive scans.
tags:
- scan
- waf
- cdn
- detect
- opsec
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Host/URL or file of targets to check
      alias: t
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  detect:
    name: WAF/CDN Detection
    outputs:
      clean_targets: '{{ steps.split.outputs.clean_targets }}'
      waf_count: '{{ steps.split.outputs.waf_count }}'
      cdn_count: '{{ steps.split.outputs.cdn_count }}'
    steps:
    - name: normalize
      module: modules/normalize.py::run
    - name: cdncheck
      module: shell
      with:
        cmd: cdncheck -l {{ env.OFX_RUN_DIR }}/waf_input.txt -cdn -waf -silent -resp -o {{ env.OFX_RUN_DIR }}/cdncheck_results.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
    - name: wafw00f
      module: shell
      with:
        cmd: wafw00f -i {{ env.OFX_RUN_DIR }}/waf_input.txt -f json -o {{ env.OFX_RUN_DIR }}/wafw00f_results.json
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
    - name: split
      module: modules/split.py::run
