name: host-discovery
description: Host discovery — identify live hosts via ICMP ping sweep on a target
  CIDR range.
tags:
- scan
- host
- ping
- discovery
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target CIDR range (e.g. 10.0.0.0/24)
      alias: t
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  ping-sweep:
    name: Ping Sweep
    steps:
    - name: fping-sweep
      run: fping -a -g {{ inputs.target }} 2>&1 | tee {{ env.OFX_RUN_DIR }}/live_hosts.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
    - name: naabu-ping
      run: naabu -host {{ inputs.target }} -scan-type s -silent -o {{ env.OFX_RUN_DIR
        }}/live_hosts_naabu.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
    - name: merge-hosts
      script: "import os\n\nfiles = [\"live_hosts.txt\", \"live_hosts_naabu.txt\"\
        ]\nseen = set()\nrd = os.environ[\"OFX_RUN_DIR\"]\nfor fn in files:\n    fp\
        \ = os.path.join(rd, fn)\n    try:\n        with open(fp) as f:\n        \
        \    for line in f:\n                line = line.strip()\n               \
        \ if line and line not in seen:\n                    seen.add(line)\n    except\
        \ FileNotFoundError:\n        pass\n\nout = os.path.join(rd, \"all_live_hosts.txt\"\
        )\nwith open(out, \"w\") as f:\n    f.write(\"\\n\".join(sorted(seen)))\n\
        print(f\"Found {len(seen)} live hosts\")\nadd_outputs(host_count=len(seen),\
        \ host_file=out)"
