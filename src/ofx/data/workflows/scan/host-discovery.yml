name: host-discovery
description: Host discovery — identify live hosts via ICMP ping sweep on a target
  CIDR range.
tags:
- scan
- host
- ping
- discovery
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target CIDR range (e.g. 10.0.0.0/24)
      alias: t
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  ping-sweep:
    name: Ping Sweep
    steps:
    - name: fping-sweep
      module: local.builtin.shell
      with:
        cmd: fping -a -g {{ inputs.target }} 2>&1 | tee {{ env.OFX_RUN_DIR }}/live_hosts.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
    - name: naabu-ping
      module: local.builtin.shell
      with:
        cmd: naabu -host {{ inputs.target }} -scan-type s -silent -o {{ env.OFX_RUN_DIR
          }}/live_hosts_naabu.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
    - name: merge-hosts
      module: local.merge_hosts
