name: host-discovery
description: Host discovery — identify live hosts via ICMP ping sweep on a target
  CIDR range.
tags:
- scan
- host
- ping
- discovery
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target CIDR range (e.g. 10.0.0.0/24)
      alias: t
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
call:
  inputs:
    target:
      required: true
      type: string
      description: Target CIDR range (e.g. 10.0.0.0/24)
      alias: t
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
    output_dir:
      type: string
      default: '{{ env.OFX_RUN_DIR }}'
      description: Directory for generated artifacts
  outputs:
    host_file: "{{ jobs['ping-sweep'].outputs.host_file }}"
    host_count: "{{ jobs['ping-sweep'].outputs.host_count }}"
jobs:
  ping-sweep:
    name: Ping Sweep
    outputs:
      host_file: "{{ steps['merge-hosts'].outputs.host_file }}"
      host_count: "{{ steps['merge-hosts'].outputs.host_count }}"
    steps:
    - name: fping-sweep
      module: local.builtin.shell
      with:
        cmd: fping -a -g {{ inputs.target }} 2>&1 | tee {{ inputs.output_dir
          or env.OFX_RUN_DIR }}/live_hosts.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 30
    - name: naabu-ping
      module: local.builtin.shell
      with:
        cmd: naabu -host {{ inputs.target }} -scan-type s -silent -o {{ inputs.output_dir
          or env.OFX_RUN_DIR }}/live_hosts_naabu.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 30
    - name: merge-hosts
      module: local.merge_hosts
      with:
        output_dir: '{{ inputs.output_dir or env.OFX_RUN_DIR }}'
