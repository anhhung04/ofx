name: port-scan
description: Port scanning — discover open ports and services using fast SYN scan
  followed by targeted service detection.
tags:
- scan
- port
- nmap
- rustscan
- naabu
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target IP, CIDR, or host file
      alias: t
    ports:
      type: string
      default: top-1000
      description: Ports to scan (top-100, top-1000, 1-65535, or custom)
    rate:
      type: number
      default: 1000
      description: Packets per second for fast scanners
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  fast-scan:
    name: Fast Port Discovery
    steps:
    - name: naabu
      module: local.builtin.shell
      with:
        cmd: naabu -host {{ inputs.target }} -p {{ inputs.ports }} -rate {{ inputs.rate
          }} -silent -o {{ env.OFX_RUN_DIR }}/open_ports_naabu.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
    - name: rustscan
      module: local.builtin.shell
      with:
        cmd: rustscan -a {{ inputs.target }} --range {{ inputs.ports }} -b 500 --accessible
          --greppable 2>&1 | tee {{ env.OFX_RUN_DIR }}/open_ports_rustscan.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
  service-detect:
    name: Service Detection
    needs:
    - fast-scan
    steps:
    - name: nmap-svc
      module: local.builtin.shell
      with:
        cmd: nmap -iL {{ env.OFX_RUN_DIR }}/open_ports_naabu.txt -sV -sC -O -oA {{ env.OFX_RUN_DIR
          }}/nmap_scan --stylesheet https://raw.githubusercontent.com/honze-net/nmap-bootstrap-xsl/main/nmap-bootstrap.xsl
          2>&1
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 120
    - name: parse-nmap
      module: local.parse_nmap
