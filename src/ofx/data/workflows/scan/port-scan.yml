name: port-scan
description: Port scanning — fast port discovery with naabu/rustscan, then targeted
  nmap service detection on the discovered hosts and ports.
tags:
- scan
- port
- nmap
- rustscan
- naabu
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target IP, CIDR, or host file
      alias: t
    ports:
      type: string
      default: top-1000
      description: Ports to scan (top-100, top-1000, 1-65535, or custom)
    rate:
      type: number
      default: 1000
      description: Packets per second for fast scanners
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
call:
  inputs:
    target:
      required: true
      type: string
      description: Target IP, CIDR, or host file
      alias: t
    ports:
      type: string
      default: top-1000
      description: Ports to scan (top-100, top-1000, 1-65535, or custom)
    rate:
      type: number
      default: 1000
      description: Packets per second for fast scanners
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
    output_dir:
      type: string
      default: '{{ env.OFX_RUN_DIR }}'
      description: Directory for generated artifacts
  outputs:
    nmap_file: "{{ jobs['service-detect'].outputs.nmap_file }}"
    host_count: "{{ jobs['service-detect'].outputs.host_count }}"
    inventory: "{{ jobs['service-detect'].outputs.inventory }}"
    inventory_file: "{{ jobs['service-detect'].outputs.inventory_file }}"
jobs:
  fast-scan:
    name: Fast Port Discovery
    steps:
    - name: plan
      module: local.port_plan
      with:
        ports: '{{ inputs.ports }}'
    - name: naabu
      module: local.builtin.shell
      with:
        cmd: naabu -host {{ inputs.target }} {{ steps.plan.outputs.naabu_args }} -rate
          {{ inputs.rate }} -silent -o {{ inputs.output_dir or env.OFX_RUN_DIR
          }}/open_ports_naabu.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 30
    - name: rustscan
      module: local.builtin.shell
      with:
        cmd: rustscan -a {{ inputs.target }} {{ steps.plan.outputs.rustscan_args }} -b
          500 --accessible --greppable 2>&1 | tee {{ inputs.output_dir or env.OFX_RUN_DIR
          }}/open_ports_rustscan.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 30
  service-detect:
    name: Service Detection
    needs:
    - fast-scan
    outputs:
      nmap_file: "{{ steps['parse-nmap'].outputs.nmap_file }}"
      host_count: "{{ steps['parse-nmap'].outputs.host_count }}"
      inventory: "{{ steps['parse-nmap'].outputs.inventory }}"
      inventory_file: "{{ steps['parse-nmap'].outputs.inventory_file }}"
    steps:
    - name: collect
      module: local.naabu_report
      with:
        output_dir: '{{ inputs.output_dir or env.OFX_RUN_DIR }}'
    - name: nmap-svc
      module: local.builtin.shell
      with:
        cmd: nmap -iL {{ steps.collect.outputs.nmap_hosts }} -p {{ steps.collect.outputs.open_ports
          }} -sV -sC -O -oA {{ inputs.output_dir or env.OFX_RUN_DIR }}/nmap_scan --stylesheet
          https://raw.githubusercontent.com/honze-net/nmap-bootstrap-xsl/main/nmap-bootstrap.xsl
          2>&1
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 120
    - name: parse-nmap
      module: local.parse_nmap
      with:
        output_dir: '{{ inputs.output_dir or env.OFX_RUN_DIR }}'
