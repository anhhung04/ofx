name: dir-fuzz
description: Directory fuzzing — brute force web directories and files. WAF/CDN-protected
  targets are detected up front and skipped to avoid noise and bans.
tags:
- scan
- fuzz
- web
- directory
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: File of base URLs to fuzz (or single URL)
      alias: t
    wordlist:
      type: string
      default: /usr/share/seclists/Discovery/Web-Content/common.txt
      description: Web content wordlist
    extensions:
      type: string
      default: php,html,txt,json
      description: File extensions to append
    force:
      type: string
      default: 'false'
      description: Fuzz even WAF/CDN-protected targets
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  fuzz:
    name: Directory Fuzzing
    steps:
    - name: protection_check
      uses: scan/waf-detect
      with:
        target: '{{ inputs.target }}'
        log_command: '{{ inputs.log_command }}'
      continue-on-error: true
    - name: pick_targets
      script: |
        import os, shutil
        rd = os.environ["OFX_RUN_DIR"]
        clean = "{{ steps.protection_check.outputs.clean_targets }}"
        force = str(__inputs__.get("force", "false")).lower() == "true"
        src = str(__inputs__.get("target", ""))
        out = os.path.join(rd, "fuzz_targets.txt")
        if force or not clean or not os.path.isfile(clean):
            if os.path.isfile(src):
                shutil.copy(src, out)
            else:
                open(out, "w").write(src.strip() + "\n")
            if not force and not clean:
                print("no WAF/CDN filter available — fuzzing all targets")
        else:
            shutil.copy(clean, out)
            skipped = open(src).read().splitlines() if os.path.isfile(src) else [src]
            skipped = [s for s in skipped if s.strip() and s not in open(out).read()]
            for s in skipped:
                print(f"skipped (WAF/CDN): {s}")
        count = len([line for line in open(out).read().splitlines() if line.strip()])
        print(f"fuzz list: {count} targets")
        add_outputs(fuzz_targets=out)
    - name: ffuf
      run: while read -r u; do [ -z "$u" ] && continue; ffuf -u "${u%/}/FUZZ" -w {{ inputs.wordlist
        }} -e {{ inputs.extensions }} -ac -of csv -o "{{ env.OFX_RUN_DIR }}/ffuf_$(echo
        "$u" | md5sum | cut -c1-8).csv"; done < {{ env.OFX_RUN_DIR }}/fuzz_targets.txt
      run_if: "{{ steps.pick_targets.outputs.fuzz_targets != '' }}"
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 360
