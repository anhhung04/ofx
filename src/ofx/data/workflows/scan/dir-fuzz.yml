name: dir-fuzz
description: Directory fuzzing — brute force web directories and files. WAF/CDN-protected
  targets are detected up front and skipped to avoid noise and bans.
tags:
- scan
- fuzz
- web
- directory
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: File of base URLs to fuzz (or single URL)
      alias: t
    wordlist:
      type: string
      default: /usr/share/seclists/Discovery/Web-Content/common.txt
      description: Web content wordlist
    extensions:
      type: string
      default: php,html,txt,json
      description: File extensions to append
    force:
      type: string
      default: 'false'
      description: Fuzz even WAF/CDN-protected targets
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  fuzz:
    name: Directory Fuzzing
    steps:
    - name: protection_check
      uses: scan/waf-detect
      with:
        target: '{{ inputs.target }}'
        log_command: '{{ inputs.log_command }}'
      continue-on-error: true
    - name: pick_targets
      module: local.pick_targets
      with:
        clean_targets: '{{ steps.protection_check.outputs.clean_targets }}'
    - name: ffuf
      module: local.builtin.shell
      with:
        cmd: while read -r u; do [ -z "$u" ] && continue; ffuf -u "${u%/}/FUZZ" -w {{ inputs.wordlist
          }} -e {{ inputs.extensions }} -ac -of csv -o "{{ env.OFX_RUN_DIR }}/ffuf_$(echo
          "$u" | md5sum | cut -c1-8).csv"; done < {{ env.OFX_RUN_DIR }}/fuzz_targets.txt
      run_if: "{{ steps.pick_targets.outputs.fuzz_targets != '' }}"
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 360
