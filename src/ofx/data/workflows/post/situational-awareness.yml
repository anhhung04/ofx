name: situational-awareness
description: 'Situational awareness — quick host enumeration after initial access:
  users, network, processes, defenses, and privileges.'
tags:
- post
- situational-awareness
- enumeration
- host-recon
dispatch:
  inputs:
    os_type:
      type: string
      default: linux
      description: 'Target OS: linux, windows'
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  linux-recon:
    name: Linux Host Recon
    run_if: '{{ inputs.os_type == ''linux'' }}'
    steps:
    - name: system-info
      run: echo "[+] System Info" && uname -a && cat /etc/os-release 2>/dev/null &&
        echo "" && echo "[+] Current User" && id && echo "" && echo "[+] Network"
        && ip a 2>/dev/null || ifconfig && echo "" && echo "[+] Routes" && ip route
        2>/dev/null || route -n && echo "" && echo "[+] Listening Ports" && ss -tlnp
        2>/dev/null || netstat -tlnp && echo "" && echo "[+] Processes" && ps aux
        --sort=-%mem | head -20 && echo "" && echo "[+] Sudo" && sudo -l 2>/dev/null
        && echo "" && echo "[+] SUID" && find / -perm -4000 -type f 2>/dev/null |
        head -20
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
  windows-recon:
    name: Windows Host Recon
    run_if: '{{ inputs.os_type == ''windows'' }}'
    steps:
    - name: system-info
      run: echo "[+] System Info" && systeminfo && echo "" && echo "[+] Current User"
        && whoami /all && echo "" && echo "[+] Network" && ipconfig /all && echo ""
        && echo "[+] Routes" && route print && echo "" && echo "[+] Listening Ports"
        && netstat -ano && echo "" && echo "[+] Processes" && tasklist && echo ""
        && echo "[+] AV/EDR" && wmic /namespace:\\root\securitycenter2 path antivirusproduct
        get displayname,productstate && echo "" && echo "[+] Firewall" && netsh advfirewall
        show allprofiles
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
