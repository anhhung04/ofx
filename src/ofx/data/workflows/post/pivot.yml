name: pivot
description: Network pivoting — set up SSH tunnels, SOCKS proxies, port forwarding,
  and chisel/ligolo for lateral movement.
tags:
- post
- pivot
- tunnel
- socks
- proxy
- port-forward
dispatch:
  inputs:
    lhost:
      required: true
      type: string
      description: Attacker host/IP
      alias: l
    lport:
      type: number
      default: 1080
      description: SOCKS proxy port on attacker
    pivot_host:
      type: string
      default: ''
      description: Pivot/jump host IP
    target_host:
      type: string
      default: ''
      description: Internal target to forward to
    target_port:
      type: number
      default: 3389
      description: Internal target port
    method:
      type: string
      default: ssh
      description: 'Method: ssh, chisel, ligolo, socat'
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  ssh-tunnel:
    name: SSH Dynamic Tunnel
    run_if: '{{ inputs.method == ''ssh'' }}'
    steps:
    - name: ssh-socks
      module: modules/ssh_socks.py::run
      with:
        lhost: "{{ inputs.lhost }}"
        lport: "{{ inputs.lport }}"
        pivot_host: "{{ inputs.pivot_host }}"
        target_host: "{{ inputs.target_host }}"
        target_port: "{{ inputs.target_port }}"
  chisel:
    name: Chisel Tunnel
    run_if: '{{ inputs.method == ''chisel'' }}'
    steps:
    - name: chisel-cmds
      module: modules/chisel_cmds.py::run
      with:
        lhost: "{{ inputs.lhost }}"
        lport: "{{ inputs.lport }}"
        target_host: "{{ inputs.target_host }}"
        target_port: "{{ inputs.target_port }}"