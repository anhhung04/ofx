name: persistence
description: 'Persistence payload generator — generates an SSH public key or a cron
  reverse-shell payload plus manual install instructions. This workflow establishes
  no persistence itself: no remote host is modified. Requires explicit authorization
  (approved input).'
tags:
- post
- persistence
- generator
- ssh
- cron
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target host the instructions are generated for
      alias: t
    username:
      required: true
      type: string
      description: Account on the target used in the install instructions
    lhost:
      required: true
      type: string
      description: Callback host/IP for reverse connections
    lport:
      type: number
      default: 4444
      description: Callback port
    method:
      type: string
      default: ssh-key
      description: 'Method: ssh-key or cron (scheduled tasks/WMI are not implemented)'
    approved:
      required: true
      type: boolean
      description: Explicit authorization for this action (required)
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  ssh-persistence:
    name: SSH Key Persistence
    run_if: '{{ inputs.approved and inputs.method == ''ssh-key'' }}'
    steps:
    - name: add-ssh-key
      module: local.add_ssh_key
      with:
        username: "{{ inputs.username }}"
        target: "{{ inputs.target }}"
      continue-on-error: false
      log-command: '{{ inputs.log_command }}'
      timeout: 10
  cron-persistence:
    name: Cron Job Persistence
    run_if: '{{ inputs.approved and inputs.method == ''cron'' }}'
    steps:
    - name: add-cron
      module: local.add_cron
      with:
        lhost: "{{ inputs.lhost }}"
        lport: "{{ inputs.lport }}"
        username: "{{ inputs.username }}"
        target: "{{ inputs.target }}"
      continue-on-error: false
      log-command: '{{ inputs.log_command }}'
      timeout: 10
