name: vuln-scan
description: Vulnerability scanning — run Nuclei templates against targets to detect
  CVEs, misconfigurations, and exposures.
tags:
- vuln
- scan
- nuclei
- cve
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target URL, IP, or host file
      alias: t
    severity:
      type: string
      default: critical,high,medium
      description: Minimum severity filter
    tags:
      type: string
      default: ''
      description: Nuclei template tags (e.g. cve,oast,misconfig)
    rate_limit:
      type: number
      default: 150
      description: Max requests per second
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  nuclei-scan:
    name: Nuclei Vulnerability Scan
    outputs:
      total: '{{ steps.summarize.outputs.total }}'
      severity_count: '{{ steps.summarize.outputs.severity_count }}'
    steps:
    - name: targets
      module: local.normalize_targets
    - name: nuclei
      module: local.builtin.shell
      with:
        cmd: nuclei -l "{{ steps.targets.outputs.target_file }}" -severity {{ inputs.severity
          }}{% if inputs.tags %} -tags {{ inputs.tags }}{% endif %} -rate-limit {{ inputs.rate_limit
          }} -silent -jsonl -o {{ env.OFX_RUN_DIR }}/nuclei_results.jsonl -stats -stats-interval
          30 2>&1
      log-command: '{{ inputs.log_command }}'
      timeout: 120
    - name: summarize
      module: local.summarize
