name: secret-scan
description: Secret scanning — discover leaked credentials, API keys, and tokens in
  repositories, files, and URLs.
tags:
- vuln
- secret
- credential
- git
- trufflehog
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Git URL, file path, or URL to scan
      alias: t
    scan_type:
      type: string
      default: git
      description: 'Scan type: git, filesystem, url'
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  secret-hunt:
    name: Secret Discovery
    steps:
    - name: trufflehog
      run: trufflehog git {{ inputs.target }} --json --only-verified --no-update 2>&1
        | tee {{ env.OFX_RUN_DIR }}/trufflehog_results.jsonl
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 120
    - name: gitleaks
      run: gitleaks detect --source {{ inputs.target }} --report-format json --report-path
        {{ env.OFX_RUN_DIR }}/gitleaks_results.json 2>&1
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
