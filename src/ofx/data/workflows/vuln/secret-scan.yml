name: secret-scan
description: Secret scanning — discover leaked credentials, API keys, and tokens in
  Git repositories and local files.
tags:
- vuln
- secret
- credential
- git
- trufflehog
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Git URL (scan_type=git) or local path (scan_type=filesystem)
      alias: t
    scan_type:
      type: string
      default: git
      description: 'Scan type: git or filesystem (url is not implemented)'
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  secret-hunt:
    name: Secret Discovery
    outputs:
      trufflehog_findings: '{{ steps.trufflehog.outputs.findings_count }}'
      trufflehog_results: '{{ steps.trufflehog.outputs.results_file }}'
      gitleaks_findings: '{{ steps.gitleaks.outputs.findings_count }}'
      gitleaks_results: '{{ steps.gitleaks.outputs.results_file }}'
    steps:
    - name: resolve-source
      module: local.resolve_secret_source
    - name: trufflehog
      module: local.scan_trufflehog
      with:
        source_path: "{{ steps['resolve-source'].outputs.source_path }}"
        scan_type: "{{ inputs.scan_type }}"
      log-command: '{{ inputs.log_command }}'
      timeout: 120
    - name: gitleaks
      module: local.scan_gitleaks
      with:
        source_path: "{{ steps['resolve-source'].outputs.source_path }}"
      log-command: '{{ inputs.log_command }}'
      timeout: 120
