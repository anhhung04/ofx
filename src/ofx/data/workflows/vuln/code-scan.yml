name: code-scan
description: Static code analysis — SAST scanning for security vulnerabilities in
  source code repositories.
tags:
- vuln
- code
- sast
- semgrep
- bandit
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Path to codebase or repository URL
      alias: t
    languages:
      type: string
      default: python,javascript,go,java
      description: Languages to scan (semgrep include filters)
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  sast:
    name: Static Analysis
    outputs:
      semgrep_results: '{{ steps.semgrep.outputs.results_file }}'
      gitleaks_results: '{{ steps.gitleaks.outputs.results_file }}'
      gitleaks_findings: '{{ steps.gitleaks.outputs.findings_count }}'
    steps:
    - name: resolve-source
      module: local.resolve_source
    - name: semgrep
      module: local.scan_semgrep
      with:
        source_path: "{{ steps['resolve-source'].outputs.source_path }}"
      log-command: '{{ inputs.log_command }}'
      timeout: 120
    - name: gitleaks
      module: local.scan_gitleaks
      with:
        source_path: "{{ steps['resolve-source'].outputs.source_path }}"
        no_git: true
      log-command: '{{ inputs.log_command }}'
      timeout: 120
