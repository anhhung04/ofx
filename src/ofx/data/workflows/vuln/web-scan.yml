name: web-scan
description: Web application vulnerability scanning — SQLi, XSS, SSTI, SSRF, command
  injection, and directory fuzzing.
tags:
- vuln
- web
- sqli
- xss
- ssti
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target URL (e.g. https://example.com)
      alias: t
    scan_type:
      type: string
      default: all
      description: 'Scan type: sqli, xss, ssti, ssrf, cmdi, all'
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  content-discovery:
    name: Content Discovery
    steps:
    - name: dirsearch
      run: dirsearch -u {{ inputs.target }} -e php,html,js,json,txt,bak,zip -t 30
        --random-agent -o {{ env.OFX_RUN_DIR }}/dirsearch_results.json 2>&1
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 60
    - name: ffuf
      run: ffuf -u {{ inputs.target }}/FUZZ -w /usr/share/seclists/Discovery/Web-Content/common.txt
        -mc 200,204,301,302,307,401,403,405 -t 50 -o {{ env.OFX_RUN_DIR }}/ffuf_results.json
        2>&1
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 60
  sqli-scan:
    name: SQL Injection Scan
    run_if: '{{ inputs.scan_type == ''sqli'' or inputs.scan_type == ''all'' }}'
    needs:
    - content-discovery
    steps:
    - name: sqlmap
      run: sqlmap -u {{ inputs.target }} --batch --random-agent --level 2 --risk 2
        --output-dir={{ env.OFX_RUN_DIR }}/sqlmap 2>&1
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 120
  xss-scan:
    name: XSS Scan
    run_if: '{{ inputs.scan_type == ''xss'' or inputs.scan_type == ''all'' }}'
    needs:
    - content-discovery
    steps:
    - name: dalfox
      run: dalfox url {{ inputs.target }} --silence --format jsonl -o {{ env.OFX_RUN_DIR
        }}/dalfox_results.jsonl 2>&1
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
  ssti-scan:
    name: SSTI Scan
    run_if: '{{ inputs.scan_type == ''ssti'' or inputs.scan_type == ''all'' }}'
    steps:
    - name: tplmap
      run: tplmap -u {{ inputs.target }} 2>&1
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
