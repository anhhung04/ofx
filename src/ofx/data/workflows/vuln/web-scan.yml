name: web-scan
description: Web application vulnerability scanning — SQL injection, XSS, SSTI, and
  directory fuzzing.
tags:
- vuln
- web
- sqli
- xss
- ssti
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target URL (e.g. https://example.com)
      alias: t
    scan_type:
      type: string
      default: all
      description: 'Scan type: sqli, xss, ssti, or all (ssrf and cmdi are not implemented)'
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
call:
  inputs:
    target:
      required: true
      type: string
      description: Target URL (e.g. https://example.com)
      alias: t
    scan_type:
      type: string
      default: all
      description: 'Scan type: sqli, xss, ssti, or all'
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
  outputs:
    content_discovery: "completed"
jobs:
  content-discovery:
    name: Content Discovery
    steps:
    - name: validate-scan-type
      module: local.validate_scan_type
    - name: dirsearch
      module: local.tool.dirsearch
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 60
    - name: ffuf
      module: local.tool.ffuf
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 60
  sqli-scan:
    name: SQL Injection Scan
    run_if: '{{ inputs.scan_type == ''sqli'' or inputs.scan_type == ''all'' }}'
    needs:
    - content-discovery
    steps:
    - name: sqlmap
      module: local.tool.sqlmap
      with:
        target: '{{ inputs.target }}'
      log-command: '{{ inputs.log_command }}'
      timeout: 120
  xss-scan:
    name: XSS Scan
    run_if: '{{ inputs.scan_type == ''xss'' or inputs.scan_type == ''all'' }}'
    needs:
    - content-discovery
    steps:
    - name: dalfox
      module: local.tool.dalfox
      with:
        target: '{{ inputs.target }}'
      log-command: '{{ inputs.log_command }}'
      timeout: 120
  ssti-scan:
    name: SSTI Scan
    run_if: '{{ inputs.scan_type == ''ssti'' or inputs.scan_type == ''all'' }}'
    steps:
    - name: tplmap
      module: local.tool.tplmap
      with:
        target: '{{ inputs.target }}'
      log-command: '{{ inputs.log_command }}'
      timeout: 120
