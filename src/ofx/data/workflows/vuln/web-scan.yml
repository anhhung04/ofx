name: web-scan
description: Web application vulnerability scanning — SQL injection, XSS, SSTI, and
  directory fuzzing.
tags:
- vuln
- web
- sqli
- xss
- ssti
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target URL (e.g. https://example.com)
      alias: t
    scan_type:
      type: string
      default: all
      description: 'Scan type: sqli, xss, ssti, or all (ssrf and cmdi are not implemented)'
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  content-discovery:
    name: Content Discovery
    steps:
    - name: validate-scan-type
      module: local.validate_scan_type
    - name: dirsearch
      module: local.builtin.scan_tool
      with:
        tool: dirsearch
        target: '{{ inputs.target }}'
        args:
        - ['-u', '{target}']
        - ['-e', 'php,html,js,json,txt,bak,zip']
        - ['-t', '30']
        - --random-agent
        - ['-O', 'json']
        output: dirsearch_results.json
        output_arg: '-o'
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 60
    - name: ffuf
      module: local.builtin.scan_tool
      with:
        tool: ffuf
        target: '{{ inputs.target }}'
        args:
        - ['-u', '{target}/FUZZ']
        - ['-w', '/usr/share/seclists/Discovery/Web-Content/common.txt']
        - ['-mc', '200,204,301,302,307,401,403,405']
        - ['-t', '50']
        output: ffuf_results.json
        output_arg: '-o'
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 60
  sqli-scan:
    name: SQL Injection Scan
    run_if: '{{ inputs.scan_type == ''sqli'' or inputs.scan_type == ''all'' }}'
    needs:
    - content-discovery
    steps:
    - name: sqlmap
      module: local.builtin.scan_tool
      with:
        tool: sqlmap
        target: '{{ inputs.target }}'
        args:
        - ['-u', '{target}']
        - --batch
        - --random-agent
        - ['--level', '2']
        - ['--risk', '2']
        output: sqlmap
        output_arg: --output-dir
        results_output_key: results_dir
      log-command: '{{ inputs.log_command }}'
      timeout: 120
  xss-scan:
    name: XSS Scan
    run_if: '{{ inputs.scan_type == ''xss'' or inputs.scan_type == ''all'' }}'
    needs:
    - content-discovery
    steps:
    - name: dalfox
      module: local.builtin.scan_tool
      with:
        tool: dalfox
        target: '{{ inputs.target }}'
        args:
        - url
        - '{target}'
        - --silence
        - ['--format', 'jsonl']
        output: dalfox_results.jsonl
        output_arg: '-o'
      log-command: '{{ inputs.log_command }}'
      timeout: 120
  ssti-scan:
    name: SSTI Scan
    run_if: '{{ inputs.scan_type == ''ssti'' or inputs.scan_type == ''all'' }}'
    steps:
    - name: tplmap
      module: local.builtin.scan_tool
      with:
        tool: tplmap
        target: '{{ inputs.target }}'
        args:
        - ['-u', '{target}']
        output: tplmap_results.txt
        capture_stdout: true
      log-command: '{{ inputs.log_command }}'
      timeout: 120
