name: subdomain-takeover
description: Subdomain takeover detection — find dangling CNAMEs and unclaimed services
  on discovered subdomains.
tags:
- recon
- subdomain
- takeover
- vuln
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: File of subdomains to test
      alias: t
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  takeover:
    name: Subdomain Takeover
    steps:
    - name: subzy
      run: subzy run --targets {{ inputs.target }} --output {{ env.OFX_RUN_DIR }}/takeover_subzy.json
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
    - name: nuclei-takeovers
      run: nuclei -l {{ inputs.target }} -t http/takeovers/ -silent -o {{ env.OFX_RUN_DIR
        }}/takeover_nuclei.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 120
