name: cidr-recon
description: 'CIDR/network reconnaissance — discovers live hosts within a CIDR range, scans for open ports and services, and searches for vulnerabilities.

  '
tags:
- recon
- cidr
- network
- vuln
- internal
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: CIDR range or IP (e.g. 192.168.1.0/24)
      alias: t
jobs:
  host-discovery:
    name: Host & Port Discovery
    outputs:
      live_hosts: '{{ steps["collect-hosts"].outputs.live_hosts }}'
      host_count: '{{ steps["collect-hosts"].outputs.host_count }}'
    steps:
    - task: mapcidr
      timeout: 5
      name: expand-cidr
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - task: fping
      name: fping-discovery
      timeout: 5
      with:
        target: '{{ inputs.target }}'
        generate: true
      continue-on-error: true
    - task: nmap
      timeout: 30
      name: ping-sweep
      with:
        target: '{{ inputs.target }}'
        timing: 4
      continue-on-error: true
    - task: naabu
      timeout: 10
      name: port-scan
      with:
        target: '{{ inputs.target }}'
        top_ports: '1000'
        rate: 2000
      continue-on-error: true
    - task: masscan
      timeout: 10
      name: masscan-scan
      with:
        target: '{{ inputs.target }}'
        top_ports: '100'
        rate: 2000
      continue-on-error: true
    - name: collect-hosts
      script: |
        import json

        hosts = set()

        nmap_out = {{ steps["ping-sweep"].outputs.typed_outputs | tojson }}
        naabu_out = {{ steps["port-scan"].outputs.typed_outputs | tojson }}
        masscan_out = {{ steps["masscan-scan"].outputs.typed_outputs | tojson }}

        for item in nmap_out + naabu_out + masscan_out:
            if item.get('_type') == 'port':
                host = item.get('host') or item.get('ip', '')
                if host:
                    hosts.add(host)
            elif item.get('_type') == 'ip':
                ip = item.get('ip', '')
                if ip:
                    hosts.add(ip)

        host_list = '\n'.join(sorted(hosts))
        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"live_hosts={host_list}\n")
            f.write(f"host_count={len(hosts)}\n")

        print(f"Discovered {len(hosts)} live hosts")
  service-scan:
    name: Service Detection
    outputs:
      typed_outputs: '{{ steps["service-detect"].outputs.typed_outputs + steps["http-probe"].outputs.typed_outputs }}'
      http_targets: '{{ steps["export-svc"].outputs.http_targets }}'
    needs:
    - host-discovery
    steps:
    - task: nmap
      timeout: 30
      name: service-detect
      with:
        target: "{{ jobs['host-discovery'].outputs.live_hosts }}"
        version_detection: true
      continue-on-error: true
    - task: httpx
      timeout: 10
      name: http-probe
      with:
        target: "{{ jobs['host-discovery'].outputs.live_hosts }}"
        tech_detect: true
        status_code: true
      continue-on-error: true
    - name: export-svc
      run: |
        echo 'http_targets={{ urls(steps["http-probe"].outputs.typed_outputs) | selectattr('status_code', 'gt', 0) | map(attribute='url') | unique | join('\n') }}' >> $OFX_OUTPUTS
  vuln-search:
    name: Vulnerability Search
    outputs:
      typed_outputs: '{{ steps["exploit-search"].outputs.typed_outputs }}'
    needs:
    - service-scan
    steps:
    - task: searchsploit
      timeout: 5
      name: exploit-search
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: summary
      run: |
        echo "=============================="
        echo " CIDR Recon: {{ inputs.target }}"
        echo "=============================="
        echo "Live hosts: {{ jobs['host-discovery'].outputs.host_count }}"
        echo "HTTP targets: {{ jobs['service-scan'].outputs.http_targets | default('none', true) }}"
      log-stdout: true

    - name: export-to-project
      script: |
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:
            all_typed = []
            for typed in [
            {{ jobs['host-discovery'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['service-scan'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['vuln-search'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true