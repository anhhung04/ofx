# yaml-language-server: $schema=~/.ofx/workflow_schema.json
name: cidr-recon
description: 'CIDR/network reconnaissance — discovers live hosts within a CIDR range,
  scans for open ports and services, and searches for vulnerabilities.

  '
tags:
- recon
- cidr
- network
- vuln
- internal
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: CIDR range or IP (e.g. 192.168.1.0/24)
jobs:
  host-discovery:
    name: Host & Port Discovery
    steps:
    - task: mapcidr
      name: expand-cidr
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - task: fping
      name: fping-discovery
      with:
        target: '{{ inputs.target }}'
        generate: true
      continue-on-error: true
    - task: nmap
      name: ping-sweep
      with:
        target: '{{ inputs.target }}'
        timing: 4
      log-stdout: true
      continue-on-error: true
    - task: naabu
      name: port-scan
      with:
        target: '{{ inputs.target }}'
        top_ports: '1000'
        rate: 2000
      log-stdout: true
      continue-on-error: true
    - task: masscan
      name: masscan-scan
      with:
        target: '{{ inputs.target }}'
        top_ports: '100'
        rate: 2000
      continue-on-error: true
      log-stdout: true
    - name: collect-hosts
      script: "import json\n\nhosts = set()\n\nnmap_out = {{ steps[2].outputs.typed_outputs\
        \ | tojson }}\nnaabu_out = {{ steps[3].outputs.typed_outputs | tojson }}\n\
        masscan_out = {{ steps[4].outputs.typed_outputs | tojson }}\n\nfor item in\
        \ nmap_out + naabu_out + masscan_out:\n    if item.get('_type') == 'port':\n\
        \        host = item.get('host') or item.get('ip', '')\n        if host:\n\
        \            hosts.add(host)\n    elif item.get('_type') == 'ip':\n      \
        \  ip = item.get('ip', '')\n        if ip:\n            hosts.add(ip)\n\n\
        host_list = '\\n'.join(sorted(hosts))\nwith open('{{ env.OFX_OUTPUTS }}',\
        \ 'a') as f:\n    f.write(f\"live_hosts={host_list}\\n\")\n    f.write(f\"\
        host_count={len(hosts)}\\n\")\n\nprint(f\"Discovered {len(hosts)} live hosts\"\
        )\n"
  service-scan:
    name: Service Detection
    needs:
    - host-discovery
    steps:
    - task: nmap
      name: service-detect
      with:
        target: '{{ jobs[''host-discovery''].outputs.live_hosts }}'
        version_detection: true
      log-stdout: true
      continue-on-error: true
    - task: httpx
      name: http-probe
      with:
        target: '{{ jobs[''host-discovery''].outputs.live_hosts }}'
        tech_detect: true
        status_code: true
      log-stdout: true
      continue-on-error: true
  vuln-search:
    name: Vulnerability Search
    needs:
    - service-scan
    steps:
    - task: searchsploit
      name: exploit-search
      with:
        target: '{{ inputs.target }}'
      log-stdout: true
      continue-on-error: true
    - name: summary
      run: 'echo "=============================="

        echo " CIDR Recon: {{ inputs.target }}"

        echo "=============================="

        echo "Live hosts: {{ jobs[''host-discovery''].outputs.host_count }}"

        '
      log-stdout: true
