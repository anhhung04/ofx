name: cidr-recon
description: 'CIDR/network reconnaissance — discovers live hosts within a CIDR range, scans for open ports and services, and searches for vulnerabilities.

  '
tags:
- recon
- cidr
- network
- vuln
- internal
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: CIDR range or IP (e.g. 192.168.1.0/24)
      alias: t
jobs:
  host-discovery:
    name: Host & Port Discovery
    outputs:
      live_hosts: '{{ steps["collect-hosts"].outputs.live_hosts | default("", true) }}'
      host_count: '{{ steps["collect-hosts"].outputs.host_count | default("", true) }}'
    steps:
    - task: mapcidr
      log-command: true
      name: expand-cidr
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - task: fping
      log-command: true
      name: fping-discovery
      with:
        target: '{{ inputs.target }}'
        generate: true
      continue-on-error: true
    - task: nmap
      log-command: true
      name: ping-sweep
      with:
        target: '{{ inputs.target }}'
        timing: 4
      continue-on-error: true
    - task: naabu
      log-command: true
      name: port-scan
      with:
        target: '{{ inputs.target }}'
        top_ports: '1000'
        rate: 2000
      continue-on-error: true
    - task: masscan
      log-command: true
      name: masscan-scan
      with:
        target: '{{ inputs.target }}'
        top_ports: '100'
        rate: 2000
      continue-on-error: true
    - task: gogo
      log-command: true
      name: gogo-scan
      with:
        target: '{{ inputs.target }}'
        ports: 'top2,win,db'
      continue-on-error: true
    - name: collect-hosts
      script: |
        import json

        hosts = set()

        nmap_out = {{ steps["ping-sweep"].outputs.typed_outputs | tojson }}
        naabu_out = {{ steps["port-scan"].outputs.typed_outputs | tojson }}
        masscan_out = {{ steps["masscan-scan"].outputs.typed_outputs | tojson }}
        gogo_out = {{ steps["gogo-scan"].outputs.typed_outputs | tojson }}

        for item in nmap_out + naabu_out + masscan_out + gogo_out:
            if item.get('_type') == 'port':
                host = item.get('host') or item.get('ip', '')
                if host:
                    hosts.add(host)
            elif item.get('_type') == 'ip':
                ip = item.get('ip', '')
                if ip:
                    hosts.add(ip)

        host_list = '\n'.join(sorted(hosts))
        add_outputs(live_hosts=host_list, host_count=len(hosts))
        print(f"Discovered {len(hosts)} live hosts")
  service-scan:
    name: Service Detection
    outputs:
      typed_outputs: '{{ (steps["service-detect"].outputs.typed_outputs | default([], true)) + (steps["http-probe"].outputs.typed_outputs | default([], true)) }}'
      http_targets: '{{ steps["export-svc"].outputs.http_targets | default("", true) }}'
    needs:
    - host-discovery
    steps:
    - task: nmap
      log-command: true
      name: service-detect
      with:
        target: "{{ jobs['host-discovery'].outputs.live_hosts }}"
        version_detection: true
      continue-on-error: true
    - task: httpx
      log-command: true
      name: http-probe
      with:
        target: "{{ jobs['host-discovery'].outputs.live_hosts }}"
        tech_detect: true
        status_code: true
      continue-on-error: true
    - name: export-svc
      script: |
        typed = {{ steps["http-probe"].outputs.typed_outputs | default([], true) | tojson }}
        live = []
        for item in typed:
            if item.get("_type") == "url" and item.get("status_code", 0) > 0:
                live.append(item["url"])
        add_outputs(http_targets='\n'.join(sorted(set(live))))
  vuln-search:
    name: Vulnerability Search
    outputs:
      typed_outputs: '{{ steps["exploit-search"].outputs.typed_outputs | default([], true) }}'
    needs:
    - service-scan
    steps:
    - task: searchsploit
      log-command: true
      name: exploit-search
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: summary
      run: |
        echo "=============================="
        echo " CIDR Recon: {{ inputs.target }}"
        echo "=============================="
        echo "Live hosts: {{ jobs['host-discovery'].outputs.host_count }}"
        echo "HTTP targets: {{ jobs['service-scan'].outputs.http_targets | default('none', true) }}"
      log-stdout: true

    - name: export-to-project
      script: |
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:
            all_typed = []
            for typed in [
            {{ jobs['host-discovery'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['service-scan'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['vuln-search'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true