name: subdomain-permute
description: Subdomain permutation enumeration — generate and resolve name variations
  from known subdomains with alterx/dnsgen.
tags:
- recon
- subdomain
- permutation
- active
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: File of known subdomains
      alias: t
    resolvers:
      type: string
      default: ''
      description: Custom DNS resolver file
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  permute:
    name: Subdomain Permutations
    outputs:
      subdomains: '{{ steps.resolve.outputs.subdomain_file }}'
      count: '{{ steps.resolve.outputs.subdomain_count }}'
    steps:
    - name: alterx
      module: local.builtin.shell
      with:
        cmd: alterx -l {{ inputs.target }} -o {{ env.OFX_RUN_DIR }}/permutations.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
    - name: dnsgen
      module: local.builtin.shell
      with:
        cmd: dnsgen {{ inputs.target }} > {{ env.OFX_RUN_DIR }}/permutations_dnsgen.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
    - name: resolve
      module: local.resolve
    - name: puredns-resolve
      module: local.builtin.shell
      with:
        cmd: puredns resolve {{ env.OFX_RUN_DIR }}/all_permutations.txt -w {{ env.OFX_RUN_DIR
          }}/resolved_permutations.txt{% if inputs.resolvers %} -r {{ inputs.resolvers }}{% endif %}
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 240
