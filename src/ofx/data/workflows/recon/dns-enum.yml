name: dns-enum
description: DNS enumeration — resolve A/AAAA/CNAME/MX/NS/TXT records for discovered
  subdomains.
tags:
- recon
- dns
- enumeration
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Domain or file of subdomains
      alias: t
    resolvers:
      type: string
      default: ''
      description: Custom resolver file
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  dns-resolve:
    name: DNS Resolution
    steps:
    - name: dnsx-resolve
      module: shell
      with:
        cmd: dnsx -l {{ inputs.target }} -a -aaaa -cname -mx -ns -txt -soa -silent -o
          {{ env.OFX_RUN_DIR }}/dns_records.txt{% if inputs.resolvers %} -r {{ inputs.resolvers
          }}{% endif %}
      log-command: '{{ inputs.log_command }}'
    - name: parse-results
      module: modules/parse_results.py::run
