name: dns-enum
description: DNS enumeration — resolve A/AAAA/CNAME/MX/NS/TXT records for discovered
  subdomains. Accepts a domain, a host file or a list of subdomains.
tags:
- recon
- dns
- enumeration
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Domain, subdomain, or file of subdomains
      alias: t
    resolvers:
      type: string
      default: ''
      description: Custom resolver file
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  dns-resolve:
    name: DNS Resolution
    outputs:
      dns_file: "{{ steps['parse-results'].outputs.dns_file }}"
      record_count: "{{ steps['parse-results'].outputs.record_count }}"
    steps:
    - name: normalize
      module: local.builtin.normalize_targets
      with:
        target: '{{ inputs.target }}'
        output: dns_input.txt
    - name: dnsx-resolve
      module: local.builtin.shell
      with:
        cmd: dnsx -l {{ steps.normalize.outputs.target_file }} -a -aaaa -cname -mx -ns
          -txt -soa -silent -o {{ env.OFX_RUN_DIR }}/dns_records.txt{% if inputs.resolvers
          %} -r {{ inputs.resolvers }}{% endif %}
      log-command: '{{ inputs.log_command }}'
    - name: parse-results
      module: local.parse_results
