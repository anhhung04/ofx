name: port-scan
description: >
  Network port scanning for IP addresses. Supports multiple scanners (nmap, naabu,
  masscan) with configurable port ranges and scan intensity. Identifies open ports
  and services running on target hosts. Can run in parallel across multiple targets
  using matrix strategy.
tags:
  - recon
  - network
  - ports
  - scan
dispatch:
  inputs:
    targets:
      required: true
      type: string
      description: Target IP(s), CIDR range, or file with targets
      alias: t
    ports:
      type: string
      default: "top-1000"
      description: Port range (top-100, top-1000, full, or comma-separated like 1-1000,443,8080)
    scanner:
      type: string
      default: "nmap"
      description: Scanner to use (nmap, naabu, masscan, rustscan)
    rate:
      type: number
      default: 1000
      description: Scan rate (packets per second) for masscan/naabu
    threads:
      type: number
      default: 10
      description: Parallel threads for nmap
    log_command:
      type: string
      default: "true"
      description: Enable command logging
    log_output:
      type: string
      default: "true"
      description: Enable output logging
defaults:
  store-creds: false
outputs:
  open_ports: '{{ jobs["scan"].outputs.open_ports | default("", true) }}'
  open_count: '{{ jobs["scan"].outputs.open_count | default("0", true) }}'
  typed_outputs: '{{ jobs["scan"].outputs.typed_outputs | default([], true) }}'
jobs:
  scan:
    name: Port Scanning
    outputs:
      open_ports: '{{ steps["collect-ports"].outputs.open_ports | default("", true) }}'
      open_count: '{{ steps["collect-ports"].outputs.open_count | default("0", true) }}'
      typed_outputs: '{{ steps["collect-ports"].outputs.typed_outputs | default([], true) }}'
    steps:
      - task: nmap
        log-command: "{{ inputs.log_command | default(true) }}"
        name: nmap-scan
        retry: 2
        retry-delay: 5
        run_if: "{{ inputs.scanner | default('nmap', true) == 'nmap' }}"
        with:
          target: "{{ inputs.targets }}"
          ports: "{{ inputs.ports }}"
          min_parallel: "{{ inputs.threads }}"
          max_parallel: "{{ inputs.threads }}"
          version_intensity: 2
          script: "default,vuln"
          json: true
          output_prefix: "nmap"
        continue-on-error: true
      - task: naabu
        log-command: "{{ inputs.log_command | default(true) }}"
        name: naabu-scan
        retry: 2
        retry-delay: 5
        run_if: "{{ inputs.scanner | default('nmap', true) == 'naabu' }}"
        with:
          target: "{{ inputs.targets }}"
          ports: "{{ inputs.ports }}"
          rate: "{{ inputs.rate }}"
          json: true
          silent: true
        continue-on-error: true
      - task: masscan
        log-command: "{{ inputs.log_command | default(true) }}"
        name: masscan-scan
        retry: 2
        retry-delay: 5
        run_if: "{{ inputs.scanner | default('nmap', true) == 'masscan' }}"
        with:
          target: "{{ inputs.targets }}"
          ports: "{{ inputs.ports }}"
          rate: "{{ inputs.rate }}"
          wait: 2
        continue-on-error: true
      - name: collect-ports
        script: |
          import json
          from pathlib import Path

          typed_outputs = []
          scanner = "{{ inputs.scanner | default('nmap', true) }}"

          if scanner == "nmap":
            nmap_data = {{ steps["nmap-scan"].outputs.typed_outputs | default([], true) | tojson }}
            for host in nmap_data:
              ip = host.get('ip', '')
              for port in host.get('ports', []):
                typed_outputs.append({
                  'ip': ip,
                  'port': port.get('port', 0),
                  'protocol': port.get('protocol', 'tcp'),
                  'state': port.get('state', ''),
                  'service': port.get('service', ''),
                  'version': port.get('version', ''),
                  'scanner': 'nmap'
                })

          elif scanner == "naabu":
            naabu_data = {{ steps["naabu-scan"].outputs.typed_outputs | default([], true) | tojson }}
            for item in naabu_data:
              typed_outputs.append({
                'ip': item.get('host', ''),
                'port': item.get('port', 0),
                'protocol': 'tcp',
                'state': 'open',
                'service': item.get('service', ''),
                'version': '',
                'scanner': 'naabu'
              })

          elif scanner == "masscan":
            raw = '{{ steps["masscan-scan"].outputs.stdout | default("", true) }}'
            for line in raw.strip().split('\\n'):
              try:
                item = json.loads(line)
                typed_outputs.append({
                  'ip': item.get('ip', ''),
                  'port': item.get('port', 0),
                  'protocol': item.get('proto', 'tcp'),
                  'state': 'open',
                  'service': '',
                  'version': '',
                  'scanner': 'masscan'
                })
              except json.JSONDecodeError:
                continue

          seen = set()
          unique_ports = []
          for item in typed_outputs:
            key = (item['ip'], item['port'])
            if key not in seen:
              seen.add(key)
              unique_ports.append(item)

           add_outputs(
             open_ports='\n'.join([f"{p['ip']}:{p['port']}" for p in unique_ports]),
             open_count=len(unique_ports),
             typed_outputs=unique_ports
           )
          print(f'Port scan: {len(unique_ports)} open ports on {len(set(p["ip"] for p in unique_ports))} hosts')
  summary:
    name: Port Scan Summary
    needs:
      - scan
    steps:
      - name: report
        run: |
          echo "=========================================="
          echo " PORT SCAN RESULTS"
          echo "=========================================="
          echo ""
          echo "Scanner: {{ inputs.scanner | default('nmap', true) }}"
          echo "Targets: {{ inputs.targets }}"
          echo "Open ports: {{ jobs.scan.outputs.open_count | default('0', true) }}"
          echo ""
          {% set ports = jobs.scan.outputs.typed_outputs | default([], true) %}
          {% if ports %}
          {% set by_ip = {} %}
          {% for p in ports %}
          {% set ip = p.ip %}
          {% if ip not in by_ip %}
          {%   set _ = by_ip.update({ip: []}) %}
          {% endif %}
          {%   set _ = by_ip[ip].append(p) %}
          {% endfor %}
          {% for ip, ports_list in by_ip.items()|sort %}
          echo "{{ ip }}: {{ ports_list|map(attribute='port')|sort|join(', ') }}"
          {% endfor %}
          {% endif %}
          echo "=========================================="
        log-stdout: "{{ inputs.log_output | default(true) }}"
      - name: export-ports
        script: |
          from pathlib import Path
          import shutil
          import json

          project = '{{ vars.project_path | default("", true) }}'
          if not project:
            print('No --project set, skipping file export')
          else:
            d = f'{project}/ports'
            Path(d).mkdir(parents=True, exist_ok=True)

            src = '{{ jobs.scan.outputs.open_ports | default("", true) }}'
            if src and Path(src).is_file():
              shutil.copy2(src, Path(d) / 'open_ports.txt')
              print(f'  [+] ports/open_ports.txt')

            all_typed = {{ jobs.scan.outputs.typed_outputs | default([], true) | tojson }}
            ctx = get_current_context()
            if ctx and hasattr(ctx, 'export_typed_outputs'):
              summaries = ctx.export_typed_outputs(project, all_typed)
              for s in summaries:
                print(f'  {s}')

            print(f'Project export complete: {project}')
        continue-on-error: true
