name: data-aggregate
description: >
  Aggregate and correlate reconnaissance data from multiple sources. Scans the
  project directory for all collected data and generates a comprehensive summary
  report with statistics and key findings. Can be run after all other recon
  workflows to produce a final report.
tags:
  - recon
  - aggregate
  - report
dispatch:
  inputs:
    project:
      required: true
      type: string
      description: Path to project directory containing results
      alias: p
outputs:
  summary_file: '{{ jobs["aggregate"].outputs.summary_file | default("", true) }}'
jobs:
  aggregate:
    name: Data Aggregation
    outputs:
      summary_file: '{{ steps["scan-project"].outputs.summary_file | default("", true) }}'
    steps:
      - name: scan-project
        script: |
          import json
          from pathlib import Path
          from datetime import datetime

          project = Path('{{ inputs.project }}')
          if not project.exists():
            raise ValueError(f"Project directory does not exist: {project}")

          data = {
            'project': str(project),
            'generated_at': datetime.now().isoformat(),
            'subdomains': {'count': 0, 'file': None},
            'ips': {'count': 0, 'file': None},
            'ports': {'count': 0, 'file': None},
            'services': {'count': 0, 'file': None},
            'web_urls': {'count': 0, 'file': None},
            'paths': {'count': 0, 'file': None},
            'vulnerabilities': {'total': 0, 'by_severity': {}, 'file': None},
            'takeovers': {'count': 0, 'file': None},
            'exposures': {'count': 0, 'file': None},
            'emails': {'count': 0, 'file': None},
            'breaches': {'count': 0, 'file': None},
            'github': {'count': 0, 'file': None},
            'javascript': {'endpoints': 0, 'secrets': 0, 'file': None},
          }

          dirs_to_check = {
            'subdomains': project / 'subdomains',
            'ports': project / 'ports',
            'services': project / 'services',
            'web': project / 'web',
            'vulnerabilities': project / 'vulnerabilities',
            'osint': project / 'osint',
            'javascript': project / 'javascript',
          }

          for key, dir_path in dirs_to_check.items():
            if not dir_path.exists():
              continue

            if key == 'subdomains':
              all_file = dir_path / 'all.txt'
              if all_file.exists():
                count = len(all_file.read_text().strip().split('\\n'))
                data[key]['count'] = count
                data[key]['file'] = str(all_file)

            elif key == 'ports':
              open_file = dir_path / 'open_ports.txt'
              if open_file.exists():
                count = len(open_file.read_text().strip().split('\\n'))
                data[key]['count'] = count
                data[key]['file'] = str(open_file)

            elif key == 'services':
              svc_file = dir_path / 'services.txt'
              if svc_file.exists():
                count = len(svc_file.read_text().strip().split('\\n'))
                data[key]['count'] = count
                data[key]['file'] = str(svc_file)

            elif key == 'web':
              urls_file = dir_path / 'live_urls.txt'
              if urls_file.exists():
                count = len(urls_file.read_text().strip().split('\\n'))
                data['web_urls']['count'] = count
                data['web_urls']['file'] = str(urls_file)
              paths_file = dir_path / 'discovered_paths.txt'
              if paths_file.exists():
                count = len(paths_file.read_text().strip().split('\\n'))
                data['paths']['count'] = count
                data['paths']['file'] = str(paths_file)

            elif key == 'vulnerabilities':
              all_file = dir_path / 'all_vulns.json'
              if all_file.exists():
                try:
                  vuln_data = json.loads(all_file.read_text())
                  data[key]['total'] = vuln_data.get('total', 0)
                  data[key]['by_severity'] = vuln_data.get('by_severity', {})
                  data[key]['file'] = str(all_file)
                except json.JSONDecodeError:
                  pass

              takeover_file = dir_path / 'takeovers.json'
              if takeover_file.exists():
                try:
                  takeover_data = json.loads(takeover_file.read_text())
                  data['takeovers']['count'] = len(takeover_data)
                  data['takeovers']['file'] = str(takeover_file)
                except json.JSONDecodeError:
                  pass

              exposure_file = dir_path / 'exposures.json'
              if exposure_file.exists():
                try:
                  exposure_data = json.loads(exposure_file.read_text())
                  data['exposures']['count'] = len(exposure_data)
                  data['exposures']['file'] = str(exposure_file)
                except json.JSONDecodeError:
                  pass

            elif key == 'osint':
              emails_file = dir_path / 'emails.txt'
              if emails_file.exists():
                count = len(emails_file.read_text().strip().split('\\n'))
                data['emails']['count'] = count
                data['emails']['file'] = str(emails_file)
              breaches_file = dir_path / 'breaches.json'
              if breaches_file.exists():
                try:
                  breaches_data = json.loads(breaches_file.read_text())
                  data['breaches']['count'] = len(breaches_data)
                  data['breaches']['file'] = str(breaches_file)
                except json.JSONDecodeError:
                  pass
              github_file = dir_path / 'github_findings.json'
              if github_file.exists():
                try:
                  github_data = json.loads(github_file.read_text())
                  data['github']['count'] = len(github_data)
                  data['github']['file'] = str(github_file)
                except json.JSONDecodeError:
                  pass

            elif key == 'javascript':
              js_file = dir_path / 'findings.json'
              if js_file.exists():
                try:
                  js_data = json.loads(js_file.read_text())
                  data[key]['endpoints'] = len(js_data.get('endpoints', []))
                  data[key]['secrets'] = len(js_data.get('secrets', []))
                  data[key]['file'] = str(js_file)
                except json.JSONDecodeError:
                  pass

          out_dir = Path(os.environ.get('OFX_RUN_DIR', '/tmp'))
          summary_file = out_dir / 'ofx_aggregate_report.json'
          summary_file.write_text(json.dumps(data, indent=2, default=str))
          add_outputs(summary_file=str(summary_file))
          print(f'Aggregation complete: {len(data)} categories collected')
        continue-on-error: true
      - name: print-report
        run: |
          import json
          summary_file = Path('{{ steps["scan-project"].outputs.summary_file | default("", true) }}')
          if summary_file.exists():
            data = json.loads(summary_file.read_text())
            print("\\n==========================================")
            print(" AGGREGATED RECONNAISSANCE REPORT")
            print("==========================================")
            print(f"\\nProject: {data.get('project', 'unknown')}")
            print(f"Generated: {data.get('generated_at', 'unknown')}\\n")

            print("--- Discovery ---")
            print(f"Subdomains: {data.get('subdomains', {}).get('count', 0)}")
            print(f"Unique IPs: {data.get('ips', {}).get('count', 0)}")
            print(f"Open ports: {data.get('ports', {}).get('count', 0)}")
            print(f"Services: {data.get('services', {}).get('count', 0)}")
            print(f"Live URLs: {data.get('web_urls', {}).get('count', 0)}")
            print(f"Discovered paths: {data.get('paths', {}).get('count', 0)}")

            print("\\n--- Vulnerabilities ---")
            vuln_data = data.get('vulnerabilities', {})
            print(f"Total: {vuln_data.get('total', 0)}")
            for sev, count in vuln_data.get('by_severity', {}).items():
              print(f"  {sev}: {count}")
            print(f"Takeover candidates: {data.get('takeovers', {}).get('count', 0)}")
            print(f"Exposures/Secrets: {data.get('exposures', {}).get('count', 0)}")

            print("\\n--- OSINT ---")
            print(f"Emails collected: {data.get('emails', {}).get('count', 0)}")
            print(f"Breached accounts: {data.get('breaches', {}).get('count', 0)}")
            print(f"GitHub findings: {data.get('github', {}).get('count', 0)}")

            print("\\n--- JavaScript ---")
            js_data = data.get('javascript', {})
            print(f"Endpoints: {js_data.get('endpoints', 0)}")
            print(f"Secrets detected: {js_data.get('secrets', 0)}")
            print("\\n==========================================")
            print(f"Full JSON report: {summary_file}")
            print("==========================================")
        log-stdout: true
