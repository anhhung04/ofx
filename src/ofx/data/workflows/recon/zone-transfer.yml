name: zone-transfer
description: DNS zone transfer — attempt AXFR against every authoritative nameserver
  of a domain.
tags:
- recon
- dns
- axfr
- misconfig
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Root domain (e.g. example.com)
      alias: t
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  axfr:
    name: Zone Transfer Attempt
    steps:
    - name: axfr
      run: for ns in $(dig +short NS {{ inputs.target }}); do echo "=== $ns ==="; dig
        @${ns} {{ inputs.target }} AXFR; done 2>&1 | tee {{ env.OFX_RUN_DIR }}/axfr_results.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
    - name: check
      script: |
        import os
        rd = os.environ["OFX_RUN_DIR"]
        try:
            content = open(os.path.join(rd, "axfr_results.txt")).read()
        except FileNotFoundError:
            content = ""
        if "XFR size" in content:
            print("ZONE TRANSFER SUCCEEDED — misconfiguration found")
            add_outputs(vulnerable="true")
        else:
            print("no zone transfer possible (expected)")
            add_outputs(vulnerable="false")
