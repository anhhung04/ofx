name: js-analysis
description: >
  JavaScript analysis to extract endpoints, secrets, and sensitive data from
  JavaScript files. Uses jsluice to parse JavaScript and identify hardcoded
  URLs, API endpoints, keys, tokens, and other sensitive information.
tags:
  - recon
  - javascript
  - secrets
  - endpoints
dispatch:
  inputs:
    targets:
      required: true
      type: string
      description: Target URL(s) or file with URLs to analyze
      alias: t
    concurrency:
      type: number
      default: 50
      description: Concurrent JavaScript fetches
    log_command:
      type: string
      default: "true"
      description: Enable command logging
    log_output:
      type: string
      default: "true"
      description: Enable output logging
defaults:
  store-creds: true
outputs:
  js_findings_file: '{{ jobs["analyze"].outputs.js_findings_file | default("", true) }}'
  endpoint_count: '{{ jobs["analyze"].outputs.endpoint_count | default("0", true) }}'
  secret_count: '{{ jobs["analyze"].outputs.secret_count | default("0", true) }}'
  typed_outputs: '{{ jobs["analyze"].outputs.typed_outputs | default([], true) }}'
jobs:
  analyze:
    name: JavaScript Analysis
    outputs:
      js_findings_file: '{{ steps["collect-findings"].outputs.js_findings_file | default("", true) }}'
      endpoint_count: '{{ steps["collect-findings"].outputs.endpoint_count | default("0", true) }}'
      secret_count: '{{ steps["collect-findings"].outputs.secret_count | default("0", true) }}'
      typed_outputs: '{{ steps["collect-findings"].outputs.typed_outputs | default([], true) }}'
    steps:
      - task: jsluice
        log-command: "{{ inputs.log_command | default(true) }}"
        name: jsluice-scan
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.targets }}"
          threads: "{{ inputs.concurrency }}"
          fetch: true
          json: true
        continue-on-error: true
      - name: collect-findings
        script: |
          import json
          from pathlib import Path

          jsluice_data = {{ steps["jsluice-scan"].outputs.typed_outputs | default([], true) | tojson }}

          endpoints = []
          secrets = []

          for item in jsluice_data:
            item_type = item.get('type', '')
            if item_type == 'endpoint':
              endpoints.append({
                'url': item.get('url', ''),
                'method': item.get('method', ''),
                'source': item.get('file', '')
              })
            elif item_type in ['secret', 'apikey', 'password', 'token']:
              secrets.append({
                'type': item_type,
                'value': item.get('value', '') or item.get('secret', ''),
                'context': item.get('context', ''),
                'file': item.get('file', ''),
                'line': item.get('line', 0)
              })

          out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')
          pass
            'endpoints': endpoints,
            'secrets': secrets
          }, indent=2, default=str))

          add_outputs(
            js_findings_file=findings_file,
            endpoint_count=len(endpoints),
            secret_count=len(secrets),
            typed_outputs=jsluice_data
          )
          print(f'JS analysis: {len(endpoints)} endpoints, {len(secrets)} secrets found')
  summary:
    name: JS Analysis Summary
    needs:
      - analyze
    steps:
      - name: report
        run: |
          echo "=========================================="
          echo " JAVASCRIPT ANALYSIS RESULTS"
          echo "=========================================="
          echo ""
          echo "Endpoints discovered: {{ jobs.analyze.outputs.endpoint_count | default('0', true) }}"
          echo "Secrets detected: {{ jobs.analyze.outputs.secret_count | default('0', true) }}"
          echo ""
          {% set findings = jobs.analyze.outputs.typed_outputs | default([], true) %}
          {% if findings %}
          {% set by_type = {} %}
          {% for f in findings %}
          {%   set t = f.get('type', 'unknown') %}
          {%   if t not in by_type %}
          {%     set _ = by_type.update({t: []}) %}
          {%   endif %}
          {%   set _ = by_type[t].append(f) %}
          {% endfor %}
          {% for t, items in by_type.items()|sort %}
          echo "{{ t }}: {{ items|length }}"
          {% endfor %}
          {% endif %}
          echo "=========================================="
        log-stdout: "{{ inputs.log_output | default(true) }}"
      - name: export-js
        script: |
          from pathlib import Path
          import shutil
          import json

          project = '{{ vars.project_path | default("", true) }}'
          if not project:
            print('No --project set, skipping file export')
          else:
            d = f'{project}/javascript'
            Path(d).mkdir(parents=True, exist_ok=True)

            src = '{{ jobs.analyze.outputs.js_findings_file | default("", true) }}'
            if src and Path(src).is_file():
              shutil.copy2(src, Path(d) / 'findings.json')
              print(f'  [+] javascript/findings.json')

              with open(src) as f:
                data = json.load(f)
              if data.get('endpoints'):
                (Path(d) / 'endpoints.txt').write_text('\\n'.join([e['url'] for e in data['endpoints']]))
                print(f'  [+] javascript/endpoints.txt')
              if data.get('secrets'):
                secrets_lines = []
                for s in data['secrets']:
                  secrets_lines.append(f"{s.get('type', 'secret')}: {s.get('value', '')} (in {s.get('file', '')}:{s.get('line', 0)})")
                (Path(d) / 'secrets.txt').write_text('\\n'.join(secrets_lines))
                print(f'  [+] javascript/secrets.txt')

            all_typed = {{ jobs.analyze.outputs.typed_outputs | default([], true) | tojson }}
            ctx = get_current_context()
            if ctx and hasattr(ctx, 'export_typed_outputs'):
              summaries = ctx.export_typed_outputs(project, all_typed)
              for s in summaries:
                print(f'  {s}')

            print(f'Project export complete: {project}')
        continue-on-error: true
