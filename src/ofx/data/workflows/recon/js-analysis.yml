name: js-analysis
description: JavaScript analysis — collect JS files from targets and extract endpoints,
  secrets, and API keys.
tags:
- recon
- js
- secrets
- endpoints
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: File of live web hosts/URLs
      alias: t
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  js:
    name: JavaScript Analysis
    steps:
    - name: subjs
      run: cat {{ inputs.target }} | subjs -silent > {{ env.OFX_RUN_DIR }}/js_files_subjs.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
    - name: katana-js
      run: katana -list {{ inputs.target }} -em js -silent -o {{ env.OFX_RUN_DIR }}/js_files_katana.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 120
    - name: merge-js
      script: |
        import os
        rd = os.environ["OFX_RUN_DIR"]
        seen = set()
        for name in ("js_files_subjs.txt", "js_files_katana.txt"):
            try:
                with open(os.path.join(rd, name)) as fh:
                    seen.update(line.strip() for line in fh if line.strip())
            except FileNotFoundError:
                pass
        out = os.path.join(rd, "js_files.txt")
        with open(out, "w") as fh:
            fh.write("\n".join(sorted(seen)))
        print(f"collected {len(seen)} JS files")
        add_outputs(js_file=out, js_count=len(seen))
    - name: secretfinder
      run: python3 SecretFinder.py -i {{ env.OFX_RUN_DIR }}/js_files.txt -o {{ env.OFX_RUN_DIR
        }}/js_secrets.html
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 120
