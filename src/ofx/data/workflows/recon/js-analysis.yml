name: js-analysis
description: JavaScript analysis — collect JS files from targets and extract endpoints,
  secrets, and API keys.
tags:
- recon
- js
- secrets
- endpoints
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: File of live web hosts/URLs
      alias: t
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
call:
  inputs:
    target:
      required: true
      type: string
      description: File of live web hosts/URLs
      alias: t
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
    output_dir:
      type: string
      default: '{{ env.OFX_RUN_DIR }}'
      description: Directory for generated artifacts
  outputs:
    js_file: "{{ jobs.js.outputs.js_file }}"
    js_count: "{{ jobs.js.outputs.js_count }}"
    secrets_report: "{{ jobs.js.outputs.secrets_report }}"
jobs:
  js:
    name: JavaScript Analysis
    outputs:
      js_file: "{{ steps['merge-js'].outputs.js_file }}"
      js_count: "{{ steps['merge-js'].outputs.js_count }}"
      secrets_report: '{{ inputs.output_dir or env.OFX_RUN_DIR }}/js_secrets.html'
    steps:
    - name: subjs
      module: local.builtin.shell
      with:
        cmd: cat {{ inputs.target }} | subjs -silent > {{ inputs.output_dir or env.OFX_RUN_DIR
          }}/js_files_subjs.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 120
      retry: 2
    - name: katana-js
      module: local.builtin.shell
      with:
        cmd: katana -list {{ inputs.target }} -em js -silent -o {{ inputs.output_dir
          or env.OFX_RUN_DIR }}/js_files_katana.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 120
    - name: merge-js
      module: local.merge_js
      with:
        output_dir: '{{ inputs.output_dir or env.OFX_RUN_DIR }}'
    - name: secretfinder
      module: local.builtin.shell
      with:
        cmd: python3 SecretFinder.py -i {{ inputs.output_dir or env.OFX_RUN_DIR }}/js_files.txt
          -o {{ inputs.output_dir or env.OFX_RUN_DIR }}/js_secrets.html
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 120
