name: js-analysis
description: JavaScript analysis — collect JS files from targets and extract endpoints,
  secrets, and API keys.
tags:
- recon
- js
- secrets
- endpoints
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: File of live web hosts/URLs
      alias: t
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  js:
    name: JavaScript Analysis
    steps:
    - name: subjs
      module: shell
      with:
        cmd: cat {{ inputs.target }} | subjs -silent > {{ env.OFX_RUN_DIR }}/js_files_subjs.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
    - name: katana-js
      module: shell
      with:
        cmd: katana -list {{ inputs.target }} -em js -silent -o {{ env.OFX_RUN_DIR }}/js_files_katana.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 120
    - name: merge-js
      module: modules/merge_js.py::run
    - name: secretfinder
      module: shell
      with:
        cmd: python3 SecretFinder.py -i {{ env.OFX_RUN_DIR }}/js_files.txt -o {{ env.OFX_RUN_DIR
          }}/js_secrets.html
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 120
