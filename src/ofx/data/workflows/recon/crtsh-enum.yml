name: crtsh-enum
description: |
  Certificate transparency and subdomain enumeration — combines crt.sh
  lookups with subfinder for comprehensive subdomain discovery.
tags: [recon, subdomains, crtsh, osint]
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target domain to enumerate subdomains for
      alias: t

jobs:
  enumerate:
    name: Subdomain Enumeration
    outputs:
      subdomains_file: '{{ steps["merge-results"].outputs.subdomains_file | default("", true) }}'
      total_count: '{{ steps["merge-results"].outputs.total_count | default("", true) }}'
    steps:
    - name: subfinder-scan
      task: subfinder
      continue-on-error: true
      timeout: 5
      with:
        target: "{{ inputs.target }}"

    - name: crtsh-lookup
      continue-on-error: true
      timeout: 3
      script: |
        from ofx.api.recon import crtsh_subdomains_sync

        domain = "{{ inputs.target }}"
        print(f"[*] Querying crt.sh for: {domain}")
        subs = crtsh_subdomains_sync(domain, timeout=30.0)
        print(f"[+] crt.sh returned {len(subs)} subdomains")
        for s in subs[:20]:
            print(f"    {s}")
        if len(subs) > 20:
            print(f"    ... and {len(subs) - 20} more")

        import json
        add_outputs(crtsh_subs=json.dumps(subs), crtsh_count=len(subs))
    - name: merge-results
      script: |
        import json

        domain = "{{ inputs.target }}"
        all_subs = set()

        # Collect crt.sh results
        crtsh_raw = '{{ steps.1.outputs.crtsh_subs | default("[]", true) }}'
        try:
            crtsh_subs = json.loads(crtsh_raw)
            all_subs.update(crtsh_subs)
        except (json.JSONDecodeError, TypeError):
            pass

        # Collect subfinder results (from typed outputs)
        subfinder_raw = '{{ steps.0.outputs.stdout | default("", true) }}'
        for line in subfinder_raw.strip().splitlines():
            line = line.strip()
            if line and "." in line and not line.startswith("["):
                all_subs.add(line.lower())

        # Filter to in-scope subdomains
        filtered = sorted(s for s in all_subs if s.endswith(f".{domain}") or s == domain)

        out_file = f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_subdomains.txt"
        with open(out_file, "w") as f:
            for sub in filtered:
                f.write(f"{sub}\n")

        print(f"[+] Combined unique subdomains: {len(filtered)}")
        for s in filtered[:30]:
            print(f"    {s}")
        if len(filtered) > 30:
            print(f"    ... and {len(filtered) - 30} more")

        add_outputs(subdomains_file=out_file, total_count=len(filtered))
      log-stdout: true
