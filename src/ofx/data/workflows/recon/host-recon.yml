# yaml-language-server: $schema=~/.ofx/workflow_schema.json
name: host-recon
description: 'Host reconnaissance — discovers open ports and services, detects versions, searches for known vulnerabilities, audits SSH, and probes HTTP services.

  '
tags:
- recon
- network
- http
- vuln
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target host, IP, or CIDR range
      alias: t
jobs:
  port-discovery:
    name: Port Discovery
    steps:
    - task: naabu
      timeout: 10
      name: fast-port-scan
      with:
        target: '{{ inputs.target }}'
        top_ports: '1000'
        rate: 1000
      continue-on-error: true
    - task: masscan
      timeout: 10
      name: masscan-scan
      with:
        target: '{{ inputs.target }}'
        top_ports: '100'
        rate: 1000
      continue-on-error: true
  service-detection:
    name: Service Detection & Analysis
    outputs:
      http_targets: '{{ steps.extract-targets.outputs.http_targets }}'
    needs:
    - port-discovery
    steps:
    - task: nmap
      timeout: 30
      name: service-scan
      with:
        target: '{{ inputs.target }}'
        version_detection: true
      continue-on-error: true
    - name: extract-targets
      run: |
        echo "http_targets={{ ports(steps["service-scan"].outputs.typed_outputs) | map(attribute='host_port') | unique | join('\n') }}" >> $OFX_OUTPUTS
  ssh-audit:
    name: SSH Audit
    needs:
    - service-detection
    steps:
    - task: ssh-audit
      name: audit-ssh
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
  http-probe:
    name: HTTP Probe & Exploit Search
    needs:
    - service-detection
    steps:
    - task: httpx
      name: probe-http
      with:
        target: '{{ inputs.target }}'
        tech_detect: true
        status_code: true
        title: true
      continue-on-error: true
    - task: searchsploit
      name: search-exploits
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - task: whatweb
      name: whatweb-fingerprint
      with:
        target: '{{ inputs.target }}'
        aggression: 3
      continue-on-error: true
  vuln-scan:
    name: Vulnerability Scan
    needs:
    - http-probe
    steps:
    - task: nuclei
      timeout: 20
      name: nuclei-scan
      with:
        target: '{{ inputs.target }}'
        severity: critical,high,medium
      continue-on-error: true
    - task: nikto
      timeout: 15
      name: nikto-scan
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: summary
      run: |
        echo "=============================="
        echo " Host Recon: {{ inputs.target }}"
        echo "=============================="
        echo "Vulnerabilities: {{ vulns(steps["nuclei-scan"].outputs.typed_outputs) | length }}"
      log-stdout: true
  summary:
    name: Summary
    needs:
    - vuln-scan
    - ssh-audit
    steps:
    - name: export-to-project
      script: |
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:
            all_typed = []
            for typed in [
            {{ jobs['port-discovery'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['service-detection'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['ssh-audit'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['http-probe'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['vuln-scan'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true
