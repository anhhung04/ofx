# yaml-language-server: $schema=~/.ofx/workflow_schema.json
name: host-recon
description: 'Host reconnaissance — discovers open ports and services, detects versions, searches for known vulnerabilities, audits SSH, and probes HTTP services.

  '
tags:
- recon
- network
- http
- vuln
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target host, IP, or CIDR range
      alias: t
jobs:
  port-discovery:
    name: Port Discovery
    steps:
    - task: naabu
      name: fast-port-scan
      with:
        target: '{{ inputs.target }}'
        top_ports: '1000'
        rate: 1000
      log-stdout: true
      continue-on-error: true
    - task: masscan
      name: masscan-scan
      with:
        target: '{{ inputs.target }}'
        top_ports: '100'
        rate: 1000
      continue-on-error: true
      log-stdout: true
  service-detection:
    name: Service Detection & Analysis
    needs:
    - port-discovery
    steps:
    - task: nmap
      name: service-scan
      with:
        target: '{{ inputs.target }}'
        version_detection: true
      log-stdout: true
      continue-on-error: true
    - name: extract-targets
      run: |
        echo "http_targets={{ ports(steps[0].outputs.typed_outputs) | map(attribute='host_port') | unique | join('\n') }}" >> $OFX_OUTPUTS
  ssh-audit:
    name: SSH Audit
    needs:
    - service-detection
    steps:
    - task: ssh-audit
      name: audit-ssh
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
      log-stdout: true
  http-probe:
    name: HTTP Probe & Exploit Search
    needs:
    - service-detection
    steps:
    - task: httpx
      name: probe-http
      with:
        target: '{{ inputs.target }}'
        tech_detect: true
        status_code: true
        title: true
      log-stdout: true
      continue-on-error: true
    - task: searchsploit
      name: search-exploits
      with:
        target: '{{ inputs.target }}'
      log-stdout: true
      continue-on-error: true
    - task: whatweb
      name: whatweb-fingerprint
      with:
        target: '{{ inputs.target }}'
        aggression: 3
      continue-on-error: true
      log-stdout: true
  vuln-scan:
    name: Vulnerability Scan
    needs:
    - http-probe
    steps:
    - task: nuclei
      name: nuclei-scan
      with:
        target: '{{ inputs.target }}'
        severity: critical,high,medium
      log-stdout: true
      continue-on-error: true
    - task: nikto
      name: nikto-scan
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
      log-stdout: true
    - name: summary
      run: |
        echo "=============================="
        echo " Host Recon: {{ inputs.target }}"
        echo "=============================="
        echo "Vulnerabilities: {{ vulns(steps[0].outputs.typed_outputs) | length }}"
      log-stdout: true
