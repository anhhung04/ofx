# yaml-language-server: $schema=~/.ofx/workflow_schema.json
name: host-recon
description: 'Host reconnaissance — discovers open ports and services, detects versions, searches for known vulnerabilities, audits SSH, and probes HTTP services.

  '
tags:
- recon
- network
- http
- vuln
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target host, IP, or CIDR range
      alias: t
jobs:
  port-discovery:
    name: Port Discovery
    outputs:
      typed_outputs: '{{ steps["fast-port-scan"].outputs.typed_outputs + steps["masscan-scan"].outputs.typed_outputs }}'
      open_ports: '{{ steps.export-ports.outputs.open_ports }}'
    steps:
    - task: naabu
      timeout: 10
      name: fast-port-scan
      with:
        target: '{{ inputs.target }}'
        top_ports: '1000'
        rate: 1000
      continue-on-error: true
    - task: masscan
      timeout: 10
      name: masscan-scan
      with:
        target: '{{ inputs.target }}'
        top_ports: '100'
        rate: 1000
      continue-on-error: true
    - name: export-ports
      run: |
        echo "open_ports={{ ports(steps["fast-port-scan"].outputs.typed_outputs + steps["masscan-scan"].outputs.typed_outputs) | map(attribute='port') | unique | sort | join(',') }}" >> $OFX_OUTPUTS
  service-detection:
    name: Service Detection & Analysis
    outputs:
      http_targets: '{{ steps.extract-targets.outputs.http_targets }}'
    needs:
    - port-discovery
    steps:
    - task: nmap
      timeout: 30
      name: service-scan
      with:
        target: '{{ inputs.target }}'
        ports: "{{ jobs['port-discovery'].outputs.open_ports | default('', true) }}"
        version_detection: true
      continue-on-error: true
    - name: extract-targets
      run: |
        echo "http_targets={{ ports(steps["service-scan"].outputs.typed_outputs) | map(attribute='host_port') | unique | join('\n') }}" >> $OFX_OUTPUTS
  ssh-audit:
    name: SSH Audit
    outputs:
      typed_outputs: '{{ steps["audit-ssh"].outputs.typed_outputs }}'
    needs:
    - service-detection
    steps:
    - task: ssh-audit
      timeout: 10
      name: audit-ssh
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
  http-probe:
    name: HTTP Probe & Exploit Search
    outputs:
      typed_outputs: '{{ steps["probe-http"].outputs.typed_outputs + steps["whatweb-fingerprint"].outputs.typed_outputs }}'
      live_urls: '{{ steps.export-urls.outputs.live_urls }}'
    needs:
    - service-detection
    steps:
    - task: httpx
      timeout: 10
      name: probe-http
      with:
        target: "{{ jobs['service-detection'].outputs.http_targets | default(inputs.target, true) }}"
        tech_detect: true
        status_code: true
        title: true
      continue-on-error: true
    - task: searchsploit
      timeout: 5
      name: search-exploits
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - task: whatweb
      timeout: 10
      name: whatweb-fingerprint
      with:
        target: "{{ jobs['service-detection'].outputs.http_targets | default(inputs.target, true) }}"
        aggression: 3
      continue-on-error: true
    - name: export-urls
      run: |
        echo "live_urls={{ urls(steps["probe-http"].outputs.typed_outputs) | selectattr('status_code', 'gt', 0) | map(attribute='url') | unique | join('\n') }}" >> $OFX_OUTPUTS
  vuln-scan:
    name: Vulnerability Scan
    outputs:
      typed_outputs: '{{ steps["nuclei-scan"].outputs.typed_outputs + steps["nikto-scan"].outputs.typed_outputs }}'
      vuln_count: '{{ steps.summary.outputs.vuln_count }}'
    needs:
    - http-probe
    steps:
    - task: nuclei
      timeout: 20
      name: nuclei-scan
      with:
        target: "{{ jobs['http-probe'].outputs.live_urls | default(inputs.target, true) }}"
        severity: critical,high,medium
      continue-on-error: true
    - task: nikto
      timeout: 15
      name: nikto-scan
      with:
        target: "{{ jobs['http-probe'].outputs.live_urls | default(inputs.target, true) }}"
      continue-on-error: true
    - name: summary
      run: |
        echo "=============================="
        echo " Host Recon: {{ inputs.target }}"
        echo "=============================="
        echo "Vulnerabilities: {{ vulns(steps["nuclei-scan"].outputs.typed_outputs) | length }}"
        echo "vuln_count={{ vulns(steps["nuclei-scan"].outputs.typed_outputs) | length }}" >> $OFX_OUTPUTS
      log-stdout: true
  summary:
    name: Summary
    needs:
    - vuln-scan
    - ssh-audit
    steps:
    - name: export-to-project
      script: |
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:
            all_typed = []
            for typed in [
            {{ jobs['port-discovery'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['service-detection'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['ssh-audit'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['http-probe'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['vuln-scan'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true
