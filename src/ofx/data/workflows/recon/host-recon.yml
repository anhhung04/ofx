name: host-recon
description: |
  Host reconnaissance — target resolution, CDN detection, port scanning
  (rustscan + naabu + masscan + nmap), service detection, SSH audit,
  HTTP probing, web analysis, URL crawling, and vulnerability scanning.
  Delegates to host-scan.
tags:
  - recon
  - network
  - http
  - vuln
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Target host, IP, URL, or CIDR range
      alias: t
jobs:
  run:
    name: Host Recon
    steps:
      - name: host-scan
        log-command: "{{ inputs.log_command | default(true) }}"
        uses: host-scan
        with:
          target: "{{ inputs.target }}"
