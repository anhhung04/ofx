name: domain-recon
description: |
  Comprehensive domain reconnaissance — OSINT, DNS enumeration, subdomain
  discovery (passive + cert-based), web probing, SSL/TLS audit, port scanning,
  URL collection, secret hunting, and vulnerability scanning.
  Delegates to domain-scan.
tags:
  - recon
  - dns
  - ssl
  - http
  - web
  - osint
  - comprehensive
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Target domain (e.g. example.com)
      alias: t
jobs:
  run:
    name: Domain Recon
    steps:
      - name: domain-scan
        log-command: "{{ inputs.log_command | default(true) }}"
        uses: domain-scan
        with:
          target: "{{ inputs.target }}"
