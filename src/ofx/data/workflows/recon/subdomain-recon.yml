name: subdomain-recon
description: |
  Subdomain reconnaissance — passive + active + cert-based enumeration,
  DNS verification, permutation bruteforcing, HTTP probing, screenshots,
  takeover detection, URL discovery, and vuln scanning.
  Delegates to subdomain-scan.
tags:
  - recon
  - dns
  - http
  - ssl
  - secrets
  - takeovers
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target domain (e.g. example.com)
      alias: t
jobs:
  run:
    name: Subdomain Recon
    steps:
      - name: subdomain-scan
        log-command: true
        uses: subdomain-scan
        with:
          target: "{{ inputs.target }}"
