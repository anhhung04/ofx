name: cloud-enum
description: Cloud resource enumeration — discover S3 buckets, Azure blobs, GCP storage,
  and cloud assets for a target.
tags:
- recon
- cloud
- aws
- azure
- gcp
- s3
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target domain or organization name
      alias: t
    provider:
      type: string
      default: aws
      description: 'Cloud provider: aws, azure, gcp, all'
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  s3-discovery:
    name: S3 Bucket Discovery
    run_if: '{{ inputs.provider == ''aws'' or inputs.provider == ''all'' }}'
    steps:
    - name: s3scanner
      run: s3scanner --bucket {{ inputs.target }} --enumerate 2>&1
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
  cloud-assets:
    name: Cloud Asset Enumeration
    steps:
    - name: cloudfox
      run: cloudfox aws --profile default 2>&1
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
