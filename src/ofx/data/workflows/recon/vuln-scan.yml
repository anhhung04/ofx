name: vuln-scan
description: >
  Vulnerability scanning using nuclei with multiple template categories.
  Scans for known vulnerabilities, misconfigurations, exposures, and security
  issues across web services, network services, and subdomain takeovers.
  Supports severity filtering and tag-based scanning.
tags:
  - recon
  - vulns
  - nuclei
  - scanning
dispatch:
  inputs:
    targets:
      required: true
      type: string
      description: Target file (URLs or hosts) or single target
      alias: t
    severity:
      type: string
      default: "critical,high,medium"
      description: Severity levels to include (critical,high,medium,low,info)
    tags:
      type: string
      default: ""
      description: Comma-separated tags to filter (e.g. "xss,sqli,rce")
    exclude_tags:
      type: string
      default: "network,ssl,file,dns,osint"
      description: Tags to exclude
    rate_limit:
      type: number
      default: 150
      description: Requests per second
    log_command:
      type: string
      default: "true"
      description: Enable command logging
    log_output:
      type: string
      default: "true"
      description: Enable output logging
defaults:
  store-creds: true
outputs:
  all_vulns_file: '{{ jobs["summary"].outputs.all_vulns_file | default("", true) }}'
  total_count: '{{ jobs["summary"].outputs.total_count | default("0", true) }}'
  typed_outputs: '{{ jobs["summary"].outputs.typed_outputs | default([], true) }}'
jobs:
  web-vulns:
    name: Web Vulnerability Scan
    outputs:
      web_vulns_file: '{{ steps["collect-web"].outputs.web_vulns_file | default("", true) }}'
      web_count: '{{ steps["collect-web"].outputs.web_count | default("0", true) }}'
      critical_count: '{{ steps["collect-web"].outputs.critical_count | default("0", true) }}'
      high_count: '{{ steps["collect-web"].outputs.high_count | default("0", true) }}'
      typed_outputs: '{{ steps["collect-web"].outputs.typed_outputs | default([], true) }}'
    steps:
      - task: nuclei
        log-command: "{{ inputs.log_command | default(true) }}"
        name: nuclei-web
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.targets }}"
          severity: "{{ inputs.severity }}"
          exclude_tags: "{{ inputs.exclude_tags }}"
          rate_limit: "{{ inputs.rate_limit }}"
          json: true
          silent: true
        continue-on-error: true
      - name: collect-web
        script: |
          import json
          from pathlib import Path

          vulns = {{ vulns(steps["nuclei-web"].outputs.typed_outputs) | default([], true) | tojson }}

          critical = [v for v in vulns if v.get('severity') == 'critical']
          high = [v for v in vulns if v.get('severity') == 'high']
          medium = [v for v in vulns if v.get('severity') == 'medium']
          low = [v for v in vulns if v.get('severity') == 'low']
          info = [v for v in vulns if v.get('severity') == 'info']

          out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')
          pass
            'total': len(vulns),
            'critical': critical,
            'high': high,
            'medium': medium,
            'low': low,
            'info': info
          }, indent=2, default=str))

          add_outputs(
            web_vulns_file=vulns_file,
            web_count=len(vulns),
            critical_count=len(critical),
            high_count=len(high),
            typed_outputs=vulns
          )
          print(f'Nuclei web: {len(vulns)} findings (C:{len(critical)} H:{len(high)})')
  takeover:
    name: Subdomain Takeover Scan
    outputs:
      takeover_file: '{{ steps["collect-takeover"].outputs.takeover_file | default("", true) }}'
      takeover_count: '{{ steps["collect-takeover"].outputs.takeover_count | default("0", true) }}'
      typed_outputs: '{{ steps["collect-takeover"].outputs.typed_outputs | default([], true) }}'
    steps:
      - task: nuclei
        log-command: "{{ inputs.log_command | default(true) }}"
        name: nuclei-takeover
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.targets }}"
          tags: "subdomain-takeover,takeover,cname"
          severity: "critical,high,medium"
          rate_limit: 100
          json: true
          silent: true
        continue-on-error: true
      - task: subzy
        log-command: "{{ inputs.log_command | default(true) }}"
        name: subzy-scan
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.targets }}"
          threads: 20
        continue-on-error: true
      - name: collect-takeover
        script: |
          import json
          from pathlib import Path

          nuclei_takeovers = {{ vulns(steps["nuclei-takeover"].outputs.typed_outputs) | default([], true) | tojson }}
          subzy_data = {{ vulns(steps["subzy-scan"].outputs.typed_outputs) | default([], true) | tojson }}

          all_takeovers = nuclei_takeovers + subzy_data

          out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')
          pass

          add_outputs(
            takeover_file=takeover_file,
            takeover_count=len(all_takeovers),
            typed_outputs=all_takeovers
          )
          print(f'Takeover scan: {len(all_takeovers)} candidates')
  exposures:
    name: Exposure & Secret Detection
    outputs:
      exposure_file: '{{ steps["collect-exposures"].outputs.exposure_file | default("", true) }}'
      exposure_count: '{{ steps["collect-exposures"].outputs.exposure_count | default("0", true) }}'
      typed_outputs: '{{ steps["collect-exposures"].outputs.typed_outputs | default([], true) }}'
    steps:
      - task: nuclei
        log-command: "{{ inputs.log_command | default(true) }}"
        name: nuclei-exposures
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.targets }}"
          tags: "exposure,token,secret,api-key,password"
          severity: "critical,high,medium"
          rate_limit: 150
          json: true
          silent: true
        continue-on-error: true
      - task: trufflehog
        log-command: "{{ inputs.log_command | default(true) }}"
        name: trufflehog-scan
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.targets }}"
        continue-on-error: true
      - name: collect-exposures
        script: |
          import json
          from pathlib import Path

          nuclei_exposures = {{ vulns(steps["nuclei-exposures"].outputs.typed_outputs) | default([], true) | tojson }}
          trufflehog_data = {{ vulns(steps["trufflehog-scan"].outputs.typed_outputs) | default([], true) | tojson }}

          all_exposures = nuclei_exposures + trufflehog_data

          out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')
          pass

          add_outputs(
            exposure_file=exposure_file,
            exposure_count=len(all_exposures),
            typed_outputs=all_exposures
          )
          print(f'Exposure scan: {len(all_exposures)} findings')
  summary:
    name: Vulnerability Scan Summary
    needs:
      - web-vulns
      - takeover
      - exposures
    steps:
      - name: aggregate
        script: |
          import json
          from pathlib import Path

          web_vulns = {{ vulns(jobs['web-vulns'].outputs.typed_outputs) | default([], true) | tojson }}
          takeovers = {{ vulns(jobs['takeover'].outputs.typed_outputs) | default([], true) | tojson }}
          exposures = {{ vulns(jobs['exposures'].outputs.typed_outputs) | default([], true) | tojson }}

          all_vulns = web_vulns + takeovers + exposures

          by_severity = {}
          for v in all_vulns:
            sev = v.get('severity', 'info')
            by_severity[sev] = by_severity.get(sev, 0) + 1

          out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')
          pass
            'total': len(all_vulns),
            'by_category': {
              'web': len(web_vulns),
              'takeover': len(takeovers),
              'exposures': len(exposures)
            },
            'by_severity': by_severity,
            'findings': all_vulns
          }, indent=2, default=str))

          add_outputs(
            all_vulns_file=all_file,
            total_count=len(all_vulns),
            typed_outputs=all_vulns
          )
          print(f'Aggregated: {len(all_vulns)} total findings')
          print(f'  Web: {len(web_vulns)}, Takeovers: {len(takeovers)}, Exposures: {len(exposures)}')
      - name: report
        run: |
          echo "=========================================="
          echo " VULNERABILITY SCAN SUMMARY"
          echo "=========================================="
          echo ""
          echo "Web vulns: {{ jobs['web-vulns'].outputs.web_count | default('0', true) }}"
          echo "  Critical: {{ jobs['web-vulns'].outputs.critical_count | default('0', true) }}"
          echo "  High: {{ jobs['web-vulns'].outputs.high_count | default('0', true) }}"
          echo ""
          echo "Takeovers: {{ jobs['takeover'].outputs.takeover_count | default('0', true) }}"
          echo "Exposures: {{ jobs['exposures'].outputs.exposure_count | default('0', true) }}"
          echo ""
          echo "Total: {{ jobs.summary.outputs.total_count | default('0', true) }}"
          echo "=========================================="
        log-stdout: "{{ inputs.log_output | default(true) }}"
      - name: export-vulns
        script: |
          from pathlib import Path
          import shutil

          project = '{{ vars.project_path | default("", true) }}'
          if not project:
            print('No --project set, skipping file export')
          else:
            d = f'{project}/vulnerabilities'
            Path(d).mkdir(parents=True, exist_ok=True)

            src = '{{ jobs["web-vulns"].outputs.web_vulns_file | default("", true) }}'
            if src and Path(src).is_file():
              shutil.copy2(src, Path(d) / 'web_vulns.json')
              print(f'  [+] vulnerabilities/web_vulns.json')

            src = '{{ jobs["takeover"].outputs.takeover_file | default("", true) }}'
            if src and Path(src).is_file():
              shutil.copy2(src, Path(d) / 'takeovers.json')
              print(f'  [+] vulnerabilities/takeovers.json')

            src = '{{ jobs["exposures"].outputs.exposure_file | default("", true) }}'
            if src and Path(src).is_file():
              shutil.copy2(src, Path(d) / 'exposures.json')
              print(f'  [+] vulnerabilities/exposures.json')

            src = '{{ jobs.summary.outputs.all_vulns_file | default("", true) }}'
            if src and Path(src).is_file():
              shutil.copy2(src, Path(d) / 'all_vulns.json')
              print(f'  [+] vulnerabilities/all_vulns.json')

            all_typed = {{ jobs.summary.outputs.typed_outputs | default([], true) | tojson }}
            ctx = get_current_context()
            if ctx and hasattr(ctx, 'export_typed_outputs'):
              summaries = ctx.export_typed_outputs(project, all_typed)
              for s in summaries:
                print(f'  {s}')

            print(f'Project export complete: {project}')
        continue-on-error: true
