name: full-recon
description: Full reconnaissance pipeline — accepts any target type (domain, subdomain,
  CIDR, or IP), auto-classifies it, and runs the appropriate recon chain end to end.
  WAF/CDN-protected hosts are detected and flagged for skipping.
tags:
- recon
- full
- pipeline
- osint
- subdomain
- waf
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target — domain, subdomain, CIDR, or IP
      alias: t
    wordlist:
      type: string
      default: /usr/share/seclists/Discovery/DNS/subdomains-top1million-20000.txt
      description: Wordlist for active subdomain brute force
    resolvers:
      type: string
      default: ''
      description: Custom DNS resolver file
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  classify:
    name: Target Classification
    outputs:
      target_type: '{{ steps.classify.outputs.target_type }}'
    steps:
    - name: classify
      module: modules/classify.py::run
  recon:
    name: Reconnaissance
    needs:
    - classify
    steps:
    # --- domain path ---
    - name: passive
      run_if: "{{ jobs.classify.outputs.target_type in ['domain', 'mixed'] }}"
      uses: recon/external-recon
      with:
        target: '{{ inputs.target }}'
        log_command: '{{ inputs.log_command }}'
      continue-on-error: true
    - name: brute
      run_if: "{{ jobs.classify.outputs.target_type in ['domain', 'mixed'] }}"
      uses: recon/subdomain-brute
      with:
        target: '{{ inputs.target }}'
        wordlist: '{{ inputs.wordlist }}'
        resolvers: '{{ inputs.resolvers }}'
        log_command: '{{ inputs.log_command }}'
      continue-on-error: true
    - name: merge_subs
      run_if: "{{ jobs.classify.outputs.target_type in ['domain', 'mixed'] }}"
      module: modules/merge_subdomain_lists.py::run
      with:
        passive_file: '{{ steps.passive.outputs.subdomain_file }}'
        brute_file: '{{ steps.brute.outputs.subdomains }}'
    - name: permute
      run_if: "{{ jobs.classify.outputs.target_type in ['domain', 'mixed'] }}"
      uses: recon/subdomain-permute
      with:
        target: '{{ steps.merge_subs.outputs.subdomains }}'
        resolvers: '{{ inputs.resolvers }}'
        log_command: '{{ inputs.log_command }}'
      continue-on-error: true
    - name: takeover
      run_if: "{{ jobs.classify.outputs.target_type in ['domain', 'mixed'] }}"
      uses: recon/subdomain-takeover
      with:
        target: '{{ steps.merge_subs.outputs.subdomains }}'
        log_command: '{{ inputs.log_command }}'
      continue-on-error: true
    # --- network path ---
    - name: host_discovery
      run_if: "{{ jobs.classify.outputs.target_type == 'cidr' }}"
      uses: scan/host-discovery
      with:
        target: '{{ inputs.target }}'
        log_command: '{{ inputs.log_command }}'
      continue-on-error: true
    - name: port_scan
      run_if: "{{ jobs.classify.outputs.target_type in ['cidr', 'ip'] }}"
      uses: scan/port-scan
      with:
        target: '{{ inputs.target }}'
        log_command: '{{ inputs.log_command }}'
      continue-on-error: true
    # --- web phase (all target types) ---
    - name: web_targets
      module: modules/web_targets.py::run
      with:
        target_type: '{{ jobs.classify.outputs.target_type }}'
        host_file: '{{ steps.host_discovery.outputs.host_file }}'
    - name: web_probe
      uses: scan/web-probe
      with:
        target: '{{ steps.web_targets.outputs.web_targets }}'
        log_command: '{{ inputs.log_command }}'
      continue-on-error: true
    - name: waf_detect
      uses: scan/waf-detect
      with:
        target: '{{ steps.web_targets.outputs.web_targets }}'
        log_command: '{{ inputs.log_command }}'
      continue-on-error: true
    - name: url_archive
      run_if: "{{ jobs.classify.outputs.target_type in ['domain', 'subdomain', 'mixed'] }}"
      uses: recon/url-archive
      with:
        target: '{{ steps.web_targets.outputs.web_targets }}'
        log_command: '{{ inputs.log_command }}'
      continue-on-error: true
    - name: js_analysis
      uses: recon/js-analysis
      with:
        target: '{{ steps.web_targets.outputs.web_targets }}'
        log_command: '{{ inputs.log_command }}'
      continue-on-error: true
