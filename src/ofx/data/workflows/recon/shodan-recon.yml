name: shodan-recon
description: |
  Shodan reconnaissance — search Shodan for exposed hosts matching a
  target domain/IP or custom dork, then analyze discovered services.
tags: [recon, shodan, osint, search]
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Domain or IP address to search for
      alias: t
    dork:
      type: string
      default: ""
      description: Custom Shodan dork (overrides auto-build from target)
    pages:
      type: string
      default: "1"
      description: Number of Shodan result pages to fetch
    shodan_token:
      type: string
      default: ""
      description: "Shodan API token (or set in ~/.ofx/secrets)"

jobs:
  search:
    name: Shodan Search
    outputs:
      raw_results: '{{ steps["query-shodan"].outputs.raw_results | default("", true) }}'
      result_count: '{{ steps["query-shodan"].outputs.result_count | default("", true) }}'
    steps:
    - name: query-shodan
      timeout: 5
      continue-on-error: true
      script: |
        from ofx.api.search import Shodan
        import json

        target = "{{ inputs.target }}"
        dork = "{{ inputs.dork }}"
        pages = int("{{ inputs.pages }}")
        token = "{{ inputs.shodan_token }}" or __secrets__.get("shodan_token", "")

        if not dork:
            dork = f"hostname:{target}" if not target.replace(".", "").isdigit() else f"ip:{target}"

        print(f"[*] Shodan query: {dork} (pages={pages})")
        client = Shodan(token=token) if token else Shodan()
        results = client.search(dork, pages=pages)

        results_list = sorted(results)
        print(f"[+] Found {len(results_list)} host:port entries")
        for entry in results_list[:20]:
            print(f"    {entry}")
        if len(results_list) > 20:
            print(f"    ... and {len(results_list) - 20} more")

        add_outputs(raw_results=json.dumps(results_list), result_count=len(results_list))
  analyze:
    name: Analyze Results
    needs: [search]
    outputs:
      unique_ips: '{{ steps["parse-results"].outputs.unique_ips | default("", true) }}'
      unique_ports: '{{ steps["parse-results"].outputs.unique_ports | default("", true) }}'
      services_file: '{{ steps["parse-results"].outputs.services_file | default("", true) }}'
    steps:
    - name: parse-results
      script: |
        import json

        raw = '{{ jobs.search.outputs.raw_results }}'
        results = json.loads(raw) if raw else []

        ips = set()
        ports = set()
        services = {}

        for entry in results:
            if "]:" in entry:
                ip = entry.rsplit("]:", 1)[0].lstrip("[")
                port = int(entry.rsplit("]:", 1)[1])
            elif ":" in entry:
                ip, port = entry.rsplit(":", 1)
                port = int(port)
            else:
                continue
            ips.add(ip)
            ports.add(port)
            services.setdefault(ip, []).append(port)

        sorted_ips = sorted(ips)
        sorted_ports = sorted(ports)

        print(f"[+] Unique IPs: {len(sorted_ips)}")
        print(f"[+] Unique ports: {len(sorted_ports)}")
        print(f"[+] Port distribution:")
        from collections import Counter
        port_counts = Counter()
        for entry in results:
            p = entry.rsplit(":", 1)[-1]
            try:
                port_counts[int(p)] += 1
            except ValueError:
                pass
        for port, count in port_counts.most_common(15):
            print(f"    :{port} -> {count} hosts")

        out_file = "/tmp/ofx_shodan_services.json"
        with open(out_file, "w") as f:
            json.dump({"ips": sorted_ips, "ports": sorted_ports, "services": services}, f, indent=2)

        add_outputs(unique_ips=json.dumps(sorted_ips), unique_ports=json.dumps(sorted_ports), services_file=out_file)
  summary:
    name: Shodan Summary
    needs: [search, analyze]
    steps:
    - name: display-summary
      run: |
        echo "======================================================"
        echo " SHODAN RECON: {{ inputs.target }}"
        echo "======================================================"
        echo ""
        echo "  Query results: {{ jobs.search.outputs.result_count }} host:port entries"
        echo "  Unique IPs:    {{ jobs.analyze.outputs.unique_ips }}"
        echo "  Unique ports:  {{ jobs.analyze.outputs.unique_ports }}"
        echo "  Services file: {{ jobs.analyze.outputs.services_file }}"
      log-stdout: true
