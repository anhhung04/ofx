name: url-archive
description: URL discovery — aggregate known URLs from web archives (Wayback, Common
  Crawl, OTX) and passive crawling.
tags:
- recon
- urls
- archive
- crawling
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Domain or file of subdomains
      alias: t
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
call:
  inputs:
    target:
      required: true
      type: string
      description: Domain or file of subdomains
      alias: t
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
    output_dir:
      type: string
      default: '{{ env.OFX_RUN_DIR }}'
      description: Directory for generated artifacts
  outputs:
    urls: "{{ jobs.archive.outputs.urls }}"
    url_count: "{{ jobs.archive.outputs.url_count }}"
jobs:
  archive:
    name: Archive URL Collection
    outputs:
      urls: '{{ steps.merge.outputs.output_file }}'
      url_count: '{{ steps.merge.outputs.count }}'
    steps:
    - name: normalize
      module: local.builtin.normalize_targets
      with:
        target: '{{ inputs.target }}'
        output: url_archive_input.txt
        output_dir: '{{ inputs.output_dir or env.OFX_RUN_DIR }}'
    - name: waybackurls
      module: local.builtin.shell
      with:
        cmd: cat {{ steps.normalize.outputs.target_file }} | waybackurls > {{ inputs.output_dir
          or env.OFX_RUN_DIR }}/urls_wayback.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 120
      retry: 2
      retry-delay: 5
    - name: gau
      module: local.builtin.shell
      with:
        cmd: cat {{ steps.normalize.outputs.target_file }} | gau --threads 5 > {{ inputs.output_dir
          or env.OFX_RUN_DIR }}/urls_gau.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 120
      retry: 2
      retry-delay: 5
    - name: katana-passive
      module: local.builtin.shell
      with:
        cmd: katana -list {{ steps.normalize.outputs.target_file }} -passive -silent
          -o {{ inputs.output_dir or env.OFX_RUN_DIR }}/urls_katana.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 120
      retry: 2
      retry-delay: 5
    - name: merge
      module: local.builtin.merge_lists
      with:
        files:
        - urls_wayback.txt
        - urls_gau.txt
        - urls_katana.txt
        output: all_urls.txt
        output_dir: '{{ inputs.output_dir or env.OFX_RUN_DIR }}'
