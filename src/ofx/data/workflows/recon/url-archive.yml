name: url-archive
description: URL discovery — aggregate known URLs from web archives (Wayback, Common
  Crawl, OTX) and passive crawling.
tags:
- recon
- urls
- archive
- crawling
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Domain or file of subdomains
      alias: t
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
jobs:
  archive:
    name: Archive URL Collection
    outputs:
      urls: '{{ steps.merge.outputs.url_file }}'
      count: '{{ steps.merge.outputs.url_count }}'
    steps:
    - name: waybackurls
      module: local.builtin.shell
      with:
        cmd: cat {{ inputs.target }} | waybackurls > {{ env.OFX_RUN_DIR }}/urls_wayback.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 120
    - name: gau
      module: local.builtin.shell
      with:
        cmd: cat {{ inputs.target }} | gau --threads 5 > {{ env.OFX_RUN_DIR }}/urls_gau.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 120
    - name: katana-passive
      module: local.builtin.shell
      with:
        cmd: katana -list {{ inputs.target }} -passive -silent -o {{ env.OFX_RUN_DIR }}/urls_katana.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
      timeout: 120
    - name: merge
      module: local.merge_urls
