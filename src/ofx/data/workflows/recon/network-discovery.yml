name: network-discovery
description: 'Network host discovery — uses ICMP ping sweep and port scanning to identify live hosts and open services on a network.

  '
tags:
- recon
- network
- discovery
- ports
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target CIDR or IP range (e.g. 10.0.0.0/24)
      alias: t
jobs:
  host-discovery:
    name: Host Discovery
    outputs:
      alive_hosts: '{{ steps["ping-sweep"].outputs.alive_hosts }}'
      alive_file: '{{ steps["collect-alive"].outputs.alive_file }}'
      alive_count: '{{ steps["collect-alive"].outputs.alive_count }}'
    steps:
    - name: ping-sweep
      run: |
        fping -a -g {{ inputs.target }} 2>/dev/null | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n | tee /tmp/alive-hosts.txt
        echo "alive_hosts=$(cat /tmp/alive-hosts.txt | tr '\n' '\n')" >> $OFX_OUTPUTS
        echo "alive_count=$(wc -l < /tmp/alive-hosts.txt | tr -d ' ')" >> $OFX_OUTPUTS
      continue-on-error: true
    - name: collect-alive
      script: |
        import os

        hosts = set()
        if os.path.exists('/tmp/alive-hosts.txt'):
            with open('/tmp/alive-hosts.txt') as f:
                for line in f:
                    ip = line.strip()
                    if ip:
                        hosts.add(ip)

        with open('/tmp/ofx_nd_alive.txt', 'w') as f:
            f.write('\n'.join(sorted(hosts)))

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"alive_file=/tmp/ofx_nd_alive.txt\n")
            f.write(f"alive_count={len(hosts)}\n")

        print(f"Found {len(hosts)} alive hosts")
  port-scan:
    name: Port Scanning
    outputs:
      hosts_file: '{{ steps["collect-ports"].outputs.hosts_file }}'
      port_count: '{{ steps["collect-ports"].outputs.port_count }}'
    needs:
    - host-discovery
    steps:
    - name: masscan-sweep
      run: |
        masscan -iL {{ jobs['host-discovery'].outputs.alive_file | default(inputs.target, true) }} --top-ports 100 --rate 1000 -oL /tmp/masscan-results.txt 2>/dev/null || true
      continue-on-error: true
    - task: naabu
      timeout: 10
      name: naabu-scan
      with:
        target: "{{ jobs['host-discovery'].outputs.alive_file | default(inputs.target, true) }}"
        top_ports: '1000'
        rate: 1000
      continue-on-error: true
    - name: collect-ports
      script: |
        import json

        ports_found = set()
        hosts_with_ports = set()

        naabu_out = {{ steps["naabu-scan"].outputs.typed_outputs | tojson }}
        for item in naabu_out:
            if item.get('_type') == 'port':
                host = item.get('host') or item.get('ip', '')
                port = item.get('port', '')
                if host and port:
                    ports_found.add(f"{host}:{port}")
                    hosts_with_ports.add(host)

        with open('/tmp/ofx_nd_hosts.txt', 'w') as f:
            f.write('\n'.join(sorted(hosts_with_ports)))

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"hosts_file=/tmp/ofx_nd_hosts.txt\n")
            f.write(f"port_count={len(ports_found)}\n")

        print(f"Found {len(ports_found)} open ports across {len(hosts_with_ports)} hosts")
  service-detection:
    name: Service Detection
    outputs:
      live_urls: '{{ steps["export-http"].outputs.live_urls }}'
      live_count: '{{ steps["export-http"].outputs.live_count }}'
    needs:
    - port-scan
    steps:
    - task: nmap
      timeout: 30
      name: version-detect
      with:
        target: "{{ jobs['port-scan'].outputs.hosts_file | default(inputs.target, true) }}"
        version_detection: true
      continue-on-error: true
    - task: httpx
      timeout: 10
      name: http-probe
      with:
        target: "{{ jobs['port-scan'].outputs.hosts_file | default(inputs.target, true) }}"
        tech_detect: true
        status_code: true
        title: true
      continue-on-error: true
    - name: export-http
      run: |
        echo 'live_urls={{ urls(steps["http-probe"].outputs.typed_outputs) | selectattr('status_code', 'gt', 0) | map(attribute='url') | unique | join('\n') }}' >> $OFX_OUTPUTS
        echo 'live_count={{ urls(steps["http-probe"].outputs.typed_outputs) | selectattr('status_code', 'gt', 0) | list | length }}' >> $OFX_OUTPUTS
  summary:
    name: Discovery Summary
    needs:
    - service-detection
    steps:
    - name: report
      run: |
        echo "======================================="
        echo " Network Discovery: {{ inputs.target }}"
        echo "======================================="
        echo "Alive hosts: {{ jobs['host-discovery'].outputs.alive_count }}"
        echo "Open ports: {{ jobs['port-scan'].outputs.port_count }}"
        echo "HTTP services: {{ jobs['service-detection'].outputs.live_count }}"
      log-stdout: true

    - name: export-to-project
      script: |
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:
            all_typed = []
            for typed in [
            {{ jobs['port-scan'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['service-detection'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true