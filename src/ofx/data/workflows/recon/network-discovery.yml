name: network-discovery
description: 'Network host discovery — uses ICMP ping sweep and port scanning to identify live hosts and open services on a network.

  '
tags:
- recon
- network
- discovery
- ports
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target CIDR or IP range (e.g. 10.0.0.0/24)
      alias: t
jobs:
  host-discovery:
    name: Host Discovery
    outputs:
      alive_hosts: '{{ steps["ping-sweep"].outputs.alive_hosts | default("", true) }}'
      alive_file: '{{ steps["collect-alive"].outputs.alive_file | default("", true) }}'
      alive_count: '{{ steps["collect-alive"].outputs.alive_count | default("", true) }}'
    steps:
    - task: fping
      log-command: true
      name: ping-sweep
      with:
        target: '{{ inputs.target }}'
        generate: true
      continue-on-error: true
    - name: collect-alive
      script: |
        hosts = set()
        for item in {{ ips(steps["ping-sweep"].outputs.typed_outputs) | default([], true) | tojson }}:
            ip = item.get('ip', '')
            if ip:
                hosts.add(ip)

        with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_nd_alive.txt', 'w') as f:
            f.write('\n'.join(sorted(hosts)))

        add_outputs(alive_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_nd_alive.txt", alive_count=len(hosts))
        print(f"Found {len(hosts)} alive hosts")
  port-scan:
    name: Port Scanning
    outputs:
      hosts_file: '{{ steps["collect-ports"].outputs.hosts_file | default("", true) }}'
      port_count: '{{ steps["collect-ports"].outputs.port_count | default("", true) }}'
    needs:
    - host-discovery
    steps:
    - task: naabu
      log-command: true
      name: naabu-scan
      with:
        target: "{{ jobs['host-discovery'].outputs.alive_file | default(inputs.target, true) }}"
        top_ports: '1000'
        rate: 1000
      continue-on-error: true
    - name: collect-ports
      script: |
        import json

        ports_found = set()
        hosts_with_ports = set()

        naabu_out = {{ steps["naabu-scan"].outputs.typed_outputs | tojson }}
        for item in naabu_out:
            if item.get('_type') == 'port':
                host = item.get('host') or item.get('ip', '')
                port = item.get('port', '')
                if host and port:
                    ports_found.add(f"{host}:{port}")
                    hosts_with_ports.add(host)

        with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_nd_hosts.txt', 'w') as f:
            f.write('\n'.join(sorted(hosts_with_ports)))

        add_outputs(hosts_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_nd_hosts.txt", port_count=len(ports_found))
        print(f"Found {len(ports_found)} open ports across {len(hosts_with_ports)} hosts")
  service-detection:
    name: Service Detection
    outputs:
      live_urls: '{{ steps["export-http"].outputs.live_urls | default("", true) }}'
      live_count: '{{ steps["export-http"].outputs.live_count | default("", true) }}'
    needs:
    - port-scan
    steps:
    - task: nmap
      log-command: true
      name: version-detect
      with:
        target: "{{ jobs['port-scan'].outputs.hosts_file | default(inputs.target, true) }}"
        version_detection: true
      continue-on-error: true
    - task: httpx
      log-command: true
      name: http-probe
      with:
        target: "{{ jobs['port-scan'].outputs.hosts_file | default(inputs.target, true) }}"
        tech_detect: true
        status_code: true
        title: true
      continue-on-error: true
    - name: export-http
      script: |
        typed = {{ steps["http-probe"].outputs.typed_outputs | default([], true) | tojson }}
        live = []
        for item in typed:
            if item.get("_type") == "url" and item.get("status_code", 0) > 0:
                live.append(item["url"])
        add_outputs(live_urls='\n'.join(sorted(set(live))))
        count = sum(1 for item in typed if item.get("_type") == "url" and item.get("status_code", 0) > 0)
        add_outputs(live_count=count)
  summary:
    name: Discovery Summary
    needs:
    - service-detection
    steps:
    - name: report
      run: |
        echo "======================================="
        echo " Network Discovery: {{ inputs.target }}"
        echo "======================================="
        echo "Alive hosts: {{ jobs['host-discovery'].outputs.alive_count }}"
        echo "Open ports: {{ jobs['port-scan'].outputs.port_count }}"
        echo "HTTP services: {{ jobs['service-detection'].outputs.live_count }}"
      log-stdout: true

    - name: export-to-project
      script: |
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:
            all_typed = []
            for typed in [
            {{ jobs['port-scan'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['service-detection'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true