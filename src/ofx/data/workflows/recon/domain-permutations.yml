name: domain-permutations
description: |
  Domain permutation and typosquatting detector — generate lookalike
  domains, resolve them via DNS, and report which are registered.
  Useful for brand protection and phishing detection.
tags: [recon, domain, typosquatting, phishing, dns]
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Target domain to check (e.g. example.com)
      alias: t
    resolve_timeout:
      type: string
      default: "2"
      description: DNS resolution timeout per domain in seconds

jobs:
  generate:
    name: Generate Permutations
    outputs:
      perms_file: '{{ steps["gen-perms"].outputs.perms_file | default("", true) }}'
      perm_count: '{{ steps["gen-perms"].outputs.perm_count | default("", true) }}'
    steps:
    - name: gen-perms
      continue-on-error: true
      log-command: "{{ inputs.log_command | default(true) }}"
      script: |
        from ofx.api.recon.osint import domain_permutations

        domain = "{{ inputs.target }}"
        perms = domain_permutations(domain)

        out_file = f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_domain_perms.txt"
        with open(out_file, "w") as f:
            for p in perms:
                f.write(f"{p}\n")

        print(f"[+] Generated {len(perms)} permutations for {domain}")

        add_outputs(perms_file=out_file, perm_count=len(perms))
  resolve:
    name: Resolve Domains
    needs: [generate]
    outputs:
      registered_file: '{{ steps["dns-resolve"].outputs.registered_file | default("", true) }}'
      registered_count: '{{ steps["dns-resolve"].outputs.registered_count | default("", true) }}'
    steps:
    - name: dns-resolve
      continue-on-error: true
      log-command: "{{ inputs.log_command | default(true) }}"
      script: |
        from ofx.api.dns import resolve_host_sync
        from pathlib import Path

        timeout = float("{{ inputs.resolve_timeout }}")
        perms_file = "{{ jobs.generate.outputs.perms_file }}"

        domains = [
            line.strip()
            for line in Path(perms_file).read_text().splitlines()
            if line.strip()
        ]

        print(f"[*] Resolving {len(domains)} domains (timeout={timeout}s) ...")

        registered = []
        for i, domain in enumerate(domains):
            try:
                ips = resolve_host_sync(domain, timeout=timeout)
                if ips:
                    registered.append({"domain": domain, "ips": ips})
                    print(f"  [+] {domain:<40} -> {', '.join(ips)}")
            except Exception:
                pass

            if (i + 1) % 50 == 0:
                print(f"  ... checked {i + 1}/{len(domains)}")

        out_file = f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_registered_domains.txt"
        with open(out_file, "w") as f:
            for entry in registered:
                f.write(f"{entry['domain']}\t{','.join(entry['ips'])}\n")

        print(f"\n[+] {len(registered)}/{len(domains)} domains resolve (potentially registered)")

        add_outputs(registered_file=out_file, registered_count=len(registered))
  report:
    name: Typosquatting Report
    needs: [generate, resolve]
    steps:
    - name: display-report
      continue-on-error: true
      script: |
        from pathlib import Path

        print("=" * 60)
        print(" DOMAIN TYPOSQUATTING REPORT")
        print(f" Target: {{ inputs.target }}")
        print("=" * 60)

        perm_count = int("{{ jobs.generate.outputs.perm_count }}" or "0")
        registered_count = int("{{ jobs.resolve.outputs.registered_count }}" or "0")

        print(f"\n  Permutations generated: {perm_count}")
        print(f"  Domains registered:    {registered_count}")

        if registered_count > 0:
            print(f"\n--- Registered Lookalike Domains ---")
            reg_file = "{{ jobs.resolve.outputs.registered_file }}"
            try:
                for line in Path(reg_file).read_text().splitlines():
                    if line.strip():
                        parts = line.split("\t")
                        domain = parts[0]
                        ips = parts[1] if len(parts) > 1 else "?"
                        print(f"  [!] {domain:<40} {ips}")
            except Exception:
                pass

            if registered_count > 0:
                print(f"\n[!] WARNING: {registered_count} typosquatting domain(s) appear to be registered")
                print("    These could be used for phishing or brand impersonation")
        else:
            print("\n  [+] No registered lookalike domains found")

        print(f"\n[*] Full permutations: {{ jobs.generate.outputs.perms_file }}")
        print(f"[*] Registered list:   {{ jobs.resolve.outputs.registered_file }}")
      log-stdout: "{{ inputs.log_output | default(true) }}"
