name: external-recon
description: External reconnaissance — passive subdomain enumeration, ASN/IP range
  discovery, and OSINT gathering on a target domain.
tags:
- recon
- osint
- subdomain
- asn
- passive
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target domain (e.g. example.com)
      alias: t
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
    log_output:
      type: string
      default: 'true'
      description: Enable output logging
jobs:
  subdomain-enum:
    name: Subdomain Enumeration
    outputs:
      subdomains: '{{ steps.amass.outputs.stdout }}'
      subfinder_out: '{{ steps.subfinder.outputs.stdout }}'
    steps:
    - name: amass
      module: local.builtin.shell
      with:
        cmd: amass enum -passive -d {{ inputs.target }} -o {{ env.OFX_RUN_DIR }}/subdomains_amass.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
    - name: subfinder
      module: local.builtin.shell
      with:
        cmd: subfinder -d {{ inputs.target }} -o {{ env.OFX_RUN_DIR }}/subdomains_subfinder.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
    - name: merge-subs
      module: local.merge_subdomains
  asn-discovery:
    name: ASN & IP Range Discovery
    needs:
    - subdomain-enum
    outputs:
      cidr_file: '{{ steps.mapcidr.outputs.stdout }}'
    steps:
    - name: asnmap
      module: local.builtin.shell
      with:
        cmd: asnmap -d {{ inputs.target }} -silent
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
    - name: mapcidr
      module: local.builtin.shell
      with:
        cmd: cat {{ env.OFX_RUN_DIR }}/all_subdomains.txt | mapcidr -silent -o {{ env.OFX_RUN_DIR
          }}/cidr_ranges.txt
      continue-on-error: true
      log-command: '{{ inputs.log_command }}'
