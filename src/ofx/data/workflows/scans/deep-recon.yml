name: deep-recon
description: |
  Reconftw-inspired comprehensive reconnaissance — full subdomain discovery,
  DNS verification, permutation bruteforcing, HTTP probing, screenshots,
  takeover detection, and deep per-host scanning in parallel.
  Delegates to full-recon for the complete pipeline.
tags:
  - recon
  - dns
  - web
  - vuln
  - osint
  - comprehensive
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Target domain (e.g. example.com)
      alias: t
jobs:
  run:
    name: Deep Recon
    steps:
      - name: full-recon
        log-command: "{{ inputs.log_command | default(true) }}"
        uses: full-recon
        with:
          target: "{{ inputs.target }}"
