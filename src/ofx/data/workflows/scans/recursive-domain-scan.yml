name: recursive-domain-scan
description: |
  Recursive domain scanner — discovers all subdomains (passive + cert-based +
  permutation), verifies with DNS, then fans out deep host-scan on every
  verified host in parallel via matrix strategy.
tags:
  - recon
  - dns
  - recursive
  - subdomain
  - vuln
  - network
  - http
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Root domain to scan recursively (e.g. example.com)
      alias: t
    max_parallel:
      type: string
      default: "5"
      description: Max concurrent per-subdomain scans
    skip_deep:
      type: string
      default: "false"
      description: Set to true to skip per-host deep scans
defaults:
  store-creds: true
jobs:
  # ── Phase 1: Full Subdomain Discovery ────────────────────────────
  subdomain-discovery:
    name: Subdomain Discovery
    outputs:
      verified_file: '{{ steps["export-verified"].outputs.verified_file | default("", true) }}'
      verified_count: '{{ steps["export-verified"].outputs.verified_count | default("0", true) }}'
      verified_hosts_json: '{{ steps["export-verified"].outputs.verified_hosts_json | default("[]", true) }}'
    steps:
      - name: full-subdomain-scan
        log-command: "{{ inputs.log_command | default(true) }}"
        uses: subdomain-scan
        with:
          target: "{{ inputs.target }}"
      - name: export-verified
        script: |
          import json
          from pathlib import Path

          # subdomain-scan exposes verified hosts via its dns-verify job output
          # Re-export here so recursive-domain-scan has its own output handles
          src = '{{ steps["full-subdomain-scan"].outputs.verified_file | default("", true) }}'
          if src and Path(src).is_file():
              hosts = [l.strip() for l in Path(src).read_text().splitlines() if l.strip()]
          else:
              hosts = ['{{ inputs.target }}']

          verified_path = f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_rds_verified.txt'
          Path(verified_path).write_text('\n'.join(sorted(hosts)))
          add_outputs(
              verified_file=verified_path,
              verified_count=len(hosts),
              verified_hosts_json=json.dumps(sorted(hosts)),
          )
          print(f"Recursive discovery complete: {len(hosts)} verified hosts")

  # ── Phase 2: Per-host Deep Scan ──────────────────────────────────
  per-host-scan:
    name: "Deep scan: {{ matrix.target }}"
    needs: [subdomain-discovery]
    run_if: "{{ inputs.skip_deep != 'true' }}"
    strategy:
      matrix:
        target: "{{ jobs['subdomain-discovery'].outputs.verified_hosts_json }}"
      max_parallel: "{{ inputs.max_parallel | int }}"
      fail_fast: false
    steps:
      - name: scan-host
        log-command: "{{ inputs.log_command | default(true) }}"
        uses: host-scan
        with:
          target: "{{ matrix.target }}"

  # ── Phase 3: Summary ─────────────────────────────────────────────
  summary:
    name: Recursive Scan Summary
    needs: [per-host-scan]
    steps:
      - name: report
        run: |
          echo "======================================================"
          echo " RECURSIVE DOMAIN SCAN COMPLETE: {{ inputs.target }}"
          echo "======================================================"
          echo "Verified hosts:   {{ jobs['subdomain-discovery'].outputs.verified_count }}"
          echo "Deep scans:       {{ inputs.skip_deep == 'true' and 'skipped' or jobs['subdomain-discovery'].outputs.verified_count }}"
        log-stdout: "{{ inputs.log_output | default(true) }}"
      - name: export-to-project
        script: |
          import shutil
          from pathlib import Path

          project = '{{ vars.project_path | default("", true) }}'
          if not project:
              print('No --project set, skipping file export')
          else:
              src = '{{ jobs["subdomain-discovery"].outputs.verified_file | default("", true) }}'
              if src and Path(src).is_file():
                  d = Path('{{ vars.project_subdomains }}')
                  d.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, d / 'verified.txt')
                  print('  [+] subdomains/verified.txt')
              print(f'Project export complete: {project}')
        continue-on-error: true
