name: full-recon
description: >
  Full recursive reconnaissance pipeline — passive + active + cert-based
  subdomain discovery, DNS verification, permutation bruteforcing, HTTP probing,
  screenshots, takeover detection, then deep host-scan on every live host in parallel.
tags:
  - scan
  - recon
  - comprehensive
  - full
  - recursive
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target domain (e.g. example.com)
      alias: t
defaults:
  store-creds: true
jobs:
  # ── Phase 1: Passive Subdomain Discovery ─────────────────────────
  passive-enum:
    name: Passive Subdomain Enumeration
    outputs:
      subs_file: '{{ steps["merge-passive"].outputs.subs_file | default("", true) }}'
      sub_count: '{{ steps["merge-passive"].outputs.sub_count | default("0", true) }}'
    steps:
      - task: subfinder
        name: subfinder-enum
        timeout: 15
        with:
          target: "{{ inputs.target }}"
          all: true
        continue-on-error: true
      - task: amass
        name: amass-passive
        timeout: 30
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      - task: assetfinder
        name: assetfinder-enum
        timeout: 15
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      - task: theharvester
        name: harvester-enum
        timeout: 15
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      - name: merge-passive
        script: |
          import json
          from pathlib import Path

          base = '{{ inputs.target }}'
          subs = {base}

          for item in {{ subdomains(steps["subfinder-enum"].outputs.typed_outputs) | default([], true) | tojson }}:
              if base in item.get('host', ''):
                  subs.add(item['host'])
          for item in {{ subdomains(steps["amass-passive"].outputs.typed_outputs) | default([], true) | tojson }}:
              if base in item.get('host', ''):
                  subs.add(item['host'])
          for item in {{ subdomains(steps["assetfinder-enum"].outputs.typed_outputs) | default([], true) | tojson }}:
              if base in item.get('host', ''):
                  subs.add(item['host'])
          for item in {{ subdomains(steps["harvester-enum"].outputs.typed_outputs) | default([], true) | tojson }}:
              if base in item.get('host', ''):
                  subs.add(item['host'])

          subs_path = f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_fullrecon_subs.txt'
          Path(subs_path).write_text('\n'.join(sorted(subs)))
          add_outputs(subs_file=subs_path, sub_count=len(subs))
          print(f"Passive: {len(subs)} unique subdomains")
      # Recursive pass: re-run subfinder on the full list to catch deeper subs
      - task: subfinder
        name: recursive-subfinder
        timeout: "{{ (steps['merge-passive'].outputs.sub_count | default(50, true) | int / 50 * 15 + 30) | int }}"
        with:
          target: "{{ steps['merge-passive'].outputs.subs_file }}"
          all: true
        continue-on-error: true
      - name: merge-recursive
        script: |
          from pathlib import Path

          base = '{{ inputs.target }}'
          subs_path = '{{ steps["merge-passive"].outputs.subs_file }}'
          initial = {l.strip() for l in Path(subs_path).read_text().splitlines() if l.strip()}
          new_subs = set()
          for item in {{ subdomains(steps["recursive-subfinder"].outputs.typed_outputs) | default([], true) | tojson }}:
              h = item.get('host', '')
              if (h.endswith(f'.{base}') or h == base) and h not in initial:
                  new_subs.add(h)

          all_subs = initial | new_subs
          Path(subs_path).write_text('\n'.join(sorted(all_subs)))
          add_outputs(subs_file=subs_path, sub_count=len(all_subs))
          if new_subs:
              print(f"Recursive: +{len(new_subs)} new = {len(all_subs)} total")
              for s in sorted(new_subs)[:20]:
                  print(f"  [NEW] {s}")
          else:
              print(f"Recursive: {len(all_subs)} subdomains (no new found)")

  # ── Phase 2a: TLS Certificate Enumeration (parallel) ─────────────
  cert-enum:
    name: Certificate SAN Enumeration
    needs: [passive-enum]
    outputs:
      cert_subs_file: '{{ steps["merge-cert"].outputs.cert_subs_file | default("", true) }}'
      cert_sub_count: '{{ steps["merge-cert"].outputs.cert_sub_count | default("0", true) }}'
    steps:
      # Probe TLS on the verified subs — SAN fields reveal sibling hostnames
      - task: tlsx
        name: tls-san-enum
        timeout: 20
        with:
          target: "{{ jobs['passive-enum'].outputs.subs_file }}"
          san: true
          port: "443,8443"
        continue-on-error: true
      # Target cert transparency sources specifically
      - task: subfinder
        name: crtsh-enum
        timeout: 15
        with:
          target: "{{ inputs.target }}"
          sources: "crtsh,certspotter,digitorus"
        continue-on-error: true
      - name: merge-cert
        script: |
          import json
          from pathlib import Path

          base = '{{ inputs.target }}'
          cert_subs = set()

          for item in {{ subdomains(steps["tls-san-enum"].outputs.typed_outputs) | default([], true) | tojson }}:
              h = item.get('host', '')
              if h and base in h:
                  cert_subs.add(h)
          for item in {{ subdomains(steps["crtsh-enum"].outputs.typed_outputs) | default([], true) | tojson }}:
              h = item.get('host', '')
              if h and base in h:
                  cert_subs.add(h)

          cert_path = f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_fullrecon_certsubs.txt'
          Path(cert_path).write_text('\n'.join(sorted(cert_subs)))
          add_outputs(cert_subs_file=cert_path, cert_sub_count=len(cert_subs))
          print(f"Cert/TLS enum: {len(cert_subs)} subdomains from certificates")

  # ── Phase 2b: Permutation Bruteforce (parallel) ──────────────────
  permutation-enum:
    name: Permutation Bruteforce
    needs: [passive-enum]
    outputs:
      perm_subs_file: '{{ steps["resolve-perms"].outputs.output_file | default("", true) }}'
      perm_sub_count: '{{ steps["resolve-perms"].outputs.typed_outputs | default([], true) | length }}'
    steps:
      # Generate permutations from known subs
      - task: gotator
        name: generate-perms
        timeout: 30
        with:
          target: "{{ jobs['passive-enum'].outputs.subs_file }}"
        continue-on-error: true
      # Validate permutations against real DNS (filters wildcards)
      - task: puredns
        name: resolve-perms
        timeout: 20
        if: "{{ steps['generate-perms'].outputs.output_file | default('', true) | length > 0 }}"
        with:
          target: "{{ steps['generate-perms'].outputs.output_file | default('', true) }}"
        continue-on-error: true

  # ── Phase 3: DNS Verification (merge all sources) ─────────────────
  dns-verify:
    name: DNS Verification
    needs: [passive-enum, cert-enum, permutation-enum]
    outputs:
      verified_file: '{{ steps["export-verified"].outputs.verified_file | default("", true) }}'
      verified_count: '{{ steps["export-verified"].outputs.verified_count | default("", true) }}'
      verified_hosts_json: '{{ steps["export-verified"].outputs.verified_hosts_json | default("[]", true) }}'
    steps:
      - name: merge-all-sources
        script: |
          from pathlib import Path

          base = '{{ inputs.target }}'
          all_subs = {base}

          for path_str in [
              '{{ jobs["passive-enum"].outputs.subs_file | default("", true) }}',
              '{{ jobs["cert-enum"].outputs.cert_subs_file | default("", true) }}',
              '{{ jobs["permutation-enum"].outputs.perm_subs_file | default("", true) }}',
          ]:
              if path_str and Path(path_str).is_file():
                  for line in Path(path_str).read_text().splitlines():
                      h = line.strip()
                      if h and base in h:
                          all_subs.add(h)

          merged_path = f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_fullrecon_all.txt'
          Path(merged_path).write_text('\n'.join(sorted(all_subs)))
          add_outputs(merged_file=merged_path, total_count=len(all_subs))
          print(f"Merged: {len(all_subs)} unique subdomains across all sources")
      - task: dnsx
        name: dns-resolve
        timeout: "{{ (steps['merge-all-sources'].outputs.total_count | default(50, true) | int / 50 * 15 + 30) | int }}"
        with:
          target: "{{ steps['merge-all-sources'].outputs.merged_file }}"
          a: true
          aaaa: true
          cname: true
          mx: true
          txt: true
          resp: true
          wildcard_domain: "{{ inputs.target }}"
        continue-on-error: true
      - name: export-verified
        script: |
          import json
          from pathlib import Path

          verified = set()
          for item in {{ subdomains(steps["dns-resolve"].outputs.typed_outputs) | default([], true) | tojson }}:
              h = item.get('host', '')
              if h:
                  verified.add(h)

          verified_list = sorted(verified)
          verified_path = f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_fullrecon_verified.txt'
          Path(verified_path).write_text('\n'.join(verified_list))
          add_outputs(
              verified_file=verified_path,
              verified_count=len(verified_list),
              verified_hosts_json=json.dumps(verified_list),
          )
          print(f"DNS-verified: {len(verified_list)} live hosts")

  # ── Phase 4a: HTTP Probing + Screenshots + CSP Enum ──────────────
  http-probe:
    name: HTTP Probing & Visual Recon
    needs: [dns-verify]
    outputs:
      live_urls_file: '{{ steps["export-live"].outputs.live_urls_file | default("", true) }}'
      live_urls_json: '{{ steps["export-live"].outputs.live_urls_json | default("[]", true) }}'
      live_count: '{{ steps["export-live"].outputs.live_count | default("0", true) }}'
    steps:
      - task: httpx
        name: probe-hosts
        timeout: "{{ (jobs['dns-verify'].outputs.verified_count | default(50, true) | int / 50 * 15 + 30) | int }}"
        with:
          target: "{{ jobs['dns-verify'].outputs.verified_file }}"
          tech_detect: true
          status_code: true
          title: true
          follow_redirects: true
          ports: "80,443,8080,8443,8000,8888"
        continue-on-error: true
      - name: export-live
        script: |
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          live_urls = [
              item.get('url', '') for item in
              {{ urls(steps["probe-hosts"].outputs.typed_outputs) | default([], true) | tojson }}
              if item.get('status_code', 0) > 0 and item.get('url', '')
          ]
          # Deduplicate by hostname — keep one representative URL per host
          seen = {}
          for url in live_urls:
              host = urlparse(url).hostname or url
              if host not in seen:
                  seen[host] = url
          live = sorted(seen.values())

          live_path = f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_fullrecon_live.txt'
          Path(live_path).write_text('\n'.join(live))
          add_outputs(
              live_urls_file=live_path,
              live_urls_json=json.dumps(live),
              live_count=len(live),
          )
          print(f"Live HTTP: {len(live)} unique hosts")
          for u in live[:20]:
              print(f"  {u}")
      # Screenshot all live services for visual recon
      - task: gowitness
        name: screenshots
        timeout: 20
        with:
          target: "{{ steps['export-live'].outputs.live_urls_file }}"
          screenshot_path: "{{ env('OFX_RUN_DIR', '/tmp') }}/ofx_fullrecon_shots"
        continue-on-error: true
      # CSP header analysis — reveals internal/related domains
      - task: csprecon
        name: csp-enum
        timeout: 10
        with:
          target: "{{ steps['export-live'].outputs.live_urls_file }}"
          domain: "{{ inputs.target }}"
        continue-on-error: true

  # ── Phase 4b: Takeover Detection (parallel) ──────────────────────
  takeover-check:
    name: Subdomain Takeover Detection
    needs: [dns-verify]
    outputs:
      takeover_count: '{{ steps["report-takeovers"].outputs.takeover_count | default("0", true) }}'
    steps:
      - task: subzy
        name: subzy-check
        timeout: 15
        with:
          target: "{{ jobs['dns-verify'].outputs.verified_file }}"
        continue-on-error: true
      - task: nuclei
        name: nuclei-takeover
        timeout: 20
        with:
          target: "{{ jobs['dns-verify'].outputs.verified_file }}"
          tags: "subdomain-takeover,takeover,dns"
        continue-on-error: true
      - name: report-takeovers
        script: |
          takeovers = []
          for item in {{ vulns(steps["nuclei-takeover"].outputs.typed_outputs) | default([], true) | tojson }}:
              takeovers.append(f"{item.get('severity','').upper()} {item.get('host','')} — {item.get('name','')}")
          for item in {{ steps["subzy-check"].outputs.typed_outputs | default([], true) | tojson }}:
              if item.get('_type') == 'vulnerability' or item.get('vulnerable'):
                  takeovers.append(f"TAKEOVER {item.get('host', item.get('matched_at', ''))}")
          add_outputs(takeover_count=len(takeovers))
          if takeovers:
              print(f"⚠  {len(takeovers)} potential takeover(s):")
              for t in takeovers:
                  print(f"  {t}")
          else:
              print("No subdomain takeovers detected")

  # ── Phase 4c: Per-host Deep Scan (parallel, matrix) ──────────────
  per-host-recon:
    name: "Recon: {{ matrix.target }}"
    needs: [dns-verify]
    strategy:
      matrix:
        target: "{{ jobs['dns-verify'].outputs.verified_hosts_json }}"
      max_parallel: 5
      fail_fast: false
    steps:
      - name: scan-host
        uses: host-scan
        with:
          target: "{{ matrix.target }}"

  # ── Phase 5: Summary ─────────────────────────────────────────────
  summary:
    name: Full Recon Summary
    needs:
      - per-host-recon
      - takeover-check
      - http-probe
    steps:
      - name: report
        run: |
          echo "======================================================"
          echo " FULL RECON COMPLETE: {{ inputs.target }}"
          echo "======================================================"
          echo ""
          echo "--- Asset Discovery ---"
          echo "Passive subdomains:    {{ jobs['passive-enum'].outputs.sub_count }}"
          echo "Cert/TLS subdomains:   {{ jobs['cert-enum'].outputs.cert_sub_count | default(0) }}"
          echo "Permutation subs:      {{ jobs['permutation-enum'].outputs.perm_sub_count | default(0) }}"
          echo "DNS-verified hosts:    {{ jobs['dns-verify'].outputs.verified_count }}"
          echo "Live HTTP services:    {{ jobs['http-probe'].outputs.live_count }}"
          echo ""
          echo "--- Threats ---"
          echo "Takeover candidates:   {{ jobs['takeover-check'].outputs.takeover_count }}"
          echo ""
          echo "--- Scanning ---"
          echo "Hosts deep-scanned:    {{ jobs['dns-verify'].outputs.verified_count }}"
          echo "(Each host: port scan, service detect, web fingerprint, crawl, vuln scan)"
        log-stdout: true
      - name: export-to-project
        script: |
          import shutil, json
          from pathlib import Path

          project = '{{ vars.project_path | default("", true) }}'
          if not project:
              print('No --project set, skipping file export')
          else:
              d = Path('{{ vars.project_subdomains }}')
              d.mkdir(parents=True, exist_ok=True)
              for label, src_str in [
                  ('subdomains.txt', '{{ jobs["passive-enum"].outputs.subs_file | default("", true) }}'),
                  ('verified.txt',   '{{ jobs["dns-verify"].outputs.verified_file | default("", true) }}'),
              ]:
                  if src_str and Path(src_str).is_file():
                      shutil.copy2(src_str, d / label)
                      print(f'  [+] subdomains/{label}')

              d = Path('{{ vars.project_hosts }}')
              d.mkdir(parents=True, exist_ok=True)
              src = '{{ jobs["http-probe"].outputs.live_urls_file | default("", true) }}'
              if src and Path(src).is_file():
                  shutil.copy2(src, d / 'live-urls.txt')
                  print('  [+] hosts/live-urls.txt')

              all_typed = []
              for typed in [
                  {{ jobs['passive-enum'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['dns-verify'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['http-probe'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['takeover-check'].outputs.typed_outputs | default([], true) | tojson }},
              ]:
                  all_typed.extend(typed)
              for s in export_typed_outputs(project, all_typed):
                  print(s)
              print(f'Project export complete: {project}')
        continue-on-error: true
