name: full-recon
description: >
  Full recursive reconnaissance pipeline — passive + active + cert-based
  subdomain discovery, DNS verification with wildcard detection, permutation
  bruteforcing, port scanning, HTTP probing, WAF detection, SSL/TLS audit,
  URL discovery, parameter mining, secret scanning, vulnerability scanning,
  screenshots, takeover detection, then deep host-scan on every live host.
tags: [scan, recon, comprehensive, full, recursive]
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target domain (e.g. example.com)
      alias: t
defaults:
  store-creds: true
jobs:
  # ── Phase 1: Passive Subdomain Discovery ─────────────────────────
  passive-enum:
    name: Passive Subdomain Enumeration
    outputs:
      subs_file: '{{ steps["merge-passive"].outputs.subs_file | default("", true) }}'
      sub_count: '{{ steps["merge-passive"].outputs.sub_count | default("0", true) }}'
    steps:
      - task: subfinder
        log-command: true
        name: subfinder-enum
        retry: 2
        retry-delay: 5
        with: {target: "{{ inputs.target }}", all: true}
        continue-on-error: true
      - task: amass
        log-command: true
        name: amass-passive
        retry: 2
        retry-delay: 5
        with: {target: "{{ inputs.target }}"}
        continue-on-error: true
      - name: merge-passive
        script: |
          from pathlib import Path
          base = '{{ inputs.target }}'
          subs = {base}
          for item in (
              {{ subdomains(steps["subfinder-enum"].outputs.typed_outputs) | default([], true) | tojson }} +
              {{ subdomains(steps["amass-passive"].outputs.typed_outputs) | default([], true) | tojson }}
          ):
              h = item.get('host', '')
              if h.endswith(f'.{base}') or h == base:
                  subs.add(h)
          subs_path = f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_fullrecon_subs.txt'
          Path(subs_path).write_text('\n'.join(sorted(subs)))
          add_outputs(subs_file=subs_path, sub_count=len(subs))
          print(f"Passive: {len(subs)} unique subdomains")
      # Recursive pass: re-run subfinder on the full list to catch deeper subs
      - task: subfinder
        name: recursive-subfinder
        retry: 2
        retry-delay: 5
        with: {target: "{{ steps['merge-passive'].outputs.subs_file }}", all: true}
        continue-on-error: true
      - name: merge-recursive
        script: |
          from pathlib import Path
          base = '{{ inputs.target }}'
          subs_path = '{{ steps["merge-passive"].outputs.subs_file }}'
          initial = {l.strip() for l in Path(subs_path).read_text().splitlines() if l.strip()}
          new_subs = set()
          for item in {{ subdomains(steps["recursive-subfinder"].outputs.typed_outputs) | default([], true) | tojson }}:
              h = item.get('host', '')
              if (h.endswith(f'.{base}') or h == base) and h not in initial:
                  new_subs.add(h)
          all_subs = initial | new_subs
          Path(subs_path).write_text('\n'.join(sorted(all_subs)))
          add_outputs(subs_file=subs_path, sub_count=len(all_subs))
          if new_subs:
              print(f"Recursive: +{len(new_subs)} new = {len(all_subs)} total")
              for s in sorted(new_subs)[:20]:
                  print(f"  [NEW] {s}")
          else:
              print(f"Recursive: {len(all_subs)} subdomains (no new found)")

  # ── Phase 2a: TLS Certificate Enumeration (parallel) ─────────────
  cert-enum:
    name: Certificate SAN Enumeration
    needs: [passive-enum]
    outputs:
      cert_subs_file: '{{ steps["merge-cert"].outputs.cert_subs_file | default("", true) }}'
      cert_sub_count: '{{ steps["merge-cert"].outputs.cert_sub_count | default("0", true) }}'
    steps:
      - task: tlsx
        log-command: true
        name: tls-san-enum
        retry: 2
        retry-delay: 5
        with: {target: "{{ jobs['passive-enum'].outputs.subs_file }}", san: true, port: "443,8443"}
        continue-on-error: true
      - name: merge-cert
        script: |
          from pathlib import Path
          base = '{{ inputs.target }}'
          cert_subs = set()
          for item in {{ subdomains(steps["tls-san-enum"].outputs.typed_outputs) | default([], true) | tojson }}:
              h = item.get('host', '')
              if h and (h.endswith(f'.{base}') or h == base):
                  cert_subs.add(h)
          cert_path = f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_fullrecon_certsubs.txt'
          Path(cert_path).write_text('\n'.join(sorted(cert_subs)))
          add_outputs(cert_subs_file=cert_path, cert_sub_count=len(cert_subs))
          print(f"Cert/TLS enum: {len(cert_subs)} subdomains from certificates")

  # ── Phase 2b: Permutation Bruteforce (parallel) ──────────────────
  permutation-enum:
    name: Permutation Bruteforce
    needs: [passive-enum]
    outputs:
      perm_subs_file: '{{ steps["resolve-perms"].outputs.output_file | default("", true) }}'
      perm_sub_count: '{{ steps["resolve-perms"].outputs.typed_outputs | default([], true) | length }}'
    steps:
      - task: gotator
        log-command: true
        name: generate-perms
        retry: 2
        retry-delay: 5
        with: {target: "{{ jobs['passive-enum'].outputs.subs_file }}"}
        continue-on-error: true
      - task: puredns
        log-command: true
        name: resolve-perms
        retry: 2
        retry-delay: 5
        if: "{{ steps['generate-perms'].outputs.output_file | default('', true) | length > 0 }}"
        with: {target: "{{ steps['generate-perms'].outputs.output_file | default('', true) }}"}
        continue-on-error: true

  # ── Phase 3: DNS Verification + Wildcard Detection ───────────────
  dns-verify:
    name: DNS Verification
    needs: [passive-enum, cert-enum, permutation-enum]
    outputs:
      verified_file: '{{ steps["filter-wildcards"].outputs.verified_file | default("", true) }}'
      verified_count: '{{ steps["filter-wildcards"].outputs.verified_count | default("0", true) }}'
      verified_hosts_json: '{{ steps["filter-wildcards"].outputs.verified_hosts_json | default("[]", true) }}'
      wildcard_detected: '{{ steps["filter-wildcards"].outputs.wildcard_detected | default("false", true) }}'
    steps:
      - name: merge-all-sources
        script: |
          from pathlib import Path
          base = '{{ inputs.target }}'
          all_subs = {base}
          for path_str in [
              '{{ jobs["passive-enum"].outputs.subs_file | default("", true) }}',
              '{{ jobs["cert-enum"].outputs.cert_subs_file | default("", true) }}',
              '{{ jobs["permutation-enum"].outputs.perm_subs_file | default("", true) }}',
          ]:
              if path_str and Path(path_str).is_file():
                  for line in Path(path_str).read_text().splitlines():
                      h = line.strip()
                      if h and (h.endswith(f'.{base}') or h == base):
                          all_subs.add(h)
          merged_path = f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_fullrecon_all.txt'
          Path(merged_path).write_text('\n'.join(sorted(all_subs)))
          add_outputs(merged_file=merged_path, total_count=len(all_subs))
          print(f"Merged: {len(all_subs)} unique subdomains across all sources")
      - task: dnsx
        log-command: true
        name: dns-resolve
        retry: 2
        retry-delay: 5
        with: {target: "{{ steps['merge-all-sources'].outputs.merged_file }}", a: true, aaaa: true, cname: true, mx: true, txt: true, resp: true, wildcard_domain: "{{ inputs.target }}"}
        continue-on-error: true
      - name: filter-wildcards
        script: |
          import json, socket, uuid
          from pathlib import Path
          base = '{{ inputs.target }}'
          verified = set()
          for item in {{ subdomains(steps["dns-resolve"].outputs.typed_outputs) | default([], true) | tojson }}:
              h = item.get('host', '')
              if h and (h.endswith(f'.{base}') or h == base):
                  verified.add(h)
          print(f"DNS-verified: {len(verified)} live hosts")
          # Detect wildcard DNS by resolving random subdomains
          wildcard_ips = set()
          for _ in range(3):
              probe = f'{uuid.uuid4().hex[:12]}.{base}'
              try:
                  wildcard_ips |= {r[4][0] for r in socket.getaddrinfo(probe, None, socket.AF_INET)}
              except socket.gaierror:
                  pass
          wildcard_detected = bool(wildcard_ips)
          if wildcard_detected:
              print(f"⚠  Wildcard DNS detected! IPs: {', '.join(sorted(wildcard_ips))}")
              filtered = set()
              for host in verified:
                  try:
                      host_ips = {r[4][0] for r in socket.getaddrinfo(host, None, socket.AF_INET)}
                      if host_ips - wildcard_ips:
                          filtered.add(host)
                  except socket.gaierror:
                      pass
              print(f"Filtered: {len(verified)} → {len(filtered)} (removed {len(verified) - len(filtered)} wildcard matches)")
              verified = filtered
          verified_list = sorted(verified)
          verified_path = f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_fullrecon_verified.txt'
          Path(verified_path).write_text('\n'.join(verified_list))
          add_outputs(
              verified_file=verified_path, verified_count=len(verified_list),
              verified_hosts_json=json.dumps(verified_list),
              wildcard_detected=str(wildcard_detected).lower(),
          )

  # ── Phase 4a: Port Scanning ──────────────────────────────────────
  port-scan:
    name: Port Scanning
    needs: [dns-verify]
    outputs:
      open_ports_file: '{{ steps["merge-ports"].outputs.open_ports_file | default("", true) }}'
      open_port_count: '{{ steps["merge-ports"].outputs.open_port_count | default("0", true) }}'
    steps:
      - task: naabu
        name: naabu-scan
        retry: 2
        retry-delay: 5
        with: {target: "{{ jobs['dns-verify'].outputs.verified_file }}", top_ports: "1000", rate: 1000}
        continue-on-error: true
      - task: nmap
        name: nmap-version
        retry: 2
        retry-delay: 5
        with: {target: "{{ jobs['dns-verify'].outputs.verified_file }}", version_detection: true, top_ports: 100, timing: 4}
        continue-on-error: true
      - name: merge-ports
        script: |
          from pathlib import Path
          seen = set()
          ports_data = []
          for item in (
              {{ ports(steps["naabu-scan"].outputs.typed_outputs) | default([], true) | tojson }} +
              {{ ports(steps["nmap-version"].outputs.typed_outputs) | default([], true) | tojson }}
          ):
              key = f"{item.get('host', '')}:{item.get('port', '')}"
              if key not in seen:
                  seen.add(key)
                  ports_data.append(key)
          ports_path = f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_fullrecon_ports.txt'
          Path(ports_path).write_text('\n'.join(sorted(ports_data)))
          add_outputs(open_ports_file=ports_path, open_port_count=len(ports_data))
          print(f"Open ports: {len(ports_data)} unique host:port pairs")

  # ── Phase 4b: HTTP Probing, WAF Detection & Visual Recon ─────────
  http-probe:
    name: HTTP Probing & WAF Detection
    needs: [dns-verify]
    outputs:
      live_urls_file: '{{ steps["export-live"].outputs.live_urls_file | default("", true) }}'
      live_urls_json: '{{ steps["export-live"].outputs.live_urls_json | default("[]", true) }}'
      live_count: '{{ steps["export-live"].outputs.live_count | default("0", true) }}'
      waf_detected_count: '{{ steps["waf-report"].outputs.waf_detected_count | default("0", true) }}'
    steps:
      - task: httpx
        log-command: true
        name: probe-hosts
        retry: 2
        retry-delay: 5
        with: {target: "{{ jobs['dns-verify'].outputs.verified_file }}", tech_detect: true, status_code: true, title: true, follow_redirects: true, ports: "80,443,8080,8443,8000,8888"}
        continue-on-error: true
      - name: export-live
        script: |
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          live_urls = [
              item.get('url', '') for item in
              {{ urls(steps["probe-hosts"].outputs.typed_outputs) | default([], true) | tojson }}
              if item.get('status_code', 0) > 0 and item.get('url', '')
          ]
          # Deduplicate by hostname — keep one representative URL per host
          seen = {}
          for url in live_urls:
              host = urlparse(url).hostname or url
              if host not in seen:
                  seen[host] = url
          live = sorted(seen.values())
          live_path = f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_fullrecon_live.txt'
          Path(live_path).write_text('\n'.join(live))
          add_outputs(
              live_urls_file=live_path,
              live_urls_json=json.dumps(live),
              live_count=len(live),
          )
          print(f"Live HTTP: {len(live)} unique hosts")
      - task: wafw00f
        name: waf-detect
        retry: 2
        retry-delay: 5
        run_if: "{{ steps['export-live'].outputs.live_count | default(0, true) | int > 0 }}"
        with: {target: "{{ steps['export-live'].outputs.live_urls_file }}", all: true}
        continue-on-error: true
      - name: waf-report
        script: |
          waf_tags = {{ tags(steps["waf-detect"].outputs.typed_outputs) | default([], true) | tojson }}
          waf_count = len([t for t in waf_tags if t.get('name', '')])
          add_outputs(waf_detected_count=waf_count)
          if waf_count:
              print(f"🛡  WAF detected on {waf_count} target(s):")
              for t in waf_tags[:20]:
                  print(f"  {t.get('host', '?')} → {t.get('name', 'unknown')}")
          else:
              print("No WAF detected")
      # Screenshot all live services for visual recon
      - task: gowitness
        log-command: true
        name: screenshots
        retry: 2
        retry-delay: 5
        with: {target: "{{ steps['export-live'].outputs.live_urls_file }}", screenshot_path: "{{ env('OFX_RUN_DIR', '/tmp') }}/ofx_fullrecon_shots"}
        continue-on-error: true
      # CSP header analysis — reveals internal/related domains
      - task: csprecon
        name: csp-enum
        retry: 2
        retry-delay: 5
        with: {target: "{{ steps['export-live'].outputs.live_urls_file }}", domain: "{{ inputs.target }}"}
        continue-on-error: true

  # ── Phase 4c: SSL/TLS Audit ──────────────────────────────────────
  ssl-audit:
    name: SSL/TLS Audit
    needs: [dns-verify]
    outputs:
      ssl_issues_count: '{{ steps["ssl-report"].outputs.ssl_issues_count | default("0", true) }}'
    steps:
      - task: testssl
        name: testssl-scan
        retry: 2
        retry-delay: 5
        with: {target: "{{ jobs['dns-verify'].outputs.verified_file }}", protocols: true, vulnerabilities: true}
        continue-on-error: true
      - name: ssl-report
        script: |
          issues = []
          for item in {{ vulns(steps["testssl-scan"].outputs.typed_outputs) | default([], true) | tojson }}:
              issues.append(f"{item.get('severity', '').upper()} {item.get('host', '')} — {item.get('name', '')}")
          add_outputs(ssl_issues_count=len(issues))

  # ── Phase 4d: Subdomain Takeover Detection ───────────────────────
  takeover-check:
    name: Subdomain Takeover Detection
    needs: [dns-verify]
    outputs:
      takeover_count: '{{ steps["report-takeovers"].outputs.takeover_count | default("0", true) }}'
    steps:
      - task: subzy
        log-command: true
        name: subzy-check
        retry: 2
        retry-delay: 5
        with: {target: "{{ jobs['dns-verify'].outputs.verified_file }}"}
        continue-on-error: true
      - task: nuclei
        log-command: true
        name: nuclei-takeover
        retry: 2
        retry-delay: 5
        with: {target: "{{ jobs['dns-verify'].outputs.verified_file }}", tags: "subdomain-takeover,takeover,dns"}
        continue-on-error: true
      - name: report-takeovers
        script: |
          takeovers = []
          for item in {{ vulns(steps["nuclei-takeover"].outputs.typed_outputs) | default([], true) | tojson }}:
              takeovers.append(f"{item.get('severity','').upper()} {item.get('host','')} — {item.get('name','')}")
          for item in {{ steps["subzy-check"].outputs.typed_outputs | default([], true) | tojson }}:
              if item.get('_type') == 'vulnerability' or item.get('vulnerable'):
                  takeovers.append(f"TAKEOVER {item.get('host', item.get('matched_at', ''))}")
          add_outputs(takeover_count=len(takeovers))
          if takeovers:
              print(f"⚠  {len(takeovers)} potential takeover(s):")
              for t in takeovers:
                  print(f"  {t}")
          else:
              print("No subdomain takeovers detected")

  # ── Phase 4e: Per-host Deep Scan (parallel, matrix) ──────────────
  per-host-recon:
    name: "Recon: {{ matrix.target }}"
    needs: [dns-verify]
    strategy:
      matrix:
        target: "{{ jobs['dns-verify'].outputs.verified_hosts_json }}"
      max_parallel: 5
      fail_fast: false
    steps:
      - name: scan-host
        log-command: true
        uses: host-scan
        with: {target: "{{ matrix.target }}"}

  # ── Phase 5: URL Discovery & Parameter Mining ────────────────────
  url-discovery:
    name: URL Discovery & Parameter Mining
    needs: [http-probe]
    outputs:
      all_urls_file: '{{ steps["merge-urls"].outputs.all_urls_file | default("", true) }}'
      all_urls_count: '{{ steps["merge-urls"].outputs.all_urls_count | default("0", true) }}'
      param_urls_file: '{{ steps["merge-urls"].outputs.param_urls_file | default("", true) }}'
      param_urls_count: '{{ steps["merge-urls"].outputs.param_urls_count | default("0", true) }}'
    steps:
      # Passive URL collection from web archives
      - task: waymore
        name: waymore-urls
        retry: 2
        retry-delay: 5
        with: {target: "{{ inputs.target }}"}
        continue-on-error: true
      - task: gau
        name: gau-urls
        retry: 2
        retry-delay: 5
        with: {target: "{{ inputs.target }}"}
        continue-on-error: true
      # Active crawling on live hosts
      - task: katana
        name: katana-crawl
        retry: 2
        retry-delay: 5
        run_if: "{{ jobs['http-probe'].outputs.live_count | default(0, true) | int > 0 }}"
        with: {target: "{{ jobs['http-probe'].outputs.live_urls_file }}", depth: 3, js_crawl: true, scope: "{{ inputs.target }}"}
        continue-on-error: true
      # Parameter discovery
      - task: paramspider
        name: paramspider-mine
        retry: 2
        retry-delay: 5
        with: {target: "{{ inputs.target }}"}
        continue-on-error: true
      - task: arjun
        name: arjun-discover
        retry: 2
        retry-delay: 5
        run_if: "{{ jobs['http-probe'].outputs.live_count | default(0, true) | int > 0 }}"
        with: {target: "{{ jobs['http-probe'].outputs.live_urls_file }}", threads: 5}
        continue-on-error: true
      - name: merge-urls
        script: |
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          base = '{{ inputs.target }}'
          all_urls = set()
          for item in (
              {{ urls(steps["waymore-urls"].outputs.typed_outputs) | default([], true) | tojson }} +
              {{ urls(steps["gau-urls"].outputs.typed_outputs) | default([], true) | tojson }} +
              {{ urls(steps["katana-crawl"].outputs.typed_outputs) | default([], true) | tojson }} +
              {{ urls(steps["paramspider-mine"].outputs.typed_outputs) | default([], true) | tojson }} +
              {{ urls(steps["arjun-discover"].outputs.typed_outputs) | default([], true) | tojson }}
          ):
              u = item.get('url', '')
              if u:
                  host = urlparse(u).hostname or ''
                  if host.endswith(f'.{base}') or host == base:
                      all_urls.add(u)
          param_urls = {u for u in all_urls if '=' in urlparse(u).query}
          run_dir = os.environ.get('OFX_RUN_DIR', '/tmp')
          urls_path = f'{run_dir}/ofx_fullrecon_urls.txt'
          params_path = f'{run_dir}/ofx_fullrecon_param_urls.txt'
          Path(urls_path).write_text('\n'.join(sorted(all_urls)))
          Path(params_path).write_text('\n'.join(sorted(param_urls)))
          add_outputs(
              all_urls_file=urls_path, all_urls_count=len(all_urls),
              param_urls_file=params_path, param_urls_count=len(param_urls),
          )
          print(f"URLs discovered: {len(all_urls)} total, {len(param_urls)} with parameters")

  # ── Phase 5b: Secret & Exposure Scanning ─────────────────────────
  secret-scan:
    name: Secret & Exposure Scanning
    needs: [http-probe]
    outputs:
      secrets_count: '{{ steps["secret-report"].outputs.secrets_count | default("0", true) }}'
    steps:
      - task: nuclei
        name: nuclei-exposure
        retry: 2
        retry-delay: 5
        run_if: "{{ jobs['http-probe'].outputs.live_count | default(0, true) | int > 0 }}"
        with: {target: "{{ jobs['http-probe'].outputs.live_urls_file }}", tags: "exposure,secret,token,api-key"}
        continue-on-error: true
      - task: gitleaks
        name: gitleaks-scan
        retry: 2
        retry-delay: 5
        with: {target: "{{ inputs.target }}", source: "{{ env('OFX_RUN_DIR', '/tmp') }}"}
        continue-on-error: true
      - name: secret-report
        script: |
          findings = []
          for item in {{ vulns(steps["nuclei-exposure"].outputs.typed_outputs) | default([], true) | tojson }}:
              findings.append(f"{item.get('severity','').upper()} {item.get('host','')} — {item.get('name','')}")
          for item in {{ tags(steps["gitleaks-scan"].outputs.typed_outputs) | default([], true) | tojson }}:
              findings.append(f"SECRET {item.get('name', 'leak')} in {item.get('host', 'file')}")
          add_outputs(secrets_count=len(findings))
          if findings:
              print(f"🔑 {len(findings)} secret/exposure finding(s):")
              for f in findings[:20]:
                  print(f"  {f}")
          else:
              print("No exposed secrets found")

  # ── Phase 6: Vulnerability Scanning ──────────────────────────────
  vuln-scan:
    name: Vulnerability Scanning
    needs: [url-discovery]
    outputs:
      vuln_critical: '{{ steps["vuln-report"].outputs.vuln_critical | default("0", true) }}'
      vuln_high: '{{ steps["vuln-report"].outputs.vuln_high | default("0", true) }}'
      vuln_medium: '{{ steps["vuln-report"].outputs.vuln_medium | default("0", true) }}'
      vuln_total: '{{ steps["vuln-report"].outputs.vuln_total | default("0", true) }}'
    steps:
      - task: nuclei
        name: nuclei-vuln
        retry: 2
        retry-delay: 5
        run_if: "{{ jobs['url-discovery'].outputs.all_urls_count | default(0, true) | int > 0 }}"
        with: {target: "{{ jobs['url-discovery'].outputs.all_urls_file }}", severity: "critical,high,medium"}
        continue-on-error: true
      - task: dalfox
        name: dalfox-xss
        retry: 2
        retry-delay: 5
        run_if: "{{ jobs['url-discovery'].outputs.param_urls_count | default(0, true) | int > 0 }}"
        with: {target: "{{ jobs['url-discovery'].outputs.param_urls_file }}"}
        continue-on-error: true
      - task: sqlmap
        name: sqlmap-sqli
        retry: 2
        retry-delay: 5
        run_if: "{{ jobs['url-discovery'].outputs.param_urls_count | default(0, true) | int > 0 }}"
        with: {target: "{{ jobs['url-discovery'].outputs.param_urls_file }}", level: 2, risk: 2, random_agent: true}
        continue-on-error: true
      - task: crlfuzz
        name: crlfuzz-scan
        retry: 2
        retry-delay: 5
        run_if: "{{ jobs['url-discovery'].outputs.all_urls_count | default(0, true) | int > 0 }}"
        with: {target: "{{ jobs['url-discovery'].outputs.all_urls_file }}"}
        continue-on-error: true
      - task: commix
        name: commix-cmdi
        retry: 2
        retry-delay: 5
        run_if: "{{ jobs['url-discovery'].outputs.param_urls_count | default(0, true) | int > 0 }}"
        with: {target: "{{ jobs['url-discovery'].outputs.param_urls_file }}", batch: true}
        continue-on-error: true
      - name: vuln-report
        script: |
          all_vulns = (
              {{ vulns(steps["nuclei-vuln"].outputs.typed_outputs) | default([], true) | tojson }} +
              {{ vulns(steps["dalfox-xss"].outputs.typed_outputs) | default([], true) | tojson }} +
              {{ vulns(steps["sqlmap-sqli"].outputs.typed_outputs) | default([], true) | tojson }} +
              {{ vulns(steps["crlfuzz-scan"].outputs.typed_outputs) | default([], true) | tojson }} +
              {{ vulns(steps["commix-cmdi"].outputs.typed_outputs) | default([], true) | tojson }}
          )
          by_sev = {}
          for v in all_vulns:
              sev = (v.get('severity', '') or 'unknown').lower()
              by_sev.setdefault(sev, []).append(v)
          add_outputs(
              vuln_critical=len(by_sev.get('critical', [])),
              vuln_high=len(by_sev.get('high', [])),
              vuln_medium=len(by_sev.get('medium', [])),
              vuln_total=len(all_vulns),
          )
          for sev in ['critical', 'high', 'medium']:
              items = by_sev.get(sev, [])
              if items:
                  print(f"[{sev.upper()}] {len(items)} finding(s)")
                  for v in items[:5]:
                      print(f"  {v.get('host', '')} — {v.get('name', '')}")
          if not all_vulns:
              print("No vulnerabilities found")

  # ── Phase 7: Summary ─────────────────────────────────────────────
  summary:
    name: Full Recon Summary
    needs:
      - per-host-recon
      - takeover-check
      - http-probe
      - port-scan
      - ssl-audit
      - secret-scan
      - vuln-scan
      - url-discovery
    steps:
      - name: report
        run: |
          echo "======================================================"
          echo " FULL RECON COMPLETE: {{ inputs.target }}"
          echo "======================================================"
          echo ""
          echo "--- Asset Discovery ---"
          echo "Passive subdomains:    {{ jobs['passive-enum'].outputs.sub_count }}"
          echo "Cert/TLS subdomains:   {{ jobs['cert-enum'].outputs.cert_sub_count | default(0) }}"
          echo "Permutation subs:      {{ jobs['permutation-enum'].outputs.perm_sub_count | default(0) }}"
          echo "DNS-verified hosts:    {{ jobs['dns-verify'].outputs.verified_count }}"
          echo "Wildcard DNS:          {{ jobs['dns-verify'].outputs.wildcard_detected }}"
          echo ""
          echo "--- Infrastructure ---"
          echo "Open ports found:      {{ jobs['port-scan'].outputs.open_port_count | default(0) }}"
          echo "Live HTTP services:    {{ jobs['http-probe'].outputs.live_count }}"
          echo "WAF detections:        {{ jobs['http-probe'].outputs.waf_detected_count | default(0) }}"
          echo "SSL/TLS issues:        {{ jobs['ssl-audit'].outputs.ssl_issues_count | default(0) }}"
          echo ""
          echo "--- Reconnaissance ---"
          echo "URLs discovered:       {{ jobs['url-discovery'].outputs.all_urls_count | default(0) }}"
          echo "Parameterized URLs:    {{ jobs['url-discovery'].outputs.param_urls_count | default(0) }}"
          echo "Secrets/exposures:     {{ jobs['secret-scan'].outputs.secrets_count | default(0) }}"
          echo ""
          echo "--- Threats ---"
          echo "Takeover candidates:   {{ jobs['takeover-check'].outputs.takeover_count }}"
          echo "Vulns (critical):      {{ jobs['vuln-scan'].outputs.vuln_critical | default(0) }}"
          echo "Vulns (high):          {{ jobs['vuln-scan'].outputs.vuln_high | default(0) }}"
          echo "Vulns (medium):        {{ jobs['vuln-scan'].outputs.vuln_medium | default(0) }}"
          echo "Vulns total:           {{ jobs['vuln-scan'].outputs.vuln_total | default(0) }}"
          echo ""
          echo "--- Scanning ---"
          echo "Hosts deep-scanned:    {{ jobs['dns-verify'].outputs.verified_count }}"
          echo "(Each host: port scan, service detect, web fingerprint, crawl, vuln scan)"
        log-stdout: true
      - name: export-to-project
        script: |
          import shutil, json
          from pathlib import Path
          project = '{{ vars.project_path | default("", true) }}'
          if not project:
              print('No --project set, skipping file export')
          else:
              d = Path('{{ vars.project_subdomains }}')
              d.mkdir(parents=True, exist_ok=True)
              for label, src_str in [
                  ('subdomains.txt', '{{ jobs["passive-enum"].outputs.subs_file | default("", true) }}'),
                  ('verified.txt',   '{{ jobs["dns-verify"].outputs.verified_file | default("", true) }}'),
              ]:
                  if src_str and Path(src_str).is_file():
                      shutil.copy2(src_str, d / label)
                      print(f'  [+] subdomains/{label}')
              d = Path('{{ vars.project_hosts }}')
              d.mkdir(parents=True, exist_ok=True)
              for label, src_str in [
                  ('live-urls.txt',    '{{ jobs["http-probe"].outputs.live_urls_file | default("", true) }}'),
                  ('open-ports.txt',   '{{ jobs["port-scan"].outputs.open_ports_file | default("", true) }}'),
                  ('all-urls.txt',     '{{ jobs["url-discovery"].outputs.all_urls_file | default("", true) }}'),
                  ('param-urls.txt',   '{{ jobs["url-discovery"].outputs.param_urls_file | default("", true) }}'),
              ]:
                  if src_str and Path(src_str).is_file():
                      shutil.copy2(src_str, d / label)
                      print(f'  [+] hosts/{label}')
              all_typed = []
              for typed in [
                  {{ jobs['passive-enum'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['dns-verify'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['http-probe'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['takeover-check'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['port-scan'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['ssl-audit'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['secret-scan'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['vuln-scan'].outputs.typed_outputs | default([], true) | tojson }},
              ]:
                  all_typed.extend(typed)
              for s in export_typed_outputs(project, all_typed):
                  print(s)
              print(f'Project export complete: {project}')
        continue-on-error: true
