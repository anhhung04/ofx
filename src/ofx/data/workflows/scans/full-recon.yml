name: full-recon
description: 'Full reconnaissance pipeline — comprehensive target assessment combining subdomain discovery, DNS enumeration, port scanning, service detection, web crawling, vulnerability scanning, and OSINT.

  '
tags:
- scan
- recon
- comprehensive
- full
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target domain (e.g. example.com)
      alias: t
jobs:
  subdomain-enum:
    name: Subdomain Enumeration
    outputs:
      subs_file: '{{ steps.collect-subdomains.outputs.subs_file }}'
      sub_count: '{{ steps.collect-subdomains.outputs.sub_count }}'
    steps:
    - task: subfinder
      name: subfinder-enum
      with:
        target: '{{ inputs.target }}'
        all: true
      continue-on-error: true
    - name: amass-passive
      run: |
        amass enum -passive -d {{ inputs.target }} 2>/dev/null | tee /tmp/amass-subs.txt
      continue-on-error: true
    - name: assetfinder-enum
      run: |
        assetfinder --subs-only {{ inputs.target }} 2>/dev/null | tee /tmp/assetfinder-subs.txt
      continue-on-error: true
    - name: collect-subdomains
      script: |
        import json

        subs = set()
        subs.add('{{ inputs.target }}')

        # From subfinder
        sf_outputs = {{ steps["subfinder-enum"].outputs.typed_outputs | tojson }}
        for item in sf_outputs:
            if item.get('_type') == 'subdomain':
                subs.add(item['host'])

        # From amass
        try:
            with open('/tmp/amass-subs.txt') as f:
                for line in f:
                    sub = line.strip()
                    if sub and '{{ inputs.target }}' in sub:
                        subs.add(sub)
        except FileNotFoundError:
            pass

        # From assetfinder
        try:
            with open('/tmp/assetfinder-subs.txt') as f:
                for line in f:
                    sub = line.strip()
                    if sub and '{{ inputs.target }}' in sub:
                        subs.add(sub)
        except FileNotFoundError:
            pass

        with open('/tmp/subs.txt', 'w') as f:
            f.write('\n'.join(sorted(subs)))

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"subs_file=/tmp/subs.txt\n")
            f.write(f"sub_count={len(subs)}\n")

        print(f"Collected {len(subs)} unique subdomains")
  dns-resolve:
    name: DNS Resolution
    needs:
    - subdomain-enum
    outputs:
      verified_file: '{{ steps.export-verified.outputs.verified_file }}'
      verified_count: '{{ steps.export-verified.outputs.verified_count }}'
    steps:
    - task: dnsx
      name: dns-verify
      with:
        target: '{{ jobs[''subdomain-enum''].outputs.subs_file }}'
        a: true
        cname: true
        resp: true
      continue-on-error: true
    - name: dnsrecon-enum
      run: |
        dnsrecon -d {{ inputs.target }} --no_color 2>/dev/null | tee /tmp/dnsrecon-output.txt
      continue-on-error: true
    - name: export-verified
      script: |
        import json

        verified = set()
        dnsx_out = {{ steps["dns-verify"].outputs.typed_outputs | tojson }}
        for item in dnsx_out:
            host = item.get('host', '')
            if host:
                verified.add(host)

        with open('/tmp/ofx_fullrecon_verified.txt', 'w') as f:
            f.write('\n'.join(sorted(verified)))

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"verified_file=/tmp/ofx_fullrecon_verified.txt\n")
            f.write(f"verified_count={len(verified)}\n")

        print(f"Verified {len(verified)} subdomains via DNS")
  port-scan:
    name: Port Scanning
    needs:
    - dns-resolve
    outputs:
      ports_file: '{{ steps.export-ports.outputs.ports_file }}'
      port_count: '{{ steps.export-ports.outputs.port_count }}'
      port_hosts_file: '{{ steps.export-ports.outputs.port_hosts_file }}'
    steps:
    - task: naabu
      name: naabu-scan
      with:
        target: '{{ jobs[''dns-resolve''].outputs.verified_file | default(jobs[''subdomain-enum''].outputs.subs_file, true) }}'
        top_ports: '1000'
        rate: 1000
      continue-on-error: true
    - name: export-ports
      script: |
        import json

        ports = set()
        hosts = set()
        naabu_out = {{ steps["naabu-scan"].outputs.typed_outputs | tojson }}
        for item in naabu_out:
            if item.get('_type') == 'port':
                host = item.get('host') or item.get('ip', '')
                port = item.get('port', '')
                if host and port:
                    ports.add(f"{host}:{port}")
                    hosts.add(host)

        with open('/tmp/ofx_fullrecon_ports.txt', 'w') as f:
            f.write('\n'.join(sorted(ports)))
        with open('/tmp/ofx_fullrecon_porthosts.txt', 'w') as f:
            f.write('\n'.join(sorted(hosts)))

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"ports_file=/tmp/ofx_fullrecon_ports.txt\n")
            f.write(f"port_count={len(ports)}\n")
            f.write(f"port_hosts_file=/tmp/ofx_fullrecon_porthosts.txt\n")

        print(f"Found {len(ports)} open ports across {len(hosts)} hosts")
  http-probe:
    name: HTTP Probing
    needs:
    - dns-resolve
    outputs:
      live_urls: '{{ steps.export-live.outputs.live_urls }}'
      live_count: '{{ steps.export-live.outputs.live_count }}'
    steps:
    - task: httpx
      name: probe-subs
      with:
        target: '{{ jobs[''dns-resolve''].outputs.verified_file | default(jobs[''subdomain-enum''].outputs.subs_file, true) }}'
        tech_detect: true
        status_code: true
        title: true
        follow_redirects: true
      continue-on-error: true
    - name: export-live
      run: |
        echo "live_urls={{ urls(steps["probe-subs"].outputs.typed_outputs) | selectattr('status_code', 'gt', 0) | map(attribute='url') | unique | join('\n') }}" >> $OFX_OUTPUTS
        echo "live_count={{ urls(steps["probe-subs"].outputs.typed_outputs) | selectattr('status_code', 'gt', 0) | list | length }}" >> $OFX_OUTPUTS
  web-crawl:
    name: Web Crawling
    needs:
    - http-probe
    outputs:
      crawled_file: '{{ steps.collect-urls.outputs.crawled_file }}'
      crawl_count: '{{ steps.collect-urls.outputs.crawl_count }}'
    steps:
    - task: katana
      name: katana-crawl
      with:
        target: '{{ jobs[''http-probe''].outputs.live_urls | default(inputs.target, true) }}'
        depth: 3
      continue-on-error: true
    - task: gau
      name: gau-archive
      with:
        target: '{{ inputs.target }}'
        subs: true
      continue-on-error: true
    - name: hakrawler-crawl
      run: |
        echo "{{ jobs['http-probe'].outputs.live_urls | default(inputs.target, true) }}" | hakrawler -d 2 -subs 2>/dev/null | tee /tmp/hakrawler-urls.txt
      continue-on-error: true
    - name: collect-urls
      script: |
        import json

        urls = set()
        for idx in [0, 1]:
            step_data = {{ steps | tojson }}
            typed = step_data[idx].get('outputs', {}).get('typed_outputs', [])
            for item in typed:
                if item.get('_type') == 'url':
                    urls.add(item['url'])

        # From hakrawler
        try:
            with open('/tmp/hakrawler-urls.txt') as f:
                for line in f:
                    u = line.strip()
                    if u and u.startswith('http'):
                        urls.add(u)
        except FileNotFoundError:
            pass

        with open('/tmp/ofx_fullrecon_crawled.txt', 'w') as f:
            f.write('\n'.join(sorted(urls)))

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"crawled_file=/tmp/ofx_fullrecon_crawled.txt\n")
            f.write(f"crawl_count={len(urls)}\n")

        print(f"Crawled {len(urls)} unique URLs")
  takeover-check:
    name: Subdomain Takeover Check
    needs:
    - dns-resolve
    outputs:
      takeover_count: '{{ steps.export-takeovers.outputs.takeover_count }}'
    steps:
    - name: subzy-check
      run: |
        cat {{ jobs['dns-resolve'].outputs.verified_file }} > /tmp/verified-subs.txt
        subzy run --targets /tmp/verified-subs.txt --hide_fails 2>/dev/null | tee /tmp/subzy-output.txt
      continue-on-error: true
    - name: export-takeovers
      script: |
        takeovers = []
        try:
            with open('/tmp/subzy-output.txt') as f:
                for line in f:
                    line = line.strip()
                    if line and 'VULNERABLE' in line.upper():
                        takeovers.append(line)
        except FileNotFoundError:
            pass

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"takeover_count={len(takeovers)}\n")

        print(f"Potential takeovers: {len(takeovers)}")
  fingerprint:
    name: Fingerprinting
    needs:
    - http-probe
    steps:
    - name: whatweb-scan
      run: |
        echo "{{ jobs['http-probe'].outputs.live_urls | default(inputs.target, true) }}" | head -50 | while read url; do
          whatweb -a 3 "$url" --color=never 2>/dev/null
        done | tee /tmp/whatweb-output.txt
      continue-on-error: true
    - task: wafw00f
      name: waf-detect
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
  vuln-scan:
    name: Vulnerability Scanning
    needs:
    - web-crawl
    - fingerprint
    - port-scan
    - takeover-check
    outputs:
      vuln_count: '{{ steps.export-vulns.outputs.vuln_count }}'
      critical_count: '{{ steps.export-vulns.outputs.critical_count }}'
      high_count: '{{ steps.export-vulns.outputs.high_count }}'
      medium_count: '{{ steps.export-vulns.outputs.medium_count }}'
    steps:
    - task: nuclei
      name: nuclei-scan
      with:
        target: '{{ jobs[''http-probe''].outputs.live_urls | default(inputs.target, true) }}'
        severity: critical,high,medium
      continue-on-error: true
    - name: nikto-scan
      run: |
        nikto -h {{ inputs.target }} -nointeractive -no404 2>/dev/null | tee /tmp/nikto-output.txt
      continue-on-error: true
    - name: crlfuzz-scan
      run: |
        echo "{{ jobs['http-probe'].outputs.live_urls | default(inputs.target, true) }}" | crlfuzz -s 2>/dev/null | tee /tmp/crlfuzz-output.txt
      continue-on-error: true
    - name: export-vulns
      script: |
        import json

        nuclei_vulns = {{ vulns(steps["nuclei-scan"].outputs.typed_outputs) | tojson }}
        critical = [v for v in nuclei_vulns if v.get('severity') == 'critical']
        high = [v for v in nuclei_vulns if v.get('severity') == 'high']
        medium = [v for v in nuclei_vulns if v.get('severity') == 'medium']

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"vuln_count={len(nuclei_vulns)}\n")
            f.write(f"critical_count={len(critical)}\n")
            f.write(f"high_count={len(high)}\n")
            f.write(f"medium_count={len(medium)}\n")

        print(f"Vulnerabilities: {len(nuclei_vulns)} (C:{len(critical)} H:{len(high)} M:{len(medium)})")
  summary:
    name: Full Recon Summary
    needs:
    - vuln-scan
    - takeover-check
    steps:
    - name: report
      run: |
        echo "=================================================="
        echo " FULL RECON COMPLETE: {{ inputs.target }}"
        echo "=================================================="
        echo "Subdomains discovered: {{ jobs['subdomain-enum'].outputs.sub_count }}"
        echo "DNS verified: {{ jobs['dns-resolve'].outputs.verified_count }}"
        echo "Open ports: {{ jobs['port-scan'].outputs.port_count }}"
        echo "Live HTTP services: {{ jobs['http-probe'].outputs.live_count }}"
        echo "URLs crawled: {{ jobs['web-crawl'].outputs.crawl_count }}"
        echo "Subdomain takeovers: {{ jobs['takeover-check'].outputs.takeover_count }}"
        echo "Vulnerabilities: {{ jobs['vuln-scan'].outputs.vuln_count }}"
        echo "  Critical: {{ jobs['vuln-scan'].outputs.critical_count }}"
        echo "  High: {{ jobs['vuln-scan'].outputs.high_count }}"
        echo "  Medium: {{ jobs['vuln-scan'].outputs.medium_count }}"
      log-stdout: true
    - name: export-to-project
      script: |
        import shutil
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:

            # subdomains
            d = '{{ vars.project_subdomains }}'
            Path(d).mkdir(parents=True, exist_ok=True)
            src = '''{{ jobs['subdomain-enum'].outputs.subs_file | default('', true) }}'''
            if src and Path(src).is_file():
                shutil.copy2(src, Path(d) / 'subdomains.txt')
                print('  [+] subdomains/subdomains.txt')

            # alive subs
            d = '{{ vars.project_hosts }}'
            Path(d).mkdir(parents=True, exist_ok=True)
            data = '''{{ jobs['dns-verify'].outputs.alive_subs | default('', true) }}'''.strip()
            if data:
                (Path(d) / 'alive-subs.txt').write_text(data)
                print(f'  [+] hosts/alive-subs.txt ({len(data.splitlines())} lines)')

            # ports
            d = '{{ vars.project_hosts }}'
            Path(d).mkdir(parents=True, exist_ok=True)
            src = '''{{ jobs['port-scan'].outputs.ports_file | default('', true) }}'''
            if src and Path(src).is_file():
                shutil.copy2(src, Path(d) / 'ports.txt')
                print('  [+] hosts/ports.txt')

            # Auto-export typed outputs
            all_typed = []
            for typed in [
                {{ jobs['subdomain-enum'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['dns-resolve'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['port-scan'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['http-probe'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['web-crawl'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['fingerprint'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['vuln-scan'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true
