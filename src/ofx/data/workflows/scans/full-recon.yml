name: full-recon
description: >
  Full recursive reconnaissance pipeline — discovers subdomains, then runs
  the complete host-scan workflow (port scan, fingerprint, crawl, vuln scan)
  on every live subdomain in parallel via matrix strategy.
tags:
  - scan
  - recon
  - comprehensive
  - full
  - recursive
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target domain (e.g. example.com)
      alias: t
defaults:
  store-creds: true
jobs:
  # ── Phase 1: Subdomain Discovery ─────────────────────────────────
  subdomain-enum:
    name: Subdomain Enumeration
    outputs:
      subs_file: '{{ steps["merge-recursive"].outputs.subs_file | default("", true) }}'
      sub_count: '{{ steps["merge-recursive"].outputs.sub_count | default("", true) }}'
    steps:
      - task: subfinder
        timeout: 15
        name: subfinder-enum
        with:
          target: "{{ inputs.target }}"
          all: true
        continue-on-error: true
      - task: amass
        timeout: 30
        name: amass-passive
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      - task: assetfinder
        timeout: 15
        name: assetfinder-enum
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      - name: collect-subdomains
        script: |
          subs = set()
          subs.add('{{ inputs.target }}')

          sf_outputs = {{ steps["subfinder-enum"].outputs.typed_outputs | tojson }}
          for item in sf_outputs:
              if item.get('_type') == 'subdomain':
                  subs.add(item['host'])

          # From amass
          for item in {{ subdomains(steps["amass-passive"].outputs.typed_outputs) | default([], true) | tojson }}:
              host = item.get('host', '')
              if host and '{{ inputs.target }}' in host:
                  subs.add(host)

          # From assetfinder
          for item in {{ subdomains(steps["assetfinder-enum"].outputs.typed_outputs) | default([], true) | tojson }}:
              host = item.get('host', '')
              if host and '{{ inputs.target }}' in host:
                  subs.add(host)

          from pathlib import Path
          import os
          subs_path = f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_fullrecon_subs.txt'
          Path(subs_path).write_text('\n'.join(sorted(subs)))
          add_outputs(subs_file=subs_path, sub_count=len(subs))
          print(f"Collected {len(subs)} unique subdomains")
      # Recursive pass: run subfinder again on the entire subs list
      - task: subfinder
        timeout: "{{ (steps['collect-subdomains'].outputs.sub_count | default(50, true) | int / 50 * 15 + 30) | int }}"
        name: recursive-subfinder
        with:
          target: "{{ steps['collect-subdomains'].outputs.subs_file }}"
          all: true
        continue-on-error: true
      - name: merge-recursive
        script: |
          from pathlib import Path
          import os

          base = '{{ inputs.target }}'
          subs_path = '{{ steps["collect-subdomains"].outputs.subs_file }}'
          initial = {l.strip() for l in Path(subs_path).read_text().splitlines() if l.strip()}

          new_subs = set()
          for item in {{ steps["recursive-subfinder"].outputs.typed_outputs | default([], true) | tojson }}:
              if item.get('_type') == 'subdomain':
                  h = item['host']
                  if (h.endswith(f'.{base}') or h == base) and h not in initial:
                      new_subs.add(h)

          all_subs = initial | new_subs
          Path(subs_path).write_text('\n'.join(sorted(all_subs)))
          add_outputs(subs_file=subs_path, sub_count=len(all_subs))
          if new_subs:
              print(f"Recursive: {len(initial)} initial + {len(new_subs)} new = {len(all_subs)} total")
              for s in sorted(new_subs)[:20]:
                  print(f"  [NEW] {s}")
          else:
              print(f"Recursive: {len(all_subs)} subdomains (no new found)")

  # ── Phase 2: DNS + HTTP Probing ──────────────────────────────────
  dns-resolve:
    name: DNS Resolution
    needs: [subdomain-enum]
    outputs:
      verified_file: '{{ steps["export-verified"].outputs.verified_file | default("", true) }}'
      verified_count: '{{ steps["export-verified"].outputs.verified_count | default("", true) }}'
      verified_hosts_json: '{{ steps["export-verified"].outputs.verified_hosts_json | default("[]", true) }}'
    steps:
      - task: dnsx
        timeout: "{{ (jobs['subdomain-enum'].outputs.sub_count | default(50, true) | int / 50 * 15 + 30) | int }}"
        name: dns-verify
        with:
          target: "{{ jobs['subdomain-enum'].outputs.subs_file }}"
          a: true
          cname: true
          resp: true
        continue-on-error: true
      - name: export-verified
        script: |
          import json
          verified = set()
          for item in {{ steps["dns-verify"].outputs.typed_outputs | tojson }}:
              h = item.get('host', '')
              if h:
                  verified.add(h)

          from pathlib import Path
          verified_list = sorted(verified)
          Path(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_fullrecon_verified.txt').write_text('\n'.join(verified_list))
          add_outputs(
              verified_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_fullrecon_verified.txt",
              verified_count=len(verified_list),
              verified_hosts_json=json.dumps(verified_list),
          )
          print(f"Verified {len(verified_list)} subdomains via DNS")

  http-probe:
    name: HTTP Probing
    needs: [dns-resolve]
    outputs:
      live_urls_file: '{{ steps["export-live"].outputs.live_urls_file | default("", true) }}'
      live_urls_json: '{{ steps["export-live"].outputs.live_urls_json | default("[]", true) }}'
      live_count: '{{ steps["export-live"].outputs.live_count | default("0", true) }}'
    steps:
      - task: httpx
        timeout: "{{ (jobs['subdomain-enum'].outputs.sub_count | default(50, true) | int / 50 * 15 + 30) | int }}"
        name: probe-subs
        with:
          target: "{{ jobs['dns-resolve'].outputs.verified_file | default(jobs['subdomain-enum'].outputs.subs_file, true) }}"
          tech_detect: true
          status_code: true
          title: true
          follow_redirects: true
        continue-on-error: true
      - name: export-live
        script: |
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          typed = {{ steps["probe-subs"].outputs.typed_outputs | default([], true) | tojson }}

          # Collect all live URLs first
          all_live = [item.get("url", "") for item in typed
                      if item.get("_type") == "url" and item.get("status_code", 0) > 0
                      and item.get("url", "")]

          # Deduplicate by hostname — host-scan accepts URLs but operates on the
          # extracted hostname, so http://x.com and https://x.com would scan the
          # same host twice. Keep the first (preferred) URL per hostname.
          seen_hosts = {}
          for url in all_live:
              host = urlparse(url).hostname or url
              if host not in seen_hosts:
                  seen_hosts[host] = url
          live = sorted(seen_hosts.values())

          Path(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_fullrecon_live.txt').write_text('\n'.join(live))

          add_outputs(
              live_urls_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_fullrecon_live.txt",
              live_urls_json=json.dumps(live),
              live_count=len(live),
          )
          print(f"Live HTTP services: {len(live)} unique host(s)")
          for u in live:
              print(f"  {u}")

  takeover-check:
    name: Subdomain Takeover Check
    needs: [dns-resolve]
    outputs:
      takeover_count: '{{ steps["export-takeovers"].outputs.takeover_count | default("0", true) }}'
    steps:
      - task: subzy
        timeout: 15
        name: subzy-check
        with:
          target: "{{ jobs['dns-resolve'].outputs.verified_file }}"
        continue-on-error: true
      - name: export-takeovers
        script: |
          subzy_out = {{ steps["subzy-check"].outputs.typed_outputs | default([], true) | tojson }}

          takeovers = []
          for item in subzy_out:
              t = item.get('_type', '')
              if t == 'vulnerability':
                  host = item.get('host', item.get('matched_at', ''))
                  takeovers.append(f"VULNERABLE: {host}")
              elif t == 'subdomain' and item.get('vulnerable'):
                  takeovers.append(f"VULNERABLE: {item.get('host', 'unknown')}")
          add_outputs(takeover_count=len(takeovers))
          print(f"Potential takeovers: {len(takeovers)}")

  # ── Phase 3: Per-subdomain full scan via host-scan ───────────────
  per-host-recon:
    name: "Recon: {{ matrix.target }}"
    needs: [dns-resolve]
    strategy:
      matrix:
        target: "{{ jobs['dns-resolve'].outputs.verified_hosts_json }}"
      max_parallel: 5
      fail_fast: false
    steps:
      - name: scan-host
        uses: host-scan
        with:
          target: "{{ matrix.target }}"

  # ── Phase 4: Summary ─────────────────────────────────────────────
  summary:
    name: Full Recon Summary
    needs:
      - per-host-recon
      - takeover-check
      - http-probe
    steps:
      - name: report
        run: |
          echo "======================================================"
          echo " FULL RECON COMPLETE: {{ inputs.target }}"
          echo "======================================================"
          echo ""
          echo "--- Discovery ---"
          echo "Subdomains discovered: {{ jobs['subdomain-enum'].outputs.sub_count }}"
          echo "DNS verified: {{ jobs['dns-resolve'].outputs.verified_count }}"
          echo "Live HTTP services: {{ jobs['http-probe'].outputs.live_count }}"
          echo "Subdomain takeovers: {{ jobs['takeover-check'].outputs.takeover_count }}"
          echo ""
          echo "--- Per-host scanning ---"
          echo "Hosts scanned (host-scan): {{ jobs['dns-resolve'].outputs.verified_count }}"
          echo "(Each host received: port scan, fingerprint, crawl, vuln scan)"
        log-stdout: true
      - name: export-to-project
        script: |
          import shutil
          from pathlib import Path

          project = '{{ vars.project_path | default("", true) }}'
          if not project:
              print('No --project set, skipping file export')
          else:
              d = '{{ vars.project_subdomains }}'
              Path(d).mkdir(parents=True, exist_ok=True)
              src = '''{{ jobs['subdomain-enum'].outputs.subs_file | default('', true) }}'''
              if src and Path(src).is_file():
                  shutil.copy2(src, Path(d) / 'subdomains.txt')
                  print('  [+] subdomains/subdomains.txt')

              d = '{{ vars.project_hosts }}'
              Path(d).mkdir(parents=True, exist_ok=True)
              src = '''{{ jobs['http-probe'].outputs.live_urls_file | default('', true) }}'''
              if src and Path(src).is_file():
                  shutil.copy2(src, Path(d) / 'live-urls.txt')
                  print('  [+] hosts/live-urls.txt')

              # Aggregate typed outputs from discovery jobs
              all_typed = []
              for typed in [
                  {{ jobs['subdomain-enum'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['dns-resolve'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['http-probe'].outputs.typed_outputs | default([], true) | tojson }},
              ]:
                  all_typed.extend(typed)
              summaries = export_typed_outputs(project, all_typed)
              for s in summaries:
                  print(s)
              print(f'Project export complete: {project}')
        continue-on-error: true
