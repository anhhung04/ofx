name: url-scan
description: 'Comprehensive URL security assessment — combines crawling, fuzzing, parameter discovery, and vulnerability scanning for thorough web application testing.

  '
tags:
- http
- crawl
- fuzz
- vuln
- secrets
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target URL (e.g. https://example.com)
      alias: t
    wordlist:
      type: string
      default: /usr/share/wordlists/dirb/common.txt
      description: Wordlist for fuzzing
jobs:
  url-crawl:
    name: URL Crawling
    outputs:
      urls_file: '{{ steps["collect-urls"].outputs.urls_file | default("", true) }}'
      url_count: '{{ steps["collect-urls"].outputs.url_count | default("", true) }}'
    steps:
    - task: katana
      log-command: true
      name: katana-crawl
      with:
        target: '{{ inputs.target }}'
        depth: 3
        js_crawl: true
        known_files: all
      continue-on-error: true
    - task: gau
      log-command: true
      name: gau-passive
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - task: httpx
      log-command: true
      name: probe-crawled
      with:
        target: '{{ inputs.target }}'
        tech_detect: true
        status_code: true
        follow_redirects: true
      continue-on-error: true
    - name: collect-urls
      script: |
        urls = set()
        for step_name in ["katana-crawl", "gau-passive", "probe-crawled"]:
            step_data = {{ steps | tojson }}
            typed = step_data.get(step_name, {}).get('outputs', {}).get('typed_outputs', [])
            for item in typed:
                if item.get('_type') == 'url':
                    urls.add(item['url'])

        with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_urlscan_urls.txt', 'w') as tf:
            tf.write('\n'.join(sorted(urls)))

        add_outputs(urls_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_urlscan_urls.txt", url_count=len(urls))
  url-fuzz:
    name: URL Fuzzing
    needs:
    - url-crawl
    steps:
    - task: feroxbuster
      log-command: true
      name: feroxbuster-fuzz
      with:
        target: "{{ jobs['url-crawl'].outputs.urls_file | default(inputs.target, true) }}"
        wordlist: '{{ inputs.wordlist }}'
        depth: 2
        threads: 50
        smart: true
        extract_links: true
        auto_tune: true
      continue-on-error: true
  param-fuzz:
    name: Parameter Discovery
    needs:
    - url-crawl
    steps:
    - task: arjun
      log-command: true
      name: param-discovery
      with:
        target: "{{ jobs['url-crawl'].outputs.urls_file | default(inputs.target, true) }}"
      continue-on-error: true
  vuln-scan:
    name: Vulnerability Scanning
    needs:
    - url-fuzz
    - param-fuzz
    steps:
    - task: nuclei
      log-command: true
      name: nuclei-scan
      with:
        target: "{{ jobs['url-crawl'].outputs.urls_file | default(inputs.target, true) }}"
        severity: critical,high,medium
        exclude_tags: network,ssl,file,dns,osint,token-spray,headers
      continue-on-error: true
    - task: dalfox
      log-command: true
      name: xss-scan
      with:
        target: "{{ jobs['url-crawl'].outputs.urls_file | default(inputs.target, true) }}"
      continue-on-error: true
    - task: nuclei
      log-command: true
      name: secret-scan
      with:
        target: '{{ inputs.target }}'
        tags: exposure,token,secret
      continue-on-error: true
    - task: cariddi
      log-command: true
      name: cariddi-crawl
      with:
        target: '{{ inputs.target }}'
        secrets: true
        errors: true
        info: true
        depth: 2
      continue-on-error: true
    - task: whatweb
      log-command: true
      name: whatweb-fingerprint
      with:
        target: '{{ inputs.target }}'
        aggression: 3
      continue-on-error: true
    - name: final-summary
      script: |
        import json

        all_vulns = {{ vulns(steps["nuclei-scan"].outputs.typed_outputs) | tojson }} + \
                    {{ vulns(steps["xss-scan"].outputs.typed_outputs) | tojson }} + \
                    {{ vulns(steps["secret-scan"].outputs.typed_outputs) | tojson }}

        critical = [v for v in all_vulns if v.get('severity') == 'critical']
        high = [v for v in all_vulns if v.get('severity') == 'high']

        print("=" * 50)
        print(f" URL SCAN COMPLETE: {{ inputs.target }}")
        print("=" * 50)
        print(f"URLs discovered: {{ jobs['url-crawl'].outputs.url_count }}")
        print(f"Total vulnerabilities: {len(all_vulns)}")
        print(f"  Critical: {len(critical)}")
        print(f"  High: {len(high)}")
      log-stdout: true

    - name: export-to-project
      script: |
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:
            all_typed = []
            for typed in [
            {{ jobs['url-crawl'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['url-fuzz'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['param-fuzz'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['vuln-scan'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true