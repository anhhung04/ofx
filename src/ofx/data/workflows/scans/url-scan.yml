# yaml-language-server: $schema=~/.ofx/workflow_schema.json
name: url-scan
description: 'Comprehensive URL security assessment — combines crawling, fuzzing, parameter discovery, and vulnerability scanning for thorough web application testing.

  '
tags:
- http
- crawl
- fuzz
- vuln
- secrets
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target URL (e.g. https://example.com)
      alias: t
    wordlist:
      type: string
      default: /usr/share/wordlists/dirb/common.txt
      description: Wordlist for fuzzing
jobs:
  url-crawl:
    name: URL Crawling
    outputs:
      urls_file: '{{ steps.collect-urls.outputs.urls_file }}'
      url_count: '{{ steps.collect-urls.outputs.url_count }}'
    steps:
    - task: katana
      name: katana-crawl
      with:
        target: '{{ inputs.target }}'
        depth: 3
      continue-on-error: true
    - task: gospider
      name: gospider-crawl
      with:
        target: '{{ inputs.target }}'
        depth: 2
      continue-on-error: true
    - task: gau
      name: gau-passive
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - task: httpx
      name: probe-crawled
      with:
        target: '{{ inputs.target }}'
        tech_detect: true
        status_code: true
        follow_redirects: true
      continue-on-error: true
    - name: collect-urls
      script: |
        import json

        urls = set()
        for idx in [0, 1, 2, 3]:
            step_data = {{ steps | tojson }}
            typed = step_data[idx].get('outputs', {}).get('typed_outputs', [])
            for item in typed:
                if item.get('_type') == 'url':
                    urls.add(item['url'])

        with open('/tmp/ofx_urlscan_urls.txt', 'w') as tf:
            tf.write('\n'.join(sorted(urls)))

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"urls_file=/tmp/ofx_urlscan_urls.txt\n")
            f.write(f"url_count={len(urls)}\n")
  url-fuzz:
    name: URL Fuzzing
    needs:
    - url-crawl
    steps:
    - task: ffuf
      name: ffuf-fuzz
      with:
        target: '{{ inputs.target }}/FUZZ'
        wordlist: '{{ inputs.wordlist }}'
        threads: 50
        auto_calibration: true
        follow_redirect: true
      continue-on-error: true
    - task: feroxbuster
      name: feroxbuster-fuzz
      with:
        target: '{{ inputs.target }}'
        wordlist: '{{ inputs.wordlist }}'
        depth: 2
        threads: 50
      continue-on-error: true
  param-fuzz:
    name: Parameter Discovery
    needs:
    - url-crawl
    steps:
    - task: arjun
      name: param-discovery
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
  vuln-scan:
    name: Vulnerability Scanning
    needs:
    - url-fuzz
    - param-fuzz
    steps:
    - task: nuclei
      name: nuclei-scan
      with:
        target: '{{ inputs.target }}'
        severity: critical,high,medium
        exclude_tags: network,ssl,file,dns,osint,token-spray,headers
      continue-on-error: true
    - task: dalfox
      name: xss-scan
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - task: trufflehog
      name: secret-scan
      with:
        target: '{{ inputs.target }}'
        mode: filesystem
      continue-on-error: true
    - task: cariddi
      name: cariddi-crawl
      with:
        target: '{{ inputs.target }}'
        secrets: true
        errors: true
        info: true
        depth: 2
      continue-on-error: true
    - task: whatweb
      name: whatweb-fingerprint
      with:
        target: '{{ inputs.target }}'
        aggression: 3
      continue-on-error: true
    - task: nikto
      name: nikto-scan
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - task: gobuster
      name: gobuster-dirs
      with:
        target: '{{ inputs.target }}'
        mode: dir
        wordlist: '{{ inputs.wordlist }}'
        threads: 50
        follow_redirect: true
        no_tls_validation: true
      continue-on-error: true
    - name: final-summary
      script: |
        import json

        all_vulns = {{ vulns(steps["nuclei-scan"].outputs.typed_outputs) | tojson }} + \
                    {{ vulns(steps["xss-scan"].outputs.typed_outputs) | tojson }} + \
                    {{ vulns(steps["secret-scan"].outputs.typed_outputs) | tojson }}

        critical = [v for v in all_vulns if v.get('severity') == 'critical']
        high = [v for v in all_vulns if v.get('severity') == 'high']

        print("=" * 50)
        print(f" URL SCAN COMPLETE: {{ inputs.target }}")
        print("=" * 50)
        print(f"URLs discovered: {{ jobs['url-crawl'].outputs.url_count }}")
        print(f"Total vulnerabilities: {len(all_vulns)}")
        print(f"  Critical: {len(critical)}")
        print(f"  High: {len(high)}")
      log-stdout: true
