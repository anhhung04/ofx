name: ssl-audit
description: 'SSL/TLS security audit — comprehensive analysis of SSL/TLS configuration, certificates, ciphers, and known vulnerabilities.

  '
tags:
- scan
- ssl
- tls
- crypto
- certificate
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Target host:port (e.g. example.com:443)
      alias: t
jobs:
  testssl-check:
    name: TestSSL Analysis
    outputs:
      testssl_vulns: '{{ steps["export-testssl"].outputs.testssl_vulns | default("", true) }}'
      cert_issues: '{{ steps["export-testssl"].outputs.cert_issues | default("", true) }}'
    steps:
    - task: testssl
      log-command: "{{ inputs.log_command | default(true) }}"
      name: testssl-scan
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: export-testssl
      script: |
        results = {{ steps["testssl-scan"].outputs.typed_outputs | tojson }}

        vuln_count = 0
        cert_issues = 0
        for item in results:
            if item.get('_type') == 'vulnerability' or item.get('severity') in ['critical', 'high', 'medium']:
                vuln_count += 1
            if item.get('_type') == 'certificate':
                if item.get('issue'):
                    cert_issues += 1

        add_outputs(testssl_vulns=vuln_count, cert_issues=cert_issues)
        print(f"TLS vulnerabilities: {vuln_count}")
        print(f"Certificate issues: {cert_issues}")
  summary:
    name: SSL Audit Summary
    needs:
    - testssl-check
    steps:
    - name: report
      run: |
        echo "======================================="
        echo " SSL/TLS Audit: {{ inputs.target }}"
        echo "======================================="
        echo "TLS vulnerabilities: {{ jobs['testssl-check'].outputs.testssl_vulns }}"
        echo "Certificate issues: {{ jobs['testssl-check'].outputs.cert_issues }}"
      log-stdout: "{{ inputs.log_output | default(true) }}"

    - name: export-to-project
      script: |
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:
            all_typed = {{ jobs['testssl-check'].outputs.typed_outputs | default([], true) | tojson }}
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true