# yaml-language-server: $schema=~/.ofx/workflow_schema.json
name: ssl-audit
description: 'SSL/TLS security audit — comprehensive analysis of SSL/TLS configuration,
  certificates, ciphers, and known vulnerabilities.

  '
tags:
- scan
- ssl
- tls
- crypto
- certificate
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target host:port (e.g. example.com:443)
jobs:
  sslscan-check:
    name: SSLScan Analysis
    steps:
    - name: sslscan-run
      run: 'sslscan --no-colour {{ inputs.target }} 2>/dev/null | tee /tmp/sslscan-output.txt

        '
      continue-on-error: true
    - name: collect-sslscan
      script: "import re\n\nweak_ciphers = []\nprotocols = []\ncert_info = []\n\n\
        try:\n    with open('/tmp/sslscan-output.txt') as f:\n        content = f.read()\n\
        \n    # Extract weak/deprecated protocols\n    for proto in ['SSLv2', 'SSLv3',\
        \ 'TLSv1.0', 'TLSv1.1']:\n        if re.search(rf'{proto}\\s+enabled', content,\
        \ re.IGNORECASE):\n            protocols.append(proto)\n\n    # Extract weak\
        \ ciphers\n    for line in content.split('\\n'):\n        if 'NULL' in line\
        \ or 'RC4' in line or 'DES' in line or 'EXPORT' in line:\n            cipher\
        \ = line.strip()\n            if cipher:\n                weak_ciphers.append(cipher)\n\
        \nexcept FileNotFoundError:\n    pass\n\nwith open('{{ env.OFX_OUTPUTS }}',\
        \ 'a') as f:\n    f.write(f\"weak_protocols={chr(10).join(protocols) if protocols\
        \ else 'none'}\\n\")\n    f.write(f\"weak_protocol_count={len(protocols)}\\\
        n\")\n    f.write(f\"weak_cipher_count={len(weak_ciphers)}\\n\")\n\nprint(f\"\
        Weak protocols: {len(protocols)}\")\nprint(f\"Weak ciphers: {len(weak_ciphers)}\"\
        )\n"
  testssl-check:
    name: TestSSL Analysis
    steps:
    - task: testssl
      name: testssl-scan
      with:
        target: '{{ inputs.target }}'
        server_defaults: true
      continue-on-error: true
      log-stdout: true
    - name: export-testssl
      script: "import json\n\nresults = {{ steps[0].outputs.typed_outputs | tojson\
        \ }}\n\nvuln_count = 0\ncert_issues = 0\nfor item in results:\n    if item.get('_type')\
        \ == 'vulnerability' or item.get('severity') in ['critical', 'high', 'medium']:\n\
        \        vuln_count += 1\n    if item.get('_type') == 'certificate':\n   \
        \     if item.get('issue'):\n            cert_issues += 1\n\nwith open('{{\
        \ env.OFX_OUTPUTS }}', 'a') as f:\n    f.write(f\"testssl_vulns={vuln_count}\\\
        n\")\n    f.write(f\"cert_issues={cert_issues}\\n\")\n\nprint(f\"TestSSL vulnerabilities:\
        \ {vuln_count}\")\nprint(f\"Certificate issues: {cert_issues}\")\n"
      log-stdout: true
  summary:
    name: SSL Audit Summary
    needs:
    - sslscan-check
    - testssl-check
    steps:
    - name: report
      run: 'echo "======================================="

        echo " SSL/TLS Audit: {{ inputs.target }}"

        echo "======================================="

        echo "Weak protocols: {{ jobs[''sslscan-check''].outputs.weak_protocol_count
        }}"

        echo "Weak ciphers: {{ jobs[''sslscan-check''].outputs.weak_cipher_count }}"

        echo "TLS vulnerabilities: {{ jobs[''testssl-check''].outputs.testssl_vulns
        }}"

        echo "Certificate issues: {{ jobs[''testssl-check''].outputs.cert_issues }}"

        '
      log-stdout: true
