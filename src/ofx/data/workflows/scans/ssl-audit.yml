name: ssl-audit
description: 'SSL/TLS security audit — comprehensive analysis of SSL/TLS configuration, certificates, ciphers, and known vulnerabilities.

  '
tags:
- scan
- ssl
- tls
- crypto
- certificate
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target host:port (e.g. example.com:443)
      alias: t
jobs:
  sslscan-check:
    name: SSLScan Analysis
    outputs:
      weak_protocols_file: '{{ steps["collect-sslscan"].outputs.weak_protocols_file | default("", true) }}'
      weak_protocol_count: '{{ steps["collect-sslscan"].outputs.weak_protocol_count | default("", true) }}'
      weak_cipher_count: '{{ steps["collect-sslscan"].outputs.weak_cipher_count | default("", true) }}'
    steps:
    - task: sslscan
      timeout: 10
      name: sslscan-run
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: collect-sslscan
      script: |
        sslscan_out = {{ steps["sslscan-run"].outputs.typed_outputs | default([], true) | tojson }}

        weak_protocols = []
        weak_ciphers = []
        deprecated = {'SSLv2', 'SSLv3', 'TLSv1.0', 'TLSv1.1'}

        for item in sslscan_out:
            t = item.get('_type', '')
            if t == 'tag':
                name = item.get('name', '')
                if any(p in name for p in deprecated):
                    weak_protocols.append(name)
                if any(kw in name for kw in ['NULL', 'RC4', 'DES', 'EXPORT']):
                    weak_ciphers.append(name)
            elif t == 'vulnerability':
                weak_ciphers.append(item.get('name', 'unknown'))

        with open('/tmp/ofx_sslaudit_protocols.txt', 'w') as tf:
            tf.write('\n'.join(weak_protocols) if weak_protocols else 'none')

        add_outputs(weak_protocols_file="/tmp/ofx_sslaudit_protocols.txt", weak_protocol_count=len(weak_protocols), weak_cipher_count=len(weak_ciphers))
        print(f"Weak protocols: {len(weak_protocols)}")
        print(f"Weak ciphers: {len(weak_ciphers)}")
  testssl-check:
    name: TestSSL Analysis
    outputs:
      testssl_vulns: '{{ steps["export-testssl"].outputs.testssl_vulns | default("", true) }}'
      cert_issues: '{{ steps["export-testssl"].outputs.cert_issues | default("", true) }}'
    steps:
    - task: testssl
      timeout: 10
      name: testssl-scan
      with:
        target: '{{ inputs.target }}:443'
      continue-on-error: true
    - name: export-testssl
      script: |
        import json

        results = {{ steps["testssl-scan"].outputs.typed_outputs | tojson }}

        vuln_count = 0
        cert_issues = 0
        for item in results:
            if item.get('_type') == 'vulnerability' or item.get('severity') in ['critical', 'high', 'medium']:
                vuln_count += 1
            if item.get('_type') == 'certificate':
                if item.get('issue'):
                    cert_issues += 1

        add_outputs(testssl_vulns=vuln_count, cert_issues=cert_issues)
        print(f"TestSSL vulnerabilities: {vuln_count}")
        print(f"Certificate issues: {cert_issues}")
  summary:
    name: SSL Audit Summary
    needs:
    - sslscan-check
    - testssl-check
    steps:
    - name: report
      run: |
        echo "======================================="
        echo " SSL/TLS Audit: {{ inputs.target }}"
        echo "======================================="
        echo "Weak protocols: {{ jobs['sslscan-check'].outputs.weak_protocol_count }}"
        echo "Weak ciphers: {{ jobs['sslscan-check'].outputs.weak_cipher_count }}"
        echo "TLS vulnerabilities: {{ jobs['testssl-check'].outputs.testssl_vulns }}"
        echo "Certificate issues: {{ jobs['testssl-check'].outputs.cert_issues }}"
      log-stdout: true

    - name: export-to-project
      script: |
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:
            all_typed = []
            for typed in [
            {{ jobs['sslscan-check'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['testssl-check'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true