# yaml-language-server: $schema=~/.ofx/workflow_schema.json
name: ssl-audit
description: 'SSL/TLS security audit — comprehensive analysis of SSL/TLS configuration, certificates, ciphers, and known vulnerabilities.

  '
tags:
- scan
- ssl
- tls
- crypto
- certificate
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target host:port (e.g. example.com:443)
      alias: t
jobs:
  sslscan-check:
    name: SSLScan Analysis
    outputs:
      weak_protocols_file: '{{ steps.collect-sslscan.outputs.weak_protocols_file }}'
      weak_protocol_count: '{{ steps.collect-sslscan.outputs.weak_protocol_count }}'
      weak_cipher_count: '{{ steps.collect-sslscan.outputs.weak_cipher_count }}'
    steps:
    - name: sslscan-run
      run: |
        sslscan --no-colour {{ inputs.target }} 2>/dev/null | tee /tmp/sslscan-output.txt
      continue-on-error: true
    - name: collect-sslscan
      script: |
        import re

        weak_ciphers = []
        protocols = []
        cert_info = []

        try:
            with open('/tmp/sslscan-output.txt') as f:
                content = f.read()

            # Extract weak/deprecated protocols
            for proto in ['SSLv2', 'SSLv3', 'TLSv1.0', 'TLSv1.1']:
                if re.search(rf'{proto}\s+enabled', content, re.IGNORECASE):
                    protocols.append(proto)

            # Extract weak ciphers
            for line in content.split('\n'):
                if 'NULL' in line or 'RC4' in line or 'DES' in line or 'EXPORT' in line:
                    cipher = line.strip()
                    if cipher:
                        weak_ciphers.append(cipher)

        except FileNotFoundError:
            pass

        with open('/tmp/ofx_sslaudit_protocols.txt', 'w') as tf:
            tf.write('\n'.join(protocols) if protocols else 'none')

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"weak_protocols_file=/tmp/ofx_sslaudit_protocols.txt\n")
            f.write(f"weak_protocol_count={len(protocols)}\n")
            f.write(f"weak_cipher_count={len(weak_ciphers)}\n")

        print(f"Weak protocols: {len(protocols)}")
        print(f"Weak ciphers: {len(weak_ciphers)}")
  testssl-check:
    name: TestSSL Analysis
    outputs:
      testssl_vulns: '{{ steps.export-testssl.outputs.testssl_vulns }}'
      cert_issues: '{{ steps.export-testssl.outputs.cert_issues }}'
    steps:
    - task: testssl
      timeout: 10
      name: testssl-scan
      with:
        target: '{{ inputs.target }}'
        server_defaults: true
      continue-on-error: true
    - name: export-testssl
      script: |
        import json

        results = {{ steps["testssl-scan"].outputs.typed_outputs | tojson }}

        vuln_count = 0
        cert_issues = 0
        for item in results:
            if item.get('_type') == 'vulnerability' or item.get('severity') in ['critical', 'high', 'medium']:
                vuln_count += 1
            if item.get('_type') == 'certificate':
                if item.get('issue'):
                    cert_issues += 1

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"testssl_vulns={vuln_count}\n")
            f.write(f"cert_issues={cert_issues}\n")

        print(f"TestSSL vulnerabilities: {vuln_count}")
        print(f"Certificate issues: {cert_issues}")
  summary:
    name: SSL Audit Summary
    needs:
    - sslscan-check
    - testssl-check
    steps:
    - name: report
      run: |
        echo "======================================="
        echo " SSL/TLS Audit: {{ inputs.target }}"
        echo "======================================="
        echo "Weak protocols: {{ jobs['sslscan-check'].outputs.weak_protocol_count }}"
        echo "Weak ciphers: {{ jobs['sslscan-check'].outputs.weak_cipher_count }}"
        echo "TLS vulnerabilities: {{ jobs['testssl-check'].outputs.testssl_vulns }}"
        echo "Certificate issues: {{ jobs['testssl-check'].outputs.cert_issues }}"
      log-stdout: true

    - name: export-to-project
      script: |
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:
            all_typed = []
            for typed in [
            {{ jobs['testssl-check'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true