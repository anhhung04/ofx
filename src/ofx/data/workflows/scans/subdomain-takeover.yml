name: subdomain-takeover
description:
  "Subdomain takeover detection — enumerates subdomains from multiple sources, verifies DNS, checks for dangling
  CNAMEs, runs takeover fingerprinting, and takes screenshots of vulnerable targets.

  "
tags:
  - recon
  - subdomain
  - takeover
  - dns
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target domain (e.g. target.com)
jobs:
  enum:
    name: Subdomain Enumeration
    steps:
      - task: subfinder
        name: subfinder-enum
        with:
          target: "{{ inputs.target }}"
          all: true
        log-stdout: true
        continue-on-error: true
      - task: findomain
        name: findomain-enum
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      - task: amass
        name: amass-passive
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      - task: assetfinder
        name: assetfinder-enum
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      - task: gau
        name: gau-subs
        with:
          target: "{{ inputs.target }}"
          subs: true
        continue-on-error: true
      - name: merge-subs
        script:
          "import re\nsubs = set()\nsubs.add('{{ inputs.target }}')\n\nfor idx in range(5):\n    step_data = {{ steps\
          \ | tojson }}\n    typed = step_data[idx].get('outputs', {}).get('typed_outputs', [])\n    for item in typed:\n  \
          \      host = item.get('host', '')\n        if host and '{{ inputs.target }}' in host:\n            subs.add(host)\n\
          \        url = item.get('url', '')\n        if url:\n            match = re.search(r'https?://([^/:]+)', url)\n  \
          \          if match and '{{ inputs.target }}' in match.group(1):\n                subs.add(match.group(1))\n\nwith open('/tmp/all-subs.txt', 'w') as f:\n    f.write('\\n'.join(sorted(subs)))\n\nwith open('{{ env.OFX_OUTPUTS\
          \ }}', 'a') as f:\n    f.write(f\"subs_file=/tmp/all-subs.txt\\n\")\n    f.write(f\"sub_count={len(subs)}\\n\")\n\nprint(f\"\
          Enumerated {len(subs)} unique subdomains from 5 sources\")\n"
        log-stdout: true
  dns-verify:
    name: DNS Verification & CNAME Check
    needs:
      - enum
    steps:
      - task: dnsx
        name: dns-resolve
        with:
          target: "{{ jobs.enum.outputs.subs_file }}"
          a: true
          cname: true
          resp: true
        log-stdout: true
        continue-on-error: true
      - name: analyze-cnames
        script:
          "records = {{ steps[0].outputs.typed_outputs | tojson }}\n\nalive = set()\ncnames = {}\ndangling = []\n\nfor\
          \ r in records:\n    host = r.get('host', '')\n    if host:\n        alive.add(host)\n\n    # Detect CNAME records\
          \ that could indicate takeover\n    rtype = r.get('type', '')\n    if rtype == 'CNAME' or 'cname' in str(r).lower():\n\
          \        name = r.get('name', host)\n        target = r.get('host', '')\n        if name and target:\n           \
          \ cnames[name] = target\n\n# Known takeover-vulnerable CNAME patterns\nvuln_patterns = [\n    'amazonaws.com', 'cloudfront.net',\
          \ 'azurewebsites.net',\n    'blob.core.windows.net', 'cloudapp.net', 'trafficmanager.net',\n    'herokuapp.com', 'herokudns.com',\
          \ 'github.io', 'pages.dev',\n    'pantheonsite.io', 'shopify.com', 'myshopify.com',\n    'wpengine.com', 'wordpress.com',\
          \ 'ghost.io',\n    'netlify.app', 'netlify.com', 'vercel.app',\n    'surge.sh', 'bitbucket.io', 'zendesk.com',\n \
          \   'freshdesk.com', 'statuspage.io', 'readme.io',\n    'cargo.site', 'feedpress.me', 'helpjuice.com',\n    'helpscoutdocs.com',\
          \ 'tictail.com', 'aha.io',\n    'brightcove.com', 'bigcartel.com', 'campaignmonitor.com',\n    'acquia-test.co', 'proposify.biz',\
          \ 'simplebooklet.com',\n    'getresponse.com', 'vend-pos.com', 'aftership.app',\n    'animaapp.io', 'airee.com', 'cargocollective.com',\n\
          ]\n\nfor name, target in cnames.items():\n    for pattern in vuln_patterns:\n        if pattern in target:\n     \
          \       dangling.append(f\"{name} -> {target}\")\n            break\n\nwith open('/tmp/alive-subs.txt', 'w') as f:\n    f.write('\\n'.join(sorted(alive)))\n\nwith open('/tmp/ofx_subtakeover_dangling.txt', 'w') as f:\n    f.write('\\n'.join(dangling))\n\nwith open('{{ env.OFX_OUTPUTS }}', 'a') as f:\n\
          \    f.write(f\"alive_file=/tmp/alive-subs.txt\\n\")\n    f.write(f\"alive_count={len(alive)}\\n\")\n    f.write(f\"cname_count={len(cnames)}\\\
          n\")\n    f.write(f\"dangling_count={len(dangling)}\\n\")\n    f.write(f\"dangling_file=/tmp/ofx_subtakeover_dangling.txt\\\
          n\")\n\nprint(f\"Alive: {len(alive)}, CNAMEs: {len(cnames)}, Potentially dangling: {len(dangling)}\")\nfor d in dangling:\n\
          \    print(f\"  [!] {d}\")\n"
        log-stdout: true
  takeover-check:
    name: Takeover Fingerprinting
    needs:
      - dns-verify
    steps:
      - task: subzy
        name: subzy-check
        with:
          target: /tmp/alive-subs.txt
          concurrency: 20
        log-stdout: true
        continue-on-error: true
      - task: nuclei
        name: nuclei-takeover
        with:
          target: "{{ jobs['dns-verify'].outputs.alive_file }}"
          tags: takeover
        log-stdout: true
        continue-on-error: true
      - name: collect-takeovers
        script:
          "subzy_vulns = {{ vulns(steps[0].outputs.typed_outputs) | tojson }}\nnuclei_vulns = {{ vulns(steps[1].outputs.typed_outputs)\
          \ | tojson }}\n\ntakeovers = []\nfor v in subzy_vulns + nuclei_vulns:\n    name = v.get('name', v.get('id', 'unknown'))\n\
          \    host = v.get('host', v.get('url', ''))\n    takeovers.append(f\"{host}: {name}\")\n\nwith open('{{ env.OFX_OUTPUTS\
          \ }}', 'a') as f:\n    f.write(f\"takeover_count={len(takeovers)}\\n\")\n\nwith open('/tmp/ofx_subtakeover_details.txt', 'w') as f:\n    f.write('\\n'.join(takeovers))\n\nwith open('{{ env.OFX_OUTPUTS }}', 'a') as f:\n    f.write(f\"takeover_details_file=/tmp/ofx_subtakeover_details.txt\\\
          n\")\n\nprint(f\"Confirmed takeover vulnerabilities: {len(takeovers)}\")\nfor t in takeovers:\n    print(f\"  [!]\
          \ {t}\")\n"
        log-stdout: true
  screenshot:
    name: Visual Evidence
    needs:
      - dns-verify
    steps:
      - task: gowitness
        name: gowitness-capture
        with:
          target: "{{ jobs['dns-verify'].outputs.alive_file }}"
          threads: 10
        log-stdout: true
        continue-on-error: true
      - task: httpx
        name: http-fingerprint
        with:
          target: "{{ jobs['dns-verify'].outputs.alive_file }}"
          tech_detect: true
          status_code: true
          title: true
          follow_redirects: true
        log-stdout: true
        continue-on-error: true
  summary:
    name: Takeover Summary
    needs:
      - takeover-check
      - screenshot
    steps:
      - name: report
        run: 'echo "======================================================"

          echo " SUBDOMAIN TAKEOVER SCAN: {{ inputs.target }}"

          echo "======================================================"

          echo ""

          echo "--- Enumeration ---"

          echo "Total subdomains: {{ jobs.enum.outputs.sub_count }}"

          echo "Alive subdomains: {{ jobs[''dns-verify''].outputs.alive_count }}"

          echo ""

          echo "--- CNAME Analysis ---"

          echo "CNAME records: {{ jobs[''dns-verify''].outputs.cname_count }}"

          echo "Dangling CNAMEs: {{ jobs[''dns-verify''].outputs.dangling_count }}"

          echo ""

          echo "--- Takeover Results ---"

          echo "Confirmed vulnerable: {{ jobs[''takeover-check''].outputs.takeover_count }}"

          {% if jobs[''takeover-check''].outputs.takeover_details_file %}

          echo ""

          echo "--- Details ---"

          cat {{ jobs[''takeover-check''].outputs.takeover_details_file }}

          {% endif %}

          {% if jobs[''dns-verify''].outputs.dangling_file %}

          echo ""

          echo "--- Dangling CNAMEs (investigate manually) ---"

          cat {{ jobs[''dns-verify''].outputs.dangling_file }}

          {% endif %}

          '
        log-stdout: true
      - name: export-to-project
        script:
          "import json, os\nfrom pathlib import Path\n\nproject = '{{ vars.project_path | default(\"\", true) }}'\nif\
          \ not project:\n    print('No --project set, skipping file export')\nelse:\n    p = Path(project)\n\n    # all subdomains\n\
          \    d = p / 'scans'\n    d.mkdir(parents=True, exist_ok=True)\n    sf = '{{ jobs.enum.outputs.subs_file | default(\"\", true) }}'\n    if sf:\n        import shutil\n        shutil.copy2(sf, d / 'subdomains.txt')\n        print(f'  [+] scans/subdomains.txt')\n\n    # alive subdomains\n    d = p / 'scans'\n    d.mkdir(parents=True, exist_ok=True)\n\
          \    af = '{{ jobs[\"dns-verify\"].outputs.alive_file | default(\"\", true) }}'\n    if af:\n        import shutil\n        shutil.copy2(af, d / 'alive-subs.txt')\n        print(f'  [+] scans/alive-subs.txt')\n\
          \n    # dangling CNAMEs\n    d = p / 'evidence/data'\n    d.mkdir(parents=True, exist_ok=True)\n    df = '{{ jobs[\"dns-verify\"].outputs.dangling_file | default(\"\", true) }}'\n    if df:\n        import shutil\n        shutil.copy2(df, d / 'dangling-cnames.txt')\n        print(f'\
          \  [+] evidence/data/dangling-cnames.txt')\n\n    # takeover vulns\n    d = p / 'evidence/data'\n\
          \    d.mkdir(parents=True, exist_ok=True)\n    tf = '{{ jobs[\"takeover-check\"].outputs.takeover_details_file | default(\"\", true) }}'\n    if tf:\n        import shutil\n        shutil.copy2(tf, d / 'takeover-details.txt')\n        print(f'  [+]\
          \ evidence/data/takeover-details.txt')\n\n    print(f'Project export complete: {project}')"
        continue-on-error: true
