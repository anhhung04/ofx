name: cloud-aws-audit
description: |
  AWS security audit — check S3 bucket permissions, IAM misconfigurations,
  public EC2 instances, security groups, and credential exposure.
  Requires AWS CLI configured with valid credentials.
tags: [cloud, aws, security, audit]
dispatch:
  inputs:
    profile:
      type: string
      default: ''
      description: AWS CLI profile name
    region:
      type: string
      default: us-east-1
      description: AWS region

jobs:
  iam-audit:
    name: IAM Security Audit
    outputs:
      account: '{{ steps["check-iam"].outputs.account | default("", true) }}'
      user_count: '{{ steps["check-iam"].outputs.user_count | default("", true) }}'
      no_mfa_count: '{{ steps["check-iam"].outputs.no_mfa_count | default("", true) }}'
    steps:
    - name: check-iam
      script: |
        import subprocess
        import json

        profile = '{{ inputs.profile }}'
        aws_args = ['aws']
        if profile:
            aws_args.extend(['--profile', profile])

        results = {}

        # Check caller identity
        proc = subprocess.run(aws_args + ['sts', 'get-caller-identity'], capture_output=True, text=True, timeout=15)
        if proc.returncode != 0:
            print(f"[-] AWS auth failed: {proc.stderr.strip()}")
            raise SystemExit(1)
        identity = json.loads(proc.stdout)
        results['identity'] = identity
        print(f"[+] Account: {identity['Account']}")
        print(f"[+] ARN: {identity['Arn']}\n")

        # List users
        proc = subprocess.run(aws_args + ['iam', 'list-users', '--output', 'json'], capture_output=True, text=True, timeout=15)
        if proc.returncode == 0:
            users = json.loads(proc.stdout).get('Users', [])
            results['user_count'] = len(users)
            print(f"[+] IAM Users: {len(users)}")

            # Check for users without MFA
            no_mfa = []
            for user in users[:20]:
                proc2 = subprocess.run(
                    aws_args + ['iam', 'list-mfa-devices', '--user-name', user['UserName'], '--output', 'json'],
                    capture_output=True, text=True, timeout=10
                )
                if proc2.returncode == 0:
                    devices = json.loads(proc2.stdout).get('MFADevices', [])
                    if not devices:
                        no_mfa.append(user['UserName'])

            results['no_mfa'] = no_mfa
            if no_mfa:
                print(f"  [!] Users without MFA: {', '.join(no_mfa)}")

        # Check access keys
        proc = subprocess.run(aws_args + ['iam', 'get-credential-report', '--output', 'json'], capture_output=True, text=True, timeout=15)

        add_outputs(account=identity['Account'], user_count=results.get('user_count', 0), no_mfa_count=len(results.get('no_mfa', [])))
      continue-on-error: true

  s3-audit:
    name: S3 Bucket Audit
    outputs:
      bucket_count: '{{ steps["check-s3"].outputs.bucket_count | default("", true) }}'
      public_bucket_count: '{{ steps["check-s3"].outputs.public_bucket_count | default("", true) }}'
    steps:
    - name: check-s3
      script: |
        import subprocess
        import json

        profile = '{{ inputs.profile }}'
        aws_args = ['aws']
        if profile:
            aws_args.extend(['--profile', profile])

        proc = subprocess.run(aws_args + ['s3api', 'list-buckets', '--output', 'json'], capture_output=True, text=True, timeout=15)
        if proc.returncode != 0:
            print(f"[-] Cannot list buckets: {proc.stderr.strip()}")
        else:
            buckets = json.loads(proc.stdout).get('Buckets', [])
            print(f"[+] S3 Buckets: {len(buckets)}\n")

            public_buckets = []
            for bucket in buckets[:30]:
                name = bucket['Name']
                # Check public access
                proc2 = subprocess.run(
                    aws_args + ['s3api', 'get-public-access-block', '--bucket', name, '--output', 'json'],
                    capture_output=True, text=True, timeout=10
                )
                if proc2.returncode != 0:
                    public_buckets.append(name)
                    print(f"  [!] {name}: No public access block configured")
                else:
                    config = json.loads(proc2.stdout).get('PublicAccessBlockConfiguration', {})
                    if not all(config.values()):
                        public_buckets.append(name)
                        print(f"  [!] {name}: Partial public access block")
                    else:
                        print(f"  [✓] {name}: Protected")

            add_outputs(bucket_count=len(buckets), public_bucket_count=len(public_buckets))
      continue-on-error: true

  sg-audit:
    name: Security Group Audit
    outputs:
      sg_count: '{{ steps["check-security-groups"].outputs.sg_count | default("", true) }}'
      risky_sg_count: '{{ steps["check-security-groups"].outputs.risky_sg_count | default("", true) }}'
    steps:
    - name: check-security-groups
      script: |
        import subprocess
        import json

        profile = '{{ inputs.profile }}'
        region = '{{ inputs.region }}'
        aws_args = ['aws', '--region', region]
        if profile:
            aws_args.extend(['--profile', profile])

        proc = subprocess.run(
            aws_args + ['ec2', 'describe-security-groups', '--output', 'json'],
            capture_output=True, text=True, timeout=15
        )

        risky = []
        if proc.returncode == 0:
            sgs = json.loads(proc.stdout).get('SecurityGroups', [])
            print(f"[+] Security Groups: {len(sgs)}\n")

            for sg in sgs:
                name = sg.get('GroupName', '')
                sg_id = sg.get('GroupId', '')
                for rule in sg.get('IpPermissions', []):
                    for ip_range in rule.get('IpRanges', []):
                        if ip_range.get('CidrIp') == '0.0.0.0/0':
                            port = rule.get('FromPort', 'all')
                            risky.append({'sg': sg_id, 'name': name, 'port': port})
                            print(f"  [!] {sg_id} ({name}): 0.0.0.0/0 on port {port}")

        add_outputs(sg_count=len(sgs) if proc.returncode == 0 else 0, risky_sg_count=len(risky))
        if not risky:
            print("  [✓] No security groups open to 0.0.0.0/0")
      continue-on-error: true

  summary:
    name: AWS Audit Summary
    needs: [iam-audit, s3-audit, sg-audit]
    steps:
    - name: report
      run: |
        echo "======================================================"
        echo " AWS SECURITY AUDIT"
        echo "======================================================"
        echo ""
        echo "--- IAM ---"
        echo "  Account: {{ jobs['iam-audit'].outputs.account | default('?', true) }}"
        echo "  Users: {{ jobs['iam-audit'].outputs.user_count | default('?', true) }}"
        echo "  No MFA: {{ jobs['iam-audit'].outputs.no_mfa_count | default('?', true) }}"
        echo ""
        echo "--- S3 ---"
        echo "  Buckets: {{ jobs['s3-audit'].outputs.bucket_count | default('?', true) }}"
        echo "  Public: {{ jobs['s3-audit'].outputs.public_bucket_count | default('?', true) }}"
        echo ""
        echo "--- Security Groups ---"
        echo "  Total: {{ jobs['sg-audit'].outputs.sg_count | default('?', true) }}"
        echo "  Risky (0.0.0.0/0): {{ jobs['sg-audit'].outputs.risky_sg_count | default('?', true) }}"
      log-stdout: true
