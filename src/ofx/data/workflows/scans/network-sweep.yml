name: network-sweep
description: |
  Network discovery sweep — fast host discovery, port scanning,
  OS fingerprinting, and service identification across a network
  range for initial reconnaissance.
tags: [scan, network, discovery, recon]
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Network range (CIDR, IP range, or single IP)
      alias: t
    speed:
      type: string
      default: normal
      description: Scan speed (fast, normal, thorough)

jobs:
  discovery:
    name: Host Discovery
    outputs:
      alive_count: '{{ steps["host-sweep"].outputs.alive_count | default("", true) }}'
      hosts_file: '{{ steps["host-sweep"].outputs.hosts_file | default("", true) }}'
    steps:
    - name: host-sweep
      log-command: "{{ inputs.log_command | default(true) }}"
      run: |
        echo "[+] Host discovery: {{ inputs.target }}"

        # Fast ping sweep
        if command -v nmap &>/dev/null; then
          nmap -sn -PE -PP -PS21,22,80,443,445,3389,8080 -PA80,443 -T4 {{ inputs.target }} -oG ${OFX_RUN_DIR:-/tmp}/ofx_hosts.gnmap 2>/dev/null

          grep "Up" ${OFX_RUN_DIR:-/tmp}/ofx_hosts.gnmap | awk '{print $2}' > ${OFX_RUN_DIR:-/tmp}/ofx_alive_hosts.txt
          COUNT=$(wc -l < ${OFX_RUN_DIR:-/tmp}/ofx_alive_hosts.txt)
          echo "[+] Alive hosts: $COUNT"
          cat ${OFX_RUN_DIR:-/tmp}/ofx_alive_hosts.txt

          echo "alive_count=$COUNT" >> {{ env.OFX_OUTPUTS }}
          echo "hosts_file=${OFX_RUN_DIR:-/tmp}/ofx_alive_hosts.txt" >> {{ env.OFX_OUTPUTS }}
        fi
      continue-on-error: true

  port-scan:
    name: Port Scanning
    needs: [discovery]
    outputs:
      port_count: '{{ steps["fast-portscan"].outputs.port_count | default("", true) }}'
      ports_file: '{{ steps["fast-portscan"].outputs.ports_file | default("", true) }}'
    steps:
    - name: fast-portscan
      log-command: "{{ inputs.log_command | default(true) }}"
      run: |
        echo "[+] Port scanning alive hosts..."
        HOSTS_FILE="{{ jobs['discovery'].outputs.hosts_file | default('/tmp/ofx_alive_hosts.txt', true) }}"
        if [ ! -f "$HOSTS_FILE" ]; then
          echo "[-] No hosts file found"
          exit 0
        fi

        {% if inputs.speed == 'fast' %}
        naabu -list "$HOSTS_FILE" -top-ports 100 -rate 5000 -o ${OFX_RUN_DIR:-/tmp}/ofx_ports.txt 2>/dev/null
        {% elif inputs.speed == 'thorough' %}
        naabu -list "$HOSTS_FILE" -top-ports 1000 -rate 1000 -o ${OFX_RUN_DIR:-/tmp}/ofx_ports.txt 2>/dev/null
        {% else %}
        naabu -list "$HOSTS_FILE" -top-ports 500 -rate 2000 -o ${OFX_RUN_DIR:-/tmp}/ofx_ports.txt 2>/dev/null
        {% endif %}

        if [ -f ${OFX_RUN_DIR:-/tmp}/ofx_ports.txt ]; then
          COUNT=$(wc -l < ${OFX_RUN_DIR:-/tmp}/ofx_ports.txt)
          echo "port_count=$COUNT" >> {{ env.OFX_OUTPUTS }}
          echo "ports_file=${OFX_RUN_DIR:-/tmp}/ofx_ports.txt" >> {{ env.OFX_OUTPUTS }}
          echo "[+] Found $COUNT open ports"
          cat ${OFX_RUN_DIR:-/tmp}/ofx_ports.txt
        fi
      continue-on-error: true

  service-id:
    name: Service Identification
    needs: [port-scan]
    outputs:
      service_file: '{{ steps["nmap-svc"].outputs.service_file | default("", true) }}'
    steps:
    - task: nerva
      log-command: "{{ inputs.log_command | default(true) }}"
      name: nerva-fingerprint
      with:
        target: "{{ jobs['discovery'].outputs.hosts_file | default('/tmp/ofx_alive_hosts.txt', true) }}"
      continue-on-error: true
    - name: nmap-svc
      log-command: "{{ inputs.log_command | default(true) }}"
      run: |
        echo "[+] Service identification..."

        HOSTS_FILE="{{ jobs['discovery'].outputs.hosts_file | default('/tmp/ofx_alive_hosts.txt', true) }}"
        if [ -f "$HOSTS_FILE" ]; then
          nmap -sV -sC --version-intensity 5 -iL "$HOSTS_FILE" \
            -oN ${OFX_RUN_DIR:-/tmp}/ofx_service_scan.txt -oX ${OFX_RUN_DIR:-/tmp}/ofx_service_scan.xml \
            {% if inputs.speed == 'fast' %}
            --top-ports 100 -T4 \
            {% elif inputs.speed == 'thorough' %}
            --top-ports 1000 -T3 -O \
            {% else %}
            --top-ports 500 -T4 \
            {% endif %}
            2>/dev/null

          echo "service_file=${OFX_RUN_DIR:-/tmp}/ofx_service_scan.txt" >> {{ env.OFX_OUTPUTS }}
          echo "[+] Results: ${OFX_RUN_DIR:-/tmp}/ofx_service_scan.txt"
        fi
      continue-on-error: true

  default-cred-check:
    name: Default Credential Check
    needs: [port-scan]
    outputs:
      cred_count: '{{ steps["brute-defaults"].outputs.cred_count }}'
    steps:
    - name: brute-defaults
      log-command: "{{ inputs.log_command | default(true) }}"
      run: |
        HOSTS_FILE="{{ jobs['discovery'].outputs.hosts_file | default('/tmp/ofx_alive_hosts.txt', true) }}"
        if [ -f "$HOSTS_FILE" ]; then
          naabu -list "$HOSTS_FILE" -p 22,21,23,3306,5432,6379,27017,1433,5900,8080 -silent 2>/dev/null | nerva --json 2>/dev/null | brutus --json 2>/dev/null | tee ${OFX_RUN_DIR:-/tmp}/ofx_sweep_creds.jsonl
          CRED_COUNT=$(wc -l < ${OFX_RUN_DIR:-/tmp}/ofx_sweep_creds.jsonl 2>/dev/null || echo 0)
          echo "cred_count=$CRED_COUNT" >> {{ env.OFX_OUTPUTS }}
        fi
      continue-on-error: true

  summary:
    name: Network Summary
    needs: [discovery, port-scan, service-id, default-cred-check]
    steps:
    - name: report
      run: |
        echo "======================================================"
        echo " NETWORK SWEEP: {{ inputs.target }}"
        echo "======================================================"
        echo ""
        echo "  Alive hosts: {{ jobs['discovery'].outputs.alive_count | default('?', true) }}"
        echo "  Open ports: {{ jobs['port-scan'].outputs.port_count | default('?', true) }}"
        echo "  Default creds: {{ jobs['default-cred-check'].outputs.cred_count | default('0', true) }}"
        echo ""
        echo "  Hosts file: ${OFX_RUN_DIR:-/tmp}/ofx_alive_hosts.txt"
        echo "  Service scan: ${OFX_RUN_DIR:-/tmp}/ofx_service_scan.txt"
      log-stdout: "{{ inputs.log_output | default(true) }}"
