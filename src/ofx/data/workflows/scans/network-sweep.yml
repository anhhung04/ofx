name: network-sweep
description: |
  Network discovery sweep — fast host discovery, port scanning,
  OS fingerprinting, and service identification across a network
  range for initial reconnaissance.
tags: [scan, network, discovery, recon]
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Network range (CIDR, IP range, or single IP)
      alias: t
    speed:
      type: string
      default: normal
      description: Scan speed (fast, normal, thorough)

jobs:
  discovery:
    name: Host Discovery
    outputs:
      alive_count: '{{ steps.host-sweep.outputs.alive_count }}'
      hosts_file: '{{ steps.host-sweep.outputs.hosts_file }}'
    steps:
    - name: host-sweep
      run: |
        echo "[+] Host discovery: {{ inputs.target }}"

        # Fast ping sweep
        if command -v nmap &>/dev/null; then
          nmap -sn -PE -PP -PS21,22,80,443,445,3389,8080 -PA80,443 -T4 {{ inputs.target }} -oG /tmp/ofx_hosts.gnmap 2>/dev/null

          grep "Up" /tmp/ofx_hosts.gnmap | awk '{print $2}' > /tmp/ofx_alive_hosts.txt
          COUNT=$(wc -l < /tmp/ofx_alive_hosts.txt)
          echo "[+] Alive hosts: $COUNT"
          cat /tmp/ofx_alive_hosts.txt

          echo "alive_count=$COUNT" >> {{ env.OFX_OUTPUTS }}
          echo "hosts_file=/tmp/ofx_alive_hosts.txt" >> {{ env.OFX_OUTPUTS }}
        fi
      log-stdout: true
      continue-on-error: true

  port-scan:
    name: Port Scanning
    needs: [discovery]
    outputs:
      port_count: '{{ steps.fast-portscan.outputs.port_count }}'
      ports_file: '{{ steps.fast-portscan.outputs.ports_file }}'
    steps:
    - name: fast-portscan
      run: |
        echo "[+] Port scanning alive hosts..."
        HOSTS_FILE="/tmp/ofx_alive_hosts.txt"
        if [ ! -f "$HOSTS_FILE" ]; then
          echo "[-] No hosts file found"
          exit 0
        fi

        {% if inputs.speed == 'fast' %}
        naabu -list "$HOSTS_FILE" -top-ports 100 -rate 5000 -o /tmp/ofx_ports.txt 2>/dev/null
        {% elif inputs.speed == 'thorough' %}
        naabu -list "$HOSTS_FILE" -top-ports 1000 -rate 1000 -o /tmp/ofx_ports.txt 2>/dev/null
        {% else %}
        naabu -list "$HOSTS_FILE" -top-ports 500 -rate 2000 -o /tmp/ofx_ports.txt 2>/dev/null
        {% endif %}

        if [ -f /tmp/ofx_ports.txt ]; then
          COUNT=$(wc -l < /tmp/ofx_ports.txt)
          echo "port_count=$COUNT" >> {{ env.OFX_OUTPUTS }}
          echo "ports_file=/tmp/ofx_ports.txt" >> {{ env.OFX_OUTPUTS }}
          echo "[+] Found $COUNT open ports"
          cat /tmp/ofx_ports.txt
        fi
      log-stdout: true
      continue-on-error: true

  service-id:
    name: Service Identification
    needs: [port-scan]
    outputs:
      service_file: '{{ steps.nmap-svc.outputs.service_file }}'
    steps:
    - name: nmap-svc
      run: |
        echo "[+] Service identification..."

        # Run nmap service detection on discovered hosts
        if [ -f /tmp/ofx_alive_hosts.txt ]; then
          nmap -sV -sC --version-intensity 5 -iL /tmp/ofx_alive_hosts.txt \
            -oN /tmp/ofx_service_scan.txt -oX /tmp/ofx_service_scan.xml \
            {% if inputs.speed == 'fast' %}
            --top-ports 100 -T4 \
            {% elif inputs.speed == 'thorough' %}
            --top-ports 1000 -T3 -O \
            {% else %}
            --top-ports 500 -T4 \
            {% endif %}
            2>/dev/null

          echo "service_file=/tmp/ofx_service_scan.txt" >> {{ env.OFX_OUTPUTS }}
          echo "[+] Results: /tmp/ofx_service_scan.txt"
        fi
      log-stdout: true
      continue-on-error: true
      timeout: 30

  summary:
    name: Network Summary
    needs: [discovery, port-scan, service-id]
    steps:
    - name: report
      run: |
        echo "======================================================"
        echo " NETWORK SWEEP: {{ inputs.target }}"
        echo "======================================================"
        echo ""
        echo "  Alive hosts: {{ jobs['discovery'].outputs.alive_count | default('?', true) }}"
        echo "  Open ports: {{ jobs['port-scan'].outputs.port_count | default('?', true) }}"
        echo ""
        echo "  Hosts file: /tmp/ofx_alive_hosts.txt"
        echo "  Service scan: /tmp/ofx_service_scan.txt"
      log-stdout: true
