name: ad-discovery
description: |
  Full Active Directory discovery pipeline — LDAP enumeration, BloodHound
  collection, user enumeration via netexec, and Kerberos-based attacks
  (user spraying, Kerberoasting, AS-REP roasting) using task steps with
  structured output parsing.
tags: [scans, ad, ldap, bloodhound, kerberos, enumeration, task]
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Domain controller IP or hostname
      alias: t
    domain:
      required: true
      type: string
      description: Domain name (e.g. corp.local)
    user:
      required: true
      type: string
      description: Valid domain username
    password:
      required: true
      type: string
      description: Password for authentication

defaults:
  store-creds: true

jobs:
  ldap-enum:
    name: LDAP Domain Enumeration
    outputs:
      user_count: '{{ steps["ldap-summary"].outputs.user_count | default("", true) }}'
      output_dir: '{{ steps["ldap-summary"].outputs.output_dir | default("", true) }}'
    steps:
      - task: ldapdomaindump
        name: ldap-dump
        with:
          target: "{{ inputs.target }}"
          username: "{{ inputs.domain }}\\{{ inputs.user }}"
          password: "{{ inputs.password }}"
          output_dir: ${OFX_RUN_DIR:-/tmp}/ofx_ldapdump
        continue-on-error: true
        log-stdout: "{{ inputs.log_output | default(true) }}"
        log-command: "{{ inputs.log_command | default(true) }}"
      - task: netexec
        log-command: "{{ inputs.log_command | default(true) }}"
        name: nxc-users
        with:
          target: "{{ inputs.target }}"
          protocol: smb
          username: "{{ inputs.user }}"
          password: "{{ inputs.password }}"
          domain: "{{ inputs.domain }}"
          users: true
        continue-on-error: true
      - name: ldap-summary
        script: |
          ldap_users = {{ users(steps["ldap-dump"].outputs.typed_outputs) | tojson }}
          nxc_users = {{ users(steps["nxc-users"].outputs.typed_outputs) | tojson }}

          all_users = set()
          for u in ldap_users + nxc_users:
              uname = u.get('username', '')
              if uname:
                  all_users.add(uname)

          user_file = f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_ad_users.txt"
          with open(user_file, 'w') as f:
              f.write('\n'.join(sorted(all_users)))

          output_dir = f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_ldapdump"
          add_outputs(user_count=len(all_users), output_dir=output_dir, user_file=user_file)
          print(f"[+] LDAP enumeration: {len(all_users)} domain users discovered")

  bloodhound:
    name: BloodHound Collection
    needs: [ldap-enum]
    outputs:
      collection_complete: '{{ steps["bh-status"].outputs.collection_complete | default("", true) }}'
    steps:
      - task: bloodhound-python
        name: bh-collect
        with:
          target: "{{ inputs.domain }}"
          username: "{{ inputs.user }}"
          password: "{{ inputs.password }}"
          domain: "{{ inputs.domain }}"
          dc: "{{ inputs.target }}"
          ns: "{{ inputs.target }}"
          collection: All
          output_dir: true
          dns_tcp: true
        continue-on-error: true
        log-stdout: "{{ inputs.log_output | default(true) }}"
        log-command: "{{ inputs.log_command | default(true) }}"
      - name: bh-status
        script: |
          bh_tags = {{ tags(steps["bh-collect"].outputs.typed_outputs) | tojson }}

          add_outputs(collection_complete=True)
          print("[+] BloodHound collection completed")
          print("    Import ZIP files into BloodHound CE for attack path analysis")

          if bh_tags:
              print(f"    Tags collected: {len(bh_tags)}")

  user-enum:
    name: User & Group Enumeration
    needs: [ldap-enum]
    outputs:
      total_users: '{{ steps["enum-summary"].outputs.total_users | default("", true) }}'
      admin_users: '{{ steps["enum-summary"].outputs.admin_users | default("", true) }}'
    steps:
      - task: netexec
        log-command: "{{ inputs.log_command | default(true) }}"
        name: nxc-groups
        with:
          target: "{{ inputs.target }}"
          protocol: smb
          username: "{{ inputs.user }}"
          password: "{{ inputs.password }}"
          domain: "{{ inputs.domain }}"
          groups: true
        continue-on-error: true
      - task: netexec
        log-command: "{{ inputs.log_command | default(true) }}"
        name: nxc-sessions
        with:
          target: "{{ inputs.target }}"
          protocol: smb
          username: "{{ inputs.user }}"
          password: "{{ inputs.password }}"
          domain: "{{ inputs.domain }}"
          sessions: true
        continue-on-error: true
      - task: netexec
        log-command: "{{ inputs.log_command | default(true) }}"
        name: nxc-loggedon
        with:
          target: "{{ inputs.target }}"
          protocol: smb
          username: "{{ inputs.user }}"
          password: "{{ inputs.password }}"
          domain: "{{ inputs.domain }}"
          loggedon_users: true
        continue-on-error: true
      - task: netexec
        log-command: "{{ inputs.log_command | default(true) }}"
        name: nxc-pass-pol
        with:
          target: "{{ inputs.target }}"
          protocol: smb
          username: "{{ inputs.user }}"
          password: "{{ inputs.password }}"
          domain: "{{ inputs.domain }}"
          pass_pol: true
        continue-on-error: true
      - name: enum-summary
        script: |
          session_users = {{ users(steps["nxc-sessions"].outputs.typed_outputs) | tojson }}
          loggedon = {{ users(steps["nxc-loggedon"].outputs.typed_outputs) | tojson }}

          ldap_users = int('{{ jobs["ldap-enum"].outputs.user_count }}' or 0)
          active_users = set()

          for u in session_users + loggedon:
              uname = u.get('username', '')
              if uname:
                  active_users.add(uname)

          admin_users = [u for u in session_users + loggedon if u.get('privilege_level') and 'admin' in u.get('privilege_level', '').lower()]

          add_outputs(total_users=ldap_users, admin_users=len(admin_users), active_sessions=len(active_users))
          print(f"[+] Total domain users: {ldap_users}")
          print(f"[+] Active sessions: {len(active_users)}")
          print(f"[+] Admin users spotted: {len(admin_users)}")

          if active_users:
              print("\n  Active sessions:")
              for u in sorted(active_users)[:20]:
                  print(f"    - {u}")
        log-stdout: "{{ inputs.log_output | default(true) }}"

  kerberos-scan:
    name: Kerberos Attack Surface
    needs: [user-enum]
    outputs:
      spn_count: '{{ steps["kerb-summary"].outputs.spn_count | default("", true) }}'
      asrep_count: '{{ steps["kerb-summary"].outputs.asrep_count | default("", true) }}'
      valid_count: '{{ steps["kerb-summary"].outputs.valid_count | default("", true) }}'
    steps:
      - task: kerbrute
        name: kerbrute-enum
        with:
          target: "{{ inputs.target }}"
          mode: userenum
          dc: "{{ inputs.target }}"
          domain: "{{ inputs.domain }}"
          users: "{{ jobs['ldap-enum'].outputs.user_file | default('/tmp/ofx_ad_users.txt', true) }}"
        continue-on-error: true
        log-stdout: "{{ inputs.log_output | default(true) }}"
        log-command: "{{ inputs.log_command | default(true) }}"
      - task: getuserspns
        name: spn-enum
        with:
          target: "{{ inputs.domain }}"
          username: "{{ inputs.user }}"
          password: "{{ inputs.password }}"
          dc_ip: "{{ inputs.target }}"
        continue-on-error: true
        log-stdout: "{{ inputs.log_output | default(true) }}"
        log-command: "{{ inputs.log_command | default(true) }}"
      - task: getnpusers
        name: asrep-enum
        with:
          target: "{{ inputs.domain }}"
          username: "{{ inputs.user }}"
          password: "{{ inputs.password }}"
          dc_ip: "{{ inputs.target }}"
        continue-on-error: true
        log-stdout: "{{ inputs.log_output | default(true) }}"
        log-command: "{{ inputs.log_command | default(true) }}"
      - name: kerb-summary
        script: |
          kerb_users = {{ users(steps["kerbrute-enum"].outputs.typed_outputs) | tojson }}
          spn_accounts = {{ users(steps["spn-enum"].outputs.typed_outputs) | tojson }}
          asrep_accounts = {{ users(steps["asrep-enum"].outputs.typed_outputs) | tojson }}

          add_outputs(
              valid_count=len(kerb_users),
              spn_count=len(spn_accounts),
              asrep_count=len(asrep_accounts)
          )

          print("=" * 55)
          print(" AD DISCOVERY — KERBEROS SCAN RESULTS")
          print("=" * 55)
          print(f"  Valid Kerberos accounts:   {len(kerb_users)}")
          print(f"  Kerberoastable (SPN):      {len(spn_accounts)}")
          print(f"  AS-REP Roastable:          {len(asrep_accounts)}")
          print("-" * 55)

          if spn_accounts:
              print("\n  [!] Kerberoastable accounts:")
              for a in spn_accounts[:15]:
                  print(f"    - {a.get('username', 'unknown')}@{a.get('domain', '')}")

          if asrep_accounts:
              print("\n  [!] AS-REP Roastable accounts:")
              for a in asrep_accounts[:15]:
                  print(f"    - {a.get('username', 'unknown')}@{a.get('domain', '')}")

          if not spn_accounts and not asrep_accounts:
              print("\n  [*] No Kerberos attack vectors found")
        log-stdout: "{{ inputs.log_output | default(true) }}"
