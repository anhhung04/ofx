# yaml-language-server: $schema=~/.ofx/workflow_schema.json
name: gogo-zombie
description: |
  Network scan and credential brute-force pipeline — uses gogo for fast
  port scanning with fingerprinting, then chains zombie to automatically
  brute-force discovered services using gogo's result file (-g).

tags:
  - recon
  - brute
  - gogo
  - zombie
  - internal

dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target IP, CIDR, or file with hosts (e.g. 192.168.1.0/24)
      alias: t
    ports:
      type: string
      default: "top2,win,db"
      description: "Port preset or range (e.g. top2,win,db or 1-65535)"
    mod:
      type: string
      default: ""
      description: "Smart scan mode (s=smart, ss=supersmart, sc=smart-C, default=normal)"
    services:
      type: string
      default: ""
      description: "Filter specific services for zombie (e.g. ssh,mysql,smb)"
    user:
      type: string
      default: ""
      description: "Single username for brute-force"
    user_file:
      type: string
      default: ""
      description: "File with usernames"
    password:
      type: string
      default: ""
      description: "Single password for spray"
    password_file:
      type: string
      default: ""
      description: "File with passwords"
    threads:
      type: string
      default: "100"
      description: "Zombie threads"
    weakpass:
      type: string
      default: "false"
      description: "Enable weak password generation (true/false)"

defaults:
  store-creds: true

jobs:
  scan:
    name: "Network Scan (gogo)"
    outputs:
      scan_file: '{{ steps["gogo-scan"].outputs.output_file | default("", true) }}'
    steps:
      - task: gogo
        log-command: true
        name: gogo-scan
        continue-on-error: true
        with:
          target: "{{ inputs.target }}"
          ports: "{{ inputs.ports }}"
          mod: "{{ inputs.mod if inputs.mod else omit }}"
          verbose: true

      - name: scan-summary
        script: |
          ports = {{ ports(steps["gogo-scan"].outputs.typed_outputs) | default([], true) | tojson }}
          urls = {{ urls(steps["gogo-scan"].outputs.typed_outputs) | default([], true) | tojson }}
          tags = {{ tags(steps["gogo-scan"].outputs.typed_outputs) | default([], true) | tojson }}

          services = set()
          for p in ports:
              svc = p.get("service_name", "")
              if svc:
                  services.add(svc)

          print(f"Discovered {len(ports)} open ports across {len(set(p.get('ip','') for p in ports))} hosts")
          print(f"Found {len(urls)} HTTP endpoints")
          print(f"Detected {len(tags)} technology fingerprints")
          print(f"Services: {', '.join(sorted(services)) if services else 'none identified'}")

  brute:
    name: "Service Brute-Force (zombie)"
    needs: [scan]
    if: '{{ jobs["scan"].outputs.scan_file }}'
    steps:
      - task: zombie
        log-command: true
        name: zombie-brute
        with:
          target: "{{ inputs.target }}"
          gogo: '{{ jobs["scan"].outputs.scan_file }}'
          filter_service: "{{ inputs.services if inputs.services else omit }}"
          user: "{{ inputs.user if inputs.user else omit }}"
          user_file: "{{ inputs.user_file if inputs.user_file else omit }}"
          password: "{{ inputs.password if inputs.password else omit }}"
          password_file: "{{ inputs.password_file if inputs.password_file else omit }}"
          threads: "{{ inputs.threads }}"
          weakpass: "{{ inputs.weakpass == 'true' }}"
        store-creds: true
        continue-on-error: true

      - name: brute-summary
        script: |
          accounts = {{ users(steps["zombie-brute"].outputs.typed_outputs) | default([], true) | tojson }}
          if accounts:
              print(f"Found {len(accounts)} valid credential(s):")
              for a in accounts:
                  user = a.get("username", "")
                  host = a.get("host", "")
                  comment = a.get("comment", "")
                  print(f"  {user}@{host} ({comment})")
          else:
              print("No valid credentials found")
