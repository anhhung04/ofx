name: host-scan
description: >
  Comprehensive host security assessment — combines host reconnaissance, WAF/CDN detection,
  SSL/TLS auditing, URL crawling, JS analysis, parameter discovery, secret scanning,
  service brute-forcing, and multi-vector vulnerability analysis.

tags: [recon, dns, network, http, crawl, ssl, vuln, secrets, params, brute]
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target host, IP address, or URL
      alias: t

jobs:
  # ── Phase 0: Resolve target ──────────────────────────────────────
  target-resolve:
    name: Target Resolution
    outputs:
      hostname: '{{ steps["resolve"].outputs.hostname | default("", true) }}'
      ip: '{{ steps["resolve"].outputs.ip | default("", true) }}'
      all_ips: '{{ steps["resolve"].outputs.all_ips | default("", true) }}'
      ip_count: '{{ steps["resolve"].outputs.ip_count | default("1", true) }}'
      is_multi_ip: '{{ steps["resolve"].outputs.is_multi_ip | default("false", true) }}'
      original_target: '{{ steps["resolve"].outputs.original_target | default("", true) }}'
      cdn_detected: '{{ "true" if (steps["cdn-detect"].outputs.typed_outputs | default([], true) | length > 0) else "false" }}'
    steps:
      - name: resolve
        script: |
          import socket
          from urllib.parse import urlparse

          raw_target = '{{ inputs.target }}'.strip()
          hostname = original_target = raw_target
          if '://' in raw_target:
              parsed = urlparse(raw_target)
              hostname = parsed.hostname or parsed.netloc.split(':')[0]
          elif '/' in raw_target:
              hostname = raw_target.split('/')[0]
          if ':' in hostname and not hostname.startswith('['):
              hostname = hostname.rsplit(':', 1)[0]
          is_ip = False
          try:
              socket.inet_pton(socket.AF_INET, hostname)
              is_ip = True
          except OSError:
              try:
                  socket.inet_pton(socket.AF_INET6, hostname)
                  is_ip = True
              except OSError:
                  pass
          if is_ip:
              print(f"Target is an IP address: {hostname}")
              add_outputs(hostname=hostname, ip=hostname, all_ips=hostname,
                  ip_count=1, is_multi_ip='false', original_target=original_target)
          else:
              try:
                  results = socket.getaddrinfo(hostname, None, socket.AF_INET, socket.SOCK_STREAM)
                  ips = sorted(set(r[4][0] for r in results))
              except socket.gaierror:
                  print(f"WARNING: Cannot resolve {hostname} — using as-is")
                  ips = []
              if not ips:
                  add_outputs(hostname=hostname, ip=hostname, all_ips='',
                      ip_count=0, is_multi_ip='false', original_target=original_target)
              elif len(ips) == 1:
                  print(f"Resolved: {hostname} → {ips[0]}")
                  add_outputs(hostname=hostname, ip=ips[0], all_ips=ips[0],
                      ip_count=1, is_multi_ip='false', original_target=original_target)
              else:
                  print(f"⚠ {hostname} resolves to {len(ips)} IPs — likely behind CDN/proxy/load balancer:")
                  for ip in ips: print(f"  {ip}")
                  add_outputs(hostname=hostname, ip=ips[0], all_ips=','.join(ips),
                      ip_count=len(ips), is_multi_ip='true', original_target=original_target)
      - task: cdncheck
        timeout: 5
        name: cdn-detect
        run_if: "{{ steps['resolve'].outputs.is_multi_ip == 'true' }}"
        with:
          input: "{{ steps['resolve'].outputs.hostname }}"
        retry: 2
        retry-delay: 5
        continue-on-error: true
  # ── Phase 1: Host Reconnaissance ─────────────────────────────────
  host-recon:
    name: Host Reconnaissance
    needs: [target-resolve]
    outputs:
      live_urls: '{{ steps["export-data"].outputs.live_urls | default("", true) }}'
      waf_detected: '{{ steps["export-data"].outputs.waf_detected | default("unknown", true) }}'
    steps:
      - task: rustscan
        log-command: true
        timeout: 15
        name: rustscan-fast
        with:
          target: "{{ jobs['target-resolve'].outputs.hostname }}"
          range: 1-65535
          batch_size: 4500
        retry: 2
        retry-delay: 5
        continue-on-error: true
      - task: naabu
        log-command: true
        timeout: 15
        name: port-discovery
        with:
          target: "{{ jobs['target-resolve'].outputs.hostname }}"
          top_ports: "1000"
          rate: 1000
        retry: 2
        retry-delay: 5
        continue-on-error: true
      - task: masscan
        log-command: true
        timeout: 15
        name: masscan-scan
        with:
          target: "{{ jobs['target-resolve'].outputs.ip }}"
          top_ports: "100"
          rate: 1000
        retry: 2
        retry-delay: 5
        continue-on-error: true
      - task: nmap
        log-command: true
        timeout: 30
        name: service-detect
        with:
          target: "{{ jobs['target-resolve'].outputs.hostname }}"
          version_detection: true
        retry: 2
        retry-delay: 5
        continue-on-error: true
      - task: nerva
        log-command: true
        timeout: 10
        name: nerva-fingerprint
        with:
          target: "{{ jobs['target-resolve'].outputs.hostname }}"
        retry: 2
        retry-delay: 5
        continue-on-error: true
      - task: ssh-audit
        log-command: true
        timeout: 10
        name: ssh-audit
        with:
          target: "{{ jobs['target-resolve'].outputs.hostname }}"
        retry: 2
        retry-delay: 5
        continue-on-error: true
      - task: httpx
        log-command: true
        timeout: 15
        name: http-probe
        with:
          target: "{{ jobs['target-resolve'].outputs.hostname }}"
          tech_detect: true
          status_code: true
          follow_redirects: true
        retry: 2
        retry-delay: 5
        continue-on-error: true
      - task: wafw00f
        timeout: 10
        name: waf-detect
        with:
          target: "{{ jobs['target-resolve'].outputs.hostname }}"
          all: true
        retry: 2
        retry-delay: 5
        continue-on-error: true
      - task: searchsploit
        timeout: 5
        name: exploit-search
        with:
          target: "{{ jobs['target-resolve'].outputs.hostname }}"
        retry: 2
        retry-delay: 5
        continue-on-error: true
      - name: export-data
        script: |
          typed = {{ steps["http-probe"].outputs.typed_outputs | default([], true) | tojson }}
          live = [item["url"] for item in typed
                  if item.get("_type") == "url" and item.get("status_code", 0) > 0]
          waf_out = {{ steps["waf-detect"].outputs.typed_outputs | default([], true) | tojson }}
          waf_names = [item.get("name", "") or item.get("value", "")
                       for item in waf_out if isinstance(item, dict)]
          waf_names = [n for n in waf_names if n]
          waf_detected = ','.join(waf_names) if waf_names else 'none'
          add_outputs(live_urls='\n'.join(sorted(set(live))), waf_detected=waf_detected)
  # ── Phase 2a: SSL/TLS Audit ──────────────────────────────────────
  ssl-audit:
    name: SSL/TLS Audit
    needs: [host-recon]
    outputs:
      typed_outputs: '{{ (steps["testssl-check"].outputs.typed_outputs | default([], true)) + (steps["sslscan-check"].outputs.typed_outputs | default([], true)) }}'
    steps:
      - task: testssl
        timeout: 20
        name: testssl-check
        with:
          target: "{{ jobs['target-resolve'].outputs.hostname }}"
          protocols: true
          vulnerabilities: true
        retry: 2
        retry-delay: 5
        continue-on-error: true
      - task: sslscan
        timeout: 15
        name: sslscan-check
        with:
          target: "{{ jobs['target-resolve'].outputs.hostname }}"
          show_certificate: true
        retry: 2
        retry-delay: 5
        continue-on-error: true
  # ── Phase 2b: Service Brute-Force ────────────────────────────────
  service-brute:
    name: Service Brute-Force
    needs: [host-recon]
    outputs:
      typed_outputs: '{{ steps["brute-services"].outputs.typed_outputs | default([], true) }}'
    steps:
      - task: brutespray
        timeout: 30
        name: brute-services
        with:
          target: "{{ jobs['target-resolve'].outputs.hostname }}"
          threads: 5
        retry: 2
        retry-delay: 5
        continue-on-error: true
  # ── Phase 2c: Web Analysis ───────────────────────────────────────
  web-analysis:
    name: Web Analysis
    needs: [host-recon]
    outputs:
      typed_outputs: '{{ (steps["whatweb-fingerprint"].outputs.typed_outputs | default([], true)) + (steps["nikto-scan"].outputs.typed_outputs | default([], true)) }}'
    steps:
      - task: whatweb
        log-command: true
        name: whatweb-fingerprint
        timeout: 15
        with:
          target: "{{ jobs['target-resolve'].outputs.hostname }}"
          aggression: 3
        retry: 2
        retry-delay: 5
        continue-on-error: true
      - task: nikto
        log-command: true
        timeout: 20
        name: nikto-scan
        with:
          target: "{{ jobs['target-resolve'].outputs.hostname }}"
          maxtime: 900
        retry: 2
        retry-delay: 5
        continue-on-error: true
  # ── Phase 2d: URL Crawling ───────────────────────────────────────
  url-crawl:
    name: URL Crawling
    needs: [host-recon]
    outputs:
      typed_outputs: "{{ (steps.crawl.outputs.typed_outputs | default([], true)) + (steps.spider.outputs.typed_outputs | default([], true)) + (steps['js-extract'].outputs.typed_outputs | default([], true)) }}"
      js_findings: '{{ steps["js-extract"].outputs.typed_outputs | default([], true) }}'
    steps:
      - task: katana
        log-command: true
        timeout: 20
        name: crawl
        with:
          target: "{{ jobs['host-recon'].outputs.live_urls | default(jobs['target-resolve'].outputs.hostname, true) }}"
          depth: 3
        retry: 2
        retry-delay: 5
        continue-on-error: true
      - task: gospider
        log-command: true
        timeout: 20
        name: spider
        with:
          target: "{{ jobs['host-recon'].outputs.live_urls | default(jobs['target-resolve'].outputs.hostname, true) }}"
          depth: 2
        retry: 2
        retry-delay: 5
        continue-on-error: true
      - task: jsluice
        timeout: 15
        name: js-extract
        with:
          target: "{{ jobs['host-recon'].outputs.live_urls | default(jobs['target-resolve'].outputs.hostname, true) }}"
        retry: 2
        retry-delay: 5
        continue-on-error: true
  # ── Phase 3a: Parameter Discovery ────────────────────────────────
  param-discovery:
    name: Parameter Discovery
    needs: [url-crawl]
    outputs:
      param_urls: '{{ steps["merge-params"].outputs.param_urls | default("", true) }}'
    steps:
      - task: arjun
        timeout: 20
        name: arjun-discover
        with:
          target: "{{ jobs['host-recon'].outputs.live_urls | default(jobs['target-resolve'].outputs.hostname, true) }}"
          threads: 5
        retry: 2
        retry-delay: 5
        continue-on-error: true
      - task: x8
        timeout: 20
        name: x8-discover
        with:
          target: "{{ jobs['host-recon'].outputs.live_urls | default(jobs['target-resolve'].outputs.hostname, true) }}"
        retry: 2
        retry-delay: 5
        continue-on-error: true
      - task: paramspider
        timeout: 15
        name: paramspider-mine
        with:
          target: "{{ jobs['target-resolve'].outputs.hostname }}"
        retry: 2
        retry-delay: 5
        continue-on-error: true
      - name: merge-params
        script: |
          all_urls = set()
          for step_data in [
              {{ urls(steps["arjun-discover"].outputs.typed_outputs | default([], true)) | tojson }},
              {{ urls(steps["x8-discover"].outputs.typed_outputs | default([], true)) | tojson }},
              {{ urls(steps["paramspider-mine"].outputs.typed_outputs | default([], true)) | tojson }},
          ]:
              for item in step_data:
                  u = item.get("url", "") if isinstance(item, dict) else str(item)
                  if u and '?' in u:
                      all_urls.add(u)
          param_urls = '\n'.join(sorted(all_urls))
          print(f"Discovered {len(all_urls)} parameterized URLs")
          add_outputs(param_urls=param_urls)
  # ── Phase 3b: Secret Scanning ────────────────────────────────────
  secret-scan:
    name: Secret Scanning
    needs: [url-crawl]
    outputs:
      typed_outputs: '{{ (steps["nuclei-secrets"].outputs.typed_outputs | default([], true)) + (steps["gitleaks-scan"].outputs.typed_outputs | default([], true)) }}'
    steps:
      - task: nuclei
        timeout: 20
        name: nuclei-secrets
        with:
          target: "{{ jobs['host-recon'].outputs.live_urls | default(jobs['target-resolve'].outputs.hostname, true) }}"
          tags: "exposure,secret,token,api-key"
        retry: 2
        retry-delay: 5
        continue-on-error: true
      - task: gitleaks
        timeout: 15
        name: gitleaks-scan
        with:
          target: "{{ jobs['target-resolve'].outputs.hostname }}"
          verbose: true
        retry: 2
        retry-delay: 5
        continue-on-error: true
  # ── Phase 4: Vulnerability Scanning ──────────────────────────────
  vuln-scan:
    name: Vulnerability Scanning
    needs: [web-analysis, param-discovery, secret-scan, ssl-audit, service-brute]
    outputs:
      typed_outputs: >
        {{ (steps["nuclei-scan"].outputs.typed_outputs | default([], true)) +
           (steps["xss-scan"].outputs.typed_outputs | default([], true)) +
           (steps["sqli-scan"].outputs.typed_outputs | default([], true)) +
           (steps["crlf-scan"].outputs.typed_outputs | default([], true)) +
           (steps["cmdi-scan"].outputs.typed_outputs | default([], true)) }}
    steps:
      - task: nuclei
        log-command: true
        timeout: 30
        name: nuclei-scan
        with:
          target: "{{ jobs['host-recon'].outputs.live_urls | default(jobs['target-resolve'].outputs.hostname, true) }}"
          severity: critical,high,medium
        retry: 2
        retry-delay: 5
        continue-on-error: true
      - task: dalfox
        log-command: true
        timeout: 20
        name: xss-scan
        with:
          target: "{{ jobs['host-recon'].outputs.live_urls | default(jobs['target-resolve'].outputs.hostname, true) }}"
        retry: 2
        retry-delay: 5
        continue-on-error: true
      - task: sqlmap
        timeout: 30
        name: sqli-scan
        run_if: "{{ jobs['param-discovery'].outputs.param_urls != '' }}"
        with:
          target: "{{ jobs['param-discovery'].outputs.param_urls.split('\n') | first }}"
          level: 2
          risk: 2
          random_agent: true
        retry: 2
        retry-delay: 5
        continue-on-error: true
      - task: crlfuzz
        timeout: 15
        name: crlf-scan
        with:
          target: "{{ jobs['host-recon'].outputs.live_urls | default(jobs['target-resolve'].outputs.hostname, true) }}"
        retry: 2
        retry-delay: 5
        continue-on-error: true
      - task: commix
        timeout: 25
        name: cmdi-scan
        run_if: "{{ jobs['param-discovery'].outputs.param_urls != '' }}"
        with:
          target: "{{ jobs['param-discovery'].outputs.param_urls.split('\n') | first }}"
          level: 2
        retry: 2
        retry-delay: 5
        continue-on-error: true
      - name: final-summary
        log-stdout: true
        script: |
          hostname = '{{ jobs["target-resolve"].outputs.hostname }}'
          ip = '{{ jobs["target-resolve"].outputs.ip }}'
          is_multi = '{{ jobs["target-resolve"].outputs.is_multi_ip }}' == 'true'
          cdn = '{{ jobs["target-resolve"].outputs.cdn_detected }}' == 'true'
          waf_status = '{{ jobs["host-recon"].outputs.waf_detected | default("unknown", true) }}'
          live_urls = '''{{ jobs['host-recon'].outputs.live_urls | default('', true) }}'''.strip()
          live_count = len(live_urls.splitlines()) if live_urls else 0
          all_vulns = {{ vulns(steps["nuclei-scan"].outputs.typed_outputs | default([], true)) | tojson }} + \
                      {{ vulns(steps["xss-scan"].outputs.typed_outputs | default([], true)) | tojson }} + \
                      {{ vulns(steps["sqli-scan"].outputs.typed_outputs | default([], true)) | tojson }} + \
                      {{ vulns(steps["crlf-scan"].outputs.typed_outputs | default([], true)) | tojson }} + \
                      {{ vulns(steps["cmdi-scan"].outputs.typed_outputs | default([], true)) | tojson }}
          by_sev = lambda s: [v for v in all_vulns if v.get('severity') == s]
          critical, high, medium = by_sev('critical'), by_sev('high'), by_sev('medium')
          low, info = by_sev('low'), by_sev('info')
          ssl_typed = {{ jobs['ssl-audit'].outputs.typed_outputs | default([], true) | tojson }}
          ssl_vulns = [v for v in ssl_typed if v.get('_type') == 'vulnerability']
          brute_typed = {{ jobs['service-brute'].outputs.typed_outputs | default([], true) | tojson }}
          brute_accounts = [a for a in brute_typed if a.get('_type') == 'user_account']
          secret_typed = {{ jobs['secret-scan'].outputs.typed_outputs | default([], true) | tojson }}
          param_raw = '''{{ jobs['param-discovery'].outputs.param_urls | default('', true) }}'''.strip()
          param_count = len(param_raw.splitlines()) if param_raw else 0
          js_typed = {{ jobs['url-crawl'].outputs.js_findings | default([], true) | tojson }}

          print("=" * 55)
          print(f" HOST SCAN COMPLETE: {hostname}")
          if ip and ip != hostname: print(f" IP: {ip}")
          if is_multi: print(f" ⚠ Multi-IP target{' (CDN confirmed)' if cdn else ''}")
          if waf_status not in ('none', 'unknown'): print(f" 🛡 WAF detected: {waf_status}")
          print("=" * 55)
          print("── Reconnaissance ──")
          print(f"  Live URLs: {live_count}  |  Param URLs: {param_count}  |  JS findings: {len(js_typed)}")
          print(f"  WAF: {waf_status}  |  CDN: {'yes' if cdn else 'no'}")
          print("── SSL/TLS ──")
          print(f"  Issues found:     {len(ssl_vulns)}")
          print("── Brute-Force ──")
          print(f"  Accounts found:   {len(brute_accounts)}")
          print("── Secrets ──")
          print(f"  Exposures found:  {len(secret_typed)}")
          print("── Vulnerabilities ──")
          print(f"  Critical: {len(critical)}  |  High: {len(high)}  |  Medium: {len(medium)}")
          print(f"  Low: {len(low)}  |  Info: {len(info)}  |  Total: {len(all_vulns)}")
          print("=" * 55)
      - name: export-to-project
        script: |
          from pathlib import Path
          project = '{{ vars.project_path | default("", true) }}'
          if not project:
              print('No --project set, skipping file export')
          else:
              d = '{{ vars.project_web }}'
              Path(d).mkdir(parents=True, exist_ok=True)
              for fname, content in [
                  ('http-urls.txt', '''{{ jobs['host-recon'].outputs.live_urls | default('', true) }}'''.strip()),
                  ('param-urls.txt', '''{{ jobs['param-discovery'].outputs.param_urls | default('', true) }}'''.strip()),
              ]:
                  if content:
                      (Path(d) / fname).write_text(content)
                      print(f'  [+] web/{fname} ({len(content.splitlines())} lines)')
              all_typed = []
              for typed in [
                  {{ jobs['host-recon'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['web-analysis'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['url-crawl'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['ssl-audit'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['service-brute'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['secret-scan'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['vuln-scan'].outputs.typed_outputs | default([], true) | tojson }},
              ]:
                  all_typed.extend(typed)
              for s in export_typed_outputs(project, all_typed):
                  print(s)
              print(f'Project export complete: {project}')
        continue-on-error: true
