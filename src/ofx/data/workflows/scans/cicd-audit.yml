name: cicd-audit
description: |
  CI/CD pipeline security audit — scan GitHub Actions workflows
  for injection vulnerabilities, misconfigured permissions, and
  repository security posture issues using poutine and legitify.
tags: [cicd, github, security, audit]
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: GitHub org or org/repo to scan
      alias: t
    token:
      type: string
      default: ""
      description: GitHub token for API access

jobs:
  pipeline-scan:
    name: CI/CD Pipeline Scan
    outputs:
      finding_count: '{{ steps["poutine-scan"].outputs.finding_count | default("", true) }}'
      typed_outputs: '{{ steps["poutine-scan"].outputs.typed_outputs | default([], true) }}'
    steps:
      - task: poutine
        timeout: 20
        name: poutine-scan
        with:
          target: "{{ inputs.target }}"
          token: '{{ inputs.token or "" }}'
        continue-on-error: true

  posture-check:
    name: SCM Posture Check
    outputs:
      finding_count: '{{ steps["legitify-scan"].outputs.finding_count | default("", true) }}'
      typed_outputs: '{{ steps["legitify-scan"].outputs.typed_outputs | default([], true) }}'
    steps:
      - task: legitify
        timeout: 20
        name: legitify-scan
        with:
          target: "{{ inputs.target }}"
          token: '{{ inputs.token or "" }}'
        continue-on-error: true

  summary:
    name: CI/CD Audit Summary
    needs: [pipeline-scan, posture-check]
    steps:
      - name: report
        script: |
          poutine_count = '{{ jobs["pipeline-scan"].outputs.finding_count | default("0", true) }}'
          legitify_count = '{{ jobs["posture-check"].outputs.finding_count | default("0", true) }}'

          print("=" * 56)
          print(" CI/CD SECURITY AUDIT COMPLETE: {{ inputs.target }}")
          print("=" * 56)
          print()
          print("--- Pipeline Security (poutine) ---")
          print(f"  Workflow vulnerabilities: {poutine_count}")
          print()
          print("--- SCM Posture (legitify) ---")
          print(f"  Policy violations: {legitify_count}")
        log-stdout: true
