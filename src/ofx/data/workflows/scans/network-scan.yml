name: network-scan
description: |
  Internal network scan — discovers live hosts in a CIDR range, checks default
  credentials via naabu/nerva/brutus pipeline, then deep-scans each live host
  via host-scan matrix (port scan, service detect, web fingerprint, crawl, vuln scan).
tags:
  - recon
  - cidr
  - dns
  - network
  - internal
  - http
  - crawl
  - ssl
  - vuln
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: CIDR range (e.g. 192.168.1.0/24)
      alias: t
defaults:
  store-creds: true
jobs:
  # ── Phase 1: Host Discovery ────────────────────────────────────────
  network-discovery:
    name: Network Discovery
    outputs:
      hosts_file: '{{ steps["collect-hosts"].outputs.hosts_file | default("", true) }}'
      host_count: '{{ steps["collect-hosts"].outputs.host_count | default("0", true) }}'
      live_hosts_json: '{{ steps["collect-hosts"].outputs.live_hosts_json | default("[]", true) }}'
    steps:
      - task: fping
        log-command: true
        name: fping-discovery
        timeout: "{{ [[5, cidr_size(inputs.target) // 5000 + 1] | max, 120] | min }}"
        with:
          target: "{{ inputs.target }}"
          generate: true
        continue-on-error: true
      - task: nmap
        log-command: true
        name: host-discovery
        timeout: "{{ [[10, cidr_size(inputs.target) // 200 + 5] | max, 480] | min }}"
        with:
          target: "{{ inputs.target }}"
          timing: 4
        continue-on-error: true
      - task: naabu
        log-command: true
        name: port-sweep
        timeout: "{{ [[10, cidr_size(inputs.target) // 500 + 5] | max, 240] | min }}"
        with:
          target: "{{ inputs.target }}"
          top_ports: "1000"
          rate: 2000
        continue-on-error: true
      - task: masscan
        log-command: true
        name: masscan-sweep
        timeout: "{{ [[10, cidr_size(inputs.target) // 1000 + 5] | max, 120] | min }}"
        with:
          target: "{{ inputs.target }}"
          top_ports: "100"
          rate: 2000
          wait: 0
        continue-on-error: true
      - name: collect-hosts
        script: |
          import json
          from pathlib import Path

          hosts = set()

          for item in {{ ips(steps["fping-discovery"].outputs.typed_outputs) | default([], true) | tojson }}:
              if item.get('alive'):
                  hosts.add(item.get('ip', ''))

          for item in {{ ips(steps["host-discovery"].outputs.typed_outputs) | default([], true) | tojson }}:
              if item.get('alive') or item.get('ip'):
                  hosts.add(item.get('ip', ''))

          for item in {{ ports(steps["port-sweep"].outputs.typed_outputs) | default([], true) | tojson }}:
              h = item.get('host') or item.get('ip', '')
              if h:
                  hosts.add(h)

          for item in {{ ports(steps["masscan-sweep"].outputs.typed_outputs) | default([], true) | tojson }}:
              h = item.get('host') or item.get('ip', '')
              if h:
                  hosts.add(h)

          hosts.discard('')
          hosts_list = sorted(hosts)
          hosts_path = f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_netscan_hosts.txt'
          Path(hosts_path).write_text('\n'.join(hosts_list))
          add_outputs(
              hosts_file=hosts_path,
              host_count=len(hosts_list),
              live_hosts_json=json.dumps(hosts_list),
          )
          print(f"Discovered {len(hosts_list)} live hosts")

  # ── Phase 2a: Default Cred Check (parallel) ────────────────────────
  default-cred-check:
    name: Default Credential Check
    needs: [network-discovery]
    outputs:
      cred_count: '{{ steps["parse-brutus"].outputs.cred_count | default("0", true) }}'
    steps:
      - name: run-pipeline
        log-command: true
        run: |
          naabu -list {{ jobs['network-discovery'].outputs.hosts_file }} \
            -p 22,21,445,3306,5432,6379,3389,5900,27017,1433 -silent 2>/dev/null | \
            nerva --json 2>/dev/null | \
            brutus --json 2>/dev/null | tee ${OFX_RUN_DIR:-/tmp}/ofx_netscan_brutus.jsonl
        timeout: "{{ [[10, jobs['network-discovery'].outputs.host_count | int // 10 + 5] | max, 120] | min }}"
        continue-on-error: true
      - name: parse-brutus
        script: |
          import json
          from pathlib import Path

          creds = []
          brutus_path = f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_netscan_brutus.jsonl'
          try:
              for line in Path(brutus_path).read_text().splitlines():
                  line = line.strip()
                  if not line or not line.startswith('{'):
                      continue
                  try:
                      data = json.loads(line)
                      username = data.get('username', data.get('login', ''))
                      password = data.get('password', data.get('pass', ''))
                      host = data.get('host', data.get('ip', ''))
                      port = str(data.get('port', ''))
                      service = data.get('service', '')
                      if username:
                          creds.append({'user': username, 'pass': password,
                                        'host': f"{host}:{port}", 'service': service})
                  except json.JSONDecodeError:
                      continue
          except FileNotFoundError:
              pass

          add_outputs(cred_count=len(creds))
          if creds:
              print(f"[!] Default credentials found: {len(creds)}")
              for c in creds:
                  print(f"  [+] {c['host']} ({c['service']}): {c['user']}:{c['pass']}")
          else:
              print("[*] No default credentials found")
        log-stdout: true

  # ── Phase 2b: Per-host Deep Scan via host-scan (parallel) ──────────
  per-host-scan:
    name: "Host scan: {{ matrix.target }}"
    needs: [network-discovery]
    strategy:
      matrix:
        target: "{{ jobs['network-discovery'].outputs.live_hosts_json }}"
      max_parallel: 8
      fail_fast: false
    steps:
      - name: scan-host
        log-command: true
        uses: host-scan
        with:
          target: "{{ matrix.target }}"

  # ── Phase 3: Summary ──────────────────────────────────────────────
  summary:
    name: Network Scan Summary
    needs: [per-host-scan, default-cred-check]
    steps:
      - name: report
        run: |
          echo "======================================================"
          echo " NETWORK SCAN COMPLETE: {{ inputs.target }}"
          echo "======================================================"
          echo "Live hosts:       {{ jobs['network-discovery'].outputs.host_count }}"
          echo "Default creds:    {{ jobs['default-cred-check'].outputs.cred_count }}"
          echo "Hosts deep-scanned: {{ jobs['network-discovery'].outputs.host_count }}"
          echo "(Each host: port scan, service detect, web fingerprint, crawl, vuln scan)"
        log-stdout: true
      - name: export-to-project
        script: |
          import shutil
          from pathlib import Path

          project = '{{ vars.project_path | default("", true) }}'
          if not project:
              print('No --project set, skipping file export')
          else:
              src = '{{ jobs["network-discovery"].outputs.hosts_file | default("", true) }}'
              if src and Path(src).is_file():
                  d = Path('{{ vars.project_hosts }}')
                  d.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, d / 'alive-hosts.txt')
                  print('  [+] hosts/alive-hosts.txt')
              print(f'Project export complete: {project}')
        continue-on-error: true
