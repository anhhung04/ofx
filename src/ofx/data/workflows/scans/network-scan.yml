# yaml-language-server: $schema=~/.ofx/workflow_schema.json
name: network-scan
description: >
  Internal network scan — discovers live hosts in a CIDR range, scans services,
  and performs web application testing on discovered hosts.
tags: [recon, cidr, dns, network, internal, http, crawl, ssl, vuln]

dispatch:
  inputs:
    target:
      required: true
      type: string
      description: CIDR range (e.g. 192.168.1.0/24)

jobs:
  network-discovery:
    name: "Network Discovery"
    steps:
      - task: nmap
        name: host-discovery
        with:
          target: "{{ inputs.target }}"
          timing: 4

      - task: naabu
        name: port-scan
        with:
          target: "{{ inputs.target }}"
          top_ports: "1000"
          rate: 2000

      - name: collect-hosts
        script: |
          import json

          hosts = set()
          for idx in [0, 1]:
              step_data = {{ steps | tojson }}
              typed = step_data[idx].get('outputs', {}).get('typed_outputs', [])
              for item in typed:
                  if item.get('_type') == 'port':
                      host = item.get('host') or item.get('ip', '')
                      if host:
                          hosts.add(host)
                  elif item.get('_type') == 'ip':
                      if item.get('alive', False):
                          hosts.add(item['ip'])

          with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
              f.write(f"live_hosts={chr(10).join(sorted(hosts))}\n")
              f.write(f"host_count={len(hosts)}\n")

          print(f"Discovered {len(hosts)} live hosts")

  host-recon:
    name: "Host Reconnaissance"
    needs: [network-discovery]
    steps:
      - task: nmap
        name: service-detect
        with:
          target: "{{ jobs['network-discovery'].outputs.live_hosts }}"
          version_detection: true

      - task: httpx
        name: http-probe
        with:
          target: "{{ jobs['network-discovery'].outputs.live_hosts }}"
          tech_detect: true
          status_code: true
          follow_redirects: true

      - name: export-urls
        run: |
          echo "live_urls={{ urls(steps[1].outputs.typed_outputs) | selectattr('status_code', 'gt', 0) | map(attribute='url') | unique | join('\n') }}" >> $OFX_OUTPUTS

  url-crawl:
    name: "URL Crawling"
    needs: [host-recon]
    steps:
      - task: katana
        name: crawl-urls
        with:
          target: "{{ jobs['host-recon'].outputs.live_urls | default(inputs.target, true) }}"
          depth: 2

  vuln-scan:
    name: "Vulnerability Scanning"
    needs: [url-crawl]
    steps:
      - task: nuclei
        name: nuclei-scan
        with:
          target: "{{ jobs['host-recon'].outputs.live_urls | default(inputs.target, true) }}"
          severity: "critical,high,medium"

      - name: final-summary
        script: |
          import json

          vulns = {{ vulns(steps[0].outputs.typed_outputs) | tojson }}
          critical = [v for v in vulns if v.get('severity') == 'critical']
          high = [v for v in vulns if v.get('severity') == 'high']

          print("=" * 50)
          print(f" NETWORK SCAN COMPLETE: {{ inputs.target }}")
          print("=" * 50)
          print(f"Live hosts: {{ jobs['network-discovery'].outputs.host_count }}")
          print(f"Total vulnerabilities: {len(vulns)}")
          print(f"  Critical: {len(critical)}")
          print(f"  High: {len(high)}")
