name: network-scan
description: |
  Internal network scan — discovers live hosts in a CIDR range, scans services, and performs web application testing on discovered hosts.
tags:
- recon
- cidr
- dns
- network
- internal
- http
- crawl
- ssl
- vuln
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: CIDR range (e.g. 192.168.1.0/24)
      alias: t
jobs:
  network-discovery:
    name: Network Discovery
    outputs:
      hosts_file: '{{ steps["collect-hosts"].outputs.hosts_file | default("", true) }}'
      host_count: '{{ steps["collect-hosts"].outputs.host_count | default("", true) }}'
    steps:
    - task: fping
      name: fping-discovery
      timeout: 5
      with:
        target: '{{ inputs.target }}'
        generate: true
      continue-on-error: true
    - task: nmap
      timeout: 30
      name: host-discovery
      with:
        target: '{{ inputs.target }}'
        timing: 4
      continue-on-error: true
    - task: naabu
      timeout: 10
      name: port-scan
      with:
        target: '{{ inputs.target }}'
        top_ports: '1000'
        rate: 2000
      continue-on-error: true
    - task: masscan
      timeout: 10
      name: masscan-scan
      with:
        target: '{{ inputs.target }}'
        top_ports: '100'
        rate: 2000
      continue-on-error: true
    - name: collect-hosts
      script: |
        import json

        hosts = set()
        for idx in ["1", "2", "3"]:
            step_data = {{ steps | tojson }}
            typed = step_data.get(idx, {}).get('outputs', {}).get('typed_outputs', [])
            for item in typed:
                if item.get('_type') == 'port':
                    host = item.get('host') or item.get('ip', '')
                    if host:
                        hosts.add(host)
                elif item.get('_type') == 'ip':
                    if item.get('alive', False):
                        hosts.add(item['ip'])

        with open('/tmp/ofx_netscan_hosts.txt', 'w') as f:
            f.write('\n'.join(sorted(hosts)))
        add_outputs(hosts_file="/tmp/ofx_netscan_hosts.txt", host_count=len(hosts))
        print(f"Discovered {len(hosts)} live hosts")
  host-recon:
    name: Host Reconnaissance
    needs:
    - network-discovery
    outputs:
      live_urls: '{{ steps["export-urls"].outputs.live_urls | default("", true) }}'
      open_ports: '{{ steps["service-detect"].outputs.open_ports | default("", true) }}'
    steps:
    - task: nerva
      timeout: 15
      name: nerva-fingerprint
      with:
        target: '{{ jobs["network-discovery"].outputs.hosts_file }}'
      continue-on-error: true
    - task: nmap
      timeout: 30
      name: service-detect
      with:
        target: '{{ jobs["network-discovery"].outputs.hosts_file }}'
        version_detection: true
      continue-on-error: true
    - task: httpx
      timeout: 10
      name: http-probe
      with:
        target: '{{ jobs["network-discovery"].outputs.hosts_file }}'
        tech_detect: true
        status_code: true
        follow_redirects: true
      continue-on-error: true
    - task: whatweb
      timeout: 10
      name: whatweb-fingerprint
      with:
        target: '{{ jobs["network-discovery"].outputs.hosts_file }}'
        aggression: 3
      continue-on-error: true
    - name: export-urls
      continue-on-error: true
      script: |
        typed = {{ steps["whatweb-fingerprint"].outputs.typed_outputs | default([], true) | tojson }}
        live = []
        for item in typed:
            if item.get('_type') == 'url' and item.get('status_code', 0) > 0:
                live.append(item['url'])
        add_outputs(live_urls='\n'.join(sorted(set(live))))
  default-cred-check:
    name: Default Credential Check
    needs:
    - network-discovery
    outputs:
      cred_count: '{{ steps["parse-brutus"].outputs.cred_count | default("", true) }}'
    steps:
    - name: run-pipeline
      run: |
        naabu -list {{ jobs['network-discovery'].outputs.hosts_file }} -p 22,21,445,3306,5432,6379,3389,5900,27017,1433 -silent 2>/dev/null | \
          nerva --json 2>/dev/null | \
          brutus --json 2>/dev/null | tee /tmp/ofx_netscan_brutus.jsonl
      timeout: 20
      continue-on-error: true
    - name: parse-brutus
      script: |
        import json
        creds = []
        try:
            with open('/tmp/ofx_netscan_brutus.jsonl') as f:
                for line in f:
                    line = line.strip()
                    if not line or not line.startswith('{'):
                        continue
                    try:
                        data = json.loads(line)
                        username = data.get('username', data.get('login', ''))
                        password = data.get('password', data.get('pass', ''))
                        host = data.get('host', data.get('ip', ''))
                        port = data.get('port', '')
                        service = data.get('service', '')
                        if username:
                            creds.append({'user': username, 'pass': password, 'host': f"{host}:{port}", 'service': service})
                    except json.JSONDecodeError:
                        continue
        except FileNotFoundError:
            pass

        add_outputs(cred_count=len(creds))
        if creds:
            print(f"[!] Default credentials found: {len(creds)}")
            for c in creds:
                print(f"  [+] {c['host']} ({c['service']}): {c['user']}:{c['pass']}")
        else:
            print("[*] No default credentials found")
      log-stdout: true
  url-crawl:
    name: URL Crawling
    needs:
    - host-recon
    steps:
    - task: katana
      timeout: 15
      name: crawl-urls
      with:
        target: "{{ jobs['host-recon'].outputs.live_urls | default(inputs.target, true) }}"
        depth: 2
      continue-on-error: true
  vuln-scan:
    name: Vulnerability Scanning
    needs:
    - url-crawl
    - default-cred-check
    steps:
    - task: nuclei
      timeout: 20
      name: nuclei-scan
      with:
        target: "{{ jobs['host-recon'].outputs.live_urls | default(inputs.target, true) }}"
        severity: critical,high,medium
      continue-on-error: true
    - task: whatweb
      timeout: 10
      name: whatweb-fingerprint
      with:
        target: "{{ jobs['host-recon'].outputs.live_urls | default(inputs.target, true) }}"
        aggression: 3
      continue-on-error: true
    - task: nikto
      timeout: 15
      name: nikto-scan
      with:
        target: "{{ jobs['host-recon'].outputs.live_urls | default(inputs.target, true) }}"
        maxtime: 900
      continue-on-error: true
    - name: final-summary
      script: |
        import json

        vulns = {{ vulns(steps["nuclei-scan"].outputs.typed_outputs) | tojson }}
        critical = [v for v in vulns if v.get('severity') == 'critical']
        high = [v for v in vulns if v.get('severity') == 'high']

        print("=" * 50)
        print(f" NETWORK SCAN COMPLETE: {{ inputs.target }}")
        print("=" * 50)
        print(f"Live hosts: {{ jobs['network-discovery'].outputs.host_count }}")
        print(f"Default creds: {{ jobs['default-cred-check'].outputs.cred_count | default('0', true) }}")
        print(f"Total vulnerabilities: {len(vulns)}")
        print(f"  Critical: {len(critical)}")
        print(f"  High: {len(high)}")
      log-stdout: true
    - name: export-to-project
      script: |-
        import shutil
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:

            # alive hosts
            d = '{{ vars.project_hosts }}'
            Path(d).mkdir(parents=True, exist_ok=True)
            src = '''{{ jobs['network-discovery'].outputs.hosts_file | default('', true) }}'''
            if src and Path(src).is_file():
                shutil.copy2(src, Path(d) / 'alive-hosts.txt')
                print('  [+] hosts/alive-hosts.txt')

            # open ports
            d = '{{ vars.project_hosts }}'
            Path(d).mkdir(parents=True, exist_ok=True)
            data = '''{{ jobs['host-recon'].outputs.open_ports | default('', true) }}'''.strip()
            if data:
                (Path(d) / 'open-ports.txt').write_text(data)
                print(f'  [+] hosts/open-ports.txt ({len(data.splitlines())} lines)')

            # Auto-export typed outputs
            all_typed = []
            for typed in [
                {{ jobs['network-discovery'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['host-recon'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['url-crawl'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['vuln-scan'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true
