name: service-enum
description: |
  Deep service enumeration — probe discovered services (SMB, FTP, SNMP,
  SMTP, DNS, NFS, RDP, MySQL, MSSQL) for detailed information,
  anonymous access, and misconfigurations.
tags: [scan, enumeration, services, network]
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target host IP or hostname
      alias: t

jobs:
  port-discovery:
    name: Port Discovery
    outputs:
      port_count: '{{ steps["identify-services"].outputs.port_count | default("", true) }}'
      detected_services: '{{ steps["identify-services"].outputs.detected_services | default("", true) }}'
      open_ports: '{{ steps["identify-services"].outputs.open_ports | default("", true) }}'
    steps:
    - task: naabu
      log-command: true
      timeout: 10
      name: port-scan
      with:
        target: '{{ inputs.target }}'
        top_ports: '1000'
        rate: 1000
      continue-on-error: true
    - task: nerva
      log-command: true
      timeout: 10
      name: fingerprint
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: identify-services
      script: |
        ports_data = {{ ports(steps["port-scan"].outputs.typed_outputs) | tojson }}
        nerva_data = {{ ports(steps["fingerprint"].outputs.typed_outputs) | tojson }}

        svc_map = {
            21: 'ftp', 22: 'ssh', 25: 'smtp', 53: 'dns', 80: 'http',
            110: 'pop3', 111: 'rpc', 135: 'rpc', 139: 'smb', 143: 'imap',
            161: 'snmp', 389: 'ldap', 443: 'https', 445: 'smb', 993: 'imaps',
            1433: 'mssql', 1521: 'oracle', 2049: 'nfs', 3306: 'mysql',
            3389: 'rdp', 5432: 'postgres', 5900: 'vnc', 6379: 'redis',
            8080: 'http', 8443: 'https', 27017: 'mongodb',
        }

        services = {}
        for p in ports_data:
            port = p.get('port', 0)
            services[port] = svc_map.get(port, '')

        # Enrich with nerva service detection
        detected = set()
        for p in nerva_data:
            port = p.get('port', 0)
            svc_name = p.get('service_name', '')
            if '/' in svc_name:
                svc_name = svc_name.split('/')[0]
            if svc_name:
                detected.add(svc_name)
                services[port] = svc_name

        for port, svc in services.items():
            if svc:
                detected.add(svc)
            elif port in svc_map:
                detected.add(svc_map[port])

        add_outputs(port_count=len(services), detected_services=','.join(sorted(detected)), open_ports=','.join(str(p) for p in sorted(services.keys())))
        print(f"[+] Open ports: {len(services)}")
        print(f"[+] Services: {', '.join(sorted(detected))}")

  deep-enum:
    name: Deep Service Enumeration
    needs: [port-discovery]
    outputs:
      enum_file: '{{ steps["enum-services"].outputs.enum_file | default("", true) }}'
      service_count: '{{ steps["enum-services"].outputs.service_count | default("", true) }}'
    steps:
    - name: enum-services
      script: |
        import subprocess

        target = '{{ inputs.target }}'
        services = '{{ jobs["port-discovery"].outputs.detected_services }}'.split(',')
        ports = '{{ jobs["port-discovery"].outputs.open_ports }}'

        results = {}

        for svc in services:
            if not svc:
                continue
            print(f"\n=== {svc.upper()} ===")

            if svc == 'smb':
                cmds = [
                    ('nmap-smb', f'nmap -p 139,445 --script smb-enum-shares,smb-enum-users,smb-os-discovery -Pn {target}'),
                    ('smbclient', f'smbclient -L //{target}/ -N 2>/dev/null'),
                ]
            elif svc == 'ftp':
                cmds = [
                    ('nmap-ftp', f'nmap -p 21 --script ftp-anon,ftp-syst,ftp-vsftpd-backdoor -Pn {target}'),
                ]
            elif svc == 'snmp':
                cmds = [
                    ('nmap-snmp', f'nmap -p 161 --script snmp-info,snmp-interfaces,snmp-netstat,snmp-processes -sU -Pn {target}'),
                ]
            elif svc == 'smtp':
                cmds = [
                    ('nmap-smtp', f'nmap -p 25 --script smtp-commands,smtp-enum-users,smtp-open-relay -Pn {target}'),
                ]
            elif svc == 'dns':
                cmds = [
                    ('nmap-dns', f'nmap -p 53 --script dns-zone-transfer,dns-recursion -Pn {target}'),
                ]
            elif svc == 'nfs':
                cmds = [
                    ('nmap-nfs', f'nmap -p 2049 --script nfs-ls,nfs-showmount,nfs-statfs -Pn {target}'),
                    ('showmount', f'showmount -e {target} 2>/dev/null'),
                ]
            elif svc == 'mysql':
                cmds = [
                    ('nmap-mysql', f'nmap -p 3306 --script mysql-info,mysql-enum,mysql-empty-password -Pn {target}'),
                ]
            elif svc == 'mssql':
                cmds = [
                    ('nmap-mssql', f'nmap -p 1433 --script ms-sql-info,ms-sql-ntlm-info,ms-sql-empty-password -Pn {target}'),
                ]
            elif svc == 'redis':
                cmds = [
                    ('nmap-redis', f'nmap -p 6379 --script redis-info -Pn {target}'),
                ]
            elif svc == 'ldap':
                cmds = [
                    ('nmap-ldap', f'nmap -p 389 --script ldap-rootdse,ldap-search -Pn {target}'),
                ]
            else:
                cmds = []

            for name, cmd in cmds:
                try:
                    proc = subprocess.run(cmd, shell=True, capture_output=True, text=True, timeout=60)
                    output = proc.stdout.strip()
                    results[f'{svc}_{name}'] = output
                    if output:
                        for line in output.splitlines()[:20]:
                            print(f"  {line}")
                except Exception as e:
                    print(f"  Error: {e}")

        from pathlib import Path
        out_file = f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_service_enum.txt'
        with open(out_file, 'w') as f:
            for name, output in results.items():
                f.write(f"=== {name.upper()} ===\n{output}\n\n")

        add_outputs(enum_file=out_file, service_count=len(services))
        print(f"\n[+] Full results: {out_file}")
      log-stdout: true
      log-command: true
      timeout: 10

    - name: export-to-project
      script: |
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:
            all_typed = []
            for typed in [
            {{ jobs['port-discovery'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true

  default-cred-check:
    name: Default Credential Check
    needs: [port-discovery]
    outputs:
      cred_count: '{{ steps["parse-results"].outputs.cred_count | default("", true) }}'
    steps:
    - name: nerva-brutus
      log-command: true
      run: |
        naabu -host {{ inputs.target }} -p {{ jobs['port-discovery'].outputs.open_ports | default('22,21,3306,5432,6379', true) }} -silent 2>/dev/null | \
          nerva --json 2>/dev/null | \
          brutus --json 2>/dev/null | tee ${OFX_RUN_DIR:-/tmp}/ofx_svc_brutus.jsonl
      timeout: 15
      continue-on-error: true
    - name: parse-results
      script: |
        import json
        creds = []
        try:
            with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_svc_brutus.jsonl') as f:
                for line in f:
                    line = line.strip()
                    if not line or not line.startswith('{'):
                        continue
                    try:
                        data = json.loads(line)
                        username = data.get('username', data.get('login', ''))
                        password = data.get('password', data.get('pass', ''))
                        service = data.get('service', '')
                        host = data.get('host', data.get('ip', ''))
                        port = data.get('port', '')
                        if username:
                            creds.append({'user': username, 'pass': password, 'service': service, 'target': f"{host}:{port}"})
                    except json.JSONDecodeError:
                        continue
        except FileNotFoundError:
            pass

        add_outputs(cred_count=len(creds))
        if creds:
            print(f"[!] Default credentials found: {len(creds)}")
            for c in creds:
                print(f"  [+] {c['target']} ({c['service']}): {c['user']}:{c['pass']}")
        else:
            print("[*] No default credentials found")
      log-stdout: true