name: domain-scan
description: |
  Comprehensive domain security assessment — combines domain reconnaissance, subdomain discovery, host scanning, URL crawling, and vulnerability scanning.
tags:
- recon
- dns
- ssl
- network
- http
- crawl
- takeovers
- vuln
- secrets
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target domain (e.g. example.com)
jobs:
  domain-recon:
    name: Domain Reconnaissance
    steps:
    - task: whois
      name: whois-lookup
      with:
        target: '{{ inputs.target }}'
      log-stdout: true
      continue-on-error: true
    - task: dnsx
      name: dns-resolve
      with:
        target: '{{ inputs.target }}'
        a: true
        aaaa: true
        cname: true
        mx: true
        ns: true
      log-stdout: true
      continue-on-error: true
    - task: httpx
      name: domain-probe
      with:
        target: '{{ inputs.target }}'
        tech_detect: true
        status_code: true
        follow_redirects: true
      log-stdout: true
      continue-on-error: true
    - task: testssl
      name: tls-check
      with:
        target: '{{ inputs.target }}'
        server_defaults: true
      log-stdout: true
      continue-on-error: true
    - task: sslscan
      name: sslscan-check
      with:
        target: '{{ inputs.target }}'
        show_certificate: true
      log-stdout: true
      continue-on-error: true
    - task: wafw00f
      name: waf-detect
      with:
        target: '{{ inputs.target }}'
      log-stdout: true
      continue-on-error: true
  subdomain-recon:
    name: Subdomain Discovery
    steps:
    - task: subfinder
      name: subfinder-enum
      with:
        target: '{{ inputs.target }}'
        all: true
      log-stdout: true
      continue-on-error: true
    - task: gau
      name: gau-passive
      with:
        target: '{{ inputs.target }}'
        subs: true
      continue-on-error: true
    - task: amass
      name: amass-enum
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
      log-stdout: true
    - task: assetfinder
      name: assetfinder-enum
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: collect-subdomains
      script: |
        import json

        subs = set()
        for idx in [0, 1, 2, 3]:
            step_data = {{ steps | tojson }}
            typed = step_data[idx].get('outputs', {}).get('typed_outputs', [])
            for item in typed:
                if item.get('_type') == 'subdomain':
                    subs.add(item['host'])
                elif item.get('_type') == 'url':
                    host = item.get('host', '')
                    if host and '{{ inputs.target }}' in host:
                        subs.add(host)

        subs.add('{{ inputs.target }}')
        with open('/tmp/ofx_domscan_hosts.txt', 'w') as f:
            f.write('\n'.join(sorted(subs)))
        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"hosts_file=/tmp/ofx_domscan_hosts.txt\n")
            f.write(f"subdomain_count={len(subs)}\n")
    - task: dnsx
      name: verify-subdomains
      with:
        target: '{{ steps[4].outputs.hosts_file if steps[4].outputs is defined else inputs.target }}'
        a: true
        resp: true
      log-stdout: true
      continue-on-error: true
    - task: dnsrecon
      name: dnsrecon-scan
      with:
        target: '{{ inputs.target }}'
        type: std,srv
      continue-on-error: true
      log-stdout: true
    - task: httpx
      name: probe-subdomains
      with:
        target: '{{ steps[4].outputs.hosts_file if steps[4].outputs is defined else inputs.target }}'
        tech_detect: true
        status_code: true
        follow_redirects: true
      log-stdout: true
      continue-on-error: true
    - name: export-urls
      run: |
        echo "live_urls={{ urls(steps[7].outputs.typed_outputs) | selectattr('status_code', 'gt', 0) | map(attribute='url') | unique | join('\n') }}" >> $OFX_OUTPUTS
      log-stdout: true
  host-recon:
    name: Host Reconnaissance
    needs:
    - subdomain-recon
    steps:
    - task: naabu
      name: port-scan
      with:
        target: '{{ jobs[''subdomain-recon''].outputs.hosts_file }}'
        top_ports: '1000'
        rate: 1000
      log-stdout: true
      continue-on-error: true
    - task: nmap
      name: service-detect
      with:
        target: '{{ jobs[''subdomain-recon''].outputs.hosts_file }}'
        version_detection: true
      log-stdout: true
      continue-on-error: true
    - task: searchsploit
      name: exploit-search
      with:
        target: '{{ inputs.target }}'
      log-stdout: true
      continue-on-error: true
  url-crawl:
    name: URL Crawling
    needs:
    - subdomain-recon
    steps:
    - task: katana
      name: crawl-urls
      with:
        target: '{{ jobs[''subdomain-recon''].outputs.live_urls | default(inputs.target, true) }}'
        depth: 3
      log-stdout: true
      continue-on-error: true
    - task: gospider
      name: spider-urls
      with:
        target: '{{ jobs[''subdomain-recon''].outputs.live_urls | default(inputs.target, true) }}'
        depth: 2
      log-stdout: true
      continue-on-error: true
  vuln-scan:
    name: Vulnerability Scanning
    needs:
    - host-recon
    - url-crawl
    steps:
    - task: nuclei
      name: nuclei-scan
      with:
        target: '{{ jobs[''subdomain-recon''].outputs.live_urls | default(inputs.target, true) }}'
        severity: critical,high,medium
      log-stdout: true
      continue-on-error: true
    - task: dalfox
      name: xss-scan
      with:
        target: '{{ jobs[''subdomain-recon''].outputs.live_urls | default(inputs.target, true) }}'
      log-stdout: true
      continue-on-error: true
    - task: nuclei
      name: takeover-check
      with:
        target: '{{ jobs[''subdomain-recon''].outputs.hosts_file }}'
        tags: takeover
      log-stdout: true
      continue-on-error: true
    - task: nikto
      name: nikto-scan
      with:
        target: '{{ jobs[''subdomain-recon''].outputs.live_urls | default(inputs.target, true) }}'
      continue-on-error: true
      log-stdout: true
    - task: whatweb
      name: whatweb-fingerprint
      with:
        target: '{{ jobs[''subdomain-recon''].outputs.live_urls | default(inputs.target, true) }}'
        aggression: 3
      continue-on-error: true
      log-stdout: true
    - name: final-summary
      script: |
        import json

        all_vulns = {{ vulns(steps[0].outputs.typed_outputs) | tojson }} + \
                    {{ vulns(steps[1].outputs.typed_outputs) | tojson }} + \
                    {{ vulns(steps[2].outputs.typed_outputs) | tojson }}

        critical = [v for v in all_vulns if v.get('severity') == 'critical']
        high = [v for v in all_vulns if v.get('severity') == 'high']

        print("=" * 50)
        print(f" DOMAIN SCAN COMPLETE: {{ inputs.target }}")
        print("=" * 50)
        print(f"Subdomains: {{ jobs['subdomain-recon'].outputs.subdomain_count }}")
        print(f"Total vulnerabilities: {len(all_vulns)}")
        print(f"  Critical: {len(critical)}")
        print(f"  High: {len(high)}")
      log-stdout: true
    - name: export-to-project
      script: |-
        import shutil
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:

            # subdomains
            d = '{{ vars.project_subdomains }}'
            Path(d).mkdir(parents=True, exist_ok=True)
            src = '''{{ jobs['subdomain-recon'].outputs.hosts_file | default('', true) }}'''
            if src and Path(src).is_file():
                shutil.copy2(src, Path(d) / 'subdomains.txt')
                print('  [+] subdomains/subdomains.txt')

            # ports
            d = '{{ vars.project_hosts }}'
            Path(d).mkdir(parents=True, exist_ok=True)
            data = '''{{ jobs['host-recon'].outputs.open_ports | default('', true) }}'''.strip()
            if data:
                (Path(d) / 'ports.txt').write_text(data)
                print(f'  [+] hosts/ports.txt ({len(data.splitlines())} lines)')

            # Auto-export typed outputs
            all_typed = []
            for typed in [
                {{ jobs['domain-recon'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['subdomain-recon'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['host-recon'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['url-crawl'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['vuln-scan'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true
