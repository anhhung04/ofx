name: domain-scan
description: |
  Comprehensive domain security assessment — DNS record enumeration, subdomain
  discovery (passive + cert-based), service discovery, web fingerprinting,
  SSL/TLS audit, and vulnerability scanning.
tags:
  - recon
  - dns
  - ssl
  - network
  - http
  - crawl
  - takeovers
  - vuln
  - secrets
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target domain (e.g. example.com)
      alias: t
defaults:
  store-creds: true
jobs:
  # ── Phase 1a: Full DNS Record Enumeration ─────────────────────────
  dns-enum:
    name: DNS Enumeration
    steps:
      - task: dnsx
        log-command: true
        name: dns-records
        with:
          target: "{{ inputs.target }}"
          a: true
          aaaa: true
          cname: true
          mx: true
          ns: true
          txt: true
          soa: true
          resp: true
        continue-on-error: true
      - task: dnsrecon
        log-command: true
        name: dnsrecon-scan
        with:
          target: "{{ inputs.target }}"
          type: std,srv,axfr
        continue-on-error: true
      - name: report-dns
        script: |
          records = {{ steps["dns-records"].outputs.typed_outputs | default([], true) | tojson }}
          by_type = {}
          for r in records:
              t = r.get('record_type', r.get('type', 'A'))
              by_type.setdefault(t, []).append(r.get('value', r.get('ip', r.get('host', ''))))
          for t, vals in sorted(by_type.items()):
              for v in vals:
                  if v:
                      print(f"  {t:6} {v}")

  # ── Phase 1b: Subdomain Discovery (parallel) ─────────────────────
  subdomain-discovery:
    name: Subdomain Discovery
    outputs:
      subs_file: '{{ steps["merge-subs"].outputs.subs_file | default("", true) }}'
      sub_count: '{{ steps["merge-subs"].outputs.sub_count | default("0", true) }}'
    steps:
      - task: subfinder
        log-command: true
        name: subfinder-enum
        with:
          target: "{{ inputs.target }}"
          all: true
        continue-on-error: true
      - task: amass
        log-command: true
        name: amass-passive
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      - task: assetfinder
        log-command: true
        name: assetfinder-enum
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      # CT log enumeration
      - task: tlsx
        log-command: true
        name: tls-san-enum
        with:
          target: "{{ inputs.target }}"
          san: true
          port: "443,8443"
        continue-on-error: true
      - task: subfinder
        log-command: true
        name: crtsh-enum
        with:
          target: "{{ inputs.target }}"
          sources: "crtsh,certspotter"
        continue-on-error: true
      - name: merge-subs
        script: |
          from pathlib import Path

          base = '{{ inputs.target }}'
          subs = {base}

          for item in {{ subdomains(steps["subfinder-enum"].outputs.typed_outputs) | default([], true) | tojson }}:
              if base in item.get('host', ''):
                  subs.add(item['host'])
          for item in {{ subdomains(steps["amass-passive"].outputs.typed_outputs) | default([], true) | tojson }}:
              if base in item.get('host', ''):
                  subs.add(item['host'])
          for item in {{ subdomains(steps["assetfinder-enum"].outputs.typed_outputs) | default([], true) | tojson }}:
              if base in item.get('host', ''):
                  subs.add(item['host'])
          for item in {{ subdomains(steps["tls-san-enum"].outputs.typed_outputs) | default([], true) | tojson }}:
              if base in item.get('host', ''):
                  subs.add(item['host'])
          for item in {{ subdomains(steps["crtsh-enum"].outputs.typed_outputs) | default([], true) | tojson }}:
              if base in item.get('host', ''):
                  subs.add(item['host'])

          subs_path = f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_domscan_subs.txt'
          Path(subs_path).write_text('\n'.join(sorted(subs)))
          add_outputs(subs_file=subs_path, sub_count=len(subs))
          print(f"Discovered: {len(subs)} unique subdomains")

  # ── Phase 2: DNS Verification ─────────────────────────────────────
  dns-verify:
    name: DNS Verification
    needs: [dns-enum, subdomain-discovery]
    outputs:
      verified_file: '{{ steps["export-verified"].outputs.verified_file | default("", true) }}'
      verified_count: '{{ steps["export-verified"].outputs.verified_count | default("", true) }}'
    steps:
      - task: dnsx
        log-command: true
        name: verify-subs
        with:
          target: "{{ jobs['subdomain-discovery'].outputs.subs_file }}"
          a: true
          cname: true
          resp: true
          wildcard: true
          wildcard_domain: "{{ inputs.target }}"
        continue-on-error: true
      - name: export-verified
        script: |
          from pathlib import Path

          verified = set()
          for item in {{ subdomains(steps["verify-subs"].outputs.typed_outputs) | default([], true) | tojson }}:
              if item.get('host'):
                  verified.add(item['host'])

          verified_path = f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_domscan_verified.txt'
          Path(verified_path).write_text('\n'.join(sorted(verified)))
          add_outputs(verified_file=verified_path, verified_count=len(verified))
          print(f"Verified: {len(verified)} live hosts")

  # ── Phase 3a: Port & Service Discovery (parallel) ─────────────────
  port-scan:
    name: Port & Service Scanning
    needs: [dns-verify]
    outputs:
      open_ports_json: '{{ steps["collect-ports"].outputs.open_ports_json | default("[]", true) }}'
      port_count: '{{ steps["collect-ports"].outputs.port_count | default("0", true) }}'
    steps:
      - task: naabu
        log-command: true
        name: naabu-scan
        with:
          target: "{{ jobs['dns-verify'].outputs.verified_file }}"
          top_ports: "1000"
          rate: 1000
        continue-on-error: true
      - task: masscan
        log-command: true
        name: masscan-sweep
        with:
          target: "{{ jobs['dns-verify'].outputs.verified_file }}"
          top_ports: 100
          rate: 1000
        continue-on-error: true
      - task: nmap
        log-command: true
        name: service-detect
        with:
          target: "{{ jobs['dns-verify'].outputs.verified_file }}"
          version_detection: true
        continue-on-error: true
      - name: collect-ports
        script: |
          import json

          port_set = set()
          for item in {{ ports(steps["naabu-scan"].outputs.typed_outputs) | default([], true) | tojson }}:
              h = item.get('host') or item.get('ip', '')
              p = item.get('port', '')
              if h and p:
                  port_set.add(f"{h}:{p}")
          for item in {{ ports(steps["masscan-sweep"].outputs.typed_outputs) | default([], true) | tojson }}:
              h = item.get('host') or item.get('ip', '')
              p = item.get('port', '')
              if h and p:
                  port_set.add(f"{h}:{p}")
          for item in {{ ports(steps["service-detect"].outputs.typed_outputs) | default([], true) | tojson }}:
              h = item.get('host') or item.get('ip', '')
              p = item.get('port', '')
              svc = item.get('service', '')
              ver = item.get('version', '')
              if h and p:
                  port_set.add(f"{h}:{p}")
                  if svc:
                      print(f"  {h}:{p} ({svc} {ver})".strip())

          add_outputs(open_ports_json=json.dumps(sorted(port_set)), port_count=len(port_set))
          print(f"Open ports: {len(port_set)}")

  # ── Phase 3b: HTTP Probing + SSL Audit (parallel) ─────────────────
  http-probe:
    name: HTTP Probing & SSL Audit
    needs: [dns-verify]
    outputs:
      live_urls_file: '{{ steps["export-live"].outputs.live_urls_file | default("", true) }}'
      live_count: '{{ steps["export-live"].outputs.live_count | default("0", true) }}'
    steps:
      - task: httpx
        log-command: true
        name: probe-hosts
        with:
          target: "{{ jobs['dns-verify'].outputs.verified_file }}"
          tech_detect: true
          status_code: true
          title: true
          follow_redirects: true
          ports: "80,443,8080,8443"
        continue-on-error: true
      - task: testssl
        log-command: true
        name: ssl-audit
        with:
          target: "{{ inputs.target }}:443"
        continue-on-error: true
      - task: wafw00f
        log-command: true
        name: waf-detect
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      - task: whatweb
        log-command: true
        name: tech-fingerprint
        with:
          target: "{{ inputs.target }}"
          aggression: 3
        continue-on-error: true
      - name: export-live
        script: |
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          live_urls = [
              item.get('url', '') for item in
              {{ urls(steps["probe-hosts"].outputs.typed_outputs) | default([], true) | tojson }}
              if item.get('status_code', 0) > 0 and item.get('url', '')
          ]
          seen = {}
          for url in live_urls:
              host = urlparse(url).hostname or url
              if host not in seen:
                  seen[host] = url
          live = sorted(seen.values())

          live_path = f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_domscan_live.txt'
          Path(live_path).write_text('\n'.join(live))
          add_outputs(live_urls_file=live_path, live_count=len(live))
          print(f"Live HTTP: {len(live)} services")
          for u in live:
              print(f"  {u}")

  # ── Phase 4: Vulnerability Scanning ──────────────────────────────
  vuln-scan:
    name: Vulnerability Scanning
    needs: [port-scan, http-probe]
    steps:
      - task: nuclei
        log-command: true
        name: nuclei-scan
        with:
          target: "{{ jobs['http-probe'].outputs.live_urls_file }}"
          severity: critical,high,medium
        continue-on-error: true
      - task: nuclei
        log-command: true
        name: takeover-check
        with:
          target: "{{ jobs['dns-verify'].outputs.verified_file }}"
          tags: "subdomain-takeover,dns"
        continue-on-error: true
      - name: vuln-summary
        script: |
          all_vulns = (
              {{ vulns(steps["nuclei-scan"].outputs.typed_outputs) | default([], true) | tojson }} +
              {{ vulns(steps["takeover-check"].outputs.typed_outputs) | default([], true) | tojson }}
          )
          by_sev = {}
          for v in all_vulns:
              s = v.get('severity', 'unknown')
              by_sev.setdefault(s, []).append(v)
          print(f"Vulnerabilities: {len(all_vulns)}")
          for sev in ['critical', 'high', 'medium', 'low']:
              cnt = len(by_sev.get(sev, []))
              if cnt:
                  print(f"  {sev.upper()}: {cnt}")
                  for v in by_sev[sev][:5]:
                      print(f"    [{v.get('host','')}] {v.get('name','')}")
        log-stdout: true

  # ── Phase 5: Summary ─────────────────────────────────────────────
  summary:
    name: Domain Scan Summary
    needs: [vuln-scan]
    steps:
      - name: report
        run: |
          echo "=================================================="
          echo " DOMAIN SCAN COMPLETE: {{ inputs.target }}"
          echo "=================================================="
          echo ""
          echo "--- Discovery ---"
          echo "Subdomains found:    {{ jobs['subdomain-discovery'].outputs.sub_count }}"
          echo "DNS-verified hosts:  {{ jobs['dns-verify'].outputs.verified_count }}"
          echo "Open ports:          {{ jobs['port-scan'].outputs.port_count | default(0) }}"
          echo "Live HTTP services:  {{ jobs['http-probe'].outputs.live_count }}"
        log-stdout: true
      - name: export-to-project
        script: |
          import shutil
          from pathlib import Path

          project = '{{ vars.project_path | default("", true) }}'
          if not project:
              print('No --project set, skipping file export')
          else:
              d = Path('{{ vars.project_subdomains }}')
              d.mkdir(parents=True, exist_ok=True)
              for label, src_str in [
                  ('subdomains.txt', '{{ jobs["subdomain-discovery"].outputs.subs_file | default("", true) }}'),
                  ('verified.txt',   '{{ jobs["dns-verify"].outputs.verified_file | default("", true) }}'),
              ]:
                  if src_str and Path(src_str).is_file():
                      shutil.copy2(src_str, d / label)
                      print(f'  [+] subdomains/{label}')

              all_typed = []
              for typed in [
                  {{ jobs['subdomain-discovery'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['dns-verify'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['port-scan'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['http-probe'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['vuln-scan'].outputs.typed_outputs | default([], true) | tojson }},
              ]:
                  all_typed.extend(typed)
              for s in export_typed_outputs(project, all_typed):
                  print(s)
              print(f'Project export complete: {project}')
        continue-on-error: true
