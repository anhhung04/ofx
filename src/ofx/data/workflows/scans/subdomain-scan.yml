name: subdomain-scan
description: |
  Complete subdomain assessment — discovers subdomains, performs host recon, crawls web applications, and scans for vulnerabilities.
tags:
- recon
- dns
- network
- http
- crawl
- ssl
- takeovers
- vuln
- secrets
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target domain (e.g. example.com)
      alias: t
jobs:
  subdomain-recon:
    name: Subdomain Enumeration
    outputs:
      hosts_file: '{{ steps.collect-subdomains.outputs.hosts_file }}'
      subdomain_count: '{{ steps.collect-subdomains.outputs.subdomain_count }}'
      live_urls: '{{ steps.export-data.outputs.live_urls }}'
    steps:
    - task: subfinder
      timeout: 10
      name: subfinder-enum
      with:
        target: '{{ inputs.target }}'
        all: true
      continue-on-error: true
    - task: gau
      name: gau-passive
      with:
        target: '{{ inputs.target }}'
        subs: true
      continue-on-error: true
    - task: amass
      timeout: 20
      name: amass-enum
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - task: assetfinder
      name: assetfinder-enum
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: collect-subdomains
      script: |
        import json

        subs = set()
        for idx in [0, 1, 2, 3]:
            step_data = {{ steps | tojson }}
            typed = step_data[idx].get('outputs', {}).get('typed_outputs', [])
            for item in typed:
                if item.get('_type') == 'subdomain':
                    subs.add(item['host'])
                elif item.get('_type') == 'url':
                    host = item.get('host', '')
                    if host and '{{ inputs.target }}' in host:
                        subs.add(host)

        subs.add('{{ inputs.target }}')
        with open('/tmp/ofx_subscan_hosts.txt', 'w') as f:
            f.write('\n'.join(sorted(subs)))
        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"hosts_file=/tmp/ofx_subscan_hosts.txt\n")
            f.write(f"subdomain_count={len(subs)}\n")
    - task: dnsx
      name: verify-dns
      with:
        target: '{{ steps["collect-subdomains"].outputs.hosts_file if steps["collect-subdomains"].outputs is defined else inputs.target }}'
        a: true
        resp: true
      continue-on-error: true
    - task: httpx
      name: probe-subdomains
      with:
        target: '{{ steps["collect-subdomains"].outputs.hosts_file if steps["collect-subdomains"].outputs is defined else inputs.target }}'
        tech_detect: true
        status_code: true
        follow_redirects: true
      continue-on-error: true
    - task: whatweb
      name: whatweb-fingerprint
      with:
        target: '{{ steps["collect-subdomains"].outputs.hosts_file if steps["collect-subdomains"].outputs is defined else inputs.target }}'
        aggression: 3
      continue-on-error: true
    - name: export-data
      run: |
        echo "live_urls={{ urls(steps["probe-subdomains"].outputs.typed_outputs) | selectattr('status_code', 'gt', 0) | map(attribute='url') | unique | join('\n') }}" >> $OFX_OUTPUTS
  host-recon:
    name: Host Reconnaissance
    needs:
    - subdomain-recon
    outputs:
      alive_subs: '{{ steps.port-scan.outputs.alive_subs }}'
    steps:
    - task: naabu
      timeout: 10
      name: port-scan
      with:
        target: '{{ jobs[''subdomain-recon''].outputs.hosts_file }}'
        top_ports: '1000'
        rate: 1000
      continue-on-error: true
    - task: nmap
      timeout: 30
      name: service-detect
      with:
        target: '{{ jobs[''subdomain-recon''].outputs.hosts_file }}'
        version_detection: true
      continue-on-error: true
  url-crawl:
    name: URL Crawling
    needs:
    - subdomain-recon
    steps:
    - task: katana
      timeout: 15
      name: crawl
      with:
        target: '{{ jobs[''subdomain-recon''].outputs.live_urls | default(inputs.target, true) }}'
        depth: 3
      continue-on-error: true
    - task: gospider
      timeout: 15
      name: spider
      with:
        target: '{{ jobs[''subdomain-recon''].outputs.live_urls | default(inputs.target, true) }}'
        depth: 2
      continue-on-error: true
  vuln-scan:
    name: Vulnerability Scanning
    needs:
    - host-recon
    - url-crawl
    steps:
    - task: nuclei
      timeout: 20
      name: nuclei-scan
      with:
        target: '{{ jobs[''subdomain-recon''].outputs.live_urls | default(inputs.target, true) }}'
        severity: critical,high,medium
      continue-on-error: true
    - task: dalfox
      timeout: 15
      name: xss-scan
      with:
        target: '{{ jobs[''subdomain-recon''].outputs.live_urls | default(inputs.target, true) }}'
      continue-on-error: true
    - task: nuclei
      timeout: 20
      name: takeover-check
      with:
        target: '{{ jobs[''subdomain-recon''].outputs.hosts_file }}'
        tags: takeover
      continue-on-error: true
    - name: final-summary
      script: |
        import json

        all_vulns = {{ vulns(steps["nuclei-scan"].outputs.typed_outputs) | tojson }} + \
                    {{ vulns(steps["xss-scan"].outputs.typed_outputs) | tojson }} + \
                    {{ vulns(steps["takeover-check"].outputs.typed_outputs) | tojson }}

        critical = [v for v in all_vulns if v.get('severity') == 'critical']
        high = [v for v in all_vulns if v.get('severity') == 'high']

        print("=" * 50)
        print(f" SUBDOMAIN SCAN COMPLETE: {{ inputs.target }}")
        print("=" * 50)
        print(f"Subdomains: {{ jobs['subdomain-recon'].outputs.subdomain_count }}")
        print(f"Total vulnerabilities: {len(all_vulns)}")
        print(f"  Critical: {len(critical)}")
        print(f"  High: {len(high)}")
      log-stdout: true
    - name: export-to-project
      script: |-
        import shutil
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:

            # subdomains
            d = '{{ vars.project_subdomains }}'
            Path(d).mkdir(parents=True, exist_ok=True)
            src = '''{{ jobs['subdomain-recon'].outputs.hosts_file | default('', true) }}'''
            if src and Path(src).is_file():
                shutil.copy2(src, Path(d) / 'subdomains.txt')
                print('  [+] subdomains/subdomains.txt')

            # alive subs
            d = '{{ vars.project_hosts }}'
            Path(d).mkdir(parents=True, exist_ok=True)
            data = '''{{ jobs['host-recon'].outputs.alive_subs | default('', true) }}'''.strip()
            if data:
                (Path(d) / 'alive-subs.txt').write_text(data)
                print(f'  [+] hosts/alive-subs.txt ({len(data.splitlines())} lines)')

            # Auto-export typed outputs
            all_typed = []
            for typed in [
                {{ jobs['subdomain-recon'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['host-recon'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['url-crawl'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['vuln-scan'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true
