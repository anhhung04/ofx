name: bug-bounty-recon
description: 'Bug bounty reconnaissance pipeline — comprehensive target enumeration combining subdomain discovery, port scanning, URL crawling, parameter mining, takeover checking, and vulnerability scanning optimized for bug bounty programs.

  '
tags:
- scan
- bugbounty
- recon
- web
- vuln
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target domain (e.g. example.com)
      alias: t
jobs:
  subdomain-enum:
    name: Subdomain Enumeration
    outputs:
      subs_file: '{{ steps["merge-subdomains"].outputs.subs_file | default("", true) }}'
      sub_count: '{{ steps["merge-subdomains"].outputs.sub_count | default("", true) }}'
    steps:
    - task: subfinder
      timeout: 10
      name: subfinder-scan
      with:
        target: '{{ inputs.target }}'
        all: true
      continue-on-error: true
    - task: amass
      timeout: 10
      name: amass-passive
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - task: assetfinder
      timeout: 10
      name: assetfinder-enum
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - task: findomain
      timeout: 10
      name: findomain-enum
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: merge-subdomains
      script: |
        subs = set()
        subs.add('{{ inputs.target }}')

        # From subfinder
        sf_outputs = {{ steps["subfinder-scan"].outputs.typed_outputs | tojson }}
        for item in sf_outputs:
            if item.get('_type') == 'subdomain':
                subs.add(item['host'])

        # From amass
        for item in {{ subdomains(steps["amass-passive"].outputs.typed_outputs) | default([], true) | tojson }}:
            host = item.get('host', '')
            if host and '{{ inputs.target }}' in host:
                subs.add(host)

        # From assetfinder
        for item in {{ subdomains(steps["assetfinder-enum"].outputs.typed_outputs) | default([], true) | tojson }}:
            host = item.get('host', '')
            if host and '{{ inputs.target }}' in host:
                subs.add(host)

        # From findomain
        for item in {{ subdomains(steps["findomain-enum"].outputs.typed_outputs) | default([], true) | tojson }}:
            host = item.get('host', '')
            if host and '{{ inputs.target }}' in host:
                subs.add(host)

        with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_bb_subs.txt', 'w') as f:
            f.write('\n'.join(sorted(subs)))

        add_outputs(subs_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_bb_subs.txt", sub_count=len(subs))
        print(f"Collected {len(subs)} unique subdomains")
  dns-verify:
    name: DNS Verification
    needs:
    - subdomain-enum
    outputs:
      alive_file: '{{ steps["filter-alive"].outputs.alive_file | default("", true) }}'
      alive_count: '{{ steps["filter-alive"].outputs.alive_count | default("", true) }}'
    steps:
    - task: dnsx
      timeout: "{{ (jobs['subdomain-enum'].outputs.sub_count | default(50, true) | int / 50 * 15 + 30) | int }}"
      name: verify-dns
      with:
        target: "{{ jobs['subdomain-enum'].outputs.subs_file }}"
        a: true
        cname: true
        resp: true
      continue-on-error: true
    - name: filter-alive
      script: |
        alive = set()
        dnsx_out = {{ steps["verify-dns"].outputs.typed_outputs | tojson }}
        for item in dnsx_out:
            host = item.get('host', '')
            if host:
                alive.add(host)

        with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_bb_alive.txt', 'w') as f:
            f.write('\n'.join(sorted(alive)))

        add_outputs(alive_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_bb_alive.txt", alive_count=len(alive))
        print(f"Verified {len(alive)} alive subdomains")
  takeover-check:
    name: Subdomain Takeover Check
    needs:
    - dns-verify
    outputs:
      takeover_count: '{{ steps["collect-takeovers"].outputs.takeover_count | default("", true) }}'
      takeover_findings_file: '{{ steps["collect-takeovers"].outputs.takeover_findings_file | default("", true) }}'
    steps:
    - task: subzy
      timeout: "{{ (jobs['subdomain-enum'].outputs.sub_count | default(50, true) | int / 50 * 15 + 30) | int }}"
      name: subzy-scan
      with:
        target: "{{ jobs['dns-verify'].outputs.alive_file }}"
      continue-on-error: true
    - name: collect-takeovers
      script: |
        subzy_out = {{ steps["subzy-scan"].outputs.typed_outputs | default([], true) | tojson }}

        vulnerable = []
        for item in subzy_out:
            t = item.get('_type', '')
            if t == 'vulnerability':
                host = item.get('host', item.get('matched_at', ''))
                name = item.get('name', 'takeover')
                vulnerable.append(f"[subzy] {name}: {host}")
            elif t == 'subdomain' and item.get('vulnerable'):
                vulnerable.append(f"[subzy] {item.get('host', 'unknown')}")

        add_outputs(takeover_count=len(vulnerable))
        with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_bb_takeover.txt', 'w') as f:
            f.write('\n'.join(vulnerable))

        add_outputs(takeover_findings_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_bb_takeover.txt")
        print(f"Potential takeovers: {len(vulnerable)}")
  port-scan:
    name: Port Scanning
    needs:
    - dns-verify
    outputs:
      ports_file: '{{ steps["collect-ports"].outputs.ports_file | default("", true) }}'
      port_count: '{{ steps["collect-ports"].outputs.port_count | default("", true) }}'
    steps:
    - task: naabu
      timeout: "{{ (jobs['subdomain-enum'].outputs.sub_count | default(50, true) | int / 50 * 15 + 30) | int }}"
      name: naabu-scan
      with:
        target: "{{ jobs['dns-verify'].outputs.alive_file }}"
        top_ports: '1000'
        rate: 1000
      continue-on-error: true
    - name: collect-ports
      script: |
        ports = set()
        hosts = set()
        naabu_out = {{ steps["naabu-scan"].outputs.typed_outputs | tojson }}
        for item in naabu_out:
            if item.get('_type') == 'port':
                host = item.get('host') or item.get('ip', '')
                port = item.get('port', '')
                if host and port:
                    ports.add(f"{host}:{port}")
                    hosts.add(host)

        with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_bb_ports.txt', 'w') as f:
            f.write('\n'.join(sorted(ports)))

        add_outputs(ports_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_bb_ports.txt", port_count=len(ports))
        print(f"Found {len(ports)} open ports across {len(hosts)} hosts")
  http-probe:
    name: HTTP Probing
    needs:
    - dns-verify
    outputs:
      live_urls: '{{ steps["export-live"].outputs.live_urls | default("", true) }}'
      live_count: '{{ steps["export-live"].outputs.live_count | default("", true) }}'
    steps:
    - task: httpx
      timeout: "{{ (jobs['subdomain-enum'].outputs.sub_count | default(50, true) | int / 50 * 15 + 30) | int }}"
      name: probe-http
      with:
        target: "{{ jobs['dns-verify'].outputs.alive_file }}"
        tech_detect: true
        status_code: true
        title: true
        follow_redirects: true
      continue-on-error: true
    - name: export-live
      script: |
        typed = {{ steps["probe-http"].outputs.typed_outputs | default([], true) | tojson }}
        live = []
        for item in typed:
            if item.get("_type") == "url" and item.get("status_code", 0) > 0:
                live.append(item["url"])
        add_outputs(live_urls='\n'.join(sorted(set(live))))
        count = sum(1 for item in typed if item.get("_type") == "url" and item.get("status_code", 0) > 0)
        add_outputs(live_count=count)
  web-crawl:
    name: Web Crawling
    needs:
    - http-probe
    outputs:
      crawled_file: '{{ steps["collect-crawled"].outputs.crawled_file | default("", true) }}'
      crawl_count: '{{ steps["collect-crawled"].outputs.crawl_count | default("", true) }}'
    steps:
    - task: katana
      timeout: 15
      name: katana-crawl
      with:
        target: "{{ jobs['http-probe'].outputs.live_urls | default(inputs.target, true) }}"
        depth: 3
      continue-on-error: true
    - name: hakrawler-crawl
      run: |
        echo "{{ jobs['http-probe'].outputs.live_urls | default(inputs.target, true) }}" | hakrawler -d 2 2>/dev/null | tee /tmp/hakrawler-urls.txt
      continue-on-error: true
    - task: gau
      timeout: 10
      name: gau-archive
      with:
        target: '{{ inputs.target }}'
        subs: true
      continue-on-error: true
    - name: collect-crawled
      script: |
        urls = set()

        # From katana
        step_data = {{ steps | tojson }}
        for idx in ["0", "2"]:
            typed = step_data.get(idx, {}).get('outputs', {}).get('typed_outputs', [])
            for item in typed:
                if item.get('_type') == 'url':
                    urls.add(item['url'])

        # From hakrawler
        try:
            with open('/tmp/hakrawler-urls.txt') as f:
                for line in f:
                    url = line.strip()
                    if url and url.startswith('http'):
                        urls.add(url)
        except FileNotFoundError:
            pass

        with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_bb_crawled.txt', 'w') as f:
            f.write('\n'.join(sorted(urls)))

        add_outputs(crawled_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_bb_crawled.txt", crawl_count=len(urls))
        print(f"Crawled {len(urls)} unique URLs")
  param-mine:
    name: Parameter Mining
    needs:
    - http-probe
    outputs:
      param_file: '{{ steps["collect-params"].outputs.param_file | default("", true) }}'
      param_url_count: '{{ steps["collect-params"].outputs.param_url_count | default("", true) }}'
      unique_params: '{{ steps["collect-params"].outputs.unique_params | default("", true) }}'
    steps:
    - task: paramspider
      timeout: 10
      name: paramspider-mine
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: arjun-discover
      run: |
        echo "{{ jobs['http-probe'].outputs.live_urls | default(inputs.target, true) }}" | head -20 | while read url; do
          arjun -u "$url" --output /tmp/arjun-params.json 2>/dev/null || true
        done
      continue-on-error: true
    - name: collect-params
      script: |
        import json

        params = set()
        param_urls = set()

        # From paramspider
        for item in {{ urls(steps["paramspider-mine"].outputs.typed_outputs) | default([], true) | tojson }}:
            url = item.get('url', '')
            if url and '=' in url:
                param_urls.add(url)

        try:
            with open('/tmp/arjun-params.json') as f:
                data = json.load(f)
            for url, url_params in data.items():
                for p in url_params:
                    params.add(p)
        except (FileNotFoundError, json.JSONDecodeError):
            pass

        with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_bb_params.txt', 'w') as f:
            f.write('\n'.join(sorted(param_urls)))

        add_outputs(param_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_bb_params.txt", param_url_count=len(param_urls), unique_params=len(params))
        print(f"Parameterized URLs: {len(param_urls)}, Unique params: {len(params)}")
  vuln-scan:
    name: Vulnerability Scanning
    needs:
    - web-crawl
    - param-mine
    outputs:
      nuclei_count: '{{ steps["collect-vulns"].outputs.nuclei_count | default("", true) }}'
      critical_count: '{{ steps["collect-vulns"].outputs.critical_count | default("", true) }}'
      high_count: '{{ steps["collect-vulns"].outputs.high_count | default("", true) }}'
      medium_count: '{{ steps["collect-vulns"].outputs.medium_count | default("", true) }}'
      xss_count: '{{ steps["collect-vulns"].outputs.xss_count | default("", true) }}'
      crlf_count: '{{ steps["collect-vulns"].outputs.crlf_count | default("", true) }}'
    steps:
    - task: nuclei
      timeout: 20
      name: nuclei-scan
      with:
        target: "{{ jobs['http-probe'].outputs.live_urls | default(inputs.target, true) }}"
        severity: critical,high,medium
      continue-on-error: true
    - task: dalfox
      timeout: "{{ (jobs['subdomain-enum'].outputs.sub_count | default(50, true) | int / 50 * 15 + 30) | int }}"
      name: dalfox-xss
      with:
        target: "{{ jobs['param-mine'].outputs.param_file | default(jobs['http-probe'].outputs.live_urls, true) }}"
      continue-on-error: true
    - name: crlfuzz-scan
      run: |
        echo "{{ jobs['http-probe'].outputs.live_urls | default(inputs.target, true) }}" | crlfuzz 2>/dev/null | tee /tmp/crlfuzz-output.txt
      continue-on-error: true
    - name: collect-vulns
      script: |
        import json

        nuclei_vulns = {{ vulns(steps["nuclei-scan"].outputs.typed_outputs) | tojson }}
        critical = [v for v in nuclei_vulns if v.get('severity') == 'critical']
        high = [v for v in nuclei_vulns if v.get('severity') == 'high']
        medium = [v for v in nuclei_vulns if v.get('severity') == 'medium']

        dalfox_vulns = {{ vulns(steps["dalfox-xss"].outputs.typed_outputs) | tojson }}

        crlf_count = 0
        try:
            with open('/tmp/crlfuzz-output.txt') as f:
                for line in f:
                    if line.strip():
                        crlf_count += 1
        except FileNotFoundError:
            pass

        add_outputs(nuclei_count=len(nuclei_vulns), critical_count=len(critical), high_count=len(high), medium_count=len(medium), xss_count=len(dalfox_vulns), crlf_count=crlf_count)
        print(f"Nuclei: {len(nuclei_vulns)} (C:{len(critical)} H:{len(high)} M:{len(medium)})")
        print(f"XSS (dalfox): {len(dalfox_vulns)}")
        print(f"CRLF injection: {crlf_count}")
  secret-scan:
    name: Secret Scanning
    needs:
    - web-crawl
    outputs:
      secrets_count: '{{ steps["collect-secrets"].outputs.secrets_count | default("", true) }}'
    steps:
    - task: nuclei
      timeout: 15
      name: nuclei-secrets
      with:
        target: '{{ inputs.target }}'
        tags: exposure,token,secret
      continue-on-error: true
    - name: collect-secrets
      script: |
        vulns = {{ vulns(steps["nuclei-secrets"].outputs.typed_outputs) | tojson }}
        tags = {{ tags(steps["nuclei-secrets"].outputs.typed_outputs) | tojson }}
        total = len(vulns) + len(tags)

        add_outputs(secrets_count=total)
        print(f"Secrets/exposures found: {total}")
  summary:
    name: Bug Bounty Recon Summary
    needs:
    - vuln-scan
    - secret-scan
    - takeover-check
    steps:
    - name: report
      run: |
        echo "======================================================"
        echo " BUG BOUNTY RECON COMPLETE: {{ inputs.target }}"
        echo "======================================================"
        echo ""
        echo "--- Enumeration ---"
        echo "Subdomains discovered: {{ jobs['subdomain-enum'].outputs.sub_count }}"
        echo "DNS verified (alive): {{ jobs['dns-verify'].outputs.alive_count }}"
        echo "Open ports: {{ jobs['port-scan'].outputs.port_count }}"
        echo "Live HTTP services: {{ jobs['http-probe'].outputs.live_count }}"
        echo ""
        echo "--- Crawling & Params ---"
        echo "URLs crawled: {{ jobs['web-crawl'].outputs.crawl_count }}"
        echo "Parameterized URLs: {{ jobs['param-mine'].outputs.param_url_count }}"
        echo "Unique parameters: {{ jobs['param-mine'].outputs.unique_params }}"
        echo ""
        echo "--- Takeovers ---"
        echo "Potential takeovers: {{ jobs['takeover-check'].outputs.takeover_count }}"
        echo ""
        echo "--- Vulnerabilities ---"
        echo "Nuclei findings: {{ jobs['vuln-scan'].outputs.nuclei_count }}"
        echo "  Critical: {{ jobs['vuln-scan'].outputs.critical_count }}"
        echo "  High: {{ jobs['vuln-scan'].outputs.high_count }}"
        echo "  Medium: {{ jobs['vuln-scan'].outputs.medium_count }}"
        echo "XSS (dalfox): {{ jobs['vuln-scan'].outputs.xss_count }}"
        echo "CRLF injection: {{ jobs['vuln-scan'].outputs.crlf_count }}"
        echo ""
        echo "--- Secrets ---"
        echo "Secrets/Leaks: {{ jobs['secret-scan'].outputs.secrets_count }}"
      log-stdout: true
    - name: export-to-project
      script: |
        import shutil
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:

            # subdomains
            d = '{{ vars.project_subdomains }}'
            Path(d).mkdir(parents=True, exist_ok=True)
            src = '''{{ jobs['subdomain-enum'].outputs.subs_file | default('', true) }}'''
            if src and Path(src).is_file():
                shutil.copy2(src, Path(d) / 'subdomains.txt')
                print('  [+] subdomains/subdomains.txt')

            # alive subs
            d = '{{ vars.project_subdomains }}'
            Path(d).mkdir(parents=True, exist_ok=True)
            src = '''{{ jobs['dns-verify'].outputs.alive_file | default('', true) }}'''
            if src and Path(src).is_file():
                shutil.copy2(src, Path(d) / 'alive-subs.txt')
                print('  [+] subdomains/alive-subs.txt')

            # open ports
            d = '{{ vars.project_hosts }}'
            Path(d).mkdir(parents=True, exist_ok=True)
            src = '''{{ jobs['port-scan'].outputs.ports_file | default('', true) }}'''
            if src and Path(src).is_file():
                shutil.copy2(src, Path(d) / 'ports.txt')
                print('  [+] hosts/ports.txt')

            # crawled URLs
            d = '{{ vars.project_web }}'
            Path(d).mkdir(parents=True, exist_ok=True)
            src = '''{{ jobs['web-crawl'].outputs.crawled_file | default('', true) }}'''
            if src and Path(src).is_file():
                shutil.copy2(src, Path(d) / 'crawled-urls.txt')
                print('  [+] web/crawled-urls.txt')

            # Auto-export typed outputs
            all_typed = []
            for typed in [
                {{ jobs['subdomain-enum'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['dns-verify'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['takeover-check'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['port-scan'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['http-probe'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['web-crawl'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['param-mine'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['vuln-scan'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['secret-scan'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true
