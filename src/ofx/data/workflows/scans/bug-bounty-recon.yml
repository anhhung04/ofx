name: bug-bounty-recon
description: 'Bug bounty reconnaissance pipeline — comprehensive target enumeration combining subdomain discovery, port scanning,
  URL crawling, parameter mining, takeover checking, and vulnerability scanning optimized for bug bounty programs.

  '
tags:
- scan
- bugbounty
- recon
- web
- vuln
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target domain (e.g. example.com)
jobs:
  subdomain-enum:
    name: Subdomain Enumeration
    steps:
    - task: subfinder
      name: subfinder-scan
      with:
        target: '{{ inputs.target }}'
        all: true
      log-stdout: true
      continue-on-error: true
    - name: amass-passive
      run: 'amass enum -passive -d {{ inputs.target }} 2>/dev/null | tee /tmp/amass-subs.txt

        '
      continue-on-error: true
    - name: assetfinder-enum
      run: 'assetfinder --subs-only {{ inputs.target }} 2>/dev/null | tee /tmp/assetfinder-subs.txt

        '
      continue-on-error: true
    - name: findomain-enum
      run: 'findomain -t {{ inputs.target }} -q 2>/dev/null | tee /tmp/findomain-subs.txt

        '
      continue-on-error: true
    - name: merge-subdomains
      script: "subs = set()\nsubs.add('{{ inputs.target }}')\n\n# From subfinder\nsf_outputs = {{ steps[0].outputs.typed_outputs\
        \ | tojson }}\nfor item in sf_outputs:\n    if item.get('_type') == 'subdomain':\n        subs.add(item['host'])\n\
        \n# From amass, assetfinder, findomain\nfor path in ['/tmp/amass-subs.txt', '/tmp/assetfinder-subs.txt', '/tmp/findomain-subs.txt']:\n\
        \    try:\n        with open(path) as f:\n            for line in f:\n                sub = line.strip()\n       \
        \         if sub and '{{ inputs.target }}' in sub:\n                    subs.add(sub)\n    except FileNotFoundError:\n\
        \        pass\n\nwith open('/tmp/ofx_bb_subs.txt', 'w') as f:\n    f.write('\\n'.join(sorted(subs)))\n\
        \nwith open('{{ env.OFX_OUTPUTS }}', 'a') as f:\n    f.write(f\"subs_file=/tmp/ofx_bb_subs.txt\\n\")\n    f.write(f\"\
        sub_count={len(subs)}\\n\")\n\nprint(f\"Collected {len(subs)} unique subdomains\")\n"
  dns-verify:
    name: DNS Verification
    needs:
    - subdomain-enum
    steps:
    - task: dnsx
      name: verify-dns
      with:
        target: '{{ jobs[''subdomain-enum''].outputs.subs_file }}'
        a: true
        cname: true
        resp: true
      log-stdout: true
      continue-on-error: true
    - name: filter-alive
      script: "alive = set()\ndnsx_out = {{ steps[0].outputs.typed_outputs | tojson }}\nfor item in dnsx_out:\n    host =\
        \ item.get('host', '')\n    if host:\n        alive.add(host)\n\nwith open('/tmp/ofx_bb_alive.txt', 'w') as f:\n\
        \    f.write('\\n'.join(sorted(alive)))\n\nwith open('{{ env.OFX_OUTPUTS }}', 'a') as f:\n \
        \   f.write(f\"alive_file=/tmp/ofx_bb_alive.txt\\n\")\n    f.write(f\"alive_count={len(alive)}\\n\")\n\nprint(f\"\
        Verified {len(alive)} alive subdomains\")\n"
  takeover-check:
    name: Subdomain Takeover Check
    needs:
    - dns-verify
    steps:
    - name: subzy-scan
      run: 'cat {{ jobs[''dns-verify''].outputs.alive_file }} > /tmp/takeover-targets.txt

        subzy run --targets /tmp/takeover-targets.txt 2>/dev/null | tee /tmp/subzy-output.txt

        '
      continue-on-error: true
    - name: collect-takeovers
      script: "import re\n\nvulnerable = []\ntry:\n    with open('/tmp/subzy-output.txt') as f:\n        for line in f:\n\
        \            if 'VULNERABLE' in line.upper() or '[+]' in line:\n                vulnerable.append(line.strip())\n\
        except FileNotFoundError:\n    pass\n\nwith open('{{ env.OFX_OUTPUTS }}', 'a') as f:\n    f.write(f\"takeover_count={len(vulnerable)}\\\
        n\")\n\nwith open('/tmp/ofx_bb_takeover.txt', 'w') as f:\n    f.write('\\n'.join(vulnerable))\n\nwith open('{{ env.OFX_OUTPUTS }}', 'a') as f:\n    f.write(f\"takeover_findings_file=/tmp/ofx_bb_takeover.txt\\n\")\n\nprint(f\"Potential takeovers: {len(vulnerable)}\"\
        )\n"
  port-scan:
    name: Port Scanning
    needs:
    - dns-verify
    steps:
    - task: naabu
      name: naabu-scan
      with:
        target: '{{ jobs[''dns-verify''].outputs.alive_file }}'
        top_ports: '1000'
        rate: 1000
      log-stdout: true
      continue-on-error: true
    - name: collect-ports
      script: "ports = set()\nhosts = set()\nnaabu_out = {{ steps[0].outputs.typed_outputs | tojson }}\nfor item in naabu_out:\n\
        \    if item.get('_type') == 'port':\n        host = item.get('host') or item.get('ip', '')\n        port = item.get('port',\
        \ '')\n        if host and port:\n            ports.add(f\"{host}:{port}\")\n            hosts.add(host)\n\nwith open('/tmp/ofx_bb_ports.txt', 'w') as f:\n    f.write('\\n'.join(sorted(ports)))\n\nwith open('{{\
        \ env.OFX_OUTPUTS }}', 'a') as f:\n    f.write(f\"ports_file=/tmp/ofx_bb_ports.txt\\n\")\n    f.write(f\"\
        port_count={len(ports)}\\n\")\n\nprint(f\"Found {len(ports)} open ports across {len(hosts)} hosts\")\n"
  http-probe:
    name: HTTP Probing
    needs:
    - dns-verify
    steps:
    - task: httpx
      name: probe-http
      with:
        target: '{{ jobs[''dns-verify''].outputs.alive_file }}'
        tech_detect: true
        status_code: true
        title: true
        follow_redirects: true
      log-stdout: true
      continue-on-error: true
    - name: export-live
      run: 'echo "live_urls={{ urls(steps[0].outputs.typed_outputs) | selectattr(''status_code'', ''gt'', 0) | map(attribute=''url'')
        | unique | join(''\n'') }}" >> $OFX_OUTPUTS

        echo "live_count={{ urls(steps[0].outputs.typed_outputs) | selectattr(''status_code'', ''gt'', 0) | list | length
        }}" >> $OFX_OUTPUTS

        '
      log-stdout: true
  web-crawl:
    name: Web Crawling
    needs:
    - http-probe
    steps:
    - task: katana
      name: katana-crawl
      with:
        target: '{{ jobs[''http-probe''].outputs.live_urls | default(inputs.target, true) }}'
        depth: 3
      log-stdout: true
      continue-on-error: true
    - name: hakrawler-crawl
      run: 'echo "{{ jobs[''http-probe''].outputs.live_urls | default(inputs.target, true) }}" | hakrawler -d 2 2>/dev/null
        | tee /tmp/hakrawler-urls.txt

        '
      continue-on-error: true
    - task: gau
      name: gau-archive
      with:
        target: '{{ inputs.target }}'
        subs: true
      continue-on-error: true
    - name: collect-crawled
      script: "urls = set()\n\n# From katana\nstep_data = {{ steps | tojson }}\nfor idx in [0, 2]:\n    typed = step_data[idx].get('outputs',\
        \ {}).get('typed_outputs', [])\n    for item in typed:\n        if item.get('_type') == 'url':\n            urls.add(item['url'])\n\
        \n# From hakrawler\ntry:\n    with open('/tmp/hakrawler-urls.txt') as f:\n        for line in f:\n            url\
        \ = line.strip()\n            if url and url.startswith('http'):\n                urls.add(url)\nexcept FileNotFoundError:\n\
        \    pass\n\nwith open('/tmp/ofx_bb_crawled.txt', 'w') as f:\n    f.write('\\n'.join(sorted(urls)))\n\nwith open('{{ env.OFX_OUTPUTS }}', 'a') as f:\n    f.write(f\"crawled_file=/tmp/ofx_bb_crawled.txt\\n\")\n\
        \    f.write(f\"crawl_count={len(urls)}\\n\")\n\nprint(f\"Crawled {len(urls)} unique URLs\")\n"
  param-mine:
    name: Parameter Mining
    needs:
    - http-probe
    steps:
    - name: paramspider-mine
      run: 'paramspider -d {{ inputs.target }} --output /tmp/paramspider-output.txt 2>/dev/null || true

        '
      continue-on-error: true
    - name: arjun-discover
      run: "echo \"{{ jobs['http-probe'].outputs.live_urls | default(inputs.target, true) }}\" | head -20 | while read url;\
        \ do\n  arjun -u \"$url\" --output /tmp/arjun-params.json 2>/dev/null || true\ndone\n"
      continue-on-error: true
    - name: collect-params
      script: "import json\n\nparams = set()\nparam_urls = set()\n\ntry:\n    with open('/tmp/paramspider-output.txt') as\
        \ f:\n        for line in f:\n            url = line.strip()\n            if url and '=' in url:\n               \
        \ param_urls.add(url)\nexcept FileNotFoundError:\n    pass\n\ntry:\n    with open('/tmp/arjun-params.json') as f:\n\
        \        data = json.load(f)\n    for url, url_params in data.items():\n        for p in url_params:\n           \
        \ params.add(p)\nexcept (FileNotFoundError, json.JSONDecodeError):\n    pass\n\nwith open('{{ env.OFX_OUTPUTS }}',\
        \ 'a') as f:\n    f.write(f\"param_file=/tmp/ofx_bb_params.txt\\n\")\n    f.write(f\"param_url_count={len(param_urls)}\\\
        n\")\n    f.write(f\"unique_params={len(params)}\\n\")\n\nprint(f\"Parameterized URLs: {len(param_urls)}, Unique params:\
        \ {len(params)}\")\n"
  vuln-scan:
    name: Vulnerability Scanning
    needs:
    - web-crawl
    - param-mine
    steps:
    - task: nuclei
      name: nuclei-scan
      with:
        target: '{{ jobs[''http-probe''].outputs.live_urls | default(inputs.target, true) }}'
        severity: critical,high,medium
      log-stdout: true
      continue-on-error: true
    - task: dalfox
      name: dalfox-xss
      with:
        target: '{{ jobs[''param-mine''].outputs.param_file | default(jobs[''http-probe''].outputs.live_urls, true) }}'
      continue-on-error: true
      log-stdout: true
    - name: crlfuzz-scan
      run: 'echo "{{ jobs[''http-probe''].outputs.live_urls | default(inputs.target, true) }}" | crlfuzz 2>/dev/null | tee
        /tmp/crlfuzz-output.txt

        '
      continue-on-error: true
    - name: collect-vulns
      script: "import json\n\nnuclei_vulns = {{ vulns(steps[0].outputs.typed_outputs) | tojson }}\ncritical = [v for v in\
        \ nuclei_vulns if v.get('severity') == 'critical']\nhigh = [v for v in nuclei_vulns if v.get('severity') == 'high']\n\
        medium = [v for v in nuclei_vulns if v.get('severity') == 'medium']\n\ndalfox_vulns = {{ vulns(steps[1].outputs.typed_outputs)\
        \ | tojson }}\n\ncrlf_count = 0\ntry:\n    with open('/tmp/crlfuzz-output.txt') as f:\n        for line in f:\n  \
        \          if line.strip():\n                crlf_count += 1\nexcept FileNotFoundError:\n    pass\n\nwith open('{{\
        \ env.OFX_OUTPUTS }}', 'a') as f:\n    f.write(f\"nuclei_count={len(nuclei_vulns)}\\n\")\n    f.write(f\"critical_count={len(critical)}\\\
        n\")\n    f.write(f\"high_count={len(high)}\\n\")\n    f.write(f\"medium_count={len(medium)}\\n\")\n    f.write(f\"\
        xss_count={len(dalfox_vulns)}\\n\")\n    f.write(f\"crlf_count={crlf_count}\\n\")\n\nprint(f\"Nuclei: {len(nuclei_vulns)}\
        \ (C:{len(critical)} H:{len(high)} M:{len(medium)})\")\nprint(f\"XSS (dalfox): {len(dalfox_vulns)}\")\nprint(f\"CRLF\
        \ injection: {crlf_count}\")\n"
  secret-scan:
    name: Secret Scanning
    needs:
    - web-crawl
    steps:
    - task: trufflehog
      name: trufflehog-scan
      with:
        target: '{{ inputs.target }}'
        mode: filesystem
      log-stdout: true
      continue-on-error: true
    - task: gitleaks
      name: gitleaks-scan
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
      log-stdout: true
    - name: collect-secrets
      script: "th_vulns = {{ vulns(steps[0].outputs.typed_outputs) | tojson }}\ngl_vulns = {{ vulns(steps[1].outputs.typed_outputs)\
        \ | tojson }}\ntotal = len(th_vulns) + len(gl_vulns)\n\nwith open('{{ env.OFX_OUTPUTS }}', 'a') as f:\n    f.write(f\"\
        secrets_count={total}\\n\")\n\nprint(f\"Secrets found: {total} (trufflehog: {len(th_vulns)}, gitleaks: {len(gl_vulns)})\"\
        )\n"
  summary:
    name: Bug Bounty Recon Summary
    needs:
    - vuln-scan
    - secret-scan
    - takeover-check
    steps:
    - name: report
      run: 'echo "======================================================"

        echo " BUG BOUNTY RECON COMPLETE: {{ inputs.target }}"

        echo "======================================================"

        echo ""

        echo "--- Enumeration ---"

        echo "Subdomains discovered: {{ jobs[''subdomain-enum''].outputs.sub_count }}"

        echo "DNS verified (alive): {{ jobs[''dns-verify''].outputs.alive_count }}"

        echo "Open ports: {{ jobs[''port-scan''].outputs.port_count }}"

        echo "Live HTTP services: {{ jobs[''http-probe''].outputs.live_count }}"

        echo ""

        echo "--- Crawling & Params ---"

        echo "URLs crawled: {{ jobs[''web-crawl''].outputs.crawl_count }}"

        echo "Parameterized URLs: {{ jobs[''param-mine''].outputs.param_url_count }}"

        echo "Unique parameters: {{ jobs[''param-mine''].outputs.unique_params }}"

        echo ""

        echo "--- Takeovers ---"

        echo "Potential takeovers: {{ jobs[''takeover-check''].outputs.takeover_count }}"

        echo ""

        echo "--- Vulnerabilities ---"

        echo "Nuclei findings: {{ jobs[''vuln-scan''].outputs.nuclei_count }}"

        echo "  Critical: {{ jobs[''vuln-scan''].outputs.critical_count }}"

        echo "  High: {{ jobs[''vuln-scan''].outputs.high_count }}"

        echo "  Medium: {{ jobs[''vuln-scan''].outputs.medium_count }}"

        echo "XSS (dalfox): {{ jobs[''vuln-scan''].outputs.xss_count }}"

        echo "CRLF injection: {{ jobs[''vuln-scan''].outputs.crlf_count }}"

        echo ""

        echo "--- Secrets ---"

        echo "Secrets/Leaks: {{ jobs[''secret-scan''].outputs.secrets_count }}"

        '
      log-stdout: true
    - name: export-to-project
      script: "import json, os\nfrom pathlib import Path\n\nproject = '{{ vars.project_path | default(\"\", true) }}'\nif\
        \ not project:\n    print('No --project set, skipping file export')\nelse:\n    p = Path(project)\n\n    # subdomains\n\
        \    d = p / 'scans'\n    d.mkdir(parents=True, exist_ok=True)\n    sf = '{{ jobs[\"subdomain-enum\"].outputs.subs_file | default(\"\", true) }}'\n\
        \    if sf:\n        import shutil\n        shutil.copy2(sf, d / 'subdomains.txt')\n        print(f'  [+] scans/subdomains.txt')\n\
        \n    # alive subs\n    d = p / 'scans'\n    d.mkdir(parents=True, exist_ok=True)\n    af = '{{ jobs[\"dns-verify\"].outputs.alive_file | default(\"\", true) }}'\n\
        \    if af:\n        import shutil\n        shutil.copy2(af, d / 'alive-subs.txt')\n        print(f'  [+] scans/alive-subs.txt')\n\n    # open ports\n    d = p / 'scans'\n    d.mkdir(parents=True, exist_ok=True)\n    pf = '{{ jobs[\"port-scan\"].outputs.ports_file | default(\"\", true) }}'\n    if pf:\n        import shutil\n        shutil.copy2(pf, d / 'ports.txt')\n        print(f'  [+]\
        \ scans/ports.txt')\n\n    # crawled URLs\n    d = p / 'scans'\n    d.mkdir(parents=True,\
        \ exist_ok=True)\n    cf = '{{ jobs[\"web-crawl\"].outputs.crawled_file | default(\"\", true) }}'\n    if cf:\n        import shutil\n        shutil.copy2(cf, d / 'crawled-urls.txt')\n        print(f'  [+] scans/crawled-urls.txt')\n\n    print(f'Project export complete: {project}')"
      continue-on-error: true
