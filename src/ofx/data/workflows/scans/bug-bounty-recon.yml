name: bug-bounty-recon
description: 'Bug bounty reconnaissance pipeline — comprehensive target enumeration combining subdomain discovery, port scanning, URL crawling, parameter mining, takeover checking, and vulnerability scanning optimized for bug bounty programs.

  '
tags:
- scan
- bugbounty
- recon
- web
- vuln
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target domain (e.g. example.com)
      alias: t
jobs:
  subdomain-enum:
    name: Subdomain Enumeration
    outputs:
      subs_file: '{{ steps["merge-subdomains"].outputs.subs_file }}'
      sub_count: '{{ steps["merge-subdomains"].outputs.sub_count }}'
    steps:
    - task: subfinder
      timeout: 10
      name: subfinder-scan
      with:
        target: '{{ inputs.target }}'
        all: true
      continue-on-error: true
    - name: amass-passive
      run: |
        amass enum -passive -d {{ inputs.target }} 2>/dev/null | tee /tmp/amass-subs.txt
      continue-on-error: true
    - name: assetfinder-enum
      run: |
        assetfinder --subs-only {{ inputs.target }} 2>/dev/null | tee /tmp/assetfinder-subs.txt
      continue-on-error: true
    - name: findomain-enum
      run: |
        findomain -t {{ inputs.target }} -q 2>/dev/null | tee /tmp/findomain-subs.txt
      continue-on-error: true
    - name: merge-subdomains
      script: |
        subs = set()
        subs.add('{{ inputs.target }}')

        # From subfinder
        sf_outputs = {{ steps["subfinder-scan"].outputs.typed_outputs | tojson }}
        for item in sf_outputs:
            if item.get('_type') == 'subdomain':
                subs.add(item['host'])

        # From amass, assetfinder, findomain
        for path in ['/tmp/amass-subs.txt', '/tmp/assetfinder-subs.txt', '/tmp/findomain-subs.txt']:
            try:
                with open(path) as f:
                    for line in f:
                        sub = line.strip()
                        if sub and '{{ inputs.target }}' in sub:
                            subs.add(sub)
            except FileNotFoundError:
                pass

        with open('/tmp/ofx_bb_subs.txt', 'w') as f:
            f.write('\n'.join(sorted(subs)))

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"subs_file=/tmp/ofx_bb_subs.txt\n")
            f.write(f"sub_count={len(subs)}\n")

        print(f"Collected {len(subs)} unique subdomains")
  dns-verify:
    name: DNS Verification
    needs:
    - subdomain-enum
    outputs:
      alive_file: '{{ steps["filter-alive"].outputs.alive_file }}'
      alive_count: '{{ steps["filter-alive"].outputs.alive_count }}'
    steps:
    - task: dnsx
      timeout: 10
      name: verify-dns
      with:
        target: '{{ jobs[''subdomain-enum''].outputs.subs_file }}'
        a: true
        cname: true
        resp: true
      continue-on-error: true
    - name: filter-alive
      script: |
        alive = set()
        dnsx_out = {{ steps["verify-dns"].outputs.typed_outputs | tojson }}
        for item in dnsx_out:
            host = item.get('host', '')
            if host:
                alive.add(host)

        with open('/tmp/ofx_bb_alive.txt', 'w') as f:
            f.write('\n'.join(sorted(alive)))

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"alive_file=/tmp/ofx_bb_alive.txt\n")
            f.write(f"alive_count={len(alive)}\n")

        print(f"Verified {len(alive)} alive subdomains")
  takeover-check:
    name: Subdomain Takeover Check
    needs:
    - dns-verify
    outputs:
      takeover_count: '{{ steps["collect-takeovers"].outputs.takeover_count }}'
      takeover_findings_file: '{{ steps["collect-takeovers"].outputs.takeover_findings_file }}'
    steps:
    - name: subzy-scan
      run: |
        cat {{ jobs['dns-verify'].outputs.alive_file }} > /tmp/takeover-targets.txt
        subzy run --targets /tmp/takeover-targets.txt 2>/dev/null | tee /tmp/subzy-output.txt
      continue-on-error: true
    - name: collect-takeovers
      script: |
        import re

        vulnerable = []
        try:
            with open('/tmp/subzy-output.txt') as f:
                for line in f:
                    if 'VULNERABLE' in line.upper() or '[+]' in line:
                        vulnerable.append(line.strip())
        except FileNotFoundError:
            pass

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"takeover_count={len(vulnerable)}\n")

        with open('/tmp/ofx_bb_takeover.txt', 'w') as f:
            f.write('\n'.join(vulnerable))

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"takeover_findings_file=/tmp/ofx_bb_takeover.txt\n")

        print(f"Potential takeovers: {len(vulnerable)}")
  port-scan:
    name: Port Scanning
    needs:
    - dns-verify
    outputs:
      ports_file: '{{ steps["collect-ports"].outputs.ports_file }}'
      port_count: '{{ steps["collect-ports"].outputs.port_count }}'
    steps:
    - task: naabu
      timeout: 10
      name: naabu-scan
      with:
        target: '{{ jobs[''dns-verify''].outputs.alive_file }}'
        top_ports: '1000'
        rate: 1000
      continue-on-error: true
    - name: collect-ports
      script: |
        ports = set()
        hosts = set()
        naabu_out = {{ steps["naabu-scan"].outputs.typed_outputs | tojson }}
        for item in naabu_out:
            if item.get('_type') == 'port':
                host = item.get('host') or item.get('ip', '')
                port = item.get('port', '')
                if host and port:
                    ports.add(f"{host}:{port}")
                    hosts.add(host)

        with open('/tmp/ofx_bb_ports.txt', 'w') as f:
            f.write('\n'.join(sorted(ports)))

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"ports_file=/tmp/ofx_bb_ports.txt\n")
            f.write(f"port_count={len(ports)}\n")

        print(f"Found {len(ports)} open ports across {len(hosts)} hosts")
  http-probe:
    name: HTTP Probing
    needs:
    - dns-verify
    outputs:
      live_urls: '{{ steps["export-live"].outputs.live_urls }}'
      live_count: '{{ steps["export-live"].outputs.live_count }}'
    steps:
    - task: httpx
      timeout: 10
      name: probe-http
      with:
        target: '{{ jobs[''dns-verify''].outputs.alive_file }}'
        tech_detect: true
        status_code: true
        title: true
        follow_redirects: true
      continue-on-error: true
    - name: export-live
      run: |
        echo "live_urls={{ urls(steps["probe-http"].outputs.typed_outputs) | selectattr('status_code', 'gt', 0) | map(attribute='url') | unique | join('\n') }}" >> $OFX_OUTPUTS
        echo "live_count={{ urls(steps["probe-http"].outputs.typed_outputs) | selectattr('status_code', 'gt', 0) | list | length }}" >> $OFX_OUTPUTS
  web-crawl:
    name: Web Crawling
    needs:
    - http-probe
    outputs:
      crawled_file: '{{ steps["collect-crawled"].outputs.crawled_file }}'
      crawl_count: '{{ steps["collect-crawled"].outputs.crawl_count }}'
    steps:
    - task: katana
      timeout: 15
      name: katana-crawl
      with:
        target: '{{ jobs[''http-probe''].outputs.live_urls | default(inputs.target, true) }}'
        depth: 3
      continue-on-error: true
    - name: hakrawler-crawl
      run: |
        echo "{{ jobs['http-probe'].outputs.live_urls | default(inputs.target, true) }}" | hakrawler -d 2 2>/dev/null | tee /tmp/hakrawler-urls.txt
      continue-on-error: true
    - task: gau
      timeout: 10
      name: gau-archive
      with:
        target: '{{ inputs.target }}'
        subs: true
      continue-on-error: true
    - name: collect-crawled
      script: |
        urls = set()

        # From katana
        step_data = {{ steps | tojson }}
        for idx in [0, 2]:
            typed = step_data[idx].get('outputs', {}).get('typed_outputs', [])
            for item in typed:
                if item.get('_type') == 'url':
                    urls.add(item['url'])

        # From hakrawler
        try:
            with open('/tmp/hakrawler-urls.txt') as f:
                for line in f:
                    url = line.strip()
                    if url and url.startswith('http'):
                        urls.add(url)
        except FileNotFoundError:
            pass

        with open('/tmp/ofx_bb_crawled.txt', 'w') as f:
            f.write('\n'.join(sorted(urls)))

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"crawled_file=/tmp/ofx_bb_crawled.txt\n")
            f.write(f"crawl_count={len(urls)}\n")

        print(f"Crawled {len(urls)} unique URLs")
  param-mine:
    name: Parameter Mining
    needs:
    - http-probe
    outputs:
      param_file: '{{ steps["collect-params"].outputs.param_file }}'
      param_url_count: '{{ steps["collect-params"].outputs.param_url_count }}'
      unique_params: '{{ steps["collect-params"].outputs.unique_params }}'
    steps:
    - name: paramspider-mine
      run: |
        paramspider -d {{ inputs.target }} --output /tmp/paramspider-output.txt 2>/dev/null || true
      continue-on-error: true
    - name: arjun-discover
      run: |
        echo "{{ jobs['http-probe'].outputs.live_urls | default(inputs.target, true) }}" | head -20 | while read url; do
          arjun -u "$url" --output /tmp/arjun-params.json 2>/dev/null || true
        done
      continue-on-error: true
    - name: collect-params
      script: |
        import json

        params = set()
        param_urls = set()

        try:
            with open('/tmp/paramspider-output.txt') as f:
                for line in f:
                    url = line.strip()
                    if url and '=' in url:
                        param_urls.add(url)
        except FileNotFoundError:
            pass

        try:
            with open('/tmp/arjun-params.json') as f:
                data = json.load(f)
            for url, url_params in data.items():
                for p in url_params:
                    params.add(p)
        except (FileNotFoundError, json.JSONDecodeError):
            pass

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"param_file=/tmp/ofx_bb_params.txt\n")
            f.write(f"param_url_count={len(param_urls)}\n")
            f.write(f"unique_params={len(params)}\n")

        print(f"Parameterized URLs: {len(param_urls)}, Unique params: {len(params)}")
  vuln-scan:
    name: Vulnerability Scanning
    needs:
    - web-crawl
    - param-mine
    outputs:
      nuclei_count: '{{ steps["collect-vulns"].outputs.nuclei_count }}'
      critical_count: '{{ steps["collect-vulns"].outputs.critical_count }}'
      high_count: '{{ steps["collect-vulns"].outputs.high_count }}'
      medium_count: '{{ steps["collect-vulns"].outputs.medium_count }}'
      xss_count: '{{ steps["collect-vulns"].outputs.xss_count }}'
      crlf_count: '{{ steps["collect-vulns"].outputs.crlf_count }}'
    steps:
    - task: nuclei
      timeout: 20
      name: nuclei-scan
      with:
        target: '{{ jobs[''http-probe''].outputs.live_urls | default(inputs.target, true) }}'
        severity: critical,high,medium
      continue-on-error: true
    - task: dalfox
      timeout: 15
      name: dalfox-xss
      with:
        target: '{{ jobs[''param-mine''].outputs.param_file | default(jobs[''http-probe''].outputs.live_urls, true) }}'
      continue-on-error: true
    - name: crlfuzz-scan
      run: |
        echo "{{ jobs['http-probe'].outputs.live_urls | default(inputs.target, true) }}" | crlfuzz 2>/dev/null | tee /tmp/crlfuzz-output.txt
      continue-on-error: true
    - name: collect-vulns
      script: |
        import json

        nuclei_vulns = {{ vulns(steps["nuclei-scan"].outputs.typed_outputs) | tojson }}
        critical = [v for v in nuclei_vulns if v.get('severity') == 'critical']
        high = [v for v in nuclei_vulns if v.get('severity') == 'high']
        medium = [v for v in nuclei_vulns if v.get('severity') == 'medium']

        dalfox_vulns = {{ vulns(steps["dalfox-xss"].outputs.typed_outputs) | tojson }}

        crlf_count = 0
        try:
            with open('/tmp/crlfuzz-output.txt') as f:
                for line in f:
                    if line.strip():
                        crlf_count += 1
        except FileNotFoundError:
            pass

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"nuclei_count={len(nuclei_vulns)}\n")
            f.write(f"critical_count={len(critical)}\n")
            f.write(f"high_count={len(high)}\n")
            f.write(f"medium_count={len(medium)}\n")
            f.write(f"xss_count={len(dalfox_vulns)}\n")
            f.write(f"crlf_count={crlf_count}\n")

        print(f"Nuclei: {len(nuclei_vulns)} (C:{len(critical)} H:{len(high)} M:{len(medium)})")
        print(f"XSS (dalfox): {len(dalfox_vulns)}")
        print(f"CRLF injection: {crlf_count}")
  secret-scan:
    name: Secret Scanning
    needs:
    - web-crawl
    outputs:
      secrets_count: '{{ steps["collect-secrets"].outputs.secrets_count }}'
    steps:
    - task: trufflehog
      timeout: 15
      name: trufflehog-scan
      with:
        target: '{{ inputs.target }}'
        mode: filesystem
      continue-on-error: true
    - task: gitleaks
      timeout: 15
      name: gitleaks-scan
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: collect-secrets
      script: |
        th_vulns = {{ vulns(steps["trufflehog-scan"].outputs.typed_outputs) | tojson }}
        gl_vulns = {{ vulns(steps["gitleaks-scan"].outputs.typed_outputs) | tojson }}
        total = len(th_vulns) + len(gl_vulns)

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"secrets_count={total}\n")

        print(f"Secrets found: {total} (trufflehog: {len(th_vulns)}, gitleaks: {len(gl_vulns)})")
  summary:
    name: Bug Bounty Recon Summary
    needs:
    - vuln-scan
    - secret-scan
    - takeover-check
    steps:
    - name: report
      run: |
        echo "======================================================"
        echo " BUG BOUNTY RECON COMPLETE: {{ inputs.target }}"
        echo "======================================================"
        echo ""
        echo "--- Enumeration ---"
        echo "Subdomains discovered: {{ jobs['subdomain-enum'].outputs.sub_count }}"
        echo "DNS verified (alive): {{ jobs['dns-verify'].outputs.alive_count }}"
        echo "Open ports: {{ jobs['port-scan'].outputs.port_count }}"
        echo "Live HTTP services: {{ jobs['http-probe'].outputs.live_count }}"
        echo ""
        echo "--- Crawling & Params ---"
        echo "URLs crawled: {{ jobs['web-crawl'].outputs.crawl_count }}"
        echo "Parameterized URLs: {{ jobs['param-mine'].outputs.param_url_count }}"
        echo "Unique parameters: {{ jobs['param-mine'].outputs.unique_params }}"
        echo ""
        echo "--- Takeovers ---"
        echo "Potential takeovers: {{ jobs['takeover-check'].outputs.takeover_count }}"
        echo ""
        echo "--- Vulnerabilities ---"
        echo "Nuclei findings: {{ jobs['vuln-scan'].outputs.nuclei_count }}"
        echo "  Critical: {{ jobs['vuln-scan'].outputs.critical_count }}"
        echo "  High: {{ jobs['vuln-scan'].outputs.high_count }}"
        echo "  Medium: {{ jobs['vuln-scan'].outputs.medium_count }}"
        echo "XSS (dalfox): {{ jobs['vuln-scan'].outputs.xss_count }}"
        echo "CRLF injection: {{ jobs['vuln-scan'].outputs.crlf_count }}"
        echo ""
        echo "--- Secrets ---"
        echo "Secrets/Leaks: {{ jobs['secret-scan'].outputs.secrets_count }}"
      log-stdout: true
    - name: export-to-project
      script: |
        import shutil
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:

            # subdomains
            d = '{{ vars.project_subdomains }}'
            Path(d).mkdir(parents=True, exist_ok=True)
            src = '''{{ jobs['subdomain-enum'].outputs.subs_file | default('', true) }}'''
            if src and Path(src).is_file():
                shutil.copy2(src, Path(d) / 'subdomains.txt')
                print('  [+] subdomains/subdomains.txt')

            # alive subs
            d = '{{ vars.project_subdomains }}'
            Path(d).mkdir(parents=True, exist_ok=True)
            src = '''{{ jobs['dns-verify'].outputs.alive_file | default('', true) }}'''
            if src and Path(src).is_file():
                shutil.copy2(src, Path(d) / 'alive-subs.txt')
                print('  [+] subdomains/alive-subs.txt')

            # open ports
            d = '{{ vars.project_hosts }}'
            Path(d).mkdir(parents=True, exist_ok=True)
            src = '''{{ jobs['port-scan'].outputs.ports_file | default('', true) }}'''
            if src and Path(src).is_file():
                shutil.copy2(src, Path(d) / 'ports.txt')
                print('  [+] hosts/ports.txt')

            # crawled URLs
            d = '{{ vars.project_web }}'
            Path(d).mkdir(parents=True, exist_ok=True)
            src = '''{{ jobs['web-crawl'].outputs.crawled_file | default('', true) }}'''
            if src and Path(src).is_file():
                shutil.copy2(src, Path(d) / 'crawled-urls.txt')
                print('  [+] web/crawled-urls.txt')

            # Auto-export typed outputs
            all_typed = []
            for typed in [
                {{ jobs['subdomain-enum'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['dns-verify'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['takeover-check'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['port-scan'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['http-probe'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['web-crawl'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['param-mine'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['vuln-scan'].outputs.typed_outputs | default([], true) | tojson }},
                {{ jobs['secret-scan'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true
