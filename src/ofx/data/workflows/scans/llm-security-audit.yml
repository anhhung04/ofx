name: llm-security-audit
description: |
  LLM/AI security assessment — test language models for prompt injection,
  jailbreaks, data extraction, and adversarial inputs using garak.
tags: [llm, ai, security, audit]
dispatch:
  inputs:
    model_type:
      required: true
      type: string
      description: Model type (openai, huggingface, ollama, rest)
    model_name:
      required: true
      type: string
      description: Model name (e.g. gpt-4, llama2, etc.)
    probes:
      type: string
      default: ""
      description: Comma-separated probe names (default all)

jobs:
  garak-scan:
    name: Garak LLM Security Scan
    outputs:
      finding_count: '{{ steps["garak-test"].outputs.finding_count | default("", true) }}'
      typed_outputs: '{{ steps["garak-test"].outputs.typed_outputs | default([], true) }}'
    steps:
      - task: garak
        log-command: true
        name: garak-test
        with:
          target: "{{ inputs.model_name }}"
          model_type: "{{ inputs.model_type }}"
          model_name: "{{ inputs.model_name }}"
          probes: '{{ inputs.probes or "" }}'
        continue-on-error: true

  summary:
    name: LLM Security Audit Summary
    needs: [garak-scan]
    steps:
      - name: report
        script: |
          finding_count = '{{ jobs["garak-scan"].outputs.finding_count | default("0", true) }}'

          print("=" * 56)
          print(" LLM SECURITY AUDIT COMPLETE")
          print("=" * 56)
          print()
          print(f"  Model type: {{ inputs.model_type }}")
          print(f"  Model name: {{ inputs.model_name }}")
          if '{{ inputs.probes }}':
              print(f"  Probes:     {{ inputs.probes }}")
          else:
              print("  Probes:     all (default)")
          print()
          print("--- Garak Results ---")
          print(f"  Vulnerabilities found: {finding_count}")
        log-stdout: true
