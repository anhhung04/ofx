name: port-blitz
description:
  "Fast multi-engine port scanning — chains rustscan (speed), naabu (accuracy), and masscan (breadth) then feeds discovered ports into nmap for service fingerprinting and exploit lookup.

  "
tags:
  - recon
  - port
  - scan
  - network
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target IP, CIDR, or hostname
      alias: t
    rate:
      type: string
      default: "3000"
      description: Scan rate (packets/sec)
jobs:
  fast-scan:
    name: Fast Port Discovery
    outputs:
      hosts_file: '{{ steps["merge-ports"].outputs.hosts_file | default("", true) }}'
      merged_ports: '{{ steps["merge-ports"].outputs.merged_ports | default("", true) }}'
      host_count: '{{ steps["merge-ports"].outputs.host_count | default("", true) }}'
      port_count: '{{ steps["merge-ports"].outputs.port_count | default("", true) }}'
    steps:
      - task: rustscan
        log-command: true
        name: rustscan-sweep
        timeout: 10
        with:
          target: "{{ inputs.target }}"
          range: 1-65535
          batch_size: 4500
          timeout: 3000
        continue-on-error: true
      - task: naabu
        log-command: true
        timeout: 10
        name: naabu-top
        with:
          target: "{{ inputs.target }}"
          top_ports: "1000"
          rate: "{{ inputs.rate }}"
        continue-on-error: true
      - task: masscan
        log-command: true
        timeout: 10
        name: masscan-top
        with:
          target: "{{ inputs.target }}"
          ports: 0-1024,1433,1521,3306,3389,5432,5900,6379,8080,8443,9090,9200,11211,27017
          rate: "{{ inputs.rate }}"
        continue-on-error: true
      - name: merge-ports
        script: |
          ports_by_host = {}

          # Merge from rustscan
          for item in {{ ports(steps["rustscan-sweep"].outputs.typed_outputs) | tojson }}:
              host = item.get('host') or item.get('ip', '')
              port = str(item.get('port', ''))
              if host and port:
                  ports_by_host.setdefault(host, set()).add(port)

          # Merge from naabu
          for item in {{ ports(steps["naabu-top"].outputs.typed_outputs) | tojson }}:
              host = item.get('host') or item.get('ip', '')
              port = str(item.get('port', ''))
              if host and port:
                  ports_by_host.setdefault(host, set()).add(port)

          # Merge from masscan
          for item in {{ ports(steps["masscan-top"].outputs.typed_outputs) | tojson }}:
              host = item.get('host') or item.get('ip', '')
              port = str(item.get('port', ''))
              if host and port:
                  ports_by_host.setdefault(host, set()).add(port)

          all_hosts = sorted(ports_by_host.keys())
          all_ports = set()
          for p_set in ports_by_host.values():
              all_ports.update(p_set)

          port_csv = ','.join(sorted(all_ports, key=int))

          with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_portblitz_hosts.txt', 'w') as tf:
              tf.write('\n'.join(all_hosts))

          add_outputs(hosts_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_portblitz_hosts.txt", merged_ports=port_csv, host_count=len(all_hosts), port_count=len(all_ports))
          print(f"Merged {len(all_ports)} unique ports across {len(all_hosts)} hosts")
  service-detect:
    name: Service Fingerprinting
    needs:
      - fast-scan
    outputs:
      service_count: '{{ steps["collect-services"].outputs.service_count | default("", true) }}'
      live_urls_file: '{{ steps["collect-services"].outputs.live_urls_file | default("", true) }}'
      http_count: '{{ steps["collect-services"].outputs.http_count | default("", true) }}'
      vuln_count: '{{ steps["collect-services"].outputs.vuln_count | default("", true) }}'
      exploit_count: '{{ steps["collect-services"].outputs.exploit_count | default("", true) }}'
    steps:
      - task: nerva
        log-command: true
        timeout: 15
        name: nerva-fingerprint
        with:
          target: "{{ jobs['fast-scan'].outputs.hosts_file | default(inputs.target, true) }}"
        continue-on-error: true
      - task: nmap
        log-command: true
        timeout: 30
        name: nmap-version
        with:
          target: "{{ inputs.target }}"
          ports: "{{ jobs['fast-scan'].outputs.merged_ports }}"
          version_detection: true
        continue-on-error: true
      - task: httpx
        log-command: true
        timeout: 10
        name: http-probe
        with:
          target: "{{ jobs['fast-scan'].outputs.hosts_file | default(inputs.target, true) }}"
          tech_detect: true
          status_code: true
          title: true
          follow_redirects: true
        continue-on-error: true
      - task: ssh-audit
        log-command: true
        timeout: 10
        name: ssh-check
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      - task: searchsploit
        log-command: true
        timeout: 5
        name: exploit-lookup
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      - name: collect-services
        script: |
          nmap_ports = {{ ports(steps["nmap-version"].outputs.typed_outputs) | tojson }}
          nerva_ports = {{ ports(steps["nerva-fingerprint"].outputs.typed_outputs) | tojson }}
          nmap_vulns = {{ vulns(steps["nmap-version"].outputs.typed_outputs) | tojson }}
          http_urls = {{ urls(steps["http-probe"].outputs.typed_outputs) | tojson }}
          exploits = {{ steps["exploit-lookup"].outputs.typed_outputs | tojson }}

          services = []
          seen = set()
          for p in nmap_ports + nerva_ports:
              svc = p.get('service_name', 'unknown')
              port = p.get('port', '?')
              host = p.get('host') or p.get('ip', '?')
              key = f"{host}:{port}"
              if key not in seen:
                  services.append(f"{key}/{svc}")
                  seen.add(key)

          live_urls = [u['url'] for u in http_urls if u.get('url')]

          with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_portblitz_urls.txt', 'w') as tf:
              tf.write('\n'.join(live_urls))

          add_outputs(service_count=len(services), live_urls_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_portblitz_urls.txt", http_count=len(live_urls), vuln_count=len(nmap_vulns), exploit_count=len(exploits))
          print(f"Services: {len(services)}, HTTP: {len(live_urls)}, Vulns: {len(nmap_vulns)}, Exploits: {len(exploits)}")
  summary:
    name: Port Blitz Summary
    needs:
      - service-detect
    steps:
      - name: report
        run: |
          echo "======================================================"
          echo " PORT BLITZ COMPLETE: {{ inputs.target }}"
          echo "======================================================"
          echo ""
          echo "--- Discovery (3 engines) ---"
          echo "Unique hosts: {{ jobs['fast-scan'].outputs.host_count }}"
          echo "Unique ports: {{ jobs['fast-scan'].outputs.port_count }}"
          echo "Merged port list: {{ jobs['fast-scan'].outputs.merged_ports }}"
          echo ""
          echo "--- Fingerprinting ---"
          echo "Services identified: {{ jobs['service-detect'].outputs.service_count }}"
          echo "HTTP services: {{ jobs['service-detect'].outputs.http_count }}"
          echo "Known vulnerabilities: {{ jobs['service-detect'].outputs.vuln_count }}"
          echo "Known exploits: {{ jobs['service-detect'].outputs.exploit_count }}"
        log-stdout: true
      - name: export-to-project
        script: |
          import shutil
          from pathlib import Path

          project = '{{ vars.project_path | default("", true) }}'
          if not project:
              print('No --project set, skipping file export')
          else:

              # merged port list
              d = '{{ vars.project_hosts }}'
              Path(d).mkdir(parents=True, exist_ok=True)
              data = '''{{ jobs['fast-scan'].outputs.merged_ports | default('', true) }}'''.strip()
              if data:
                  (Path(d) / 'ports.txt').write_text(data)
                  print(f'  [+] hosts/ports.txt ({len(data.splitlines())} lines)')

              # target hosts
              d = '{{ vars.project_hosts }}'
              Path(d).mkdir(parents=True, exist_ok=True)
              src = '''{{ jobs['fast-scan'].outputs.hosts_file | default('', true) }}'''
              if src and Path(src).is_file():
                  shutil.copy2(src, Path(d) / 'hosts.txt')
                  print('  [+] hosts/hosts.txt')

              # HTTP services
              d = '{{ vars.project_web }}'
              Path(d).mkdir(parents=True, exist_ok=True)
              src = '''{{ jobs['service-detect'].outputs.live_urls_file | default('', true) }}'''
              if src and Path(src).is_file():
                  shutil.copy2(src, Path(d) / 'http-urls.txt')
                  print('  [+] web/http-urls.txt')

              # Auto-export typed outputs
              all_typed = []
              for typed in [
                  {{ jobs['fast-scan'].outputs.typed_outputs | default([], true) | tojson }},
                  {{ jobs['service-detect'].outputs.typed_outputs | default([], true) | tojson }},
              ]:
                  all_typed.extend(typed)
              summaries = export_typed_outputs(project, all_typed)
              for s in summaries:
                  print(s)

              print(f'Project export complete: {project}')
        continue-on-error: true
