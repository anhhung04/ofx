name: port-blitz
description: 'Fast multi-engine port scanning — chains rustscan (speed), naabu (accuracy), and masscan (breadth) then feeds
  discovered ports into nmap for service fingerprinting and exploit lookup.

  '
tags:
- recon
- port
- scan
- network
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target IP, CIDR, or hostname
    rate:
      type: string
      default: '3000'
      description: Scan rate (packets/sec)
jobs:
  fast-scan:
    name: Fast Port Discovery
    steps:
    - task: rustscan
      name: rustscan-sweep
      with:
        target: '{{ inputs.target }}'
        range: 1-65535
        batch_size: 4500
        timeout: 3000
      log-stdout: true
      continue-on-error: true
    - task: naabu
      name: naabu-top
      with:
        target: '{{ inputs.target }}'
        top_ports: '1000'
        rate: '{{ inputs.rate }}'
      log-stdout: true
      continue-on-error: true
    - task: masscan
      name: masscan-top
      with:
        target: '{{ inputs.target }}'
        ports: 0-1024,1433,1521,3306,3389,5432,5900,6379,8080,8443,9090,9200,11211,27017
        rate: '{{ inputs.rate }}'
      log-stdout: true
      continue-on-error: true
    - name: merge-ports
      script: "ports_by_host = {}\n\n# Merge from rustscan\nfor item in {{ ports(steps[0].outputs.typed_outputs) | tojson\
        \ }}:\n    host = item.get('host') or item.get('ip', '')\n    port = str(item.get('port', ''))\n    if host and port:\n\
        \        ports_by_host.setdefault(host, set()).add(port)\n\n# Merge from naabu\nfor item in {{ ports(steps[1].outputs.typed_outputs)\
        \ | tojson }}:\n    host = item.get('host') or item.get('ip', '')\n    port = str(item.get('port', ''))\n    if host\
        \ and port:\n        ports_by_host.setdefault(host, set()).add(port)\n\n# Merge from masscan\nfor item in {{ ports(steps[2].outputs.typed_outputs)\
        \ | tojson }}:\n    host = item.get('host') or item.get('ip', '')\n    port = str(item.get('port', ''))\n    if host\
        \ and port:\n        ports_by_host.setdefault(host, set()).add(port)\n\nall_hosts = sorted(ports_by_host.keys())\n\
        all_ports = set()\nfor p_set in ports_by_host.values():\n    all_ports.update(p_set)\n\nport_csv = ','.join(sorted(all_ports,\
        \ key=int))\nhost_list = '\\n'.join(all_hosts)\n\nwith open('{{ env.OFX_OUTPUTS }}', 'a') as f:\n    f.write(f\"merged_hosts={host_list}\\\
        n\")\n    f.write(f\"merged_ports={port_csv}\\n\")\n    f.write(f\"host_count={len(all_hosts)}\\n\")\n    f.write(f\"\
        port_count={len(all_ports)}\\n\")\n\nprint(f\"Merged {len(all_ports)} unique ports across {len(all_hosts)} hosts\"\
        )\n"
  service-detect:
    name: Service Fingerprinting
    needs:
    - fast-scan
    steps:
    - task: nmap
      name: nmap-version
      with:
        target: '{{ inputs.target }}'
        ports: '{{ jobs[''fast-scan''].outputs.merged_ports }}'
        version_detection: true
      log-stdout: true
      continue-on-error: true
    - task: httpx
      name: http-probe
      with:
        target: '{{ jobs[''fast-scan''].outputs.merged_hosts | default(inputs.target, true) }}'
        tech_detect: true
        status_code: true
        title: true
        follow_redirects: true
      log-stdout: true
      continue-on-error: true
    - task: ssh-audit
      name: ssh-check
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - task: searchsploit
      name: exploit-lookup
      with:
        target: '{{ inputs.target }}'
      log-stdout: true
      continue-on-error: true
    - name: collect-services
      script: "nmap_ports = {{ ports(steps[0].outputs.typed_outputs) | tojson }}\nnmap_vulns = {{ vulns(steps[0].outputs.typed_outputs)\
        \ | tojson }}\nhttp_urls = {{ urls(steps[1].outputs.typed_outputs) | tojson }}\nexploits = {{ steps[3].outputs.typed_outputs\
        \ | tojson }}\n\nservices = []\nfor p in nmap_ports:\n    svc = p.get('service_name', 'unknown')\n    port = p.get('port',\
        \ '?')\n    host = p.get('host') or p.get('ip', '?')\n    services.append(f\"{host}:{port}/{svc}\")\n\nlive_urls =\
        \ [u['url'] for u in http_urls if u.get('url')]\n\nwith open('{{ env.OFX_OUTPUTS }}', 'a') as f:\n    f.write(f\"\
        service_count={len(services)}\\n\")\n    f.write(f\"live_urls={chr(10).join(live_urls)}\\n\")\n    f.write(f\"http_count={len(live_urls)}\\\
        n\")\n    f.write(f\"vuln_count={len(nmap_vulns)}\\n\")\n    f.write(f\"exploit_count={len(exploits)}\\n\")\n\nprint(f\"\
        Services: {len(services)}, HTTP: {len(live_urls)}, Vulns: {len(nmap_vulns)}, Exploits: {len(exploits)}\")\n"
      log-stdout: true
  summary:
    name: Port Blitz Summary
    needs:
    - service-detect
    steps:
    - name: report
      run: 'echo "======================================================"

        echo " PORT BLITZ COMPLETE: {{ inputs.target }}"

        echo "======================================================"

        echo ""

        echo "--- Discovery (3 engines) ---"

        echo "Unique hosts: {{ jobs[''fast-scan''].outputs.host_count }}"

        echo "Unique ports: {{ jobs[''fast-scan''].outputs.port_count }}"

        echo "Merged port list: {{ jobs[''fast-scan''].outputs.merged_ports }}"

        echo ""

        echo "--- Fingerprinting ---"

        echo "Services identified: {{ jobs[''service-detect''].outputs.service_count }}"

        echo "HTTP services: {{ jobs[''service-detect''].outputs.http_count }}"

        echo "Known vulnerabilities: {{ jobs[''service-detect''].outputs.vuln_count }}"

        echo "Known exploits: {{ jobs[''service-detect''].outputs.exploit_count }}"

        '
      log-stdout: true
    - name: export-to-project
      script: "import json, os\nfrom pathlib import Path\n\nproject = '{{ vars.project_path | default(\"\", true) }}'\nif\
        \ not project:\n    print('No --project set, skipping file export')\nelse:\n    p = Path(project)\n\n    # merged\
        \ port list\n    d = p / 'scans'\n    d.mkdir(parents=True, exist_ok=True)\n    data = '''{{ jobs['fast-scan'].outputs.merged_ports\
        \ | default('', true) }}'''.strip()\n    if data:\n        (d / 'ports.txt').write_text(data)\n        print(f'  [+]\
        \ scans/ports.txt ({len(data.splitlines())} lines)')\n\n    # target hosts\n    d = p / 'scans'\n    d.mkdir(parents=True,\
        \ exist_ok=True)\n    data = '''{{ jobs['fast-scan'].outputs.merged_hosts | default('', true) }}'''.strip()\n    if\
        \ data:\n        (d / 'hosts.txt').write_text(data)\n        print(f'  [+] scans/hosts.txt ({len(data.splitlines())}\
        \ lines)')\n\n    # HTTP services\n    d = p / 'scans'\n    d.mkdir(parents=True, exist_ok=True)\n    data = '''{{\
        \ jobs['service-detect'].outputs.live_urls | default('', true) }}'''.strip()\n    if data:\n        (d / 'http-urls.txt').write_text(data)\n\
        \        print(f'  [+] scans/http-urls.txt ({len(data.splitlines())} lines)')\n\n    print(f'Project export complete:\
        \ {project}')"
      continue-on-error: true
