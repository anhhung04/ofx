# yaml-language-server: $schema=~/.ofx/workflow_schema.json
name: takeover-scan
description: |
  Subdomain takeover scanning — discovers subdomains and checks for dangling DNS records that can be claimed by attackers.
tags:
- scan
- takeover
- subdomain
- dns
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target domain (e.g. example.com)
      alias: t
jobs:
  subdomain-enum:
    name: Subdomain Enumeration
    outputs:
      subs_file: '{{ steps["merge-subdomains"].outputs.subs_file }}'
      sub_count: '{{ steps["merge-subdomains"].outputs.sub_count }}'
    steps:
    - task: subfinder
      timeout: 10
      name: subfinder-scan
      with:
        target: '{{ inputs.target }}'
        all: true
      continue-on-error: true
    - name: amass-passive
      run: |
        amass enum -passive -d {{ inputs.target }} 2>/dev/null | tee /tmp/amass-subs.txt
      continue-on-error: true
    - name: merge-subdomains
      script: |
        subs = set()
        subs.add('{{ inputs.target }}')

        # From subfinder
        sf_outputs = {{ steps["subfinder-scan"].outputs.typed_outputs | tojson }}
        for item in sf_outputs:
            if item.get('_type') == 'subdomain':
                subs.add(item['host'])

        # From amass
        try:
            with open('/tmp/amass-subs.txt') as f:
                for line in f:
                    sub = line.strip()
                    if sub and '{{ inputs.target }}' in sub:
                        subs.add(sub)
        except FileNotFoundError:
            pass

        with open('/tmp/ofx_takeover_subs.txt', 'w') as f:
            f.write('\n'.join(sorted(subs)))
        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"subs_file=/tmp/ofx_takeover_subs.txt\n")
            f.write(f"sub_count={len(subs)}\n")

        print(f"Collected {len(subs)} unique subdomains")
  dns-verify:
    name: DNS Resolution & CNAME Check
    needs:
    - subdomain-enum
    outputs:
      alive_file: '{{ steps["collect-dns"].outputs.alive_file }}'
      alive_count: '{{ steps["collect-dns"].outputs.alive_count }}'
      cname_count: '{{ steps["collect-dns"].outputs.cname_count }}'
    steps:
    - task: dnsx
      timeout: 10
      name: resolve-dns
      with:
        target: "{{ jobs['subdomain-enum'].outputs.subs_file }}"
        a: true
        cname: true
        resp: true
      continue-on-error: true
    - name: collect-dns
      script: |
        alive = set()
        cname_records = {}

        dnsx_out = {{ steps["resolve-dns"].outputs.typed_outputs | tojson }}
        for item in dnsx_out:
            host = item.get('host', '')
            if host:
                alive.add(host)
            cname = item.get('cname', '')
            if host and cname:
                cname_records[host] = cname

        with open('/tmp/ofx_takeover_alive.txt', 'w') as f:
            f.write('\n'.join(sorted(alive)))
        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"alive_file=/tmp/ofx_takeover_alive.txt\n")
            f.write(f"alive_count={len(alive)}\n")
            f.write(f"cname_count={len(cname_records)}\n")

        print(f"Alive: {len(alive)}, CNAME records: {len(cname_records)}")
  takeover-check:
    name: Takeover Detection
    needs:
    - dns-verify
    outputs:
      takeover_count: '{{ steps["collect-takeovers"].outputs.takeover_count }}'
      takeover_findings_file: '{{ steps["collect-takeovers"].outputs.takeover_findings_file }}'
    steps:
    - name: subzy-scan
      run: |
        cat {{ jobs['dns-verify'].outputs.alive_file }} > /tmp/takeover-targets.txt
        subzy run --targets /tmp/takeover-targets.txt 2>/dev/null | tee /tmp/subzy-output.txt
      continue-on-error: true
    - task: nuclei
      timeout: 20
      name: nuclei-takeover
      with:
        target: "{{ jobs['dns-verify'].outputs.alive_file }}"
        tags: takeover
      continue-on-error: true
    - name: collect-takeovers
      script: |
        import re

        takeovers = []

        # Parse subzy results
        try:
            with open('/tmp/subzy-output.txt') as f:
                for line in f:
                    if 'VULNERABLE' in line.upper() or '[+]' in line:
                        takeovers.append(line.strip())
        except FileNotFoundError:
            pass

        # Parse nuclei takeover results
        nuclei_vulns = {{ vulns(steps["nuclei-takeover"].outputs.typed_outputs) | tojson }}
        for v in nuclei_vulns:
            name = v.get('name', v.get('template_id', 'unknown'))
            host = v.get('host', v.get('matched_at', ''))
            takeovers.append(f"[nuclei] {name}: {host}")

        with open('/tmp/ofx_takeover_findings.txt', 'w') as f:
            f.write('\n'.join(takeovers))
        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"takeover_count={len(takeovers)}\n")
            f.write(f"takeover_findings_file=/tmp/ofx_takeover_findings.txt\n")

        print(f"Takeover vulnerabilities: {len(takeovers)}")
        for t in takeovers:
            print(f"  [!] {t}")
  summary:
    name: Takeover Scan Summary
    needs:
    - takeover-check
    steps:
    - name: report
      run: |
        echo "======================================================"
        echo " SUBDOMAIN TAKEOVER SCAN COMPLETE: {{ inputs.target }}"
        echo "======================================================"
        echo ""
        echo "--- Enumeration ---"
        echo "Subdomains discovered: {{ jobs['subdomain-enum'].outputs.sub_count }}"
        echo "DNS verified (alive): {{ jobs['dns-verify'].outputs.alive_count }}"
        echo "CNAME records: {{ jobs['dns-verify'].outputs.cname_count }}"
        echo ""
        echo "--- Takeover Results ---"
        echo "Vulnerable subdomains: {{ jobs['takeover-check'].outputs.takeover_count }}"
      log-stdout: true

    - name: export-to-project
      script: |
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:
            all_typed = []
            for typed in [
            {{ jobs['subdomain-enum'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['dns-verify'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['takeover-check'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true