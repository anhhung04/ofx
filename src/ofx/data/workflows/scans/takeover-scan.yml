# yaml-language-server: $schema=~/.ofx/workflow_schema.json
name: takeover-scan
description: 'Subdomain takeover scanning — discovers subdomains and checks for dangling
  DNS records that can be claimed by attackers.

  '
tags:
- scan
- takeover
- subdomain
- dns
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target domain (e.g. example.com)
jobs:
  subdomain-enum:
    name: Subdomain Enumeration
    steps:
    - task: subfinder
      name: subfinder-scan
      with:
        target: '{{ inputs.target }}'
        all: true
      log-stdout: true
    - name: amass-passive
      run: 'amass enum -passive -d {{ inputs.target }} 2>/dev/null | tee /tmp/amass-subs.txt

        '
      continue-on-error: true
    - name: merge-subdomains
      script: "subs = set()\nsubs.add('{{ inputs.target }}')\n\n# From subfinder\n\
        sf_outputs = {{ steps[0].outputs.typed_outputs | tojson }}\nfor item in sf_outputs:\n\
        \    if item.get('_type') == 'subdomain':\n        subs.add(item['host'])\n\
        \n# From amass\ntry:\n    with open('/tmp/amass-subs.txt') as f:\n       \
        \ for line in f:\n            sub = line.strip()\n            if sub and '{{\
        \ inputs.target }}' in sub:\n                subs.add(sub)\nexcept FileNotFoundError:\n\
        \    pass\n\nwith open('{{ env.OFX_OUTPUTS }}', 'a') as f:\n    f.write(f\"\
        all_subs={chr(10).join(sorted(subs))}\\n\")\n    f.write(f\"sub_count={len(subs)}\\\
        n\")\n\nprint(f\"Collected {len(subs)} unique subdomains\")\n"
  dns-verify:
    name: DNS Resolution & CNAME Check
    needs:
    - subdomain-enum
    steps:
    - task: dnsx
      name: resolve-dns
      with:
        target: '{{ jobs[''subdomain-enum''].outputs.all_subs }}'
        a: true
        cname: true
        resp: true
      log-stdout: true
    - name: collect-dns
      script: "alive = set()\ncname_records = {}\n\ndnsx_out = {{ steps[0].outputs.typed_outputs\
        \ | tojson }}\nfor item in dnsx_out:\n    host = item.get('host', '')\n  \
        \  if host:\n        alive.add(host)\n    cname = item.get('cname', '')\n\
        \    if host and cname:\n        cname_records[host] = cname\n\nwith open('{{\
        \ env.OFX_OUTPUTS }}', 'a') as f:\n    f.write(f\"alive_subs={chr(10).join(sorted(alive))}\\\
        n\")\n    f.write(f\"alive_count={len(alive)}\\n\")\n    f.write(f\"cname_count={len(cname_records)}\\\
        n\")\n\nprint(f\"Alive: {len(alive)}, CNAME records: {len(cname_records)}\"\
        )\n"
  takeover-check:
    name: Takeover Detection
    needs:
    - dns-verify
    steps:
    - name: subzy-scan
      run: 'echo "{{ jobs[''dns-verify''].outputs.alive_subs }}" > /tmp/takeover-targets.txt

        subzy run --targets /tmp/takeover-targets.txt 2>/dev/null | tee /tmp/subzy-output.txt

        '
      continue-on-error: true
    - task: nuclei
      name: nuclei-takeover
      with:
        target: '{{ jobs[''dns-verify''].outputs.alive_subs }}'
        tags: takeover
      continue-on-error: true
      log-stdout: true
    - name: collect-takeovers
      script: "import re\n\ntakeovers = []\n\n# Parse subzy results\ntry:\n    with\
        \ open('/tmp/subzy-output.txt') as f:\n        for line in f:\n          \
        \  if 'VULNERABLE' in line.upper() or '[+]' in line:\n                takeovers.append(line.strip())\n\
        except FileNotFoundError:\n    pass\n\n# Parse nuclei takeover results\nnuclei_vulns\
        \ = {{ vulns(steps[1].outputs.typed_outputs) | tojson }}\nfor v in nuclei_vulns:\n\
        \    name = v.get('name', v.get('template_id', 'unknown'))\n    host = v.get('host',\
        \ v.get('matched_at', ''))\n    takeovers.append(f\"[nuclei] {name}: {host}\"\
        )\n\nwith open('{{ env.OFX_OUTPUTS }}', 'a') as f:\n    f.write(f\"takeover_count={len(takeovers)}\\\
        n\")\n    f.write(f\"takeover_findings={chr(10).join(takeovers)}\\n\")\n\n\
        print(f\"Takeover vulnerabilities: {len(takeovers)}\")\nfor t in takeovers:\n\
        \    print(f\"  [!] {t}\")\n"
  summary:
    name: Takeover Scan Summary
    needs:
    - takeover-check
    steps:
    - name: report
      run: 'echo "======================================================"

        echo " SUBDOMAIN TAKEOVER SCAN COMPLETE: {{ inputs.target }}"

        echo "======================================================"

        echo ""

        echo "--- Enumeration ---"

        echo "Subdomains discovered: {{ jobs[''subdomain-enum''].outputs.sub_count
        }}"

        echo "DNS verified (alive): {{ jobs[''dns-verify''].outputs.alive_count }}"

        echo "CNAME records: {{ jobs[''dns-verify''].outputs.cname_count }}"

        echo ""

        echo "--- Takeover Results ---"

        echo "Vulnerable subdomains: {{ jobs[''takeover-check''].outputs.takeover_count
        }}"

        '
      log-stdout: true
