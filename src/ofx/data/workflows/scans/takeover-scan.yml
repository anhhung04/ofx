name: takeover-scan
description: |
  Subdomain takeover scanning — discovers subdomains and checks for dangling DNS records that can be claimed by attackers.
tags:
- scan
- takeover
- subdomain
- dns
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Target domain (e.g. example.com)
      alias: t
jobs:
  subdomain-enum:
    name: Subdomain Enumeration
    outputs:
      subs_file: '{{ steps["merge-subdomains"].outputs.subs_file | default("", true) }}'
      sub_count: '{{ steps["merge-subdomains"].outputs.sub_count | default("", true) }}'
    steps:
    - task: subfinder
      log-command: "{{ inputs.log_command | default(true) }}"
      name: subfinder-scan
      with:
        target: '{{ inputs.target }}'
        all: true
      continue-on-error: true
    - task: amass
      log-command: "{{ inputs.log_command | default(true) }}"
      name: amass-passive
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: merge-subdomains
      script: |
        subs = set()
        subs.add('{{ inputs.target }}')

        # From subfinder
        sf_outputs = {{ steps["subfinder-scan"].outputs.typed_outputs | tojson }}
        for item in sf_outputs:
            if item.get('_type') == 'subdomain':
                subs.add(item['host'])

        # From amass
        for item in {{ subdomains(steps["amass-passive"].outputs.typed_outputs) | default([], true) | tojson }}:
            host = item.get('host', '')
            if host and '{{ inputs.target }}' in host:
                subs.add(host)

        with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_takeover_subs.txt', 'w') as f:
            f.write('\n'.join(sorted(subs)))
        add_outputs(subs_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_takeover_subs.txt", sub_count=len(subs))
        print(f"Collected {len(subs)} unique subdomains")
  dns-verify:
    name: DNS Resolution & CNAME Check
    needs:
    - subdomain-enum
    outputs:
      alive_file: '{{ steps["collect-dns"].outputs.alive_file | default("", true) }}'
      alive_count: '{{ steps["collect-dns"].outputs.alive_count | default("", true) }}'
      cname_count: '{{ steps["collect-dns"].outputs.cname_count | default("", true) }}'
    steps:
    - task: dnsx
      log-command: "{{ inputs.log_command | default(true) }}"
      name: resolve-dns
      with:
        target: "{{ jobs['subdomain-enum'].outputs.subs_file }}"
        a: true
        cname: true
        resp: true
      continue-on-error: true
    - name: collect-dns
      script: |
        alive = set()
        cname_records = {}

        dnsx_out = {{ steps["resolve-dns"].outputs.typed_outputs | tojson }}
        for item in dnsx_out:
            host = item.get('host', '')
            if host:
                alive.add(host)
            cname = item.get('cname', '')
            if host and cname:
                cname_records[host] = cname

        with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_takeover_alive.txt', 'w') as f:
            f.write('\n'.join(sorted(alive)))
        add_outputs(alive_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_takeover_alive.txt", alive_count=len(alive), cname_count=len(cname_records))
        print(f"Alive: {len(alive)}, CNAME records: {len(cname_records)}")
  takeover-check:
    name: Takeover Detection
    needs:
    - dns-verify
    outputs:
      takeover_count: '{{ steps["collect-takeovers"].outputs.takeover_count | default("", true) }}'
      takeover_findings_file: '{{ steps["collect-takeovers"].outputs.takeover_findings_file | default("", true) }}'
    steps:
    - task: subzy
      log-command: "{{ inputs.log_command | default(true) }}"
      name: subzy-scan
      with:
        target: "{{ jobs['dns-verify'].outputs.alive_file }}"
      continue-on-error: true
    - task: nuclei
      log-command: "{{ inputs.log_command | default(true) }}"
      name: nuclei-takeover
      with:
        target: "{{ jobs['dns-verify'].outputs.alive_file }}"
        tags: subdomain-takeover
      continue-on-error: true
    - name: collect-takeovers
      script: |
        takeovers = []

        # Parse subzy results from typed_outputs
        subzy_out = {{ steps["subzy-scan"].outputs.typed_outputs | default([], true) | tojson }}
        for item in subzy_out:
            t = item.get('_type', '')
            if t == 'vulnerability':
                host = item.get('host', item.get('matched_at', ''))
                name = item.get('name', 'takeover')
                takeovers.append(f"[subzy] {name}: {host}")
            elif t == 'subdomain' and item.get('vulnerable'):
                takeovers.append(f"[subzy] {item.get('host', 'unknown')}")

        # Parse nuclei takeover results
        nuclei_vulns = {{ vulns(steps["nuclei-takeover"].outputs.typed_outputs) | tojson }}
        for v in nuclei_vulns:
            name = v.get('name', v.get('template_id', 'unknown'))
            host = v.get('host', v.get('matched_at', ''))
            takeovers.append(f"[nuclei] {name}: {host}")

        with open(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_takeover_findings.txt', 'w') as f:
            f.write('\n'.join(takeovers))
        add_outputs(takeover_count=len(takeovers), takeover_findings_file=f"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_takeover_findings.txt")
        print(f"Takeover vulnerabilities: {len(takeovers)}")
        for t in takeovers:
            print(f"  [!] {t}")
  summary:
    name: Takeover Scan Summary
    needs:
    - takeover-check
    steps:
    - name: report
      run: |
        echo "======================================================"
        echo " SUBDOMAIN TAKEOVER SCAN COMPLETE: {{ inputs.target }}"
        echo "======================================================"
        echo ""
        echo "--- Enumeration ---"
        echo "Subdomains discovered: {{ jobs['subdomain-enum'].outputs.sub_count }}"
        echo "DNS verified (alive): {{ jobs['dns-verify'].outputs.alive_count }}"
        echo "CNAME records: {{ jobs['dns-verify'].outputs.cname_count }}"
        echo ""
        echo "--- Takeover Results ---"
        echo "Vulnerable subdomains: {{ jobs['takeover-check'].outputs.takeover_count }}"
      log-stdout: "{{ inputs.log_output | default(true) }}"

    - name: export-to-project
      script: |
        from pathlib import Path

        project = '{{ vars.project_path | default("", true) }}'
        if not project:
            print('No --project set, skipping file export')
        else:
            all_typed = []
            for typed in [
            {{ jobs['subdomain-enum'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['dns-verify'].outputs.typed_outputs | default([], true) | tojson }},
            {{ jobs['takeover-check'].outputs.typed_outputs | default([], true) | tojson }},
            ]:
                all_typed.extend(typed)
            summaries = export_typed_outputs(project, all_typed)
            for s in summaries:
                print(s)

            print(f'Project export complete: {project}')
      continue-on-error: true