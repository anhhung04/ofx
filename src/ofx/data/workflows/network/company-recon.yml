name: company-recon
description: >
  Company OSINT reconnaissance — discover employees, email patterns,

  technologies, social media, leaked credentials, and infrastructure

  associated with an organization.
tags:
- osint
- company
- recon
- email
- social
dispatch:
  inputs:
    log_command:
      type: string
      default: 'true'
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: 'true'
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Company name or primary domain
      alias: t
    domain:
      type: string
      default: ''
      description: Company email domain (auto-detected if empty)
defaults:
  store-creds: true
jobs:
  domain-intel:
    name: Domain Intelligence
    steps:
    - task: whois
      log-command: '{{ inputs.log_command | default(true) }}'
      name: whois-lookup
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - task: subfinder
      log-command: '{{ inputs.log_command | default(true) }}'
      name: subdomain-enum
      with:
        target: '{{ inputs.domain or inputs.target }}'
        all: true
      continue-on-error: true
    - task: dnsx
      log-command: '{{ inputs.log_command | default(true) }}'
      name: dns-records
      with:
        target: '{{ inputs.domain or inputs.target }}'
        a: true
        cname: true
        mx: true
        txt: true
        ns: true
        resp: true
      continue-on-error: true
  email-harvest:
    name: Email Harvesting
    outputs:
      emails_file: '{{ steps["collect-emails"].outputs.emails_file | default("", true) }}'
      email_count: '{{ steps["collect-emails"].outputs.email_count | default("", true) }}'
    steps:
    - task: theharvester
      log-command: '{{ inputs.log_command | default(true) }}'
      name: theharvester-scan
      with:
        target: '{{ inputs.domain or inputs.target }}'
        source: all
        limit: 500
      continue-on-error: true
    - task: holehe
      log-command: '{{ inputs.log_command | default(true) }}'
      name: email-existence
      with:
        target: '{{ inputs.domain or inputs.target }}'
      continue-on-error: true
    - name: collect-emails
      script: "emails = set()\nstep_data = {{ steps | tojson }}\nfor idx in range(2):\n    typed = step_data.get(idx, {}).get('outputs', {}).get('typed_outputs', [])\n    for item in typed:\n        email\
        \ = item.get('email', item.get('username', ''))\n        if '@' in str(email):\n            emails.add(email.lower())\n\nfrom pathlib import Path\nout = f'{\"{{ env.OFX_RUN_DIR | default('/tmp',\
        \ true) }}\"}/ofx_company_emails.txt'\nPath(out).write_text('\\n'.join(sorted(emails)) + '\\n')\n\nadd_outputs(emails_file=out, email_count=len(emails))\nprint(f\"[+] Collected {len(emails)} emails\"\
        )\nfor e in sorted(emails)[:20]:\n    print(f\"    {e}\")\n"
  tech-detection:
    name: Technology Stack Detection
    needs:
    - domain-intel
    steps:
    - task: httpx
      log-command: '{{ inputs.log_command | default(true) }}'
      name: http-tech
      with:
        target: '{{ inputs.domain or inputs.target }}'
        tech_detect: true
        status_code: true
        title: true
        follow_redirects: true
      continue-on-error: true
    - task: wafw00f
      log-command: '{{ inputs.log_command | default(true) }}'
      name: waf-detect
      with:
        target: '{{ inputs.domain or inputs.target }}'
      continue-on-error: true
  breach-search:
    name: Breach Database Search
    outputs:
      typed_outputs: '{{ steps["breach-lookup"].outputs.typed_outputs | default([], true) }}'
    steps:
    - task: h8mail
      log-command: '{{ inputs.log_command | default(true) }}'
      name: breach-lookup
      with:
        target: '{{ inputs.domain or inputs.target }}'
      continue-on-error: true
