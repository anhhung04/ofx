name: takeover-scan
description: >
  Subdomain takeover scanning — discovers subdomains and checks for dangling DNS records that can be claimed by attackers.
tags:
- scan
- takeover
- subdomain
- dns
dispatch:
  inputs:
    log_command:
      type: string
      default: 'true'
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: 'true'
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Target domain (e.g. example.com)
      alias: t
jobs:
  subdomain-enum:
    name: Subdomain Enumeration
    outputs:
      subs_file: '{{ steps["merge-subdomains"].outputs.subs_file | default("", true) }}'
      sub_count: '{{ steps["merge-subdomains"].outputs.sub_count | default("", true) }}'
    steps:
    - task: subfinder
      log-command: '{{ inputs.log_command | default(true) }}'
      name: subfinder-scan
      with:
        target: '{{ inputs.target }}'
        all: true
      continue-on-error: true
    - task: amass
      log-command: '{{ inputs.log_command | default(true) }}'
      name: amass-passive
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: merge-subdomains
      script: "subs = set()\nsubs.add('{{ inputs.target }}')\n\nsf_outputs = {{ steps[\"subfinder-scan\"].outputs.typed_outputs | tojson }}\nfor item in sf_outputs:\n    if item.get('_type') == 'subdomain':\n\
        \        subs.add(item['host'])\n\nfor item in {{ subdomains(steps[\"amass-passive\"].outputs.typed_outputs) | default([], true) | tojson }}:\n    host = item.get('host', '')\n    if host and '{{\
        \ inputs.target }}' in host:\n        subs.add(host)\n\nwith open(f'{os.environ.get(\"OFX_RUN_DIR\", \"/tmp\")}/ofx_takeover_subs.txt', 'w') as f:\n    f.write('\\n'.join(sorted(subs)))\nadd_outputs(subs_file=f\"\
        {os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_takeover_subs.txt\", sub_count=len(subs))\nprint(f\"Collected {len(subs)} unique subdomains\")\n"
    needs: []
  dns-verify:
    name: DNS Resolution & CNAME Check
    needs:
    - subdomain-enum
    outputs:
      alive_file: '{{ steps["collect-dns"].outputs.alive_file | default("", true) }}'
      alive_count: '{{ steps["collect-dns"].outputs.alive_count | default("", true) }}'
      cname_count: '{{ steps["collect-dns"].outputs.cname_count | default("", true) }}'
    steps:
    - task: dnsx
      log-command: '{{ inputs.log_command | default(true) }}'
      name: resolve-dns
      with:
        target: '{{ jobs[''subdomain-enum''].outputs.subs_file }}'
        a: true
        cname: true
        resp: true
      continue-on-error: true
    - name: collect-dns
      script: "alive = set()\ncname_records = {}\n\ndnsx_out = {{ steps[\"resolve-dns\"].outputs.typed_outputs | tojson }}\nfor item in dnsx_out:\n    host = item.get('host', '')\n    if host:\n       \
        \ alive.add(host)\n    cname = item.get('cname', '')\n    if host and cname:\n        cname_records[host] = cname\n\nwith open(f'{os.environ.get(\"OFX_RUN_DIR\", \"/tmp\")}/ofx_takeover_alive.txt',\
        \ 'w') as f:\n    f.write('\\n'.join(sorted(alive)))\nadd_outputs(alive_file=f\"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_takeover_alive.txt\", alive_count=len(alive), cname_count=len(cname_records))\n\
        print(f\"Alive: {len(alive)}, CNAME records: {len(cname_records)}\")\n"
  takeover-check:
    name: Takeover Detection
    needs:
    - dns-verify
    outputs:
      takeover_count: '{{ steps["collect-takeovers"].outputs.takeover_count | default("", true) }}'
      takeover_findings_file: '{{ steps["collect-takeovers"].outputs.takeover_findings_file | default("", true) }}'
    steps:
    - task: subzy
      log-command: '{{ inputs.log_command | default(true) }}'
      name: subzy-scan
      with:
        target: '{{ jobs[''dns-verify''].outputs.alive_file }}'
      continue-on-error: true
    - task: nuclei
      log-command: '{{ inputs.log_command | default(true) }}'
      name: nuclei-takeover
      with:
        target: '{{ jobs[''dns-verify''].outputs.alive_file }}'
        tags: subdomain-takeover
      continue-on-error: true
    - name: collect-takeovers
      script: "takeovers = []\n\nsubzy_out = {{ steps[\"subzy-scan\"].outputs.typed_outputs | default([], true) | tojson }}\nfor item in subzy_out:\n    t = item.get('_type', '')\n    if t == 'vulnerability':\n\
        \        host = item.get('host', item.get('matched_at', ''))\n        name = item.get('name', 'takeover')\n        takeovers.append(f\"[subzy] {name}: {host}\")\n    elif t == 'subdomain' and item.get('vulnerable'):\n\
        \        takeovers.append(f\"[subzy] {item.get('host', 'unknown')}\")\n\nnuclei_vulns = {{ vulns(steps[\"nuclei-takeover\"].outputs.typed_outputs) | tojson }}\nfor v in nuclei_vulns:\n    name =\
        \ v.get('name', v.get('template_id', 'unknown'))\n    host = v.get('host', v.get('matched_at', ''))\n    takeovers.append(f\"[nuclei] {name}: {host}\")\n\nwith open(f'{os.environ.get(\"OFX_RUN_DIR\"\
        , \"/tmp\")}/ofx_takeover_findings.txt', 'w') as f:\n    f.write('\\n'.join(takeovers))\nadd_outputs(takeover_count=len(takeovers), takeover_findings_file=f\"{os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_takeover_findings.txt\"\
        )\nprint(f\"Takeover vulnerabilities: {len(takeovers)}\")\nfor t in takeovers:\n    print(f\"  [!] {t}\")\n"
