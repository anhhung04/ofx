name: smtp-enum
description: >
  SMTP enumeration — scans for SMTP services and tests for user enumeration via
  VRFY/EXPN/RCPT commands, open relay detection, and SMTP configuration issues.
  Uses nmap NSE scripts and nuclei SMTP templates.
tags:
  - recon
  - smtp
  - email
  - enumeration
  - open-relay
dispatch:
  inputs:
    targets:
      required: true
      type: string
      description: Target IP(s), CIDR range, or file with targets
      alias: t
    log_command:
      type: string
      default: "true"
      description: Enable command logging
    log_output:
      type: string
      default: "true"
      description: Enable output logging
defaults:
  store-creds: false
outputs:
  smtp_file: '{{ jobs["collect"].outputs.smtp_file | default("", true) }}'
  smtp_count: '{{ jobs["collect"].outputs.smtp_count | default("0", true) }}'
  open_relay_count: '{{ jobs["collect"].outputs.open_relay_count | default("0", true) }}'
  typed_outputs: '{{ jobs["collect"].outputs.typed_outputs | default([], true) }}'
jobs:
  discover:
    name: SMTP Discovery
    steps:
      - task: nmap
        log-command: "{{ inputs.log_command | default(true) }}"
        name: nmap-smtp
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.targets }}"
          ports: "25,465,587,2525"
          script: "smtp-commands,smtp-enum-users,smtp-open-relay,smtp-vuln-cve2010-4344,banner"
          json: true
          output_prefix: "smtp"
        continue-on-error: true
      - task: nuclei
        log-command: "{{ inputs.log_command | default(true) }}"
        name: nuclei-smtp
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.targets }}"
          tags: "smtp,open-relay,email,mail"
          severity: "critical,high,medium,low,info"
          rate_limit: 50
          json: true
          silent: true
        continue-on-error: true
  collect:
    name: Collect Results
    needs:
      - discover
    outputs:
      smtp_file: '{{ steps["collect-smtp"].outputs.smtp_file | default("", true) }}'
      smtp_count: '{{ steps["collect-smtp"].outputs.smtp_count | default("0", true) }}'
      open_relay_count: '{{ steps["collect-smtp"].outputs.open_relay_count | default("0", true) }}'
      typed_outputs: '{{ steps["collect-smtp"].outputs.typed_outputs | default([], true) }}'
    steps:
      - name: collect-smtp
        script: |
          import json
          from pathlib import Path

          smtp_servers = []
          open_relays = 0

          nmap_data = {{ steps["nmap-smtp"].outputs.typed_outputs | default([], true) | tojson }}
          for host in nmap_data:
            ip = host.get('ip', '')
            for port in host.get('ports', []):
              state = port.get('state', '')
              if state == 'open':
                scripts = port.get('scripts', {})
                is_open_relay = False
                if 'smtp-open-relay' in scripts:
                  result = scripts['smtp-open-relay']
                  if 'open' in str(result).lower():
                    is_open_relay = True
                    open_relays += 1

                smtp_servers.append({
                  'ip': ip,
                  'port': port.get('port', 0),
                  'service': port.get('service', 'smtp'),
                  'version': port.get('version', ''),
                  'open_relay': is_open_relay,
                  'scripts': {k: v[:200] if isinstance(v, str) else v for k, v in scripts.items()},
                  'source': 'nmap'
                })

          for vuln in {{ vulns(steps["nuclei-smtp"].outputs.typed_outputs) | default([], true) | tojson }}:
            host = vuln.get('host', '')
            if host:
              if 'open-relay' in str(vuln.get('info', '')).lower():
                open_relays += 1
              smtp_servers.append({
                'ip': host,
                'port': 25,
                'service': 'smtp',
                'name': vuln.get('name', ''),
                'severity': vuln.get('severity', 'info'),
                'source': 'nuclei'
              })

          out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')
          smtp_file = f'{out_dir}/ofx_smtp_servers.txt'
          Path(smtp_file).write_text('\\n'.join(
            [f"{s['ip']}:{s['port']} {'OPEN_RELAY' if s.get('open_relay') else ''}" for s in smtp_servers]
          ))

          add_outputs(
            smtp_file=smtp_file,
            smtp_count=len(smtp_servers),
            open_relay_count=open_relays,
            typed_outputs=smtp_servers
          )
          print(f'SMTP scan: {len(smtp_servers)} servers, {open_relays} open relays')
  summary:
    name: Summary
    needs:
      - collect
    steps:
      - name: report
        run: |
          echo "=========================================="
          echo " SMTP ENUMERATION RESULTS"
          echo "=========================================="
          echo ""
          echo "Targets: {{ inputs.targets }}"
          echo "SMTP servers: {{ jobs.collect.outputs.smtp_count | default('0', true) }}"
          echo "Open relays: {{ jobs.collect.outputs.open_relay_count | default('0', true) }}"
          echo ""
          {% set servers = jobs.collect.outputs.typed_outputs | default([], true) %}
          {% for s in servers[:20] %}
          echo "  {{ s.ip }}:{{ s.port }}"
          {% if s.get('open_relay') %}echo "    [OPEN RELAY]"{% endif %}
          {% endfor %}
          echo "=========================================="
        log-stdout: "{{ inputs.log_output | default(true) }}"
