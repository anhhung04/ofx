name: port-blitz
description: >
  Fast multi-engine port scanning — uses rustscan for full-range discovery (1-65535) then feeds discovered ports into nmap for service fingerprinting and exploit lookup.
tags:
- recon
- port
- scan
- network
dispatch:
  inputs:
    log_command:
      type: string
      default: 'true'
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: 'true'
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Target IP, CIDR, or hostname
      alias: t
    rate:
      type: string
      default: '3000'
      description: Scan rate (packets/sec)
jobs:
  fast-scan:
    name: Fast Port Discovery
    outputs:
      hosts_file: '{{ steps["merge-ports"].outputs.hosts_file | default("", true) }}'
      merged_ports: '{{ steps["merge-ports"].outputs.merged_ports | default("", true) }}'
      host_count: '{{ steps["merge-ports"].outputs.host_count | default("", true) }}'
      port_count: '{{ steps["merge-ports"].outputs.port_count | default("", true) }}'
    steps:
    - task: rustscan
      log-command: '{{ inputs.log_command | default(true) }}'
      name: rustscan-sweep
      with:
        target: '{{ inputs.target }}'
        range: 1-65535
        batch_size: 4500
      continue-on-error: true
    - name: merge-ports
      script: "ports_by_host = {}\n\nfor item in {{ ports(steps[\"rustscan-sweep\"].outputs.typed_outputs) | tojson }}:\n    host = item.get('host') or item.get('ip', '')\n    port = str(item.get('port',\
        \ ''))\n    if host and port:\n        ports_by_host.setdefault(host, set()).add(port)\n\nall_hosts = sorted(ports_by_host.keys())\nall_ports = set()\nfor p_set in ports_by_host.values():\n    all_ports.update(p_set)\n\
        \nport_csv = ','.join(sorted(all_ports, key=int))\n\nwith open(f'{os.environ.get(\"OFX_RUN_DIR\", \"/tmp\")}/ofx_portblitz_hosts.txt', 'w') as tf:\n    tf.write('\\n'.join(all_hosts))\n\nadd_outputs(hosts_file=f\"\
        {os.environ.get('OFX_RUN_DIR', '/tmp')}/ofx_portblitz_hosts.txt\", merged_ports=port_csv, host_count=len(all_hosts), port_count=len(all_ports))\nprint(f\"Found {len(all_ports)} unique ports across\
        \ {len(all_hosts)} hosts\")\n"
    needs: []
  service-detect:
    name: Service Fingerprinting
    needs:
    - fast-scan
    outputs:
      service_count: '{{ steps["collect-services"].outputs.service_count | default("", true) }}'
      live_urls_file: '{{ steps["collect-services"].outputs.live_urls_file | default("", true) }}'
      http_count: '{{ steps["collect-services"].outputs.http_count | default("", true) }}'
      vuln_count: '{{ steps["collect-services"].outputs.vuln_count | default("", true) }}'
      exploit_count: '{{ steps["collect-services"].outputs.exploit_count | default("", true) }}'
    steps:
    - task: nmap
      log-command: '{{ inputs.log_command | default(true) }}'
      name: nmap-version
      with:
        target: '{{ inputs.target }}'
        ports: '{{ jobs[''fast-scan''].outputs.merged_ports }}'
        version_detection: true
      continue-on-error: true
    - task: httpx
      log-command: '{{ inputs.log_command | default(true) }}'
      name: http-probe
      with:
        target: '{{ jobs[''fast-scan''].outputs.hosts_file | default(inputs.target, true) }}'
        tech_detect: true
        status_code: true
        title: true
        follow_redirects: true
      continue-on-error: true
    - task: ssh-audit
      log-command: '{{ inputs.log_command | default(true) }}'
      name: ssh-check
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - task: searchsploit
      log-command: '{{ inputs.log_command | default(true) }}'
      name: exploit-lookup
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: collect-services
      script: "nmap_ports = {{ ports(steps[\"nmap-version\"].outputs.typed_outputs) | tojson }}\n        nmap-version\"].outputs.typed_outputs) | tojson }}\nhttp_urls = {{ urls(steps[\"http-probe\"].outputs.typed_outputs) | tojson }}\nexploits = {{ steps[\"exploit-lookup\"].outputs.typed_outputs |\
        \ tojson }}\n\nservices = []\nseen = set()\nfor p in nmap_ports :\n    svc = p.get('service_name', 'unknown')\n    port = p.get('port', '?')\n    host = p.get('host') or p.get('ip',\
        \ '?')\n    key = f\"{host}:{port}\"\n    if key not in seen:\n        services.append(f\"{key}/{svc}\")\n        seen.add(key)\n\nlive_urls = [u['url'] for u in http_urls if u.get('url')]\n\nwith\
        \ open(f'{os.environ.get(\"OFX_RUN_DIR\", \"/tmp\")}/ofx_portblitz_urls.txt', 'w') as tf:\n    tf.write('\\n'.join(live_urls))\n\nadd_outputs(service_count=len(services), live_urls_file=f\"{os.environ.get('OFX_RUN_DIR',\
        \ '/tmp')}/ofx_portblitz_urls.txt\", http_count=len(live_urls), vuln_count=len(nmap_vulns), exploit_count=len(exploits))\nprint(f\"Services: {len(services)}, HTTP: {len(live_urls)}, Vulns: {len(nmap_vulns)},\
        \ Exploits: {len(exploits)}\")\n"
