name: k8s-audit
description: >
  Kubernetes cluster security audit — check RBAC misconfigs,
  privileged containers, exposed secrets, network policies,
  pod security, and vulnerable images. Uses trivy for image
  scanning and nmap for exposed service detection.
tags:
- kubernetes
- k8s
- cloud
- security
- audit
dispatch:
  inputs:
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
    log_output:
      type: string
      default: 'true'
      description: Enable output logging
    target:
      type: string
      default: ''
      description: K8s API server endpoint (empty for kubeconfig default)
      alias: t
    namespace:
      type: string
      default: ''
      description: Target namespace (all if empty)
defaults:
  store-creds: true
jobs:
  cluster-info:
    name: Cluster Information
    outputs:
      cluster_reachable: '{{ steps["check-cluster"].outputs.cluster_reachable | default("", true) }}'
    steps:
    - task: nmap
      log-command: '{{ inputs.log_command }}'
      name: k8s-api-scan
      retry: 1
      retry-delay: 5
      with:
        target: '{{ inputs.target if inputs.target else "localhost" }}'
        ports: '6443,8443,2379,2380,10250,10255,10256'
        service_detection: true
      continue-on-error: true
    - name: check-cluster
      script: |
        import subprocess
        import json

        k8s_api = '{{ inputs.target }}' or 'localhost'
        nmap_vulns = {{ vulns(steps["k8s-api-scan"].outputs.typed_outputs) | default([], true) | tojson }}

        open_ports = [v.get('port', '') for v in nmap_vulns if v.get('state') == 'open']
        print(f'K8s API scan: {len(open_ports)} ports open on {k8s_api}')
        for p in open_ports:
            print(f'  [+] {p}')

        add_outputs(cluster_reachable='true' if open_ports else 'false')
    needs: []
  image-scan:
    name: Container Image Vulnerability Scan
    needs:
    - cluster-info
    outputs:
      vuln_count: '{{ steps["collect-image-vulns"].outputs.vuln_count | default("0", true) }}'
      critical_count: '{{ steps["collect-image-vulns"].outputs.critical_count | default("0", true) }}'
    steps:
    - task: trivy
      log-command: '{{ inputs.log_command }}'
      name: trivy-k8s
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target if inputs.target else "k8s" }}'
        severity: CRITICAL,HIGH,MEDIUM
      continue-on-error: true
    - name: collect-image-vulns
      script: |
        import json
        from pathlib import Path

        trivy_vulns = {{ vulns(steps["trivy-k8s"].outputs.typed_outputs) | default([], true) | tojson }}
        critical = [v for v in trivy_vulns if v.get('severity') == 'critical']

        add_outputs(vuln_count=len(trivy_vulns), critical_count=len(critical))
        print(f'Container images: {len(trivy_vulns)} vulns, {len(critical)} critical')
        for v in critical[:10]:
            print(f'  [CRITICAL] {v.get("name", "")} — {v.get("image", "")}')
    needs: []
  rbac-audit:
    name: RBAC & Pod Security Audit
    needs:
    - cluster-info
    outputs:
      finding_count: '{{ steps["collect-rbac"].outputs.finding_count | default("0", true) }}'
      admin_binding_count: '{{ steps["collect-rbac"].outputs.admin_binding_count | default("0", true) }}'
      privileged_count: '{{ steps["collect-rbac"].outputs.privileged_count | default("0", true) }}'
    steps:
    - name: collect-rbac
      script: |
        import subprocess
        import json

        kubeconfig = '{{ inputs.target }}'
        kc = ['kubectl']
        if kubeconfig:
            kc.extend(['--kubeconfig', kubeconfig])

        ns = '{{ inputs.namespace }}'
        ns_args = ['-n', ns] if ns else ['--all-namespaces']

        findings = []
        admin_bindings = 0
        privileged = 0

        proc = subprocess.run(kc + ['get', 'clusterrolebindings', '-o', 'json'],
                              capture_output=True, text=True, timeout=15)
        if proc.returncode == 0:
            bindings = json.loads(proc.stdout).get('items', [])
            admin_bindings = len([b for b in bindings
                                   if b.get('roleRef', {}).get('name') == 'cluster-admin'])
            for b in bindings:
                if b.get('roleRef', {}).get('name') == 'cluster-admin':
                    for s in b.get('subjects', []):
                        if s.get('kind') == 'ServiceAccount' and s.get('name') != 'system:masters':
                            findings.append(f'[HIGH] SA {s.get("namespace", "")}/{s.get("name")} has cluster-admin')
            print(f'[+] ClusterRoleBindings: {len(bindings)} ({admin_bindings} cluster-admin)')

        proc = subprocess.run(kc + ['get', 'pods'] + ns_args + ['-o', 'json'],
                              capture_output=True, text=True, timeout=15)
        if proc.returncode == 0:
            pods = json.loads(proc.stdout).get('items', [])
            for pod in pods:
                name = pod['metadata']['name']
                ns_name = pod['metadata'].get('namespace', '')
                spec = pod.get('spec', {})
                for container in spec.get('containers', []) + spec.get('initContainers', []):
                    sec = container.get('securityContext', {})
                    if sec.get('privileged'):
                        privileged += 1
                        findings.append(f'[CRITICAL] Privileged: {ns_name}/{name}/{container["name"]}')

        add_outputs(finding_count=len(findings), admin_binding_count=admin_bindings,
                    privileged_count=privileged)
        print(f'RBAC audit: {len(findings)} findings, {admin_bindings} cluster-admin bindings, {privileged} privileged containers')
      log-command: '{{ inputs.log_command | default(true) }}'
      continue-on-error: true
    needs: []
  summary:
    name: K8s Audit Summary
    needs:
    - cluster-info
    - image-scan
    - rbac-audit
    steps:
    - name: report
      run: |
        echo "======================================================"
        echo " KUBERNETES SECURITY AUDIT"
        echo "======================================================"
        echo ""
        echo "  Cluster reachable:  {{ jobs.cluster-info.outputs.cluster_reachable }}"
        echo "  Image vulns:        {{ jobs.image-scan.outputs.vuln_count }}"
        echo "  Critical vulns:     {{ jobs.image-scan.outputs.critical_count }}"
        echo "  RBAC findings:      {{ jobs.rbac-audit.outputs.finding_count }}"
        echo "  Cluster-admin:      {{ jobs.rbac-audit.outputs.admin_binding_count }}"
        echo "  Privileged pods:    {{ jobs.rbac-audit.outputs.privileged_count }}"
        echo "======================================================"
      log-stdout: '{{ inputs.log_output }}'
