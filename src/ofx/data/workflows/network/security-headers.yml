name: security-headers
description: >
  Security headers audit — fetch HTTP response headers from a target
  using httpx for header extraction, grade them based on security best
  practices (A-F), and provide remediation recommendations.
tags:
- recon
- web
- headers
- security-audit
dispatch:
  inputs:
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
    log_output:
      type: string
      default: 'true'
      description: Enable output logging
    target:
      required: true
      type: string
      description: Target URL or domain to audit
      alias: t
defaults:
  store-creds: true
jobs:
  fetch-headers:
    name: Fetch Headers with httpx
    outputs:
      headers_json: '{{ steps["collect-headers"].outputs.headers_json | default("", true) }}'
      header_count: '{{ steps["collect-headers"].outputs.header_count | default("0", true) }}'
      finding_count: '{{ steps["collect-headers"].outputs.finding_count | default("0", true) }}'
    steps:
    - task: httpx
      log-command: '{{ inputs.log_command }}'
      name: httpx-headers
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
        status_code: true
        title: true
        tech_detect: true
        follow_redirects: true
      continue-on-error: true
    - task: whatweb
      log-command: '{{ inputs.log_command }}'
      name: whatweb-fingerprint
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: collect-headers
      script: |
        import json
        from pathlib import Path

        httpx_results = {{ steps["httpx-headers"].outputs.typed_outputs | default([], true) | tojson }}
        whatweb_results = {{ steps["whatweb-fingerprint"].outputs.typed_outputs | default([], true) | tojson }}

        headers = {}
        if httpx_results:
            for r in httpx_results:
                headers.update(r.get('headers', {}))

        security_headers = [
            'Strict-Transport-Security', 'Content-Security-Policy', 'X-Frame-Options',
            'X-Content-Type-Options', 'Referrer-Policy', 'Permissions-Policy',
            'X-XSS-Protection', 'Cross-Origin-Opener-Policy', 'Cross-Origin-Resource-Policy',
        ]

        findings = []
        for h in security_headers:
            if h not in headers:
                findings.append({'header': h, 'status': 'MISSING'})

        out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')
        headers_file = f'{out_dir}/ofx_security_headers.json'
        Path(headers_file).write_text(json.dumps({
            'headers': headers,
            'missing': findings,
            'technologies': whatweb_results
        }, indent=2, default=str))

        add_outputs(headers_json=json.dumps(headers), header_count=len(headers),
                    finding_count=len(findings))
        print(f'Headers: {len(headers)} received, {len(findings)} security headers missing')
    needs: []
  grade:
    name: Security Grade Report
    needs:
    - fetch-headers
    outputs:
      grade: '{{ steps["compute-grade"].outputs.grade | default("F", true) }}'
      present_count: '{{ steps["compute-grade"].outputs.present_count | default("0", true) }}'
      missing_count: '{{ steps["compute-grade"].outputs.missing_count | default("0", true) }}'
    steps:
    - name: compute-grade
      script: |
        import json

        headers_raw = '{{ jobs.fetch-headers.outputs.headers_json }}'
        headers = json.loads(headers_raw) if headers_raw else {}

        security_headers = [
            'Strict-Transport-Security', 'Content-Security-Policy', 'X-Frame-Options',
            'X-Content-Type-Options', 'Referrer-Policy', 'Permissions-Policy',
            'X-XSS-Protection', 'Cross-Origin-Opener-Policy', 'Cross-Origin-Resource-Policy',
        ]

        total = len(security_headers)
        present = sum(1 for h in security_headers if h in headers)
        missing = total - present

        if total == 0:
            grade = 'F'
        else:
            ratio = present / total
            if ratio >= 0.9:
                grade = 'A'
            elif ratio >= 0.75:
                grade = 'B'
            elif ratio >= 0.6:
                grade = 'C'
            elif ratio >= 0.4:
                grade = 'D'
            else:
                grade = 'F'

        missing_headers = [h for h in security_headers if h not in headers]
        present_headers = [h for h in security_headers if h in headers]

        print("=" * 56)
        print(f" SECURITY HEADERS REPORT: {{ inputs.target }}")
        print("=" * 56)
        print(f"\n  Grade: {grade}")
        print(f"  Present: {present}/{total}")
        print(f"  Missing: {missing}/{total}")

        if present_headers:
            print(f"\n  [+] Present headers:")
            for h in sorted(present_headers):
                print(f"      {h}: {headers[h][:60]}")

        if missing_headers:
            print(f"\n  [-] Missing headers:")
            for h in sorted(missing_headers):
                print(f"      {h}")

        recs = {
            "Strict-Transport-Security": "Add HSTS: max-age=31536000; includeSubDomains",
            "Content-Security-Policy": "Add CSP to prevent XSS and injection attacks",
            "X-Frame-Options": "Add X-Frame-Options: DENY or SAMEORIGIN",
            "X-Content-Type-Options": "Add X-Content-Type-Options: nosniff",
            "Referrer-Policy": "Add Referrer-Policy: strict-origin-when-cross-origin",
            "Permissions-Policy": "Add Permissions-Policy to restrict browser features",
            "X-XSS-Protection": "Add X-XSS-Protection: 0 (rely on CSP instead)",
        }

        print(f"\n  Recommendations:")
        for h in missing_headers:
            if h in recs:
                print(f"    - {recs[h]}")

        add_outputs(grade=grade, present_count=present, missing_count=missing)
      log-stdout: '{{ inputs.log_output }}'
