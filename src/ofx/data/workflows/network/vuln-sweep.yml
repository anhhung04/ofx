name: vuln-sweep
description: >
  Vulnerability scanning — template-based scanning (nuclei), injection
  testing (XSS, SQLi, CMDi, CRLF, SSRF, SSTI), secret hunting, and takeover
  detection. Runs after URL discovery is complete.
tags:
- recon
- vuln
- nuclei
- xss
- sqli
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target domain or URL file
      alias: t
    urls_file:
      type: string
      default: ''
      description: Path to discovered URL list
    live_urls_file:
      type: string
      default: ''
      description: Path to live HTTP URLs
    verified_file:
      type: string
      default: ''
      description: Path to verified subdomain list
    param_urls_file:
      type: string
      default: ''
      description: Path to parameterized URL list
    callback:
      type: string
      default: ''
      description: OOB callback URL (e.g. interactsh)
    blind:
      type: string
      default: 'false'
      description: Enable blind vulnerability testing with callback
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
    log_output:
      type: string
      default: 'true'
      description: Enable output logging
defaults:
  store-creds: true
jobs:
  nuclei-scan:
    name: Nuclei Template Scan
    outputs:
      nuclei_file: '{{ steps["collect-nuclei"].outputs.nuclei_file | default("", true) }}'
      nuclei_count: '{{ steps["collect-nuclei"].outputs.nuclei_count | default("0", true) }}'
      critical_count: '{{ steps["collect-nuclei"].outputs.critical_count | default("0", true) }}'
      high_count: '{{ steps["collect-nuclei"].outputs.high_count | default("0", true) }}'
    steps:
    - task: nuclei
      log-command: '{{ inputs.log_command }}'
      name: nuclei-web
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.live_urls_file if inputs.live_urls_file else inputs.urls_file if inputs.urls_file else inputs.target }}'
        severity: critical,high,medium
      continue-on-error: true
    - task: nuclei
      log-command: '{{ inputs.log_command }}'
      name: nuclei-takeover
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.verified_file if inputs.verified_file else inputs.target }}'
        tags: subdomain-takeover,takeover,dns
      continue-on-error: true
    - task: nuclei
      log-command: '{{ inputs.log_command }}'
      name: nuclei-exposure
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.live_urls_file if inputs.live_urls_file else inputs.urls_file if inputs.urls_file else inputs.target }}'
        tags: exposure,token,secret,api-key
      continue-on-error: true
    - name: collect-nuclei
      script: |
        import json
        from pathlib import Path

        all_vulns = (
            {{ vulns(steps["nuclei-web"].outputs.typed_outputs) | default([], true) | tojson }} +
            {{ vulns(steps["nuclei-takeover"].outputs.typed_outputs) | default([], true) | tojson }} +
            {{ vulns(steps["nuclei-exposure"].outputs.typed_outputs) | default([], true) | tojson }}
        )

        critical = [v for v in all_vulns if v.get('severity') == 'critical']
        high = [v for v in all_vulns if v.get('severity') == 'high']

        out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')

        add_outputs(nuclei_data=json.dumps(all_vulns, indent=2, default=str, nuclei_count=len(all_vulns),
                    critical_count=len(critical), high_count=len(high))

        print(f'Nuclei: {len(all_vulns)} findings (C:{len(critical)} H:{len(high)})')
        for v in critical[:5]:
            print(f'  [CRITICAL] {v.get("host", "")} — {v.get("name", "")}')
    needs: []
  injection-scan:
    name: Injection Vulnerability Testing
    needs:
    - nuclei-scan
    outputs:
      xss_count: '{{ steps["collect-injection"].outputs.xss_count | default("0", true) }}'
      sqli_count: '{{ steps["collect-injection"].outputs.sqli_count | default("0", true) }}'
      cmdi_count: '{{ steps["collect-injection"].outputs.cmdi_count | default("0", true) }}'
      crlf_count: '{{ steps["collect-injection"].outputs.crlf_count | default("0", true) }}'
      ssrf_count: '{{ steps["collect-injection"].outputs.ssrf_count | default("0", true) }}'
      ssti_count: '{{ steps["collect-injection"].outputs.ssti_count | default("0", true) }}'
      injection_file: '{{ steps["collect-injection"].outputs.injection_file | default("", true) }}'
    steps:
    - task: dalfox
      log-command: '{{ inputs.log_command }}'
      name: dalfox-xss
      retry: 2
      retry-delay: 5
      run_if: '{{ inputs.param_urls_file | default("", true) | length > 0 }}'
      with:
        target: '{{ inputs.param_urls_file }}'
        blind: '{{ inputs.callback if inputs.blind == "true" else "" }}'
      continue-on-error: true
    - task: sqlmap
      log-command: '{{ inputs.log_command }}'
      name: sqlmap-sqli
      retry: 2
      retry-delay: 5
      run_if: '{{ inputs.param_urls_file | default("", true) | length > 0 }}'
      with:
        target: '{{ inputs.param_urls_file }}'
        batch: true
        level: 2
        risk: 2
        random_agent: true
        threads: 5
      continue-on-error: true
    - task: crlfuzz
      log-command: '{{ inputs.log_command }}'
      name: crlfuzz-scan
      retry: 2
      retry-delay: 5
      run_if: '{{ inputs.live_urls_file | default("", true) | length > 0 }}'
      with:
        target: '{{ inputs.live_urls_file }}'
      continue-on-error: true
    - task: commix
      log-command: '{{ inputs.log_command }}'
      name: commix-cmdi
      retry: 2
      retry-delay: 5
      run_if: '{{ inputs.param_urls_file | default("", true) | length > 0 }}'
      with:
        target: '{{ inputs.param_urls_file }}'
        batch: true
        level: 2
      continue-on-error: true
    - task: ssrfmap
      log-command: '{{ inputs.log_command }}'
      name: ssrfmap-scan
      retry: 2
      retry-delay: 5
      run_if: '{{ inputs.param_urls_file | default("", true) | length > 0 }}'
      with:
        target: '{{ inputs.param_urls_file }}'
      continue-on-error: true
    - task: tinja
      log-command: '{{ inputs.log_command }}'
      name: tinja-ssti
      retry: 2
      retry-delay: 5
      run_if: '{{ inputs.param_urls_file | default("", true) | length > 0 }}'
      with:
        target: '{{ inputs.param_urls_file }}'
      continue-on-error: true
    - name: collect-injection
      script: |
        import json
        from pathlib import Path

        xss_v = {{ vulns(steps["dalfox-xss"].outputs.typed_outputs) | default([], true) | tojson }}
        sqli_v = {{ vulns(steps["sqlmap-sqli"].outputs.typed_outputs) | default([], true) | tojson }}
        cmdi_v = {{ vulns(steps["commix-cmdi"].outputs.typed_outputs) | default([], true) | tojson }}
        crlf_v = {{ vulns(steps["crlfuzz-scan"].outputs.typed_outputs) | default([], true) | tojson }}
        ssrf_v = {{ vulns(steps["ssrfmap-scan"].outputs.typed_outputs) | default([], true) | tojson }}
        ssti_v = {{ vulns(steps["tinja-ssti"].outputs.typed_outputs) | default([], true) | tojson }}

        all_inj = xss_v + sqli_v + cmdi_v + crlf_v + ssrf_v + ssti_v
        out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')

        add_outputs(
            injection_file=injection_file,
            xss_count=len(xss_v), sqli_count=len(sqli_v), cmdi_count=len(cmdi_v),
            crlf_count=len(crlf_v), ssrf_count=len(ssrf_v), ssti_count=len(ssti_v),
        )
        print(f'Injection findings — XSS:{len(xss_v)} SQLi:{len(sqli_v)} CMDi:{len(cmdi_v)} CRLF:{len(crlf_v)} SSRF:{len(ssrf_v)} SSTI:{len(ssti_v)}')
    needs: []
  takeover-check:
    name: Subdomain Takeover Detection
    needs:
    - nuclei-scan
    steps:
    - task: subzy
      log-command: '{{ inputs.log_command }}'
      name: subzy-takeover
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.verified_file if inputs.verified_file else inputs.target }}'
      continue-on-error: true
    - task: dnstake
      log-command: '{{ inputs.log_command }}'
      name: dnstake-takeover
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.verified_file if inputs.verified_file else inputs.target }}'
      continue-on-error: true
    - name: report-takeovers
      script: |
        import json
        from pathlib import Path

        subzy = {{ vulns(steps["subzy-takeover"].outputs.typed_outputs) | default([], true) | tojson }}
        dnstake = {{ vulns(steps["dnstake-takeover"].outputs.typed_outputs) | default([], true) | tojson }}

        all_takeovers = subzy + dnstake
        out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')

        add_outputs(takeover_count=len(all_takeovers), takeover_data=json.dumps(all_takeovers, indent=2, default=str)
        if all_takeovers:
            print(f'Takeover candidates: {len(all_takeovers)}')
            for t in all_takeovers[:10]:
                print(f'  {t.get("host", "")} — {t.get("name", "")}')
        else:
            print('No takeover vulnerabilities detected')
    needs: []
  summary:
    name: Vulnerability Summary
    needs:
    - nuclei-scan
    - injection-scan
    - takeover-check
    steps:
    - name: report
      run: |
        echo "======================================================"
        echo " VULNERABILITY SCAN: {{ inputs.target }}"
        echo "======================================================"
        echo ""
        echo "--- Nuclei ---"
        echo "  Total: {{ jobs['nuclei-scan'].outputs.nuclei_count }}"
        echo "  Critical: {{ jobs['nuclei-scan'].outputs.critical_count }}"
        echo "  High: {{ jobs['nuclei-scan'].outputs.high_count }}"
        echo ""
        echo "--- Injection Testing ---"
        echo "  XSS: {{ jobs['injection-scan'].outputs.xss_count }}"
        echo "  SQLi: {{ jobs['injection-scan'].outputs.sqli_count }}"
        echo "  CMDi: {{ jobs['injection-scan'].outputs.cmdi_count }}"
        echo "  CRLF: {{ jobs['injection-scan'].outputs.crlf_count }}"
        echo "  SSRF: {{ jobs['injection-scan'].outputs.ssrff_count }}"
        echo "  SSTI: {{ jobs['injection-scan'].outputs.ssti_count }}"
        echo ""
        echo "--- Takeovers ---"
        echo "  Candidates: {{ jobs['takeover-check'].outputs.takeover_count }}"
        echo "======================================================"
      log-stdout: '{{ inputs.log_output }}'