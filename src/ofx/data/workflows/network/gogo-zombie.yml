name: gogo-zombie
description: 'Network scan and credential brute-force pipeline — uses gogo for fast

  port scanning with fingerprinting, then chains zombie to automatically

  brute-force discovered services using gogo''s result file (-g).

  '
tags:
- recon
- brute
- gogo
- zombie
- internal
dispatch:
  inputs:
    log_command:
      type: string
      default: 'true'
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: 'true'
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Target IP, CIDR, or file with hosts (e.g. 192.168.1.0/24)
      alias: t
    ports:
      type: string
      default: top2,win,db
      description: Port preset or range (e.g. top2,win,db or 1-65535)
    mod:
      type: string
      default: ''
      description: Smart scan mode (s=smart, ss=supersmart, sc=smart-C, default=normal)
    services:
      type: string
      default: ''
      description: Filter specific services for zombie (e.g. ssh,mysql,smb)
    user:
      type: string
      default: ''
      description: Single username for brute-force
    user_file:
      type: string
      default: ''
      description: File with usernames
    password:
      type: string
      default: ''
      description: Single password for spray
    password_file:
      type: string
      default: ''
      description: File with passwords
    threads:
      type: string
      default: '100'
      description: Zombie threads
    weakpass:
      type: string
      default: 'false'
      description: Enable weak password generation (true/false)
defaults:
  store-creds: true
jobs:
  scan:
    name: Network Scan (gogo)
    outputs:
      scan_file: '{{ steps["gogo-scan"].outputs.output_file | default("", true) }}'
    steps:
    - task: gogo
      log-command: '{{ inputs.log_command | default(true) }}'
      name: gogo-scan
      continue-on-error: true
      with:
        target: '{{ inputs.target }}'
        ports: '{{ inputs.ports }}'
        mod: '{{ inputs.mod if inputs.mod else omit }}'
        verbose: true
    - name: scan-summary
      script: "ports = {{ ports(steps[\"gogo-scan\"].outputs.typed_outputs) | default([], true) | tojson }}\nurls = {{ urls(steps[\"gogo-scan\"].outputs.typed_outputs) | default([], true) | tojson }}\n\
        tags = {{ tags(steps[\"gogo-scan\"].outputs.typed_outputs) | default([], true) | tojson }}\n\nservices = set()\nfor p in ports:\n    svc = p.get(\"service_name\", \"\")\n    if svc:\n        services.add(svc)\n\
        \nprint(f\"Discovered {len(ports)} open ports across {len(set(p.get('ip','') for p in ports))} hosts\")\nprint(f\"Found {len(urls)} HTTP endpoints\")\nprint(f\"Detected {len(tags)} technology fingerprints\"\
        )\nprint(f\"Services: {', '.join(sorted(services)) if services else 'none identified'}\")\n"
  brute:
    name: Service Brute-Force (zombie)
    needs:
    - scan
    if: '{{ jobs["scan"].outputs.scan_file }}'
    steps:
    - task: zombie
      log-command: '{{ inputs.log_command | default(true) }}'
      name: zombie-brute
      with:
        target: '{{ inputs.target }}'
        gogo: '{{ jobs["scan"].outputs.scan_file }}'
        filter_service: '{{ inputs.services if inputs.services else omit }}'
        user: '{{ inputs.user if inputs.user else omit }}'
        user_file: '{{ inputs.user_file if inputs.user_file else omit }}'
        password: '{{ inputs.password if inputs.password else omit }}'
        password_file: '{{ inputs.password_file if inputs.password_file else omit }}'
        threads: '{{ inputs.threads }}'
        weakpass: '{{ inputs.weakpass == ''true'' }}'
      store-creds: true
      continue-on-error: true
    - name: brute-summary
      script: "accounts = {{ users(steps[\"zombie-brute\"].outputs.typed_outputs) | default([], true) | tojson }}\nif accounts:\n    print(f\"Found {len(accounts)} valid credential(s):\")\n    for a in\
        \ accounts:\n        user = a.get(\"username\", \"\")\n        host = a.get(\"host\", \"\")\n        comment = a.get(\"comment\", \"\")\n        print(f\"  {user}@{host} ({comment})\")\nelse:\n\
        \    print(\"No valid credentials found\")"
