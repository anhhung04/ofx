name: service-enum
description: >
  Deep service enumeration — probe discovered services (SMB, FTP, SNMP,

  SMTP, DNS, NFS, RDP, MySQL, MSSQL) for detailed information,

  anonymous access, and misconfigurations.
tags:
- scan
- enumeration
- services
- network
dispatch:
  inputs:
    log_command:
      type: string
      default: 'true'
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: 'true'
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Target host IP or hostname
      alias: t
jobs:
  port-discovery:
    name: Port Discovery
    outputs:
      port_count: '{{ steps["identify-services"].outputs.port_count | default("", true) }}'
      detected_services: '{{ steps["identify-services"].outputs.detected_services | default("", true) }}'
      open_ports: '{{ steps["identify-services"].outputs.open_ports | default("", true) }}'
    steps:
    - task: naabu
      log-command: '{{ inputs.log_command | default(true) }}'
      name: port-scan
      with:
        target: '{{ inputs.target }}'
        top_ports: '1000'
        rate: 1000
      continue-on-error: true
    - name: identify-services
      script: "ports_data = {{ ports(steps[\"port-scan\"].outputs.typed_outputs) | tojson }}\n        \ 22: 'ssh', 25: 'smtp', 53: 'dns', 80: 'http',\n    110: 'pop3', 111: 'rpc', 135: 'rpc', 139: 'smb', 143: 'imap',\n    161: 'snmp', 389: 'ldap', 443: 'https', 445: 'smb', 993: 'imaps',\n    1433:\
        \ 'mssql', 1521: 'oracle', 2049: 'nfs', 3306: 'mysql',\n    3389: 'rdp', 5432: 'postgres', 5900: 'vnc', 6379: 'redis',\n    8080: 'http', 8443: 'https', 27017: 'mongodb',\n}\n\nservices = {}\nfor\
        \ p in ports_data:\n    port = p.get('port', 0)\n    services[port] = svc_map.get(port, '')\n\ndetected = set()\nfor p in []:\n    port = p.get('port', 0)\n    svc_name = p.get('service_name',\
        \ '')\n    if '/' in svc_name:\n        svc_name = svc_name.split('/')[0]\n    if svc_name:\n        detected.add(svc_name)\n        services[port] = svc_name\n\nfor port, svc in services.items():\n\
        \    if svc:\n        detected.add(svc)\n    elif port in svc_map:\n        detected.add(svc_map[port])\n\nadd_outputs(port_count=len(services), detected_services=','.join(sorted(detected)), open_ports=','.join(str(p)\
        \ for p in sorted(services.keys())))\nprint(f\"[+] Open ports: {len(services)}\")\nprint(f\"[+] Services: {', '.join(sorted(detected))}\")\n"
  deep-enum:
    name: Deep Service Enumeration
    needs:
    - port-discovery
    outputs:
      enum_file: '{{ steps["enum-services"].outputs.enum_file | default("", true) }}'
      service_count: '{{ steps["enum-services"].outputs.service_count | default("", true) }}'
    steps:
    - name: enum-services
      script: "import subprocess\n\ntarget = '{{ inputs.target }}'\nservices = '{{ jobs[\"port-discovery\"].outputs.detected_services }}'.split(',')\nports = '{{ jobs[\"port-discovery\"].outputs.open_ports\
        \ }}'\n\nresults = {}\n\nfor svc in services:\n    if not svc:\n        continue\n    print(f\"\\n=== {svc.upper()} ===\")\n\n    if svc == 'smb':\n        cmds = [\n            ('nmap-smb', f'nmap\
        \ -p 139,445 --script smb-enum-shares,smb-enum-users,smb-os-discovery -Pn {target}'),\n            ('smbclient', f'smbclient -L //{target}/ -N 2>/dev/null'),\n        ]\n    elif svc == 'ftp':\n\
        \        cmds = [\n            ('nmap-ftp', f'nmap -p 21 --script ftp-anon,ftp-syst,ftp-vsftpd-backdoor -Pn {target}'),\n        ]\n    elif svc == 'snmp':\n        cmds = [\n            ('nmap-snmp',\
        \ f'nmap -p 161 --script snmp-info,snmp-interfaces,snmp-netstat,snmp-processes -sU -Pn {target}'),\n        ]\n    elif svc == 'smtp':\n        cmds = [\n            ('nmap-smtp', f'nmap -p 25 --script\
        \ smtp-commands,smtp-enum-users,smtp-open-relay -Pn {target}'),\n        ]\n    elif svc == 'dns':\n        cmds = [\n            ('nmap-dns', f'nmap -p 53 --script dns-zone-transfer,dns-recursion\
        \ -Pn {target}'),\n        ]\n    elif svc == 'nfs':\n        cmds = [\n            ('nmap-nfs', f'nmap -p 2049 --script nfs-ls,nfs-showmount,nfs-statfs -Pn {target}'),\n            ('showmount',\
        \ f'showmount -e {target} 2>/dev/null'),\n        ]\n    elif svc == 'mysql':\n        cmds = [\n            ('nmap-mysql', f'nmap -p 3306 --script mysql-info,mysql-enum,mysql-empty-password -Pn\
        \ {target}'),\n        ]\n    elif svc == 'mssql':\n        cmds = [\n            ('nmap-mssql', f'nmap -p 1433 --script ms-sql-info,ms-sql-ntlm-info,ms-sql-empty-password -Pn {target}'),\n    \
        \    ]\n    elif svc == 'redis':\n        cmds = [\n            ('nmap-redis', f'nmap -p 6379 --script redis-info -Pn {target}'),\n        ]\n    elif svc == 'ldap':\n        cmds = [\n        \
        \    ('nmap-ldap', f'nmap -p 389 --script ldap-rootdse,ldap-search -Pn {target}'),\n        ]\n    else:\n        cmds = []\n\n    for name, cmd in cmds:\n        try:\n            proc = subprocess.run(cmd,\
        \ shell=True, capture_output=True, text=True, timeout=60)\n            output = proc.stdout.strip()\n            results[f'{svc}_{name}'] = output\n            if output:\n                for line\
        \ in output.splitlines()[:20]:\n                    print(f\"  {line}\")\n        except Exception as e:\n            print(f\"  Error: {e}\")\n\nfrom pathlib import Path\nout_file = f'{os.environ.get(\"\
        OFX_RUN_DIR\", \"/tmp\")}/ofx_service_enum.txt'\nwith open(out_file, 'w') as f:\n    for name, output in results.items():\n        f.write(f\"=== {name.upper()} ===\\n{output}\\n\\n\")\n\nadd_outputs(enum_file=out_file,\
        \ service_count=len(services))\nprint(f\"\\n[+] Full results: {out_file}\")\n"
      log-stdout: '{{ inputs.log_output | default(true) }}'
      log-command: '{{ inputs.log_command | default(true) }}'
  default-cred-check:
    name: Default Credential Check
    needs:
    - port-discovery
    outputs:
      cred_count: '{{ steps["parse-results"].outputs.cred_count | default("", true) }}'
    steps:
    - name: brutus-check
      log-command: '{{ inputs.log_command | default(true) }}'
      run: "naabu -host {{ inputs.target }} -p {{ jobs['port-discovery'].outputs.open_ports | default('22,21,3306,5432,6379', true) }} -silent 2>/dev/null | \\\n   \\\n  brutus\
        \ --json 2>/dev/null | tee ${OFX_RUN_DIR:-/tmp}/ofx_svc_brutus.jsonl\n"
      continue-on-error: true
    - name: parse-results
      script: "import json\ncreds = []\ntry:\n    with open(f'{os.environ.get(\"OFX_RUN_DIR\", \"/tmp\")}/ofx_svc_brutus.jsonl') as f:\n        for line in f:\n            line = line.strip()\n        \
        \    if not line or not line.startswith('{'):\n                continue\n            try:\n                data = json.loads(line)\n                username = data.get('username', data.get('login',\
        \ ''))\n                password = data.get('password', data.get('pass', ''))\n                service = data.get('service', '')\n                host = data.get('host', data.get('ip', ''))\n  \
        \              port = data.get('port', '')\n                if username:\n                    creds.append({'user': username, 'pass': password, 'service': service, 'target': f\"{host}:{port}\"})\n\
        \            except json.JSONDecodeError:\n                continue\nexcept FileNotFoundError:\n    pass\n\nadd_outputs(cred_count=len(creds))\nif creds:\n    print(f\"[!] Default credentials found:\
        \ {len(creds)}\")\n    for c in creds:\n        print(f\"  [+] {c['target']} ({c['service']}): {c['user']}:{c['pass']}\")\nelse:\n    print(\"[*] No default credentials found\")\n"
      log-stdout: '{{ inputs.log_output | default(true) }}'
