name: domain-scan
description: >
  Domain-level security assessment. Enumerates DNS records, discovers subdomains
  via passive sources, verifies DNS records, scans for open ports, probes HTTP
  services, checks for subdomain takeovers, and runs lightweight vulnerability
  scanning. Mid-tier scan between quick and full recon.
tags:
- recon
- domain
- dns
- subdomain
- http
- port
- takeovers
- vuln
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target domain (e.g. example.com)
      alias: t
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
    log_output:
      type: string
      default: 'true'
      description: Enable output logging
defaults:
  store-creds: true
jobs:
  dns-enum:
    name: DNS Record Enumeration
    outputs:
      dns_records_file: '{{ steps["report-dns"].outputs.dns_records_file | default("", true) }}'
      record_count: '{{ steps["report-dns"].outputs.record_count | default("0", true) }}'
    steps:
    - task: dnsx
      log-command: '{{ inputs.log_command }}'
      name: dnsx-records
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
        a: true
        aaaa: true
        cname: true
        mx: true
        ns: true
        txt: true
        soa: true
        resp: true
      continue-on-error: true
    - task: dnsrecon
      log-command: '{{ inputs.log_command }}'
      name: dnsrecon-enum
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
        type: std,srv,axfr
      continue-on-error: true
    - name: report-dns
      script: |
        import json
        from pathlib import Path

        dnsx = {{ steps["dnsx-records"].outputs.typed_outputs | default([], true) | tojson }}
        dnsrecon = {{ steps["dnsrecon-enum"].outputs.typed_outputs | default([], true) | tojson }}

        all_records = dnsx + dnsrecon
        out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')

        add_outputs(dns_records_file=json.dumps(all_records, indent=2, default=str, record_count=len(all_records))
        print(f'DNS records: {len(all_records)}')
        by_type = {}
        for r in all_records:
            t = r.get('record_type', r.get('type', 'unknown'))
            by_type.setdefault(t, 0)
            by_type[t] += 1
        for t, c in sorted(by_type.items()):
            print(f'  {t}: {c}')
    needs: []
  subdomain-discovery:
    name: Subdomain Enumeration
    outputs:
      subs_file: '{{ steps["merge-subs"].outputs.subs_file | default("", true) }}'
      sub_count: '{{ steps["merge-subs"].outputs.sub_count | default("0", true) }}'
    steps:
    - task: subfinder
      log-command: '{{ inputs.log_command }}'
      name: subfinder
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
        all: true
      continue-on-error: true
    - task: assetfinder
      log-command: '{{ inputs.log_command }}'
      name: assetfinder
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - task: findomain
      log-command: '{{ inputs.log_command }}'
      name: findomain
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: crtsh
      script: |
        from ofx.api.recon import crtsh_subdomains_sync
        from pathlib import Path
        import json

        try:
            subs = crtsh_subdomains_sync("{{ inputs.target }}", timeout=30.0)
        except:
            subs = []

        out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')
        add_outputs(crtsh_count=len(subs))
      continue-on-error: true
    - name: merge-subs
      script: |
        from pathlib import Path

        subfinder = {{ subdomains(steps["subfinder"].outputs.typed_outputs) | default([], true) | tojson }}
        assetfinder = {{ subdomains(steps["assetfinder"].outputs.typed_outputs) | default([], true) | tojson }}
        findomain = {{ subdomains(steps["findomain"].outputs.typed_outputs) | default([], true) | tojson }}
        crtsh = {{ subdomains(steps["crtsh"].outputs.crtsh_count | default("0", true) | int | string | ternary("", "") | default([], true) | tojson) }}

        try:
            crtsh_file = f'/tmp/ofx_domain_crtsh.txt'
            crtsh_subs = [l.strip() for l in Path(crtsh_file).read_text().splitlines() if l.strip()]
        except:
            crtsh_subs = []

        all_subs = subfinder + assetfinder + findomain + crtsh
        unique = sorted(set(all_subs))

        out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')

        add_outputs(subs_data='\n'.join(unique, sub_count=len(unique))
        print(f'Subdomains: {len(unique)}')
    needs:
    - dns-enum
  verify-subdomains:
    name: Subdomain Verification
    needs:
    - subdomain-discovery
    outputs:
      verified_file: '{{ steps["verify"].outputs.verified_file | default("", true) }}'
      verified_count: '{{ steps["verify"].outputs.verified_count | default("0", true) }}'
    steps:
    - task: dnsx
      log-command: '{{ inputs.log_command }}'
      name: dnsx-verify
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs["subdomain-discovery"].outputs.subs_file }}'
        a: true
        aaaa: true
        cname: true
        resp: true
        rronly: true
        ns: true
      continue-on-error: true
    - name: verify
      script: |
        import json
        from pathlib import Path

        verified = {{ subdomains(steps["dnsx-verify"].outputs.typed_outputs) | default([], true) | tojson }}
        resolved = set()
        for v in {{ steps["dnsx-verify"].outputs.typed_outputs | default([], true) | tojson }}:
            if v.get('value') or v.get('a') or v.get('addr'):
                resolved.add(v.get('host', ''))

        verified_list = sorted(resolved)
        out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')

        add_outputs(verified_data='\n'.join(verified_list, verified_count=len(verified_list))
        print(f'Verified subdomains: {len(verified_list)}')
    needs: []
  web-probe:
    name: Web Service Probe
    needs:
    - verify-subdomains
    outputs:
      live_urls_file: '{{ steps["probe-web"].outputs.live_urls_file | default("", true) }}'
      live_count: '{{ steps["probe-web"].outputs.live_count | default("0", true) }}'
    steps:
    - task: httpx
      log-command: '{{ inputs.log_command }}'
      name: httpx-probe
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs["verify-subdomains"].outputs.verified_file }}'
        ports: 80,443,8080,8443,3000,5000
        json: true
        title: true
        tech_detect: true
        status: true
        follow_redirects: true
        silent: true
      continue-on-error: true
    - name: probe-web
      script: |
        import json
        from pathlib import Path

        probes = {{ steps["httpx-probe"].outputs.typed_outputs | default([], true) | tojson }}
        live = [p for p in probes if p.get('url') and p.get('status_code')]

        out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')

        add_outputs(live_urls_file='\n'.join(l['url'] for l in live, live_count=len(live))
        print(f'Live HTTP: {len(live)}')
        for l in live[:10]:
            print(f'  {l.get("status_code")} {l.get("url", "")}')
    needs: []
  takeover-scan:
    name: Subdomain Takeover Check
    needs:
    - verify-subdomains
    steps:
    - task: subzy
      log-command: '{{ inputs.log_command }}'
      name: subzy-takeover
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs["verify-subdomains"].outputs.verified_file }}'
      continue-on-error: true
    - task: dnstake
      log-command: '{{ inputs.log_command }}'
      name: dnstake-takeover
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs["verify-subdomains"].outputs.verified_file }}'
      continue-on-error: true
    - name: report-takeovers
      script: |
        subzy = {{ vulns(steps["subzy-takeover"].outputs.typed_outputs) | default([], true) | tojson }}
        dnstake = {{ vulns(steps["dnstake-takeover"].outputs.typed_outputs) | default([], true) | tojson }}

        all_takeovers = subzy + dnstake
        import json
        from pathlib import Path

        out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')

        add_outputs(takeover_count=len(all_takeovers), takeovers_data=json.dumps(all_takeovers, indent=2, default=str)
        if all_takeovers:
            print(f'POSSIBLE TAKEOVERS: {len(all_takeovers)}')
            for t in all_takeovers:
                print(f'  {t.get("host", "")} - {t.get("name", "")}')
        else:
            print('No takeover vulnerabilities detected')
    needs: []
  port-scan:
    name: Port Scanning
    needs:
    - verify-subdomains
    steps:
    - task: naabu
      log-command: '{{ inputs.log_command }}'
      name: naabu-scan
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs["verify-subdomains"].outputs.verified_file }}'
        ports: top-1000
        rate: 3000
        silent: true
      continue-on-error: true
    - task: rustscan
      log-command: '{{ inputs.log_command }}'
      name: rustscan-scan
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
        range: 1-10000
        silent: true
      continue-on-error: true
    - name: report-ports
      script: |
        ports = {{ ports(steps["naabu-scan"].outputs.typed_outputs) | default([], true) | tojson }}
        ports += {{ ports(steps["rustscan-scan"].outputs.typed_outputs) | default([], true) | tojson }}

        seen = set()
        port_lines = []
        for p in ports:
            key = f"{p.get('host', p.get('ip', ''))}:{p.get('port', '')}"
            if key not in seen and p.get('port'):
                seen.add(key)
                port_lines.append(key)

        add_outputs(port_count=len(port_lines))
        print(f'Open ports: {len(port_lines)}')
        for pl in sorted(port_lines)[:15]:
            print(f'  {pl}')
    needs: []
  vuln-scan:
    name: Vulnerability Scanning
    needs:
    - web-probe
    steps:
    - task: nuclei
      log-command: '{{ inputs.log_command }}'
      name: nuclei-web
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs["web-probe"].outputs.live_urls_file }}'
        severity: critical,high,medium
      continue-on-error: true
    - task: nuclei
      log-command: '{{ inputs.log_command }}'
      name: nuclei-takeover
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs["verified-subdomains"].outputs.verified_file if true else inputs.target }}'
        tags: takeover,subdomain-takeover
      continue-on-error: true
    - task: dalfox
      log-command: '{{ inputs.log_command }}'
      name: dalfox-xss
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs["web-probe"].outputs.live_urls_file }}'
      continue-on-error: true
    - name: report-vulns
      script: |
        all = (
            {{ vulns(steps["nuclei-web"].outputs.typed_outputs) | default([], true) | tojson }} +
            {{ vulns(steps["nuclei-takeover"].outputs.typed_outputs) | default([], true) | tojson }} +
            {{ vulns(steps["dalfox-xss"].outputs.typed_outputs) | default([], true) | tojson }}
        )
        critical = len([v for v in all if v.get('severity') == 'critical'])
        high = len([v for v in all if v.get('severity') == 'high'])
        add_outputs(vuln_count=len(all), critical_count=critical, high_count=high)
        print(f'Vulnerabilities: {len(all)} (C:{critical} H:{high})')
    needs: []
  summary:
    name: Domain Scan Summary
    needs:
    - dns-enum
    - subdomain-discovery
    - verify-subdomains
    - web-probe
    - takeover-scan
    - port-scan
    - vuln-scan
    steps:
    - name: report
      run: |
        echo "======================================================"
        echo " DOMAIN SCAN: {{ inputs.target }}"
        echo "======================================================"
        echo ""
        echo "DNS Records: {{ jobs['dns-enum'].outputs.record_count }}"
        echo "Subdomains: {{ jobs['subdomain-discovery'].outputs.sub_count }}"
        echo "Verified: {{ jobs['verify-subdomains'].outputs.verified_count }}"
        echo "Live HTTP: {{ jobs['web-probe'].outputs.live_count }}"
        echo "Open Ports: {{ jobs['port-scan'].outputs.port_count }}"
        echo "Vulnerabilities: {{ jobs['vuln-scan'].outputs.vuln_count }}"
        echo "  Critical: {{ jobs['vuln-scan'].outputs.critical_count }}"
        echo "  High: {{ jobs['vuln-scan'].outputs.high_count }}"
        echo ""
        echo "Output files in \$OFX_RUN_DIR:"
        echo "  DNS: ofx_domain_dns.json"
        echo "  Subdomains: ofx_domain_subs.txt"
        echo "  Verified: ofx_domain_verified.txt"
        echo "  Live URLs: ofx_domain_live_urls.txt"
        echo "======================================================"
      log-stdout: '{{ inputs.log_output }}'
