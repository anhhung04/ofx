name: email-osint
description: >
  Email address OSINT investigation — check email validity, find

  associated accounts, discover breaches, and gather related

  information for a target email address.
tags:
- osint
- email
- recon
- breach
dispatch:
  inputs:
    log_command:
      type: string
      default: 'true'
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: 'true'
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Email address to investigate
      alias: t
defaults:
  store-creds: true
jobs:
  investigate:
    name: Email Investigation
    outputs:
      email: '{{ steps["email-analysis"].outputs.email | default("", true) }}'
      local_part: '{{ steps["email-analysis"].outputs.local_part | default("", true) }}'
      domain: '{{ steps["email-analysis"].outputs.domain | default("", true) }}'
      pattern: '{{ steps["email-analysis"].outputs.pattern | default("", true) }}'
      possible_first: '{{ steps["email-analysis"].outputs.possible_first | default("", true) }}'
      possible_last: '{{ steps["email-analysis"].outputs.possible_last | default("", true) }}'
      mx: '{{ steps["email-analysis"].outputs.mx | default("", true) }}'
    steps:
    - task: holehe
      name: account-discovery
      with:
        target: '{{ inputs.target }}'
      log-stdout: '{{ inputs.log_output | default(true) }}'
      log-command: '{{ inputs.log_command | default(true) }}'
      continue-on-error: true
    - task: h8mail
      name: breach-search
      with:
        target: '{{ inputs.target }}'
      log-stdout: '{{ inputs.log_output | default(true) }}'
      log-command: '{{ inputs.log_command | default(true) }}'
      continue-on-error: true
    - name: email-analysis
      script: "import re\nimport subprocess\n\nemail = '{{ inputs.target }}'\nlocal, domain = email.split('@') if '@' in email else (email, '')\n\nprint(f\"=== EMAIL OSINT: {email} ===\\n\")\n\nresults\
        \ = {}\nresults['email'] = email\nresults['local_part'] = local\nresults['domain'] = domain\n\nprint(\"--- Format Analysis ---\")\npatterns = {\n    'firstname.lastname': r'^[a-z]+\\.[a-z]+$',\n\
        \    'firstlast': r'^[a-z]{2,}[a-z]{2,}$',\n    'f.lastname': r'^[a-z]\\.[a-z]+$',\n    'first_last': r'^[a-z]+_[a-z]+$',\n}\nfor name, pattern in patterns.items():\n    if re.match(pattern, local,\
        \ re.IGNORECASE):\n        results['pattern'] = name\n        print(f\"  Pattern: {name}\")\n        if '.' in local:\n            parts = local.split('.')\n            results['possible_first']\
        \ = parts[0].capitalize()\n            results['possible_last'] = parts[-1].capitalize()\n            print(f\"  Possible name: {parts[0].capitalize()} {parts[-1].capitalize()}\")\n        break\n\
        \nprint(f\"\\n--- Domain: {domain} ---\")\ntry:\n    proc = subprocess.run(['dig', '+short', 'MX', domain], capture_output=True, text=True, timeout=10)\n    mx = proc.stdout.strip()\n    if mx:\n\
        \        results['mx'] = mx\n        print(f\"  MX: {mx}\")\n        if 'google' in mx.lower():\n            print(\"  Provider: Google Workspace\")\n        elif 'outlook' in mx.lower() or 'microsoft'\
        \ in mx.lower():\n            print(\"  Provider: Microsoft 365\")\n        elif 'protonmail' in mx.lower():\n            print(\"  Provider: ProtonMail\")\nexcept Exception:\n    pass\n\ntry:\n\
        \    proc = subprocess.run(['dig', '+short', 'TXT', domain], capture_output=True, text=True, timeout=10)\n    for line in proc.stdout.splitlines():\n        if 'spf' in line.lower():\n         \
        \   print(f\"  SPF: {line.strip()[:80]}\")\n    proc = subprocess.run(['dig', '+short', 'TXT', f'_dmarc.{domain}'], capture_output=True, text=True, timeout=10)\n    dmarc = proc.stdout.strip()\n\
        \    if dmarc:\n        print(f\"  DMARC: {dmarc[:80]}\")\nexcept Exception:\n    pass\n\nprint(f\"\\n--- Search Dorks ---\")\ndorks = [\n    f'\"{email}\"',\n    f'\"{email}\" site:linkedin.com',\n\
        \    f'\"{email}\" site:github.com',\n    f'\"{local}\" site:{domain}',\n    f'intext:\"{email}\" filetype:pdf',\n]\nfor d in dorks:\n    print(f\"  Google: {d}\")\n\nadd_outputs(**results)\n"
      log-stdout: '{{ inputs.log_output | default(true) }}'
      log-command: '{{ inputs.log_command | default(true) }}'
