name: bug-bounty-recon
description: >
  Bug bounty reconnaissance pipeline — comprehensive target enumeration combining

  subdomain discovery, DNS verification, HTTP probing, port scanning, per-host deep

  scan (via host-scan matrix), URL crawling, JS analysis, parameter mining,

  vulnerability testing (XSS/SQLi/CMDi/CRLF/SSRF/SSTI), secret scanning, and

  takeover checking — optimized for bug bounty programs.
tags:
- scan
- bugbounty
- recon
- web
- vuln
dispatch:
  inputs:
    log_command:
      type: string
      default: 'true'
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: 'true'
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Target domain (e.g. example.com)
      alias: t
defaults:
  store-creds: true
jobs:
  subdomain-discovery:
    name: Subdomain Discovery & Verification
    outputs:
      verified_file: '{{ steps["export-verified"].outputs.verified_file | default("", true) }}'
      verified_count: '{{ steps["export-verified"].outputs.verified_count | default("0", true) }}'
      verified_hosts_json: '{{ steps["export-verified"].outputs.verified_hosts_json | default("[]", true) }}'
      live_urls_file: '{{ steps["export-live-urls"].outputs.live_urls_file | default("", true) }}'
      live_urls_json: '{{ steps["export-live-urls"].outputs.live_urls_json | default("[]", true) }}'
    steps:
    - task: subfinder
      log-command: '{{ inputs.log_command | default(true) }}'
      name: subfinder-scan
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
        all: true
      continue-on-error: true
    - task: amass
      log-command: '{{ inputs.log_command | default(true) }}'
      name: amass-passive
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - task: tlsx
      log-command: '{{ inputs.log_command | default(true) }}'
      name: tls-san-enum
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
        san: true
        port: 443,8443
      continue-on-error: true
    - name: merge-subs
      script: "import json\nfrom pathlib import Path\n\nbase = '{{ inputs.target }}'\nsubs = {base}\nall_typed = (\n    {{ subdomains(steps[\"subfinder-scan\"].outputs.typed_outputs) | default([], true)\
        \ | tojson }} +\n    {{ subdomains(steps[\"amass-passive\"].outputs.typed_outputs) | default([], true) | tojson }} +\n    {{ subdomains(steps[\"tls-san-enum\"].outputs.typed_outputs) | default([],\
        \ true) | tojson }}\n)\nfor item in all_typed:\n    h = item.get('host', '')\n    if h and (h.endswith(f'.{base}') or h == base):\n        subs.add(h)\n\nsubs_path = f'{os.environ.get(\"OFX_RUN_DIR\"\
        , \"/tmp\")}/ofx_bb_subs.txt'\nPath(subs_path).write_text('\\n'.join(sorted(subs)))\nadd_outputs(subs_file=subs_path, sub_count=len(subs))\nprint(f\"Collected {len(subs)} unique subdomains\")\n"
    - task: dnsx
      log-command: "{{ inputs.log_command | default(true) }}"
      name: dns-verify
      retry: 2
      retry-delay: 5
      with:
        target: '{{ steps[''merge-subs''].outputs.subs_file }}'
        a: true
        cname: true
        resp: true
        wildcard: true
        wildcard_domain: '{{ inputs.target }}'
      continue-on-error: true
    - name: export-verified
      script: "import json, socket, string, random\nfrom pathlib import Path\n\nbase = '{{ inputs.target }}'\nverified = set()\nfor item in {{ subdomains(steps[\"dns-verify\"].outputs.typed_outputs) | default([],\
        \ true) | tojson }}:\n    if item.get('host'):\n        verified.add(item['host'])\n\nwildcard_ips = set()\ntry:\n    resolved = []\n    for _ in range(3):\n        rand = ''.join(random.choices(string.ascii_lowercase,\
        \ k=12))\n        try:\n            ips = {r[4][0] for r in socket.getaddrinfo(f\"{rand}.{base}\", None, socket.AF_INET)}\n            resolved.append(ips)\n        except socket.gaierror:\n   \
        \         resolved.append(set())\n    if len(resolved) == 3 and all(resolved):\n        common = resolved[0] & resolved[1] & resolved[2]\n        if common:\n            wildcard_ips = common\n\
        \            print(f\"Wildcard DNS detected: {wildcard_ips}\")\nexcept Exception:\n    pass\n\nif wildcard_ips:\n    filtered = set()\n    for host in verified:\n        try:\n            host_ips\
        \ = {r[4][0] for r in socket.getaddrinfo(host, None, socket.AF_INET)}\n            if not host_ips.issubset(wildcard_ips):\n                filtered.add(host)\n        except socket.gaierror:\n\
        \            filtered.add(host)\n    removed = len(verified) - len(filtered)\n    if removed:\n        print(f\"Filtered {removed} wildcard hosts\")\n    verified = filtered\n\nverified_list = sorted(verified)\n\
        verified_path = f'{os.environ.get(\"OFX_RUN_DIR\", \"/tmp\")}/ofx_bb_verified.txt'\nPath(verified_path).write_text('\\n'.join(verified_list))\nadd_outputs(\n    verified_file=verified_path,\n  \
        \  verified_count=len(verified_list),\n    verified_hosts_json=json.dumps(verified_list),\n)\nprint(f\"Verified: {len(verified_list)} live hosts\")\n"
    - task: httpx
      log-command: "{{ inputs.log_command | default(true) }}"
      name: http-probe
      retry: 2
      retry-delay: 5
      with:
        target: '{{ steps[''export-verified''].outputs.verified_file }}'
        tech_detect: true
        status_code: true
        title: true
        follow_redirects: true
      continue-on-error: true
    - name: export-live-urls
      script: "import json\nfrom pathlib import Path\n\nlive = []\nseen_hosts = set()\nfor item in {{ urls(steps[\"http-probe\"].outputs.typed_outputs) | default([], true) | tojson }}:\n    url = item.get('url',\
        \ '')\n    if not url or item.get('status_code', 0) <= 0:\n        continue\n    from urllib.parse import urlparse\n    host = urlparse(url).hostname\n    if host and host not in seen_hosts:\n \
        \       seen_hosts.add(host)\n        live.append(url)\n\nlive_path = f'{os.environ.get(\"OFX_RUN_DIR\", \"/tmp\")}/ofx_bb_live_urls.txt'\nPath(live_path).write_text('\\n'.join(live))\nadd_outputs(live_urls_file=live_path,\
        \ live_urls_json=json.dumps(live))\nprint(f\"Live HTTP services: {len(live)}\")\n"
    needs: []
  takeover-check:
    name: Subdomain Takeover Detection
    needs:
    - subdomain-discovery
    outputs:
      takeover_count: '{{ steps["collect-takeovers"].outputs.takeover_count | default("0", true) }}'
    steps:
    - task: subzy
      log-command: '{{ inputs.log_command | default(true) }}'
      name: subzy-check
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs[''subdomain-discovery''].outputs.verified_file }}'
      continue-on-error: true
    - task: nuclei
      log-command: '{{ inputs.log_command | default(true) }}'
      name: nuclei-takeover
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs[''subdomain-discovery''].outputs.live_urls_file }}'
        tags: subdomain-takeover,takeover,dns
      continue-on-error: true
    - name: collect-takeovers
      script: "items = (\n    {{ vulns(steps[\"nuclei-takeover\"].outputs.typed_outputs) | default([], true) | tojson }} +\n    {{ steps[\"subzy-check\"].outputs.typed_outputs | default([], true) | tojson\
        \ }}\n)\ncount = sum(1 for i in items if i.get('_type') in ('vulnerability',) or i.get('vulnerable'))\nadd_outputs(takeover_count=count)\nprint(f\"Takeover candidates: {count}\")\n"
  per-host-scan:
    name: 'Bug Bounty Host: {{ matrix.target }}'
    needs:
    - subdomain-discovery
    strategy:
      matrix:
        target: '{{ jobs[''subdomain-discovery''].outputs.verified_hosts_json }}'
      max_parallel: 5
      fail_fast: false
    steps:
    - name: scan-host
      log-command: '{{ inputs.log_command | default(true) }}'
      uses: host-scan
      with:
        target: '{{ matrix.target }}'
  port-scan:
    name: Port Scanning
    needs:
    - subdomain-discovery
    outputs:
      port_count: '{{ steps["export-ports"].outputs.port_count | default("0", true) }}'
      ports_file: '{{ steps["export-ports"].outputs.ports_file | default("", true) }}'
    steps:
    - task: naabu
      log-command: "{{ inputs.log_command | default(true) }}"
      name: naabu-scan
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs[''subdomain-discovery''].outputs.verified_file }}'
        top_ports: '1000'
        rate: 1000
      continue-on-error: true
    - name: export-ports
      script: "import json\nfrom pathlib import Path\n\nports = {{ ports(steps[\"naabu-scan\"].outputs.typed_outputs) | default([], true) | tojson }}\nlines = []\nfor p in ports:\n    host = p.get('host',\
        \ '')\n    port = p.get('port', '')\n    if host and port:\n        lines.append(f\"{host}:{port}\")\n\nports_path = f'{os.environ.get(\"OFX_RUN_DIR\", \"/tmp\")}/ofx_bb_ports.txt'\nPath(ports_path).write_text('\\\
        n'.join(lines))\nadd_outputs(port_count=len(lines), ports_file=ports_path)\nprint(f\"Open ports discovered: {len(lines)}\")\n"
  param-mine:
    name: Parameter Mining
    needs:
    - subdomain-discovery
    outputs:
      param_file: '{{ steps["collect-params"].outputs.param_file | default("", true) }}'
      param_url_count: '{{ steps["collect-params"].outputs.param_url_count | default("0", true) }}'
    steps:
    - task: paramspider
      log-command: '{{ inputs.log_command | default(true) }}'
      name: paramspider-mine
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - task: gau
      log-command: '{{ inputs.log_command | default(true) }}'
      name: gau-params
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
        subs: true
      continue-on-error: true
    - task: arjun
      log-command: '{{ inputs.log_command | default(true) }}'
      name: arjun-discover
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs[''subdomain-discovery''].outputs.live_urls_file }}'
      continue-on-error: true
    - name: collect-params
      script: "import json\nfrom pathlib import Path\n\nparam_urls = set()\nfor item in {{ urls(steps[\"paramspider-mine\"].outputs.typed_outputs) | default([], true) | tojson }}:\n    url = item.get('url',\
        \ '')\n    if url and '=' in url:\n        param_urls.add(url)\nfor item in {{ urls(steps[\"gau-params\"].outputs.typed_outputs) | default([], true) | tojson }}:\n    url = item.get('url', '')\n\
        \    if url and '=' in url:\n        param_urls.add(url)\nfor item in {{ tags(steps[\"arjun-discover\"].outputs.typed_outputs) | default([], true) | tojson }}:\n    param_urls.add(item.get('value',\
        \ ''))\n\nparam_urls.discard('')\nparams_path = f'{os.environ.get(\"OFX_RUN_DIR\", \"/tmp\")}/ofx_bb_params.txt'\nPath(params_path).write_text('\\n'.join(sorted(param_urls)))\nadd_outputs(param_file=params_path,\
        \ param_url_count=len(param_urls))\nprint(f\"Parameterized URLs collected: {len(param_urls)}\")\n"
  url-crawl:
    name: URL Crawling & JS Analysis
    needs:
    - subdomain-discovery
    outputs:
      crawled_file: '{{ steps["merge-crawled"].outputs.crawled_file | default("", true) }}'
      crawled_count: '{{ steps["merge-crawled"].outputs.crawled_count | default("0", true) }}'
      js_findings: '{{ steps["merge-crawled"].outputs.js_findings | default("0", true) }}'
    steps:
    - task: katana
      log-command: "{{ inputs.log_command | default(true) }}"
      name: katana-crawl
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs[''subdomain-discovery''].outputs.live_urls_file }}'
        depth: 3
        js_crawl: true
      continue-on-error: true
    - task: waymore
      log-command: "{{ inputs.log_command | default(true) }}"
      name: waymore-crawl
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - task: jsluice
      log-command: "{{ inputs.log_command | default(true) }}"
      name: jsluice-scan
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs[''subdomain-discovery''].outputs.live_urls_file }}'
      continue-on-error: true
    - name: merge-crawled
      script: "import json\nfrom pathlib import Path\n\ncrawled = set()\nfor source in [\n    {{ urls(steps[\"katana-crawl\"].outputs.typed_outputs) | default([], true) | tojson }},\n    {{ urls(steps[\"\
        waymore-crawl\"].outputs.typed_outputs) | default([], true) | tojson }},\n]:\n    for item in source:\n        url = item.get('url', '')\n        if url:\n            crawled.add(url)\n\njs_items\
        \ = (\n    {{ urls(steps[\"jsluice-scan\"].outputs.typed_outputs) | default([], true) | tojson }} +\n    {{ tags(steps[\"jsluice-scan\"].outputs.typed_outputs) | default([], true) | tojson }}\n\
        )\n\ncrawled_path = f'{os.environ.get(\"OFX_RUN_DIR\", \"/tmp\")}/ofx_bb_crawled.txt'\nPath(crawled_path).write_text('\\n'.join(sorted(crawled)))\nadd_outputs(crawled_file=crawled_path, crawled_count=len(crawled),\
        \ js_findings=len(js_items))\nprint(f\"Crawled URLs: {len(crawled)}, JS findings: {len(js_items)}\")\n"
  vuln-scan:
    name: XSS / SQLi / CMDi / CRLF / SSRF / SSTI Scanning
    needs:
    - param-mine
    outputs:
      xss_count: '{{ steps["collect-results"].outputs.xss_count | default("0", true) }}'
      sqli_count: '{{ steps["collect-results"].outputs.sqli_count | default("0", true) }}'
      cmdi_count: '{{ steps["collect-results"].outputs.cmdi_count | default("0", true) }}'
      crlf_count: '{{ steps["collect-results"].outputs.crlf_count | default("0", true) }}'
      ssrf_count: '{{ steps["collect-results"].outputs.ssrf_count | default("0", true) }}'
      ssti_count: '{{ steps["collect-results"].outputs.ssti_count | default("0", true) }}'
      nuclei_count: '{{ steps["collect-results"].outputs.nuclei_count | default("0", true) }}'
    steps:
    - task: nuclei
      log-command: '{{ inputs.log_command | default(true) }}'
      name: nuclei-scan
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs[''subdomain-discovery''].outputs.live_urls_file }}'
        severity: critical,high,medium
      continue-on-error: true
    - task: dalfox
      log-command: '{{ inputs.log_command | default(true) }}'
      name: dalfox-xss
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs[''param-mine''].outputs.param_file | default(jobs[''subdomain-discovery''].outputs.live_urls_file, true) }}'
      continue-on-error: true
    - task: crlfuzz
      log-command: "{{ inputs.log_command | default(true) }}"
      name: crlfuzz-scan
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs[''subdomain-discovery''].outputs.live_urls_file }}'
      continue-on-error: true
    - task: sqlmap
      log-command: "{{ inputs.log_command | default(true) }}"
      name: sqlmap-scan
      retry: 2
      retry-delay: 5
      run_if: '{{ jobs[''param-mine''].outputs.param_url_count | default(0, true) | int > 0 }}'
      with:
        target: '{{ jobs[''param-mine''].outputs.param_file }}'
        batch: true
        level: 2
        risk: 2
      continue-on-error: true
    - task: commix
      log-command: "{{ inputs.log_command | default(true) }}"
      name: commix-scan
      retry: 2
      retry-delay: 5
      run_if: '{{ jobs[''param-mine''].outputs.param_url_count | default(0, true) | int > 0 }}'
      with:
        target: '{{ jobs[''param-mine''].outputs.param_file }}'
        batch: true
        level: 2
      continue-on-error: true
    - task: ssrfmap
      log-command: "{{ inputs.log_command | default(true) }}"
      name: ssrfmap-scan
      retry: 2
      retry-delay: 5
      run_if: '{{ jobs[''param-mine''].outputs.param_url_count | default(0, true) | int > 0 }}'
      with:
        target: '{{ jobs[''param-mine''].outputs.param_file }}'
      continue-on-error: true
    - task: tinja
      log-command: "{{ inputs.log_command | default(true) }}"
      name: tinja-scan
      retry: 2
      retry-delay: 5
      run_if: '{{ jobs[''param-mine''].outputs.param_url_count | default(0, true) | int > 0 }}'
      with:
        target: '{{ jobs[''param-mine''].outputs.param_file }}'
      continue-on-error: true
    - name: collect-results
      script: "nuclei_vulns = {{ vulns(steps[\"nuclei-scan\"].outputs.typed_outputs) | default([], true) | tojson }}\nxss_vulns = {{ vulns(steps[\"dalfox-xss\"].outputs.typed_outputs) | default([], true)\
        \ | tojson }}\ncrlf_vulns = {{ vulns(steps[\"crlfuzz-scan\"].outputs.typed_outputs) | default([], true) | tojson }}\nsqli_vulns = {{ vulns(steps[\"sqlmap-scan\"].outputs.typed_outputs) | default([],\
        \ true) | tojson }}\ncmdi_vulns = {{ vulns(steps[\"commix-scan\"].outputs.typed_outputs) | default([], true) | tojson }}\nssrf_vulns = {{ vulns(steps[\"ssrfmap-scan\"].outputs.typed_outputs) | default([],\
        \ true) | tojson }}\nssti_vulns = {{ vulns(steps[\"tinja-scan\"].outputs.typed_outputs) | default([], true) | tojson }}\nadd_outputs(\n    nuclei_count=len(nuclei_vulns),\n    xss_count=len(xss_vulns),\n\
        \    crlf_count=len(crlf_vulns),\n    sqli_count=len(sqli_vulns),\n    cmdi_count=len(cmdi_vulns),\n    ssrf_count=len(ssrf_vulns),\n    ssti_count=len(ssti_vulns),\n)\ncritical = [v for v in nuclei_vulns\
        \ if v.get('severity') == 'critical']\nhigh = [v for v in nuclei_vulns if v.get('severity') == 'high']\nprint(f\"Nuclei: {len(nuclei_vulns)} (C:{len(critical)} H:{len(high)})\")\nprint(f\"XSS: {len(xss_vulns)}\
        \ | SQLi: {len(sqli_vulns)} | CMDi: {len(cmdi_vulns)}\")\nprint(f\"CRLF: {len(crlf_vulns)} | SSRF: {len(ssrf_vulns)} | SSTI: {len(ssti_vulns)}\")\n"
  secret-scan:
    name: Secret & Exposure Scanning
    needs:
    - subdomain-discovery
    outputs:
      secrets_count: '{{ steps["collect-secrets"].outputs.secrets_count | default("0", true) }}'
    steps:
    - task: nuclei
      log-command: '{{ inputs.log_command | default(true) }}'
      name: nuclei-secrets
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs[''subdomain-discovery''].outputs.live_urls_file }}'
        tags: exposure,token,secret,api-key
      continue-on-error: true
    - task: gitleaks
      log-command: '{{ inputs.log_command | default(true) }}'
      name: gitleaks-scan
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: collect-secrets
      script: 'vulns_out = {{ vulns(steps["nuclei-secrets"].outputs.typed_outputs) | default([], true) | tojson }}

        tags_out = {{ tags(steps["nuclei-secrets"].outputs.typed_outputs) | default([], true) | tojson }}

        leaks = {{ vulns(steps["gitleaks-scan"].outputs.typed_outputs) | default([], true) | tojson }}

        total = len(vulns_out) + len(tags_out) + len(leaks)

        add_outputs(secrets_count=total)

        print(f"Secrets/exposures found: {total}")

        '
