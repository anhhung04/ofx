name: dns-history
description: >
  Passive DNS history enumeration — collects historical DNS data from Wayback Machine,
  common crawl, URLscan, AlienVault OTX and other public archives. Uses waymore and
  gau (getallurls) to extract previously seen URLs, subdomains, and endpoints for
  a target domain.
tags:
  - recon
  - dns
  - history
  - wayback
  - passive
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target domain
      alias: t
    log_command:
      type: string
      default: "true"
      description: Enable command logging
    log_output:
      type: string
      default: "true"
      description: Enable output logging
defaults:
  store-creds: false
outputs:
  history_file: '{{ jobs["collect"].outputs.history_file | default("", true) }}'
  url_count: '{{ jobs["collect"].outputs.url_count | default("0", true) }}'
  typed_outputs: '{{ jobs["collect"].outputs.typed_outputs | default([], true) }}'
jobs:
  discover:
    name: Historical Data Collection
    steps:
      - task: waymore
        log-command: "{{ inputs.log_command | default(true) }}"
        name: waymore-archive
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
          all: true
        continue-on-error: true
      - task: gau
        log-command: "{{ inputs.log_command | default(true) }}"
        name: gau-urls
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
          subs: true
          threads: 50
        continue-on-error: true
      - task: nuclei
        log-command: "{{ inputs.log_command | default(true) }}"
        name: nuclei-dns-history
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
          tags: "dns,passive,history,wayback"
          severity: "info,low"
          rate_limit: 30
          json: true
          silent: true
        continue-on-error: true
  collect:
    name: Collect and Normalize
    needs:
      - discover
    outputs:
      history_file: '{{ steps["merge"].outputs.history_file | default("", true) }}'
      url_count: '{{ steps["merge"].outputs.url_count | default("0", true) }}'
      typed_outputs: '{{ steps["merge"].outputs.typed_outputs | default([], true) }}'
      subdomains_file: '{{ steps["merge"].outputs.subdomains_file | default("", true) }}'
    steps:
      - name: merge
        script: |
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          all_urls = set()
          subdomains = set()
          domain = "{{ inputs.target }}"

          for item in {{ steps["waymore-archive"].outputs.typed_outputs | default([], true) | tojson }}:
            url = item.get('url', '')
            if url:
              all_urls.add(url)
              try:
                hostname = urlparse(url).hostname
                if hostname and domain in hostname:
                  subdomains.add(hostname)
              except:
                pass

          gau_data = {{ steps["gau-urls"].outputs.typed_outputs | default([], true) | tojson }}
          for item in gau_data:
            url = item.get('url', '')
            if url:
              all_urls.add(url)
              try:
                hostname = urlparse(url).hostname
                if hostname and domain in hostname:
                  subdomains.add(hostname)
              except:
                pass

          for vuln in {{ vulns(steps["nuclei-dns-history"].outputs.typed_outputs) | default([], true) | tojson }}:
            host = vuln.get('host', '')
            if host and domain in host:
              subdomains.add(host)

          urls_list = sorted(all_urls)
          subs_list = sorted(subdomains)

          out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')
          history_file = f'{out_dir}/ofx_dns_history_urls.txt'
          Path(history_file).write_text('\\n'.join(urls_list))

          subs_file = f'{out_dir}/ofx_dns_history_subs.txt'
          Path(subs_file).write_text('\\n'.join(subs_list))

          typed = [
            {'url': url, 'source': 'wayback'} for url in urls_list[:10000]
          ]

          add_outputs(
            history_file=history_file,
            url_count=len(urls_list),
            subdomains_file=subs_file,
            subdomain_count=len(subs_list),
            typed_outputs=typed
          )
          print(f'DNS history: {len(urls_list)} URLs, {len(subs_list)} subdomains')
  summary:
    name: Summary
    needs:
      - collect
    steps:
      - name: report
        run: |
          echo "=========================================="
          echo " PASSIVE DNS HISTORY RESULTS"
          echo "=========================================="
          echo ""
          echo "Target: {{ inputs.target }}"
          echo "Historical URLs: {{ jobs.collect.outputs.url_count | default('0', true) }}"
          echo "Historical subdomains: {{ jobs.collect.outputs.subdomain_count | default('0', true) }}"
          echo "=========================================="
        log-stdout: "{{ inputs.log_output | default(true) }}"
