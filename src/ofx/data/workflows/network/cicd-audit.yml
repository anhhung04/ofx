name: cicd-audit
description: >
  CI/CD pipeline security audit — scan GitHub Actions workflows

  for injection vulnerabilities, misconfigured permissions, and

  repository security posture issues using poutine and legitify.
tags:
- cicd
- github
- security
- audit
dispatch:
  inputs:
    log_command:
      type: string
      default: 'true'
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: 'true'
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: GitHub org or org/repo to scan
      alias: t
    token:
      type: string
      default: ''
      description: GitHub token for API access
jobs:
  pipeline-scan:
    name: CI/CD Pipeline Scan
    outputs:
      finding_count: '{{ steps["poutine-scan"].outputs.finding_count | default("", true) }}'
      typed_outputs: '{{ steps["poutine-scan"].outputs.typed_outputs | default([], true) }}'
    steps:
    - task: poutine
      log-command: '{{ inputs.log_command | default(true) }}'
      name: poutine-scan
      with:
        target: '{{ inputs.target }}'
        token: '{{ inputs.token or "" }}'
      continue-on-error: true
    needs: []
  posture-check:
    name: SCM Posture Check
    outputs:
      finding_count: '{{ steps["legitify-scan"].outputs.finding_count | default("", true) }}'
      typed_outputs: '{{ steps["legitify-scan"].outputs.typed_outputs | default([], true) }}'
    steps:
    - task: legitify
      log-command: '{{ inputs.log_command | default(true) }}'
      name: legitify-scan
      with:
        target: '{{ inputs.target }}'
        token: '{{ inputs.token or "" }}'
      continue-on-error: true
    needs: []
