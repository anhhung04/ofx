name: url-discovery
description: >
  URL crawling and discovery pipeline. Collects URLs via katana (headless JS-aware crawling),
  waymore (web archive), gau (common crawl), and paramspider (parameter mining).
  Merges all sources, extracts JavaScript files, deduplicates, and outputs
  both general URLs and parameterized URLs for vuln scanning.
tags:
- recon
- url
- crawl
- params
- js
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target domain, URL file, or live URL list
      alias: t
    scope:
      type: string
      default: ''
      description: 'Scope regex for crawling (default: target domain)'
    live_urls_file:
      type: string
      default: ''
      description: Pre-discovered live URL file
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
    log_output:
      type: string
      default: 'true'
      description: Enable output logging
defaults:
  store-creds: true
jobs:
  crawl-active:
    name: Active URL Crawling
    outputs:
      katana_urls_file: '{{ steps["merge-katana"].outputs.urls_file | default("", true) }}'
      katana_count: '{{ steps["merge-katana"].outputs.url_count | default("0", true) }}'
    steps:
    - task: katana
      log-command: '{{ inputs.log_command }}'
      name: katana-crawl
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.live_urls_file if inputs.live_urls_file else inputs.target }}'
        depth: 3
        js_crawl: true
        headless: true
        scope: '{{ inputs.scope if inputs.scope else inputs.target }}'
        known_files: all
        automatic_form_fill: true
        rate_limit: 20
        delay: 100
      continue-on-error: true
    - task: gospider
      log-command: '{{ inputs.log_command }}'
      name: gospider-crawl
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.live_urls_file if inputs.live_urls_file else inputs.target }}'
        depth: 3
        threads: 5
        include_other: true
        include_subs: true
      continue-on-error: true
    - name: merge-katana
      script: |
        from pathlib import Path

        katana = {{ urls(steps["katana-crawl"].outputs.typed_outputs) | default([], true) | tojson }}
        gospider = {{ urls(steps["gospider-crawl"].outputs.typed_outputs) | default([], true) | tojson }}

        all_urls = {u.get('url', '') for u in katana + gospider if u.get('url')}
        js_urls = [u for u in all_urls if '.js' in u.lower()]

        out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')

        add_outputs(urls_data='\n'.join(sorted(all_urls, url_count=len(all_urls), js_count=len(js_urls))
        print(f'Active crawl: {len(all_urls)} URLs ({len(js_urls)} JS files)')
    needs: []
  crawl-passive:
    name: Passive URL Collection
    outputs:
      passive_urls_file: '{{ steps["merge-passive"].outputs.urls_file | default("", true) }}'
      passive_count: '{{ steps["merge-passive"].outputs.url_count | default("0", true) }}'
    steps:
    - task: waymore
      log-command: '{{ inputs.log_command }}'
      name: waymore-archive
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
        mode: U
        limit: 1000
      continue-on-error: true
    - task: gau
      log-command: '{{ inputs.log_command }}'
      name: gau-archive
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
        subs: true
      continue-on-error: true
    - name: merge-passive
      script: |
        from pathlib import Path

        waymore = {{ urls(steps["waymore-archive"].outputs.typed_outputs) | default([], true) | tojson }}
        gau = {{ urls(steps["gau-archive"].outputs.typed_outputs) | default([], true) | tojson }}

        all_urls = {u.get('url', '') for u in waymore + gau if u.get('url')}

        out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')

        add_outputs(urls_data='\n'.join(sorted(all_urls, url_count=len(all_urls))
        print(f'Passive URL collection: {len(all_urls)} URLs')
    needs: []
  param-mining:
    name: Parameter Discovery
    needs:
    - crawl-active
    - crawl-passive
    outputs:
      param_urls_file: '{{ steps["merge-params"].outputs.param_file | default("", true) }}'
      param_count: '{{ steps["merge-params"].outputs.param_count | default("0", true) }}'
    steps:
    - task: paramspider
      log-command: '{{ inputs.log_command }}'
      name: paramspider-mine
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - task: arjun
      log-command: '{{ inputs.log_command }}'
      name: arjun-discover
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.live_urls_file if inputs.live_urls_file else inputs.target }}'
        threads: 10
      continue-on-error: true
    - name: merge-params
      script: |
        from pathlib import Path
        from urllib.parse import urlparse

        param_urls = set()
        for item in (
            {{ urls(steps["paramspider-mine"].outputs.typed_outputs) | default([], true) | tojson }} +
            {{ urls(steps["arjun-discover"].outputs.typed_outputs) | default([], true) | tojson }}
        ):
            u = item.get('url', '')
            if u and '=' in urlparse(u).query:
                param_urls.add(u)

        out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')

        add_outputs(param_data='\n'.join(sorted(param_urls, param_count=len(param_urls))
        print(f'Parameter mining: {len(param_urls)} parameterized URLs')
    needs: []
  js-analysis:
    name: JavaScript Analysis
    needs:
    - crawl-active
    steps:
    - task: jsluice
      log-command: '{{ inputs.log_command }}'
      name: jsluice-analyze
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: report-js
      script: |
        js_results = {{ steps["jsluice-analyze"].outputs.typed_outputs | default([], true) | tojson }}
        secrets = [j for j in js_results if j.get('type') == 'secret']
        endpoints = [j for j in js_results if j.get('type') == 'endpoint']
        add_outputs(js_secrets=len(secrets), js_endpoints=len(endpoints))
        print(f'JS analysis: {len(endpoints)} endpoints, {len(secrets)} secrets found')
    needs: []
  merge-all:
    name: Merge All URL Sources
    needs:
    - crawl-active
    - crawl-passive
    - param-mining
    outputs:
      all_urls_file: '{{ steps["export-all"].outputs.all_urls_file | default("", true) }}'
      all_count: '{{ steps["export-all"].outputs.all_count | default("0", true) }}'
      js_file: '{{ steps["export-all"].outputs.js_file | default("", true) }}'
      js_count: '{{ steps["export-all"].outputs.js_count | default("0", true) }}'
    steps:
    - name: export-all
      script: |
        from pathlib import Path

        katana_file = '{{ jobs["crawl-active"].outputs.katana_urls_file | default("", true) }}'
        passive_file = '{{ jobs["crawl-passive"].outputs.passive_urls_file | default("", true) }}'

        all_urls = set()
        for fpath in [katana_file, passive_file]:
            if fpath and Path(fpath).is_file():
                for line in Path(fpath).read_text().splitlines():
                    if line.strip():
                        all_urls.add(line.strip())

        js_urls = [u for u in all_urls if '.js' in u.lower()]

        out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')

        add_outputs(all_urls_file='\n'.join(sorted(all_urls, all_count=len(all_urls), js_data='\n'.join(sorted(js_urls, js_count=len(js_urls))
        print(f'Total unique URLs: {len(all_urls)} ({len(js_urls)} JS files)')
    needs: []
  summary:
    name: URL Discovery Summary
    needs:
    - merge-all
    - param-mining
    - js-analysis
    steps:
    - name: report
      run: |
        echo "======================================================"
        echo " URL DISCOVERY: {{ inputs.target }}"
        echo "======================================================"
        echo "  Total URLs: {{ jobs['merge-all'].outputs.all_count }}"
        echo "  JS files: {{ jobs['merge-all'].outputs.js_count }}"
        echo "  Parameterized URLs: {{ jobs['param-mining'].outputs.param_count }}"
        echo ""
        echo "  All URLs: {{ jobs['merge-all'].outputs.all_urls_file }}"
        echo "  JS files: {{ jobs['merge-all'].outputs.js_file }}"
        echo "  Params: {{ jobs['param-mining'].outputs.param_urls_file }}"
        echo "======================================================"
      log-stdout: '{{ inputs.log_output }}'
