name: firebase-check
description: >
  Firebase and Firestore security check — scans for publicly accessible Firebase
  databases, Firestore instances, and Firebase-related misconfigurations. Uses
  nuclei firebase templates to detect open databases and vulnerable configurations.
tags:
  - recon
  - firebase
  - firestore
  - google
  - database
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target URL, JS file, or file with URLs
      alias: t
    log_command:
      type: string
      default: "true"
      description: Enable command logging
    log_output:
      type: string
      default: "true"
      description: Enable output logging
defaults:
  store-creds: false
outputs:
  findings_file: '{{ jobs["collect"].outputs.findings_file | default("", true) }}'
  finding_count: '{{ jobs["collect"].outputs.finding_count | default("0", true) }}'
  typed_outputs: '{{ jobs["collect"].outputs.typed_outputs | default([], true) }}'
jobs:
  discover:
    name: Firebase Discovery
    steps:
      - task: nuclei
        log-command: "{{ inputs.log_command | default(true) }}"
        name: nuclei-firebase
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
          tags: "firebase,firestore"
          severity: "critical,high,medium"
          rate_limit: 50
          json: true
          silent: true
        continue-on-error: true
      - task: nuclei
        log-command: "{{ inputs.log_command | default(true) }}"
        name: nuclei-google-cloud
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
          tags: "google-cloud,gcp,firebase-db,firestore-db"
          severity: "critical,high,medium"
          rate_limit: 50
          json: true
          silent: true
        continue-on-error: true
      - name: collect-firebase
        script: |
          import json
          from pathlib import Path

          fb_findings = {{ vulns(steps["nuclei-firebase"].outputs.typed_outputs) | default([], true) | tojson }}
          gcp_findings = {{ vulns(steps["nuclei-google-cloud"].outputs.typed_outputs) | default([], true) | tojson }}

          all_findings = fb_findings + gcp_findings

          out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')
          findings_file = f'{out_dir}/ofx_firebase_findings.json'
          Path(findings_file).write_text(json.dumps(all_findings, indent=2, default=str))

          add_outputs(
            findings_file=findings_file,
            finding_count=len(all_findings),
            typed_outputs=all_findings
          )
          print(f'Firebase check: {len(all_findings)} findings')
  summary:
    name: Summary
    needs:
      - discover
    steps:
      - name: report
        run: |
          echo "=========================================="
          echo " FIREBASE SECURITY CHECK RESULTS"
          echo "=========================================="
          echo ""
          echo "Target: {{ inputs.target }}"
          echo "Findings: {{ jobs.discover.outputs.finding_count | default('0', true) }}"
          echo ""
          {% set findings = jobs.discover.outputs.typed_outputs | default([], true) %}
          {% for f in findings[:10] %}
          echo "  [{{ f.severity | default('info') }}] {{ f.name }}"
          echo "    {{ f.host | default('') }}"
          {% endfor %}
          echo "=========================================="
        log-stdout: "{{ inputs.log_output | default(true) }}"
