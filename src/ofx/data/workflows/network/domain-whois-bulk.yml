name: domain-whois-bulk
description: >
  Bulk domain WHOIS intelligence — lookup registrar, creation date,
  expiry, nameservers, and registrant info for multiple domains using
  whois for individual lookups and dnsrecon for DNS record enumeration.
tags:
- osint
- whois
- domain
- bulk
dispatch:
  inputs:
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
    log_output:
      type: string
      default: 'true'
      description: Enable output logging
    targets:
      required: true
      type: string
      description: Domains (comma-separated or @file)
      alias: t
defaults:
  store-creds: true
jobs:
  whois-lookup:
    name: Bulk WHOIS Lookup
    outputs:
      results_file: '{{ steps["collect-whois"].outputs.results_file | default("", true) }}'
      domain_count: '{{ steps["collect-whois"].outputs.domain_count | default("0", true) }}'
    steps:
    - task: whois
      log-command: '{{ inputs.log_command }}'
      name: whois-bulk
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.targets }}'
      continue-on-error: true
    - task: dnsrecon
      log-command: '{{ inputs.log_command }}'
      name: dnsrecon-bulk
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.targets }}'
        type: std,srv
      continue-on-error: true
    - name: collect-whois
      script: |
        import json
        from pathlib import Path

        whois_data = {{ steps["whois-bulk"].outputs.typed_outputs | default([], true) | tojson }}
        dns_records = {{ records(steps["dnsrecon-bulk"].outputs.typed_outputs) | default([], true) | tojson }}

        out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')
        results_file = f'{out_dir}/ofx_whois_bulk.json'
        Path(results_file).write_text(json.dumps({
            'whois': whois_data,
            'dns_records': dns_records
        }, indent=2, default=str))

        add_outputs(results_file=results_file, domain_count=len(whois_data))
        print(f'Bulk WHOIS: {len(whois_data)} domain results, {len(dns_records)} DNS records')
    needs: []
  report:
    name: WHOIS Summary Report
    needs:
    - whois-lookup
    steps:
    - name: display-report
      script: |
        import json
        from pathlib import Path

        results_file = "{{ jobs.whois-lookup.outputs.results_file }}"
        try:
            data = json.loads(Path(results_file).read_text())
        except Exception:
            data = {}

        whois = data.get('whois', [])
        print("=" * 60)
        print(" BULK WHOIS REPORT")
        print("=" * 60)
        print(f"  Domains: {len(whois)}")
        for entry in whois[:20]:
            domain = entry.get('domain', entry.get('name', '?'))
            registrar = entry.get('registrar', '?')
            print(f"  {domain:<40} Registrar: {registrar}")
        if len(whois) > 20:
            print(f"  ... and {len(whois) - 20} more")
      log-stdout: '{{ inputs.log_output }}'
