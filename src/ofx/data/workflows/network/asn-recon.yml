name: asn-recon
description: >
  ASN (Autonomous System Number) reconnaissance. Looks up ASN for an IP or organization,
  extracts IP ranges, and performs port scanning across all discovered CIDRs.
  Useful for mapping entire organization's network footprint.
tags:
- recon
- asn
- ip-range
- bgp
- organization
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: IP address, hostname, or organization name
      alias: t
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
    log_output:
      type: string
      default: 'true'
      description: Enable output logging
defaults:
  store-creds: true
jobs:
  asn-lookup:
    name: ASN Lookup & IP Range Discovery
    outputs:
      asn_number: '{{ steps["report-asn"].outputs.asn_number | default("", true) }}'
      ip_ranges_file: '{{ steps["report-asn"].outputs.ip_ranges_file | default("", true) }}'
      ip_count: '{{ steps["report-asn"].outputs.ip_count | default("0", true) }}'
    steps:
    - task: asnmap
      log-command: '{{ inputs.log_command }}'
      name: asnmap-lookup
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - task: whois
      log-command: '{{ inputs.log_command }}'
      name: whois-lookup
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: report-asn
      script: |
        import json
        from pathlib import Path

        asn_data = {{ steps["asnmap-lookup"].outputs.typed_outputs | default([], true) | tojson }}
        whois_data = {{ steps["whois-lookup"].outputs.typed_outputs | default([], true) | tojson }}

        ip_ranges = []
        for a in asn_data:
            if a.get('ip_prefix'):
                ip_ranges.append(a['ip_prefix'])
            elif a.get('cidr'):
                ip_ranges.append(a['cidr'])
            elif a.get('range'):
                ip_ranges.append(a['range'])

        out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')

        asn_number = asn_data[0].get('asn', '') if asn_data else ''
        add_outputs(asn_number=asn_number, ip_ranges_data='\n'.join(sorted(set(ip_ranges, ip_count=len(ip_ranges),
                    asn_data=json.dumps(asn_data, default=str))
        print(f'ASN: {asn_number}')
        print(f'IP ranges: {len(ip_ranges)}')
        for r in ip_ranges[:10]:
            print(f'  {r}')
    needs: []
  expand-ranges:
    name: Expand & Enumerate IP Ranges
    needs:
    - asn-lookup
    outputs:
      expanded_file: '{{ steps["expand-ips"].outputs.expanded_file | default("", true) }}'
      expanded_count: '{{ steps["expand-ips"].outputs.expanded_count | default("0", true) }}'
    steps:
    - task: mapcidr
      log-command: '{{ inputs.log_command }}'
      name: mapcidr-expand
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs["asn-lookup"].outputs.ip_ranges_file }}'
        aggregate: true
      continue-on-error: true
    - name: expand-ips
      script: |
        from pathlib import Path

        ranges_raw = '{{ jobs["asn-lookup"].outputs.ip_ranges_file }}'
        out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')

        ranges = []
        if ranges_raw and Path(ranges_raw).is_file():
            ranges = [l.strip() for l in Path(ranges_raw).read_text().splitlines() if l.strip()]

        add_outputs(expanded_data='\n'.join(ranges, expanded_count=len(ranges))
        print(f'ASN IP ranges for scanning: {len(ranges)} CIDRs')
    needs: []
  summary:
    name: ASN Recon Summary
    needs:
    - asn-lookup
    - expand-ranges
    steps:
    - name: report
      run: |
        echo "======================================================"
        echo " ASN RECON: {{ inputs.target }}"
        echo "======================================================"
        echo "  ASN Number: {{ jobs['asn-lookup'].outputs.asn_number }}"
        echo "  IP Ranges: {{ jobs['asn-lookup'].outputs.ip_count }}"
        echo "  Expanded targets: {{ jobs['expand-ranges'].outputs.expanded_count }}"
        echo "======================================================"
      log-stdout: '{{ inputs.log_output }}'
