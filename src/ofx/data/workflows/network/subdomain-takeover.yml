name: subdomain-takeover
description: >
  Subdomain takeover detection using subzy, nuclei takeover templates, and dnstake.
  Checks all verified subdomains for dangling DNS entries that could be claimed.
tags:
- recon
- subdomain
- takeover
- vuln
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target domain or subdomain list file
      alias: t
    subdomains_file:
      type: string
      default: ''
      description: Pre-discovered subdomain file
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
    log_output:
      type: string
      default: 'true'
      description: Enable output logging
defaults:
  store-creds: true
jobs:
  takeover-check:
    name: Takeover Detection
    outputs:
      takeover_file: '{{ steps["report-takeovers"].outputs.takeover_file | default("", true) }}'
      takeover_count: '{{ steps["report-takeovers"].outputs.takeover_count | default("0", true) }}'
      critical_count: '{{ steps["report-takeovers"].outputs.critical_count | default("0", true) }}'
    steps:
    - task: subzy
      log-command: '{{ inputs.log_command }}'
      name: subzy-check
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.subdomains_file if inputs.subdomains_file else inputs.target }}'
        concurrency: 25
      continue-on-error: true
    - task: nuclei
      log-command: '{{ inputs.log_command }}'
      name: nuclei-takeover
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.subdomains_file if inputs.subdomains_file else inputs.target }}'
        tags: subdomain-takeover,takeover,dns
      continue-on-error: true
    - task: dnstake
      log-command: '{{ inputs.log_command }}'
      name: dnstake-check
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.subdomains_file if inputs.subdomains_file else inputs.target }}'
      continue-on-error: true
    - name: report-takeovers
      script: |
        import json
        from pathlib import Path

        subzy_vulns = {{ vulns(steps["subzy-check"].outputs.typed_outputs) | default([], true) | tojson }}
        nuclei_vulns = {{ vulns(steps["nuclei-takeover"].outputs.typed_outputs) | default([], true) | tojson }}
        dnstake_vulns = {{ vulns(steps["dnstake-check"].outputs.typed_outputs) | default([], true) | tojson }}

        all_takeovers = subzy_vulns + nuclei_vulns + dnstake_vulns
        critical = [t for t in all_takeovers if t.get('severity') in ('critical', 'high')]

        out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')

        add_outputs(takeover_data=json.dumps(all_takeovers, indent=2, default=str, takeover_count=len(all_takeovers), critical_count=len(critical))

        if all_takeovers:
            print(f'Takeover candidates: {len(all_takeovers)} (C+H: {len(critical)})')
            for t in all_takeovers[:15]:
                sev = t.get('severity', 'info').upper()
                host = t.get('host', t.get('matched_at', ''))
                name = t.get('name', '')
                provider = t.get('provider', '')
                print(f'  [{sev}] {host} — {name} {f"({provider})" if provider else ""}')
        else:
            print('No subdomain takeover vulnerabilities detected')
    needs: []
  summary:
    name: Takeover Summary
    needs:
    - takeover-check
    steps:
    - name: report
      run: |
        echo "======================================================"
        echo " SUBDOMAIN TAKEOVER: {{ inputs.target }}"
        echo "======================================================"
        echo "  Takeover candidates: {{ jobs['takeover-check'].outputs.takeover_count }}"
        echo "  Critical/High: {{ jobs['takeover-check'].outputs.critical_count }}"
        echo "======================================================"
      log-stdout: '{{ inputs.log_output }}'