name: network-discovery
description: >
  Network host discovery — uses nmap -sn multi-probe sweep (catches ICMP-blocking
  hosts) with fping fallback, then port scanning on alive hosts to identify live
  services on a network.
tags:
- recon
- network
- discovery
- ports
dispatch:
  inputs:
    log_command:
      type: string
      default: 'true'
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: 'true'
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Target CIDR or IP range (e.g. 10.0.0.0/24)
      alias: t
    discovery:
      type: string
      default: 'nmap'
      description: Host discovery method — nmap (multi-probe, catches ICMP-blocking hosts, default) or fping (ICMP-only, fast for trusted networks)
jobs:
  host-discovery:
    name: Host Discovery
    outputs:
      alive_hosts: '{{ steps["collect-alive"].outputs.alive_hosts | default("", true) }}'
      alive_count: '{{ steps["collect-alive"].outputs.alive_count | default("", true) }}'
    steps:
    - task: nmap
      run_if: "{{ inputs.discovery == 'nmap' }}"
      log-command: '{{ inputs.log_command | default(true) }}'
      name: ping-sweep
      with:
        target: '{{ inputs.target }}'
        ping_scan: true
        timing: 4
      continue-on-error: true
    - task: fping
      run_if: "{{ inputs.discovery == 'fping' }}"
      log-command: '{{ inputs.log_command | default(true) }}'
      name: fping-sweep
      with:
        target: '{{ inputs.target }}'
        generate: true
      continue-on-error: true
    - name: collect-alive
      script: |
        hosts = set()
        for item in {{ ips(steps["ping-sweep"].outputs.typed_outputs) | default([], true) | tojson }}:
            ip = item.get('ip', '')
            if ip:
                hosts.add(ip)
        for item in {{ ips(steps["fping-sweep"].outputs.typed_outputs) | default([], true) | tojson }}:
            ip = item.get('ip', '')
            if ip:
                hosts.add(ip)

        hosts.discard('')
        hosts_list = sorted(hosts)

        add_outputs(alive_hosts='\n'.join(hosts_list), alive_count=len(hosts_list))
        if hosts_list:
            print(f"Found {len(hosts_list)} alive hosts")
        else:
            print("WARNING: No alive hosts found (ICMP may be blocked)")

  port-scan:
    name: Port Scanning
    outputs:
      hosts_with_ports: '{{ steps["collect-ports"].outputs.hosts_with_ports | default("", true) }}'
      port_count: '{{ steps["collect-ports"].outputs.port_count | default("", true) }}'
    needs:
    - host-discovery
    steps:
    - name: prep-hosts
      uses: target-file
      with:
        targets: '{{ jobs["host-discovery"].outputs.alive_hosts }}'
        prefix: 'ofx_ndiscover_hosts'
    - task: naabu
      log-command: '{{ inputs.log_command | default(true) }}'
      name: naabu-scan
      with:
        target: '{{ steps["prep-hosts"].outputs.targets_file }}'
        top_ports: '1000'
        rate: 1000
      continue-on-error: true
    - name: collect-ports
      script: |
        ports_found = set()
        hosts_with_ports = set()

        naabu_out = {{ steps["naabu-scan"].outputs.typed_outputs | default([], true) | tojson }}
        for item in naabu_out:
            if item.get('_type') == 'port':
                host = item.get('host') or item.get('ip', '')
                port = item.get('port', '')
                if host and port:
                    ports_found.add(f"{host}:{port}")
                    hosts_with_ports.add(host)

        add_outputs(
            hosts_with_ports='\n'.join(sorted(hosts_with_ports)),
            port_count=len(ports_found),
        )
        print(f"Found {len(ports_found)} open ports across {len(hosts_with_ports)} hosts")

  service-detection:
    name: Service Detection
    outputs:
      live_urls: '{{ steps["export-http"].outputs.live_urls | default("", true) }}'
      live_count: '{{ steps["export-http"].outputs.live_count | default("", true) }}'
    needs:
    - port-scan
    steps:
    - name: prep-svc-targets
      uses: target-file
      with:
        targets: '{{ jobs["port-scan"].outputs.hosts_with_ports }}'
        prefix: 'ofx_ndiscover_svc'
    - task: nmap
      log-command: '{{ inputs.log_command | default(true) }}'
      name: version-detect
      with:
        target: '{{ steps["prep-svc-targets"].outputs.targets_file }}'
        version_detection: true
      continue-on-error: true
    - task: httpx
      log-command: '{{ inputs.log_command | default(true) }}'
      name: http-probe
      with:
        target: '{{ jobs["port-scan"].outputs.hosts_with_ports }}'
        tech_detect: true
        status_code: true
        title: true
      continue-on-error: true
    - name: export-http
      script: |
        typed = {{ steps["http-probe"].outputs.typed_outputs | default([], true) | tojson }}
        live = []
        for item in typed:
            if item.get("_type") == "url" and item.get("status_code", 0) > 0:
                live.append(item["url"])
        add_outputs(live_urls='\n'.join(sorted(set(live))))
        count = sum(1 for item in typed if item.get("_type") == "url" and item.get("status_code", 0) > 0)
        add_outputs(live_count=count)
