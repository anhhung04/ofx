name: secret-scan
description: >
  Secret and credential scanning across web URLs, git repositories, and filesystems.
  Uses nuclei (exposure templates), gitleaks (git secrets), trufflehog (commit secrets),
  cariddi (URL secrets), and jsluice (JS secrets/endpoints).
tags:
- recon
- secret
- api-key
- token
- exposure
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target URL, domain, or git repo URL
      alias: t
    live_urls_file:
      type: string
      default: ''
      description: Pre-discovered live URL file
    repo_url:
      type: string
      default: ''
      description: Git repository URL to scan for secrets
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
    log_output:
      type: string
      default: 'true'
      description: Enable output logging
defaults:
  store-creds: true
jobs:
  web-secrets:
    name: Web Secret Scanning
    outputs:
      web_secrets_file: '{{ steps["collect-web"].outputs.secrets_file | default("", true) }}'
      web_secret_count: '{{ steps["collect-web"].outputs.secret_count | default("0", true) }}'
    steps:
    - task: nuclei
      log-command: '{{ inputs.log_command }}'
      name: nuclei-exposure
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.live_urls_file if inputs.live_urls_file else inputs.target }}'
        tags: exposure,token,secret,api-key,aws-key,aws-secret,gcp-key,azure-key,jwt,hardcoded
      continue-on-error: true
    - task: cariddi
      log-command: '{{ inputs.log_command }}'
      name: cariddi-secrets
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
        secrets: true
        errors: true
        info: true
      continue-on-error: true
    - name: collect-web
      script: |
        import json
        from pathlib import Path

        nuclei_secrets = {{ vulns(steps["nuclei-exposure"].outputs.typed_outputs) | default([], true) | tojson }}
        cariddi_findings = {{ steps["cariddi-secrets"].outputs.typed_outputs | default([], true) | tojson }}

        all_secrets = nuclei_secrets + cariddi_findings
        out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')

        add_outputs(secrets_data=json.dumps(all_secrets, indent=2, default=str, secret_count=len(all_secrets))
        print(f'Web secrets: {len(all_secrets)} findings')
        for s in all_secrets[:10]:
            print(f'  [{s.get("severity", "info").upper()}] {s.get("name", "")} — {s.get("host", "")}')
    needs: []
  git-secrets:
    name: Git Repository Secret Scanning
    outputs:
      git_secrets_file: '{{ steps["collect-git"].outputs.secrets_file | default("", true) }}'
      git_secret_count: '{{ steps["collect-git"].outputs.secret_count | default("0", true) }}'
    steps:
    - task: trufflehog
      log-command: '{{ inputs.log_command }}'
      name: trufflehog-scan
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.repo_url if inputs.repo_url else inputs.target }}'
        verified_only: false
      continue-on-error: true
    - task: gitleaks
      log-command: '{{ inputs.log_command }}'
      name: gitleaks-scan
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.repo_url if inputs.repo_url else inputs.target }}'
        verbose: true
      continue-on-error: true
    - name: collect-git
      script: |
        import json
        from pathlib import Path

        trufflehog = {{ steps["trufflehog-scan"].outputs.typed_outputs | default([], true) | tojson }}
        gitleaks = {{ steps["gitleaks-scan"].outputs.typed_outputs | default([], true) | tojson }}

        all_secrets = trufflehog + gitleaks
        out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')

        add_outputs(secrets_data=json.dumps(all_secrets, indent=2, default=str, secret_count=len(all_secrets))
        print(f'Git secrets: {len(all_secrets)} findings')
        for s in all_secrets[:10]:
            print(f'  [{s.get("type", "secret").upper()}] {s.get("file", s.get("commit", ""))}:{s.get("line", "")}')
    needs: []
  js-secrets:
    name: JavaScript Secret Extraction
    outputs:
      js_secrets_file: '{{ steps["collect-js"].outputs.secrets_file | default("", true) }}'
      js_secret_count: '{{ steps["collect-js"].outputs.secret_count | default("0", true) }}'
    steps:
    - task: jsluice
      log-command: '{{ inputs.log_command }}'
      name: jsluice-extract
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.live_urls_file if inputs.live_urls_file else inputs.target }}'
      continue-on-error: true
    - name: collect-js
      script: |
        import json
        from pathlib import Path

        js_findings = {{ steps["jsluice-extract"].outputs.typed_outputs | default([], true) | tojson }}
        secrets = [f for f in js_findings if f.get('type') in ('secret', 'api-key', 'token', 'password', 'jwt')]
        endpoints = [f for f in js_findings if f.get('type') == 'endpoint']

        out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')

        add_outputs(secrets_data=json.dumps({'secrets': secrets, 'endpoints': endpoints}, indent=2, default=str, secret_count=len(secrets))
        print(f'JS analysis: {len(secrets)} secrets, {len(endpoints)} endpoints')
        for s in secrets[:10]:
            print(f'  [{s.get("type", "secret").upper()}] {s.get("url", s.get("source", ""))}: {s.get("match", "")[:80]}')
    needs: []
  summary:
    name: Secret Scan Summary
    needs:
    - web-secrets
    - git-secrets
    - js-secrets
    steps:
    - name: report
      run: |
        echo "======================================================"
        echo " SECRET SCAN: {{ inputs.target }}"
        echo "======================================================"
        echo "  Web secrets: {{ jobs['web-secrets'].outputs.web_secret_count }}"
        echo "  Git secrets: {{ jobs['git-secrets'].outputs.git_secret_count }}"
        echo "  JS secrets: {{ jobs['js-secrets'].outputs.js_secret_count }}"
        echo "======================================================"
      log-stdout: '{{ inputs.log_output }}'