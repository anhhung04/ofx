name: linux-hardening
description: >
  Linux security hardening audit — check SSH config, firewall rules,
  kernel parameters, file permissions, running services, and user accounts.
  Uses nmap for local port audit, sslscan for TLS service checks, and
  applies CIS benchmark-inspired recommendations. Designed for both
  localhost and remote SSH targets.
tags:
- compliance
- hardening
- linux
- audit
- cis
dispatch:
  inputs:
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
    log_output:
      type: string
      default: 'true'
      description: Enable output logging
    target:
      type: string
      default: localhost
      description: Target host (localhost for local audit)
      alias: t
defaults:
  store-creds: true
jobs:
  port-audit:
    name: Open Port & Service Audit
    outputs:
      open_port_count: '{{ steps["collect-ports"].outputs.open_port_count | default("0", true) }}'
      risky_port_count: '{{ steps["collect-ports"].outputs.risky_port_count | default("0", true) }}'
    steps:
    - task: nmap
      log-command: '{{ inputs.log_command }}'
      name: nmap-local-scan
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
        top_ports: '1000'
        service_detection: true
      continue-on-error: true
    - name: collect-ports
      script: |
        import json
        from pathlib import Path

        nmap_results = {{ vulns(steps["nmap-local-scan"].outputs.typed_outputs) | default([], true) | tojson }}

        risky_ports = {23: 'telnet', 21: 'ftp', 512: 'rexec', 513: 'rlogin', 514: 'rsh',
                       515: 'lpd', 111: 'rpcbind', 2049: 'nfs'}
        open_ports = [v for v in nmap_results if v.get('state') == 'open']
        risky = [v for v in open_ports if v.get('port') in risky_ports]

        for v in risky:
            print(f'  [!] Risky port: {v.get("port")} ({risky_ports.get(v.get("port"), "unknown")})')

        add_outputs(open_port_count=len(open_ports), risky_port_count=len(risky))
        print(f'Port audit: {len(open_ports)} open, {len(risky)} risky')
    needs: []
  system-audit:
    name: System Configuration Audit
    outputs:
      finding_count: '{{ steps["collect-hardening"].outputs.finding_count | default("0", true) }}'
      passed_count: '{{ steps["collect-hardening"].outputs.passed_count | default("0", true) }}'
      score: '{{ steps["collect-hardening"].outputs.score | default("0", true) }}'
    steps:
    - task: sslscan
      log-command: '{{ inputs.log_command }}'
      name: sslscan-services
      retry: 1
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
        show_certificate: true
      continue-on-error: true
    - name: collect-hardening
      script: |
        import subprocess
        import re

        target = '{{ inputs.target }}'

        findings = []
        passed = []

        print("=== LINUX HARDENING AUDIT ===\n")

        if target == 'localhost':
            def run(cmd):
                proc = subprocess.run(cmd, shell=True, capture_output=True, text=True, timeout=15)
                return proc.stdout.strip()
        else:
            def run(cmd):
                proc = subprocess.run(['ssh', target, cmd], capture_output=True, text=True, timeout=15)
                return proc.stdout.strip()

        print("--- SSH Configuration ---")
        ssh_config = run('cat /etc/ssh/sshd_config 2>/dev/null')
        checks = {
            'PermitRootLogin no': (r'^\s*PermitRootLogin\s+no', '[HIGH] Root login not disabled'),
            'PasswordAuth disabled': (r'^\s*PasswordAuthentication\s+no', '[MEDIUM] Password auth not disabled'),
            'X11Forwarding no': (r'^\s*X11Forwarding\s+no', '[LOW] X11 forwarding not disabled'),
            'MaxAuthTries': (r'^\s*MaxAuthTries\s+[1-4]$', '[LOW] MaxAuthTries not restricted'),
        }
        for name, (pattern, fail_msg) in checks.items():
            if re.search(pattern, ssh_config, re.MULTILINE):
                passed.append(f"  [OK] {name}")
                print(f"  [OK] {name}")
            elif fail_msg:
                findings.append(fail_msg)
                print(f"  [FAIL] {name}")

        print("\n--- Firewall ---")
        fw = run('iptables -L -n 2>/dev/null | head -20; ufw status 2>/dev/null; firewall-cmd --state 2>/dev/null')
        if 'active' in fw.lower() or 'running' in fw.lower() or 'Chain' in fw:
            passed.append("  [OK] Firewall active")
            print("  [OK] Firewall active")
        else:
            findings.append('[HIGH] No firewall detected')
            print("  [FAIL] No firewall detected")

        print("\n--- Kernel Security ---")
        sysctl_checks = {
            'net.ipv4.ip_forward': ('0', '[MEDIUM] IP forwarding enabled'),
            'net.ipv4.conf.all.accept_redirects': ('0', '[MEDIUM] ICMP redirects accepted'),
            'kernel.randomize_va_space': ('2', '[HIGH] ASLR not fully enabled'),
        }
        for param, (expected, fail_msg) in sysctl_checks.items():
            val = run(f'sysctl -n {param} 2>/dev/null').strip()
            if val == expected:
                passed.append(f"  [OK] {param} = {val}")
                print(f"  [OK] {param} = {val}")
            else:
                findings.append(f"{fail_msg} ({param} = {val})")
                print(f"  [FAIL] {param} = {val} (expected {expected})")

        print("\n--- Critical File Permissions ---")
        perm_checks = [
            ('/etc/passwd', '644', '[HIGH] /etc/passwd too permissive'),
            ('/etc/shadow', '640', '[CRITICAL] /etc/shadow too permissive'),
        ]
        for fpath, max_perm, fail_msg in perm_checks:
            perm = run(f'stat -c %a {fpath} 2>/dev/null').strip()
            if perm and int(perm) <= int(max_perm):
                print(f"  [OK] {fpath}: {perm}")
            elif perm:
                findings.append(f"{fail_msg} ({perm})")
                print(f"  [FAIL] {fpath}: {perm} (should be <= {max_perm})")

        print("\n--- User Accounts ---")
        uid0 = run("awk -F: '$3 == 0 {print $1}' /etc/passwd 2>/dev/null")
        if uid0 and uid0.strip() != 'root':
            findings.append(f'[CRITICAL] Non-root UID 0 accounts: {uid0}')

        score = max(0, 100 - (len(findings) * 8))
        add_outputs(finding_count=len(findings), passed_count=len(passed), score=score)
        print(f"\nScore: {score}/100 | Passed: {len(passed)} | Findings: {len(findings)}")
      log-command: '{{ inputs.log_command | default(true) }}'
      continue-on-error: true
    needs: []
  summary:
    name: Hardening Summary
    needs:
    - port-audit
    - system-audit
    steps:
    - name: report
      run: |
        echo "======================================================"
        echo " LINUX HARDENING AUDIT: {{ inputs.target }}"
        echo "======================================================"
        echo ""
        echo "  Open ports:       {{ jobs.port-audit.outputs.open_port_count }}"
        echo "  Risky ports:      {{ jobs.port-audit.outputs.risky_port_count }}"
        echo "  Score:            {{ jobs.system-audit.outputs.score }}/100"
        echo "  Passed checks:    {{ jobs.system-audit.outputs.passed_count }}"
        echo "  Findings:          {{ jobs.system-audit.outputs.finding_count }}"
        echo "======================================================"
      log-stdout: '{{ inputs.log_output }}'
