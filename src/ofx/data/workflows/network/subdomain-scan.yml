name: subdomain-scan
description: >
  Complete subdomain attack surface mapping — passive + active + cert-based

  enumeration, DNS verification, permutation bruteforcing, HTTP probing,

  screenshot capture, takeover detection, web crawling, and vuln scanning.

  Enhanced with wildcard detection, port scanning, WAF/CDN detection,

  SSL audit, parameter discovery, secret scanning, and JS analysis.
tags:
- recon
- dns
- network
- http
- crawl
- ssl
- takeovers
- vuln
- secrets
dispatch:
  inputs:
    log_command:
      type: string
      default: 'true'
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: 'true'
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Target domain (e.g. example.com)
      alias: t
defaults:
  store-creds: true
jobs:
  passive-enum:
    name: Passive Subdomain Enumeration
    outputs:
      subs_file: '{{ steps["merge-passive"].outputs.subs_file | default("", true) }}'
      sub_count: '{{ steps["merge-passive"].outputs.sub_count | default("0", true) }}'
    steps:
    - task: subfinder
      log-command: '{{ inputs.log_command | default(true) }}'
      name: subfinder-enum
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
        all: true
      continue-on-error: true
    - task: amass
      log-command: '{{ inputs.log_command | default(true) }}'
      name: amass-passive
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: merge-passive
      script: "from pathlib import Path\nbase = '{{ inputs.target }}'\nsubs = {base}\nfor items in [\n    {{ subdomains(steps[\"subfinder-enum\"].outputs.typed_outputs) | default([], true) | tojson }},\n\
        \    {{ subdomains(steps[\"amass-passive\"].outputs.typed_outputs) | default([], true) | tojson }},\n]:\n    for item in items:\n        h = item.get('host', '')\n        if h.endswith(f'.{base}')\
        \ or h == base:\n            subs.add(h)\nsubs_path = f'{os.environ.get(\"OFX_RUN_DIR\", \"/tmp\")}/ofx_subscan_passive.txt'\nPath(subs_path).write_text('\\n'.join(sorted(subs)))\nadd_outputs(subs_file=subs_path,\
        \ sub_count=len(subs))\nprint(f\"Passive: {len(subs)} unique subdomains\")\n"
    needs: []
  cert-enum:
    name: Certificate & CT Enumeration
    needs:
    - passive-enum
    outputs:
      cert_subs_file: '{{ steps["merge-cert"].outputs.cert_subs_file | default("", true) }}'
      cert_sub_count: '{{ steps["merge-cert"].outputs.cert_sub_count | default("0", true) }}'
    steps:
    - task: tlsx
      log-command: '{{ inputs.log_command | default(true) }}'
      name: tls-san-enum
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs[''passive-enum''].outputs.subs_file }}'
        san: true
        port: 443,8443
      continue-on-error: true
    - name: merge-cert
      script: "from pathlib import Path\nbase = '{{ inputs.target }}'\ncert_subs = set()\nfor item in {{ subdomains(steps[\"tls-san-enum\"].outputs.typed_outputs) | default([], true) | tojson }}:\n    h\
        \ = item.get('host', '')\n    if h.endswith(f'.{base}') or h == base:\n        cert_subs.add(h)\ncert_path = f'{os.environ.get(\"OFX_RUN_DIR\", \"/tmp\")}/ofx_subscan_certsubs.txt'\nPath(cert_path).write_text('\\\
        n'.join(sorted(cert_subs)))\nadd_outputs(cert_subs_file=cert_path, cert_sub_count=len(cert_subs))\nprint(f\"Cert/TLS: {len(cert_subs)} subdomains from certificates\")\n"
  permutation-enum:
    name: Permutation Bruteforce
    needs:
    - passive-enum
    outputs:
      perm_subs_file: '{{ steps["resolve-perms"].outputs.output_file | default("", true) }}'
      perm_sub_count: '{{ steps["resolve-perms"].outputs.typed_outputs | default([], true) | length }}'
    steps:
    - task: gotator
      log-command: '{{ inputs.log_command | default(true) }}'
      name: generate-perms
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs[''passive-enum''].outputs.subs_file }}'
      continue-on-error: true
    - task: puredns
      log-command: '{{ inputs.log_command | default(true) }}'
      name: resolve-perms
      retry: 2
      retry-delay: 5
      if: '{{ steps[''generate-perms''].outputs.output_file | default('''', true) | length > 0 }}'
      with:
        target: '{{ steps[''generate-perms''].outputs.output_file | default('''', true) }}'
      continue-on-error: true
  dns-verify:
    name: DNS Verification
    needs:
    - passive-enum
    - cert-enum
    - permutation-enum
    outputs:
      verified_file: '{{ steps["export-verified"].outputs.verified_file | default("", true) }}'
      verified_count: '{{ steps["export-verified"].outputs.verified_count | default("0", true) }}'
      verified_hosts_json: '{{ steps["export-verified"].outputs.verified_hosts_json | default("[]", true) }}'
      wildcard_detected: '{{ steps["wildcard-detect"].outputs.wildcard_detected | default("false", true) }}'
    steps:
    - name: merge-all-sources
      script: "from pathlib import Path\nbase = '{{ inputs.target }}'\nall_subs = {base}\nfor path_str in [\n    '{{ jobs[\"passive-enum\"].outputs.subs_file | default(\"\", true) }}',\n    '{{ jobs[\"\
        cert-enum\"].outputs.cert_subs_file | default(\"\", true) }}',\n    '{{ jobs[\"permutation-enum\"].outputs.perm_subs_file | default(\"\", true) }}',\n]:\n    if path_str and Path(path_str).is_file():\n\
        \        for line in Path(path_str).read_text().splitlines():\n            h = line.strip()\n            if h and (h.endswith(f'.{base}') or h == base):\n                all_subs.add(h)\nmerged_path\
        \ = f'{os.environ.get(\"OFX_RUN_DIR\", \"/tmp\")}/ofx_subscan_all.txt'\nPath(merged_path).write_text('\\n'.join(sorted(all_subs)))\nadd_outputs(merged_file=merged_path, total_count=len(all_subs))\n\
        print(f\"Merged: {len(all_subs)} unique subdomains across all sources\")\n"
    - task: dnsx
      log-command: '{{ inputs.log_command | default(true) }}'
      name: dns-resolve
      retry: 2
      retry-delay: 5
      with:
        target: '{{ steps[''merge-all-sources''].outputs.merged_file }}'
        a: true
        aaaa: true
        cname: true
        mx: true
        txt: true
        resp: true
        wildcard_domain: '{{ inputs.target }}'
      continue-on-error: true
    - name: wildcard-detect
      script: "import socket, random, string\nbase = '{{ inputs.target }}'\nprobes = [\n    f\"{''.join(random.choices(string.ascii_lowercase + string.digits, k=12))}.{base}\"\n    for _ in range(3)\n]\n\
        resolved = []\nfor probe in probes:\n    try:\n        ips = {r[4][0] for r in socket.getaddrinfo(probe, None, socket.AF_INET)}\n        resolved.append(ips)\n    except socket.gaierror:\n     \
        \   resolved.append(set())\nnon_empty = [r for r in resolved if r]\nif len(non_empty) >= 2 and all(r == non_empty[0] for r in non_empty[1:]):\n    wildcard_ips = non_empty[0]\n    print(f\"⚠  Wildcard\
        \ DNS detected! IPs: {', '.join(wildcard_ips)}\")\n    add_outputs(wildcard_detected='true', wildcard_ips=','.join(wildcard_ips))\nelse:\n    print(\"No wildcard DNS detected\")\n    add_outputs(wildcard_detected='false',\
        \ wildcard_ips='')\n"
    - name: export-verified
      script: "import json\nfrom pathlib import Path\nverified = set()\nwc_raw = '{{ steps[\"wildcard-detect\"].outputs.wildcard_ips | default(\"\", true) }}'\nwildcard_ips = set(wc_raw.split(',')) - {''}\
        \ if wc_raw else set()\nfor item in {{ subdomains(steps[\"dns-resolve\"].outputs.typed_outputs) | default([], true) | tojson }}:\n    h = item.get('host', '')\n    if not h:\n        continue\n\
        \    if wildcard_ips and item.get('a'):\n        item_ips = set(item['a']) if isinstance(item['a'], list) else {item['a']}\n        if item_ips and item_ips.issubset(wildcard_ips):\n           \
        \ continue\n    verified.add(h)\nverified_list = sorted(verified)\nverified_path = f'{os.environ.get(\"OFX_RUN_DIR\", \"/tmp\")}/ofx_subscan_verified.txt'\nPath(verified_path).write_text('\\n'.join(verified_list))\n\
        add_outputs(\n    verified_file=verified_path,\n    verified_count=len(verified_list),\n    verified_hosts_json=json.dumps(verified_list),\n)\nsuffix = \" (wildcard IPs filtered)\" if wildcard_ips\
        \ else \"\"\nprint(f\"DNS-verified: {len(verified_list)} live hosts{suffix}\")\n"
  http-probe:
    name: HTTP Probing & Visual Recon
    needs:
    - dns-verify
    outputs:
      live_urls_file: '{{ steps["export-live"].outputs.live_urls_file | default("", true) }}'
      live_urls_json: '{{ steps["export-live"].outputs.live_urls_json | default("[]", true) }}'
      live_count: '{{ steps["export-live"].outputs.live_count | default("0", true) }}'
      waf_detected_count: '{{ steps["infra-report"].outputs.waf_detected_count | default("0", true) }}'
      cdn_count: '{{ steps["infra-report"].outputs.cdn_count | default("0", true) }}'
    steps:
    - task: httpx
      log-command: '{{ inputs.log_command | default(true) }}'
      name: probe-hosts
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs[''dns-verify''].outputs.verified_file }}'
        tech_detect: true
        status_code: true
        title: true
        follow_redirects: true
        ports: 80,443,8080,8443,8000,8888
      continue-on-error: true
    - name: export-live
      script: "import json\nfrom pathlib import Path\nfrom urllib.parse import urlparse\nlive_urls = [\n    item.get('url', '') for item in\n    {{ urls(steps[\"probe-hosts\"].outputs.typed_outputs) | default([],\
        \ true) | tojson }}\n    if item.get('status_code', 0) > 0 and item.get('url', '')\n]\nseen = {}\nfor url in live_urls:\n    host = urlparse(url).hostname or url\n    if host not in seen:\n    \
        \    seen[host] = url\nlive = sorted(seen.values())\nlive_path = f'{os.environ.get(\"OFX_RUN_DIR\", \"/tmp\")}/ofx_subscan_live.txt'\nPath(live_path).write_text('\\n'.join(live))\nadd_outputs(live_urls_file=live_path,\
        \ live_urls_json=json.dumps(live), live_count=len(live))\nprint(f\"Live HTTP: {len(live)} services\")\n"
    - task: wafw00f
      log-command: "{{ inputs.log_command | default(true) }}"
      name: waf-detect
      retry: 2
      retry-delay: 5
      if: '{{ steps[''export-live''].outputs.live_count | default(0, true) | int > 0 }}'
      with:
        target: '{{ steps[''export-live''].outputs.live_urls_file }}'
      continue-on-error: true
    - task: cdncheck
      log-command: "{{ inputs.log_command | default(true) }}"
      name: cdn-detect
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs[''dns-verify''].outputs.verified_file }}'
      continue-on-error: true
    - name: infra-report
      script: 'waf_count = sum(1 for i in {{ steps["waf-detect"].outputs.typed_outputs | default([], true) | tojson }} if i.get(''_type'') == ''tag'' or i.get(''waf''))

        cdn_count = sum(1 for i in {{ steps["cdn-detect"].outputs.typed_outputs | default([], true) | tojson }} if i.get(''cdn'') or i.get(''_type'') == ''tag'')

        add_outputs(waf_detected_count=waf_count, cdn_count=cdn_count)

        print(f"WAF: {waf_count} host(s), CDN: {cdn_count} host(s)")

        '
    - task: gowitness
      log-command: '{{ inputs.log_command | default(true) }}'
      name: screenshots
      retry: 2
      retry-delay: 5
      with:
        target: '{{ steps[''export-live''].outputs.live_urls_file }}'
        screenshot_path: '{{ env(''OFX_RUN_DIR'', ''/tmp'') }}/ofx_subscan_shots'
      continue-on-error: true
    - task: csprecon
      log-command: '{{ inputs.log_command | default(true) }}'
      name: csp-enum
      retry: 2
      retry-delay: 5
      with:
        target: '{{ steps[''export-live''].outputs.live_urls_file }}'
        domain: '{{ inputs.target }}'
      continue-on-error: true
  takeover-check:
    name: Subdomain Takeover Detection
    needs:
    - dns-verify
    outputs:
      takeover_count: '{{ steps["report-takeovers"].outputs.takeover_count | default("0", true) }}'
    steps:
    - task: subzy
      log-command: '{{ inputs.log_command | default(true) }}'
      name: subzy-check
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs[''dns-verify''].outputs.verified_file }}'
      continue-on-error: true
    - task: nuclei
      log-command: '{{ inputs.log_command | default(true) }}'
      name: nuclei-takeover
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs[''dns-verify''].outputs.verified_file }}'
        tags: subdomain-takeover,takeover,dns
      continue-on-error: true
    - name: report-takeovers
      script: "takeovers = []\nfor item in {{ vulns(steps[\"nuclei-takeover\"].outputs.typed_outputs) | default([], true) | tojson }}:\n    takeovers.append(f\"{item.get('severity','').upper()} {item.get('host','')}\
        \ — {item.get('name','')}\")\nfor item in {{ steps[\"subzy-check\"].outputs.typed_outputs | default([], true) | tojson }}:\n    if item.get('_type') == 'vulnerability' or item.get('vulnerable'):\n\
        \        takeovers.append(f\"TAKEOVER {item.get('host', item.get('matched_at', ''))}\")\nadd_outputs(takeover_count=len(takeovers))\nif takeovers:\n    print(f\"⚠  {len(takeovers)} potential takeover(s):\"\
        )\n    for t in takeovers:\n        print(f\"  {t}\")\nelse:\n    print(\"No takeovers detected\")\n"
  port-scan:
    name: Port Scanning
    needs:
    - dns-verify
    outputs:
      open_port_count: '{{ steps["port-report"].outputs.open_port_count | default("0", true) }}'
    steps:
    - task: naabu
      log-command: "{{ inputs.log_command | default(true) }}"
      name: naabu-scan
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs[''dns-verify''].outputs.verified_file }}'
        top_ports: '1000'
        rate: 1000
      continue-on-error: true
    - name: port-report
      script: "ports_found = {{ ports(steps[\"naabu-scan\"].outputs.typed_outputs) | default([], true) | tojson }}\nby_host = {}\nfor p in ports_found:\n    by_host.setdefault(p.get('host', '?'), []).append(str(p.get('port',\
        \ '')))\nadd_outputs(open_port_count=len(ports_found))\nprint(f\"Open ports: {len(ports_found)} across {len(by_host)} host(s)\")\n"
  ssl-audit:
    name: SSL/TLS Audit
    needs:
    - dns-verify
    outputs:
      ssl_issues_count: '{{ steps["ssl-report"].outputs.ssl_issues_count | default("0", true) }}'
    steps:
    - task: testssl
      log-command: "{{ inputs.log_command | default(true) }}"
      name: testssl-scan
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs[''dns-verify''].outputs.verified_file }}'
      continue-on-error: true
    - name: ssl-report
      script: "weak_keywords = ['deprecated', 'weak', 'sslv', 'tls 1.0', 'tls 1.1', 'rc4', 'des', 'null', 'export', 'sweet32', 'poodle', 'heartbleed']\nissues = []\nfor item in {{ vulns(steps[\"testssl-scan\"\
        ].outputs.typed_outputs) | default([], true) | tojson }}:\n    name = item.get('name', '')\n    if any(k in name.lower() for k in weak_keywords):\n        issues.append(f\"{item.get('host','')}:\
        \ {name}\")\nunique_issues = sorted(set(issues))\nadd_outputs(ssl_issues_count=len(unique_issues))\nprint(f\"SSL/TLS issues: {len(unique_issues)}\" + (f\"\\n\" + '\\n'.join(f\"  {i}\" for i in unique_issues[:10])\
        \ if unique_issues else \" — none found\"))\n"
      log-stdout: '{{ inputs.log_output | default(true) }}'
  url-discovery:
    name: URL Discovery & Crawling
    needs:
    - http-probe
    outputs:
      urls_file: '{{ steps["merge-urls"].outputs.urls_file | default("", true) }}'
      url_count: '{{ steps["merge-urls"].outputs.url_count | default("0", true) }}'
      js_findings_count: '{{ steps["js-analysis"].outputs.typed_outputs | default([], true) | length }}'
    steps:
    - task: waymore
      log-command: '{{ inputs.log_command | default(true) }}'
      name: waymore-hist
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
        mode: U
      continue-on-error: true
    - task: katana
      log-command: '{{ inputs.log_command | default(true) }}'
      name: katana-crawl
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs[''http-probe''].outputs.live_urls_file }}'
        depth: 3
        js_crawl: true
      continue-on-error: true
    - name: merge-urls
      script: "import json\nfrom pathlib import Path\nall_urls = set()\nfor items in [\n    {{ urls(steps[\"waymore-hist\"].outputs.typed_outputs) | default([], true) | tojson }},\n    {{ urls(steps[\"\
        katana-crawl\"].outputs.typed_outputs) | default([], true) | tojson }},\n]:\n    for item in items:\n        if item.get('url'):\n            all_urls.add(item['url'])\nurls_list = sorted(all_urls)\n\
        urls_path = f'{os.environ.get(\"OFX_RUN_DIR\", \"/tmp\")}/ofx_subscan_urls.txt'\nPath(urls_path).write_text('\\n'.join(urls_list))\njs_urls = [u for u in urls_list if u.rsplit('?', 1)[0].rsplit('#',\
        \ 1)[0].endswith('.js')]\njs_path = f'{os.environ.get(\"OFX_RUN_DIR\", \"/tmp\")}/ofx_subscan_js_urls.txt'\nPath(js_path).write_text('\\n'.join(js_urls))\nadd_outputs(urls_file=urls_path, url_count=len(urls_list),\n\
        \            js_urls_file=js_path, js_url_count=len(js_urls))\nprint(f\"URL discovery: {len(urls_list)} unique URLs ({len(js_urls)} JS files)\")\n"
    - task: jsluice
      log-command: "{{ inputs.log_command | default(true) }}"
      name: js-analysis
      retry: 2
      retry-delay: 5
      if: '{{ steps[''merge-urls''].outputs.js_url_count | default(0, true) | int > 0 }}'
      with:
        target: '{{ steps[''merge-urls''].outputs.js_urls_file }}'
      continue-on-error: true
  param-discovery:
    name: Parameter Discovery
    needs:
    - url-discovery
    outputs:
      param_urls_file: '{{ steps["merge-params"].outputs.param_urls_file | default("", true) }}'
      param_url_count: '{{ steps["merge-params"].outputs.param_url_count | default("0", true) }}'
    steps:
    - task: arjun
      log-command: "{{ inputs.log_command | default(true) }}"
      name: arjun-discover
      retry: 2
      retry-delay: 5
      if: '{{ jobs[''http-probe''].outputs.live_count | default(0, true) | int > 0 }}'
      with:
        target: '{{ jobs[''http-probe''].outputs.live_urls_file }}'
      continue-on-error: true
    - task: paramspider
      log-command: "{{ inputs.log_command | default(true) }}"
      name: paramspider-discover
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: merge-params
      script: "from pathlib import Path\nparam_urls = set()\nfor items in [\n    {{ urls(steps[\"arjun-discover\"].outputs.typed_outputs) | default([], true) | tojson }},\n    {{ urls(steps[\"paramspider-discover\"\
        ].outputs.typed_outputs) | default([], true) | tojson }},\n]:\n    for item in items:\n        u = item.get('url', '')\n        if u and '=' in u:\n            param_urls.add(u)\nurls_file = '{{\
        \ jobs[\"url-discovery\"].outputs.urls_file | default(\"\", true) }}'\nif urls_file and Path(urls_file).is_file():\n    for line in Path(urls_file).read_text().splitlines():\n        if '=' in line.strip():\n\
        \            param_urls.add(line.strip())\nparam_list = sorted(param_urls)\nparam_path = f'{os.environ.get(\"OFX_RUN_DIR\", \"/tmp\")}/ofx_subscan_params.txt'\nPath(param_path).write_text('\\n'.join(param_list))\n\
        add_outputs(param_urls_file=param_path, param_url_count=len(param_list))\nprint(f\"Parameter discovery: {len(param_list)} parameterized URLs\")\n"
  secret-scan:
    name: Secret Scanning
    needs:
    - url-discovery
    outputs:
      secret_count: '{{ steps["secret-report"].outputs.secret_count | default("0", true) }}'
    steps:
    - task: nuclei
      log-command: "{{ inputs.log_command | default(true) }}"
      name: nuclei-secrets
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs[''http-probe''].outputs.live_urls_file }}'
        tags: exposure,secret,token,api-key
      continue-on-error: true
    - task: gitleaks
      log-command: "{{ inputs.log_command | default(true) }}"
      name: gitleaks-scan
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs[''http-probe''].outputs.live_urls_file }}'
      continue-on-error: true
    - name: secret-report
      script: "secrets = []\nfor item in {{ vulns(steps[\"nuclei-secrets\"].outputs.typed_outputs) | default([], true) | tojson }}:\n    secrets.append(f\"{item.get('severity','').upper()} {item.get('host','')}\
        \ — {item.get('name','')}\")\nfor item in {{ steps[\"gitleaks-scan\"].outputs.typed_outputs | default([], true) | tojson }}:\n    if item.get('_type') == 'vulnerability':\n        secrets.append(f\"\
        SECRET {item.get('host', item.get('matched_at', ''))}: {item.get('name', '')}\")\nadd_outputs(secret_count=len(secrets))\nprint(f\"Secrets/exposures: {len(secrets)}\" + (f\"\\n\" + '\\n'.join(f\"\
        \  {s}\" for s in secrets[:10]) if secrets else \" — none found\"))\n"
      log-stdout: '{{ inputs.log_output | default(true) }}'
  vuln-scan:
    name: Vulnerability Scanning
    needs:
    - url-discovery
    - takeover-check
    - param-discovery
    steps:
    - task: nuclei
      log-command: '{{ inputs.log_command | default(true) }}'
      name: nuclei-scan
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs[''url-discovery''].outputs.urls_file | default(jobs[''http-probe''].outputs.live_urls_file, true) }}'
        severity: critical,high,medium
      continue-on-error: true
    - task: dalfox
      log-command: '{{ inputs.log_command | default(true) }}'
      name: xss-scan
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs[''http-probe''].outputs.live_urls_file }}'
      continue-on-error: true
    - task: sqlmap
      log-command: "{{ inputs.log_command | default(true) }}"
      name: sqli-scan
      retry: 2
      retry-delay: 5
      if: '{{ jobs[''param-discovery''].outputs.param_url_count | default(0, true) | int > 0 }}'
      with:
        target: '{{ jobs[''param-discovery''].outputs.param_urls_file }}'
        batch: true
        level: 2
        risk: 2
      continue-on-error: true
    - task: crlfuzz
      log-command: "{{ inputs.log_command | default(true) }}"
      name: crlf-scan
      retry: 2
      retry-delay: 5
      if: '{{ jobs[''http-probe''].outputs.live_count | default(0, true) | int > 0 }}'
      with:
        target: '{{ jobs[''http-probe''].outputs.live_urls_file }}'
      continue-on-error: true
    - task: commix
      log-command: "{{ inputs.log_command | default(true) }}"
      name: cmdi-scan
      retry: 2
      retry-delay: 5
      if: '{{ jobs[''param-discovery''].outputs.param_url_count | default(0, true) | int > 0 }}'
      with:
        target: '{{ jobs[''param-discovery''].outputs.param_urls_file }}'
        batch: true
        level: 2
      continue-on-error: true
    - name: vuln-summary
      script: "all_vulns = []\nfor items in [\n    {{ vulns(steps[\"nuclei-scan\"].outputs.typed_outputs) | default([], true) | tojson }},\n    {{ vulns(steps[\"xss-scan\"].outputs.typed_outputs) | default([],\
        \ true) | tojson }},\n    {{ vulns(steps[\"sqli-scan\"].outputs.typed_outputs) | default([], true) | tojson }},\n    {{ vulns(steps[\"crlf-scan\"].outputs.typed_outputs) | default([], true) | tojson\
        \ }},\n    {{ vulns(steps[\"cmdi-scan\"].outputs.typed_outputs) | default([], true) | tojson }},\n]:\n    all_vulns.extend(items)\nby_sev = {}\nby_type = {}\nfor v in all_vulns:\n    s = v.get('severity',\
        \ 'unknown')\n    by_sev.setdefault(s, []).append(v)\n    name = v.get('name', 'unknown')\n    by_type.setdefault(name, []).append(v)\nsev_str = ', '.join(f\"{s.upper()}: {len(by_sev[s])}\" for\
        \ s in ['critical','high','medium','low','info'] if by_sev.get(s))\nprint(f\"\\nVulnerabilities: {len(all_vulns)} — {sev_str or 'none'}\")\ntop_types = sorted(by_type.items(), key=lambda x: -len(x[1]))[:8]\n\
        if top_types:\n    print(\"By type: \" + ', '.join(f\"{t} ({len(v)})\" for t, v in top_types))\n"
      log-stdout: '{{ inputs.log_output | default(true) }}'
