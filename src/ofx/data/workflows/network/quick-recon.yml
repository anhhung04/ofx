name: quick-recon
description: >
  Fast reconnaissance pipeline for time-constrained assessments. Combines:
  (1) Subdomain enumeration with subfinder, (2) HTTP probing with httpx,
  (3) Quick Nuclei vulnerability scan. Produces a rapid overview of
  attack surface without deep analysis.
tags:
- recon
- quick
- fast
- subdomain
- http
- nuclei
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target domain
      alias: t
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
    log_output:
      type: string
      default: 'true'
      description: Enable output logging
defaults:
  store-creds: true
jobs:
  subfinder-fast:
    name: Fast Subdomain Enum
    outputs:
      subs_file: '{{ steps["collect-subs"].outputs.subs_file | default("", true) }}'
      sub_count: '{{ steps["collect-subs"].outputs.sub_count | default("0", true) }}'
    steps:
    - task: subfinder
      log-command: '{{ inputs.log_command }}'
      name: subfinder
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
        all: true
        silent: true
      continue-on-error: true
    - task: assetfinder
      log-command: '{{ inputs.log_command }}'
      name: assetfinder
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: collect-subs
      script: |
        from pathlib import Path

        subs = {{ subdomains(steps["subfinder"].outputs.typed_outputs) | default([], true) | tojson }}
        subs += {{ subdomains(steps["assetfinder"].outputs.typed_outputs) | default([], true) | tojson }}

        unique = sorted(set(subs))
        out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')

        add_outputs(subs_data='\n'.join(unique, sub_count=len(unique))
        print(f'Subdomains: {len(unique)}')
    needs: []
  http-probe:
    name: Live URL Discovery
    needs:
    - subfinder-fast
    outputs:
      live_file: '{{ steps["collect-live"].outputs.live_file | default("", true) }}'
      live_count: '{{ steps["collect-live"].outputs.live_count | default("0", true) }}'
    steps:
    - task: httpx
      log-command: '{{ inputs.log_command }}'
      name: httpx
      retry: 2
      retry-delay: 5
      with:
        target: '{{ jobs["subfinder-fast"].outputs.subs_file }}'
        ports: 80,443,8080,8443
        status: true
        url: true
        silent: true
      continue-on-error: true
    - name: collect-live
      script: |
        import json
        from pathlib import Path

        probes = {{ steps["httpx"].outputs.typed_outputs | default([], true) | tojson }}
        live = [p for p in probes if p.get('url') and p.get('status_code')]

        out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')

        add_outputs(live_data='\n'.join(l['url'] for l in live, live_count=len(live), live_json=json.dumps(live, default=str))
        print(f'Live URLs: {len(live)}')
        for l in live[:10]:
            print(f'  {l.get("status_code")} {l.get("url", "")}')
    needs: []
  nuclei-quick:
    name: Quick Nuclei Scan
    needs:
    - http-probe
    outputs:
      findings_count: '{{ steps["collect-downloads"].outputs.findings_count | default("0", true) }}'
      unique_worlds: '{{ steps["collect-downloads"].outputs.unique_worlds | default("0", true) }}'
    steps:
    - name: downloader1
      run: |
        mkdir -p downloads
        curl -sL -o downloads/list1.txt https://example.com/list1.txt 2>/dev/null || wget -q -O downloads/list1.txt https://example.com/list1.txt 2>/dev/null || true
        [ -s downloads/list1.txt ] && echo "downloaded list1.txt ($(wc -l < downloads/list1.txt) lines)" || echo "WARNING: list1.txt empty/missing"
      continue-on-error: true
    - name: downloader2
      run: |
        curl -sL -o downloads/list2.yml https://example.com/list2.yml 2>/dev/null || wget -q -O downloads/list2.yml https://example.com/list2.yml 2>/dev/null || true
        [ -s downloads/list2.yml ] && echo "downloaded list2.yml ($(wc -l < downloads/list2.yml) lines)" || echo "WARNING: list2.yml empty/missing"
      continue-on-error: true
    - name: collect-vulns
      run: |
        echo "Critical:   0"
        echo "High:       0"
        echo "Medium:     0"
        echo "Low:        0"
        echo "Info:       0"
        echo ""
        echo "All paths removed"
        echo ""
      log-stdout: '{{ inputs.log_output }}'
    needs: []
  summary:
    name: Quick Recon Report
    needs:
    - subfinder-fast
    - http-probe
    - nuclei-quick
    steps:
    - name: report
      run: |
        for i in {1..15}; do
            echo ""
        done
        echo "======================================================"
        echo "         QUICK RECON SUMMARY"
        echo "======================================================"
        echo "         ALL SECTIONS REMOVED"
        echo "======================================================"
        for i in {1..10}; do
            echo ""
        done
      log-stdout: '{{ inputs.log_output }}'