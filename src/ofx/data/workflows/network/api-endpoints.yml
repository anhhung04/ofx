name: api-endpoints
description: >
  API endpoint discovery and mapping. Uses kiterunner, cherrybomb, katana, gospider,
  and paramspider to discover API routes, hidden endpoints, and parameters across
  web applications. Identifies undocumented APIs and potential attack surface.
tags:
  - recon
  - api
  - endpoints
  - discovery
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target URL or file with URLs
      alias: t
    threads:
      type: number
      default: 50
      description: Concurrent threads
    log_command:
      type: string
      default: "true"
      description: Enable command logging
    log_output:
      type: string
      default: "true"
      description: Enable output logging
defaults:
  store-creds: false
outputs:
  endpoints_file: '{{ jobs["collect"].outputs.endpoints_file | default("", true) }}'
  endpoint_count: '{{ jobs["collect"].outputs.endpoint_count | default("0", true) }}'
  typed_outputs: '{{ jobs["collect"].outputs.typed_outputs | default([], true) }}'
jobs:
  discover:
    name: API Endpoint Discovery
    outputs:
      katana_endpoints: '{{ steps["katana-crawl"].outputs.typed_outputs | default([], true) }}'
      gospider_endpoints: '{{ steps["gospider-crawl"].outputs.typed_outputs | default([], true) }}'
      kiterunner_endpoints: '{{ steps["kiterunner-scan"].outputs.typed_outputs | default([], true) }}'
    steps:
      - task: katana
        log-command: "{{ inputs.log_command | default(true) }}"
        name: katana-crawl
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
          depth: 3
          json: true
          silent: true
          field: "url,method,params,source"
        continue-on-error: true
      - task: gospider
        log-command: "{{ inputs.log_command | default(true) }}"
        name: gospider-crawl
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
          depth: 3
          threads: "{{ inputs.threads }}"
          json: true
          silent: true
        continue-on-error: true
      - task: kiterunner
        log-command: "{{ inputs.log_command | default(true) }}"
        name: kiterunner-scan
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
          threads: "{{ inputs.threads }}"
          json: true
        continue-on-error: true
      - task: cherrybomb
        log-command: "{{ inputs.log_command | default(true) }}"
        name: cherrybomb-scan
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      - task: paramspider
        log-command: "{{ inputs.log_command | default(true) }}"
        name: paramspider-scan
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
          threads: "{{ inputs.threads }}"
        continue-on-error: true
      - task: cariddi
        log-command: "{{ inputs.log_command | default(true) }}"
        name: cariddi-scan
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
          endpoints: true
          info: true
          secrets: true
        continue-on-error: true
      - task: urlfinder
        log-command: "{{ inputs.log_command | default(true) }}"
        name: urlfinder-scan
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
        continue-on-error: true
      - task: hakrawler
        log-command: "{{ inputs.log_command | default(true) }}"
        name: hakrawler-crawl
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.target }}"
          depth: 3
        continue-on-error: true
  collect:
    name: Collect and Normalize
    needs:
      - discover
    outputs:
      endpoints_file: '{{ steps["normalize"].outputs.endpoints_file | default("", true) }}'
      endpoint_count: '{{ steps["normalize"].outputs.endpoint_count | default("0", true) }}'
      typed_outputs: '{{ steps["normalize"].outputs.typed_outputs | default([], true) }}'
    steps:
      - name: normalize
        script: |
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          collected = set()
          endpoints = []

          for item in {{ jobs["discover"].outputs.katana_endpoints | default([], true) | tojson }}:
            url = item.get('url', '')
            if url:
              parsed = urlparse(url)
              normalized = f"{parsed.scheme}://{parsed.netloc}{parsed.path}"
              if normalized not in collected:
                collected.add(normalized)
                endpoints.append({
                  'url': url,
                  'normalized': normalized,
                  'method': item.get('method', 'GET'),
                  'params': item.get('params', []),
                  'source': 'katana'
                })

          for item in {{ jobs["discover"].outputs.gospider_endpoints | default([], true) | tojson }}:
            url = item.get('url', '')
            if url:
              parsed = urlparse(url)
              normalized = f"{parsed.scheme}://{parsed.netloc}{parsed.path}"
              if normalized not in collected:
                collected.add(normalized)
                endpoints.append({
                  'url': url,
                  'normalized': normalized,
                  'method': item.get('method', 'GET'),
                  'params': [],
                  'source': 'gospider'
                })

          for item in {{ jobs["discover"].outputs.kiterunner_endpoints | default([], true) | tojson }}:
            url = item.get('url', '') or item.get('endpoint', '')
            if url:
              if url not in collected:
                collected.add(url)
                endpoints.append({
                  'url': url,
                  'normalized': url,
                  'method': item.get('method', 'GET'),
                  'params': [],
                  'source': 'kiterunner'
                })

          out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')
          endpoints_file = f'{out_dir}/ofx_api_endpoints.txt'
          Path(endpoints_file).write_text('\\n'.join(sorted(collected)))

          add_outputs(
            endpoints_file=endpoints_file,
            endpoint_count=len(endpoints),
            typed_outputs=endpoints
          )
          print(f'API discovery: {len(endpoints)} unique endpoints found')
  summary:
    name: Summary
    needs:
      - collect
    steps:
      - name: report
        run: |
          echo "=========================================="
          echo " API ENDPOINT DISCOVERY RESULTS"
          echo "=========================================="
          echo ""
          echo "Unique endpoints: {{ jobs.collect.outputs.endpoint_count | default('0', true) }}"
          echo "Output: {{ jobs.collect.outputs.endpoints_file | default('none', true) }}"
          echo "=========================================="
        log-stdout: "{{ inputs.log_output | default(true) }}"
