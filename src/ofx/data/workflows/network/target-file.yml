name: target-file
description: >
  Utility workflow — takes a list of targets (newline-separated string)
  and writes them to a temp file under OFX_RUN_DIR. Returns the file
  path for use by downstream tasks that require file-based targets.
  Used by other workflows via `uses: target-file` to keep file handling
  explicit in the workflow layer rather than hidden in task code.
tags:
- utility
- infrastructure
- target-handling
dispatch:
  inputs:
    targets:
      required: true
      type: string
      description: Newline-separated list of targets
    prefix:
      type: string
      default: 'ofx_targets'
      description: "File name prefix (default: ofx_targets)"
jobs:
  write:
    name: Write targets to file
    outputs:
      targets_file: '{{ steps["write-file"].outputs.targets_file | default("", true) }}'
      target_count: '{{ steps["write-file"].outputs.target_count | default("0", true) }}'
    steps:
    - name: write-file
      script: |
        from pathlib import Path

        targets = """{{ inputs.targets }}""".strip()
        if not targets:
            add_outputs(targets_file='', target_count=0)
            print('WARNING: No targets provided')
        else:
            target_list = [t.strip() for t in targets.split('\n') if t.strip()]
            out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')
            filename = f'{out_dir}/{{ inputs.prefix }}.txt'
            Path(filename).write_text('\n'.join(target_list))
            add_outputs(targets_file=filename, target_count=len(target_list))
            print(f'Target file written: {filename} ({len(target_list)} targets)')
    needs: []
