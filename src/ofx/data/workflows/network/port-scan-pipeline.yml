name: port-scan-pipeline
description: >
  Comprehensive port scanning pipeline. Combines rapid discovery (naabu/rustscan)
  with detailed service enumeration (nmap). Supports UDP scanning, version detection,
  script scanning, and firewall detection.
tags:
- recon
- ports
- network
- nmap
- service-discovery
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target IP, hostname, or CIDR
      alias: t
    ports:
      type: string
      default: 'top-1000'
      description: Port range (top-100, top-1000, top-10000, full, or custom like 1-65535)
    scan_type:
      type: string
      default: 'tcp'
      description: Scan type (tcp, udp, or both)
    timing:
      type: string
      default: 'T4'
      description: Nmap timing template (T0-T5)
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
    log_output:
      type: string
      default: 'true'
      description: Enable output logging
defaults:
  store-creds: true
jobs:
  fast-discovery:
    name: Rapid Port Discovery
    outputs:
      ports_file: '{{ steps["merge-fast"].outputs.ports_file | default("", true) }}'
      port_count: '{{ steps["merge-fast"].outputs.port_count | default("0", true) }}'
    steps:
    - task: naabu
      log-command: '{{ inputs.log_command }}'
      name: naabu-scan
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
        ports: '{{ inputs.ports }}'
        rate: 5000
        timeout: 3
        retries: 2
        silent: true
      continue-on-error: true
    - task: rustscan
      log-command: '{{ inputs.log_command }}'
      name: rustscan-scan
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
        range: '{{ "1-65535" if inputs.ports == "full" else inputs.ports if inputs.ports != "top-100" and inputs.ports != "top-1000" and inputs.ports != "top-10000" else "1-10000" }}'
        batch_size: 4500
        timeout: 1500
      continue-on-error: true
    - name: merge-fast
      script: |
        from pathlib import Path

        ports_n = {{ ports(steps["naabu-scan"].outputs.typed_outputs) | default([], true) | tojson }}
        ports_r = {{ ports(steps["rustscan-scan"].outputs.typed_outputs) | default([], true) | tojson }}

        seen = set()
        port_lines = []
        for p in ports_n + ports_r:
            key = f"{p.get('host', p.get('ip', ''))}:{p.get('port', '')}"
            if key not in seen:
                seen.add(key)
                if p.get('port'):
                    port_lines.append(f"{p.get('host', p.get('ip', ''))}:{p.get('port')}")

        out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')

        add_outputs(ports_data='\n'.join(sorted(set(port_lines, port_count=len(set(port_lines)))
        print(f'Fast discovery: {len(set(port_lines))} open port entries')
    needs: []
  version-detect:
    name: Service Version Detection
    needs:
    - fast-discovery
    outputs:
      services_file: '{{ steps["report-services"].outputs.services_file | default("", true) }}'
      service_count: '{{ steps["report-services"].outputs.service_count | default("0", true) }}'
    steps:
    - task: nmap
      log-command: '{{ inputs.log_command }}'
      name: nmap-service
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
        port: |
          {{ jobs['fast-discovery'].outputs.ports_file | portfile_to_nmap }}
        version_detection: true
        version_intensity: 7
        timing: '{{ inputs.timing }}'
      continue-on-error: true
    - task: nmap
      log-command: '{{ inputs.log_command }}'
      name: nmap-scripts
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
        port: |
          {{ jobs['fast-discovery'].outputs.ports_file | portfile_to_nmap }}
        scripts: default,safe,banner,http-title,ssl-cert
        timing: '{{ inputs.timing }}'
      continue-on-error: true
    - name: report-services
      script: |
        import json
        from pathlib import Path

        svcs = (
            {{ steps["nmap-service"].outputs.typed_outputs | default([], true) | tojson }} +
            {{ steps["nmap-scripts"].outputs.typed_outputs | default([], true) | tojson }}
        )

        out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')

        add_outputs(services_data=json.dumps(svcs, indent=2, default=str, service_count=len(svcs))
        print(f'Services identified: {len(svcs)}')
        for s in svcs[:15]:
            svc = s.get('service', '?')
            ver = s.get('version', '')
            prod = s.get('product', '')
            print(f'  {s.get("port", "")}: {prod} {ver} ({svc})')
    needs: []
  udp-scan:
    name: UDP Port Scan
    needs:
    - fast-discovery
    run_if: '{{ inputs.scan_type == "udp" or inputs.scan_type == "both" }}'
    steps:
    - task: nmap
      log-command: '{{ inputs.log_command }}'
      name: nmap-udp
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
        port: |
          {{ jobs['fast-discovery'].outputs.ports_file | portfile_to_nmap }}
        udp_scan: true
        timing: '{{ inputs.timing }}'
        max_retries: 2
      continue-on-error: true
    - name: report-udp
      script: |
        udps = {{ steps["nmap-udp"].outputs.typed_outputs | default([], true) | tojson }}
        print(f'UDP services: {len(udps)}')
        for u in udps[:10]:
            print(f'  {u.get("port", "")}: {u.get("service", "")}')
    needs: []
  summary:
    name: Port Scan Summary
    needs:
    - fast-discovery
    - version-detect
    - udp-scan
    steps:
    - name: report
      run: |
        echo "======================================================"
        echo " PORT SCAN: {{ inputs.target }}"
        echo "======================================================"
        echo ""
        echo "  Open ports discovered: {{ jobs['fast-discovery'].outputs.port_count }}"
        echo "  Services identified: {{ jobs['version-detect'].outputs.service_count }}"
        echo ""
        echo "  Ports: {{ jobs['fast-discovery'].outputs.ports_file }}"
        echo "  Services: {{ jobs['version-detect'].outputs.services_file }}"
        echo "======================================================"
      log-stdout: '{{ inputs.log_output }}'