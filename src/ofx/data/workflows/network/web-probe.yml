name: web-probe
description: >
  Web probing and technology fingerprinting — takes verified subdomains,
  probes HTTP services, detects WAF/CDN, captures screenshots, identifies
  technologies, and discovers HTTP technologies.
tags:
- recon
- web
- http
- fingerprint
- screenshot
- waf
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target domain or subdomain list
      alias: t
    subdomains_file:
      type: string
      default: ''
      description: Path to subdomain list (auto-resolves if not provided)
    resolved_file:
      type: string
      default: ''
      description: Pre-resolved IP list
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
    log_output:
      type: string
      default: 'true'
      description: Enable output logging
defaults:
  store-creds: true
jobs:
  http-probe:
    name: HTTP Probing
    outputs:
      live_urls_file: '{{ steps["merge-live"].outputs.live_urls_file | default("", true) }}'
      live_count: '{{ steps["merge-live"].outputs.live_count | default("0", true) }}'
      live_json: '{{ steps["merge-live"].outputs.live_json | default("[]", true) }}'
    steps:
    - task: httpx
      log-command: '{{ inputs.log_command }}'
      name: httpx-probe
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.subdomains_file if inputs.subdomains_file else inputs.target }}'
        ports: 80,443,8080,8443,8000,8888,3000,5000
        json: true
        title: true
        server: true
        tech_detect: true
        status: true
        follow_redirects: true
        timeout: 10
        rate_limit: 50
        silent: true
      continue-on-error: true
    - name: merge-live
      script: |
        import json
        from pathlib import Path

        probes = {{ steps["httpx-probe"].outputs.typed_outputs | default([], true) | tojson }}
        live = [p for p in probes if p.get('status_code') and p.get('url')]

        live_urls = [l['url'] for l in live]
        out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')

        add_outputs(live_urls_file='\n'.join(live_urls, live_count=len(live), live_json=json.dumps(live, default=str))
        print(f'Live URLs: {len(live)}')
        for l in live[:10]:
            print(f"  {l.get('status_code')} {l.get('url')} [{l.get('tech', '?')}]")
    needs: []
  fingerprint:
    name: Technology Fingerprinting
    needs:
    - http-probe
    outputs:
      tech_file: '{{ steps["report-tech"].outputs.tech_file | default("", true) }}'
      tech_count: '{{ steps["report-tech"].outputs.tech_count | default("0", true) }}'
    steps:
    - task: whatweb
      log-command: '{{ inputs.log_command }}'
      name: whatweb-scan
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.subdomains_file if inputs.subdomains_file else inputs.target }}'
        aggression: 3
      continue-on-error: true
    - task: wafw00f
      log-command: '{{ inputs.log_command }}'
      name: wafw00f-scan
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.subdomains_file if inputs.subdomains_file else inputs.target }}'
      continue-on-error: true
    - task: cdncheck
      log-command: '{{ inputs.log_command }}'
      name: cdncheck-detect
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.subdomains_file if inputs.subdomains_file else inputs.target }}'
      continue-on-error: true
    - task: favirecon
      log-command: '{{ inputs.log_command }}'
      name: favirecon-scan
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - name: report-tech
      script: |
        import json
        from pathlib import Path

        whatweb = {{ steps["whatweb-scan"].outputs.typed_outputs | default([], true) | tojson }}
        waf = {{ vulns(steps["wafw00f-scan"].outputs.typed_outputs) | default([], true) | tojson }}
        cdn = {{ steps["cdncheck-detect"].outputs.typed_outputs | default([], true) | tojson }}

        out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')

        add_outputs(tech_data=json.dumps({'whatweb': whatweb, 'waf': waf, 'cdn': cdn}, indent=2, default=str, tech_count=len(whatweb))
        print(f'Fingerprinted: {len(whatweb)} hosts')
        waf_names = sorted({w.get('name', '') for w in waf if w.get('name')})
        if waf_names:
            print(f'WAFs detected: {", ".join(waf_names)}')
    needs: []
  screenshots:
    name: Screenshot Capture
    needs:
    - http-probe
    steps:
    - task: gowitness
      log-command: '{{ inputs.log_command }}'
      name: gowitness-screenshot
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.subdomains_file if inputs.subdomains_file else inputs.target }}'
      continue-on-error: true
    - name: report-screenshots
      script: |
        print('Screenshot capture complete')
    needs: []
  http-security:
    name: HTTP Security Headers Check
    needs:
    - http-probe
    steps:
    - task: csprecon
      log-command: '{{ inputs.log_command }}'
      name: csprecon-scan
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.subdomains_file if inputs.subdomains_file else inputs.target }}'
      continue-on-error: true
    - name: report-headers
      script: |
        csp_findings = {{ steps["csprecon-scan"].outputs.typed_outputs | default([], true) | tojson }}
        print(f'CSP analysis: {len(csp_findings)} hosts scanned')
        weak = [c for c in csp_findings if c.get('weak') or c.get('missing')]
        if weak:
            print(f'Weak/missing CSP: {len(weak)} hosts')
    needs: []
  summary:
    name: Web Probe Summary
    needs:
    - http-probe
    - fingerprint
    - screenshots
    - http-security
    steps:
    - name: report
      run: |
        echo "======================================================"
        echo " WEB PROBE REPORT: {{ inputs.target }}"
        echo "======================================================"
        echo ""
        echo "Live HTTP services: {{ jobs['http-probe'].outputs.live_count }}"
        echo "Technologies identified: {{ jobs['fingerprint'].outputs.tech_count }}"
        echo ""
        echo "Output files:"
        echo "  Live URLs: {{ jobs['http-probe'].outputs.live_urls_file }}"
        echo "  Tech fingerprint: {{ jobs['fingerprint'].outputs.tech_file }}"
        echo "======================================================"
      log-stdout: '{{ inputs.log_output }}'