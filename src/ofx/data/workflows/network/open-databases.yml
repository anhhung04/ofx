name: open-databases
description: >
  Open database detection — scans for publicly accessible database services including
  MongoDB, Redis, Elasticsearch, Memcached, CouchDB, Cassandra, and PostgreSQL.
  Uses nuclei database detection templates and nmap NSE scripts to identify open
  instances and extract version information.
tags:
  - recon
  - database
  - mongodb
  - redis
  - elasticsearch
dispatch:
  inputs:
    targets:
      required: true
      type: string
      description: Target IP(s), CIDR range, or file with targets
      alias: t
    log_command:
      type: string
      default: "true"
      description: Enable command logging
    log_output:
      type: string
      default: "true"
      description: Enable output logging
defaults:
  store-creds: false
outputs:
  databases_file: '{{ jobs["collect"].outputs.databases_file | default("", true) }}'
  database_count: '{{ jobs["collect"].outputs.database_count | default("0", true) }}'
  typed_outputs: '{{ jobs["collect"].outputs.typed_outputs | default([], true) }}'
jobs:
  discover:
    name: Database Discovery
    steps:
      - task: nmap
        log-command: "{{ inputs.log_command | default(true) }}"
        name: nmap-db-scan
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.targets }}"
          ports: "27017,27018,6379,9200,9300,11211,5984,9042,5432,3306,1433,1521,9092"
          script: "banner,mongodb-info,redis-info,mongodb-databases"
          json: true
          output_prefix: "databases"
        continue-on-error: true
      - task: nuclei
        log-command: "{{ inputs.log_command | default(true) }}"
        name: nuclei-databases
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.targets }}"
          tags: "database,mongodb,redis,elasticsearch,memcached,couchdb,cassandra,postgresql,mysql,mssql,oracle"
          severity: "critical,high,medium,low,info"
          rate_limit: 50
          json: true
          silent: true
        continue-on-error: true
      - task: nuclei
        log-command: "{{ inputs.log_command | default(true) }}"
        name: nuclei-db-exposure
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.targets }}"
          tags: "unauth,misconfig,default-login,anonymous"
          severity: "critical,high,medium"
          rate_limit: 50
          json: true
          silent: true
        continue-on-error: true
  collect:
    name: Collect Results
    needs:
      - discover
    outputs:
      databases_file: '{{ steps["collect-dbs"].outputs.databases_file | default("", true) }}'
      database_count: '{{ steps["collect-dbs"].outputs.database_count | default("0", true) }}'
      typed_outputs: '{{ steps["collect-dbs"].outputs.typed_outputs | default([], true) }}'
    steps:
      - name: collect-dbs
        script: |
          import json
          from pathlib import Path

          databases = []
          seen = set()

          nmap_data = {{ steps["nmap-db-scan"].outputs.typed_outputs | default([], true) | tojson }}
          for host in nmap_data:
            ip = host.get('ip', '')
            for port in host.get('ports', []):
              state = port.get('state', '')
              if state == 'open':
                key = f"{ip}:{port.get('port', 0)}"
                if key not in seen:
                  seen.add(key)
                  databases.append({
                    'ip': ip,
                    'port': port.get('port', 0),
                    'service': port.get('service', ''),
                    'version': port.get('version', ''),
                    'info': port.get('product', ''),
                    'source': 'nmap'
                  })

          for vuln in {{ vulns(steps["nuclei-databases"].outputs.typed_outputs) | default([], true) | tojson }}:
            host = vuln.get('host', '')
            if host:
              if host not in {d.get('ip', '') + ':' + str(d.get('port', '')) for d in databases}:
                databases.append({
                  'ip': host,
                  'port': 0,
                  'service': 'database',
                  'name': vuln.get('name', ''),
                  'severity': vuln.get('severity', 'info'),
                  'source': 'nuclei-database'
                })

          for vuln in {{ vulns(steps["nuclei-db-exposure"].outputs.typed_outputs) | default([], true) | tojson }}:
            host = vuln.get('host', '')
            if host:
              databases.append({
                'ip': host,
                'port': 0,
                'service': 'database',
                'name': vuln.get('name', ''),
                'severity': vuln.get('severity', 'info'),
                'source': 'nuclei-misconfig'
              })

          out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')
          databases_file = f'{out_dir}/ofx_databases.txt'
          Path(databases_file).write_text('\\n'.join(
            [f"{d.get('ip', '')}:{d.get('port', '')} {d.get('service', '')} {d.get('severity', '')}" for d in databases]
          ))

          add_outputs(
            databases_file=databases_file,
            database_count=len(databases),
            typed_outputs=databases
          )
          print(f'Database scan: {len(databases)} accessible instances found')
  summary:
    name: Summary
    needs:
      - collect
    steps:
      - name: report
        run: |
          echo "=========================================="
          echo " OPEN DATABASE SCAN RESULTS"
          echo "=========================================="
          echo ""
          echo "Targets: {{ inputs.targets }}"
          echo "Databases found: {{ jobs.collect.outputs.database_count | default('0', true) }}"
          echo ""
          {% set dbs = jobs.collect.outputs.typed_outputs | default([], true) %}
          {% for d in dbs[:20] %}
          echo "  {{ d.ip }}:{{ d.port }} {{ d.service }} [{{ d.severity | default('info') }}]"
          {% endfor %}
          echo "=========================================="
        log-stdout: "{{ inputs.log_output | default(true) }}"
