name: recursive-domain-scan
description: >
  Recursive domain scanner — discovers all subdomains (passive + cert-based +
  permutation) using subfinder, verifies with dnsx, then fans out deep
  host-scan on every verified host in parallel via matrix strategy.
tags:
- recon
- dns
- recursive
- subdomain
- vuln
- network
- http
dispatch:
  inputs:
    log_command:
      type: string
      default: 'true'
      description: Enable command logging
    log_output:
      type: string
      default: 'true'
      description: Enable output logging
    target:
      required: true
      type: string
      description: Root domain to scan recursively (e.g. example.com)
      alias: t
    max_parallel:
      type: string
      default: '5'
      description: Max concurrent per-subdomain scans
    skip_deep:
      type: string
      default: 'false'
      description: Set to true to skip per-host deep scans
defaults:
  store-creds: true
jobs:
  subdomain-discovery:
    name: Subdomain Discovery
    outputs:
      verified_file: '{{ steps["export-verified"].outputs.verified_file | default("", true) }}'
      verified_count: '{{ steps["export-verified"].outputs.verified_count | default("0", true) }}'
      verified_hosts_json: '{{ steps["export-verified"].outputs.verified_hosts_json | default("[]", true) }}'
    steps:
    - task: subfinder
      log-command: '{{ inputs.log_command }}'
      name: subfinder-enum
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
        all: true
      continue-on-error: true
    - task: dnsx
      log-command: '{{ inputs.log_command }}'
      name: dnsx-verify
      retry: 2
      retry-delay: 5
      with:
        target: '{{ steps["subfinder-enum"].outputs.stdout | default(inputs.target, true) }}'
        a: true
        cname: true
        resp: true
      continue-on-error: true
    - task: gotator
      log-command: '{{ inputs.log_command }}'
      name: gotator-perm
      retry: 2
      retry-delay: 5
      with:
        target: '{{ inputs.target }}'
        depth: '2'
      continue-on-error: true
    - name: export-verified
      script: |
        import json
        from pathlib import Path

        subfinder_subs = {{ subdomains(steps["subfinder-enum"].outputs.typed_outputs) | default([], true) | tojson }}
        dnsx_subs = {{ subdomains(steps["dnsx-verify"].outputs.typed_outputs) | default([], true) | tojson }}
        gotator_subs = {{ subdomains(steps["gotator-perm"].outputs.typed_outputs) | default([], true) | tojson }}

        all_subs = sorted(set(subfinder_subs + dnsx_subs + gotator_subs))

        verified_path = f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_rds_verified.txt'
        Path(verified_path).write_text('\n'.join(all_subs))

        add_outputs(
            verified_file=verified_path,
            verified_count=len(all_subs),
            verified_hosts_json=json.dumps(all_subs),
        )
        print(f"Recursive discovery complete: {len(all_subs)} verified hosts")
    needs: []
  per-host-scan:
    name: 'Deep scan: {{ matrix.target }}'
    needs:
    - subdomain-discovery
    run_if: '{{ inputs.skip_deep != "true" }}'
    strategy:
      matrix:
        target: '{{ jobs["subdomain-discovery"].outputs.verified_hosts_json }}'
      max_parallel: 5
      fail_fast: false
    steps:
    - task: httpx
      log-command: '{{ inputs.log_command }}'
      name: httpx-probe
      retry: 2
      retry-delay: 5
      with:
        target: '{{ matrix.target }}'
        status_code: true
        title: true
        tech_detect: true
      continue-on-error: true
    - task: naabu
      log-command: '{{ inputs.log_command }}'
      name: naabu-ports
      retry: 2
      retry-delay: 5
      with:
        target: '{{ matrix.target }}'
        top_ports: '100'
      continue-on-error: true
