name: ldap-enum
description: >
  LDAP enumeration — scans for LDAP services and attempts anonymous bind, extracts
  domain information, enumerates users, groups, and trusts. Uses ldapdomaindump,
  ldeep, and nmap LDAP scripts for comprehensive domain information gathering.
tags:
  - recon
  - ldap
  - active-directory
  - enumeration
  - anonymous-bind
dispatch:
  inputs:
    targets:
      required: true
      type: string
      description: Target IP(s), hostname, or file with targets
      alias: t
    log_command:
      type: string
      default: "true"
      description: Enable command logging
    log_output:
      type: string
      default: "true"
      description: Enable output logging
defaults:
  store-creds: false
outputs:
  ldap_file: '{{ jobs["collect"].outputs.ldap_file | default("", true) }}'
  ldap_count: '{{ jobs["collect"].outputs.ldap_count | default("0", true) }}'
  anon_bind_count: '{{ jobs["collect"].outputs.anon_bind_count | default("0", true) }}'
  typed_outputs: '{{ jobs["collect"].outputs.typed_outputs | default([], true) }}'
jobs:
  discover:
    name: LDAP Discovery
    steps:
      - task: nmap
        log-command: "{{ inputs.log_command | default(true) }}"
        name: nmap-ldap
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.targets }}"
          ports: "389,636,3268,3269"
          script: "ldap-search,ldap-rootdse,ldap-novell-gateway,banner"
          json: true
          output_prefix: "ldap"
        continue-on-error: true
      - task: ldapdomaindump
        log-command: "{{ inputs.log_command | default(true) }}"
        name: ldapdomaindump-scan
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.targets }}"
          output: "ldap_domain_dump"
        continue-on-error: true
      - task: ldeep
        log-command: "{{ inputs.log_command | default(true) }}"
        name: ldeep-scan
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.targets }}"
          enum: "users,groups,computers,trusts,policies"
        continue-on-error: true
      - task: nuclei
        log-command: "{{ inputs.log_command | default(true) }}"
        name: nuclei-ldap
        retry: 2
        retry-delay: 5
        with:
          target: "{{ inputs.targets }}"
          tags: "ldap,anonymous-bind,directory,domain"
          severity: "info,low,medium,high"
          rate_limit: 50
          json: true
          silent: true
        continue-on-error: true
  collect:
    name: Collect Results
    needs:
      - discover
    outputs:
      ldap_file: '{{ steps["collect-ldap"].outputs.ldap_file | default("", true) }}'
      ldap_count: '{{ steps["collect-ldap"].outputs.ldap_count | default("0", true) }}'
      anon_bind_count: '{{ steps["collect-ldap"].outputs.anon_bind_count | default("0", true) }}'
      typed_outputs: '{{ steps["collect-ldap"].outputs.typed_outputs | default([], true) }}'
    steps:
      - name: collect-ldap
        script: |
          import json
          from pathlib import Path

          ldap_hosts = []
          anonymous_binds = 0

          nmap_data = {{ steps["nmap-ldap"].outputs.typed_outputs | default([], true) | tojson }}
          for host in nmap_data:
            ip = host.get('ip', '')
            for port in host.get('ports', []):
              state = port.get('state', '')
              if state == 'open':
                scripts = port.get('scripts', {})
                rootdse = scripts.get('ldap-rootdse', {})
                search = scripts.get('ldap-search', '')

                is_anon = False
                if isinstance(rootdse, dict) and rootdse:
                  is_anon = True
                  anonymous_binds += 1
                elif isinstance(search, str) and 'namingContexts' in search:
                  is_anon = True
                  anonymous_binds += 1

                ldap_hosts.append({
                  'ip': ip,
                  'port': port.get('port', 0),
                  'service': port.get('service', 'ldap'),
                  'anonymous_bind': is_anon,
                  'naming_contexts': str(rootdse.get('namingContexts', ''))[:200] if isinstance(rootdse, dict) else '',
                  'source': 'nmap'
                })

          ldd_path = Path('ldap_domain_dump')
          if ldd_path.exists():
            for f in ldd_path.glob('*.html'):
              ldap_hosts.append({
                'ip': '',
                'port': 389,
                'service': 'ldap',
                'anonymous_bind': True,
                'naming_contexts': f.stem,
                'source': 'ldapdomaindump'
              })

          ldeep_data = {{ steps["ldeep-scan"].outputs.typed_outputs | default([], true) | tojson }}
          for item in ldeep_data:
            if item:
              ldap_hosts.append({
                'ip': item.get('host', ''),
                'port': 389,
                'service': 'ldap',
                'name': item.get('info', ''),
                'source': 'ldeep'
              })

          for vuln in {{ vulns(steps["nuclei-ldap"].outputs.typed_outputs) | default([], true) | tojson }}:
            host = vuln.get('host', '')
            if host:
              ldap_hosts.append({
                'ip': host,
                'port': 389,
                'service': 'ldap',
                'name': vuln.get('name', ''),
                'severity': vuln.get('severity', 'info'),
                'source': 'nuclei'
              })

          out_dir = os.environ.get('OFX_RUN_DIR', '/tmp')
          ldap_file = f'{out_dir}/ofx_ldap_hosts.txt'
          Path(ldap_file).write_text('\\n'.join(
            [f"{h['ip']}:{h['port']} {'ANON' if h.get('anonymous_bind') else ''} {h.get('naming_contexts', '')[:60]}" for h in ldap_hosts]
          ))

          add_outputs(
            ldap_file=ldap_file,
            ldap_count=len(ldap_hosts),
            anon_bind_count=anonymous_binds,
            typed_outputs=ldap_hosts
          )
          print(f'LDAP scan: {len(ldap_hosts)} hosts, {anonymous_binds} anonymous binds')
  summary:
    name: Summary
    needs:
      - collect
    steps:
      - name: report
        run: |
          echo "=========================================="
          echo " LDAP ENUMERATION RESULTS"
          echo "=========================================="
          echo ""
          echo "Targets: {{ inputs.targets }}"
          echo "LDAP hosts: {{ jobs.collect.outputs.ldap_count | default('0', true) }}"
          echo "Anonymous binds: {{ jobs.collect.outputs.anon_bind_count | default('0', true) }}"
          echo ""
          {% set hosts = jobs.collect.outputs.typed_outputs | default([], true) %}
          {% for h in hosts[:20] %}
          echo "  {{ h.ip }}:{{ h.port }}{% if h.get('anonymous_bind') %} [ANONYMOUS BIND]{% endif %}"
          {% endfor %}
          echo "=========================================="
        log-stdout: "{{ inputs.log_output | default(true) }}"
