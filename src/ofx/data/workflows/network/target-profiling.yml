name: target-profiling
description: >
  Deep OSINT target profiling — harvests emails, social accounts, breach data, domain registration info, and online presence for a target organization or individual.
tags:
- osint
- recon
- email
- social
- breach
dispatch:
  inputs:
    log_command:
      type: string
      default: 'true'
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: 'true'
      description: Enable stdout output log files for steps when set to true/false.
    target:
      required: true
      type: string
      description: Target domain or email address
      alias: t
    username:
      type: string
      default: ''
      description: Specific username to investigate
defaults:
  store-creds: true
jobs:
  domain-intel:
    name: Domain Intelligence
    outputs:
      sub_count: '{{ steps["collect-domain"].outputs.sub_count | default("", true) }}'
      record_count: '{{ steps["collect-domain"].outputs.record_count | default("", true) }}'
    steps:
    - task: subfinder
      log-command: '{{ inputs.log_command | default(true) }}'
      name: subfinder-enum
      with:
        target: '{{ inputs.target }}'
      continue-on-error: true
    - task: dnsx
      log-command: '{{ inputs.log_command | default(true) }}'
      name: dnsx-resolve
      with:
        target: '{{ inputs.target }}'
        a: true
        aaaa: true
        mx: true
        ns: true
        cname: true
      continue-on-error: true
    - name: collect-domain
      script: 'subs = {{ subdomains(steps["subfinder-enum"].outputs.typed_outputs) | tojson }}

        sub_count = len(subs)

        records = {{ records(steps["dnsx-resolve"].outputs.typed_outputs) | tojson }}

        add_outputs(sub_count=sub_count, record_count=len(records))

        print(f"Subdomains: {sub_count}, DNS records: {len(records)}")

        '
    needs: []
  email-harvest:
    name: Email Harvesting
    outputs:
      emails: '{{ steps["collect-emails"].outputs.emails | default("", true) }}'
      email_count: '{{ steps["collect-emails"].outputs.email_count | default("", true) }}'
    steps:
    - task: theharvester
      log-command: '{{ inputs.log_command | default(true) }}'
      name: theharvester-search
      with:
        target: '{{ inputs.target }}'
        source: all
        limit: 500
      continue-on-error: true
    - name: collect-emails
      script: "import re\n\nemails = set()\nth_out = {{ steps[\"theharvester-search\"].outputs.typed_outputs | tojson }}\nfor item in th_out:\n    if item.get('_type') == 'user_account' and item.get('username'):\n\
        \        if '@' in item['username']:\n            emails.add(item['username'])\n    if item.get('_type') == 'subdomain' and '@' in item.get('host', ''):\n        emails.add(item['host'])\n\nraw\
        \ = '{{ steps[\"theharvester-search\"].outputs.stdout | default(\"\", true) }}'\nfound = re.findall(r'[\\w.+-]+@[\\w-]+\\.[\\w.-]+', raw)\nemails.update(found)\n\nemail_list = '\\n'.join(sorted(emails))\n\
        with open(f'{os.environ.get(\"OFX_RUN_DIR\", \"/tmp\")}/ofx_harvested_emails.txt', 'w') as f:\n    f.write(email_list)\n\nadd_outputs(emails=email_list, email_count=len(emails))\nprint(f\"Harvested\
        \ {len(emails)} email addresses\")\n"
    needs: []
  account-check:
    name: Account Verification
    outputs:
      account_count: '{{ steps["collect-accounts"].outputs.account_count | default("", true) }}'
      services_with_accounts: '{{ steps["collect-accounts"].outputs.services_with_accounts | default("", true) }}'
    needs:
    - email-harvest
    steps:
    - task: holehe
      log-command: '{{ inputs.log_command | default(true) }}'
      name: holehe-check
      with:
        target: '{{ jobs[''email-harvest''].outputs.emails | default(inputs.target, true) }}'
        only_used: true
      continue-on-error: true
    - name: collect-accounts
      script: "accounts = {{ users(steps[\"holehe-check\"].outputs.typed_outputs) | tojson }}\nservices = set()\nfor a in accounts:\n    if a.get('host'):\n        services.add(a['host'])\n\nadd_outputs(account_count=len(accounts),\
        \ services_with_accounts=','.join(sorted(services)))\nprint(f\"Email registered on {len(services)} services\")\n"
  social-recon:
    name: Social Media & Username Search
    outputs:
      social_count: '{{ steps["collect-social"].outputs.social_count | default("", true) }}'
      platforms: '{{ steps["collect-social"].outputs.platforms | default("", true) }}'
    steps:
    - task: maigret
      log-command: '{{ inputs.log_command | default(true) }}'
      name: maigret-search
      with:
        target: '{{ inputs.username if inputs.username else inputs.target.split(''.'')[0] }}'
      continue-on-error: true
    - name: collect-social
      script: "social = {{ users(steps[\"maigret-search\"].outputs.typed_outputs) | tojson }}\nplatforms = set()\nfor s in social:\n    if s.get('host'):\n        platforms.add(s['host'])\n\nadd_outputs(social_count=len(social),\
        \ platforms=','.join(sorted(platforms)))\nprint(f\"Found {len(social)} social accounts across {len(platforms)} platforms\")\n"
    needs: []
  breach-search:
    name: Breach Database Search
    outputs:
      breach_count: '{{ steps["collect-breaches"].outputs.breach_count | default("", true) }}'
      breached_emails: '{{ steps["collect-breaches"].outputs.breached_emails | default("", true) }}'
    needs:
    - email-harvest
    steps:
    - task: h8mail
      log-command: '{{ inputs.log_command | default(true) }}'
      name: h8mail-breach
      with:
        target: '{{ jobs[''email-harvest''].outputs.emails | default(inputs.target, true) }}'
      continue-on-error: true
    - name: collect-breaches
      script: "breach_data = {{ users(steps[\"h8mail-breach\"].outputs.typed_outputs) | tojson }}\nbreached_emails = set()\nfor b in breach_data:\n    if b.get('username'):\n        breached_emails.add(b['username'])\n\
        \nadd_outputs(breach_count=len(breach_data), breached_emails=len(breached_emails))\nprint(f\"Breach entries: {len(breach_data)} for {len(breached_emails)} emails\")\n"
  secret-scan:
    name: Secret & Leak Scanning
    steps:
    - task: nuclei
      log-command: '{{ inputs.log_command | default(true) }}'
      name: nuclei-secrets
      with:
        target: '{{ inputs.target }}'
        tags: exposure,token,secret
      continue-on-error: true
    needs: []
