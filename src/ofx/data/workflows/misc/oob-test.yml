name: oob-test
description: |
  Out-of-band interaction test — set up an Interactsh listener,
  send test requests with OOB callbacks, and poll for interactions.
tags: [misc, oob, interactsh, testing]
dispatch:
  inputs:
    target:
      required: true
      type: string
      description: Target URL to test for OOB interactions
      alias: t
    method:
      type: string
      default: http
      description: "OOB callback method: http or dns"

jobs:
  setup:
    name: Setup Interactsh Listener
    outputs:
      callback_url: "{{ steps.start-listener.outputs.callback_url }}"
      callback_flag: "{{ steps.start-listener.outputs.callback_flag }}"
    steps:
    - name: start-listener
      timeout: 3
      continue-on-error: true
      script: |
        from ofx.api.oob import Interactsh

        method = "{{ inputs.method }}"
        print(f"[*] Setting up Interactsh listener (method={method})...")

        client = Interactsh()
        client.register()

        url, flag = client.build_request(length=12, method=method)
        print(f"[+] Callback URL: {url}")
        print(f"[+] Tracking flag: {flag}")

        with open("{{ env.OFX_OUTPUTS }}", "a") as f:
            f.write(f"callback_url={url}\n")
            f.write(f"callback_flag={flag}\n")

  probe:
    name: Send OOB Probes
    needs: [setup]
    outputs:
      probes_sent: "{{ steps.send-probes.outputs.probes_sent }}"
    steps:
    - name: send-probes
      timeout: 3
      continue-on-error: true
      script: |
        from ofx.api.http import fetch, get_http_client
        import time

        target = "{{ inputs.target }}"
        callback_url = "{{ jobs.setup.outputs.callback_url }}"
        method = "{{ inputs.method }}"

        if not target.startswith("http"):
            target = f"http://{target}"

        probes = 0
        client = get_http_client(timeout=10)

        # Inject callback URL into common OOB vectors
        vectors = [
            f"{target}?url={callback_url}",
            f"{target}?redirect={callback_url}",
            f"{target}?callback={callback_url}",
            f"{target}?next={callback_url}",
        ]

        print(f"[*] Sending OOB probes to: {target}")
        print(f"    Callback: {callback_url}")
        for vector in vectors:
            try:
                resp = client.get(vector, follow_redirects=False)
                print(f"    [{resp.status_code}] {vector[:80]}")
                probes += 1
            except Exception as e:
                print(f"    [ERR] {vector[:60]} -> {e}")
                probes += 1
            time.sleep(0.5)

        # Also try POST with callback in body
        try:
            resp = client.post(target, content=f"url={callback_url}", headers={"Content-Type": "application/x-www-form-urlencoded"})
            print(f"    [{resp.status_code}] POST body injection")
            probes += 1
        except Exception as e:
            print(f"    [ERR] POST -> {e}")
            probes += 1

        print(f"\n[+] Sent {probes} probes")
        print("[*] Waiting 10s for callbacks to register...")
        time.sleep(10)

        with open("{{ env.OFX_OUTPUTS }}", "a") as f:
            f.write(f"probes_sent={probes}\n")

  poll:
    name: Poll for Interactions
    needs: [setup, probe]
    steps:
    - name: check-interactions
      timeout: 3
      continue-on-error: true
      script: |
        from ofx.api.oob import Interactsh

        callback_flag = "{{ jobs.setup.outputs.callback_flag }}"

        print("[*] Verifying OOB interactions...")

        client = Interactsh()
        client.register()

        found, results = client.verify(callback_flag, get_result=True)

        if found:
            print(f"[+] OOB INTERACTION DETECTED!")
            print(f"    Interactions: {len(results)}")
            for i, r in enumerate(results[:10]):
                print(f"\n    --- Interaction {i+1} ---")
                if isinstance(r, dict):
                    for k, v in r.items():
                        val = str(v)[:100]
                        print(f"      {k}: {val}")
                else:
                    print(f"      {str(r)[:200]}")
        else:
            print("[-] No OOB interactions detected")
            print("    The target may not be vulnerable to OOB attacks")
            print("    or the callback was blocked by network controls")

        print(f"\n[*] Target: {{ inputs.target }}")
        print(f"[*] Method: {{ inputs.method }}")
        print(f"[*] Probes sent: {{ jobs.probe.outputs.probes_sent }}")
      log-stdout: true
