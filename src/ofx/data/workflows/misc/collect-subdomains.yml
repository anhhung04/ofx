name: collect-subdomains
description: Collect and deduplicate subdomains from typed output data (JSON list).
tags: [utility, subdomains, collect]
call:
  inputs:
    typed_outputs:
      type: string
      required: true
      description: JSON string of typed_outputs list
    root_domain:
      type: string
      default: ''
      description: Filter subdomains belonging to this root domain
  outputs:
    subs_file: Deduplicated subdomains file path
    subdomain_count: Number of unique subdomains
jobs:
  collect:
    name: Collect Subdomains
    steps:
    - name: dedup-subdomains
      script: |
        import json
        from pathlib import Path

        typed = json.loads('''{{ inputs.typed_outputs }}''')
        root = '{{ inputs.root_domain }}'

        subs = set()
        for item in typed:
            t = item.get('_type', '')
            if t == 'subdomain':
                host = item.get('host', '')
                if host:
                    if root and root not in host:
                        continue
                    subs.add(host)
            elif t == 'url':
                host = item.get('host', '')
                if host:
                    if root and root not in host:
                        continue
                    subs.add(host)

        out_path = '/tmp/ofx_collected_subs.txt'
        Path(out_path).write_text('\n'.join(sorted(subs)) + '\n')

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"subs_file={out_path}\n")
            f.write(f"subdomain_count={len(subs)}\n")

        print(f"Collected {len(subs)} unique subdomains")
      log-stdout: true
