name: parse-targets
description: Parse, deduplicate, and validate targets from a file or input string. Expands CIDRs to individual IPs when enabled.
tags: [utility, targets, parse]
call:
  inputs:
    targets:
      type: string
      required: true
      description: Newline-separated targets or path to a targets file
    expand_cidrs:
      type: string
      default: 'false'
      description: Expand CIDR ranges to individual IPs
  outputs:
    targets_file: Cleaned targets file path
    target_count: Number of unique targets
jobs:
  parse:
    name: Parse Targets
    steps:
    - name: parse-and-dedup
      script: |
        import ipaddress
        import re
        from pathlib import Path

        raw = '''{{ inputs.targets }}'''
        expand = '{{ inputs.expand_cidrs }}' == 'true'

        # Read from file if path exists
        if Path(raw).is_file():
            raw = Path(raw).read_text()

        targets = set()
        for line in raw.splitlines():
            entry = line.strip()
            if not entry or entry.startswith('#'):
                continue
            if expand and '/' in entry:
                try:
                    net = ipaddress.ip_network(entry, strict=False)
                    for ip in net.hosts():
                        targets.add(str(ip))
                    continue
                except ValueError:
                    pass
            targets.add(entry)

        sorted_targets = sorted(targets)
        out_path = '/tmp/ofx_parsed_targets.txt'
        Path(out_path).write_text('\n'.join(sorted_targets) + '\n')

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"targets_file={out_path}\n")
            f.write(f"target_count={len(sorted_targets)}\n")

        print(f"Parsed {len(sorted_targets)} unique targets")
      log-stdout: true
