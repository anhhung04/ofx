name: export-results
description: Export typed outputs to project directories (hosts, subdomains, web, vulns, etc).
tags: [utility, export, project]
call:
  inputs:
    typed_outputs:
      type: string
      required: true
      description: JSON string of typed_outputs list to export
    project_path:
      type: string
      required: true
      description: Project root path
    prefix:
      type: string
      default: ''
      description: Optional filename prefix for exported files
  outputs:
    exported_count: Number of exported result types
jobs:
  export:
    name: Export Results
    steps:
    - name: export-typed
      script: |
        import json
        from pathlib import Path
        from ofx.runner.findings_export import export_typed_outputs

        typed = json.loads('''{{ inputs.typed_outputs }}''')
        project = '{{ inputs.project_path }}'
        prefix = '{{ inputs.prefix }}'

        if not project or not Path(project).is_dir():
            print('No valid project path, skipping export')
            add_outputs(exported_count="0")
        else:
            summaries = export_typed_outputs(project, typed, prefix=prefix)
            for s in summaries:
                print(s)
            add_outputs(exported_count=len(summaries))
            print(f"Exported {len(summaries)} result types to {project}")
