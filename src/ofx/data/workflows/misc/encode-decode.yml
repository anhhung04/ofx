name: encode-decode
description: |
  Multi-format encoder/decoder — Base64, hex, URL, HTML, ROT13, binary,
  and XOR. Supports chaining operations. CyberChef-style data transformation.
tags: [utility, encoding, decoding, cyberchef]
dispatch:
  inputs:
    data:
      required: true
      type: string
      description: Input data to encode/decode
    operation:
      type: string
      default: base64-encode
      description: |
        Operation to perform: base64-encode, base64-decode, hex-encode, hex-decode,
        url-encode, url-decode, html-encode, html-decode, rot13, xor, binary-encode,
        binary-decode, all-decode (try all decodings)
    key:
      type: string
      default: ''
      description: Key for XOR operation (hex string)

jobs:
  transform:
    name: Data Transformation
    outputs:
      result: '{{ steps["encode-decode"].outputs.result | default("", true) }}'
      operation: '{{ steps["encode-decode"].outputs.operation | default("", true) }}'
    steps:
    - name: encode-decode
      script: |
        import base64
        import binascii
        import html
        import urllib.parse

        data = '''{{ inputs.data }}'''
        operation = '{{ inputs.operation }}'
        key = '{{ inputs.key }}'

        def xor_data(data_bytes, key_hex):
            key_bytes = bytes.fromhex(key_hex)
            return bytes([b ^ key_bytes[i % len(key_bytes)] for i, b in enumerate(data_bytes)])

        def rot13(text):
            result = []
            for c in text:
                if 'a' <= c <= 'z':
                    result.append(chr((ord(c) - ord('a') + 13) % 26 + ord('a')))
                elif 'A' <= c <= 'Z':
                    result.append(chr((ord(c) - ord('A') + 13) % 26 + ord('A')))
                else:
                    result.append(c)
            return ''.join(result)

        def try_all_decode(data):
            results = {}
            try:
                results['base64'] = base64.b64decode(data).decode('utf-8', errors='replace')
            except Exception:
                results['base64'] = '[failed]'
            try:
                results['hex'] = bytes.fromhex(data).decode('utf-8', errors='replace')
            except Exception:
                results['hex'] = '[failed]'
            try:
                results['url'] = urllib.parse.unquote(data)
            except Exception:
                results['url'] = '[failed]'
            try:
                results['html'] = html.unescape(data)
            except Exception:
                results['html'] = '[failed]'
            results['rot13'] = rot13(data)
            return results

        output = ''
        if operation == 'base64-encode':
            output = base64.b64encode(data.encode()).decode()
        elif operation == 'base64-decode':
            output = base64.b64decode(data).decode('utf-8', errors='replace')
        elif operation == 'hex-encode':
            output = data.encode().hex()
        elif operation == 'hex-decode':
            output = bytes.fromhex(data).decode('utf-8', errors='replace')
        elif operation == 'url-encode':
            output = urllib.parse.quote(data, safe='')
        elif operation == 'url-decode':
            output = urllib.parse.unquote(data)
        elif operation == 'html-encode':
            output = html.escape(data)
        elif operation == 'html-decode':
            output = html.unescape(data)
        elif operation == 'rot13':
            output = rot13(data)
        elif operation == 'binary-encode':
            output = ' '.join(format(b, '08b') for b in data.encode())
        elif operation == 'binary-decode':
            bits = data.replace(' ', '')
            output = ''.join(chr(int(bits[i:i+8], 2)) for i in range(0, len(bits), 8))
        elif operation == 'xor':
            if not key:
                print("[-] XOR requires --input key=<hex>")
                raise SystemExit(1)
            result = xor_data(data.encode(), key)
            output = result.hex()
        elif operation == 'all-decode':
            results = try_all_decode(data)
            lines = []
            for method, result in results.items():
                lines.append(f"[{method}] {result}")
            output = '\n'.join(lines)
        else:
            print(f"[-] Unknown operation: {operation}")
            raise SystemExit(1)

        add_outputs(result=output, operation=operation)
        print(f"=== {operation.upper()} ===")
        print(output)
      log-stdout: true
