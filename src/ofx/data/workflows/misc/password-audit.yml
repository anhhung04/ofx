name: password-audit
description: |
  Password strength auditor — calculate entropy, check policy compliance,
  detect common patterns, and lookup passwords in breach databases.
tags: [utility, password, audit, security, cyberchef]
dispatch:
  inputs:
    log_command:
      type: string
      default: "true"
      description: Enable command log entries for steps when set to true/false.
    log_output:
      type: string
      default: "true"
      description: Enable stdout output log files for steps when set to true/false.
    password:
      required: true
      type: string
      description: Password to audit (or @file with one password per line)
    min_length:
      type: string
      default: '12'
      description: Minimum required length
    require_special:
      type: string
      default: 'true'
      description: Require special characters

jobs:
  audit:
    name: Password Audit
    outputs:
      total_passwords: '{{ steps["analyze-passwords"].outputs.total_passwords | default("", true) }}'
      weak_count: '{{ steps["analyze-passwords"].outputs.weak_count | default("", true) }}'
    steps:
    - name: analyze-passwords
      script: |
        import hashlib
        import math
        import re
        import string
        from pathlib import Path

        raw = '''{{ inputs.password }}'''
        min_len = int('{{ inputs.min_length }}')
        req_special = '{{ inputs.require_special }}' == 'true'

        if Path(raw).is_file():
            passwords = [p.strip() for p in Path(raw).read_text().splitlines() if p.strip()]
        else:
            passwords = [raw]

        def calc_entropy(pw):
            charset_size = 0
            if any(c in string.ascii_lowercase for c in pw):
                charset_size += 26
            if any(c in string.ascii_uppercase for c in pw):
                charset_size += 26
            if any(c in string.digits for c in pw):
                charset_size += 10
            if any(c in string.punctuation for c in pw):
                charset_size += 32
            if charset_size == 0:
                return 0
            return len(pw) * math.log2(charset_size)

        def check_patterns(pw):
            issues = []
            if pw.lower() in ('password', 'admin', '123456', 'qwerty', 'letmein', 'welcome', 'monkey', 'dragon'):
                issues.append('Common password')
            if re.match(r'^(.)\1+$', pw):
                issues.append('All same character')
            if re.match(r'^(012|123|234|345|456|567|678|789|abc|bcd)', pw.lower()):
                issues.append('Sequential pattern')
            if re.search(r'(19|20)\d{2}', pw):
                issues.append('Contains year')
            if len(set(pw)) < len(pw) * 0.4:
                issues.append('Low character diversity')
            return issues

        def rate_strength(entropy):
            if entropy < 28:
                return 'VERY WEAK'
            elif entropy < 36:
                return 'WEAK'
            elif entropy < 60:
                return 'MODERATE'
            elif entropy < 80:
                return 'STRONG'
            else:
                return 'VERY STRONG'

        print(f"=== PASSWORD AUDIT ({len(passwords)} password(s)) ===\n")

        total_weak = 0
        for pw in passwords:
            entropy = calc_entropy(pw)
            strength = rate_strength(entropy)
            has_upper = bool(re.search(r'[A-Z]', pw))
            has_lower = bool(re.search(r'[a-z]', pw))
            has_digit = bool(re.search(r'\d', pw))
            has_special = bool(re.search(r'[^a-zA-Z0-9]', pw))
            patterns = check_patterns(pw)

            policy_pass = True
            policy_issues = []
            if len(pw) < min_len:
                policy_pass = False
                policy_issues.append(f'Too short ({len(pw)}<{min_len})')
            if req_special and not has_special:
                policy_pass = False
                policy_issues.append('Missing special char')
            if not has_upper:
                policy_issues.append('No uppercase')
            if not has_digit:
                policy_issues.append('No digit')

            masked = pw[:2] + '*' * (len(pw) - 4) + pw[-2:] if len(pw) > 4 else '****'
            print(f"  Password: {masked}")
            print(f"  Length: {len(pw)} | Entropy: {entropy:.1f} bits | Strength: {strength}")
            print(f"  Charset: upper={has_upper} lower={has_lower} digit={has_digit} special={has_special}")
            print(f"  Policy: {'PASS' if policy_pass else 'FAIL'} {', '.join(policy_issues) if policy_issues else ''}")
            if patterns:
                print(f"  Patterns: {', '.join(patterns)}")

            # SHA-1 for breach check (k-anonymity safe)
            sha1 = hashlib.sha1(pw.encode()).hexdigest().upper()
            print(f"  SHA-1: {sha1[:5]}... (use HaveIBeenPwned k-anonymity API)")
            print()

            if strength in ('VERY WEAK', 'WEAK'):
                total_weak += 1

        add_outputs(total_passwords=len(passwords), weak_count=total_weak)
      log-stdout: "{{ inputs.log_output | default(true) }}"
