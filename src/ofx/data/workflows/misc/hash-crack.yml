name: hash-crack
description: |
  Hash identification and cracking pipeline — identify hash types using
  hashid/name-that-hash, then attempt offline cracking with wordlists.
tags: [utility, hash, crack, password, cyberchef]
dispatch:
  inputs:
    hash:
      required: true
      type: string
      description: Hash value or path to file with hashes (one per line)
    wordlist:
      type: string
      default: /usr/share/wordlists/rockyou.txt
      description: Wordlist path for cracking
    rules:
      type: string
      default: ''
      description: 'Hashcat rules file (e.g. /usr/share/hashcat/rules/best64.rule)'

jobs:
  identify:
    name: Hash Identification
    outputs:
      hash_count: '{{ steps["identify-hash"].outputs.hash_count | default("", true) }}'
      hash_file: '{{ steps["identify-hash"].outputs.hash_file | default("", true) }}'
      identified_types: '{{ steps["identify-hash"].outputs.identified_types | default("", true) }}'
      results: '{{ steps["identify-hash"].outputs.results | default("", true) }}'
    steps:
    - name: identify-hash
      log-command: true
      script: |
        import subprocess
        import json
        from pathlib import Path

        hash_input = '''{{ inputs.hash }}'''

        # Check if it's a file
        if Path(hash_input).is_file():
            hashes = [h.strip() for h in Path(hash_input).read_text().splitlines() if h.strip()]
        else:
            hashes = [hash_input]

        print(f"[+] Analyzing {len(hashes)} hash(es)")
        print()

        results = []
        for h in hashes[:20]:
            info = {'hash': h, 'length': len(h), 'types': []}

            # hashid
            try:
                proc = subprocess.run(['hashid', h], capture_output=True, text=True, timeout=10)
                for line in proc.stdout.splitlines():
                    line = line.strip()
                    if line.startswith('[+]'):
                        info['types'].append(line.replace('[+] ', ''))
            except Exception:
                pass

            # name-that-hash fallback
            if not info['types']:
                try:
                    proc = subprocess.run(['nth', '--text', h, '--no-banner'], capture_output=True, text=True, timeout=10)
                    for line in proc.stdout.splitlines():
                        line = line.strip()
                        if line and not line.startswith('Most Likely'):
                            info['types'].append(line)
                except Exception:
                    pass

            # Heuristic fallback
            if not info['types']:
                length = len(h)
                if length == 32 and all(c in '0123456789abcdef' for c in h.lower()):
                    info['types'] = ['MD5', 'NTLM']
                elif length == 40:
                    info['types'] = ['SHA-1']
                elif length == 64:
                    info['types'] = ['SHA-256']
                elif length == 128:
                    info['types'] = ['SHA-512']
                elif h.startswith('$2'):
                    info['types'] = ['bcrypt']
                elif h.startswith('$6$'):
                    info['types'] = ['SHA-512 crypt']
                elif h.startswith('$1$'):
                    info['types'] = ['MD5 crypt']

            results.append(info)
            print(f"  {h[:40]}{'...' if len(h)>40 else ''}")
            print(f"    Length: {info['length']}")
            print(f"    Types: {', '.join(info['types'][:5]) or 'Unknown'}")
            print()

        hash_file = f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_hashes.txt'
        Path(hash_file).write_text('\n'.join(hashes) + '\n')

        add_outputs(hash_count=len(hashes), hash_file=hash_file, identified_types=results[0]['types'][0] if results and results[0]['types'] else 'unknown', results=json.dumps(results))
  crack:
    name: Crack Hashes
    needs: [identify]
    outputs:
      cracked_count: '{{ steps["collect-results"].outputs.cracked_count | default("", true) }}'
    steps:
    - name: try-john
      run: |
        echo "[+] Attempting crack with john..."
        HASH_FILE="{{ jobs['identify'].outputs.hash_file }}"
        WORDLIST="{{ inputs.wordlist }}"
        if [ -f "$WORDLIST" ]; then
          john --wordlist="$WORDLIST" "$HASH_FILE" 2>/dev/null || true
          echo ""
          echo "=== CRACKED ==="
          john --show "$HASH_FILE" 2>/dev/null || true
        else
          echo "[-] Wordlist not found: $WORDLIST"
        fi
      log-stdout: true
      log-command: true
      continue-on-error: true
    - name: try-hashcat
      run: |
        echo "[+] Attempting crack with hashcat..."
        HASH_FILE="{{ jobs['identify'].outputs.hash_file }}"
        WORDLIST="{{ inputs.wordlist }}"
        RULES="{{ inputs.rules }}"
        if command -v hashcat &>/dev/null && [ -f "$WORDLIST" ]; then
          ARGS="-a 0 --potfile-path ${OFX_RUN_DIR:-/tmp}/ofx_hashcat.pot -o ${OFX_RUN_DIR:-/tmp}/ofx_cracked.txt"
          if [ -n "$RULES" ] && [ -f "$RULES" ]; then
            ARGS="$ARGS -r $RULES"
          fi
          hashcat $ARGS "$HASH_FILE" "$WORDLIST" 2>/dev/null || true
          echo ""
          if [ -f ${OFX_RUN_DIR:-/tmp}/ofx_cracked.txt ]; then
            echo "=== CRACKED ==="
            cat ${OFX_RUN_DIR:-/tmp}/ofx_cracked.txt
          fi
        else
          echo "[-] hashcat not available or wordlist missing"
        fi
      log-stdout: true
      log-command: true
      continue-on-error: true
    - name: collect-results
      log-command: true
      script: |
        import subprocess
        from pathlib import Path

        cracked = []

        # From john
        try:
            proc = subprocess.run(
                ['john', '--show', '{{ jobs["identify"].outputs.hash_file }}'],
                capture_output=True, text=True, timeout=10
            )
            for line in proc.stdout.splitlines():
                if ':' in line and 'password hashes cracked' not in line:
                    cracked.append(line.strip())
        except Exception:
            pass

        # From hashcat potfile
        pot = Path(f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_cracked.txt')
        if pot.is_file():
            for line in pot.read_text().splitlines():
                if line.strip():
                    cracked.append(line.strip())

        add_outputs(cracked_count=len(cracked))
        print(f"\n[+] Total cracked: {len(cracked)}")
        for c in cracked:
            print(f"    {c}")
