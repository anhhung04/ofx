name: diff-hosts
description: |
  Compare two scan results (host lists, port scans) to find new, removed,
  and unchanged entries. Useful for periodic change detection.
tags: [utility, diff, compare, monitoring]
dispatch:
  inputs:
    baseline:
      required: true
      type: string
      description: Path to baseline file (older scan)
    current:
      required: true
      type: string
      description: Path to current file (newer scan)
    label:
      type: string
      default: scan
      description: Label for the comparison (e.g. hosts, ports, urls)

jobs:
  compare:
    name: Diff Comparison
    outputs:
      new_count: '{{ steps["compute-diff"].outputs.new_count | default("", true) }}'
      removed_count: '{{ steps["compute-diff"].outputs.removed_count | default("", true) }}'
      unchanged_count: '{{ steps["compute-diff"].outputs.unchanged_count | default("", true) }}'
      new_file: '{{ steps["compute-diff"].outputs.new_file | default("", true) }}'
      removed_file: '{{ steps["compute-diff"].outputs.removed_file | default("", true) }}'
      baseline_count: '{{ steps["compute-diff"].outputs.baseline_count | default("", true) }}'
      current_count: '{{ steps["compute-diff"].outputs.current_count | default("", true) }}'
    steps:
    - name: compute-diff
      script: |
        from pathlib import Path

        baseline_path = '{{ inputs.baseline }}'
        current_path = '{{ inputs.current }}'
        label = '{{ inputs.label }}'

        baseline = set(
            line.strip() for line in Path(baseline_path).read_text().splitlines()
            if line.strip() and not line.strip().startswith('#')
        )
        current = set(
            line.strip() for line in Path(current_path).read_text().splitlines()
            if line.strip() and not line.strip().startswith('#')
        )

        new_items = sorted(current - baseline)
        removed_items = sorted(baseline - current)
        unchanged = sorted(baseline & current)

        print(f"=== DIFF: {label.upper()} ===")
        print(f"  Baseline: {len(baseline)} entries")
        print(f"  Current:  {len(current)} entries")
        print()

        print(f"--- NEW (+{len(new_items)}) ---")
        for item in new_items:
            print(f"  + {item}")

        print(f"\n--- REMOVED (-{len(removed_items)}) ---")
        for item in removed_items:
            print(f"  - {item}")

        print(f"\n--- UNCHANGED ({len(unchanged)}) ---")
        print(f"  {len(unchanged)} entries unchanged")

        # Write diff files
        Path('/tmp/ofx_diff_new.txt').write_text('\n'.join(new_items) + '\n')
        Path('/tmp/ofx_diff_removed.txt').write_text('\n'.join(removed_items) + '\n')

        add_outputs(new_count=len(new_items), removed_count=len(removed_items), unchanged_count=len(unchanged), new_file="/tmp/ofx_diff_new.txt", removed_file="/tmp/ofx_diff_removed.txt", baseline_count=len(baseline), current_count=len(current))
      log-stdout: true
