name: collect-urls
description: Collect and deduplicate URLs from typed output data. Optionally filter by alive status.
tags: [utility, urls, collect]
call:
  inputs:
    typed_outputs:
      type: string
      required: true
      description: JSON string of typed_outputs list
    alive_only:
      type: string
      default: 'false'
      description: Only include URLs with status_code > 0
  outputs:
    urls_file: Deduplicated URLs file path
    url_count: Number of unique URLs
jobs:
  collect:
    name: Collect URLs
    steps:
    - name: dedup-urls
      script: |
        import json
        from pathlib import Path

        typed = json.loads('''{{ inputs.typed_outputs }}''')
        alive_only = '{{ inputs.alive_only }}' == 'true'

        urls = set()
        for item in typed:
            if item.get('_type') != 'url':
                continue
            url = item.get('url', '')
            if not url:
                continue
            if alive_only and item.get('status_code', 0) <= 0:
                continue
            urls.add(url)

        out_path = f'{os.environ.get("OFX_RUN_DIR", "/tmp")}/ofx_collected_urls.txt'
        Path(out_path).write_text('\n'.join(sorted(urls)) + '\n')

        add_outputs(urls_file=out_path, url_count=len(urls))
        print(f"Collected {len(urls)} unique URLs")
