[project]
name = "ofx"
version = "0.4.0"
description = "Offensive Flow Executor tool for handing over to the next generation of red teamers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiofiles>=23.2.1",
  "cryptography>=43.0.0",
  "filelock>=3.18.0",
  "gitpython>=3.1.45",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "pydantic-settings>=2.10.1",
  "pydantic>=2.11.7",
  "pykeepass>=4.1.1.post1",
  "pyyaml>=6.0.2",
  "requests>=2.32.4",
  "rich>=13.0.0",
  "tabulate>=0.9.0",
  "typer>=0.16.0",
]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
  "pytest-asyncio",
  "faker>=34.0.0",
]
docs = [
  "mkdocs>=1.5.0",
  "mkdocs-material>=9.5.0",
  "pymdown-extensions>=10.7.0",

]
redis = [
  "redis>=5.0.0",
]
memcached = [
  "aiomcache>=0.8.2",
]
etcd = [
  "etcd3>=0.12.0",
]
interactsh = [
  "pycryptodomex>=3.21.0",
]

[project.scripts]
ofx = "ofx:main"

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.6.0",
    "mypy>=1.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]

[tool.pytest.ini_options]
markers = [
    "asyncio: mark test as async (deselect with '-m \"not asyncio\"')",
]
asyncio_mode = "auto"
addopts = "-v"
filterwarnings = [
  "ignore:This process .* is multi-threaded, use of fork\\(\\) may lead to deadlocks in the child\\.:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/ofx"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
