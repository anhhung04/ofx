[project]
name = "ofx"
version = "0.10.7"
description = "Offensive Flow Executor — red team automation toolkit for composing complex attack chains with YAML workflows"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "OFX Contributors" },
]
keywords = [
    "red-team",
    "offensive-security",
    "penetration-testing",
    "workflow-automation",
    "post-exploitation",
    "reconnaissance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Typing :: Typed",
]

dependencies = [
  "aiofiles>=23.2.1,<25",
  "cryptography>=46.0.7,<48",
  "filelock>=3.18.0,<4",
  "gitpython>=3.1.45,<4",
  "httpx>=0.28.1,<1",
  "jinja2>=3.1.6,<4",
  "paramiko>=4.0.0,<5",
  "pydantic-settings>=2.10.1,<3",
  "pydantic>=2.11.7,<3",
  "pykeepass>=4.1.1.post1,<5",
  "pyyaml>=6.0.2,<7",
  "requests>=2.33.0,<3",
  "rich>=13.0.0,<15",
  "tabulate>=0.9.0,<1",
  "typer>=0.16.0,<1",
]

[project.urls]
Homepage = "https://github.com/anhhung04/ofx"
Documentation = "https://anhhung04.github.io/ofx-docs/"
Repository = "https://github.com/anhhung04/ofx"
Issues = "https://github.com/anhhung04/ofx/issues"

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
  "pytest-asyncio",
  "faker>=34.0.0",
  "hypothesis>=6.100.0",
]
docs = [
  "mkdocs>=1.5.0",
  "mkdocs-git-revision-date-localized-plugin>=1.5.1",
  "mkdocs-material>=9.5.0",
  "mkdocs-minify-plugin>=0.8.0",
  "pymdown-extensions>=10.7.0",
]
redis = [
  "redis>=5.0.0",
]
memcached = [
  "aiomcache>=0.8.2",
]
etcd = [
  "etcd3>=0.12.0",
]
interactsh = [
  "pycryptodomex>=3.21.0",
]
digitalocean = [
  "pydo>=0.3.0",
]
aws = [
  "boto3>=1.35.0",
]
cloud = [
  "pydo>=0.3.0",
  "boto3>=1.35.0",
]
winrm = [
  "pywinrm>=0.4.3",
]
ssh = [
  "paramiko>=4.0.0",
]
ai = [
  "openai>=1.0.0",
]
compile = [
  "cython>=3.0.0",
  "setuptools>=69.0.0",
]
all = [
  "ofx[test,docs,redis,memcached,etcd,interactsh,digitalocean,aws,cloud,winrm,ssh,ai,compile]",
]

[project.scripts]
ofx = "ofx:main"

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.6.0",
    "mypy>=1.8.0",
    "types-pyyaml>=6.0.12.20260408",
    "types-requests>=2.33.0.20260408",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]

[tool.pytest.ini_options]
markers = [
    "asyncio: mark test as async (deselect with '-m \"not asyncio\"')",
]
asyncio_mode = "auto"
addopts = "-v"
filterwarnings = [
  "ignore:This process .* is multi-threaded, use of fork\\(\\) may lead to deadlocks in the child\\.:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/ofx"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
