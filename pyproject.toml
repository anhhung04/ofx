[project]
name = "ofx"
dynamic = ["version"]
description = "Offensive Flow Executor tool for handing over to the next generation of red teamers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=23.2.1",
    "async-typer>=0.1.9",
    "asyncstdlib>=3.13.1",
    "boto3>=1.41.5",
    "cryptography>=43.0.0",
    "cython>=3.0.0",
    "faker>=34.0.0",
    "filelock>=3.18.0",
    "gitpython>=3.1.45",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "psutil>=7.2.1",
    "pycryptodomex>=3.21.0",
    "pydantic-file-secrets>=0.4.4",
    "pydantic-settings>=2.10.1",
    "pydantic>=2.11.7",
    "python-nmap>=0.0.1",
    "pyyaml>=6.0.2",
    "requests>=2.32.4",
    "rich>=13.0.0",
    "syncer>=2.0.3",
    "tabulate>=0.9.0",
    "toml>=0.10.2",
    "typer>=0.16.0",
    "webdavclient3>=3.14.6",
]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
  "pytest-asyncio",
]
docs = [
  "mkdocs>=1.5.0",
  "mkdocs-material>=9.5.0",
  "pymdown-extensions>=10.7.0",
]

[project.scripts]
ofx = "ofx:main"

[build-system]
requires = ["setuptools>=61.0.0", "cython>=0.29"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.6.0",
    "mypy>=1.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]
