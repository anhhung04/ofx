[project]
name = "ofx"
dynamic = ["version"]
description = "Offensive Flow Executor tool for handing over to the next generation of red teamers"
readme = "README.md"
authors = [
    { name = "anhhung04", email = "dev.hah4@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "async-typer>=0.1.9",
    "asyncstdlib>=3.13.1",
    "filelock>=3.18.0",
    "gitpython>=3.1.45",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "notifiers>=1.3.6",
    "pydantic>=2.11.7",
    "pydantic-file-secrets>=0.4.4",
    "pydantic-settings>=2.10.1",
    "pyyaml>=6.0.2",
    "requests>=2.32.4",
    "syncer>=2.0.3",
    "tabulate>=0.9.0",
    "typer>=0.16.0",
]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
  "pytest-asyncio",
]
build = ["setuptools", "cython"]
compile = ["cchardet"]

[project.scripts]
ofx = "ofx:main"

[build-system]
requires = [ "cython", "setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
no-build-isolation-package = ["cchardet"]
package = true
compile-bytecode = true
