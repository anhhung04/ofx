name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.3.1)'
        required: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - type: pure
            platform: ""
            python: "3.12"
          - type: compiled
            platform: linux/amd64
            python: "3.12"
          - type: compiled
            platform: linux/amd64
            python: "3.13"
          - type: compiled
            platform: linux/amd64
            python: "3.14"
          - type: compiled
            platform: linux/arm64
            python: "3.12"
          - type: compiled
            platform: linux/arm64
            python: "3.13"
          - type: compiled
            platform: linux/arm64
            python: "3.14"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        if: matrix.type == 'pure'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        if: matrix.type == 'pure'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build pure wheel + sdist
        if: matrix.type == 'pure'
        run: uv build --out-dir dist

      - name: Set up QEMU (for ARM64)
        if: matrix.type == 'compiled' && matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: matrix.type == 'compiled'
        uses: docker/setup-buildx-action@v3

      - name: Build compiled wheel
        if: matrix.type == 'compiled'
        run: |
          docker buildx build \
            -f Dockerfile.compile \
            --build-arg PYTHON_VERSION=${{ matrix.python }} \
            --platform ${{ matrix.platform }} \
            --target=export \
            --output type=local,dest=dist \
            .

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.type }}-py${{ matrix.python }}-${{ matrix.platform == 'linux/arm64' && 'arm64' || matrix.platform == 'linux/amd64' && 'amd64' || 'pure' }}
          path: dist/*.whl

  release:
    needs: [build-wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -name "*.whl" \
            -exec cp {} release/ \;
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
