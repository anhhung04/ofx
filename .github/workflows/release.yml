name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build-pure:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and source archive
        run: uv build --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: pure-packages
          path: dist/*

  release:
    needs: [build-pure]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums and install links
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum *.whl *.tar.gz > SHA256SUMS.txt
          version="${TAG#v}"
          base="https://github.com/${REPOSITORY}/releases/download/${TAG}"
          cat > RELEASE.md <<EOF
          ## Install

          Universal wheel:

          \`pip install ${base}/ofx-${version}-py3-none-any.whl\`

          Source archive:

          \`pip install ${base}/ofx-${version}.tar.gz\`

          ## Assets
          EOF
          for file in *.whl *.tar.gz SHA256SUMS.txt; do
            printf -- '- [%s](%s/%s)\n' "$file" "$base" "$file" >> RELEASE.md
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release/RELEASE.md
          files: |
            release/*.whl
            release/*.tar.gz
            release/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
