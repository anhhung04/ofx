name: Build and Publish Package

on:
  push:
    tags:
      - "v*" # Trigger on version tags like v1.0.0
  workflow_dispatch: # Allow manual trigger

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: https://github.com/astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build package
        run: |
          uv build --wheel --out-dir dist
        env:
          UV_COMPILE_BYTECODE: "1"

      - name: Install twine for publishing
        run: |
          uv tool install twine

      - name: Regenerate docs
        run: |
          uv run --extra docs mkdocs build -d src/ofx/data/site

      - name: Publish to Gitea Package Registry
        env:
          TWINE_USERNAME: ${{ secrets.PKG_USER }}
          TWINE_PASSWORD: ${{ secrets.PKG_TOKEN }}
        run: |
          uvx twine upload \
            --repository-url ${{ secrets.PKG_URL }} \
            --verbose \
            dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: python-package
          path: dist/
