name: Build and Publish Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build-compiled:
    runs-on: ubuntu-latest
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        arch: [amd64, arm64]
        python: ["3.12", "3.13", "3.14"]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (for ARM64 emulation)
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build compiled wheel
        run: |
          docker buildx build \
            -f Dockerfile.compile \
            --build-arg PYTHON_VERSION=${{ matrix.python }} \
            --platform linux/${{ matrix.arch }} \
            --target=export \
            --output type=local,dest=dist \
            .

      - name: List built wheels
        run: ls -la dist/

      - name: Upload compiled wheel
        uses: actions/upload-artifact@v4
        with:
          name: compiled-wheel-py${{ matrix.python }}-${{ matrix.arch }}
          path: dist/*.whl

  build-pure:
    runs-on: ubuntu-latest
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build pure wheel + sdist
        run: uv build --out-dir dist

      - name: Upload pure wheel
        uses: actions/upload-artifact@v4
        with:
          name: pure-wheel
          path: dist/*

  publish:
    runs-on: ubuntu-latest
    needs: [build-compiled, build-pure]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect all packages
        run: |
          mkdir -p dist
          find artifacts -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec cp {} dist/ \;
          echo "Packages to publish:"
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
